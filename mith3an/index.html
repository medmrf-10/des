<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِذعَن — التسليم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.it{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 15px;margin-top:8px}
.it .w{font-family:var(--font-ar);font-size:13.5px}
.it.free{opacity:.5;border-style:dashed}
.it .wh{font-size:11px;color:var(--dim);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:16px;text-align:center;margin-top:11px;font-family:var(--font-ar);font-size:14px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِذعَن <span class="muted">— التسليم</span></h2>
<div class="muted">ما لا تملك تغييره يشغلك بلا ثمن — اكتبه، سلّمه، تحرّر منه.</div>
<div class="card"><div class="t">ما يقلقك ولا تملكه</div>
<input id="w" placeholder="ما يشغلك؟ (مرض قريب، قرار مؤجل، مستقبل…)">
<button class="btn" id="ad" style="margin-top:9px">أودِعه</button></div>
<div id="banner"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let I=LS('mith3an',[]);
const PRAY=['اللهم اكفنيها بما شئت','لا حول ولا قوة إلا بالله','حسبي الله ونعم الوكيل','اللهم اختر لي ولا تخيّرني'];
$('#ad').onclick=()=>{
 const w=$('#w').value.trim();if(!w)return;
 I.unshift({w,at:Date.now(),st:'open'});SV('mith3an',I);$('#w').value='';render();
};
function render(){
 const open=I.filter(x=>x.st==='open').length,freed=I.filter(x=>x.st==='free').length;
 $('#banner').innerHTML=open===0&&I.length?'<div class="banner" style="color:var(--ok)">ذمّتك فارغة من القلق المعلّق — '+arN(freed)+' همٌّ مُسلَّم. 🕊️</div>':'';
 $('#stats').innerHTML='<span class="stat">معلّق: <b style="color:var(--acc2)">'+arN(open)+'</b></span>'+
 '<span class="stat">مُسلَّم: <b>'+arN(freed)+'</b></span>';
 $('#list').innerHTML=I.map((x,i)=>{
  const gi=I.indexOf(x);
  return '<div class="it'+(x.st==='free'?' free':'')+'"><div class="w">'+esc(x.w)+'</div>'+
  '<div class="wh">'+new Date(x.at).toLocaleDateString('ar-EG')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
  (x.st==='open'?PRAY.map((p,j)=>'<button class="btn ghost" data-f="'+gi+':'+j+'" style="color:var(--ok);font-size:10px">'+p+'</button>').join(''):'<span style="font-size:10.5px;color:var(--ok)">✓ مُسلَّم — '+esc(x.p||'')+'</span>')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2)">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا شيء معلّق — طهِّر قلبك.</div>';
}
$('#list').onclick=e=>{
 const f=e.target.closest('[data-f]'),d=e.target.closest('[data-d]');
 if(f){const[i,j]=f.dataset.f.split(':');I[+i].st='free';I[+i].p=PRAY[+j];SV('mith3an',I);render();return}
 if(d&&confirm('احذف؟')){I.splice(+d.dataset.d,1);SV('mith3an',I);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mith3an" data-title="مِذعَن"></script>
</body>
</html>
