<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحزَم — سلسلة العادات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.link{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.link .ord{width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.link .ord.done{background:var(--acc);color:#14140f;font-weight:700}
.link .nm{flex:1;font-family:var(--font-ar);font-size:13px}
.link .nm.done{text-decoration:line-through;opacity:.6}
.link .act{display:flex;gap:6px}
.chain-next{background:linear-gradient(135deg,var(--card),var(--card2));border:2px solid var(--acc);border-radius:14px;padding:16px;margin-top:12px;text-align:center}
.chain-next .nm{font-family:var(--font-ar);font-size:16px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحزَم <span class="muted">— سلسلة العادات</span></h2>
<div class="muted">اربط عاداتك في سلسلة: كل عادة تسحب التي بعدها. أنجزها بالترتيب اليوم.</div>
<div class="card"><div class="t">أضف حلقة</div>
<input id="nm" placeholder="بعد الفجر ← ورد، بعد الورد ← صفحة قراءة…">
<button class="btn" id="add" style="margin-top:9px">ألحق بالسلسلة</button></div>
<div id="next"></div>
<div id="stats"></div>
<div id="chain"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let C=LS('mihzam',{chain:[],day:{date:today(),done:{}}});
if(C.day.date!==today()){C.day={date:today(),done:{}};SV('mihzam',C)}
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 C.chain.push(n);SV('mihzam',C);$('#nm').value='';render();
};
const nxt=()=>C.chain.find((c,i)=>!C.day.done[i]);
const nxtIdx=()=>C.chain.findIndex((c,i)=>!C.day.done[i]);
function render(){
 const done=Object.keys(C.day.done).length;
 const nx=nxt(),ni=nxtIdx();
 $('#next').innerHTML=nx?'<div class="chain-next"><div class="muted" style="font-size:10px">الحلقة التالية</div><div class="nm">'+esc(nx)+'</div><button class="btn" id="don" style="margin-top:10px">أنجزتها — الحلقة التالية</button></div>':
 (C.chain.length?'<div class="chain-next" style="border-color:var(--ok)"><div class="nm" style="color:var(--ok)">🏅 السلسلة اكتملت اليوم!</div></div>':'');
 const dn=$('#don');if(dn)dn.onclick=()=>{C.day.done[ni]=true;SV('mihzam',C);render()};
 $('#stats').innerHTML='<span class="stat">حلقات: <b>'+arN(C.chain.length)+'</b></span>'+
 '<span class="stat">أنجزت اليوم: <b>'+arN(done)+'</b></span>';
 $('#chain').innerHTML=C.chain.map((c,i)=>{
  const d=C.day.done[i];
  return '<div class="link"><div class="ord'+(d?' done':'')+'">'+arN(i+1)+'</div>'+
  '<div class="nm'+(d?' done':'')+'">'+esc(c)+'</div>'+
  '<div class="act"><button class="btn ghost" data-u="'+i+'" style="padding:4px 8px">↑</button>'+
  '<button class="btn ghost" data-x="'+i+'" style="padding:4px 8px;color:var(--acc2)">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا حلقات — اصنع سلسلة صباحك.</div>';
}
$('#chain').onclick=e=>{
 const u=e.target.closest('[data-u]');
 if(u){const i=+u.dataset.u;if(i>0){[C.chain[i-1],C.chain[i]]=[C.chain[i],C.chain[i-1]];SV('mihzam',C);render()}return}
 const x=e.target.closest('[data-x]');
 if(x&&confirm('احذف الحلقة؟')){C.chain.splice(+x.dataset.x,1);SV('mihzam',C);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mihzam" data-title="مِحزَم"></script>
</body>
</html>
