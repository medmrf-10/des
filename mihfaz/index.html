<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مِحفَظ — متتبع حفظك</title>
<link rel="stylesheet" href="../shared/theme.css"><style>
body{max-width:700px;margin:0 auto;padding:22px 14px 60px}
h1{color:var(--acc);font-size:1.3rem;text-align:center}
.sub{color:var(--dim);font-size:.8rem;text-align:center;margin-bottom:14px}
.stats{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:.72rem;color:var(--dim);text-align:center}
.stat b{color:var(--acc);display:block;font-size:1rem}
.review{background:var(--card);border:1px solid #e07070;border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px;font-size:.8rem}
.review b{color:#e07070}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--border);border-radius:99px;color:var(--dim);font-family:inherit;font-size:.68rem;padding:5px 13px;cursor:pointer}
.filters button.on{color:var(--acc);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:8px}
.sr{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.sr .nm{font-size:.84rem;font-weight:700}
.sr .v{font-size:.6rem;color:var(--dim)}
.sr .btns{display:flex;gap:4px;margin-top:8px}
.sr .btns button{flex:1;border:1px solid var(--border);border-radius:6px;background:none;color:var(--dim);font-family:inherit;font-size:.56rem;padding:4px;cursor:pointer}
.sr .btns button.on{color:#0b0f1a;font-weight:700}
.sr .btns button.on[data-s="1"]{background:#e07070;border-color:#e07070}
.sr .btns button.on[data-s="2"]{background:var(--acc);border-color:var(--acc)}
.sr .btns button.on[data-s="3"]{background:var(--ok);border-color:var(--ok)}
.sr .lr{font-size:.56rem;color:var(--dim);margin-top:5px}
input.q{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-family:inherit;padding:10px;font-size:.84rem;margin-bottom:12px}
</style></head><body>
<h1>مِحفَظ</h1><div class="sub">حفظك للقرآن — سورة بسورة، وما يحتاج مراجعة اليوم</div>
<div class="stats"><div class="stat"><b id="c1">0</b>يحتاج مراجعة</div><div class="stat"><b id="c2">0</b>قيد الحفظ</div><div class="stat"><b id="c3">0</b>متقن</div><div class="stat"><b id="cp">0%</b>من المصحف</div></div>
<div class="review" id="rev" style="display:none"><b>راجع اليوم:</b> <span id="revl"></span></div>
<input class="q" id="q" placeholder="ابحث عن سورة…">
<div class="filters" id="fl">
<button class="on" data-f="all">الكل</button><button data-f="1">مراجعة</button><button data-f="2">قيد الحفظ</button><button data-f="3">متقن</button><button data-f="0">لم يبدأ</button>
</div>
<div class="grid" id="grid"></div>
<script src="surahs.js"></script>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='mihfaz_v1';const D=()=>JSON.parse(localStorage.getItem(K)||'{}');const S=o=>localStorage.setItem(K,JSON.stringify(o));
const T=window.SURAHS;
const ST={0:['لم يبدأ',''],1:['مراجعة','#e07070'],2:['قيد الحف��','#c9a24b'],3:['متقن','#46c96d']};
let f='all',qq='';
const days=ms=>Math.floor(ms/864e5);
function stats(){
 const d=D();let c={0:0,1:0,2:0,3:0};T.forEach(s=>{const r=d[s.n];c[r?r.s:0]++});
 $('c1').textContent=c[1];$('c2').textContent=c[2];$('c3').textContent=c[3];
 $('cp').textContent=Math.round((c[2]+c[3])/114*100)+'%';
 // review = status 1, or status 2/3 not reviewed in >7d
 const today=days(Date.now());
 const need=T.filter(s=>{const r=d[s.n];return r&&(r.s===1||(r.s>0&&today-days(r.l||0)>=7))});
 if(need.length){$('rev').style.display='block';$('revl').textContent=need.slice(0,6).map(s=>s.ar).join('، ')+(need.length>6?' +'+ (need.length-6):'')}
 else $('rev').style.display='none';
}
function render(){
 const d=D();
 $('grid').innerHTML=T.filter(s=>{
   const st=d[s.n]?d[s.n].s:0;
   return (f==='all'||st===+f)&&(!qq||s.ar.includes(qq));
 }).map(s=>{
   const r=d[s.n];const st=r?r.s:0;
   const lr=r&&r.l?`آخر مراجعة: ${days(Date.now())-days(r.l)}ي`:'';
   return `<div class="sr"><div class="nm">${esc(s.ar)}</div><div class="v">${s.v} آية</div>
    <div class="btns">${[1,2,3].map(x=>`<button data-s="${x}" data-n="${s.n}" class="${st===x?'on':''}">${ST[x][0]}</button>`).join('')}</div>
    <div class="lr">${lr}</div></div>`;
 }).join('')||'<div class="sub">لا نتائج</div>';
}
document.addEventListener('click',e=>{
 const fb=e.target.closest('#fl button');if(fb){f=fb.dataset.f;[...document.querySelectorAll('#fl button')].forEach(x=>x.classList.toggle('on',x===fb));render();return}
 const b=e.target.closest('.btns button');if(b){const d=D();const n=b.dataset.n;const cur=d[n]?d[n].s:0;
  if(cur===+b.dataset.s){delete d[n]}else{d[n]={s:+b.dataset.s,l:Date.now()}}
  S(d);stats();render();return}
});
$('q').addEventListener('input',e=>{qq=e.target.value.trim();render()});
stats();render();
</script></body></html>
