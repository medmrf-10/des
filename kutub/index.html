<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعجم الكتب — الببليوغرافيا الكاملة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:900px;margin:0 auto;padding:14px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:11px;padding:11px 15px;font-family:var(--font-ar);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--border);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:11.5px;color:var(--dim)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.bk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 15px;margin:7px 0;display:flex;gap:12px;align-items:center}
.bk .n{flex:1;font-family:var(--font-ar);font-size:14px}
.bk .n .a{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.bk .q{font-size:11px;color:var(--acc);white-space:nowrap}
.bk .t{font-size:9.5px;border:1px solid var(--acc3);color:var(--acc3);border-radius:99px;padding:2px 9px;white-space:nowrap}
.stat{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 14px;font-size:12px;margin:4px 4px 0 0}
.stat b{color:var(--acc)}
.muted{color:var(--dim);font-size:12px}
h4{font-family:var(--font-ar);margin:16px 0 6px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعجم الكتب <span class="muted">— كل ما في المكتبة</span></h2>
<div id="stats" style="margin:8px 0"></div>
<input class="inp" id="q" placeholder="ابحث باسم الكتاب أو المؤلف أو النوع…">
<div class="chips" id="cats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
let HB=[],TF=[],FQ=[],cat='الكل';
const SIX=['bukhari','muslim','tirmidhi','abi-dawud','nasai','ibn-majah'];
async function load(){
 HB=await(await fetch('../wahy/data/hadith/books.json')).json();
 TF=await(await fetch('../wahy/data/tafsirs.json')).json();
 try{FQ=window.MASAIL_OBJ||(await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../fiqh_reader/masail.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)}),Object.keys(window.MASAIL||{}))}catch(e){FQ=[]}
 const totH=HB.reduce((a,x)=>a+(x.q||0),0);
 $('#stats').innerHTML=`<span class="stat"><b>${HB.length.toLocaleString('ar-EG')}</b> كتاب حديث</span>
 <span class="stat"><b>${totH.toLocaleString('ar-EG')}</b> حديثاً</span>
 <span class="stat"><b>${TF.length.toLocaleString('ar-EG')}</b> تفسيراً (${TF.filter(t=>t.ar).length} بالعربية)</span>
 <span class="stat"><b>${(FQ.length||0).toLocaleString('ar-EG')}</b> متن فقهي</span>`;
 const cats={};HB.forEach(x=>cats[x.t]=(cats[x.t]||0)+1);
 const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,14).map(x=>x[0]);
 $('#cats').innerHTML=['الكل','التفاسير','الكتب الستة',...top].map(c=>`<span class="chip ${c===cat?'on':''}">${c}</span>`).join('');
 render()}
function render(){
 const q=norm($('q').value.trim());
 let L=[];
 if(cat==='التفاسير')L=TF.map(t=>({n:t.n,a:'',t:'تفسير',q:t.a,k:'tf'}));
 else if(cat==='الكتب الستة')L=HB.filter(x=>SIX.includes(x.s)).map(x=>({n:x.n,a:x.a,t:x.t,q:x.q,k:'h',s:x.s}));
 else L=HB.filter(x=>cat==='الكل'||x.t===cat).map(x=>({n:x.n,a:x.a,t:x.t,q:x.q,k:'h',s:x.s,d:x.d}));
 if(q)L=L.filter(x=>norm(x.n).includes(q)||norm(x.a).includes(q)||norm(x.t).includes(q));
 const rows=L.slice(0,120).map(x=>{
  const link=x.k==='h'&&SIX.includes(x.s)?'../hadith/misbar.html':x.k==='h'&&x.s?'../wahy/':x.k==='tf'?'../wahy/':null;
  const nm=link?'<a href="'+link+'" style="color:var(--txt);text-decoration:none;border-bottom:1px dotted var(--acc)">'+esc(x.n)+'</a>':esc(x.n);
  return `<div class="bk"><span class="t">${esc(x.t)}</span><span class="n">${nm}<span class="a">${esc(x.a||'')}</span></span><span class="q">${x.q?(x.q).toLocaleString('ar-EG'):''}</span></div>`}).join('');
 const more=L.length>120?`<div class="muted" style="text-align:center;padding:10px">…و${(L.length-120).toLocaleString('ar-EG')} كتاباً آخر — صفِّ بالبحث</div>`:'';
 $('#list').innerHTML=rows?(rows+more):'<div class="muted" style="text-align:center;padding:26px">لا نتائج</div>'}
$('#cats').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;cat=c.textContent;
 document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render()};
$('q').addEventListener('input',render);
load();
</script>
<script src="../shared/feedback.js" data-pid="kutub" data-title="مِعجم الكتب"></script>
</body>
</html>
