<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرتَب — ترتيب الأولويات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.duel{display:flex;gap:9px;margin-top:14px}
.opt{flex:1;background:var(--card);border:2px solid var(--border);border-radius:13px;padding:20px 14px;cursor:pointer;text-align:center;font-family:var(--font-ar);font-size:15px;min-height:80px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.opt:hover{border-color:var(--acc);transform:translateY(-2px)}
.vs{align-self:center;color:var(--dim);font-size:12px;font-weight:700}
.rank{margin-top:10px}
.rank .r{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 13px;margin-top:6px;font-size:13px;font-family:var(--font-ar)}
.rank .r .n{color:var(--acc);font-weight:700;min-width:24px}
.rank .r:first-child{border-color:var(--acc);background:var(--acc)11}
.tag{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:4px 12px;margin:3px;font-size:11px;font-family:var(--font-ar)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرتَب <span class="muted">— ترتيب الأولويات</span></h2>
<div class="muted">كل شيء مهم = لا شيء مهم. قرارات ١ ضد ١ حتى يتضح الترتيب الحقيقي.</div>
<div class="card"><div class="t">العناصر المتنافسة</div>
<input id="add" placeholder="أولوية جديدة… ↵">
<div id="pool" style="margin-top:9px"></div>
<button class="btn" id="start" style="margin-top:9px">ابدأ المواجهات</button></div>
<div id="arena"></div>
<div id="result"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let S=LS('mirtab',{pool:[],ranked:[]});
let queue=[],inserting=null,lo=0,hi=0;
$('#add').onkeydown=e=>{
 if(e.key!=='Enter')return;
 const v=$('#add').value.trim();if(!v)return;
 S.pool.push(v);SV('mirtab',S);$('#add').value='';pool();
};
function pool(){
 $('#pool').innerHTML=S.pool.map((p,i)=>'<span class="tag">'+esc(p)+' <a href="#" data-i="'+i+'" style="color:var(--acc2);text-decoration:none">✕</a></span>').join('')||'<span class="muted">أضف أولويات تتنافس — أو استورد أهداف مِقصاد.</span>'+
 '<div style="margin-top:7px"><button class="btn ghost" id="imp">استورد من مِقصاد</button></div>';
 document.getElementById('imp').onclick=()=>{
  const g=LS('miqsad',{goals:[]});
  (g.goals||[]).forEach(x=>{const t=x.t||x;if(!S.pool.includes(t))S.pool.push(t)});
  SV('mirtab',S);pool();
 };
}
$('#pool').onclick=e=>{
 const a=e.target.closest('a[data-i]');if(!a)return;e.preventDefault();
 S.pool.splice(+a.dataset.i,1);SV('mirtab',S);pool();
};
$('#start').onclick=()=>{
 if(S.pool.length<2)return alert('أضف عنصرين على الأقل');
 queue=[...S.pool];S.ranked=[];next();
};
// insertion sort بالمواجهات: كل عنصر جديد يُقارن ثنائياً داخل الترتيب
function next(){
 if(!queue.length){finish();return}
 inserting=queue.shift();lo=0;hi=S.ranked.length;
 duel();
}
function duel(){
 if(lo>=hi){
  S.ranked.splice(lo,0,inserting);
  SV('mirtab',S);next();return;
 }
 const mid=(lo+hi)>>1;
 $('#arena').innerHTML='<div class="muted" style="margin-top:10px">أيهما أولى؟ ('+arN(S.ranked.length)+' مرتبة)</div>'+
 '<div class="duel"><div class="opt" data-w="new">'+esc(inserting)+'</div><div class="vs">×</div><div class="opt" data-w="old" data-i="'+mid+'">'+esc(S.ranked[mid])+'</div></div>';
}
$('#arena').onclick=e=>{
 const o=e.target.closest('.opt');if(!o)return;
 const mid=(lo+hi)>>1;
 if(o.dataset.w==='new')hi=mid;else lo=mid+1;
 duel();
};
function finish(){
 $('#arena').innerHTML='';
 $('#result').innerHTML='<div class="card"><div class="t">ترتيبك النهائي</div><div class="rank">'+
 S.ranked.map((r,i)=>'<div class="r"><span class="n">'+arN(i+1)+'</span><span>'+esc(r)+'</span></div>').join('')+'</div>'+
 '<button class="btn ghost" id="push" style="margin-top:9px">ادفع أول ٣ إلى مِقصاد الغد</button></div>';
 document.getElementById('push').onclick=()=>{
  const tm=new Date();tm.setDate(tm.getDate()+1);const k=tm.toISOString().slice(0,10);
  const q=LS('miqsad',{date:k,goals:[]});
  q.date=k;q.goals=S.ranked.slice(0,3).map(t=>({t,due:k}));SV('miqsad',q);
  alert('أُرسلت أول ٣ أولويات إلى مِقصاد الغد');
 };
}
pool();
if(S.ranked.length)finish();
</script>
<script src="../shared/feedback.js" data-pid="mirtab" data-title="مِرتَب"></script>
</body>
</html>
