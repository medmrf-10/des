<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِذنَب — سجل التوبة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px;width:100%}
textarea{min-height:44px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.sn{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.sn .x{font-family:var(--font-ar);font-size:12.5px;color:var(--acc2)}
.sn .tb{font-size:12px;margin-top:5px;border-top:1px dashed var(--border);padding-top:5px;color:var(--ok)}
.sn .meta{font-size:10px;color:var(--dim);margin-top:4px}
.priv{background:var(--card);border:1px dashed var(--acc);border-radius:10px;padding:9px 13px;margin-top:11px;font-size:10.5px;color:var(--dim);text-align:center}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِذنَب <span class="muted">— سجل التوبة</span></h2>
<div class="priv">🔒 هذا السجل محلي تماماً — لا يُرفَع لأي مكان، يبقى على جهازك. بينك وبين نفسك وربك.</div>
<div class="muted" style="margin-top:8px">«وَالَّذِينَ إِذَا فَعَلُوا فَاحِشَةً أَوْ ظَلَمُوا أَنفُسَهُمْ ذَكَرُوا اللَّهَ فَاسْتَغْفَرُوا لِذُنُوبِهِمْ». سجّل الوقوع — ثم التوبة — ولاحظ متى تكرر نفس الباب.</div>
<div class="card"><div class="t">وقوع سجّله لنفسك</div>
<input id="nm" placeholder="الذنب/الزلّة (بلا تفاصيل تحتاجها)">
<textarea id="tb" placeholder="توبتك/عزمك"></textarea>
<button class="btn" id="ad" style="margin-top:9px">سجّل واستغفر</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let S=LS('midhnab',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 S.unshift({n,tb:$('#tb').value.trim(),cnt:1,at:Date.now()});
 SV('midhnab',S);$('#nm').value=$('#tb').value='';render();
};
function render(){
 const tot=S.reduce((s,x)=>s+x.cnt,0);
 const rep=S.filter(x=>x.cnt>1).length;
 $('#stats').innerHTML='<span class="stat">سجلت واستغفرت: <b>'+arN(tot)+'</b></span>'+
 (rep?'<span class="stat" style="color:var(--acc2)">أبواب تكرر: '+arN(rep)+'</span>':'');
 $('#list').innerHTML=S.slice(0,10).map((x)=>{
  const gi=S.indexOf(x);
  return '<div class="sn"><div class="x">'+esc(x.n)+(x.cnt>1?' <span style="color:var(--acc2);font-size:10px">×'+arN(x.cnt)+'</span>':'')+'</div>'+
  (x.tb?'<div class="tb">'+esc(x.tb)+'</div>':'')+
  '<div class="meta">'+new Date(x.at).toLocaleDateString('ar-EG')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:6px">'+
  '<button class="btn ghost" data-r="'+gi+'" style="color:var(--acc2);font-size:10px">عدت إليها</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">سجلك نظيف — الحمد لله.</div>';
}
$('#list').onclick=e=>{
 const r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
 if(r){S[+r.dataset.r].cnt++;S[+r.dataset.r].at=Date.now();SV('midhnab',S);render();return}
 if(d&&confirm('احذف؟')){S.splice(+d.dataset.d,1);SV('midhnab',S);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="midhnab" data-title="مِذنَب"></script>
</body>
</html>
