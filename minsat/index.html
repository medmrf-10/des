<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنصَت — سجل الإنصات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.cv{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.cv .p{font-family:var(--font-ar);font-size:13px}
.cv .l{font-size:11px;color:var(--dim);margin-top:4px}
.cv .ratio{margin-top:6px;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.cv .ratio i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc))}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنصَت <span class="muted">— سجل الإنصات</span></h2>
<div class="muted">سجّل محادثاتك: كم أنصتّ وكم تكلمت. «من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت».</div>
<div class="card"><div class="t">محادثة</div>
<input id="p" placeholder="مع من؟ (أمي، زميل، طالب…)">
<div style="display:flex;gap:9px;margin-top:9px;align-items:center">
<span class="muted">أنصتّ أكثر؟</span>
<button class="btn ghost" id="l1" style="flex:1">نعم — أنصتّ</button>
<button class="btn ghost" id="l2" style="flex:1">لا — تكلمت أكثر</button></div>
<input id="g" placeholder="ما الذي سمعته منه؟ (حاجة، هم، خبر…)">
</div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let C=LS('minsat',[]),mode=null;
$('#l1').onclick=()=>{mode=true;$('#l1').style.borderColor='var(--ok)';$('#l2').style.borderColor='var(--border)'};
$('#l2').onclick=()=>{mode=false;$('#l2').style.borderColor='var(--acc2)';$('#l1').style.borderColor='var(--border)'};
$('#g').addEventListener('keydown',e=>{if(e.key==='Enter')save()});
$('#g').insertAdjacentHTML('afterend','<button class="btn" id="ad" style="margin-top:9px">سجّل</button>');
$('#ad').onclick=save;
function save(){
 const p=$('#p').value.trim();if(!p||mode===null)return;
 C.unshift({p,lis:mode,g:$('#g').value.trim(),at:Date.now()});
 SV('minsat',C);$('#p').value=$('#g').value='';mode=null;
 $('#l1').style.borderColor=$('#l2').style.borderColor='var(--border)';render();
}
function render(){
 const lis=C.filter(x=>x.lis).length,pc=C.length?Math.round(lis/C.length*100):0;
 const week=C.filter(x=>x.at>Date.now()-7*864e5),wlis=week.filter(x=>x.lis).length;
 $('#stats').innerHTML='<span class="stat">محادثات: <b>'+arN(C.length)+'</b></span>'+
 '<span class="stat">إنصات: <b style="color:var(--ok)">'+arN(pc)+'٪</b></span>'+
 '<span class="stat">هذا الأسبوع: <b>'+arN(wlis)+'/'+arN(week.length)+'</b></span>';
 $('#list').innerHTML=C.slice(0,14).map(x=>'<div class="cv"><div class="p">'+esc(x.p)+'</div>'+
 '<div class="l">'+new Date(x.at).toLocaleDateString('ar-EG')+' — '+(x.lis?'أنصتّ أكثر 👂':'تكلمت أكثر 🗣')+'</div>'+
 '<div class="ratio"><i style="width:'+(x.lis?75:30)+'%"></i></div>'+
 (x.g?'<div class="l" style="margin-top:6px">سمعت: '+esc(x.g)+'</div>':'')+'</div>').join('')||
 '<div class="muted" style="margin-top:12px">لا سجل — سجّل أول محادثة.</div>';
}
$('#list').onclick=e=>{
 const x=e.target.closest('.cv');if(!x)return;
 const i=[...document.querySelectorAll('.cv')].indexOf(x);
 if(confirm('احذف؟')){C.splice(i,1);SV('minsat',C);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="minsat" data-title="مِنصَت"></script>
</body>
</html>
