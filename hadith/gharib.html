<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غريب الحديث — قاموس حي | مختبر الحديث</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:980px;margin:0 auto;padding:0 14px 40px}
.top{display:flex;align-items:baseline;gap:14px;padding:16px 0 8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;color:var(--acc2);font-weight:700}
.top .sub{color:var(--dim);font-size:13px}
.top a{color:var(--acc);font-size:13px;text-decoration:none;border:1px solid var(--border);padding:3px 10px;border-radius:8px}
.pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.pick input{flex:1;min-width:160px;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit}
.chip{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed=true]{background:var(--acc);color:#14140f;font-weight:700;border-color:transparent}
.status{color:var(--dim);font-size:12px;padding:4px 2px}
.prog{height:4px;background:var(--card2);border-radius:2px;margin:6px 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc2);transition:width .2s}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin:8px 0}
.stats b{color:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.wcard .word{font-family:var(--font-ar);font-size:19px;font-weight:700;color:var(--acc2);margin-bottom:4px}
.wcard .cnt{font-size:10.5px;color:var(--dim)}
.wcard .ctx{font-family:var(--font-ar);font-size:13px;line-height:1.9;color:var(--txt);margin:6px 0}
.wcard .ctx mark{background:transparent;color:var(--acc);font-weight:700;border-bottom:2px solid var(--acc)}
.wcard .gloss{font-size:11.5px;color:var(--ok);background:#14291c;border-radius:8px;padding:4px 10px;margin:6px 0;display:inline-block}
.wcard .ops{display:flex;gap:6px;margin-top:6px;align-items:center}
.wcard .ops a{color:var(--acc);text-decoration:none;font-size:11px}
.ln{border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--dim);font-family:inherit}
.ln.on{background:#14291c;color:var(--ok);border-color:var(--ok)}
.more{width:100%;padding:9px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--acc2);cursor:pointer;font-family:inherit}
.mut{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header class="top">
  <h1>📖 غريب الحديث</h1>
  <span class="sub">ألفاظ وردت مرة أو مرتين في الكوربوس كله — قاموس شخصي ينمو مع القراءة</span>
  <a href="index.html">المختبر ←</a>
  <a href="matn.html">بحث المتون ←</a>
</header>
<div class="pick">
  <input type="text" id="q" placeholder="ابحث في الغريب…">
  <span id="fchips">
    <button class="chip" data-f="" aria-pressed="true">الكل</button>
    <button class="chip" data-f="new">جديد</button>
    <button class="chip" data-f="ok">أتقنته</button>
  </span>
  <button class="chip" id="rnd">🎲 عشوائية</button>
</div>
<div class="stats" id="stats"></div>
<div class="prog"><i id="pfill"></i></div>
<div class="status" id="stat"></div>
<div class="grid" id="grid"></div>
<div id="foot"></div>
<script src="pako.min.js"></script>
<script>
const arNum=n=>Number(n).toLocaleString('ar-EG');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();
const BAR={'bukhari':'صحيح البخاري','muslim':'صحيح مسلم','tirmidhi':'سنن الترمذي','abi-dawud':'سنن أبي داود','nasai':'سنن النسائي','ibn-majah':'سنن ابن ماجه'};
const BOOKS=Object.keys(BAR);
const STOP=new Set(('قال حدثنا اخبرنا عن ان الي ما من في علي الله رسول صلي عليه وسلم قلت فقال كان كانت هو هي هم هذا هذه الذي التي ذلك ليس لنا لك له لها نحن انتم ولا لما اذا كل بعض منه منها فيه فيها عنه عنها لدي عند قبل بعد نعم لا بلى نعم يا ثم او الا الايا لم لن كي كيما لدي عندي حتي حيث لما سمعنا لما سمعت اراه تكلمنا راينا وعن حدثني'.split(' ')));
const D={};let FREQ=null,CARDS=[];
const stat=document.getElementById('stat'),pf=document.getElementById('pfill');
async function loadBook(b){
  if(D[b])return D[b];
  stat.textContent='يُحمّل '+BAR[b]+'…';
  const buf=await(await fetch(b+'-det.json.gz')).arrayBuffer();
  D[b]=JSON.parse(pako.ungzip(new Uint8Array(buf),{to:'string'}));
  return D[b];
}
/* معنى مستنتج: «يعني X» / «أي X» / «المراد X» في متن الحديث نفسه بعد اللفظة */
function gloss(m,w){
  const mm=norm(m);const i=mm.indexOf(w);if(i<0)return null;
  const after=mm.slice(i).split(' ');
  for(let k=1;k<Math.min(8,after.length);k++)
    if(['يعني','اي','المراد','اراد'].includes(after[k]))return after.slice(k+1,k+4).join(' ');
  return null;
}
async function build(){
  FREQ={};CARDS=[];
  let bi=0;
  for(const b of BOOKS){
    const j=await loadBook(b);pf.style.width=Math.round(++bi/BOOKS.length*90)+'%';
    for(const n in j.d){
      const m=j.d[n].m;const ws=norm(m).split(' ').filter(w=>w.length>3&&!STOP.has(w)&&!/^\d+$/.test(w));
      const seen=new Set();
      for(const w of ws){
        if(seen.has(w))continue;seen.add(w);
        (FREQ[w]=FREQ[w]||{f:0,first:null}).f++;
        if(!FREQ[w].first)FREQ[w].first={b,n:+n,m};
      }
    }
  }
  for(const w in FREQ){
    const e=FREQ[w];
    if(e.f<3)CARDS.push({w,f:e.f,b:e.first.b,n:e.first.n,m:e.first.m,g:gloss(e.first.m,w)});
  }
  CARDS.sort((a,b)=>a.w.localeCompare(b.w,'ar'));
}
/* تعلّم — localStorage miq_gharib */
const SKEY='miq_gharib';
const getL=()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}};
const setL=(w,v)=>{const l=getL();if(v)l[w]=v;else delete l[w];try{localStorage.setItem(SKEY,JSON.stringify(l))}catch(e){}};
let PAGE=0;const PER=40;let LIST=[];
function filtered(){
  const q=norm(document.getElementById('q').value);
  const f=document.querySelector('#fchips .chip[aria-pressed="true"]').dataset.f;
  const l=getL();
  return CARDS.filter(c=>{
    if(f==='new'&&l[c.w])return false;
    if(f==='ok'&&l[c.w]!=='ok')return false;
    if(q&&!norm(c.w).includes(q))return false;
    return true;
  });
}
function paintStats(){
  const l=getL();const ok=Object.values(l).filter(v=>v==='ok').length;
  document.getElementById('stats').innerHTML=
    `الغريب المستخرج: <b>${arNum(CARDS.length)}</b> لفظة (تكرار ١–٢) · أتقنت: <b>${arNum(ok)}</b> · المعروض: <b>${arNum(LIST.length)}</b>`;
}
function card(c){
  const l=getL();const on=l[c.w]==='ok';
  const ctxIdx=norm(c.m).indexOf(c.w);
  const raw=c.m.split(/\s+/);
  let marked='';
  if(ctxIdx>=0){
    /* طابق الكلمة الخام على الأقرب موضع */
    const nw=norm(c.w);let hit=-1;
    for(let i=0;i<raw.length;i++)if(norm(raw[i])===nw){hit=i;break}
    marked=raw.slice(Math.max(0,hit-4),hit+5).map((w,i)=>{
      const gi=Math.max(0,hit-4)+i;
      return gi===hit?`<mark>${esc(w)}</mark>`:esc(w);
    }).join(' ');
    if(hit>4)marked='… '+marked;if(hit+5<raw.length)marked+=' …';
  }else marked=esc(c.m.slice(0,120))+'…';
  return `<div class="wcard" data-w="${esc(c.w)}">
    <div class="word">${esc(c.w)} <span class="cnt">×${arNum(c.f)}</span></div>
    <div class="ctx">${marked}</div>
    ${c.g?`<div class="gloss">معناه من السياق: ${esc(c.g)}</div>`:''}
    <div class="cnt">${BAR[c.b]} <a href="matn.html#${c.b}:${c.n}" style="color:var(--acc2)">#${arNum(c.n)}</a></div>
    <div class="ops">
      <button class="ln ${on?'on':''}" onclick="toggle('${esc(c.w)}',this)">${on?'أتقنته ✓':'أتقنته'}</button>
      <a href="takhrij.html#b=${c.b}&n=${c.n}">أين يرد ←</a>
    </div></div>`;
}
window.toggle=function(w,btn){
  const l=getL();const on=l[w]==='ok';
  if(on){setL(w,null);btn.classList.remove('on');btn.textContent='أتقنته'}
  else{setL(w,'ok');btn.classList.add('on');btn.textContent='أتقنته ✓'}
  paintStats();
};
function render(more){
  if(!more)PAGE=0;
  const sl=LIST.slice(PAGE*PER,(PAGE+1)*PER);
  const g=document.getElementById('grid');
  const html=sl.map(card).join('');
  if(more)g.insertAdjacentHTML('beforeend',html);else g.innerHTML=html;
  const f=document.getElementById('foot');
  if((PAGE+1)*PER<LIST.length){f.innerHTML=`<button class="more" id="mre">عرض المزيد (${arNum(LIST.length-(PAGE+1)*PER)})</button>`;
    document.getElementById('mre').onclick=()=>{PAGE++;render(1)}}
  else f.innerHTML='';
  if(!more)PAGE++;
}
function repaint(){LIST=filtered();paintStats();render(0)}
document.getElementById('q').addEventListener('input',()=>{if(CARDS.length)repaint()});
document.getElementById('fchips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('#fchips .chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true');repaint();
});
document.getElementById('rnd').addEventListener('click',()=>{
  if(!LIST.length)return;
  const c=LIST[Math.floor(Math.random()*LIST.length)];
  const el=document.querySelector(`[data-w="${CSS.escape(c.w)}"]`);
  document.getElementById('grid').innerHTML=card(c);
  document.getElementById('foot').innerHTML='<button class="more" onclick="repaint()">عودة للقائمة</button>';
});
window.repaint=repaint;
(async()=>{
  await build();
  stat.textContent='';pf.style.width='100%';
  repaint();
})();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="miq_gharib"></script>
</body>
</html>
