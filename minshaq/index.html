<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنشَق — شقّق الهدف</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px;width:100%}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.gl{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.gl .n{font-family:var(--font-ar);font-size:13.5px;color:var(--acc)}
.gl.done .n{text-decoration:line-through;opacity:.5}
.ac{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12.5px}
.ac .ck{width:17px;height:17px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;flex-shrink:0}
.ac.on .ck{background:var(--acc);border-color:var(--acc);color:#14140f}
.ac.on span{text-decoration:line-through;opacity:.5}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنشَق <span class="muted">— شقّق الهدف</span></h2>
<div class="muted">الهدف الكبير لا يُنفَّذ — يُشقَّق. اكتب الهدف ثم ٣ خطوات مادية أولى (لا «ابدأ» — بل «أرسل إيميلاً لفلان»).</div>
<div class="card"><div class="t">هدف يشقّق</div>
<input id="nm" placeholder="الهدف (أتعلم بايثون)">
<div id="acs"><input class="ac-in" placeholder="خطوة ١ (مادية وصغيرة)"><input class="ac-in" placeholder="خطوة ٢"><input class="ac-in" placeholder="خطوة ٣"></div>
<button class="btn" id="ad" style="margin-top:9px">شقّقه</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const $$=q=>document.querySelectorAll(q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G=LS('minshaq',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 const acts=[...$$('.ac-in')].map(i=>i.value.trim()).filter(Boolean);
 G.unshift({n,acts:acts.map(a=>({a,on:false})),at:Date.now()});
 SV('minshaq',G);$('#nm').value='';$$('.ac-in').forEach(i=>i.value='');render();
};
function render(){
 const done=G.filter(x=>x.acts.length&&x.acts.every(a=>a.on)).length;
 $('#stats').innerHTML='<span class="stat">أهداف مشقّقة: <b>'+arN(G.length)+'</b></span>'+
 '<span class="stat">مكتملة: <b style="color:var(--ok)">'+arN(done)+'</b></span>';
 $('#list').innerHTML=G.map((x,i)=>{
  const gi=G.indexOf(x);
  const dn=x.acts.length&&x.acts.every(a=>a.on);
  return '<div class="gl'+(dn?' done':'')+'"><div class="n">'+esc(x.n)+(dn?' 🎉':'')+'</div>'+
  (x.acts.length?x.acts.map((a,j)=>'<div class="ac'+(a.on?' on':'')+'" data-g="'+gi+'" data-a="'+j+'">'+
   '<span class="ck">'+(a.on?'✓':'')+'</span><span>'+esc(a.a)+'</span></div>').join(''):'<div class="muted" style="font-size:11px;margin-top:5px">لا خطوات — أضِفها بعقلك.</div>')+
  '<div style="display:flex;gap:6px;margin-top:7px">'+
  '<button class="btn ghost" data-p="'+gi+'" style="font-size:10px">+ خطوة</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أهداف — ما الذي يثقلك بكبره؟</div>';
}
$('#list').onclick=e=>{
 const ac=e.target.closest('.ac'),p=e.target.closest('[data-p]'),d=e.target.closest('[data-d]');
 if(ac){const g=G[+ac.dataset.g];g.acts[+ac.dataset.a].on=!g.acts[+ac.dataset.a].on;SV('minshaq',G);render();return}
 if(p){const a=prompt('خطوة مادية صغيرة:');if(a){G[+p.dataset.p].acts.push({a,on:false});SV('minshaq',G);render()}return}
 if(d&&confirm('احذف الهدف؟')){G.splice(+d.dataset.d,1);SV('minshaq',G);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="minshaq" data-title="مِنشَق"></script>
</body>
</html>
