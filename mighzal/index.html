<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِغزل — غزل اليوم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:10px 0;position:relative}
.card .tag{position:absolute;top:-9px;right:16px;background:var(--acc);color:#14140f;font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:99px}
.card .b{font-family:var(--font-ar);font-size:15px;line-height:2.1}
.card .src{color:var(--dim);font-size:11px;margin-top:7px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:13px;margin-inline-end:6px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
h2{font-family:var(--font-ar);margin:6px 0}
</style>
</head>
<body>
<h2>مِغزل <span class="muted">— غزلك اليومي</span></h2>
<div class="muted" id="dt"></div>
<div id="cards"><div class="muted">…</div></div>
<div style="margin-top:12px">
<button class="btn" id="cp">⧉ انسخ الغزل</button>
<button class="btn ghost" id="r">⚂ غزل جديد</button>
</div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>Number(n).toLocaleString('ar-EG');
$('#dt').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
let seed=Math.floor(Date.now()/864e5);
const R=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
let out='';
async function spin(){
 $('#cards').innerHTML='<div class="muted">يُغزل…</div>';
 out='🕯 غَزْل '+new Date().toLocaleDateString('ar-EG')+'\n\n';
 // آية
 const sn=1+Math.floor(R()*114);
 const S=await(await fetch('../wahy/data/surah/'+sn+'.json')).json();
 const v=S.verses[Math.floor(R()*S.verses.length)];
 $('#cards').innerHTML=`<div class="card"><span class="tag">آية</span><div class="b">${esc(v.t)} ﴿${arN(v.a)}﴾</div><div class="src">${esc(S.ar)} · ${v.k}</div></div>`;
 out+='﴿'+v.t+'﴾ ['+S.ar+' '+v.a+']\n\n';
 // تفسير السعدي (خفيف)
 try{
  const buf=await(await fetch('../wahy/data/tafsir/24-tafseer-al-saadi-arabic.json.gz')).arrayBuffer();
  const T=JSON.parse(pako.ungzip(new Uint8Array(buf),{to:'string'}));
  let g=null;const key=sn+':'+v.a;
  for(const k in T.groups){const x=T.groups[k];const[fs,fa]=x.f.split(':').map(Number),[ts,ta]=x.t.split(':').map(Number);
   if(fs===sn&&v.a>=fa&&v.a<=ta){g=x;break}}
  if(g){const tx=g.x.replace(/<[^>]+>/g,'').slice(0,700);
   $('#cards').innerHTML+=`<div class="card"><span class="tag">تفسير</span><div class="b" style="font-size:13.5px">${esc(tx)}…</div><div class="src">تفسير السعدي · ${g.f} — ${g.t}</div></div>`;
   out+='— تفسير السعدي: '+tx+'\n\n';}
 }catch(e){}
 // حديث
 try{
  const D=window.GIDNET||(await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../hadith/analysis.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)}),window.GIDNET);
  const ks=Object.keys(D.g);const gid=ks[Math.floor(R()*ks.length)];
  const hh=D.g[gid];
  const books=Object.keys(hh.w||{});const bk=books[0];const num=(hh.w[bk]||[])[0];
  const bkN={bukhari:'صحيح البخاري',muslim:'صحيح مسلم',tirmidhi:'سنن الترمذي','abi-dawud':'سنن أبي داود',nasai:'سنن النسائي','ibn-majah':'سنن ابن ماجه'}[bk]||bk;
  $('#cards').innerHTML+=`<div class="card"><span class="tag">حديث</span><div class="b">«${esc(hh.t)}»</div><div class="src">${esc(hh.h)} · ${bkN} ${arN(num||'')} · رواه ${arN(hh.s)} صحابياً</div></div>`;
  out+='«'+hh.t+'» — '+hh.h+' ('+bkN+')\n\n';
 }catch(e){}
 // مسألة
 try{
  const M=window.MASAIL||(await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../fiqh_reader/masail.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)}),window.MASAIL);
  const sk=Object.keys(M);const sl=M[sk[Math.floor(R()*sk.length)]];
  const u=sl.u[Math.floor(R()*sl.u.length)];
  $('#cards').innerHTML+=`<div class="card"><span class="tag">مسألة فقهية</span><div class="b">${esc(u.t||u.i||'')}</div><div class="src">${esc(sl.n)} · ${esc(sl.a||'')}</div></div>`;
  out+='◇ '+String(u.t||'').slice(0,300)+' — '+sl.n+'\n\n';
 }catch(e){}
 // أذكار
 try{
  const A=window.ADHKAR||(await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../hadith/adhkar.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)}),window.ADHKAR);
  const ad=A[Math.floor(R()*A.length)];
  $('#cards').innerHTML+=`<div class="card"><span class="tag">ذِكر</span><div class="b">${esc(ad.t)}</div><div class="src">${esc(ad.h||'')}</div></div>`;
  out+='☾ '+ad.t+'\n';
 }catch(e){}}
$('#r').onclick=()=>{seed=Math.floor(Math.random()*1e9);spin()};
$('#cp').onclick=async()=>{await navigator.clipboard.writeText(out).catch(()=>{});$('#cp').textContent='✓ نُسخ';setTimeout(()=>$('#cp').textContent='⧉ انسخ الغزل',1500)};
spin();
</script>
<script src="../hadith/pako.min.js"></script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mighzal" data-title="مِغزل"></script>
</body>
</html>
