<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِخصَب — حديقة المشاريع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.garden{display:flex;flex-wrap:wrap;gap:11px;margin-top:12px}
.plant{width:calc(50% - 6px);background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px;text-align:center}
.plant .em{font-size:32px}
.plant .n{font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.plant .w{font-size:10px;color:var(--dim);margin-top:4px}
.plant.dry{border-style:dashed;opacity:.6}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِخصَب <span class="muted">— حديقة المشاريع</span></h2>
<div class="muted">كل مشروع نبتة — تسقيها بالانتباه وتجفّ بالإهمال. سقِ اليوم.</div>
<div class="card"><div class="t">ازرع نبتة</div>
<input id="n" placeholder="المشروع (كتابة كتاب، حفظ سورة، موقع…)">
<div style="display:flex;gap:7px;margin-top:8px" id="ems"></div>
<button class="btn" id="ad" style="margin-top:9px">ازرع</button></div>
<div id="stats"></div>
<div class="garden" id="gard"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('mikhsab',[]),em='🌱';
const EMS=['🌱','🌿','🌵','🌷','🌳','🍇','🌻','🍀'];
$('#ems').innerHTML=EMS.map(e=>'<span class="btn ghost" data-e="'+e+'" style="font-size:16px;padding:5px 9px;cursor:pointer">'+e+'</span>').join('');
const paintEm=()=>document.querySelectorAll('[data-e]').forEach(e=>{e.style.borderColor=e.dataset.e===em?'var(--acc)':'var(--border)'});
paintEm();
$('#ems').onclick=e=>{const t=e.target.closest('[data-e]');if(t){em=t.dataset.e;paintEm()}};
$('#ad').onclick=()=>{
 const n=$('#n').value.trim();if(!n)return;
 P.push({n,em,w:[],at:Date.now()});SV('mikhsab',P);$('#n').value='';render();
};
const day=t=>new Date(t).toISOString().slice(0,10);
const daysSince=t=>Math.floor((Date.now()-t)/864e5);
function render(){
 const td=day(Date.now());
 const watered=P.filter(x=>x.w.includes(td)).length,dry=P.filter(x=>x.w.length&&!x.w.includes(td)&&daysSince(x.w[x.w.length-1])>=3).length;
 $('#stats').innerHTML='<span class="stat">نباتات: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">مسقية اليوم: <b style="color:var(--ok)">'+arN(watered)+'</b></span>'+
 '<span class="stat">عطشى (3+ أيام): <b style="color:var(--acc2)">'+arN(dry)+'</b></span>';
 $('#gard').innerHTML=P.map((x,i)=>{
  const last=x.w.length?daysSince(x.w[x.w.length-1]):999;
  const isDry=last>=3&&!x.w.includes(td),wtr=x.w.includes(td);
  return '<div class="plant'+(isDry?' dry':'')+'"><div class="em">'+(wtr?'💧':'')+x.em+'</div>'+
  '<div class="n">'+esc(x.n)+'</div>'+
  '<div class="w">'+(x.w.length?'سُقيت '+arN(x.w.length)+'× · آخرها قبل '+arN(last)+' يوم':'لم تُسقَ بعد')+'</div>'+
  '<div style="display:flex;gap:6px;justify-content:center;margin-top:8px">'+
  (wtr?'<span style="font-size:10px;color:var(--ok)">✓ مسقية</span>':'<button class="btn ghost" data-w="'+i+'" style="color:var(--acc);font-size:10px">💧 اسقِ</button>')+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2);font-size:10px;padding:4px 7px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">حديقة فارغة — ازرع أول نبتة.</div>';
}
$('#gard').onclick=e=>{
 const w=e.target.closest('[data-w]'),d=e.target.closest('[data-d]');
 if(w){P[+w.dataset.w].w.push(day(Date.now()));SV('mikhsab',P);render();return}
 if(d&&confirm('اقتلع النبتة؟')){P.splice(+d.dataset.d,1);SV('mikhsab',P);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mikhsab" data-title="مِخصَب"></script>
</body>
</html>
