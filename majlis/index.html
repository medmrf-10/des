<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مجلس — القراءة والختمة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
html,body{overflow-x:hidden}
body{max-width:860px;margin:0 auto;padding:14px}
.sur{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin:5px 0}
.sur:hover{border-color:var(--acc)}
.sur .n{font-family:var(--font-ar);font-size:14.5px}
.sur .p{font-size:10px;color:var(--dim)}
.sur.done{background:rgba(61,214,140,.08);border-color:rgba(61,214,140,.35)}
.sur.done .n{color:#3dd68c}
.inp{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:8px 13px;font-family:var(--font-ar);font-size:13px}
.v{font-family:var(--font-ar);font-size:21px;line-height:2.4;text-align:justify;padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-top:12px}
.vn{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border:1px solid var(--acc);border-radius:50%;font-size:11px;color:var(--acc);margin:0 4px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:8px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.muted{color:var(--dim);font-size:12px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#3dd68c,var(--acc));border-radius:99px;transition:width .4s}
.pill{border:1px solid var(--border);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:11.5px;color:var(--dim)}
.pill.on{border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="font-family:var(--font-ar);margin:6px 0">مجلس <span class="muted" style="font-weight:400;font-size:12px">— القراءة وتتبّع الختمة</span></h2>
<span class="pill" id="flt">المتبقي فقط</span>
</div>
<div class="muted" id="stats">…</div>
<div class="bar"><b id="bar" style="width:0%"></b></div>
<input class="inp" id="q" placeholder="سورة…" style="width:100%;margin-top:10px">
<div id="list"></div>
<div id="reader" style="display:none"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let IX=null,ST=JSON.parse(localStorage.majlis||'{}');
let onlyLeft=false;
async function ix(){if(!IX)IX=await(await fetch('../wahy/data/index.json')).json();return IX}
const SD={};
async function surah(n){if(!SD[n])SD[n]=await(await fetch('../wahy/data/surah/'+n+'.json')).json();return SD[n]}
function save(){localStorage.majlis=JSON.stringify(ST)}
function stats(){
 ix().then(I=>{
  const tot=I.reduce((a,s)=>a+s.ayahs,0);
  const done=Object.keys(ST).reduce((a,s)=>a+ST[s],0);
  const doneS=I.filter(s=>(ST[s.n]||0)>=s.ayahs).length;
  $('stats').textContent='قرأت '+done.toLocaleString('ar-EG')+' آية من '+tot.toLocaleString('ar-EG')+' · '+doneS+'/'+I.length+' سورة خُتمت';
  $('bar').style.width=(done/tot*100).toFixed(1)+'%'})}
function list(){
 ix().then(I=>{
  const q=$('q').value.trim();
  $('#list').innerHTML=I.filter(s=>{
   if(onlyLeft&&(ST[s.n]||0)>=s.ayahs)return false;
   return !q||s.ar.includes(q)||(''+s.n).includes(q)||(s.en||'').toLowerCase().includes(q.toLowerCase())})
  .map(s=>{const d=ST[s.n]||0,pc=Math.round(d/s.ayahs*100);
   return `<div class="sur ${d>=s.ayahs?'done':''}" data-n="${s.n}">
   <span class="n">${s.n}. ${s.ar} ${d>=s.ayahs?'✓':''}</span>
   <span class="p">${s.ayahs} آية · ${pc}%</span></div>`}).join('')})}
async function read(n){
 const s=await surah(n);const I=await ix();const sm=I.find(x=>x.n===+n);
 const done=ST[n]||0;
 $('#list').style.display='none';
 $('#reader').style.display='block';
 $('#reader').innerHTML=`<button class="btn" id="bk" style="margin-bottom:8px">→ السور</button>
 <h3 style="font-family:var(--font-ar);margin:4px 0">${s.n}. ${s.ar} <span class="muted" style="font-size:11px">${s.place==='Makkiyah'?'مكية':'مدنية'}</span></h3>
 <div class="v">${s.bismillah?'<div style="text-align:center;color:var(--acc);margin-bottom:10px">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':''}
 ${s.verses.map(v=>`<span class="vs" data-a="${v.a}">${esc(v.t)}</span><span class="vn">${v.a.toLocaleString('ar-EG')}</span>`).join(' ')}</div>
 <div style="display:flex;gap:8px;margin-top:12px">
 <button class="btn" id="all">${sm&&done>=sm.ayahs?'✓ مقروءة':'قرأتُها كلها'}</button>
 <button class="btn" id="mark" style="background:var(--card2);color:var(--txt)">علّمتُ حتى آية…</button>
 <a class="btn" style="background:var(--card2);color:var(--txt);text-decoration:none;display:inline-block;padding:8px 14px" href="../wahy/mishkat.html#${n}:1">تفاسيرها</a></div>`;
 $('#bk').onclick=()=>{$('#reader').style.display='none';$('#list').style.display='';list()};
 $('#all').onclick=()=>{ST[n]=s.verses.length;save();$('#reader').style.display='none';$('#list').style.display='';stats();list()};
 $('#mark').onclick=()=>{const a=+prompt('حتى آية رقم؟',''+((done||0)+1))||0;if(a>0){ST[n]=Math.min(a,s.verses.length);save();stats();list();$('#reader').style.display='none';$('#list').style.display=''}};
 $('#reader').scrollIntoView()}
$('#list').onclick=e=>{const s=e.target.closest('.sur');if(s)read(s.dataset.n)};
$('q').addEventListener('input',list);
$('flt').onclick=()=>{onlyLeft=!onlyLeft;$('flt').classList.toggle('on',onlyLeft);list()};
stats();list();
</script>
<script src="../shared/feedback.js" data-pid="majlis" data-title="مجلس"></script>
</body>
</html>
