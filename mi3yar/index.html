<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعيَر — عجلة التوازن</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.dom{display:flex;gap:10px;align-items:center;margin-top:9px}
.dom .nm{min-width:80px;font-family:var(--font-ar);font-size:13px}
.dom input{flex:1;accent-color:var(--acc)}
.dom .v{min-width:26px;text-align:center;font-size:12px;color:var(--acc);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.gap{background:var(--card);border:1px solid var(--acc2);border-radius:11px;padding:10px 14px;margin-top:7px;font-size:12.5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعيَر <span class="muted">— عجلة التوازن</span></h2>
<div class="muted">قيّم مجالات حياتك شهرياً من ١-١٠ — العجلة تكشف ما أهملته.</div>
<div class="card"><div class="t">قيّم الآن</div>
<div id="doms"></div>
<button class="btn" id="sv" style="margin-top:11px">احفظ التقييم</button></div>
<div id="gaps"></div>
<div id="stats"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const DOMS=['دين','علم','صحة','أهل','مال','نفس','عمل','راحة'];
const COLS=['#c9a959','#5a8aca','#5aca8a','#ca8a5a','#8a5aca','#ca5a8a','#5acaca','#baba5a'];
let H=LS('mi3yar',[]);
let cur=H.length?{...H[0].v}:Object.fromEntries(DOMS.map(d=>[d,5]));
$('#doms').innerHTML=DOMS.map((d,i)=>'<div class="dom"><span class="nm">'+d+'</span>'+
'<input type="range" min="1" max="10" value="'+cur[d]+'" data-i="'+i+'"><span class="v" id="v'+i+'">'+arN(cur[d])+'</span></div>'+
'<div class="bar"><i style="width:'+cur[d]*10+'%;background:'+COLS[i]+'" id="b'+i+'"></i></div>').join('');
$('#doms').oninput=e=>{
 const i=e.target.dataset.i;if(i==null)return;
 cur[DOMS[i]]=+e.target.value;
 $('#v'+i).textContent=arN(e.target.value);
 $('#b'+i).style.width=e.target.value*10+'%';
};
$('#sv').onclick=()=>{
 H.unshift({at:Date.now(),v:{...cur}});SV('mi3yar',H);render();
};
function render(){
 const g=DOMS.map(d=>cur[d]);
 const mn=Math.min(...g),mx=Math.max(...g);
 const gaps=[];
 DOMS.forEach((d,i)=>{if(g[i]<=4)gaps.push({t:d,x:'منخفض ('+arN(g[i])+') — يحتاج خطة إنقاذ'})});
 if(mx-mn>=4)gaps.push({t:'الفجوة',x:'بين أعلى ('+arN(mx)+') وأدنى ('+arN(mn)+') = '+arN(mx-mn)+' — توازنك مائل'});
 $('#gaps').innerHTML=gaps.map(g=>'<div class="gap"><b style="color:var(--acc2)">'+g.t+'</b> — '+g.x+'</div>').join('')||
 '<div class="muted" style="margin-top:9px">توازن معقول — حافظ.</div>';
 const avg=(g.reduce((s,x)=>s+x,0)/g.length).toFixed(1);
 $('#stats').innerHTML='<span class="stat">متوسط: <b>'+arN(avg)+'</b></span>'+
 '<span class="stat">أعلى: <b>'+DOMS[g.indexOf(mx)]+'</b></span>'+
 '<span class="stat">أدنى: <b>'+DOMS[g.indexOf(mn)]+'</b></span>'+
 '<span class="stat">تقييمات سابقة: <b>'+arN(H.length)+'</b></span>';
}
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3yar" data-title="مِعيَر"></script>
</body>
</html>
