<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرهَف — ميزان الحساسية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px;width:100%}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.hr{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.hr .x{font-family:var(--font-ar);font-size:13px}
.hr .verd{font-size:10px;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:5px}
.hr .verd.d{background:var(--ok);color:#14140f}
.hr .verd.o{background:var(--acc2);color:#14140f}
.hr .meta{font-size:10px;color:var(--dim);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرهَف <span class="muted">— ميزان الحساسية</span></h2>
<div class="muted">تألمت من كلمة أو موقف — سجّله، ثم بعد تهدأ: كان جرحاً مستحقاً أم حساسية زائدة؟ البيانات تفضح ميلك.</div>
<div class="card"><div class="t">ألمك اليوم</div>
<input id="nm" placeholder="الموقف (قال فلان كلمة…)">
<button class="btn" id="ad" style="margin-top:9px">سجّله</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let H=LS('mirhaf',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 H.unshift({n,v:null,at:Date.now()});
 SV('mirhaf',H);$('#nm').value='';render();
};
function render(){
 const d=H.filter(x=>x.v==='d').length,o=H.filter(x=>x.v==='o').length,ud=H.filter(x=>!x.v).length;
 const pct=(d+o)?Math.round(o/(d+o)*100):0;
 $('#stats').innerHTML='<span class="stat">مستحق: <b style="color:var(--ok)">'+arN(d)+'</b></span>'+
 '<span class="stat">حساسية زائدة: <b style="color:var(--acc2)">'+arN(o)+'</b></span>'+
 '<span class="stat">بلا حكم: <b>'+arN(ud)+'</b></span>'+
 ((d+o)?'<span class="stat">نسبة المبالغة: <b>'+arN(pct)+'%</b></span>':'');
 $('#list').innerHTML=H.map((x,i)=>{
  const gi=H.indexOf(x);
  return '<div class="hr"><div class="x">'+esc(x.n)+'</div>'+
  (x.v?'<span class="verd '+(x.v==='d'?'d':'o')+'">'+(x.v==='d'?'مستحق':'حساسية زائدة')+'</span>':
   '<div style="display:flex;gap:6px;margin-top:6px">'+
   '<button class="btn ghost" data-v="d" data-i="'+gi+'" style="color:var(--ok);font-size:10px">جرح مستحق</button>'+
   '<button class="btn ghost" data-v="o" data-i="'+gi+'" style="color:var(--acc2);font-size:10px">حساسية زائدة</button></div>')+
  '</div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا مواقف — سجّلها وهي طرية.</div>';
}
$('#list').onclick=e=>{
 const v=e.target.closest('[data-v]');if(!v)return;
 H[+v.dataset.i].v=v.dataset.v;SV('mirhaf',H);render();
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mirhaf" data-title="مِرهَف"></script>
</body>
</html>
