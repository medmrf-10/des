<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>إقرأ — مكتبة المتون</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:800px;margin:0 auto;padding:14px}
.shelf{display:grid;gap:8px}
.bk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.bk:hover{border-color:var(--acc)}
.bk .t{font-family:var(--font-ar);font-size:14.5px;font-weight:700;flex:1;line-height:1.7}
.bk .m{font-size:11px;color:var(--dim);white-space:nowrap}
.bk .pb{width:60px;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.bk .pb i{display:block;height:100%;background:var(--ok)}
.reader .rh{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--border);z-index:5;display:flex;gap:8px;align-items:center}
.reader .rh .t{flex:1;font-family:var(--font-ar);font-size:15px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}
.chip2{border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:11.5px;white-space:nowrap;cursor:pointer;color:var(--txt);background:var(--card)}
.chip2.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.text{font-family:var(--font-ar);font-size:17px;line-height:2.3;padding:16px 4px}
.text .unit{font-size:13px;color:var(--acc2);margin:18px 0 6px;font-weight:700}
.text p{margin:0 0 14px;text-align:justify}
.fs{display:flex;gap:6px}
.fs button{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:13px}
.back{background:none;border:none;color:var(--acc2);cursor:pointer;font-family:inherit;font-size:14px}
.muted{color:var(--dim);font-size:12px}
mark{background:rgba(201,162,75,.4);color:#fff;border-radius:2px}
</style>
</head>
<body>
<h1 style="font-size:19px;margin:4px 0;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">إقرأ — مكتبة المتون</h1>
<div class="muted">نصوص المتون كاملة — موضع قراءتك يُحفظ لكل كتاب</div>
<div id="app"></div>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let BOOKS=null,BABS=null,POS={},book=null,texts=null,babIx=0;
try{POS=JSON.parse(localStorage.getItem('iqra_pos')||'{}')}catch(e){POS={}}
const savePos=()=>localStorage.setItem('iqra_pos',JSON.stringify(POS));
async function jget(u){const r=await fetch(u);return r.json()}
function fileFor(id){const m=id.match(/(\d+)$/);if(!m)return null;
 return id.startsWith('suf-')?`texts/suf${m[1]}.js`:`texts/${m[1]}.js`}
async function boot(){
 const d=await jget('../akida/real_data.json');
 BOOKS=d.books;BABS=d.babs;
 // file existence is unknown until fetch — show all; bad links show error state
 const withFile=Object.values(BOOKS).filter(b=>fileFor(b.id));
 // مكتبة
 let html='<div class="shelf">';
 for(const b of Object.values(BOOKS)){
  const f=fileFor(b.id);if(!f)continue;
  const pos=POS[b.id];const pct=pos&&b.nAtoms?Math.round(pos/b.nAtoms*100):0;
  html+=`<div class="bk" onclick="openBook('${b.id}')">
   <div style="flex:1"><div class="t">${esc(b.title)}</div><div class="m">${esc(b.author||'')} · ${b.nAtoms||'؟'} ذرة</div></div>
   <div><div class="m" style="text-align:left">${pct?pct+'٪':''}</div><div class="pb"><i style="width:${pct}%"></i></div></div></div>`}
 html+='</div>';
 $('#app').innerHTML=html;
 const h=location.hash.match(/b=([^&]+)/);
 if(h)openBook(decodeURIComponent(h[1]))}
async function openBook(id){
 book=BOOKS[id]||Object.values(BOOKS).find(b=>b.id===id)||id;
 const bid=book.id||id;
 location.hash='b='+encodeURIComponent(bid);
 $('#app').innerHTML='<div class="muted" style="padding:30px;text-align:center">يُحمَّل الكتاب…</div>';
 // حمّل ملف النصوص
 await new Promise(res=>{
  const s=document.createElement('script');
  s.src='../akida/'+fileFor(bid);
  s.onload=res;s.onerror=res;document.head.appendChild(s)});
 texts=(window.AQIDA_TEXTS||{})[bid.replace(/^soufia-/,'').replace(/^suf-/,'')]||null;
 if(!texts){
  const num=(bid.match(/(\d+)$/)||[])[1];
  const keys=Object.keys(window.AQIDA_TEXTS||{});
  const kk=keys.find(k=>bid.endsWith(k)||bid.includes(k))||(num&&keys.find(k=>k.endsWith(num)));
  if(kk)texts=window.AQIDA_TEXTS[kk];
 }
 render()}
function render(){
 if(!book)return;
 const babs=(BABS[book.code]||[]);
 const keys=Object.keys((texts&&texts.atoms)||{});
 let html=`<div class="reader"><div class="rh">
  <button class="back" onclick="boot()">→ المكتبة</button>
  <div class="t">${esc(book.title)}</div>
  <div class="fs"><button onclick="fsize(-1)">أ-</button><button onclick="fsize(1)">أ+</button></div></div>`;
 if(babs.length){
  html+=`<div class="chips">${babs.map((b,i)=>`<span class="chip2 ${i===babIx?'on':''}" onclick="toBab(${i})">${esc(b.bab.slice(0,34))}</span>`).join('')}</div>`}
 html+='<div class="text" id="txt">';
 if(texts&&texts.atoms){
  const atoms=Object.entries(texts.atoms).sort((a,b)=>{const na=parseFloat(a[0].match(/[\d.]+/)||0),nb=parseFloat(b[0].match(/[\d.]+/)||0);return na-nb});
  const babUnits=(babs[babIx]&&babs[babIx].units)||[];
  for(const[aid,a]of atoms){
   const tx=(a.x||[]).map(x=>x[1]).join('\n');
   if(!tx.trim())continue;
   const pages=a.pg?` <span class="muted">ص${a.pg[0]}</span>`:'';
   html+=`<div class="unit">${esc(aid)}${pages}</div><p>${esc(tx).replace(/\r?\n+/g,'<br>')}</p>`}
 }else{
  html+='<div class="muted" style="text-align:center;padding:40px">نص الكتاب كاملاً غير متاح بعد — المتاح: الذرات المعالجة في «المصادر»</div>'}
 html+='</div></div>';
 $('#app').innerHTML=html;
 // استأنف الموضع
 const pos=POS[book.id];
 if(pos&&texts){
  const keys=Object.keys(texts.atoms);const ix=Math.min(pos,keys.length-1);
  const els=document.querySelectorAll('.text .unit');
  if(els[ix])els[ix].scrollIntoView({block:'start'})}
 // تتبع الموضع بالتمرير
 const units=document.querySelectorAll('.text .unit');
 window.onscroll=()=>{
  let ix=0;units.forEach((u,i)=>{if(u.getBoundingClientRect().top<innerHeight/2)ix=i});
  POS[book.id]=ix;savePos()}}
function toBab(i){babIx=i;render();scrollTo(0,0)}
function fsize(d){const el=$('#txt');const s=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=Math.max(13,Math.min(26,s+d*1.5))+'px'}
window.openBook=openBook;window.boot=boot;window.toBab=toBab;window.fsize=fsize;
boot();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="iqraa" data-title="إقرأ — مكتبة المتون"></script>
</body>
</html>
