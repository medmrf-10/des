<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِطوَق — عقد الذاكرة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.flash{background:linear-gradient(135deg,var(--card),var(--card2));border:2px solid var(--acc);border-radius:16px;padding:24px;margin-top:12px;text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.flash .fr{font-family:var(--font-ar);font-size:17px;line-height:1.9}
.flash .bk{font-family:var(--font-ar);font-size:14px;color:var(--dim);margin-top:12px;display:none}
.flash.show .bk{display:block}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.queue{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-top:8px;font-size:11.5px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِطوَق <span class="muted">— عقد الذاكرة</span></h2>
<div class="muted">لآلئك أنت — اقتباسات وأسماء وحقائق تكتبها، تُراجعها بالتباعد فلا تنسى.</div>
<div class="card"><div class="t">لؤلؤة جديدة</div>
<input id="fr" placeholder="الوجه: سؤال / كلمة / اقتباس">
<textarea id="bk" placeholder="الخلف: جواب / معنى / مصدر"></textarea>
<button class="btn" id="add" style="margin-top:9px">ألحق بالعقد</button></div>
<div id="now"></div>
<div id="stats"></div>
<div class="card"><div class="t">العقد</div><div id="list"></div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let P=LS('mitwaq',[]);
const DAYS=[1,2,4,7,15,30];
$('#add').onclick=()=>{
 const f=$('#fr').value.trim(),b=$('#bk').value.trim();if(!f)return;
 P.unshift({f,b,idx:0,due:today(),n:0});
 SV('mitwaq',P);$('#fr').value='';$('#bk').value='';render();
};
const due=()=>P.filter(p=>p.due<=today());
let cur=null;
function show(){
 const d=due();
 cur=d[0]||null;
 $('#now').innerHTML=cur?'<div class="flash" id="fl"><div class="fr">'+esc(cur.f)+'</div><div class="bk">'+esc(cur.b||'—')+'</div></div>'+
 '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">'+
 '<button class="btn ghost" data-g="1" style="color:var(--acc2)">نسيتها</button>'+
 '<button class="btn" data-g="2">عرفتها</button></div>':
 '<div class="muted" style="margin-top:12px;text-align:center">'+(P.length?'لا مستحق اليوم — العقد هادئ':'أضف لآلئك أولاً')+'</div>';
 const fl=$('#fl');if(fl)fl.onclick=()=>fl.classList.add('show');
}
$('#now').onclick=e=>{
 const b=e.target.closest('[data-g]');if(!b||!cur)return;
 if(+b.dataset.g===1){cur.idx=0;cur.due=today()}
 else{cur.idx=Math.min(cur.idx+1,DAYS.length-1);const d=new Date();d.setDate(d.getDate()+DAYS[cur.idx]);cur.due=d.toISOString().slice(0,10)}
 cur.n++;SV('mitwaq',P);show();render();
};
function render(){
 const d=due();
 $('#stats').innerHTML='<span class="stat">لآلئ: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">مستحق اليوم: <b>'+arN(d.length)+'</b></span>'+
 '<span class="stat">متقنة (٣٠ يوماً): <b>'+arN(P.filter(p=>p.idx>=5).length)+'</b></span>';
 $('#list').innerHTML=P.slice(0,15).map(p=>'<div class="queue">'+esc(p.f)+' <span class="muted">— مرحلة '+arN(p.idx)+' · تستحق '+p.due+'</span></div>').join('')||'<div class="muted">العقد فارغ.</div>';
}
render();show();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mitwaq" data-title="مِطوَق"></script>
</body>
</html>
