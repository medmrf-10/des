<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>نصوص — تفريغات الدروس</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
html,body{overflow-x:hidden}
body{max-width:860px;margin:0 auto;padding:14px}
.sr{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin:8px 0;cursor:pointer}
.sr:hover{border-color:var(--acc)}
.sr .t{font-family:var(--font-ar);font-size:15px}
.sr .n{font-size:11px;color:var(--dim);margin-top:4px}
.ls{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin:6px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.ls:hover{border-color:var(--acc)}
.ls .t{font-family:var(--font-ar);font-size:13.5px}
.ls .sz{font-size:10px;color:var(--dim)}
#tx{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:18px 20px;font-family:var(--font-ar);font-size:15.5px;line-height:2.2;white-space:pre-wrap;margin-top:12px;max-height:70vh;overflow-y:auto}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:11px;padding:11px 15px;font-family:var(--font-ar);font-size:14px;margin-top:10px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.muted{color:var(--dim);font-size:12px}
mark{background:rgba(201,162,75,.4);color:#fff;border-radius:2px;padding:0 2px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">نصوص <span class="muted" style="font-weight:400;font-size:12px">— تفريغات agy للدروس</span></h2>
<div class="muted">كل درس فُرّغ بالوكيل تجد نصّه الكامل هنا للقراءة والبحث — يتحدّث تلقائياً كلما اكتمل تفريع جديد.</div>
<input class="inp" id="q" placeholder="ابحث داخل كل التفريغات…">
<div id="view"></div>
<div id="tx" style="display:none"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let IDX=null;
async function idx(){if(!IDX)IDX=await(await fetch('data/index.json')).json();return IDX}
const TXT={};
async function txt(f){if(!TXT[f])TXT[f]=await(await fetch('data/'+f)).text();return TXT[f]}
function home(){
 $('#tx').style.display='none';$('#view').style.display='';
 idx().then(I=>{
  $('#view').innerHTML='<div class="muted" style="margin:8px 0">'+Object.keys(I).length.toLocaleString('ar-EG')+' سلسلة · '+Object.values(I).flat().length.toLocaleString('ar-EG')+' تفريغاً — والمزيد يُنجَز تباعاً:</div>'+
  Object.keys(I).map(s=>`<div class="sr" data-s="${esc(s)}"><div class="t">${esc(s.replace(/^\d+_/,'').replace(/_/g,' '))}</div><div class="n">${I[s].length.toLocaleString('ar-EG')} درساً · ${Math.round(I[s].reduce((a,x)=>a+x.sz,0)/1024).toLocaleString('ar-EG')} ك.ب</div></div>`).join('')})}
function showSeries(s){
 idx().then(I=>{
  $('#view').innerHTML=`<button class="btn" onclick="home()" style="margin-bottom:10px">→ السلاسل</button>
  <h3 style="font-family:var(--font-ar);margin:8px 0">${esc(s.replace(/^\d+_/,'').replace(/_/g,' '))}</h3>`+
  I[s].map(x=>`<div class="ls" data-f="${esc(x.f)}"><span class="t">${esc(x.n)}</span><span class="sz">${Math.round(x.sz/1024)}k</span></div>`).join('')})}
async function showFile(f){
 const t=await txt(f);
 $('#view').style.display='none';
 const tx=$('tx');tx.style.display='block';
 tx.innerHTML=`<button class="btn" onclick="document.querySelector('#tx').style.display='none';document.querySelector('#view').style.display=''" style="margin-bottom:10px">→ رجوع</button><div>${esc(t)}</div>`;
 tx.scrollIntoView()}
async function search(){
 const q=$('q').value.trim();
 if(q.length<3){home();return}
 const I=await idx();
 const out=[];
 for(const s in I)for(const x of I[s]){
  const t=await txt(x.f);
  if(t.includes(q)){const i=t.indexOf(q);
   out.push({f:x.f,n:x.n,snip:t.slice(Math.max(0,i-60),i+100)})}}
 $('#view').innerHTML='<div class="muted" style="margin:8px 0">'+out.length.toLocaleString('ar-EG')+' نتيجة:</div>'+
 out.map(x=>`<div class="ls" data-f="${esc(x.f)}"><div><div class="t">${esc(x.n)}</div><div style="font-size:11px;color:var(--dim);margin-top:4px">${esc(x.snip).replace(esc(q),'<mark>'+esc(q)+'</mark>')}</div></div></div>`).join('')}
$('#view').onclick=e=>{
 const s=e.target.closest('.sr');if(s){showSeries(s.dataset.s);return}
 const l=e.target.closest('.ls');if(l)showFile(l.dataset.f)};
let deb;$('q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(search,400)});
home();window.home=home;
</script>
<script src="../shared/feedback.js" data-pid="nusus" data-title="نصوص"></script>
</body>
</html>
