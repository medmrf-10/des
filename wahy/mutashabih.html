<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>المتشابهات القرآنية — وحي</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:980px;margin:0 auto;padding:14px}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0}
.pick select,.pick input{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:9px 12px;font:inherit}
.pick input{width:80px}
.vrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:9px;cursor:pointer}
.vrow:hover{border-color:var(--acc)}
.vrow .a{flex:none;width:30px;height:30px;border-radius:8px;background:var(--card2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.vrow .t{flex:1;font-size:14.5px;line-height:2}
.vrow .sc{flex:none;color:var(--dim);font-size:11.5px;direction:ltr;padding-top:6px}
.cmp{background:var(--card2);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;margin:-4px 0 12px}
.cmp .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.cmp .pair{grid-template-columns:1fr}}
.cmp .cell{background:var(--card);border-radius:10px;padding:10px 12px}
.cmp .cell .lab{font-size:11px;color:var(--dim);margin-bottom:6px}
.cmp .cell .tx{font-size:14px;line-height:2}
.cmp .cell .tx mark{background:rgba(201,162,75,.28);color:var(--acc2);border-radius:3px;padding:0 1px}
.bar{height:4px;background:var(--card);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.srch{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:9px 12px;font:inherit}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h1 style="font-size:18px;margin:6px 0 2px;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">المتشابهات القرآنية</h1>
<div class="muted">١,٥٠٥ آيات لها نظائر بالألفاظ — اضغط أيّة لعرض نظائرها جنباً إلى جنب بتمييز المشترك</div>
<div class="pick">
 <select id="surah"></select>
 <input id="aya" type="number" min="1" placeholder="آية">
 <input class="srch" id="sq" placeholder="أو ابحث بلفظ من الآية…">
</div>
<div id="stat" class="muted" style="padding:6px 0"></div>
<div id="list"></div>
<script src="mutashabih.js"></script>
<script>
const NAMES=MUTA.names,SIM=MUTA.sim;
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sel=document.getElementById('surah');
sel.innerHTML='<option value="">كل السور</option>'+Object.keys(NAMES).map(n=>`<option value="${n}">${n}. ${NAMES[n]}</option>`).join('');
sel.onchange=()=>{document.getElementById('aya').value='';render()};
document.getElementById('aya').oninput=render;
let to=null;document.getElementById('sq').addEventListener('input',e=>{clearTimeout(to);to=setTimeout(render,300)});
const byK={};for(const k in SIM)byK[k]=SIM[k];
function markWords(txt,refTxt){
 const ref=new Set(refTxt.split(/\s+/).map(norm));
 return esc(txt).split(/\s+/).map(w=>ref.has(norm(w))?'<mark>'+w+'</mark>':w).join(' ');
}
function render(){
 const s=sel.value,a=+document.getElementById('aya').value||0,q=document.getElementById('sq').value.trim();
 let keys=Object.keys(SIM);
 if(s)keys=keys.filter(k=>SIM[k][0]==s);
 if(a)keys=keys.filter(k=>SIM[k][0]==s&&SIM[k][1]==a);
 if(q){const nq=norm(q);keys=keys.filter(k=>norm(SIM[k][2]).includes(nq))}
 document.getElementById('stat').textContent=keys.length.toLocaleString('ar-EG')+' آية لها نظائر';
 document.getElementById('list').innerHTML=keys.slice(0,80).map(k=>{
  const[s,a,t,sims]=SIM[k];
  return `<div class="vrow" data-k="${k}" onclick="expand(this)"><span class="a">${a.toLocaleString('ar-EG')}</span><span class="t"><span class="muted">${NAMES[s]} ${s}:${a}</span><br>${esc(t)}</span><span class="sc">${sims.length} نظائر — أعلاها ${(sims[0][1]*100).toFixed(0)}%</span></div><div class="cmp" style="display:none" data-for="${k}"></div>`
 }).join('');
}
window.expand=function(row){
 const k=row.dataset.k;const box=row.nextElementSibling;
 if(box.style.display==='block'){box.style.display='none';return}
 const[s,a,t,sims]=SIM[k];
 box.innerHTML=sims.map(([k2,sc])=>{
  const[s2,a2,t2]=byK[k2]||[0,0,''];
  const other=byK[k2]?t2:(k2);
  return `<div class="pair"><div class="cell"><div class="lab">${NAMES[s]} ${s}:${a}</div><div class="tx">${markWords(t,other)}</div></div><div class="cell"><div class="lab">${NAMES[s2]||''} ${s2?`${s2}:${a2}`:k2} — تشابه ${(sc*100).toFixed(0)}%</div><div class="tx">${markWords(other,t)}</div></div></div><div class="bar"><i style="width:${(sc*100)}%"></i></div>`
 }).join('');
 box.style.display='block';
}
render();
</script>
<script src="../shared/feedback.js"></script>
</body>
</html>
