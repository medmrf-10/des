<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِردَد — الصدى</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.sent{background:var(--card);border:1px solid var(--acc);border-radius:13px;padding:18px;margin-top:12px;text-align:center}
.sent .en{font-family:var(--font-ui);font-size:19px;line-height:1.7;direction:ltr}
.sent .ar{font-size:12px;color:var(--dim);margin-top:8px}
.ctl{display:flex;gap:9px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.prog{height:6px;background:var(--card2);border-radius:3px;margin-top:12px;overflow:hidden}
.prog .f{height:100%;background:var(--acc)}
select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 14px;font-family:var(--font-ar);font-size:12.5px;width:100%;margin-top:8px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِردَد <span class="muted">— الصدى</span></h2>
<div class="muted">تقنية الظل: استمع ← كرّر بصوتك ← تقدّم. تدريب النطق الفعلي، لا الفهم السلبي.</div>
<div class="card"><div class="t">جلسة صدى</div>
<select id="lv"><option value="0">سهلة — جمل يومية قصيرة</option><option value="1">متوسطة — جمل مركبة</option><option value="2">متقدمة — جمل التحدي</option></select>
<button class="btn" id="start" style="margin-top:9px">ابدأ ١٠ جمل</button></div>
<div id="out"></div>
<div id="stats"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const SETS=[
 [["Good morning, how are you today?","صباح الخير، كيف حالك اليوم؟"],["I would like a cup of tea, please.","أريد كوب شاي من فضلك."],["Where is the nearest mosque?","أين أقرب مسجد؟"],["Can you help me, please?","هل يمكنك مساعدتي؟"],["I am learning English every day.","أتعلم الإنجليزية كل يوم."],["Thank you very much for your help.","شكراً جزيلاً على مساعدتك."],["What time is it now?","كم الساعة الآن؟"],["I need to go to the market.","أحتاج الذهاب للسوق."],["This is my first time here.","هذه أول مرة لي هنا."],["See you tomorrow, God willing.","أراك غداً إن شاء الله."]],
 [["Although the weather was cold, we went out for a long walk.","رغم برودة الطقس خرجنا في مشي طويل."],["She has been studying medicine for three years now.","تدرس الطب منذ ثلاث سنوات."],["If I had known earlier, I would have told you.","لو عرفت مبكراً لأخبرتك."],["The book that you gave me was really interesting.","الكتاب الذي أعطيتني إياه كان شيقاً."],["We should have finished this work yesterday.","كان يجب أن ننهي العمل أمس."],["He asked me whether I had ever been to Algeria.","سألني إن كنت زرت الجزائر من قبل."],["It is important to practice speaking every single day.","من المهم ممارسة التحدث كل يوم."],["By the time you arrive, the lesson will have started.","عند وصولك سيكون الدرس قد بدأ."],["I am looking forward to hearing from you soon.","أتطلع لسماع منك قريباً."],["The more you practice, the better you become.","كلما تدربت أكثر تحسنت أكثر."]],
 [["Had it not been for his guidance, none of this would have been possible.","لولا هدايته لما كان أي من هذا ممكناً."],["Not only did she finish the project early, but she also helped her colleagues.","لم تنهِ المشروع مبكراً فحسب بل ساعدت زملاءها أيضاً."],["The findings, which were published last year, challenge the conventional wisdom.","النتائج المنشورة العام الماضي تتحدى الفهم التقليدي."],["Were I to choose again, I would pick the same path without hesitation.","لو اخترت مجدداً لاخترت نفس الطريق دون تردد."],["His argument rests on the assumption that people always act rationally.","حجته مبنية على افتراض أن الناس يتصرفون بعقلانية دائماً."]]];
let cur=[],ix=0;
let stats=LS('mirdad',{n:0,lvl:{}});
function speak(t,cb){
 const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;
 u.onend=cb||null;speechSynthesis.cancel();speechSynthesis.speak(u);
}
$('#start').onclick=()=>{
 const set=SETS[+$('#lv').value];
 cur=set.slice().sort(()=>Math.random()-.5).slice(0,10);ix=0;show();
};
function show(){
 if(ix>=cur.length){
  stats.n+=cur.length;stats.lvl[+$('#lv').value]=(stats.lvl[+$('#lv').value]||0)+cur.length;SV('mirdad',stats);
  $('#out').innerHTML='<div class="sent"><div class="en" style="font-size:15px">🏁 انتهت الجلسة — '+arN(cur.length)+' جملة كرّرتها بصوتك</div><div class="ar">جلسة أخرى؟</div></div>';
  renderStats();return;
 }
 const[s,ar]=cur[ix];
 $('#out').innerHTML='<div class="sent"><div class="en">'+s+'</div><div class="ar">'+ar+'</div></div>'+
 '<div class="prog"><div class="f" style="width:'+(ix/cur.length*100)+'%"></div></div>'+
 '<div class="muted" style="text-align:center;margin-top:8px">'+arN(ix+1)+' من '+arN(cur.length)+'</div>'+
 '<div class="ctl"><button class="btn" id="hear">🔊 استمع</button>'+
 '<button class="btn" id="rep">🔁 أعد استماعاً</button>'+
 '<button class="btn ghost" id="nxt">كرّرتها بصوتي — التالية</button></div>';
 $('#hear').onclick=()=>speak(s);
 $('#rep').onclick=()=>speak(s);
 $('#nxt').onclick=()=>{ix++;show()};
 renderStats();
}
function renderStats(){
 $('#stats').innerHTML='<span class="stat">جمل كرّرتها كلياً: <b>'+arN(stats.n)+'</b></span>'+
 Object.keys(stats.lvl).map(l=>'<span class="stat">مستوى '+arN(+l+1)+': <b>'+arN(stats.lvl[l])+'</b></span>').join('');
}
renderStats();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mirdad" data-title="مِردَد"></script>
</body>
</html>
