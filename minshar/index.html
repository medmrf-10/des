<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنشَر — مدونتي الصغيرة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.post{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-top:9px}
.post .tx{font-family:var(--font-ar);font-size:13.5px;line-height:1.9;white-space:pre-wrap}
.post .meta{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:10.5px;color:var(--dim)}
.post .pin{margin-right:auto;cursor:pointer;font-size:12px}
.post.pinned{border-color:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.cnt{font-size:10px;color:var(--dim);text-align:left}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنشَر <span class="muted">— مدونتي الصغيرة</span></h2>
<div class="muted">لو كانت لك مدونة — ماذا ستنشر اليوم؟ اكتب كأنها منشورة، لكنها لك وحدك. ثبّت أعمدتك الأساسية.</div>
<div class="card"><div class="t">منشور</div>
<textarea id="tx" placeholder="اكتب كأن الناس يقرأون…"></textarea>
<div style="display:flex;gap:8px;align-items:center;margin-top:9px">
<button class="btn" id="ad">انشِر لنفسك</button><span class="cnt" id="cnt"></span></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('minshar',[]);
const fmt=t=>new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
$('#tx').oninput=()=>{$('#cnt').textContent=arN($('#tx').value.length)+' حرفاً'};
$('#ad').onclick=()=>{
 const tx=$('#tx').value.trim();if(!tx)return;
 P.unshift({tx,at:Date.now(),pin:false});
 SV('minshar',P);$('#tx').value='';$('#cnt').textContent='';render();
};
function render(){
 const tot=P.reduce((s,x)=>s+x.tx.length,0);
 $('#stats').innerHTML='<span class="stat">منشورات: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">حروف: <b style="color:var(--acc)">'+arN(tot)+'</b></span>'+
 '<span class="stat">مثبتة: <b>'+arN(P.filter(x=>x.pin).length)+'</b></span>';
 const sorted=P.map((x,i)=>({x,i})).sort((a,b)=>(b.x.pin?1:0)-(a.x.pin?1:0)||b.x.at-a.x.at);
 $('#list').innerHTML=sorted.slice(0,15).map(({x,i})=>'<div class="post'+(x.pin?' pinned':'')+'">'+
 '<div class="tx">'+esc(x.tx)+'</div>'+
 '<div class="meta">'+fmt(x.at)+'<span class="pin" data-p="'+i+'">'+(x.pin?'📌':'📍')+'</span>'+
 '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2);padding:3px 8px;font-size:10px">✕</button></div></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا منشورات — اكتب أول منشور لنفسك.</div>';
}
$('#list').onclick=e=>{
 const p=e.target.closest('[data-p]'),d=e.target.closest('[data-d]');
 if(p){P[+p.dataset.p].pin=!P[+p.dataset.p].pin;SV('minshar',P);render();return}
 if(d&&confirm('احذف؟')){P.splice(+d.dataset.d,1);SV('minshar',P);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="minshar" data-title="مِنشَر"></script>
</body>
</html>
