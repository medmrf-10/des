<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>x</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14; --card:#131a22; --card2:#1a2330; --border:#28323f; --txt:#eef3f8; --dim:#93a1b3; --acc:#8b7cf6; --acc2:#5ec8ff}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; background:radial-gradient(1200px 500px at 80% -10%, rgba(139,124,246,.08), transparent), var(--bg); color:var(--txt); min-height:100vh}
.wrap{max-width:560px; margin:0 auto; padding:26px 14px 60px}
h1{font-size:1.15rem; font-weight:700; background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.sub{color:var(--dim); font-size:.72rem; margin-top:4px; margin-bottom:22px}
.item{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px 16px; margin-bottom:12px; animation:enter .35s cubic-bezier(.22,1,.36,1) both}
@keyframes enter{from{opacity:0; transform:translateY(10px)}}
.item .d{color:var(--dim); font-size:.65rem; margin-bottom:7px}
.item .t{font-size:.88rem; font-weight:600; line-height:1.7}
.item .l{display:block; margin-top:9px; color:var(--acc2); font-size:.78rem; word-break:break-all; text-decoration:none; direction:ltr; text-align:left}
.item .l:hover{text-decoration:underline}
.item .note{margin-top:8px; font-size:.75rem; color:#a9b8c7; line-height:1.8; border-inline-start:2px solid var(--border); padding-inline-start:9px}
.empty{text-align:center; color:var(--dim); padding:60px 0; font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>الوارد الخاص</h1>
  <div class="sub">روابط ورسائل لا تُرسَل عبر القنوات المحظورة</div>
  <div id="list"><div class="empty">لا رسائل بعد</div></div>
</div>
<script>
/* ITEMS — يُحدَّث بالنشر: {d: 'التاريخ', t: 'العنوان', l: 'الرابط', note: 'ملاحظة'} */
const ITEMS=[
];
const L=ITEMS.slice().reverse();
if(L.length){
  document.getElementById('list').innerHTML=L.map(i=>`<div class="item"><div class="d">${i.d||''}</div><div class="t">${i.t||''}</div>${i.l?`<a class="l" href="${i.l}" target="_blank">${i.l}</a>`:''}${i.note?`<div class="note">${i.note}</div>`:''}</div>`).join('');
}
</script>
</body>
</html>
