<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسجِل — سجل الأيام</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.sc{display:flex;gap:4px;margin-top:9px}
.sc i{flex:1;height:34px;border-radius:8px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-ar);font-size:12px;cursor:pointer}
.sc i.on{background:var(--acc);border-color:var(--acc);color:#14140f;font-weight:700}
.dy{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-top:6px;display:flex;gap:10px;align-items:center}
.dy .sc2{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-ar);font-size:13px;flex-shrink:0}
.dy .x{flex:1;font-family:var(--font-ar);font-size:12.5px}
.dy .dt{font-size:10px;color:var(--dim)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسجِل <span class="muted">— سجل الأيام</span></h2>
<div class="muted">قبل النوم: قيّم يومك ١-١٠ + سطر واحد. ٣٠ ثانية — والذاكرة لا تكذب عليك.</div>
<div class="card"><div class="t">يومك اليوم</div>
<div class="sc" id="sc"></div>
<input id="ln" placeholder="سطر واحد: كيف كان؟">
<button class="btn" id="ad" style="margin-top:9px">سجّل اليوم</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let D=LS('misjil',{}),cur=0;
const today=()=>new Date().toISOString().slice(0,10);
const cols=s=>s>=8?'var(--ok)':s>=5?'var(--acc)':'var(--acc2)';
$('#sc').innerHTML=Array.from({length:10},(_,i)=>'<i data-s="'+(i+1)+'">'+(i+1)+'</i>').join('');
$('#sc').onclick=e=>{
 const s=e.target.closest('[data-s]');if(!s)return;
 cur=+s.dataset.s;
 document.querySelectorAll('#sc i').forEach(i=>i.classList.toggle('on',+i.dataset.s<=cur));
};
$('#ad').onclick=()=>{
 if(!cur)return;
 const t=today();
 D[t]={s:cur,ln:$('#ln').value.trim()};
 SV('misjil',D);$('#ln').value='';render();
};
function render(){
 const ks=Object.keys(D).sort().reverse();
 const avg=ks.length?Math.round(ks.reduce((s,k)=>s+D[k].s,0)/ks.length*10)/10:0;
 const wk=ks.filter(k=>(Date.now()-new Date(k))/864e5<7);
 const wavg=wk.length?Math.round(wk.reduce((s,k)=>s+D[k].s,0)/wk.length*10)/10:0;
 const td=today();
 $('#stats').innerHTML='<span class="stat">أيام مسجلة: <b>'+arN(ks.length)+'</b></span>'+
 '<span class="stat">متوسط الأسبوع: <b style="color:'+cols(wavg)+'">'+arN(wavg)+'</b></span>'+
 '<span class="stat">متوسط الكل: <b>'+arN(avg)+'</b></span>'+
 (D[td]?'<span class="stat">اليوم سجلته: <b style="color:var(--ok)">'+arN(D[td].s)+'</b></span>':'');
 $('#list').innerHTML=ks.slice(0,14).map(k=>'<div class="dy"><span class="sc2" style="background:'+cols(D[k].s)+';color:#14140f">'+D[k].s+'</span>'+
 '<span class="x">'+(D[k].ln?esc(D[k].ln):'<span class="muted">—</span>')+'</span>'+
 '<span class="dt">'+new Date(k).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+'</span></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا أيام — ابدأ اليوم.</div>';
}
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="misjil" data-title="مِسجِل"></script>
</body>
</html>
