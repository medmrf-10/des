<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشرَد — ركنة الخواطر</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.th{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-top:8px;display:flex;gap:10px;align-items:center}
.th .tx{flex:1;font-family:var(--font-ar);font-size:13px;line-height:1.7}
.th .tm{font-size:10px;color:var(--dim);white-space:nowrap}
.th .act{display:flex;gap:6px}
.focus{background:linear-gradient(135deg,var(--card),var(--card2));border:2px solid var(--acc);border-radius:14px;padding:16px;margin-top:12px;text-align:center}
.focus .lbl{font-size:10.5px;color:var(--acc)}
.focus .ct{font-family:var(--font-ui);font-size:30px;font-weight:700;color:var(--txt);margin:8px 0}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشرَد <span class="muted">— ركنة الخواطر</span></h2>
<div class="muted">خاطر يشوّش تركيزك؟ اركنه هنا فوراً — لا تحاربه، أجّله. بعد الجلسة راجع الركنة.</div>
<div class="card"><div class="t">جلسة تركيز</div>
<div style="display:flex;gap:8px;align-items:center">
<button class="btn" id="f25">٢٥ دقيقة</button>
<button class="btn ghost" id="f50" style="flex:1">٥٠ دقيقة</button></div></div>
<div id="focus"></div>
<div class="card"><div class="t">اركن خاطراً</div>
<input id="th" placeholder="ذكرت أن عليّ…، فكرت في…، خشيت أن…">
<button class="btn" id="park" style="margin-top:9px">اركن وارجع للتركيز</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let T=LS('mishrad',[]);
let foc=LS('mishrad_foc',{until:0,total:0});
function tick(){
 const rem=foc.until-Date.now();
 if(rem<=0){foc.until=0;SV('mishrad_foc',foc);renderFocus();return}
 const m=Math.floor(rem/60000),s=Math.floor(rem%60000/1000);
 $('#focus').innerHTML='<div class="focus"><div class="lbl">تركيز جارٍ — لا تشوش</div><div class="ct">'+m+':'+String(s).padStart(2,'0')+'</div>'+
 '<button class="btn ghost" id="stopf">أنهِ</button></div>';
 $('#stopf').onclick=()=>{foc.until=0;SV('mishrad_foc',foc);renderFocus()};
}
function renderFocus(){if(!foc.until)$('#focus').innerHTML=''}
$('#f25').onclick=()=>{foc={until:Date.now()+25*60000,total:25};SV('mishrad_foc',foc);tick()};
$('#f50').onclick=()=>{foc={until:Date.now()+50*60000,total:50};SV('mishrad_foc',foc);tick()};
setInterval(tick,1000);
$('#park').onclick=()=>{
 const t=$('#th').value.trim();if(!t)return;
 T.unshift({t,at:Date.now(),st:'parked'});
 SV('mishrad',T);$('#th').value='';render();
};
const ago=at=>{const m=Math.floor((Date.now()-at)/60000);return m<60?arN(m)+'د':arN(Math.floor(m/60))+'س'};
function render(){
 const parked=T.filter(t=>t.st==='parked').length,done=T.filter(t=>t.st==='done').length,drop=T.filter(t=>t.st==='drop').length;
 $('#stats').innerHTML='<span class="stat">مركون: <b>'+arN(parked)+'</b></span>'+
 '<span class="stat">عولج: <b>'+arN(done)+'</b></span>'+
 '<span class="stat">تبخّر (لم يكن مهماً): <b>'+arN(drop)+'</b></span>';
 $('#list').innerHTML=T.slice(0,20).map((t,i)=>{
  if(t.st!=='parked')return '<div class="th" style="opacity:.5"><div class="tx" style="text-decoration:line-through">'+esc(t.t)+'</div><span class="tm">'+(t.st==='done'?'عولج':'تبخّر')+'</span></div>';
  return '<div class="th"><div class="tx">'+esc(t.t)+'</div><span class="tm">'+ago(t.at)+'</span>'+
  '<div class="act"><button class="btn ghost" data-d="'+i+'">عولج</button>'+
  '<button class="btn ghost" data-x="'+i+'" style="color:var(--acc2)">تبخّر</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">ركنة فارغة — عقل صافٍ.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');if(d){T[+d.dataset.d].st='done';SV('mishrad',T);render();return}
 const x=e.target.closest('[data-x]');if(x){T[+x.dataset.x].st='drop';SV('mishrad',T);render()}
};
$('#th').addEventListener('keydown',e=>{if(e.key==='Enter')$('#park').click()});
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mishrad" data-title="مِشرَد"></script>
</body>
</html>
