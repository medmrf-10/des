<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مرصاد — صندوق الاقتراحات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:820px;margin:0 auto;padding:14px}
.it{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 15px;margin:7px 0}
.it .p{font-size:10.5px;color:var(--acc2);border:1px solid var(--border);border-radius:99px;padding:2px 10px}
.it .t{font-family:var(--font-ar);font-size:14px;line-height:1.9;margin-top:6px}
.it .n{font-size:10.5px;color:var(--dim);margin-top:4px}
.it .ops{display:flex;gap:7px;margin-top:8px}
.op{font-size:11px;border:1px solid var(--border);border-radius:99px;padding:3px 12px;cursor:pointer;background:var(--card2);color:var(--txt)}
.op.ok{border-color:var(--ok);color:#6fbf87}
.op.no{border-color:#e07070;color:#e07070}
.pend{box-shadow:inset 3px 0 0 var(--acc2)}
.tabs{display:flex;gap:7px;margin:10px 0}
.tb{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:99px;padding:6px 15px;font-size:12.5px;cursor:pointer}
.tb.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مرصاد <span class="muted" style="font-weight:400;font-size:12px">— صندوق التعليقات والاقتراحات</span></h2>
<div class="muted">كل ما كتبه أحد في زر 💬 داخل أي تطبيق — اقبل الاقتراح أو ارفضه، وحالته تعود للمقترِح.</div>
<div class="tabs">
 <button class="tb on" data-t="s">اقتراحات معلّقة</button>
 <button class="tb" data-t="ok">مقبولة</button>
 <button class="tb" data-t="c">تعليقات</button>
 <button class="tb" data-t="a">الكل</button>
</div>
<div id="list"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CK='portal_comments',SK='portal_suggestions';
const get=k=>JSON.parse(localStorage.getItem(k)||'{}');
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let tab='s';
const PN={};
async function names(){try{const p=await(await fetch('../portal/projects.json')).json();
 p.forEach(e=>PN[e.id]=e.title)}catch(e){}}
function collect(){
 const C=get(CK),S=get(SK),out=[];
 for(const pid in S)S[pid].forEach((s,i)=>out.push({kind:'s',pid,i,...s}));
 for(const pid in C)C[pid].forEach((c,i)=>out.push({kind:'c',pid,i,...c}));
 return out}
function render(){
 const items=collect().filter(x=>tab==='a'||(tab==='s'?x.kind==='s'&&x.st!=='ok'&&x.st!=='no':tab==='ok'?x.st==='ok':x.kind==='c'));
 $('#list').innerHTML=items.map(x=>{
  const pn=PN[x.pid]||x.pid;
  return `<div class="it ${x.st==='pending'?'pend':''}">
  <span class="p">${esc(pn)}</span>
  <div class="t">${esc(x.t)}</div>
  <div class="n">${esc(x.n||'عضو')}${x.st==='ok'?' · ✓ مقبول':x.st==='no'?' · مرفوض':x.kind==='s'?' · ⏳ معلّق':''}</div>
  ${x.kind==='s'&&x.st==='pending'?`<div class="ops"><button class="op ok" data-p="${esc(x.pid)}" data-i="${x.i}" data-a="ok">✓ اقبل</button><button class="op no" data-p="${esc(x.pid)}" data-i="${x.i}" data-a="no">× ارفض</button></div>`:''}
 </div>`}).join('')||'<div class="muted" style="text-align:center;padding:30px">لا شيء هنا</div>'}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('.tb');if(!b)return;tab=b.dataset.t;
 document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===b));render()};
$('#list').onclick=e=>{const o=e.target.closest('.op');if(!o)return;
 const S=get(SK);S[o.dataset.p][+o.dataset.i].st=o.dataset.a;set(SK,S);render()};
names().then(render);
</script>
<script src="../shared/feedback.js" data-pid="mirsad" data-title="مرصاد"></script>
</body>
</html>
