<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِلهَف — ما ألهف إليه</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.lng{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.lng .x{font-family:var(--font-ar);font-size:13.5px}
.lng .meta{font-size:10.5px;color:var(--dim);margin-top:5px}
.lng .bar{display:flex;gap:3px;margin-top:7px}
.lng .bar i{width:22px;height:7px;border-radius:3px;background:var(--card2);cursor:pointer}
.lng .bar i.f{background:var(--acc)}
.lng.hungry{border-color:var(--acc2)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِلهَف <span class="muted">— ما ألهف إليه</span></h2>
<div class="muted">تلهف لشيء — سفر، طمأنينة، إنجاز، شخص؟ سجّل لهفك بشدته (١-١٠) ومتى أطعمته آخر مرة. ما يجوع طويلاً يُنذِر.</div>
<div class="card"><div class="t">لهفة جديدة</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="ما الذي تلهف إليه؟" style="flex:1;min-width:150px">
<input id="it" type="number" min="1" max="10" placeholder="شدة ١-١٠" style="width:85px">
<button class="btn" id="ad">أضِف</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let L=LS('milhaf',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 L.unshift({n,i:+$('#it').value||5,at:Date.now(),fed:null});
 SV('milhaf',L);$('#nm').value=$('#it').value='';render();
};
function render(){
 const hungry=L.filter(x=>!x.fed||(Date.now()-x.fed)/864e5>x.i);
 $('#stats').innerHTML='<span class="stat">لهفات: <b>'+arN(L.length)+'</b></span>'+
 '<span class="stat">جائعة الآن: <b style="color:var(--acc2)">'+arN(hungry.length)+'</b></span>';
 $('#list').innerHTML=L.map((x,i)=>{
  const gi=L.indexOf(x);
  const days=x.fed?Math.floor((Date.now()-x.fed)/864e5):null;
  const isH=!x.fed||days>x.i;
  return '<div class="lng'+(isH?' hungry':'')+'"><div class="x">'+esc(x.n)+'</div>'+
  '<div class="meta">'+(x.fed?'أطعمتها قبل '+arN(days)+' يوماً':'لم تُطعمها بعد')+(isH?' — جائعة':'')+'</div>'+
  '<div class="bar">'+Array.from({length:10},(_,k)=>'<i class="'+(k<x.i?'f':'')+'" data-b="'+gi+'" data-v="'+(k+1)+'"></i>').join('')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:7px">'+
  '<button class="btn ghost" data-f="'+gi+'" style="color:var(--ok);font-size:10px">أطعمتها</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا لهفات — ماذا تلهف؟</div>';
}
$('#list').onclick=e=>{
 const f=e.target.closest('[data-f]'),d=e.target.closest('[data-d]'),b=e.target.closest('[data-b]');
 if(f){L[+f.dataset.f].fed=Date.now();SV('milhaf',L);render();return}
 if(d&&confirm('احذف؟')){L.splice(+d.dataset.d,1);SV('milhaf',L);render();return}
 if(b){L[+b.dataset.b].i=+b.dataset.v;SV('milhaf',L);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="milhaf" data-title="مِلهَف"></script>
</body>
</html>
