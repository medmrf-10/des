<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصفَح — صفح القلب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.wr{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-top:9px}
.wr .x{font-family:var(--font-ar);font-size:14px}
.wr .meta{font-size:11px;color:var(--dim);margin-top:5px}
.wr .evs{margin-top:9px}
.wr .ev{background:var(--card2);border-radius:8px;padding:8px 11px;margin-top:5px;font-family:var(--font-ar);font-size:12px;line-height:1.9}
.wr .ev .s{font-size:9.5px;color:var(--acc2);display:block}
.wr.forgiven{opacity:.65;border-style:dashed}
.wr.forgiven .x{text-decoration:line-through}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصفَح <span class="muted">— صفح القلب</span></h2>
<div class="muted">أخرج الجرح من صدرك إلى الدفتر — اقرأ أدلة العفو، ثم سامح أو احتفظ للمعالجة.</div>
<div class="card"><div class="t">ما الذي يثقلك؟</div>
<input id="w" placeholder="من أساء إليك أو ما الذي جرحك…">
<button class="btn" id="add" style="margin-top:9px">أخرجه من صدرك</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
const KWS=['عفو','العفو','صفح','الصفح','سامح','المسامحة','كظم','الكاظمين','غيظ','الغيظ'];
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
let G,U;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA')]).then(([g,u])=>{G=g;U=u});
function evidence(){
 const hs=[],vs=[];
 if(G)Object.values(G.g).forEach(h=>{if(KWS.some(k=>norm(h.t).includes(k)))hs.push({s:h.h,t:h.t.slice(0,160)})});
 if(U)Object.keys(U.sim).forEach(k=>{if(KWS.some(kw=>norm(U.sim[k][2]).includes(kw)))vs.push({s:U.names[k.split(':')[0]],t:U.sim[k][2].slice(0,160)})});
 return {hs:hs.slice(0,2),vs:vs.slice(0,2)};
}
let W=LS('misfah',[]);
$('#add').onclick=()=>{
 const t=$('#w').value.trim();if(!t)return;
 W.unshift({t,at:new Date().toISOString(),forgiven:null});
 SV('misfah',W);$('#w').value='';render();
};
function render(){
 const open=W.filter(w=>!w.forgiven).length;
 $('#stats').innerHTML='<span class="stat">معلّقة: <b>'+arN(open)+'</b></span><span class="stat">مسامَحات: <b>'+arN(W.length-open)+'</b></span>';
 $('#list').innerHTML=W.map((w,i)=>{
  const ev=w.forgiven?'':evidence();
  return '<div class="wr'+(w.forgiven?' forgiven':'')+'"><div class="x">'+esc(w.t)+'</div>'+
  '<div class="meta">أُخرجت '+w.at.slice(0,10)+(w.forgiven?' — سامحت '+w.forgiven.slice(0,10):'')+'</div>'+
  (ev.hs.length||ev.vs.length?'<div class="evs">'+ev.vs.map(e=>'<div class="ev"><span class="s">آية · '+esc(e.s)+'</span>'+esc(e.t)+'…</div>').join('')+ev.hs.map(e=>'<div class="ev"><span class="s">حديث · '+esc(e.s)+'</span>'+esc(e.t)+'…</div>').join('')+'</div>':'')+
  (!w.forgiven?'<div style="margin-top:9px"><button class="btn" data-i="'+i+'">سامحت — أغلقها</button></div>':'')+
  '</div>';
 }).join('')||'<div class="muted" style="margin-top:12px">صدرك خفيف — لا جروح معلّقة.</div>';
}
$('#list').onclick=e=>{
 const b=e.target.closest('[data-i]');if(!b)return;
 W[+b.dataset.i].forgiven=new Date().toISOString();
 SV('misfah',W);render();
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="misfah" data-title="مِصفَح"></script>
</body>
</html>
