<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَق — تحرير الذمة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.it{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.it .n{font-family:var(--font-ar);font-size:13px}
.it .to{font-size:11px;color:var(--dim);margin-top:4px}
.it.owe{border-right:3px solid var(--acc2)}
.it.owed{border-right:3px solid var(--ok)}
.it .dt{font-size:10px;color:var(--dim);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَق <span class="muted">— تحرير الذمة</span></h2>
<div class="muted">سجّل ما عليك وما لك — ديون، وعود، أمانات. الذمة الخفيفة نفسٌ مطمئنة.</div>
<div class="card"><div class="t">أضف بنداً</div>
<div style="display:flex;gap:8px">
<button class="btn ghost" id="k1" style="flex:1;border-color:var(--acc2)">عليّ — أنا مدين</button>
<button class="btn ghost" id="k2" style="flex:1">لي — لي عندهم</button></div>
<input id="w" placeholder="مع من؟ (أحمد، البنك، أمي…)">
<input id="x" placeholder="ماذا؟ (500 دج، كتاب، وعد بزيارة)">
<button class="btn" id="ad" style="margin-top:9px">سجّل</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let I=LS('mi3taq2',[]),mode='owe';
$('#k1').onclick=()=>{mode='owe';$('#k1').style.borderColor='var(--acc)';$('#k2').style.borderColor='var(--border)'};
$('#k2').onclick=()=>{mode='owed';$('#k2').style.borderColor='var(--acc)';$('#k1').style.borderColor='var(--border)'};
$('#ad').onclick=()=>{
 const w=$('#w').value.trim(),x=$('#x').value.trim();if(!w||!x)return;
 I.unshift({w,x,k:mode,at:Date.now(),st:'open'});SV('mi3taq2',I);$('#w').value=$('#x').value='';render();
};
function render(){
 const open=I.filter(x=>x.st==='open');
 const owe=open.filter(x=>x.k==='owe').length,owed=open.filter(x=>x.k==='owed').length;
 $('#stats').innerHTML='<span class="stat">عليّ: <b style="color:var(--acc2)">'+arN(owe)+'</b></span>'+
 '<span class="stat">لي: <b>'+arN(owed)+'</b></span>'+
 '<span class="stat">مُسدَّد: <b>'+arN(I.filter(x=>x.st!=='open').length)+'</b></span>';
 $('#list').innerHTML=I.slice(0,20).map((x,i)=>{
  const gi=I.indexOf(x);
  return '<div class="it '+x.k+'" style="'+(x.st!=='open'?'opacity:.45':'')+'">'+
  '<div class="n">'+(x.k==='owe'?'عليّ — ':'لي — ')+esc(x.x)+'</div>'+
  '<div class="to">مع: '+esc(x.w)+'</div>'+
  '<div class="dt">'+new Date(x.at).toLocaleDateString('ar-EG')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:7px">'+
  (x.st==='open'?'<button class="btn ghost" data-ok="'+gi+'" style="color:var(--ok)">✓ سُدّد</button>':'')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2)">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">ذمة خفيفة — لا شيء مسجلاً.</div>';
}
$('#list').onclick=e=>{
 const ok=e.target.closest('[data-ok]'),d=e.target.closest('[data-d]');
 if(ok){I[+ok.dataset.ok].st='done';SV('mi3taq2',I);render();return}
 if(d&&confirm('احذف البند؟')){I.splice(+d.dataset.d,1);SV('mi3taq2',I);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3taq2" data-title="مِعتَق"></script>
</body>
</html>
