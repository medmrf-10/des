<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرعَد — خطط العواصف</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.pl{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 15px;margin-top:8px}
.pl .n{font-family:var(--font-ar);font-size:13.5px}
.pl .body{font-size:12.5px;line-height:1.8;margin-top:7px;white-space:pre-wrap}
.pl .use{font-size:10.5px;color:var(--acc);margin-top:6px}
.pl.on{border-color:var(--acc);background:linear-gradient(135deg,var(--card),var(--card2))}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرعَد <span class="muted">— خطط العواصف</span></h2>
<div class="muted">خطّط ليومك الصعب قبل مجيئه: سفر، مرض، ضيوف، امتحان — حين تهبّ العاصفة تنفّذ الخطة لا ترتجل.</div>
<div class="card"><div class="t">خطة عاصفة</div>
<input id="n" placeholder="العاصفة (سفر، مريض، ضيوف مفاجئون…)">
<textarea id="b" placeholder="الخطة: الحد الأدنى من العبادة؟ النوم؟ ما يُلغى وما يُحفظ؟"></textarea>
<button class="btn" id="ad" style="margin-top:9px">احفظ الخطة</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('mir3ad',[]);
$('#ad').onclick=()=>{
 const n=$('#n').value.trim();if(!n)return;
 P.unshift({n,b:$('#b').value.trim(),at:Date.now(),uses:0,on:false});
 SV('mir3ad',P);$('#n').value=$('#b').value='';render();
};
function render(){
 const uses=P.reduce((s,x)=>s+x.uses,0);
 $('#stats').innerHTML='<span class="stat">خطط: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">استُعملت: <b>'+arN(uses)+'×</b></span>';
 $('#list').innerHTML=P.map((x,i)=>{
  const gi=P.indexOf(x);
  return '<div class="pl'+(x.on?' on':'')+'"><div class="n">⛈ '+esc(x.n)+'</div>'+
  '<div class="body">'+esc(x.b)+'</div>'+
  (x.uses?'<div class="use">استُعملت '+arN(x.uses)+'×'+(x.on?' — نشطة الآن':'')+'</div>':'')+
  '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
  '<button class="btn ghost" data-u="'+gi+'" style="color:var(--acc);font-size:10px">'+(x.on?'أنهِ العاصفة':'اليوم عاصفة — فعّل')+'</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا خطط — جهّز أول عاصفة.</div>';
}
$('#list').onclick=e=>{
 const u=e.target.closest('[data-u]'),d=e.target.closest('[data-d]');
 if(u){const x=P[+u.dataset.u];x.on=!x.on;if(x.on)x.uses++;SV('mir3ad',P);render();return}
 if(d&&confirm('احذف الخطة؟')){P.splice(+d.dataset.d,1);SV('mir3ad',P);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mir3ad" data-title="مِرعَد"></script>
</body>
</html>
