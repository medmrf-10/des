<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنسَأ — التأجيل</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.w{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-top:9px}
.w .nm{font-family:var(--font-ar);font-size:14px}
.w .tm{font-size:11px;color:var(--dim);margin-top:5px}
.w .tm b{color:var(--acc)}
.w .ripe .tm b{color:var(--ok)}
.w .meta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.done .nm{text-decoration:line-through;opacity:.6}
.tag{font-size:9.5px;padding:2px 8px;border-radius:8px;border:1px solid var(--border);color:var(--dim)}
.tag.bought{color:var(--ok);border-color:var(--ok)}
.tag.dropped{color:var(--acc2);border-color:var(--acc2)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنسَأ <span class="muted">— التأجيل</span></h2>
<div class="muted">اركن الاندفاع ٤٨ ساعة: كل شيء تريد شراءه أو فعله اندفاعاً — أجّله. إن بقيت رغبتك ناضجة فافعل، وإلا احذف.</div>
<div class="card"><div class="t">اركن اندفاعاً</div>
<input id="nm" placeholder="اشتريت سماعات، حملت لعبة، فتحت تطبيقاً…">
<button class="btn" id="add" style="margin-top:9px">اركن ٤٨ ساعة</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let W=LS('minsaa',[]);
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 W.unshift({n,at:Date.now(),st:'park'});
 SV('minsaa',W);$('#nm').value='';render();
};
const hrs=at=>Math.floor((Date.now()-at)/3600000);
function render(){
 const park=W.filter(w=>w.st==='park'),ripe=park.filter(w=>hrs(w.at)>=48);
 const bought=W.filter(w=>w.st==='bought').length,drop=W.filter(w=>w.st==='drop').length;
 $('#stats').innerHTML='<span class="stat">مركون: <b>'+arN(park.length)+'</b></span>'+
 '<span class="stat">ناضج (٤٨س+): <b>'+arN(ripe.length)+'</b></span>'+
 '<span class="stat">اشتريت: <b>'+arN(bought)+'</b></span>'+
 '<span class="stat">تخليت: <b>'+arN(drop)+'</b></span>';
 $('#list').innerHTML=W.slice(0,15).map((w,i)=>{
  const h=hrs(w.at),ripe=h>=48,wait=48-h;
  if(w.st!=='park')return '<div class="w done"><div class="nm">'+esc(w.n)+'</div><span class="tag '+(w.st==='bought'?'bought':'dropped')+'">'+(w.st==='bought'?'اشتريت':'تخليت')+'</span></div>';
  return '<div class="w'+(ripe?' ripe':'')+'"><div class="nm">'+esc(w.n)+'</div>'+
  '<div class="tm">'+(ripe?'<b>ناضج — قرر الآن</b>':'مركون — باقي <b>'+arN(wait)+'س</b>')+'</div>'+
  '<div class="meta"><button class="btn ghost" data-b="'+i+'" '+(ripe?'':'disabled style="opacity:.4"')+'>فُتِح — افعل/اشترِ</button>'+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2)">تخليت ✓</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا مركون — قوتك في التأجيل.</div>';
}
$('#list').onclick=e=>{
 const b=e.target.closest('[data-b]');if(b&&!b.disabled){W[+b.dataset.b].st='bought';SV('minsaa',W);render();return}
 const d=e.target.closest('[data-d]');if(d){W[+d.dataset.d].st='drop';SV('minsaa',W);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="minsaa" data-title="مِنسَأ"></script>
</body>
</html>
