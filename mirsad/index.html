<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرصَد — رصد الأنماط</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.pt{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.pt .x{font-family:var(--font-ar);font-size:13px}
.pt .k{font-size:10px;padding:2px 8px;border-radius:6px;margin-right:6px}
.pt .k.g{background:var(--ok);color:#14140f}
.pt .k.b{background:var(--acc2);color:#14140f}
.pt .k.n{background:var(--card2);color:var(--txt)}
.pt .cnt{font-size:10px;color:var(--dim);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرصَد <span class="muted">— رصد الأنماط</span></h2>
<div class="muted">ما الذي يتكرر في حياتك؟ «كل أحد أصحو متعباً»، «أنجز أكثر قبل الظهر». ارصده: نمط إيجابي، سلبي، أم محايد — وكل مرة يتكرر.</div>
<div class="card"><div class="t">نمط لاحظته</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="النمط (أتسوّل عن المهام مساءً)" style="flex:1;min-width:150px">
<select id="kd"><option value="n">محايد</option><option value="g">إيجابي</option><option value="b">سلبي</option></select>
<button class="btn" id="ad">ارصِد</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('mirsad',[]);
const KN={g:'إيجابي',b:'سلبي',n:'محايد'};
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 P.unshift({n,k:$('#kd').value,cnt:1,last:Date.now()});
 SV('mirsad',P);$('#nm').value='';render();
};
function render(){
 const g=P.filter(x=>x.k==='g').length,b=P.filter(x=>x.k==='b').length;
 $('#stats').innerHTML='<span class="stat">أنماط: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">إيجابية: <b style="color:var(--ok)">'+arN(g)+'</b></span>'+
 '<span class="stat">سلبية: <b style="color:var(--acc2)">'+arN(b)+'</b></span>';
 $('#list').innerHTML=P.map((x,i)=>{
  const gi=P.indexOf(x);
  return '<div class="pt"><span class="k '+x.k+'">'+KN[x.k]+'</span><span class="x">'+esc(x.n)+'</span>'+
  '<div class="cnt">تكرر '+arN(x.cnt)+'× — آخرها '+new Date(x.last).toLocaleDateString('ar-EG')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:6px">'+
  '<button class="btn ghost" data-r="'+gi+'" style="color:var(--acc);font-size:10px">تكرر اليوم</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أنماط مرصودة — ما الذي يتكرر؟</div>';
}
$('#list').onclick=e=>{
 const r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
 if(r){P[+r.dataset.r].cnt++;P[+r.dataset.r].last=Date.now();SV('mirsad',P);render();return}
 if(d&&confirm('احذف؟')){P.splice(+d.dataset.d,1);SV('mirsad',P);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mirsad" data-title="مِرصَد"></script>
</body>
</html>
