<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصبَح — شكر الفجر</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.g{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px;font-family:var(--font-ar);font-size:13px}
.g .d{font-size:10px;color:var(--dim);margin-bottom:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:16px;text-align:center;margin-top:11px;font-family:var(--font-ar)}
.sun{font-size:30px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصبَح <span class="muted">— شكر الفجر</span></h2>
<div class="muted">ثلاث نِعم كل صباح — يبدأ اليوم بالشكر لا بالشكوى.</div>
<div class="sun">🌅</div>
<div class="card"><div class="t">نعم اليوم</div>
<input id="g1" placeholder="نعمة ١">
<input id="g2" placeholder="نعمة ٢">
<input id="g3" placeholder="نعمة ٣">
<button class="btn" id="ad" style="margin-top:9px">احمد الله</button></div>
<div id="banner"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G=LS('misbah2',[]);
const today=()=>new Date().toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const gs=[1,2,3].map(i=>$('#g'+i).value.trim()).filter(Boolean);
 if(!gs.length)return;
 G.unshift({d:today(),gs,at:Date.now()});SV('misbah2',G);
 [1,2,3].forEach(i=>$('#g'+i).value='');render();
};
function render(){
 const t=G.find(x=>x.d===today());
 $('#banner').innerHTML=t?'<div class="banner" style="color:var(--ok)">🌅 حمدت الله اليوم على '+arN(t.gs.length)+' نِعم.</div>':
 '<div class="banner">لم تحمد الله اليوم بعد — ثلاث نِعم تكفي.</div>';
 let streak=0,d=new Date;
 if(!G.find(x=>x.d===today()))d=new Date(Date.now()-864e5);
 for(;;){if(G.find(x=>x.d===d.toISOString().slice(0,10))){streak++;d=new Date(d-864e5)}else break}
 const tot=G.reduce((s,x)=>s+x.gs.length,0);
 $('#stats').innerHTML='<span class="stat">أيام شكر: <b>'+arN(G.length)+'</b></span>'+
 '<span class="stat">متتالية: <b style="color:var(--ok)">'+arN(streak)+'</b></span>'+
 '<span class="stat">نعم محمودة: <b>'+arN(tot)+'</b></span>';
 $('#list').innerHTML=G.slice(0,7).map(x=>'<div class="g"><div class="d">'+x.d+'</div>'+
 x.gs.map(s=>'• '+esc(s)).join('<br>')+'</div>').join('')||
 '<div class="muted" style="margin-top:12px">لا شكر مسجلاً.</div>';
}
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="misbah2" data-title="مِصبَح"></script>
</body>
</html>
