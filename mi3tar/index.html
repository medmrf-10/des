<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَر — دفتر الأعذار</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.ex{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px;display:flex;gap:10px;align-items:center}
.ex .h{font-family:var(--font-ar);font-size:13px;flex:1}
.ex .r{font-size:11.5px;color:var(--dim)}
.ex .dt{font-size:10px;color:var(--dim)}
.barf{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;flex:1}
.barf i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pat{display:flex;gap:9px;align-items:center;margin-top:7px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَر <span class="muted">— دفتر الأعذار</span></h2>
<div class="muted">حين تترك عادة — سجّل العذر بصراحة. بعد أسابيع ترى أكاذيبك المتكررة.</div>
<div class="card"><div class="t">تركت اليوم</div>
<input id="h" placeholder="ماذا تركت؟ (ورد، درس، رياضة…)">
<input id="r" placeholder="العذر الصادق (نعاس، زحمة، كسل…)">
<button class="btn" id="ad" style="margin-top:9px">اعترف</button></div>
<div class="card"><div class="t">أعذارك المتكررة</div><div id="pats"></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let E=LS('mi3tar',[]);
$('#ad').onclick=()=>{
 const h=$('#h').value.trim(),r=$('#r').value.trim();if(!h||!r)return;
 E.unshift({h,r,at:Date.now()});SV('mi3tar',E);$('#h').value=$('#r').value='';render();
};
function pats(){
 const m={};
 E.forEach(e=>{const k=norm(e.r).split(/\s+/).filter(w=>w.length>3).join(' ')||norm(e.r);m[k]=(m[k]||0)+1});
 const top=Object.entries(m).filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const mx=top.length?top[0][1]:1;
 return top.map(([k,c])=>'<div class="pat"><span style="font-size:11.5px;min-width:110px">'+esc(k)+'</span>'+
 '<div class="barf"><i style="width:'+(c/mx*100)+'%"></i></div><b style="font-size:11px;color:var(--acc)">'+arN(c)+'×</b></div>').join('')||
 '<div class="muted">لا نمط بعد — سجّل أعذاراً.</div>';
}
function render(){
 $('#pats').innerHTML=pats();
 $('#stats').innerHTML='<span class="stat">اعترافات: <b>'+arN(E.length)+'</b></span>'+
 '<span class="stat">أعذار متكررة: <b>'+arN(new Set(E.map(e=>norm(e.r))).size<E.length?new Set(E.map(e=>norm(e.r))).size:0)+'</b></span>';
 $('#list').innerHTML=E.slice(0,15).map(e=>'<div class="ex"><span class="h">'+esc(e.h)+'</span>'+
 '<span class="r">'+esc(e.r)+'</span><span class="dt">'+new Date(e.at).toLocaleDateString('ar-EG')+'</span></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا اعترافات — عسى ألا تحتاجها.</div>';
}
$('#list').onclick=e=>{
 const x=e.target.closest('.ex');if(!x)return;
 const i=[...document.querySelectorAll('.ex')].indexOf(x);
 if(confirm('احذف الاعتراف؟')){E.splice(i,1);SV('mi3tar',E);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3tar" data-title="مِعتَر"></script>
</body>
</html>
