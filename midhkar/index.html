<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِذخَر — جرد المخزن</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.it{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px;display:flex;gap:10px;align-items:center}
.it .n{flex:1;font-family:var(--font-ar);font-size:13px}
.it .q{font-size:11px;color:var(--dim)}
.it.soon{border-color:#a05a5a}
.it .exp{font-size:10px;color:var(--acc2)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِذخَر <span class="muted">— جرد المخزن</span></h2>
<div class="muted">ماذا في بيتك؟ سجّل الطعام والأدوات وتواريخ انتهائها — لا تدع شيئاً يفسد.</div>
<div class="card"><div class="t">صنف جديد</div>
<input id="n" placeholder="الصنف (رز، عدس، زيت، دواء…)">
<div style="display:flex;gap:8px">
<input id="q" type="number" placeholder="الكمية" style="flex:1">
<input id="e" type="date" style="flex:1"></div>
<button class="btn" id="ad" style="margin-top:9px">أضِف</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let I=LS('midhkar',[]);
const daysTo=d=>{if(!d)return null;return Math.ceil((new Date(d)-Date.now())/864e5)};
$('#ad').onclick=()=>{
 const n=$('#n').value.trim();if(!n)return;
 I.unshift({n,q:+$('#q').value||1,e:$('#e').value||'',at:Date.now()});
 SV('midhkar',I);$('#n').value=$('#q').value=$('#e').value='';render();
};
function render(){
 const soon=I.filter(x=>{const d=daysTo(x.e);return d!==null&&d<=7});
 const out=I.filter(x=>x.q<=0);
 $('#stats').innerHTML='<span class="stat">أصناف: <b>'+arN(I.length)+'</b></span>'+
 '<span class="stat">ينتهي خلال أسبوع: <b style="color:var(--acc2)">'+arN(soon.length)+'</b></span>'+
 '<span class="stat">نفد: <b style="color:var(--dim)">'+arN(out.length)+'</b></span>';
 $('#list').innerHTML=I.map((x,i)=>{
  const d=daysTo(x.e);
  return '<div class="it'+(d!==null&&d<=7?' soon':'')+'"><span class="n">'+esc(x.n)+
  (d!==null?'<div class="exp">'+(d<0?'انتهى منذ '+arN(-d)+' يوم':'يبقى '+arN(d)+' يوم')+'</div>':'')+
  '</span><span class="q">×'+arN(x.q)+'</span>'+
  '<button class="btn ghost" data-m="'+i+'" style="padding:4px 9px">−</button>'+
  '<button class="btn ghost" data-p="'+i+'" style="padding:4px 9px">+</button>'+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2);padding:4px 8px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">مخزن فارغ — أضف أول صنف.</div>';
}
$('#list').onclick=e=>{
 const m=e.target.closest('[data-m]'),p=e.target.closest('[data-p]'),d=e.target.closest('[data-d]');
 if(m){I[+m.dataset.m].q=Math.max(0,I[+m.dataset.m].q-1);SV('midhkar',I);render();return}
 if(p){I[+p.dataset.p].q++;SV('midhkar',I);render();return}
 if(d&&confirm('احذف؟')){I.splice(+d.dataset.d,1);SV('midhkar',I);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="midhkar" data-title="مِذخَر"></script>
</body>
</html>
