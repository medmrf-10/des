<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنصَت — من يُنصِت</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:110px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.lt{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px;cursor:pointer}
.lt .to{font-family:var(--font-ar);font-size:12.5px;color:var(--acc)}
.lt .pv{font-size:11px;color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt .meta{font-size:10px;color:var(--dim);margin-top:5px}
.lt .body{display:none;font-size:12.5px;line-height:1.9;white-space:pre-wrap;margin-top:9px;border-top:1px solid var(--border);padding-top:9px}
.lt.open .body{display:block}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنصَت <span class="muted">— رسائل لا تُرسَل</span></h2>
<div class="muted">اكتب لمن تودّ — لنفسك القديمة، لشخص فارقك، لنفسك الآن. لا أحد يقرأ سواك، ولا تحتاج أن تُرسِل.</div>
<div class="card"><div class="t">رسالة جديدة</div>
<select id="to"><option value="نفسي الآن">لنفسي الآن</option><option value="نفسي قبل سنوات">لنفسي قبل سنوات</option><option value="نفسي بعد سنوات">لنفسي بعد سنوات</option><option value="شخص">لشخص (بلا اسم)</option><option value="الله">لله</option></select>
<textarea id="tx" placeholder="اكتب بلا رقيب…"></textarea>
<button class="btn" id="ad" style="margin-top:9px">احفظ الرسالة</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let L=LS('minsat2',[]);
const fmt=t=>new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'long'});
$('#ad').onclick=()=>{
 const tx=$('#tx').value.trim();if(!tx)return;
 L.unshift({to:$('#to').value,tx,at:Date.now()});
 SV('minsat2',L);$('#tx').value='';render();
};
function render(){
 const tot=L.reduce((s,x)=>s+x.tx.length,0);
 const byTo={};L.forEach(x=>byTo[x.to]=(byTo[x.to]||0)+1);
 const topTo=Object.entries(byTo).sort((a,b)=>b[1]-a[1])[0];
 $('#stats').innerHTML='<span class="stat">رسائل: <b>'+arN(L.length)+'</b></span>'+
 '<span class="stat">حروف كتبتها: <b style="color:var(--acc)">'+arN(tot)+'</b></span>'+
 (topTo?'<span class="stat">أكثر مُرسَل إليه: <b>'+esc(topTo[0])+'</b></span>':'');
 $('#list').innerHTML=L.slice(0,12).map((x,i)=>'<div class="lt" data-i="'+i+'">'+
 '<div class="to">إلى: '+esc(x.to)+'</div>'+
 '<div class="pv">'+esc(x.tx.slice(0,70))+'…</div>'+
 '<div class="meta">'+fmt(x.at)+'</div>'+
 '<div class="body">'+esc(x.tx)+'</div></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا رسائل — ابدأ بأول رسالة لا تُرسَل.</div>';
}
$('#list').onclick=e=>{
 const l=e.target.closest('.lt');if(l)l.classList.toggle('open');
};
render();
</script>
<script src="../shared/feedback.js" data-pid="minsat2" data-title="مِنصَت"></script>
</body>
</html>
