<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصرَف — تصريف المخزون</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:680px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:11.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.item{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px 16px;margin-top:10px}
.item .txt{font-family:var(--font-ar);font-size:14px;line-height:2;white-space:pre-wrap}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prog{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:10px}
.prog .f{height:100%;background:var(--acc);border-radius:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصرَف <span class="muted">— تصريف المخزون</span></h2>
<div class="muted">المراجعة الأسبوعية: صرّف كل عنصر في «مِخزَن» — إلى مهمة، مشروع، أو أرشيف، أو احذفه.</div>
<div style="margin-top:9px"><span class="stat">بقي: <b id="n">٠</b></span><span class="stat">صرّفت اليوم: <b id="dn">٠</b></span>
<div class="prog"><div class="f" id="pb"></div></div></div>
<div class="card"><div class="t">التالي</div><div id="item" class="muted">—</div>
<div class="acts" id="acts" style="display:none">
<button class="btn" data-a="مهمة">مهمة</button>
<button class="btn ghost" data-a="مشروع">مشروع</button>
<button class="btn ghost" data-a="مذكرة">مذكرة</button>
<button class="btn ghost" data-a="مرجع">مرجع</button>
<button class="btn ghost" data-a="احذف">احذف</button>
</div></div>
<div class="card"><div class="t">مُصرَّفاتك اليوم</div><div id="done" class="muted">—</div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let S=LS('mikhzan',[]);
let D=LS('misraf',{d:today(),done:[],arch:[]});
if(D.d!==today()){D.done=[];D.d=today();SV('misraf',D)}
function render(){
 $('#n').textContent=arN(S.length);
 $('#dn').textContent=arN(D.done.length);
 const total=S.length+D.done.length;
 $('#pb').style.width=(total?Math.round(D.done.length/total*100):0)+'%';
 if(!S.length){
  $('#item').innerHTML='✓ مِخزَنُك فارغ — كل شيء مُصرَّف';$('#acts').style.display='none';
 }else{
  $('#item').innerHTML='<div class="item"><div class="txt">'+esc(S[0].t)+'</div></div>';
  $('#acts').style.display='flex';
 }
 $('#done').innerHTML=D.done.slice(0,10).map(x=>'<div style="font-size:11.5px;margin-top:4px"><span class="tag" style="background:var(--card2);color:var(--acc);border-radius:6px;padding:1px 7px;font-size:10px">'+x.a+'</span> '+esc(x.t.slice(0,55))+'</div>').join('')||'—';
}
$('#acts').onclick=e=>{
 const b=e.target.closest('[data-a]');if(!b||!S.length)return;
 const it=S.shift();SV('mikhzan',S);
 if(b.dataset.a==='احذف'){render();return}
 D.done.unshift({a:b.dataset.a,t:it.t});D.arch.unshift({a:b.dataset.a,t:it.t,at:new Date().toISOString()});
 SV('misraf',D);render();
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="misraf" data-title="مِصرَف"></script>
</body>
</html>
