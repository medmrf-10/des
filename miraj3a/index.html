<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مراجعة — جدول حفظك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:760px;margin:0 auto;padding:14px}
.s{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin:6px 0;display:flex;align-items:center;gap:10px}
.s .n{flex:1;font-family:var(--font-ar);font-size:14.5px}
.s .d{font-size:11px;color:var(--dim)}
.s .btn{background:var(--acc);color:#14140f;border:0;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:11.5px}
.s.due{border-color:rgba(224,119,119,.5)}
.s.due .n{color:#e07777}
.s.soon{border-color:rgba(201,162,75,.45)}
.muted{color:var(--dim);font-size:12px}
h4{font-family:var(--font-ar);margin:16px 0 6px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مراجعة <span class="muted">— حفظك يُراجَع لا يُترَك</span></h2>
<div class="muted">يقرأ محفوظاتك من معراج تلقائياً — كل سورة لم تراجعها منذ مدة تصعد للقائمة. راجعها اليوم واضغط «راجعتها» فيعود ترتيبها للآخر.</div>
<div id="hdr" style="margin:12px 0"></div>
<h4>مستحقة الآن</h4><div id="due"></div>
<h4>قريبة</h4><div id="soon"></div>
<h4>مرجوعة حديثاً</h4><div id="fresh"></div>
<h4>لم تُحفَظ بعد <span class="muted">(من معراج)</span></h4>
<div id="none"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let MEM={},REV={},SU=[];
try{MEM=JSON.parse(localStorage.ma3raj||'{}')}catch(e){}
try{REV=JSON.parse(localStorage.miraj3a||'{}')}catch(e){}
const DAY=864e5;
const days=ts=>Math.floor((Date.now()-ts)/DAY);
async function ix(){if(!SU.length){const I=await(await fetch('../wahy/data/index.json')).json();SU=I.map(s=>[s.n,s.ar,s.ayahs])}}
function row(r){
 return `<div class="s ${r.d>=7?'due':r.d>=3?'soon':''}">
 <span class="n">${r.n}. ${esc(r.ar)}</span>
 <span class="d">${r.last?(r.d===0?'اليوم':r.d===1?'أمس':'منذ '+r.d.toLocaleString('ar-EG')+' يوم'):'لم تُراجع قط'}</span>
 <button class="btn" data-n="${r.n}">راجعتها</button></div>`}
function render(){
 const mem=SU.filter(s=>(MEM[s[0]]||0)===2);
 const rows=mem.map(s=>{
  const last=REV[s[0]]||0;
  return{n:s[0],ar:s[1],a:s[2],last,d:last?days(last):999}});
 rows.sort((a,b)=>b.d-a.d);
 const due=rows.filter(r=>r.d>=7),soon=rows.filter(r=>r.d>=3&&r.d<7),fresh=rows.filter(r=>r.d<3);
 const none=SU.filter(s=>(MEM[s[0]]||0)!==2);
 $('#hdr').innerHTML=`<div class="muted">${mem.length.toLocaleString('ar-EG')} سورة محفوظة · ${due.length} مستحقة · ${fresh.length} مرجوعة هذا الأسبوع</div>`;
 $('#due').innerHTML=due.length?due.map(row).join(''):'<div class="muted">لا شيء مستحقاً — ممتاز.</div>';
 $('#soon').innerHTML=soon.length?soon.map(row).join(''):'<div class="muted">—</div>';
 $('#fresh').innerHTML=fresh.length?fresh.map(row).join(''):'<div class="muted">—</div>';
 $('#none').innerHTML=none.length?'<div class="muted">'+none.slice(0,30).map(s=>esc(s[1])).join(' · ')+(none.length>30?' …':'')+'</div><div class="muted" style="margin-top:6px">علّم المحفوظ منها في <a href="../ma3raj/" style="color:var(--acc)">معراج</a></div>':'<div class="muted">كل السور محفوظة — ما شاء الله.</div>'}
document.body.onclick=e=>{const b=e.target.closest('.btn');if(!b||!b.dataset.n)return;
 REV[+b.dataset.n]=Date.now();localStorage.miraj3a=JSON.stringify(REV);render()};
ix().then(render);
</script>
<script src="../shared/feedback.js" data-pid="miraj3a" data-title="مراجعة"></script>
</body>
</html>
