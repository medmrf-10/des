<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>متابع — سجلّك عبر كل التطبيقات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:760px;margin:0 auto;padding:14px}
.row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin:7px 0;display:flex;gap:12px;align-items:center}
.row .ic{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.row .t{font-family:var(--font-ar);font-size:14px;flex:1}
.row .n{font-size:17px;color:var(--acc2);font-family:var(--font-ar)}
.row .n span{display:block;font-size:9px;color:var(--dim);font-weight:400}
.grp{font-family:var(--font-ar);font-size:13px;color:var(--acc2);margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:5px}
.muted{color:var(--dim);font-size:12px}
.bar{height:4px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">متابع <span class="muted" style="font-weight:400;font-size:12px">— كل حركتك في المنظومة في سجلّ واحد</span></h2>
<div class="muted">يقرأ بياناتك المحلية من كل تطبيق (لا خادم، كلها على جهازك) ويعرض إنجازك ونشاطك في صفحة واحدة.</div>
<div id="out"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(+v||0).toLocaleString('ar-EG');
const G=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const rows=[];
const G1={n:'المراجعة والحفظ',ic:'📖',r:[]};
const due=G('mdr_sched',{});
if(Object.keys(due).length)G1.r.push({t:'بطاقات مراجعة مدرسة',n:Object.keys(due).length,l:'جدولة'});
const miq=G('miq_cards',{});
if(Object.keys(miq).length)G1.r.push({t:'بطاقات مقرأة',n:Object.keys(miq).length,l:'بطاقة'});
const maj=G('ma3raj',{});
const majDone=Object.values(maj).filter(v=>v===2).length;
if(majDone)G1.r.push({t:'سور محفوظة في معراج',n:majDone,l:'سورة'});
const srs=G('en_srs',{});
if(Object.keys(srs).length)G1.r.push({t:'كلمات في مراجعة SRS',n:Object.keys(srs).length,l:'كلمة'});
const G2={n:'التعلّم اليومي',ic:'🎯',r:[]};
const routine=G('en_routine',{});
if(routine.streak)G2.r.push({t:'أيام متتالية في روتين الإنجليزية',n:routine.streak,l:'يوماً 🔥'});
const seen=G('en_feed_seen',[]);
if(seen.length)G2.r.push({t:'مقاطع شورت فورم شاهدتها',n:seen.length,l:'مقطعاً'});
const zad=G('zad_done',[]);
if(zad.length)G2.r.push({t:'مواضع زاد أنهيتها',n:zad.length,l:'موضعاً'});
const mnhaj=G('mnhaj_done',[]);
if(mnhaj.length)G2.r.push({t:'مبادئ المنهج متقنة',n:mnhaj.length,l:'مبدأً'});
const mishwar=G('mishwar_done',{});
const msh=Object.keys(mishwar).length;
if(msh)G2.r.push({t:'دروس مشوار مسموعة',n:msh,l:'درساً'});
const prog=G('prog_v1',{});
const progDone=(prog.lessons&&Object.values(prog.lessons).filter(v=>v.done).length)||0;
if(progDone)G2.r.push({t:'دروس برمجة مكتملة',n:progDone,l:'درساً'});
const G3={n:'الكتابة والإنتاج',ic:'✍️',r:[]};
const notes=G('mz_note',[]);
if(notes.length)G3.r.push({t:'فوائد محفوظة في المنظومة',n:notes.length,l:'فائدة'});
const daftar=G('daftar',[]);
if(daftar.length)G3.r.push({t:'ملاحظات في الدفتر',n:daftar.length,l:'ملاحظة'});
const muqtatif=G('muqtatif',[]);
if(muqtatif.length)G3.r.push({t:'مقتطفات مجدولة',n:muqtatif.length,l:'مقتطفاً'});
const drafts=G('mu3edd_drafts',[]);
if(drafts.length)G3.r.push({t:'مسودات معدّ',n:drafts.length,l:'مسودة'});
const mkhatat=G('mkhatat',{});
const mkh=Object.keys(mkhatat).length;
if(mkh)G3.r.push({t:'مخططات مرسومة',n:mkh,l:'مخططاً'});
const G4={n:'القراءة والفهارس',ic:'📚',r:[]};
const iqra=G('iqra_pos',{});
const iqraN=Object.keys(iqra).length;
if(iqraN)G4.r.push({t:'كتب قيد القراءة',n:iqraN,l:'كتاباً'});
const fihris=G('fihris_cat',{});
const fih=Object.keys(fihris).length;
if(fih)G4.r.push({t:'تصنيفاتك في الفهرس',n:fih,l:'فئة'});
const sbq=localStorage.getItem('sibaq_best');
if(sbq&&+sbq)G4.r.push({t:'أفضل سرعة طباعة',n:sbq,l:'ك/د'});
const ijaza=G('ijaza',{});
const ij=Object.keys(ijaza).length;
if(ij)G4.r.push({t:'سلاسل إجازة مسجلة',n:ij,l:'سلسلة'});
const bank=G('en_bank',[]);
if(bank.length)G4.r.push({t:'كلمات في البنك',n:bank.length,l:'كلمة'});
[G1,G2,G3,G4].forEach(g=>{
 if(!g.r.length)return;
 $('#out').innerHTML+=`<div class="grp">${g.ic} ${g.n}</div>`+
 g.r.map(x=>`<div class="row"><div class="ic">${g.ic}</div><div class="t">${esc(x.t)}<div class="bar"><i style="width:${Math.min(100,(+x.n)/30*100)}%"></i></div></div><div class="n">${num(x.n)}<span>${esc(x.l)}</span></div></div>`).join('')});
if(!$('#out').innerHTML)$('#out').innerHTML='<div class="muted" style="text-align:center;padding:40px">لا نشاط مسجلاً بعد — ابدأ بأي تطبيق وسيظهر هنا</div>';
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mutabi3" data-title="متابع"></script>
</body>
</html>
