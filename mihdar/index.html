<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحضَر — مجلس المذاهب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.pos{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 15px;margin-top:8px}
.pos .mh{font-size:11px;color:var(--acc2);margin-bottom:4px;font-weight:700}
.pos .txt{font-family:var(--font-ar);font-size:13px;line-height:2}
.col{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:9px 14px;font-family:var(--font-ar);font-size:13px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحضَر <span class="muted">— مجلس المذاهب</span></h2>
<div class="muted">موضوع فقهي ← موقف كل مذهب جنبًا إلى جنب — قارن بنفسك.</div>
<div class="card"><div class="t">موضوعك</div>
<input id="q" placeholder="مثال: الوضوء · البيع · الصلاة · النكاح…">
<div style="margin-top:8px"><button class="btn" id="go">اعرض المواقف</button></div></div>
<div id="res"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
let M;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
laz('../fiqh_reader/masail.js','MASAIL').then(m=>{M=m});
const MN={h:'الحنفية',m:'المالكية',s:'الشافعية',b:'الحنابلة',o:'مذاهب أخرى'};
$('#go').onclick=()=>{
 const q=$('#q').value.trim();if(!q||!M)return;
 const nq=norm(q),hits={};
 Object.entries(M).forEach(([slug,b])=>{
  b.u.forEach(u=>{
   if(norm(u.t).includes(nq)){
    const m=MN[b.m]||b.m;
    if(!hits[m])hits[m]=[];
    if(hits[m].length<4)hits[m].push({t:u.t,b:b.n,l:u.l});
   }
  });
 });
 const ms=Object.keys(hits);
 if(!ms.length){$('#res').innerHTML='<div class="muted" style="margin-top:12px">لا نتائج — جرّب كلمة أعم.</div>';return}
 $('#res').innerHTML='<div style="margin-top:12px"><span class="stat">مذاهب وجدت: <b>'+arN(ms.length)+'</b></span><span class="stat">مواضع: <b>'+arN(Object.values(hits).flat().length)+'</b></span></div>'+
 '<div class="col" style="margin-top:10px">'+ms.map(m=>
  '<div class="card"><div class="t">'+esc(m)+' ('+arN(hits[m].length)+')</div>'+
  hits[m].map(h=>'<div class="pos"><div class="mh">'+esc(h.b)+'</div><div class="txt">'+esc(h.t)+'</div></div>').join('')+'</div>'
 ).join('')+'</div>';
};
$('#q').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
</script>
<script src="../shared/feedback.js" data-pid="mihdar" data-title="مِحضَر"></script>
</body>
</html>
