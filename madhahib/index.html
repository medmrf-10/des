<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مذاهب — المسألة عند المذاهب الأربعة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:1020px;margin:0 auto;padding:14px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:11px;padding:12px 16px;font-family:var(--font-ar);font-size:15px;margin-top:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px;margin-top:14px}
.mcol{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 13px}
.mcol h4{font-family:var(--font-ar);font-size:14px;color:var(--acc2);margin:0 0 8px;display:flex;justify-content:space-between}
.mcol h4 span{color:var(--dim);font-size:10px;font-weight:400}
.mi{font-size:12.5px;line-height:1.7;padding:6px 8px;border-radius:7px;margin:3px 0;background:var(--card2);font-family:var(--font-ar)}
.mi a{display:block;color:var(--acc2);font-size:10px;margin-top:3px}
.mi .bk{font-size:9.5px;color:var(--dim);display:block}
.hot{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.hot button{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:99px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:var(--font-ar)}
.hot button:hover{border-color:var(--acc)}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مذاهب <span class="muted" style="font-weight:400;font-size:12px">— المسألة عند المذاهب الأربعة جنباً إلى جنب</span></h2>
<div class="muted">اكتب موضوعاً («الوضوء»، «الجمع»، «الحيض») — تُجمع أبوابه عند كل مذهب في أعمدة متوازية، وكل باب يفتح نصّه في القارئ.</div>
<div class="hot" id="hot"></div>
<input class="inp" id="q" placeholder="موضوع… (الوضوء، الغسل، الجمعة، الجمع، الحيض، الربا، الطلاق)" autocomplete="off">
<div class="mgrid" id="grid"></div>
<script src="../fiqh_reader/masail.js"></script>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const MDH={h:'حنفي',m:'مالكي',s:'شافعي',b:'حنبلي',o:'غير مصنّف'};
const HOT=['الوضوء','الغسل','الصلاة','الجمعة','الجمع','الحيض','الصيام','الزكاة','الحج','الربا','الطلاق','النكاح'];
$('#hot').innerHTML=HOT.map(t=>`<button>${t}</button>`).join('');
$('#hot').onclick=e=>{if(e.target.tagName==='BUTTON'){$('q').value=e.target.textContent;go()}};
function go(){
 const t=$('q').value.trim();if(t.length<2)return;
 const ws=t.split(/\s+/).map(norm);
 const by={};
 for(const slug in MASAIL){
  const bk=MASAIL[slug];const md=MDH[bk.m]||MDH.o;
  for(const u of bk.u){
   const nt=norm(u.t);let hit=0;for(const w of ws)if(nt.includes(w))hit++;
   if(hit>=Math.min(ws.length,2)){(by[md]=by[md]||[]).push({t:u.t,slug,i:u.i,bk:bk.n,sc:hit})}}}
 const order=['حنفي','مالكي','شافعي','حنبلي','غير مصنّف'];
 $('#grid').innerHTML=order.filter(m=>by[m]).map(m=>{
  const list=by[m].sort((a,b)=>b.sc-a.sc).slice(0,14);
  return `<div class="mcol"><h4>${m} <span>${by[m].length.toLocaleString('ar-EG')} باباً</span></h4>
  ${list.map(x=>`<div class="mi">${esc(x.t)}<span class="bk">${esc(x.bk)}</span><a href="../fiqh_reader/index.html#${x.slug}/${x.i}" target="_blank">اقرأ النص ↗</a></div>`).join('')}</div>`}).join('')||'<div class="muted" style="grid-column:1/-1;text-align:center;padding:30px">لا أبواب مطابقة</div>'}
let deb;$('q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(go,300)});
</script>
<script src="../shared/feedback.js" data-pid="madhahib" data-title="مذاهب"></script>
</body>
</html>
