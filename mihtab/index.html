<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحتَب — القائمة الكبرى</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;width:100%;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:4px 10px}
.g{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-top:9px}
.g .nm{font-family:var(--font-ar);font-size:14px}
.g .meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:6px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:var(--acc);transition:width .3s}
.sug{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 11px;margin:3px;cursor:pointer;font-size:11px;font-family:var(--font-ar)}
.sug:hover{border-color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحتَب <span class="muted">— القائمة الكبرى</span></h2>
<div class="muted">أهداف العمر الإسلامية — كل هدف يومياته تُحسب تلقائياً من أدواتك إن وجدت.</div>
<div class="card"><div class="t">اقتراحات</div>
<div id="sugs"></div>
<div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap"><input id="nm" placeholder="هدفك…" style="flex:1"><input id="tot" type="number" placeholder="الكمية (٠=بلا)" style="width:90px"><button class="btn" id="add">أضف</button></div></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const SUGS=['الحج','ختم القراءة ١٠ مرات','حفظ جزء عم','حفظ الأربعين النووية','إتقان العربية','تعليم ١٠ أطفال','قراءة صحيح البخاري كاملاً','إتقان الإنجليزية','برمجة مشروع مفتوح','حفظ ١٠٠ حديث'];
$('#sugs').innerHTML=SUGS.map(s=>'<span class="sug">'+s+'</span>').join('');
$('#sugs').onclick=e=>{const s=e.target.closest('.sug');if(s){$('#nm').value=s.textContent;$('#tot').focus()}};
let G=LS('mihtab',[]);
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 G.unshift({n,tot:+$('#tot').value||0,done:0,dl:'',at:new Date().toISOString().slice(0,10)});
 SV('mihtab',G);$('#nm').value='';$('#tot').value='';render();
};
function autoCount(g){
 // حاول ربط الهدف ببياناته
 if(/قراءة.*القرآن|ختم|جزء/.test(g.n)){
  const m=LS('majlis',{});const total=Object.values(m).reduce((s,a)=>s+Object.keys(a||{}).length,0);
  return Math.round(total/6236*100);
 }
 if(/أربعين|نووي/.test(g.n))return 0;
 if(/إنجليز|english/.test(g.n)){const w=LS('en_vocab',{});return Math.min(100,Math.round(Object.keys(w).length/20))}
 return Math.round((g.done/(g.tot||1))*100);
}
function render(){
 $('#list').innerHTML=G.map((g,i)=>{
  const pct=g.tot?Math.min(100,Math.round(g.done/g.tot*100)):autoCount(g);
  return '<div class="g"><div class="nm">'+esc(g.n)+(pct>=100?' ✓':'')+'</div>'+
  '<div class="meta"><span class="stat">'+arN(g.done)+(g.tot?'/'+arN(g.tot):'')+'</span>'+
  '<button class="btn ghost" data-a="p" data-i="'+i+'">+١</button>'+
  '<button class="btn ghost" data-a="m" data-i="'+i+'">-١</button>'+
  '<button class="btn ghost" data-a="d" data-i="'+i+'" style="color:var(--acc2)">احذف</button></div>'+
  (g.tot||pct>0?'<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>':'')+
  '</div>';
 }).join('')||'<div class="muted" style="margin-top:10px">لا أهداف كبرى — اختر من الاقتراحات.</div>';
}
$('#list').onclick=e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const g=G[+b.dataset.i],a=b.dataset.a;
 if(a==='p')g.done++;
 if(a==='m')g.done=Math.max(0,g.done-1);
 if(a==='d'&&confirm('احذف الهدف؟'))G.splice(+b.dataset.i,1);
 SV('mihtab',G);render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mihtab" data-title="مِحتَب"></script>
</body>
</html>
