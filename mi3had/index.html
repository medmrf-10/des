<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعهَد — العهود</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.pl{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.pl.done{border-color:var(--ok)}
.pl .x{font-family:var(--font-ar);font-size:13.5px}
.pl .meta{font-size:10.5px;color:var(--dim);margin-top:5px}
.pl .prog{height:7px;background:var(--card2);border-radius:4px;margin-top:8px;overflow:hidden}
.pl .prog>i{display:block;height:100%;background:var(--acc);border-radius:4px}
.pl .chk{margin-top:8px;display:flex;gap:6px}
.ck2{width:15px;height:15px;border-radius:4px;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:8px;cursor:pointer}
.ck2.on{background:var(--acc);border-color:var(--acc);color:#14140f}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.verdict{font-size:10.5px;color:var(--ok);margin-top:6px}
.verdict.broke{color:var(--acc2)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعهَد <span class="muted">— العهود</span></h2>
<div class="muted">اعهد لنفسك عهداً بمدة محددة — «أصوم الاثنين والخميس شهراً»، «لا قهوة بعد الرابعة أسبوعين». علّم يومك، وبنهايته الحكم: وفيّ أم ناقض؟</div>
<div class="card"><div class="t">عهد جديد</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="العهد (لا سكر ٣٠ يوماً)" style="flex:1;min-width:150px">
<input id="dy" type="number" min="1" max="365" placeholder="أيام" style="width:70px">
<button class="btn" id="ad">اعهِد</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('mi3had',[]);
const today=()=>new Date().toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim(),dy=+$('#dy').value;if(!n||!dy)return;
 P.unshift({n,dy,st:Date.now(),ok:[today()],v:null});
 SV('mi3had',P);$('#nm').value=$('#dy').value='';render();
};
function render(){
 const act=P.filter(x=>!x.v),done=P.filter(x=>x.v);
 const kept=done.filter(x=>x.v==='kept').length;
 $('#stats').innerHTML='<span class="stat">عهود جارية: <b style="color:var(--acc)">'+arN(act.length)+'</b></span>'+
 '<span class="stat">وفيّ: <b style="color:var(--ok)">'+arN(kept)+'</b></span>'+
 '<span class="stat">ناقض: <b style="color:var(--acc2)">'+arN(done.length-kept)+'</b></span>';
 $('#list').innerHTML=P.slice(0,10).map((x,i)=>{
  const days=Math.floor((Date.now()-x.st)/864e5)+1;
  const pr=Math.min(100,Math.round(x.ok.length/x.dy*100));
  const over=days>x.dy&&!x.v;
  const t=today(),hasToday=x.ok.includes(t);
  let tail='';
  if(x.v)tail='<div class="verdict'+(x.v==='broke'?' broke':'')+'">'+(x.v==='kept'?'🏆 وفيّ':'ناقض — عهد جديد؟')+'</div>';
  else if(over)tail='<div class="verdict'+(x.ok.length>=x.dy*0.7?'':' broke')+'">انتهت المدة — الحكم؟ '+
   '<button class="btn ghost" data-v="kept" data-i="'+i+'" style="color:var(--ok);font-size:10px">وفيت</button>'+
   '<button class="btn ghost" data-v="broke" data-i="'+i+'" style="color:var(--acc2);font-size:10px">نقضت</button></div>';
  else tail='<div class="chk"><span class="muted" style="font-size:10px;margin-left:4px">اليوم:</span>'+
   '<span class="ck2'+(hasToday?' on':'')+'" data-t="'+i+'">'+(hasToday?'✓':'')+'</span></div>';
  return '<div class="pl'+(x.v?' done':'')+'"><div class="x">'+esc(x.n)+'</div>'+
  '<div class="meta">'+arN(days)+'/'+arN(x.dy)+' يوماً — وفيت '+arN(x.ok.length)+' يوماً</div>'+
  '<div class="prog"><i style="width:'+pr+'%"></i></div>'+tail+'</div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا عهود — اعهد عهداً صغيراً تستطيعه.</div>';
}
$('#list').onclick=e=>{
 const t=e.target.closest('[data-t]'),v=e.target.closest('[data-v]');
 if(t){const g=P[+t.dataset.t],td=today();
  if(g.ok.includes(td))g.ok=g.ok.filter(d=>d!==td);else g.ok.push(td);
  SV('mi3had',P);render();return}
 if(v){P[+v.dataset.i].v=v.dataset.v;SV('mi3had',P);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3had" data-title="مِعهَد"></script>
</body>
</html>
