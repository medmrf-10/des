<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مُعلَّقاتي — يومياتي البحثية | مختبر الحديث</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
*{box-sizing:border-box}
body{max-width:900px;margin:0 auto;padding:0 14px 40px}
.top{display:flex;align-items:baseline;gap:14px;padding:16px 0 8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;color:var(--acc2);font-weight:700}
.top .sub{color:var(--dim);font-size:13px}
.top a{color:var(--acc);font-size:13px;text-decoration:none;border:1px solid var(--border);padding:3px 10px;border-radius:8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.bar input{flex:1;min-width:110px;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit}
.btn{display:inline-block;border:1px solid var(--acc);color:var(--acc2);background:transparent;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--card2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed=true]{background:var(--acc);color:#14140f;font-weight:700;border-color:transparent}
.ncard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.ncard .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.ncard .hd .bk{color:var(--acc2);font-weight:700}
.ncard .hd .lk{margin-inline-start:auto;color:var(--acc);text-decoration:none;font-size:11.5px}
.ncard .nt{font-size:13.5px;line-height:1.9;color:var(--txt);margin-top:6px;white-space:pre-wrap}
.ncard .mt{font-family:var(--font-ar);font-size:12.5px;line-height:1.9;color:var(--dim);margin-top:6px;border-top:1px dashed var(--border);padding-top:7px}
.nact{display:flex;gap:8px;margin-top:7px}
.nact button{border:1px solid var(--border);background:transparent;color:var(--dim);border-radius:7px;padding:2px 11px;font-size:11px;cursor:pointer;font-family:inherit}
.nact button:hover{border-color:var(--acc2);color:var(--acc2)}
.nact .del:hover{border-color:#c96a5a;color:#e08a8a}
.mut{color:var(--dim);font-size:12.5px}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:34px;text-align:center;color:var(--dim);font-size:13.5px;line-height:2}
.empty a{color:var(--acc)}
textarea{direction:rtl}
</style>
</head>
<body>
<header class="top">
  <h1>📝 مُعلَّقاتي</h1>
  <span class="sub">يومياتك البحثية — كل ملاحظة كتبتها على متن، مرتبة بالكتب</span>
  <a href="index.html">المختبر ←</a>
  <a href="matn.html">بحث المتون ←</a>
</header>
<div class="bar">
  <input id="q" placeholder="ابحث في ملاحظاتك…">
  <button class="btn" onclick="exportJson()">تصدير JSON</button>
  <button class="btn" onclick="exportTxt()">تصدير نصّي</button>
  <button class="btn" onclick="copyAll(this)">نسخ الكل</button>
</div>
<div class="chips" id="chips"></div>
<div id="main"></div>
<script src="pako.min.js"></script>
<script>
const arNum=n=>Number(n).toLocaleString('ar-EG');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const BOOKS=['bukhari','muslim','tirmidhi','abi-dawud','nasai','ibn-majah'];
const BAR={'bukhari':'صحيح البخاري','muslim':'صحيح مسلم','tirmidhi':'سنن الترمذي','abi-dawud':'سنن أبي داود','nasai':'سنن النسائي','ibn-majah':'سنن ابن ماجه'};
const getNotes=()=>{try{return JSON.parse(localStorage.getItem('hadith_notes')||'{}')}catch(e){return{}}};
const putNotes=o=>localStorage.setItem('hadith_notes',JSON.stringify(o));
const D={};
async function loadBook(b){
  if(D[b])return D[b];
  const buf=await(await fetch(b+'-det.json.gz')).arrayBuffer();
  D[b]=JSON.parse(pako.ungzip(new Uint8Array(buf),{to:'string'}));
  return D[b];
}
let SEL='all',Q='';
function list(){
  const o=getNotes();
  const rows=Object.keys(o).map(k=>{const[b,n]=k.split(':');return{b,n:+n,note:o[k]}})
    .filter(r=>BAR[r.b])
    .filter(r=>SEL==='all'||r.b===SEL)
    .filter(r=>!Q||norm(r.note).includes(norm(Q)))
    .sort((a,c)=>BOOKS.indexOf(a.b)-BOOKS.indexOf(c.b)||a.n-c.n);
  return rows;
}
function paintChips(){
  const o=getNotes();const per={};
  for(const k in o){const b=k.split(':')[0];per[b]=(per[b]||0)+1}
  document.getElementById('chips').innerHTML=
    `<button class="chip" aria-pressed="${SEL==='all'}" onclick="pick('all')">الكل (${arNum(Object.keys(o).length)})</button>`+
    BOOKS.filter(b=>per[b]).map(b=>`<button class="chip" aria-pressed="${SEL===b}" onclick="pick('${b}')">${BAR[b]} (${arNum(per[b])})</button>`).join('');
}
window.pick=b=>{SEL=b;paintChips();paint()};
function paint(){
  const rows=list();
  const main=document.getElementById('main');
  if(!Object.keys(getNotes()).length){
    main.innerHTML=`<div class="empty">لا ملاحظات بعد.<br>افتح <a href="matn.html">بحث المتون</a>، جد حديثاً، واضغط «📝 علّق» تحته — تعود ملاحظاتك هنا.</div>`;
    return;
  }
  if(!rows.length){main.innerHTML='<div class="empty">لا نتيجة لهذا التصفية.</div>';return}
  main.innerHTML=rows.map(r=>`<div class="ncard" id="n-${r.b}-${r.n}">
    <div class="hd"><span class="bk">${BAR[r.b]}</span><span>#${arNum(r.n)}</span>
    <a class="lk" href="matn.html#${r.b}:${r.n}">الحديث ←</a></div>
    <div class="nt">${esc(r.note)}</div>
    <div class="mt" id="m-${r.b}-${r.n}" hidden></div>
    <div class="nact">
      <button onclick="showMatn('${r.b}',${r.n})">المتن</button>
      <button onclick="editNote('${r.b}',${r.n})">✎ عدّل</button>
      <button class="del" onclick="delNote('${r.b}',${r.n})">احذف</button>
    </div></div>`).join('');
}
window.showMatn=async function(b,n){
  const el=document.getElementById(`m-${b}-${n}`);
  if(!el.hidden){el.hidden=true;return}
  el.hidden=false;el.textContent='يُحمّل المتن…';
  try{
    const j=await loadBook(b);
    const e=j.d[n];
    el.textContent=e?e.m:'(لا متن لهذا الرقم)';
  }catch(e){el.textContent='تعذّر التحميل'}
};
window.editNote=async function(b,n){
  const o=getNotes();const k=b+':'+n;
  const cur=o[k]||'';
  const card=document.getElementById(`n-${b}-${n}`);
  const nt=card.querySelector('.nt');
  nt.innerHTML=`<textarea class="noteBox" style="width:100%;min-height:60px;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px">${esc(cur)}</textarea>
    <div class="nact"><button onclick="saveEdit('${b}',${n})">احفظ</button><button onclick="paint()">إلغاء</button></div>`;
  nt.querySelector('textarea').focus();
};
window.saveEdit=(b,n)=>{
  const o=getNotes();const k=b+':'+n;
  const v=document.querySelector(`#n-${b}-${n} textarea`).value.trim();
  if(v)o[k]=v;else delete o[k];
  putNotes(o);paintChips();paint();
};
window.delNote=(b,n)=>{
  const o=getNotes();delete o[b+':'+n];putNotes(o);paintChips();paint();
};
window.exportJson=()=>{
  const o=getNotes();
  const rows=Object.keys(o).map(k=>{const[b,n]=k.split(':');return{book:b,book_ar:BAR[b]||b,num:+n,note:o[k],link:`hadith/matn.html#${b}:${n}`}});
  dl(JSON.stringify(rows,null,2),'hadith_notes.json','application/json');
};
window.exportTxt=()=>{
  const o=getNotes();
  const txt=Object.keys(o).map(k=>{const[b,n]=k.split(':');return `${BAR[b]||b} #${n}\n${o[k]}\n— matn.html#${b}:${n}`}).join('\n\n');
  dl(txt,'hadith_notes.txt','text/plain;charset=utf-8');
};
function dl(content,name,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
window.copyAll=(btn)=>{
  const o=getNotes();
  const txt=Object.keys(o).map(k=>{const[b,n]=k.split(':');return `${BAR[b]||b} #${n}: ${o[k]}`}).join('\n');
  navigator.clipboard.writeText(txt).then(()=>{btn.textContent='نُسخ ✓';setTimeout(()=>btn.textContent='نسخ الكل',1600)});
};
document.getElementById('q').addEventListener('input',e=>{Q=e.target.value.trim();paint()});
paintChips();paint();
</script>
<script src="../shared/feedback.js" data-pid="miq_notes"></script>
</body>
</html>
