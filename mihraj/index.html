<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحرَج — الامتحان المُحْرِج</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:660px;margin:0 auto;padding:14px;text-align:center}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-top:12px;text-align:right}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 22px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:13px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);padding:8px 16px;font-size:12px}
.q{font-family:var(--font-ar);font-size:14px;line-height:2.1;margin-top:8px;min-height:70px}
.opts{display:grid;gap:7px;margin-top:12px}
.opt{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12.5px;text-align:right}
.opt:hover{border-color:var(--acc)}
.opt.correct{background:rgba(212,175,55,.15);border-color:var(--acc)}
.opt.wrong{background:rgba(224,128,128,.1);border-color:#e08080}
.prog{display:flex;gap:4px;justify-content:center;margin-top:12px}
.prog span{width:24px;height:6px;border-radius:3px;background:var(--card2)}
.prog span.on{background:var(--acc)}
.result{font-family:var(--font-ar);font-size:19px;margin-top:10px}
.grade{font-family:var(--font-ar);font-size:40px;color:var(--acc);margin-top:10px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحرَج <span class="muted">— الامتحان المُحْرِج</span></h2>
<div class="muted">١٠ أسئلة من أصعب زوايا مكتبتك — حديث وقرآن وفقه وأحكام. انجُ إن استطعت.</div>
<div id="st" style="margin-top:24px">
<div class="muted">١٠ أسئلة · دون مؤقت · أجب بأمانة</div>
<button class="btn" id="go" style="margin-top:16px">ادخل الامتحان</button>
<div class="muted" style="margin-top:16px" id="hist"></div></div>
<div class="card" id="game" style="display:none;text-align:right">
<div style="display:flex;justify-content:space-between;font-size:12px"><span id="qn" style="color:var(--acc);font-family:var(--font-ar)">١/١٠</span><span id="score" class="muted">٠ صحيحة</span></div>
<div class="q" id="q"></div>
<div class="opts" id="opts"></div>
<div class="prog" id="prog"></div></div>
<div class="card" id="end" style="display:none;text-align:center">
<div class="grade" id="gr"></div>
<div class="result" id="res"></div>
<button class="btn" id="again" style="margin-top:16px">امتحان جديد</button></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G,U,M,qs=[],cur=0,score=0;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA'),laz('../fiqh_reader/masail.js','MASAIL')]).then(([g,u,m])=>{G=g;U=u;M=m});
function build(){
 qs.length=0;
 // أحكام أندر
 if(G){
  const rare=Object.values(G.g).filter(h=>h.h&&h.s>=30);
  rare.sort(()=>Math.random()-0.5).slice(0,4).forEach(h=>{
   const wrong=Object.values(G.g).map(x=>x.h).filter(x=>x&&x!==h.h).slice(0,3);
   qs.push({q:'«'+h.t.slice(0,80)+'…» — ما حكم هذا الحديث عند أهل العلم؟',o:[h.h,...wrong].sort(()=>Math.random()-0.5),a:h.h});
  });
  // رواة
  const rw=Object.values(G.rawi||{}).filter(r=>r.s>5).slice(0,4);
  rw.forEach(r=>{
   qs.push({q:'من هو «'+r.n+'»؟',o:['صحابي','تابعي','راوٍ غير ثقة','مؤلّف'].sort(()=>Math.random()-0.5),a:'صحابي'});
  });
 }
 // متشابهات قوية
 if(U){
  const sims=Object.keys(U.sim).filter(k=>(U.sim[k][3]||[]).length>=4).sort(()=>Math.random()-0.5).slice(0,3);
  sims.forEach(k=>{
   const s=U.sim[k],opts=s[3].slice(0,3).map(([pk])=>U.names[pk.split(':')[0]]);
   const wrong=['البقرة','يس','الملك'].filter(x=>!opts.includes(x)&&x!==U.names[k.split(':')[0]]).slice(0,4-opts.length);
   qs.push({q:'«'+s[2].slice(0,60)+'…» — في أي سورة؟',o:[U.names[k.split(':')[0]],...opts,...wrong].slice(0,4).sort(()=>Math.random()-0.5),a:U.names[k.split(':')[0]]});
  });
 }
 // كتب ومذاهب
 if(M){
  const MN={h:'الحنفية',m:'المالكية',s:'الشافعية',b:'الحنابلة'};
  const bs=Object.values(M).filter(b=>MN[b.m]).sort(()=>Math.random()-0.5).slice(0,3);
  bs.forEach(b=>{
   qs.push({q:'«'+b.n+'» لـ'+(b.a||'مؤلفه')+' — كتاب أي مذهب فقهي؟',o:[MN[b.m],'الحنفية','المالكية','الشافعية','الحنابلة'].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4).sort(()=>Math.random()-0.5),a:MN[b.m]});
  });
 }
 qs.sort(()=>Math.random()-0.5);qs.splice(10);
}
function showQ(){
 $('#qn').textContent=arN(cur+1)+'/١٠';
 $('#score').textContent=arN(score)+' صحيحة';
 const q=qs[cur];
 $('#q').innerHTML=q.q;
 $('#opts').innerHTML=q.o.map(o=>'<button class="opt">'+esc(o)+'</button>').join('');
 $('#prog').innerHTML=qs.map((_,i)=>'<span'+(i===cur?' class="on"':'')+'></span>').join('');
 document.querySelectorAll('#opts .opt').forEach(b=>{
  b.onclick=()=>{
   if(b.textContent===q.a){score++;b.classList.add('correct')}
   else{b.classList.add('wrong');
    document.querySelectorAll('#opts .opt').forEach(x=>{if(x.textContent===q.a)x.classList.add('correct')})}
   setTimeout(()=>{cur++;cur<qs.length?showQ():finish()},900);
  };
 });
}
function finish(){
 const h=LS('mihraj',{n:0,best:0});
 h.n++;if(score>h.best)h.best=score;SV('mihraj',h);
 const g=score>=9?'عالِم':score>=7?'فقيه':score>=5?'طالب':'مبتدئ';
 $('#game').style.display='none';$('#end').style.display='block';
 $('#gr').textContent=arN(score)+'/١٠';
 $('#res').textContent='رتبتك: '+g+' — أفضل نتيجتك '+arN(h.best);
 renderHist();
}
function renderHist(){
 const h=LS('mihraj',{n:0,best:0});
 $('#hist').textContent=h.n?'امتحنت '+arN(h.n)+' مرة — أفضل نتيجة '+arN(h.best):'';
}
$('#go').onclick=()=>{build();cur=0;score=0;$('#st').style.display='none';$('#end').style.display='none';$('#game').style.display='block';showQ()};
$('#again').onclick=()=>$('#go').click();
renderHist();
</script>
<script src="../shared/feedback.js" data-pid="mihraj" data-title="مِحرَج"></script>
</body>
</html>
