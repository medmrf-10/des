<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعبَر — معابر العلم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:660px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.done{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:5px 11px;margin:3px;font-size:12px}
.done.strike{opacity:.5;text-decoration:line-through}
.next{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;margin-top:8px}
.next .nm{font-family:var(--font-ar);font-size:13.5px}
.next .why{font-size:11px;color:var(--dim);margin-top:3px}
.next a{color:var(--acc);font-size:11.5px;text-decoration:none}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:11.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.path{border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-top:8px}
.path .pt{font-family:var(--font-ar);font-weight:700;font-size:13px;color:var(--acc)}
.path .step{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:12px}
.path .step .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.step.done .dot{background:var(--acc)}
.step.done{opacity:.55;text-decoration:line-through}
.step.cur .dot{background:var(--acc2);box-shadow:0 0 0 3px rgba(126,200,216,.2)}
.step.cur{font-weight:700;color:var(--acc2)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعبَر <span class="muted">— ماذا بعد؟</span></h2>
<div class="muted">يقرأ سلاسلك المكتملة ويقترح العبور التالي لكل مسار — بناءً على طبيعة المنهج لا العشوائية.</div>
<div class="card"><div class="t">أكملتَ من السلاسل (من «مِشغل» و«مِجتاز»)</div><div id="done" class="muted">—</div></div>
<div class="card"><div class="t">مسارات العبور</div><div id="paths">—</div></div>
<div class="card"><div class="t">أقرب خطوة تالية لك</div><div id="reco">—</div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
// مستويات المنهج: مبتدئ ← متوسط ← متقدم
const PATHS={
 'التوحيد والعقيدة':['الأجورومية','العقيدة الطحاوية','العقيدة الواسطية','لمعة الاعتقاد','كتاب التوحيد','الأصول الثلاثة','القواعد الأربع','كشف الشبهات','الآجرومية','العقيدة السفارينية','معارج القبول','تدبر التوحيد'],
 'الفقه':['فقه السيرة','زاد المستقنع','الروض المربع','عمدة الفقه','دليل الطالب','الفقه الميسر','أخصر المختصرات','مختصر زاد','متن أبي شجاع','الرحبية','منار السبيل'],
 'الحديث':['الأربعون النووية','عمدة الأحكام','بلوغ المرام','رياض الصالحين','نخبة الفكر','الالباني صحيح','المنتقى','الذريعة'],
 'القرآن':['تفسير جزء عم','تفسير ابن كثير','تيسير الكريم','أيسر التفاسير','التفسير الميسر','مقتطفات التفسير','زاد المسير','التفسير الوسيط'],
 'السيرة':['السيرة النبوية','الشمائل المحمدية','فقه السيرة','الرحيق المختوم','نور اليقين','مختصر السيرة','زاد المعاد'],
 'اللغة':['الآجرومية','ملحة الإعراب','شذور الذهب','ألفية ابن مالك','قطر الندى','المغني','النحو الواضح'],
};
async function load(){
 const S=await new Promise(ok=>{const s=document.createElement('script');s.src='../durus/data.js';s.onload=()=>ok(window.SERIES);s.onerror=()=>ok([]);document.head.appendChild(s)});
 const done=new Set();
 const mj=LS('mijtaz',{});Object.values(mj).flat().forEach(x=>done.add(x.t||x));
 const mg=LS('mishghal',{});Object.keys(mg).forEach(k=>{if(mg[k].idx>=(mg[k].tot||999))done.add(k)});
 const md=LS('mnhaj_done',[]);md.forEach(x=>done.add(x));
 $('#done').innerHTML=[...done].map(d=>'<span class="done">'+esc(d)+'</span>').join('')||'<span class="muted">لا مكتملات بعد — أكمل سلسلة لتبدأ العبور</span>';
 // اكتشف مكان كل مسار
 const reco=[];
 $('#paths').innerHTML=Object.entries(PATHS).map(([path,steps])=>{
  const si=steps.map(s=>{
   const hit=[...done].some(d=>d.includes(s)||s.includes(d));
   const match=S.find(x=>x.name.includes(s)||s.includes(x.name));
   return {s,done:hit,exists:!!match,url:match?('../mishghal/#s='+S.indexOf(match)):null,name:match?match.name:s};
  });
  const firstTodo=si.findIndex(x=>!x.done);
  const cur=firstTodo===-1?null:si[firstTodo];
  if(cur&&cur.exists)reco.push({path,next:cur});
  const stepsHtml=si.map((x,i)=>{
   const cls=x.done?'done':(i===firstTodo?'cur':'');
   return '<div class="step '+cls+'"><span class="dot"></span><span>'+esc(x.name)+'</span></div>';
  }).join('');
  const prog=si.filter(x=>x.done).length;
  return '<div class="path"><div class="pt">'+esc(path)+' <span class="muted" style="font-size:11px">'+prog+'/'+si.length+'</span></div>'+stepsHtml+'</div>';
 }).join('');
 $('#reco').innerHTML=reco.length?reco.slice(0,4).map(r=>
  '<div class="next"><div class="nm">'+esc(r.next.name)+'</div><div class="why">العبور التالي في مسار «'+esc(r.path)+'»</div>'+
  (r.next.url?'<a href="'+r.next.url+'">افتح في مِشغل ←</a>':'<span class="muted">غير مدرج في المكتبة بعد</span>')+'</div>'
 ).join(''):'<span class="muted">أكمل بعض السلاسل ليظهر عبورك التالي — أو تصفّح المسارات أعلاه.</span>';
}
load();
</script>
<script src="../shared/feedback.js" data-pid="mi3bar" data-title="مِعبَر"></script>
</body>
</html>
