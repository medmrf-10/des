<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعيَن — دفتر الجميل</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.g{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.g .who{font-family:var(--font-ar);font-size:13.5px}
.g .what{font-size:12px;color:var(--dim);margin-top:4px}
.g .meta{font-size:10.5px;margin-top:6px}
.g.paid{opacity:.55}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعيَن <span class="muted">— دفتر الجميل</span></h2>
<div class="muted">من صنع لك معروفاً؟ سجّله — وكافئه بدعاء أو ردّ جميل.</div>
<div class="card"><div class="t">جميل جديد</div>
<input id="w" placeholder="ممن؟ (أمي، أخ، صديق، أستاذ…)">
<input id="x" placeholder="ماذا صنع لك؟">
<button class="btn" id="ad" style="margin-top:9px">سجّل</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G=LS('mi3yan',[]);
$('#ad').onclick=()=>{
 const w=$('#w').value.trim(),x=$('#x').value.trim();if(!w||!x)return;
 G.unshift({w,x,at:Date.now(),st:'open'});SV('mi3yan',G);$('#w').value=$('#x').value='';render();
};
function render(){
 const open=G.filter(x=>x.st==='open').length,paid=G.filter(x=>x.st==='paid').length;
 $('#stats').innerHTML='<span class="stat">جميل معلّق: <b style="color:var(--acc)">'+arN(open)+'</b></span>'+
 '<span class="stat">مكافأ عليه: <b style="color:var(--ok)">'+arN(paid)+'</b></span>';
 $('#list').innerHTML=G.slice(0,15).map((x,i)=>{
  const gi=G.indexOf(x);
  return '<div class="g'+(x.st==='paid'?' paid':'')+'"><div class="who">'+esc(x.w)+'</div>'+
  '<div class="what">'+esc(x.x)+'</div>'+
  '<div class="meta">'+new Date(x.at).toLocaleDateString('ar-EG')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
  (x.st==='open'?'<button class="btn ghost" data-p="'+gi+'" style="color:var(--ok);font-size:10px">🤲 دعوت له</button>'+
  '<button class="btn ghost" data-r="'+gi+'" style="color:var(--acc);font-size:10px">🎁 كافأته</button>':'')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا جميل مسجلاً — راجع يومك.</div>';
}
$('#list').onclick=e=>{
 const p=e.target.closest('[data-p]'),r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
 if(p){G[+p.dataset.p].st='paid';G[+p.dataset.p].how='دعاء';SV('mi3yan',G);render();return}
 if(r){G[+r.dataset.r].st='paid';G[+r.dataset.r].how='مكافأة';SV('mi3yan',G);render();return}
 if(d&&confirm('احذف؟')){G.splice(+d.dataset.d,1);SV('mi3yan',G);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3yan" data-title="مِعيَن"></script>
</body>
</html>
