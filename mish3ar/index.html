<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشعَر — ميزان الخشوع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.pr{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px}
.pr .nm{font-family:var(--font-ar);font-size:13.5px;min-width:56px}
.pr .stars{display:flex;gap:4px;flex:1}
.st{width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--dim);font-size:14px;cursor:pointer}
.st.on{background:var(--acc);color:#14140f;border-color:var(--acc)}
.chart{margin-top:12px}
.chart .row{display:flex;gap:9px;align-items:center;margin-top:6px}
.chart .lb{font-size:11.5px;min-width:52px;text-align:left;font-family:var(--font-ar)}
.chart .bar{flex:1;height:22px;background:var(--card2);border-radius:6px;overflow:hidden;display:flex}
.chart .f{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.chart .v{font-size:10.5px;color:var(--dim);min-width:36px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.insight{background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:12px;font-family:var(--font-ar);line-height:1.9}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشعَر <span class="muted">— ميزان الخشوع</span></h2>
<div class="muted">بعد كل صلاة: كم كان قلبك حاضراً؟ (١-٥) — الأنماط تكشف أين تهرب الصلاة.</div>
<div id="today"></div>
<div id="stats" style="margin-top:12px"></div>
<div class="chart" id="chart"></div>
<div id="insight"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
const PRS=['الفجر','الظهر','العصر','المغرب','العشاء'];
let D=LS('mish3ar',{});
if(!D[today()])D[today()]={};
const t=D[today()];
function render(){
 $('#today').innerHTML='<div class="card"><div class="t">صلوات اليوم</div>'+
 PRS.map((p,i)=>'<div class="pr"><span class="nm">'+p+'</span><div class="stars">'+
  [1,2,3,4,5].map(n=>'<button class="st'+(t[i]===n?' on':'')+'" data-p="'+i+'" data-n="'+n+'">'+'●'+'</button>').join('')+'</div></div>').join('')+'</div>';
 // أنماط لكل صلاة عبر الأيام
 const avgs=PRS.map((p,i)=>{
  const vals=Object.keys(D).flatMap(d=>D[d][i]?[D[d][i]]:[]);
  return vals.length?{p,avg:vals.reduce((s,v)=>s+v,0)/vals.length,n:vals.length}:null;
 });
 const rated=avgs.filter(Boolean);
 $('#chart').innerHTML='<div class="card"><div class="t">أنماط الخشوع</div>'+
 (rated.map(r=>'<div class="row"><span class="lb">'+r.p+'</span><div class="bar"><div class="f" style="width:'+(r.avg/5*100)+'%"></div></div><span class="v">'+r.avg.toFixed(1)+' ('+arN(r.n)+')</span></div>').join('')||'<div class="muted">قيّم صلوات اليوم أولاً.</div>')+'</div>';
 const best=rated.sort((a,b)=>b.avg-a.avg)[0],worst=rated.sort((a,b)=>a.avg-b.avg)[0];
 $('#insight').innerHTML=worst&&rated.length>1?'<div class="insight">أضعف صلواتك حضوراً: <b>'+worst.p+'</b> ('+worst.avg.toFixed(1)+') — جرّب الوضوء قبلها مباشرة أو صلاة في مكان أهدأ. أقواها: <b>'+best.p+'</b>.</div>':'';
 $('#stats').innerHTML='<span class="stat">أيام مُقيّمة: <b>'+arN(Object.keys(D).filter(d=>Object.keys(D[d]).length).length)+'</b></span>'+
 '<span class="stat">متوسط اليوم: <b>'+arN(avgToday())+'</b></span>';
 SV('mish3ar',D);
}
function avgToday(){const v=Object.values(t);return v.length?(v.reduce((s,x)=>s+x,0)/v.length).toFixed(1):'—'}
$('#today').onclick=e=>{
 const b=e.target.closest('.st');if(!b)return;
 t[+b.dataset.p]=+b.dataset.n;render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mish3ar" data-title="مِشعَر"></script>
</body>
</html>
