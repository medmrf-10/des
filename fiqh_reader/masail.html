<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مسائل — فهرس أبواب الفقه</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:860px;margin:0 auto;padding:14px}
.qb{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:12px 16px;font-family:var(--font-ar);font-size:17px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.f{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer}
.f.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.hit{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin:6px 0;display:flex;gap:10px;align-items:center}
.hit .t{font-family:var(--font-ar);font-size:14.5px;flex:1;line-height:1.8}
.hit .l{font-size:10px;color:var(--acc2);border:1px solid var(--border);border-radius:99px;padding:1px 8px;white-space:nowrap}
.hit .src{font-size:11px;color:var(--dim);white-space:nowrap}
.muted{color:var(--dim);font-size:12px}
mark{background:rgba(201,162,75,.4);color:#fff;border-radius:2px;padding:0 2px}
.gb{font-size:13px;color:var(--acc2);margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:5px}
a{color:var(--acc2)}
</style>
</head>
<body>
<h1 style="font-size:19px;margin:4px 0;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">مسائل</h1>
<div class="muted">28,672 باباً ومسألة من 55 كتاباً فقهياً — ابحث ثم افتح الباب في القارئ بنصه الكامل</div>
<input class="qb" id="q" placeholder="مسألة… (الغسل، الاستبراء، صلاة الجمعة، الرهن، النكاح…)" autocomplete="off">
<div class="filters" id="madhhabs"></div>
<div id="res"></div>
<script src="masail.js"></script>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
let mad='';
const mads=[...new Set(Object.values(MASAIL).map(b=>b.m).filter(Boolean))].sort();
$('#madhhabs').innerHTML='<button class="f on" data-m="">الكل</button>'+mads.map(m=>`<button class="f" data-m="${esc(m)}">${esc(m)}</button>`).join('');
$('#madhhabs').onclick=e=>{const b=e.target.closest('.f');if(!b)return;mad=b.dataset.m;
 $$('#madhhabs .f').forEach(x=>x.classList.toggle('on',x===b));search()};
const $$=q=>[...document.querySelectorAll(q)];
function hl(t,ws){let x=esc(t);for(const w of ws){try{x=x.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}catch(e){}}return x}
let deb=null;
function search(){
 const q=$('#q').value.trim();
 if(q.length<2){$('#res').innerHTML='';return}
 const ws=q.split(/\s+/).map(norm).filter(Boolean);
 const nw=norm(q);
 const hits=[];
 for(const slug in MASAIL){
  const b=MASAIL[slug];
  if(mad&&b.m!==mad)continue;
  for(const u of b.u){
   const nt=norm(u.t);
   let sc=0;
   if(nt.includes(nw))sc=3;
   else{let h=0;for(const w of ws)if(nt.includes(w))h++;if(h>=Math.min(ws.length,2))sc=h}
   if(sc)hits.push({slug,b,u,sc})}}
 hits.sort((a,b)=>b.sc-a.sc||((b.u.l||0)-(a.u.l||0)));
 const LVL={1:'كتاب',2:'باب',3:'فصل',4:'مسألة'};
 const byBook={};
 for(const h of hits.slice(0,150))(byBook[h.slug]=byBook[h.slug]||[]).push(h);
 let html='';
 for(const slug of Object.keys(byBook).sort((x,y)=>byBook[y].length-byBook[x].length)){
  const b=MASAIL[slug];
  html+=`<div class="gb">${esc(b.n)} <span class="muted">— ${esc(b.a)} · ${esc(b.m)} · ${byBook[slug].length.toLocaleString('ar-EG')} موضعاً</span></div>`;
  for(const h of byBook[slug].slice(0,12))
   html+=`<div class="hit"><span class="l">${LVL[h.u.l]||'بند'}</span><div class="t">${hl(h.u.t,ws)}</div><a href="index.html#${h.slug}/${h.u.i}" target="_blank">افتح ↗</a></div>`}
 $('#res').innerHTML=html||'<div class="muted" style="text-align:center;padding:30px">لا نتيجة — جرّب لفظاً آخر (الفقهاء يختلفون في العبارة)</div>'}
$('#q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(search,280)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="fiqh_reader" data-title="مسائل — فهرس الأبواب"></script>
</body>
</html>
