<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجرَس — أجراس التنبيه</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.bell{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px;display:flex;gap:11px;align-items:center}
.bell .tm{font-family:var(--font-ui);font-size:15px;color:var(--acc);min-width:64px}
.bell .n{flex:1;font-family:var(--font-ar);font-size:13px}
.bell.off{opacity:.4}
.ring{animation:ring .5s infinite}
@keyframes ring{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجرَس <span class="muted">— أجراس التنبيه</span></h2>
<div class="muted">أجراس تدقّ وأنت داخل الموقع — للورد، الدواء، الدرس، فاصل الاستراحة.</div>
<div class="card"><div class="t">جرس جديد</div>
<div style="display:flex;gap:8px">
<input id="tm" type="time" style="width:110px">
<input id="n" placeholder="الرسالة (وردك، قِسْطَ من الكتاب…)"></div>
<button class="btn" id="ad" style="margin-top:9px">أضِف الجرس</button>
<div class="muted" style="margin-top:8px">⚠ الأجراس تعمل وأنت داخل الموقع فقط — الصفحة مفتوحة = الجرس حي.</div></div>
<div id="ring" style="display:none;text-align:center;margin-top:11px">
<div style="font-size:44px;animation:ring .5s infinite;display:inline-block">🔔</div>
<div id="ringMsg" style="font-family:var(--font-ar);font-size:16px;margin:10px 0"></div>
<button class="btn" id="ok">حسناً</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let B=LS('mijras',[]),ringing=null;
$('#ad').onclick=()=>{
 const t=$('#tm').value,n=$('#n').value.trim();if(!t||!n)return;
 B.push({t,n,on:true});B.sort((a,b)=>a.t.localeCompare(b.t));
 SV('mijras',B);$('#n').value='';render();
};
function beep(){
 try{const c=new (window.AudioContext||window.webkitAudioContext)();
 [0,0.25,0.5].forEach(d=>{const o=c.createOscillator(),g=c.createGain();
 o.connect(g);g.connect(c.destination);o.frequency.value=880;
 g.gain.setValueAtTime(0.15,c.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d+0.2);
 o.start(c.currentTime+d);o.stop(c.currentTime+d+0.2)});
 }catch(e){}
}
function tick(){
 const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 if(ringing)return;
 const hit=B.find(x=>x.on&&x.t===hm);
 if(hit){ringing=hit;beep();
  $('#ringMsg').textContent=hit.n;$('#ring').style.display='block';}
}
$('#ok').onclick=()=>{
 if(ringing){ringing.on=false;SV('mijras',B);ringing=null}
 $('#ring').style.display='none';render();
};
function render(){
 $('#stats').innerHTML='<span class="stat">أجراس: <b>'+arN(B.length)+'</b></span>'+
 '<span class="stat">مفعّلة: <b>'+arN(B.filter(x=>x.on).length)+'</b></span>';
 $('#list').innerHTML=B.map((x,i)=>{
  const gi=B.indexOf(x);
  return '<div class="bell'+(x.on?'':' off')+'"><span class="tm">'+x.t+'</span>'+
  '<span class="n">'+esc(x.n)+'</span>'+
  '<button class="btn ghost" data-t="'+gi+'" style="font-size:10px">'+(x.on?'أسكِت':'فعّل')+'</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أجراس — أضِف الأول.</div>';
}
$('#list').onclick=e=>{
 const t=e.target.closest('[data-t]'),d=e.target.closest('[data-d]');
 if(t){B[+t.dataset.t].on=!B[+t.dataset.t].on;SV('mijras',B);render();return}
 if(d&&confirm('احذف الجرس؟')){B.splice(+d.dataset.d,1);SV('mijras',B);render()}
};
/* re-enable all bells at midnight */
setInterval(()=>{const n=new Date();if(n.getHours()===0&&n.getMinutes()===0){B.forEach(x=>x.on=true);SV('mijras',B);render()}tick()},15000);
render();
</script>
<script src="../shared/feedback.js" data-pid="mijras" data-title="مِجرَس"></script>
</body>
</html>
