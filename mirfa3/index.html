<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرفَع — الرافعة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.act{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-top:9px}
.act .n{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#14140f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.act .bd{flex:1}
.act .nm{font-family:var(--font-ar);font-size:14px}
.act .ds{font-size:11px;color:var(--dim);margin-top:2px}
.act a{color:var(--acc);text-decoration:none;font-size:11.5px;white-space:nowrap}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.empty{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:16px;text-align:center;font-family:var(--font-ar);margin-top:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرفَع <span class="muted">— الرافعة</span></h2>
<div class="muted">لا تفكر — ثلاث خطوات سريعة تصعد بك الآن، محسوبة من وضعك الحالي.</div>
<div id="stats"></div>
<div id="acts"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const today=()=>new Date().toISOString().slice(0,10);
const A=[];
// ١) مراجعات مستحقة
const q=LS('mi3wad_q',{});
const due=Object.values(q).filter(r=>{if(!r.at)return false;const d=new Date(r.at);d.setDate(d.getDate()+[1,3,7,14,30][Math.min(r.idx||0,4)]);return d.toISOString().slice(0,10)<=today()}).length;
if(due)A.push({n:'أنهِ '+arN(Math.min(due,5))+' مراجعات مستحقة',ds:'أقدم مراجعات مِعوّد — ٥ دقائق',u:'../mi3wad/',w:due});
// ٢) أهداف غير مكتملة اليوم
const g=LS('miqsad',{date:today(),goals:[]});
const open=(g.goals||[]).filter(x=>!x.done).length;
if(open)A.push({n:'أنجز هدفاً من أهداف اليوم',ds:arN(open)+' متبقية في مِقصاد',u:'../miqsad/',w:open*2});
// ٣) الروتين الصباحي إن لم يُنجز
const sh=LS('mishmar',{date:'',done:{}});
if(sh.date!==today()||Object.values(sh.done||{}).filter(Boolean).length<3)
 A.push({n:'أكمل روتينك الصباحي',ds:'مِشمَر — أساس اليوم',u:'../mishmar/',w:3});
// ٤) الصلوات غير المسجلة
const sp=LS('misbah_'+today(),{});
if(Object.keys(sp).length<2)A.push({n:'سجّل صلواتك في مِسبَح',ds:'يحفظ اتساق يومك',u:'../misbah/',w:2});
// ٥) صندوق الوارد إن مملوء
const kh=LS('mikhzan',[]);
if(kh.length>3)A.push({n:'صفِّ '+arN(kh.length)+' عناصر من مِخزَن',ds:'مِصرَف يفضّها في دقائق',u:'../misraf/',w:kh.length>8?4:1});
// ٦) اقتداء اليوم
const md=LS('miqtad',{});
const mdDone=Object.values(md[today()]||{}).filter(Boolean).length;
if(mdDone<7)A.push({n:'اقتدِ الخطوة التالية من يوم النبي ﷺ',ds:'مِقتَد — '+arN(mdDone)+'/١٤ مكتملة',u:'../miqtad/',w:1});
// ٧) تقييم اليوم إن كان متأخراً
const hr=new Date().getHours();
const mj=LS('mijdar',{});
if(hr>=20&&!mj[today()])A.push({n:'قيّم يومك قبل النوم',ds:'مِجدار أو طقس مِرقَد',u:'../mirqad/',w:1});
A.sort((a,b)=>b.w-a.w);
const tops=A.slice(0,3);
$('#stats').innerHTML='<span class="stat">مرشحة: <b>'+arN(A.length)+'</b> خطوة</span>';
$('#acts').innerHTML=tops.length?tops.map((a,i)=>'<div class="act"><div class="n">'+arN(i+1)+'</div><div class="bd"><div class="nm">'+esc(a.n)+'</div><div class="ds">'+esc(a.ds)+'</div></div><a href="'+a.u+'">افتح ←</a></div>').join(''):'<div class="empty">يومك نظيف — لا خطوات معلّقة. اختر مرعاك في مِرتَع.</div>';
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mirfa3" data-title="مِسعَد"></script>
</body>
</html>
