<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقنَع — سجل الأقنعة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:50px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.mk{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.mk .s{font-family:var(--font-ar);font-size:13px}
.mk .fake{font-size:12px;color:var(--acc2);margin-top:5px}
.mk .real{font-size:12px;color:var(--ok);margin-top:5px}
.mk .meta{font-size:10px;color:var(--dim);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقنَع <span class="muted">— سجل الأقنعة</span></h2>
<div class="muted">أين لعبتَ دوراً غير دورك؟ سجّل الموقف، القناع الذي لبسته، والصادق الذي كان يجب أن يكون.</div>
<div class="card"><div class="t">موقف</div>
<input id="s" placeholder="الموقف (اجتماع، مع صديق، في بيت أهلي…)">
<textarea id="f" placeholder="القناع الذي لبسته (تظاهرت بالموافقة، أخفيت رأيي…)"></textarea>
<textarea id="r" placeholder="الصادق: ما كان يجب أن أقول/أفعل"></textarea>
<button class="btn" id="ad" style="margin-top:9px">سجّل</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let M=LS('miqna3',[]);
$('#ad').onclick=()=>{
 const s=$('#s').value.trim();if(!s)return;
 M.unshift({s,f:$('#f').value.trim(),r:$('#r').value.trim(),at:Date.now()});
 SV('miqna3',M);$('#s').value=$('#f').value=$('#r').value='';render();
};
function render(){
 const today=new Date().toISOString().slice(0,10);
 const tn=M.filter(x=>new Date(x.at).toISOString().slice(0,10)===today).length;
 const tru=M.filter(x=>x.r).length;
 $('#stats').innerHTML='<span class="stat">أقنعة مسجلة: <b>'+arN(M.length)+'</b></span>'+
 '<span class="stat">اليوم: <b>'+arN(tn)+'</b></span>'+
 '<span class="stat">بديل صادق مكتوب: <b style="color:var(--ok)">'+arN(tru)+'</b></span>';
 $('#list').innerHTML=M.slice(0,12).map((x,i)=>{
  const gi=M.indexOf(x);
  return '<div class="mk"><div class="s">'+esc(x.s)+'</div>'+
  (x.f?'<div class="fake">🎭 '+esc(x.f)+'</div>':'')+
  (x.r?'<div class="real">✓ '+esc(x.r)+'</div>':'')+
  '<div class="meta">'+new Date(x.at).toLocaleDateString('ar-EG')+'</div>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);padding:4px 8px;margin-top:6px;font-size:10px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أقنعة مسجلة — كن صادقاً مع نفسك.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){M.splice(+d.dataset.d,1);SV('miqna3',M);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="miqna3" data-title="مِقنَع"></script>
</body>
</html>
