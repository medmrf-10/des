<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مطلع — عائلات المطالع</title>
<link rel="stylesheet" href="../shared/theme.css">
<script src="matla3.js"></script>
<style>
body{max-width:860px;margin:0 auto;padding:14px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:12px 16px;font-family:var(--font-ar);font-size:16px}
.fam{background:var(--card);border:1px solid var(--border);border-radius:13px;margin:9px 0;overflow:hidden}
.fam .fh{padding:11px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.fam .fh b{font-family:var(--font-ar);font-size:15.5px;color:var(--acc2)}
.fam .fh span{font-size:11px;color:var(--dim);background:var(--card2);border-radius:99px;padding:2px 10px}
.fam .mem{display:none;border-top:1px solid var(--border)}
.fam.open .mem{display:block}
.m{padding:9px 15px;border-bottom:1px dashed var(--border);font-family:var(--font-ar);font-size:13.5px;line-height:1.9}
.m:last-child{border:0}
.m .b{font-size:10px;color:var(--acc2);border:1px solid var(--border);border-radius:99px;padding:1px 8px}
.m a{font-size:10.5px;color:var(--acc2)}
.muted{color:var(--dim);font-size:12px}
.mad{display:inline-block;background:var(--card2);border-radius:9px;padding:3px 11px;margin:3px;font-size:12px;font-family:var(--font-ar)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مطلع <span class="muted" style="font-weight:400;font-size:12px">— عائلات المطالع</span></h2>
<div class="muted">4,691 عائلة تجمع الأحاديث التي تبدأ بنفس المطلع (3 كلمات) — طريقة الحفاظ في التصنيف: «كل حديث يُذكر بمطلعه». 16,994 حديثاً في الكتب الستة.</div>
<input class="inp" id="q" placeholder="مطلع… (إنما الأعمال، كان رسول الله، حدثنا)" autocomplete="off" style="margin-top:10px">
<div class="muted" style="margin:8px 0" id="cnt"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const BK={bukhari:'بخاري',muslim:'مسلم',tirmidhi:'ترمذي','abi-dawud':'أبو داود',nasai:'نسائي','ibn-majah':'ابن ماجه'};
const keys=Object.keys(MATLA3).sort((a,b)=>MATLA3[b].length-MATLA3[a].length);
function render(list){
 $('#list').innerHTML=list.slice(0,80).map((k,i)=>`
 <div class="fam" id="f${i}">
  <div class="fh" data-i="${i}" data-k="${esc(k)}"><b>${esc(k)}</b><span>${MATLA3[k].length.toLocaleString('ar-EG')} حديثاً</span></div>
  <div class="mem">${MATLA3[k].map(m=>`<div class="m"><span class="b">${BK[m[0]]||m[0]} ${m[1]}</span> ${esc(m[2])}… <a href="misbar.html?b=${m[0]}&n=${m[1]}">مسبار ↗</a></div>`).join('')}</div>
 </div>`).join('')}
let deb=null;
function search(){
 const q=norm($('q').value.trim());
 const hits=q.length<2?keys.slice(0,40):keys.filter(k=>norm(k).includes(q));
 $('#cnt').textContent=hits.length.toLocaleString('ar-EG')+' عائلة';
 render(hits)}
$('q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(search,250)});
$('#list').onclick=e=>{const h=e.target.closest('.fh');if(h)$('f'+h.dataset.i).classList.toggle('open')};
search();
</script>
<script src="../shared/feedback.js" data-pid="matla3" data-title="مطلع"></script>
</body>
</html>
