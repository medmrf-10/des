<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِختلف — الخلاف بعين واحدة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:900px;margin:0 auto;padding:14px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:11px 15px;font-family:var(--font-ar);font-size:14px;box-sizing:border-box}
.inp:focus{outline:none;border-color:var(--acc)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px;margin-top:10px}
.md{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
.md .h{font-size:11px;color:var(--acc);font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between}
.md .u{font-family:var(--font-ar);font-size:13px;line-height:1.95;margin:7px 0;padding-top:7px;border-top:1px solid var(--card2)}
.muted{color:var(--dim);font-size:12px}
mark{background:rgba(232,185,63,.22);color:var(--acc);border-radius:3px;padding:0 2px}
.stat{display:inline-block;background:var(--card2);border-radius:8px;padding:3px 10px;font-size:11px;margin:3px 4px 0 0}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِختلف <span class="muted">— المسألة الواحدة عند المذاهب</span></h2>
<div class="muted">ابحث عن باب أو مسألة — يعرض لك نصوص كل مذهب عنها متجاورة، لتعقد الخلاف بعينك لا بالنقل.</div>
<input class="inp" id="q" placeholder="باب أو لفظ… (مثلاً: وضوء، نية، سترة)" autofocus>
<div id="st"></div>
<div class="cols" id="out"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const MADH={h:'حنفي',m:'مالكي',s:'شافعي',b:'حنبلي',o:'أخرى'};
let M=null;
async function boot(){
 const s=document.createElement('script');s.src='../fiqh_reader/masail.js';
 await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.head.appendChild(s)});
 M=window.MASAIL}
function go(){
 const q=norm($('#q').value.trim());if(q.length<2){$('#out').innerHTML='';$('#st').innerHTML='';return}
 const groups={};let tot=0;
 for(const sl of Object.keys(M)){
  const b=M[sl];const md=MADH[b.m]||b.m||'أخرى';
  const hits=b.u.filter(u=>norm(u.t||'').includes(q)).slice(0,5);
  if(hits.length){(groups[md]=groups[md]||[]).push(...hits.map(u=>({u,b})));tot+=hits.length}}
 $('#st').innerHTML=tot?`<span class="stat">${tot.toLocaleString('ar-EG')} نصاً في ${Object.keys(groups).length.toLocaleString('ar-EG')} مذاهب</span>`:'<span class="stat">لا نتائج</span>';
 $('#out').innerHTML=Object.keys(groups).map(md=>{
  const pat=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return `<div class="md"><div class="h"><span>${md}</span><span class="muted">${groups[md][0].b.n.slice(0,24)}</span></div>`+
  groups[md].map(x=>`<div class="u">${esc(x.u.t||x.u.i).replace(new RegExp(pat,'g'),m=>`<mark>${m}</mark>`)}</div>`).join('')+'</div>'}).join('')
  ||'<div class="muted" style="padding:14px">لا نصوص مطابقة — جرّب لفظاً أعمّ (مثلاً «صلاة»)</div>'}
$('#q').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(go,350)};
boot();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mukhtalif" data-title="مِختلف"></script>
</body>
</html>
