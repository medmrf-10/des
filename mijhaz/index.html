<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجهَز — قوائم التجهيز</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.tab{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:6px 13px;margin:3px;cursor:pointer;font-size:12px;font-family:var(--font-ar)}
.tab.on{border-color:var(--acc);color:var(--acc)}
.it{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-top:6px;cursor:pointer}
.it .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.it.on .ck{background:var(--acc);border-color:var(--acc);color:#14140f}
.it .x{flex:1;font-family:var(--font-ar);font-size:13px}
.it.on .x{text-decoration:line-through;opacity:.5}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجهَز <span class="muted">— قوائم التجهيز</span></h2>
<div class="muted">قوائم جاهزة قابلة لإعادة الاستعمال — لا تنسى شيئاً قبل الخروج.</div>
<div id="tabs"></div>
<div class="card"><div class="t" id="lt"></div><div id="lst"></div>
<div style="display:flex;gap:8px;margin-top:9px">
<input id="nw" placeholder="عنصر جديد">
<button class="btn" id="ad" style="flex-shrink:0">أضِف</button></div>
<button class="btn ghost" id="reset" style="margin-top:9px;font-size:10px">↺ أعد القائمة</button></div>
<div id="stats"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const DEF={
 'سفر':['جواز/بطاقة','شاحن هاتف','محفظة','ملابس','دواء','منشفة','فرشاة أسنان','ماء'],
 'حقيبة عمل':['لابتوب','شاحن','دفتر','قلم','ماء','وجبة خفيفة','سماعات'],
 'نادي رياضي':['حذاء رياضي','ملابس رياضية','منشفة','ماء','سماعات','قفل خزانة'],
 'مسجد':['مصحف صغير','سجادة','مسواك','مسبحة']};
let L=LS('mijhaz',{}),cur=LS('mijhaz_cur','سفر');
Object.keys(DEF).forEach(k=>{if(!L[k])L[k]=DEF[k].map(x=>({x,on:false}))});
SV('mijhaz',L);
$('#ad').onclick=()=>{
 const x=$('#nw').value.trim();if(!x)return;
 L[cur].push({x,on:false});SV('mijhaz',L);$('#nw').value='';render();
};
$('#reset').onclick=()=>{
 L[cur]=DEF[cur]?DEF[cur].map(x=>({x,on:false})):[];
 if(!L[cur].length)L[cur]=[];
 L[cur].forEach(i=>i.on=false);SV('mijhaz',L);render();
};
function render(){
 const names=[...new Set([...Object.keys(DEF),...Object.keys(L)])];
 $('#tabs').innerHTML=names.map(n=>'<span class="tab'+(n===cur?' on':'')+'" data-t="'+n+'">'+esc(n)+'</span>').join('')+
 '<span class="tab" data-n="+ قائمة" style="color:var(--dim)">+ قائمة</span>';
 $('#lt').textContent=cur;
 const l=L[cur]||[];
 const done=l.filter(i=>i.on).length;
 $('#stats').innerHTML='<span class="stat">'+esc(cur)+': <b style="color:var(--ok)">'+arN(done)+'/'+arN(l.length)+'</b></span>'+
 (done===l.length&&l.length?'<span class="stat" style="color:var(--ok)">🏆 كل شيء محزوم</span>':'');
 $('#lst').innerHTML=l.map((i,x)=>'<div class="it'+(i.on?' on':'')+'" data-i="'+x+'">'+
 '<span class="ck">'+(i.on?'✓':'')+'</span><span class="x">'+esc(i.x)+'</span>'+
 '<button class="btn ghost" data-d="'+x+'" style="color:var(--acc2);padding:3px 7px;font-size:9px">✕</button></div>').join('')||
 '<div class="muted" style="margin-top:9px">قائمة فارغة.</div>';
}
$('#tabs').onclick=e=>{
 const t=e.target.closest('[data-t]');if(t){cur=t.dataset.t;SV('mijhaz_cur',cur);render();return}
 const n=e.target.closest('[data-n]');if(n){const nm=prompt('اسم القائمة:');if(nm){L[nm]=[];cur=nm;SV('mijhaz',L);SV('mijhaz_cur',cur);render()}}
};
$('#lst').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d){L[cur].splice(+d.dataset.d,1);SV('mijhaz',L);render();return}
 const it=e.target.closest('.it');if(!it)return;
 L[cur][+it.dataset.i].on=!L[cur][+it.dataset.i].on;SV('mijhaz',L);render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mijhaz" data-title="مِجهَز"></script>
</body>
</html>
