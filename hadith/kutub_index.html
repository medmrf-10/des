<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فهرس الكتب — الستة | مختبر الحديث</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:980px;margin:0 auto;padding:0 14px 40px}
.top{display:flex;align-items:baseline;gap:14px;padding:16px 0 8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;color:var(--acc2);font-weight:700}
.top .sub{color:var(--dim);font-size:13px}
.top a{color:var(--acc);font-size:13px;text-decoration:none;border:1px solid var(--border);padding:3px 10px;border-radius:8px}
.pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.pick input{flex:1;min-width:180px;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit}
.chip{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--acc2);color:var(--acc2)}
.status{color:var(--dim);font-size:12px;padding:4px 2px}
.prog{height:4px;background:var(--card2);border-radius:2px;margin:6px 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc2);transition:width .2s}
.book{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.book .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;cursor:pointer}
.book h3{margin:0;font-size:16px;color:var(--txt)}
.book .stats{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;margin-top:8px}
.st{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;color:var(--dim)}
.st b{color:var(--txt)}
.bdg{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700}
.v-sa{background:#14291c;color:var(--ok)}.v-hs{background:#332a17;color:var(--acc2)}
.v-df,.v-sd,.v-mw{background:#3a1d1d;color:#e08a8a}.v-ot,.v-ns{background:#22303f;color:#9db8d4}
.first10{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.hrow{display:flex;gap:8px;align-items:flex-start;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12px}
.hrow .nm{color:var(--acc2);font-weight:700;white-space:nowrap}
.hrow .tx{flex:1;color:var(--txt);line-height:1.8}
.hrow a{color:var(--acc);text-decoration:none;white-space:nowrap}
.mut{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header class="top">
  <h1>📚 فهرس الكتب</h1>
  <span class="sub">الأمهات الست — إحصاءات محسوبة من شبكة المعنى</span>
  <a href="index.html">المختبر ←</a>
  <a href="net.html">⛓ الشبكة ←</a>
</header>
<div class="pick">
  <input type="text" id="q" placeholder="ابحث باسم كتاب…">
  <span id="fchips"></span>
</div>
<div class="prog"><i id="pfill"></i></div>
<div class="status" id="stat"></div>
<div id="main"></div>
<script src="pako.min.js"></script>
<script src="kutub_index.js"></script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="miq_kutub"></script>
</body>
</html>
