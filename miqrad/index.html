<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقرَض — قائمة القطع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.cut{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.cut .t{font-family:var(--font-ar);font-size:13.5px}
.cut .meta{font-size:10.5px;color:var(--dim);margin-top:4px}
.cut.gone{opacity:.45;text-decoration:line-through}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:16px;text-align:center;margin-top:11px;font-family:var(--font-ar)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقرَض <span class="muted">— قائمة القطع</span></h2>
<div class="muted">التقدم قطعٌ أكثر منه إضافة. سجّل ما تقطعه من حياتك — عادة، تطبيقاً، طعاماً — وصِد كل يوم.</div>
<div class="card"><div class="t">قطع جديد</div>
<input id="t" placeholder="ما الذي تقطعه؟ (تطبيق، سكر، سهر، شخصية مُلهِية…)">
<button class="btn" id="ad" style="margin-top:9px">اقطعه</button></div>
<div id="banner"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let C=LS('miqrad',[]);
const today=()=>new Date().toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const t=$('#t').value.trim();if(!t)return;
 C.unshift({t,st:'cutting',ok:[],at:Date.now()});SV('miqrad',C);$('#t').value='';render();
};
function render(){
 const t=today();
 const active=C.filter(x=>x.st==='cutting');
 const heldToday=active.filter(x=>x.ok.includes(t)).length;
 const totalDays=C.reduce((s,x)=>s+x.ok.length,0);
 $('#banner').innerHTML=active.length?'<div class="banner">صمدت اليوم في <b>'+arN(heldToday)+'/'+arN(active.length)+'</b> قطع</div>':'';
 $('#stats').innerHTML='<span class="stat">قيد القطع: <b>'+arN(active.length)+'</b></span>'+
 '<span class="stat">أيام صمود إجمالاً: <b style="color:var(--ok)">'+arN(totalDays)+'</b></span>'+
 '<span class="stat">قُطع نهائياً: <b>'+arN(C.filter(x=>x.st==='gone').length)+'</b></span>';
 $('#list').innerHTML=C.slice(0,15).map((x,i)=>{
  const gi=C.indexOf(x);
  const held=x.ok.includes(t);
  return '<div class="cut'+(x.st==='gone'?' gone':'')+'"><div class="t">'+esc(x.t)+'</div>'+
  '<div class="meta">'+arN(x.ok.length)+' يوم صمود · '+new Date(x.at).toLocaleDateString('ar-EG')+'</div>'+
  (x.st==='cutting'?'<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
  (held?'<span style="font-size:10px;color:var(--ok)">✓ صمدت اليوم</span>':'<button class="btn ghost" data-h="'+gi+'" style="color:var(--ok);font-size:10px">✂️ صمدت اليوم</button>')+
  '<button class="btn ghost" data-g="'+gi+'" style="font-size:10px;color:var(--acc)">قُطع نهائياً</button></div>':'')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px;padding:4px 8px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا شيء مقطوعاً — ما أول ما تقطع؟</div>';
}
$('#list').onclick=e=>{
 const h=e.target.closest('[data-h]'),g=e.target.closest('[data-g]'),d=e.target.closest('[data-d]');
 if(h){C[+h.dataset.h].ok.push(today());SV('miqrad',C);render();return}
 if(g){C[+g.dataset.g].st='gone';SV('miqrad',C);render();return}
 if(d&&confirm('احذف؟')){C.splice(+d.dataset.d,1);SV('miqrad',C);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="miqrad" data-title="مِقرَض"></script>
</body>
</html>
