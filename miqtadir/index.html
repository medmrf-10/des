<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقتدِر — خريطة قوتك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:660px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.field{margin-top:9px}
.field .row{display:flex;justify-content:space-between;font-size:12.5px}
.field .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px}
.field .bar i{display:block;height:100%;border-radius:4px}
.muted{color:var(--dim);font-size:12px}
.badge{display:inline-block;background:var(--acc);color:#14140f;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;margin-left:6px}
.note{font-size:11.5px;color:var(--dim);font-style:italic;margin-top:8px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقتدِر <span class="muted">— خريطة قوتك الحقيقية</span></h2>
<div class="muted">لا وهم ولا تخمين: يجمع نتائجك الفعلية من كل الأدوات ويقدّر قوتك بكل ميدان.</div>
<div class="card"><div class="t">قوتك بالميادين</div><div id="fields"></div><div class="note" id="note"></div></div>
<div class="card"><div class="t">أقوى مواضعك (أدلة)</div><div id="evid" class="muted">—</div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const F=[];
// القرآن
const mijtaz=LS('mijtaz',{});const doneJ=Object.values(mijtaz).flat().length;
const majlis=LS('majlis',{});const read=Object.values(majlis).reduce((a,b)=>a+(Array.isArray(b)?b.length:0),0);
const itqan=LS('itqan',{n:0,sum:0});const murattil=LS('murattil',{});
const qScore=Math.min(100,Math.round(doneJ*2+read*0.5+(itqan.n?itqan.sum/itqan.n*10:0)+Object.keys(murattil).length*3));
F.push(['القرآن والتحفيظ',qScore,['آيات مُتقنة '+arN(Object.keys(murattil).length),'أجزاء '+arN(doneJ),'قراءات '+arN(read)]]);
// الحديث
const mitla3=LS('mitla3',{});const hd=Object.keys(mitla3.days||{}).length;
const mihfil=LS('mihfil',{n:0,sum:0});const mustamli=LS('mustamli',{n:0,sum:0,best:0});
const hScore=Math.min(100,Math.round(hd*5+(mihfil.n?mihfil.sum/mihfil.n/10:0)+(mustamli.n?mustamli.sum/mustamli.n/10:0)));
F.push(['الحديث',hScore,['أيام دروس '+arN(hd),'أحكام '+arN(mihfil.n),'استملاء '+arN(mustamli.n)]]);
// الفقه
const mushbih=LS('mushbih',{n:0,ok:0});const mishrab=LS('mishrab',{});
const fScore=Math.min(100,Math.round((mushbih.n?mushbih.ok/mushbih.n*100*0.5:0)+Object.keys(mishrab).length*0.5));
F.push(['الفقه والمذاهب',fScore,['مقارنات '+arN(mushbih.n),'أصوات '+arN(Object.keys(mishrab).length)]]);
// اللغة
const mistr=LS('mistr',{n:0,best:0});const moseh=LS('moseh',{});
const lScore=Math.min(100,Math.round((mistr.n?mistr.best/100*60:0)+Object.keys(moseh).length*0.2));
F.push(['اللغة العربية',lScore,['إعراب '+arN(mistr.n),'كلمات سهلة '+arN(Object.keys(moseh).length)]]);
// الإنجليزية
const en_srs=LS('en_srs',{});const en_feed=LS('en_feed_seen',[]);const en_vocab=LS('en_vocab',{});
const eScore=Math.min(100,Math.round(Object.keys(en_srs).length*0.3+en_feed.length*0.2+Object.keys(en_vocab).length*0.4));
F.push(['الإنجليزية',eScore,['SRS '+arN(Object.keys(en_srs).length),'قصص '+arN(en_feed.length),'مفردات '+arN(Object.keys(en_vocab).length)]]);
// البرمجة
const prog=LS('prog_v1',{});const prog_exam=LS('prog_exam',{});const prog_proj=LS('prog_proj',{});
const pScore=Math.min(100,Math.round(Object.keys(prog).length*2+Object.keys(prog_exam).length*3+Object.keys(prog_proj).length*5));
F.push(['البرمجة',pScore,['دروس '+arN(Object.keys(prog).length),'امتحانات '+arN(Object.keys(prog_exam).length),'مشاريع '+arN(Object.keys(prog_proj).length)]]);
// الثبات
const misbah=LS('misbah_'+new Date().toISOString().slice(0,10),null);
const mizan=Object.keys(localStorage).filter(k=>/^misbah_\d{4}-/.test(k)).length;
const days=Object.keys(LS('midad',{})).length;
const cScore=Math.min(100,Math.round(mizan*8+days*4));
F.push(['الثبات والانتظام',cScore,['أيام مِصباح '+arN(mizan),'أيام مِداد '+arN(days)]]);
F.sort((a,b)=>b[1]-a[1]);
const top=F[0];
const COLORS=['var(--acc)','var(--acc2)','#9b8cff','#e0a35c','#7ce0a3','#e07c9b','#9bb8e0'];
$('#fields').innerHTML=F.map(([n,s],i)=>
 '<div class="field"><div class="row"><span>'+esc(n)+'</span><b style="color:'+COLORS[i%COLORS.length]+'">'+s+'٪</b></div>'+
 '<div class="bar"><i style="width:'+s+'%;background:'+COLORS[i%COLORS.length]+'"></i></div></div>').join('');
$('#note').textContent=top[1]>10?'أقوى ميادينك: «'+top[0]+'» — حافظ عليها وقوِّ بقيتها':'ابدأ بأي أداة — ستظهر قوتك هنا بصدق.';
$('#evid').innerHTML=F.slice(0,3).map(([n,s,ev])=>'<div style="margin-top:8px"><b style="color:var(--acc)">'+esc(n)+'</b> — '+ev.map(e=>esc(e)).join(' · ')+'</div>').join('');
</script>
<script src="../shared/feedback.js" data-pid="miqtadir" data-title="مِقتدِر"></script>
</body>
</html>
