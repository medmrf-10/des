<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقدَح — الشرارة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.spark{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:18px;margin-top:12px}
.spark .kind{font-size:10.5px;color:var(--acc);letter-spacing:.08em;margin-bottom:7px}
.spark .tx{font-family:var(--font-ar);font-size:15px;line-height:2}
.spark .src{font-size:11px;color:var(--dim);margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.fav{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-top:8px;font-family:var(--font-ar);font-size:12px;line-height:1.8}
.fav .k{font-size:9.5px;color:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقدَح <span class="muted">— الشرارة</span></h2>
<div class="muted">شرارتك اليومية: آية + حديث + طرفة برمجية — واحدة كل يوم، اجمع المفضلة.</div>
<div id="today"></div>
<div id="stats"></div>
<div class="card"><div class="t">شرارات محفوظة</div><div id="favs"></div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const seed=+new Date().toISOString().slice(0,10).replace(/-/g,'');
const rnd=s=>{let h=seed;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const PROG=['ساعة تفكير توفر أسبوع تطوير','الكود الذي لا تفهمه سيدغدغك ليلاً','سمّ متغيرك كأنك ستقرؤه بعد سنة','البساطة أصعب من التعقيد','اختبر حدودك أولاً — الصفر والواحد والمليون','كل خطأ عندك خطأ عند غيرك — اقرأ docs','قسّم المشكلة حتى تصغر ثم ابدأ بالأصغر','النسخ الاحتياطي لا يُشكر إلا عند فقده','أفضل كود هو الذي لم تكتبه','debug بصوت عالٍ — ستجدها بنفسك'];
let favs=LS('miqdah_favs',[]);
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../wahy/mutashabih.js','MUTA'),laz('../hadith/analysis.js','GIDNET')]).then(([M,G])=>{
 const verses=Object.entries(M?M.sim:{});
 const vi=rnd('v')%verses.length;const[vk,v]=verses[vi];
 const gids=Object.keys(G?G.g:{});const gid=gids[rnd('h')%gids.length];
 const h=G?G.g[gid]:{t:'…',h:'',s:''};
 const p=PROG[rnd('p')%PROG.length];
 const vs=verses[vi][2].slice(0,200);
 $('#today').innerHTML=
 '<div class="spark"><div class="kind">﴿ آية اليوم ﴾</div><div class="tx">'+esc(vs)+'</div><div class="src">'+esc(M.names[vk.split(':')[0]]||'')+' — '+esc(vk)+'</div><button class="btn" data-f="'+esc(vs)+'|آية" style="margin-top:10px;padding:6px 16px;font-size:11px">★ احفظ</button></div>'+
 '<div class="spark"><div class="kind">📜 حديث اليوم</div><div class="tx">'+esc(h.t.slice(0,240))+'</div><div class="src">'+esc(h.h||'')+' — صحابة '+arN(h.s||0)+'</div><button class="btn" data-f="'+esc(h.t.slice(0,180))+'|حديث" style="margin-top:10px;padding:6px 16px;font-size:11px">★ احفظ</button></div>'+
 '<div class="spark"><div class="kind">💻 طرفة برمجية</div><div class="tx" style="font-family:var(--font-ui);direction:ltr">'+esc(p)+'</div><button class="btn" data-f="'+esc(p)+'|طرفة" style="margin-top:10px;padding:6px 16px;font-size:11px">★ احفظ</button></div>';
 renderStats();
});
function renderStats(){$('#stats').innerHTML='<span class="stat">شرارات محفوظة: <b>'+arN(favs.length)+'</b></span>'}
function renderFavs(){
 $('#favs').innerHTML=favs.slice(-8).reverse().map(f=>'<div class="fav"><span class="k">'+esc(f.k)+'</span> '+esc(f.t)+'</div>').join('')||'<div class="muted">لا محفوظات — اضغط ★ لتجمع.</div>';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-f]');if(!b)return;
 const[t,k]=b.dataset.f.split('|');
 if(!favs.some(f=>f.t===t)){favs.push({t,k});SV('miqdah_favs',favs);renderFavs();renderStats()}
});
renderFavs();renderStats();
</script>
<script src="../shared/feedback.js" data-pid="miqdah" data-title="مِقدَح"></script>
</body>
</html>
