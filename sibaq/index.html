<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>سباق — مدرب الطباعة العربية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:760px;margin:0 auto;padding:16px 14px}
#txt{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;font-family:var(--font-ar);font-size:22px;line-height:2.2;margin:14px 0;min-height:110px}
#txt .w{padding:1px 3px;border-radius:4px}
#txt .w.cur{background:var(--acc);color:#14140f}
#txt .w.ok{color:#6fbf87}
#txt .w.bad{background:rgba(220,60,60,.3);color:#e07070}
.inp{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:11px;padding:13px 16px;font-family:var(--font-ar);font-size:19px}
.stats{display:flex;gap:10px;margin:10px 0}
.st{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.st b{display:block;font-size:21px;color:var(--acc2)}
.st span{font-size:11px;color:var(--dim)}
.muted{color:var(--dim);font-size:12px}
.src{display:flex;gap:7px;flex-wrap:wrap}
.sr{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:99px;padding:5px 14px;font-size:12.5px;cursor:pointer}
.sr.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">سباق <span class="muted" style="font-weight:400;font-size:12px">— مدرب الطباعة العربية</span></h2>
<div class="muted">اكتب النص المعروض — يقيس كلماتك في الدقيقة ودقتك ويسرّد أفضل أرقامك محفوظة على جهازك.</div>
<div class="src" style="margin-top:10px">
 <button class="sr on" data-s="adhkar">أذكار</button>
 <button class="sr" data-s="nawawi">الأربعون</button>
 <button class="sr" data-s="atoms">القواعد</button>
</div>
<div class="stats">
 <div class="st"><b id="wpm">0</b><span>ك/د</span></div>
 <div class="st"><b id="acc">100%</b><span>الدقة</span></div>
 <div class="st"><b id="tm">0:00</b><span>الوقت</span></div>
 <div class="st"><b id="best">0</b><span>أفضل ك/د</span></div>
</div>
<div id="txt"></div>
<input class="inp" id="in" placeholder="ابدأ الكتابة هنا…" autocomplete="off">
<div class="muted" style="margin-top:8px"><a href="#" id="nx" style="color:var(--acc2)">نص آخر ↺</a></div>
<script src="../hadith/adhkar.js"></script>
<script src="../hadith/nawawi.js"></script>
<script src="../madrasati/atoms.js"></script>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let words=[],typed=[],startT=0,fin=false,timer=null;
function pick(){
 const s=document.querySelector('.sr.on').dataset.s;let t='';
 if(s==='adhkar'){const g=ADHKAR[Math.floor(Math.random()*ADHKAR.length)];t=(g.t||'')+' '+(g.h||'')}
 else if(s==='nawawi')t=NAWAWI[Math.floor(Math.random()*NAWAWI.length)].an||'';
 else{const cs=Object.keys(ATOMS),c=cs[Math.floor(Math.random()*cs.length)];
  const ks=Object.keys(ATOMS[c].atoms),a=ATOMS[c].atoms[ks[Math.floor(Math.random()*ks.length)]];t=(a.t?a.t+' — ':'')+(a.q||'')}
 words=t.split(/\s+/).filter(w=>w.length>1).slice(0,40);
 typed=new Array(words.length).fill('');
 $('#txt').innerHTML=words.map((w,i)=>`<span class="w" id="w${i}">${esc(w)}</span>`).join(' ');
 $('#in').value='';fin=false;startT=0;clearInterval(timer)}
function upd(){
 const v=$('in').value;
 const parts=v.split(' ');
 let done=0,err=0;
 for(let i=0;i<words.length;i++){
  const el=$('w'+i);if(!el)continue;
  const t=i<parts.length-1?parts[i]:(i===parts.length-1?v.split(' ').pop():'');
  el.className='w'+(i===parts.length-1?' cur':'')+(i<parts.length-1?(t===words[i]?' ok':' bad'):'');
  if(i<parts.length-1){done++;if(t!==words[i])err++}}
 if(!startT&&v)startT=Date.now();
 if(startT){
  const el=(Date.now()-startT)/60000;
  const wpm=Math.round(done/el||0);
  $('#wpm').textContent=wpm.toLocaleString('ar-EG');
  $('#acc').textContent=Math.round(done/(done+err||1)*100)+'%';
  $('#tm').textContent=Math.floor((Date.now()-startT)/60000)+':'+String(Math.floor((Date.now()-startT)/1000)%60).padStart(2,'0')}
 if(done>=words.length&&!fin){fin=true;clearInterval(timer);
  const el=(Date.now()-startT)/60000,wpm=Math.round(done/el||0);
  const best=Math.max(wpm,+(localStorage.getItem('sibaq_best')||0));
  localStorage.setItem('sibaq_best',best);$('#best').textContent=best.toLocaleString('ar-EG');
  $('#in').value='انتهى! '+wpm.toLocaleString('ar-EG')+' ك/د — نص آخر؟'}}
$('#in').addEventListener('input',upd);
$('#best').textContent=(+localStorage.getItem('sibaq_best')||0).toLocaleString('ar-EG');
timer=setInterval(()=>{if(startT&&!fin){const el=(Date.now()-startT)/1000;$('#tm').textContent=Math.floor(el/60)+':'+String(Math.floor(el)%60).padStart(2,'0')}},500);
document.querySelector('.src').onclick=e=>{const b=e.target.closest('.sr');if(!b)return;
 document.querySelectorAll('.sr').forEach(x=>x.classList.toggle('on',x===b));pick()};
$('#nx').onclick=e=>{e.preventDefault();pick()};
pick();
</script>
<script src="../shared/feedback.js" data-pid="sibaq" data-title="سباق"></script>
</body>
</html>
