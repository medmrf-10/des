<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسبَر — تشريح عادة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px;width:100%}
textarea{min-height:44px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.au{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-top:8px}
.au .n{font-family:var(--font-ar);font-size:13.5px;color:var(--acc)}
.au .row{font-size:12px;margin-top:6px}
.au .row b{color:var(--acc2);font-size:10.5px}
.au .verd{font-size:11px;margin-top:8px;padding:4px 10px;border-radius:7px;display:inline-block}
.au .verd.keep{background:var(--ok);color:#14140f}
.au .verd.kill{background:var(--acc2);color:#14140f}
.au .verd.fix{background:var(--acc);color:#14140f}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسبَر <span class="muted">— تشريح عادة</span></h2>
<div class="muted">خذ عادة واحدة وشريّحها: متى تشتعل؟ ما الحاجة التي تملؤها؟ ماذا تكلفك؟ ثم الحكم: أبقِ، عالِج، أم اقصِف.</div>
<div class="card"><div class="t">شرّح عادة</div>
<input id="nm" placeholder="العادة (أتصفح الهاتف قبل النوم)">
<textarea id="tg" placeholder="متى تشتعل؟ (المحفّز: ملل، قلق، وقت معين…)"></textarea>
<textarea id="nd" placeholder="ما الحاجة التي تملؤها؟ (راحة، هروب، شعور…)"></textarea>
<textarea id="cs" placeholder="ماذا تكلفك؟ (وقت، نوم، مال…)"></textarea>
<button class="btn" id="ad" style="margin-top:9px">شرّحها</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let A=LS('misbar2',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 A.unshift({n,tg:$('#tg').value.trim(),nd:$('#nd').value.trim(),cs:$('#cs').value.trim(),v:null,at:Date.now()});
 SV('misbar2',A);$('#nm').value=$('#tg').value=$('#nd').value=$('#cs').value='';render();
};
function render(){
 const k=A.filter(x=>x.v==='keep').length,x_=A.filter(x=>x.v==='kill').length,f=A.filter(x=>x.v==='fix').length,ud=A.filter(x=>!x.v).length;
 $('#stats').innerHTML='<span class="stat">مشرّحة: <b>'+arN(A.length)+'</b></span>'+
 '<span class="stat">أبقِ: <b style="color:var(--ok)">'+arN(k)+'</b></span>'+
 '<span class="stat">عالِج: <b style="color:var(--acc)">'+arN(f)+'</b></span>'+
 '<span class="stat">اقصِف: <b style="color:var(--acc2)">'+arN(x_)+'</b></span>'+
 (ud?'<span class="stat">بلا حكم: <b>'+arN(ud)+'</b></span>':'');
 $('#list').innerHTML=A.map((x,i)=>{
  const gi=A.indexOf(x);
  return '<div class="au"><div class="n">'+esc(x.n)+'</div>'+
  (x.tg?'<div class="row"><b>المحفّز:</b> '+esc(x.tg)+'</div>':'')+
  (x.nd?'<div class="row"><b>الحاجة:</b> '+esc(x.nd)+'</div>':'')+
  (x.cs?'<div class="row"><b>الكلفة:</b> '+esc(x.cs)+'</div>':'')+
  (x.v?'<span class="verd '+x.v+'">'+(x.v==='keep'?'أبقيتها':x.v==='fix'?'عالجتها':'قصفتها')+'</span>':
   '<div style="display:flex;gap:5px;margin-top:8px">'+
   '<button class="btn ghost" data-v="keep" data-i="'+gi+'" style="color:var(--ok);font-size:10px">أبقِ</button>'+
   '<button class="btn ghost" data-v="fix" data-i="'+gi+'" style="color:var(--acc);font-size:10px">عالِج</button>'+
   '<button class="btn ghost" data-v="kill" data-i="'+gi+'" style="color:var(--acc2);font-size:10px">اقصِف</button></div>')+
  '</div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا عادات مشرّحة — ابدأ بأكثرها إزعاجاً.</div>';
}
$('#list').onclick=e=>{
 const v=e.target.closest('[data-v]');if(!v)return;
 A[+v.dataset.i].v=v.dataset.v;SV('misbar2',A);render();
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="misbar2" data-title="مِسبَر"></script>
</body>
</html>
