<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مُعِدّ — إعداد الدرس</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:880px;margin:0 auto;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
select,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px}
button{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#14131f;font-weight:700;border-radius:10px;padding:9px 15px;cursor:pointer;font-family:inherit;font-size:13px}
button.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0}
.box h3{margin:0 0 8px;font-size:14px;color:var(--acc)}
.box .tx{font-size:15px;line-height:2}
.hit{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:9px;cursor:pointer}
.hit:hover{background:var(--card2)}
.hit .bd{flex:1;font-size:13px;line-height:1.8}
.hit .vr{flex:none;font-size:11px;border:1px solid;border-radius:7px;padding:2px 8px}
#draft{position:sticky;top:10px}
.muted{color:var(--dim);font-size:12px}
.remove{color:#e07;font-size:11px;cursor:pointer;flex:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1 style="font-size:19px;margin:4px 0;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">مُعِدّ</h1>
<div class="muted">اجمع عناصر درسك: آية وتفسيرها، أحاديث محكومة، نقاط العقيدة — ثم انسخ المسودة</div>

<div class="box"><h3>١ — الآية</h3>
<div class="row"><select id="surah"></select><select id="ayah" style="min-width:90px"></select><button onclick="loadVerse()">أضف</button></div>
<div id="vres"></div></div>

<div class="box"><h3>٢ — أحاديث (شبكة المعنى)</h3>
<div class="row"><input id="hq" placeholder="كلمة البحث في المعاني (مثال: نية، صبر، علم)" style="flex:1"><button onclick="sHad()">بحث</button></div>
<div id="hres" style="max-height:280px;overflow:auto"></div></div>

<div class="box"><h3>٣ — نقطة عقيدة</h3>
<div class="row"><input id="aq" placeholder="كلمة البحث في ذرات العقيدة (مثال: قدرة، إيمان)" style="flex:1"><button onclick="sAq()">بحث</button></div>
<div id="ares" style="max-height:220px;overflow:auto"></div></div>

<div class="box" id="draft"><h3>الأحاديث (٤) — انقر لاختيار الراوي/الموضع</h3><div id="dlist" style="max-height:300px;overflow:auto"></div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="copyDraft()">📋 نسخ المسودة</button><button class="ghost" onclick="clearDraft()">مسح</button><span class="muted" id="dcnt"></span></div></div>

<div class="box" id="compose"><h3>٤ — المسودة المجمّعة</h3><div id="comp" class="tx" style="white-space:pre-wrap"></div></div>

<script src="../hadith/analysis.js"></script>
<script src="../madrasati/atoms.js"></script>
<script>
const arN=n=>(+n).toLocaleString('ar-EG');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
const draft={verse:null,tafsir:[],hadiths:[],aqida:[]};
// أسماء السور
const SNAMES={};
fetch('../wahy/data/index.json').then(r=>r.json()).then(x=>{x.forEach(s=>SNAMES[s.n]=s.ar);fillSurah()});
function fillSurah(){const el=document.getElementById('surah');
 el.innerHTML=Object.keys(SNAMES).map(n=>`<option value="${n}">${arN(n)} — ${SNAMES[n]}</option>`).join('');
 fillAyah();el.onchange=fillAyah}
function fillAyah(){const s=+document.getElementById('surah').value;
 fetch(`../wahy/data/surah/${s}.json`).then(r=>r.json()).then(j=>{
  document.getElementById('ayah').innerHTML=j.verses.map((v,i)=>`<option value="${i+1}">${arN(i+1)}</option>`).join('')})}
const TAF={kathir:{f:'../wahy/data/tafsir/22-ibn-kathir.json.gz',n:'ابن كثير'},saadi:{f:'../wahy/data/tafsir/24-tafseer-al-saadi-arabic.json.gz',n:'السعدي'}};
const tcache={};
async function taf(k,va){
 if(!tcache[k]){const b=await (await fetch(TAF[k].f)).arrayBuffer();
  const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  tcache[k]=JSON.parse(t)}
 const d=tcache[k];const gid=d.vg[va];return gid&&d.groups[gid]?d.groups[gid].x:null}
async function loadVerse(){
 const s=+document.getElementById('surah').value,a=+document.getElementById('ayah').value,va=`${s}:${a}`;
 const j=await (await fetch(`../wahy/data/surah/${s}.json`)).json();
 const v=j.verses[a-1];
 draft.verse={va,text:v.a,sname:SNAMES[s]};
 document.getElementById('vres').innerHTML=`<div class="tx" style="background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px">${esc(v.a)} <span class="muted">— ${SNAMES[s]} ${arN(a)}</span></div><div id="tafs" class="muted">يحمل التفسير…</div>`;
 const outs=[];
 for(const k of ['kathir','saadi']){try{const x=await taf(k,va);
   if(x)outs.push({name:TAF[k].n,x:x.length>900?x.slice(0,900)+'…':x})}catch(e){}}
 draft.tafsir=outs;
 document.getElementById('tafs').innerHTML=outs.map(o=>`<div style="margin-top:8px"><b style="color:var(--acc2)">${o.name}:</b> <span class="muted" style="font-size:13px;line-height:1.9">${esc(o.x)}</span></div>`).join('')||'<span class="muted">لا تفسير لهذه الآية في المصدرين</span>';
 renderDraft()}
function sHad(){
 const ws=norm(document.getElementById('hq').value).split(' ').filter(w=>w.length>1);if(!ws.length)return;
 const hits=[];
 for(const gid in GIDNET.g){const it=GIDNET.g[gid];const t=norm(it.t);let sc=0;
  for(const w of ws)if(t.includes(w))sc++;
  if(sc>=Math.min(ws.length,2))hits.push({gid,t:it.t,h:it.h,s:it.s,sc})}
 hits.sort((a,b)=>b.sc-a.sc||b.s-a.s);
 document.getElementById('hres').innerHTML=hits.slice(0,25).map((x,i)=>`<div class="hit" onclick="addHad('${x.gid}')"><span class="bd">${esc(x.t)}<div class="muted">رواه ${arN(x.s)} من الصحابة · معنى #${x.gid}</div></span><span class="vr" style="color:${x.h&&x.h.includes('صح')?'var(--ok)':'var(--acc2)'};border-color:currentColor">${esc(x.h||'')}</span></div>`).join('')||'<div class="muted">لا نتائج</div>'}
function addHad(gid){if(draft.hadiths.find(x=>x.gid===gid))return;
 const it=GIDNET.g[gid];draft.hadiths.push({gid,t:it.t,h:it.h,s:it.s});renderDraft()}
function sAq(){
 const w=norm(document.getElementById('aq').value);if(w.length<2)return;
 const hits=[];
 for(const code in ATOMS){const bk=ATOMS[code];
  for(const k in bk.atoms){const a=bk.atoms[k];
   if(norm(a.t+a.q).includes(w))hits.push({code,k,t:a.t,q:a.q,bk:bk.name})}}
 document.getElementById('ares').innerHTML=hits.slice(0,20).map((x,i)=>`<div class="hit" onclick="addAq('${x.code}','${x.k}')"><span class="bd"><b>${esc(x.t)}</b> — ${esc(x.q)}<div class="muted">${esc(x.bk)}</div></span></div>`).join('')||'<div class="muted">لا نتائج</div>'}
function addAq(code,k){if(draft.aqida.find(x=>x.k===k&&x.code===code))return;
 const a=ATOMS[code].atoms[k];draft.aqida.push({code,k,t:a.t,q:a.q,bk:ATOMS[code].name});renderDraft()}
function renderDraft(){
 const parts=[];
 if(draft.verse)parts.push(`الآية: ${draft.verse.text} — ${draft.verse.sname} ${arN(draft.verse.va.split(':')[1])}`);
 if(draft.tafsir.length)parts.push(...draft.tafsir.map(o=>`تفسير ${o.name}: ${o.x}`));
 if(draft.hadiths.length)parts.push('الأحاديث:\n'+draft.hadiths.map((h,i)=>`${i+1}. ${h.t} (${h.h||''})`).join('\n'));
 if(draft.aqida.length)parts.push('من العقيدة:\n'+draft.aqida.map((a,i)=>`${i+1}. ${a.t}: ${a.q}`).join('\n'));
 document.getElementById('comp').textContent=parts.join('\n\n')||'— أضف عناصر لتتكوّن المسودة —';
 try{const dr=JSON.parse(localStorage.getItem('mu3edd_drafts')||'[]');
  if(draft.verse||draft.hadiths.length||draft.aqida.length){
   const t=(draft.verse?draft.verse.sname+' '+draft.verse.va:(draft.hadiths[0]||{t:''}).t||'مسودة');
   const exists=dr.findIndex(x=>x.title===t);
   const item={title:t,text:parts.join('\n\n'),at:Date.now()};
   if(exists>=0)dr[exists]=item;else dr.push(item);
   localStorage.setItem('mu3edd_drafts',JSON.stringify(dr.slice(-10)))}}catch(e){}
 document.getElementById('dcnt').textContent=(draft.hadiths.length+draft.aqida.length+(draft.verse?1:0))+' عنصراً';
 // قائمة العناصر المختارة مع حذف
 let dl='';
 if(draft.verse)dl+=`<div class="hit"><span class="bd">آية ${draft.verse.sname} ${draft.verse.va}</span><span class="remove" onclick="draft.verse=null;draft.tafsir=[];renderDraft()">✕</span></div>`;
 draft.hadiths.forEach((h,i)=>dl+=`<div class="hit"><span class="bd">${esc(h.t.slice(0,60))}…</span><span class="remove" onclick="draft.hadiths.splice(${i},1);renderDraft()">✕</span></div>`);
 draft.aqida.forEach((a,i)=>dl+=`<div class="hit"><span class="bd">${esc(a.t)}</span><span class="remove" onclick="draft.aqida.splice(${i},1);renderDraft()">✕</span></div>`);
 document.getElementById('dlist').innerHTML=dl||'<span class="muted">فارغة</span>'}
function copyDraft(){navigator.clipboard.writeText(document.getElementById('comp').textContent).then(()=>{const b=event.target;b.textContent='✓ نُسخت';setTimeout(()=>b.textContent='📋 نسخ المسودة',1500)})}
function clearDraft(){draft.verse=null;draft.tafsir=[];draft.hadiths=[];draft.aqida=[];document.getElementById('vres').innerHTML='';document.getElementById('hres').innerHTML='';document.getElementById('ares').innerHTML='';renderDraft()}
renderDraft();
</script>
<script src="../shared/feedback.js"></script>
</body>
</html>
