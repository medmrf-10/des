<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>سوانح — فوائد تتصفّحها بالسحب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px;overflow-x:hidden}
#deck{position:relative;height:380px;margin-top:14px}
.card{position:absolute;inset:0;background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;transition:transform .35s,opacity .35s;user-select:none;touch-action:pan-y}
.card .g{position:absolute;top:14px;right:18px;font-size:10px;color:var(--acc2);border:1px solid var(--border);border-radius:99px;padding:3px 12px}
.card .t{font-family:var(--font-ar);font-size:19px;line-height:2.1;text-align:center}
.card .s{position:absolute;bottom:14px;right:18px;font-size:10.5px;color:var(--dim)}
.card.l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.card.r{transform:translateX(120%) rotate(8deg);opacity:0}
.card.u{transform:translateY(-120%);opacity:0}
.hint{display:flex;justify-content:center;gap:22px;margin-top:12px;font-size:22px}
.hint span{cursor:pointer;opacity:.7}
.hint span:hover{opacity:1}
.muted{color:var(--dim);font-size:12px;text-align:center}
#favn{position:fixed;top:14px;left:14px;background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:5px 13px;font-size:11.5px;color:var(--acc2);cursor:pointer}
</style>
</head>
<body>
<div id="favn">♥ <span id="fn">0</span></div>
<h2 style="font-family:var(--font-ar);margin:6px 0;text-align:center">سوانح</h2>
<div class="muted">اسحب بطاقة: ↓ للتالي، ↑ لتحفظها في مفضلتك — فوائد من المتون التسعة والأذكار والأربعون.</div>
<div id="deck"></div>
<div class="hint"><span id="p">↓ تالي</span><span id="f">↑ احفظ ♥</span></div>
<div id="fav" style="margin-top:16px"></div>
<script src="../hadith/adhkar.js"></script>
<script src="../hadith/nawawi.js"></script>
<script src="../madrasati/atoms.js"></script>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DECK=[];
ADHKAR.forEach(a=>{if((a.h||'').length<130)DECK.push({g:'ذِكر',t:a.h||a.t,s:'حديث '+a.g})});
NAWAWI.forEach(n=>{if((n.an||'').length<160)DECK.push({g:'الأربعون',t:n.an||n.n,s:'حديث '+n.n})});
for(const c in ATOMS)for(const k in ATOMS[c].atoms){const a=ATOMS[c].atoms[k];
 if((a.q||'').length<140)DECK.push({g:'قاعدة',t:(a.t?a.t+' — ':'')+a.q,s:ATOMS[c].name})}
for(let i=DECK.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[DECK[i],DECK[j]]=[DECK[j],DECK[i]]}
let fav;try{fav=JSON.parse(localStorage.getItem('sawanih')||'[]')}catch(e){fav=[]}
let idx=0;
const saveFav=()=>localStorage.setItem('sawanih',JSON.stringify(fav));
function updFav(){$('#fn').textContent=fav.length.toLocaleString('ar-EG');
 $('#fav').innerHTML=fav.length?'<div class="muted">محفوظاتك:</div>'+fav.slice(-6).reverse().map(x=>`<div class="entry" style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin:6px 0;font-size:12.5px;font-family:var(--font-ar);line-height:1.8">${esc(x.t.slice(0,90))}${x.t.length>90?'…':''}<div style="font-size:9.5px;color:var(--dim)">${esc(x.s)}</div></div>`).join(''):''}
function show(){
 const deck=$('#deck');deck.innerHTML='';
 const c=DECK[idx%DECK.length];
 const el=document.createElement('div');el.className='card';
 el.innerHTML=`<span class="g">${esc(c.g)}</span><div class="t">${esc(c.t)}</div><span class="s">${esc(c.s)}</span>`;
 let sx=0,sy=0,dx=0,dy=0,drag=false;
 el.onpointerdown=e=>{drag=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)};
 el.onpointermove=e=>{if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;
  el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/20}deg)`};
 el.onpointerup=e=>{drag=false;
  if(Math.abs(dy)>70||Math.abs(dx)>80){fling(el,c,dy<-70?'u':dx>0?'r':'l')}
  else el.style.transform=''};
 deck.appendChild(el)}
function fling(el,c,d){el.classList.add(d);
 if(d==='u'&&!fav.some(x=>x.t===c.t)){fav.push(c);saveFav();updFav()}
 idx++;setTimeout(show,280)}
$('#p').onclick=()=>{const el=$('#deck').lastChild;if(el)fling(el,DECK[idx%DECK.length],'l')};
$('#f').onclick=()=>{const el=$('#deck').lastChild;if(el)fling(el,DECK[idx%DECK.length],'u')};
$('#favn').onclick=()=>$('#fav').scrollIntoView({behavior:'smooth'});
updFav();show();
</script>
<script src="../shared/feedback.js" data-pid="sawanih" data-title="سوانح"></script>
</body>
</html>
