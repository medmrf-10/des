<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعجَب — الإعجاب والاقتداء</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.ad{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.ad .x{font-family:var(--font-ar);font-size:13px;color:var(--acc)}
.ad .h{font-size:12px;margin-top:4px}
.ad .st{font-size:10px;color:var(--ok);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعجَب <span class="muted">— الإعجاب والاقتداء</span></h2>
<div class="muted">صفة أعجبتك في شخص — انقلها لنفسك: «هدوء فلان تحت الضغط» ← «أتمرّن على الصمت قبل الرد». الإعجاب بلا اقتداء نظرة تلفاز.</div>
<div class="card"><div class="t">صفة تقتدي بها</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="wh" placeholder="فيمن أعجبتك؟ (شخص/شخصية)" style="width:150px">
<input id="tr" placeholder="الصفة" style="flex:1;min-width:110px">
<input id="hw" placeholder="كيف تقتدي؟" style="flex:1;min-width:130px">
<button class="btn" id="ad">أضِف</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let A=LS('mi3jab',[]);
$('#ad').onclick=()=>{
 const w=$('#wh').value.trim(),t=$('#tr').value.trim(),h=$('#hw').value.trim();if(!t)return;
 A.unshift({w,t,h,cnt:0,at:Date.now()});
 SV('mi3jab',A);$('#wh').value=$('#tr').value=$('#hw').value='';render();
};
function render(){
 const tot=A.reduce((s,x)=>s+x.cnt,0);
 $('#stats').innerHTML='<span class="stat">صفات تقتديها: <b>'+arN(A.length)+'</b></span>'+
 '<span class="stat">اقتديت: <b style="color:var(--ok)">'+arN(tot)+'×</b></span>';
 $('#list').innerHTML=A.map((x,i)=>{
  const gi=A.indexOf(x);
  return '<div class="ad"><div class="x">'+esc(x.t)+(x.w?' <span style="color:var(--dim);font-size:11px">في '+esc(x.w)+'</span>':'')+'</div>'+
  (x.h?'<div class="h">اقتدائي: '+esc(x.h)+'</div>':'')+
  '<div class="st">اقتديت '+arN(x.cnt)+'×</div>'+
  '<div style="display:flex;gap:6px;margin-top:6px">'+
  '<button class="btn ghost" data-c="'+gi+'" style="color:var(--ok);font-size:10px">اقتديت اليوم</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا صفات — فيمن أُعجبت يوماً؟</div>';
}
$('#list').onclick=e=>{
 const c=e.target.closest('[data-c]'),d=e.target.closest('[data-d]');
 if(c){A[+c.dataset.c].cnt++;SV('mi3jab',A);render();return}
 if(d&&confirm('احذف؟')){A.splice(+d.dataset.d,1);SV('mi3jab',A);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3jab" data-title="مِعجَب"></script>
</body>
</html>
