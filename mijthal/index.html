<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجثَل — قلع العادة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
select,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:8px 12px;font-family:var(--font-ar);font-size:12px;width:100%}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.d{aspect-ratio:1;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10.5px;cursor:pointer}
.d.done{background:var(--acc);color:#14140f;font-weight:700}
.d.today{border:2px solid var(--acc)}
.hb{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-top:10px}
.hb .nm{font-family:var(--font-ar);font-size:14.5px}
.hb .meta{font-size:11px;color:var(--dim);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجثَل <span class="muted">— قلع العادة</span></h2>
<div class="muted">٣٠ يومًا انقطاعًا — اختر عادة تقلعها، علّم كل يوم نظفته.</div>
<div class="card"><div class="t">عادتك السيئة</div>
<select id="sel">
 <option>تصفّح الهاتف بلا هدف</option><option>السهر بلا داعٍ</option><option>تأجيل ما يجب</option>
 <option>الغيبة</option><option>الأكل الزائد</option><option>الغضب السريع</option>
 <option>إدمان المقاطع القصيرة</option><option>نسيان الذكر</option><option>أخرى…</option>
</select>
<div style="margin-top:8px;display:flex;gap:7px"><input id="custom" placeholder="أو اكتب عادتك" style="flex:1"><button class="btn" id="add">اقلعها</button></div></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let H=LS('mijthal',[]);
$('#add').onclick=()=>{
 const c=$('#custom').value.trim();
 const n=c||($('#sel').value==='أخرى…'?'':$('#sel').value);
 if(!n)return alert('اكتب عادتك');
 H.unshift({n,start:today(),days:{}});
 SV('mijthal',H);$('#custom').value='';render();
};
function render(){
 $('#list').innerHTML=H.map((h,i)=>{
  const st=Object.keys(h.days).filter(d=>h.days[d]==='clean').length;
  const days=[];
  for(let i=0;i<30;i++){const d=new Date(h.start);d.setDate(d.getDate()+i);days.push(d.toISOString().slice(0,10))}
  return '<div class="hb"><div class="nm">'+esc(h.n)+'</div><div class="meta">بدأت '+h.start+' — '+arN(st)+'/٣٠ يومًا نظيفًا'+(st>=30?' — ✓ قلعتَها':'')+'</div>'+
  '<div class="days">'+days.map((d,j)=>{
   const st2=h.days[d],td=d===today();
   return '<div class="d'+(st2==='clean'?' done':'')+(td?' today':'')+'" data-i="'+i+'" data-d="'+d+'" title="'+d+'">'+(j+1)+'</div>';
  }).join('')+'</div></div>';
 }).join('')||'<div class="muted" style="margin-top:10px">لا عادات — أضف واحدة أعلاه.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('.d');if(!d)return;
 const h=H[+d.dataset.i],day=d.dataset.d;
 h.days[day]=h.days[day]==='clean'?null:'clean';
 SV('mijthal',H);render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mijthal" data-title="مِجثَل"></script>
</body>
</html>
