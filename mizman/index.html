<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِزمَن — زمَن العلماء</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:720px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.tl{position:relative;margin-top:20px;padding-right:22px}
.tl:before{content:'';position:absolute;right:6px;top:0;bottom:0;width:2px;background:var(--border)}
.era{position:relative;margin-top:16px}
.era:before{content:'';position:absolute;right:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.era .et{font-family:var(--font-ar);font-weight:700;font-size:13px;color:var(--acc)}
.era .bks{margin-top:5px}
.bk{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 11px;margin:3px;font-size:11.5px}
.bk .au{color:var(--dim);font-size:10px}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11.5px}
.leg span{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِزمَن <span class="muted">— زمَن المؤلَّفات</span></h2>
<div class="muted">كتب مكتبتك موزّعة على العصور — من الصدر الأول إلى العصر الحديث.</div>
<div class="card"><div class="t">خطّ الزمن — كتب الفقه الـ٥٥</div>
<div class="tl" id="tl"></div></div>
<div class="card"><div class="t">ملاحظة</div>
<div class="muted">التوزيع تقديري — أسماء الكتب توحي بعصورها. لمزيد من الدقة ابحث في «مِعلم» عن مكتبتك الحقيقية.</div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// خريطة تقريبية: مؤلفون مشهورون وعصورهم (هجري)
const ERA={
 'الصدر الأول':['موطأ','المدونة','الرسالة','مصنف','الأم','المسند','الزيادات'],
 'العصر الأموي والعباسي المبكر':['المغني بن قدامة','الهداية','المبسوط','العين','البحر','المحلى','الاستذكار','المحيط','مجموع فتاوى'],
 'العصر العباسي الوسيط':['المهذب','الوسيط','النهاية','التمهيد','البدائع','الوجيز','التهذيب','الإحكام','العمدة','روضة الطالبين'],
 'العصر الأيوبي والمملوكي المبكر':['المحرر','المنهاج','الشرح الكبير','بداية المجتهد','زاد المسير','المنتهى','المقنع','الرعاية','التلخيص','المغني لابن قدامة','المستصفي','الآداب'],
 'العصر المملوكي المتأخر':['الإنصاف','الفروع','البديع','كشاف القناع','الإيضاح','المدونة الكبرى','المنتقى','عمدة القارئ','الإقناع'],
 'العصر العثماني والحديث المبكر':['الروض المربع','منار السبيل','الإقناع للحجاوي','دليل الطالب','الأشربة','مطالب أولي النهى'],
 'العصر الحديث':['زاد المستقنع','عمدة الفقه','الفقه الميسر','أخصر المختصرات','مختصر زاد','الرحبية','عمدة الدليل','الفقه المنهجي','المغني للتوضيح'],
};
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
laz('../fiqh_reader/masail.js','MASAIL').then(M=>{
 const books=M?Object.values(M):[];
 $('#tl').innerHTML=Object.entries(ERA).map(([era,keys])=>{
  const hits=books.filter(b=>keys.some(k=>b.n.includes(k)||(b.a&&b.a.includes(k))));
  return '<div class="era"><div class="et">'+esc(era)+' <span class="muted" style="font-size:11px">('+hits.length+' كتاب)</span></div>'+
  '<div class="bks">'+hits.map(b=>'<span class="bk">'+esc(b.n)+'<div class="au">'+esc(b.a||'')+'</div></span>').join('')+'</div></div>';
 }).join('');
});
</script>
<script src="../shared/feedback.js" data-pid="mizman" data-title="مِزمَن"></script>
</body>
</html>
