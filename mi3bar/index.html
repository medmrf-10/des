<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعبَر — جسور الصلة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.per{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.per .n{font-family:var(--font-ar);font-size:13.5px;display:flex;justify-content:space-between}
.per .last{font-size:11px;color:var(--dim);margin-top:4px}
.per.stale{border-color:var(--acc2)}
.per .mv{font-size:11.5px;color:var(--acc);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعبَر <span class="muted">— جسور الصلة</span></h2>
<div class="muted">من تحب أن تصله؟ سجّل آخر صلة — الجسد الرطب ينبت، والجسور الجافة تنكسر.</div>
<div class="card"><div class="t">شخص</div>
<input id="n" placeholder="اسمه (أمي، خالي، صديق قديم…)">
<input id="mv" placeholder="الخطوة المقترحة (اتصال، زيارة، هدية…)">
<button class="btn" id="ad" style="margin-top:9px">أضف الجسر</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('mi3bar',[]);
$('#ad').onclick=()=>{
 const n=$('#n').value.trim();if(!n)return;
 P.unshift({n,mv:$('#mv').value.trim(),at:Date.now(),last:Date.now(),times:1});
 SV('mi3bar',P);$('#n').value=$('#mv').value='';render();
};
const days=t=>Math.round((Date.now()-t)/864e5);
function render(){
 const stale=P.filter(x=>days(x.last)>30).length;
 $('#stats').innerHTML='<span class="stat">جسور: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">جافة (شهر+): <b style="color:var(--acc2)">'+arN(stale)+'</b></span>'+
 '<span class="stat">صِلات: <b>'+arN(P.reduce((s,x)=>s+x.times,0))+'</b></span>';
 const sorted=[...P].sort((a,b)=>days(b.last)-days(a.last));
 $('#list').innerHTML=sorted.map(x=>{
  const gi=P.indexOf(x),d=days(x.last);
  return '<div class="per'+(d>30?' stale':'')+'"><div class="n"><span>'+esc(x.n)+'</span>'+
  '<span style="font-size:10.5px;color:'+(d>30?'var(--acc2)':'var(--ok)')+'">'+(d===0?'اليوم':arN(d)+' يوم')+'</span></div>'+
  '<div class="last">آخر صلة: '+new Date(x.last).toLocaleDateString('ar-EG')+' · '+arN(x.times)+'×</div>'+
  (x.mv?'<div class="mv">💡 '+esc(x.mv)+'</div>':'')+
  '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
  '<button class="btn ghost" data-t="'+gi+'" style="color:var(--ok);font-size:10px">وصلت اليوم</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا جسور — أضف من تصله.</div>';
}
$('#list').onclick=e=>{
 const t=e.target.closest('[data-t]'),d=e.target.closest('[data-d]');
 if(t){const x=P[+t.dataset.t];x.last=Date.now();x.times++;SV('mi3bar',P);render();return}
 if(d&&confirm('احذف الجسر؟')){P.splice(+d.dataset.d,1);SV('mi3bar',P);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3bar" data-title="مِعبَر"></script>
</body>
</html>
