<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنشَط — مُنشِّطك السريع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px;text-align:center}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-top:12px;text-align:right}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.q{font-family:var(--font-ar);font-size:14.5px;margin-top:14px}
.opts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.opt{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 17px;cursor:pointer;font-family:var(--font-ar);font-size:12.5px;transition:all .15s}
.opt:hover{border-color:var(--acc)}
.opt.on{background:var(--acc);color:#14140f;font-weight:700}
.rec{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:15px 18px;margin-top:14px;text-align:right}
.rec .rn{font-family:var(--font-ar);font-size:16px;color:var(--acc)}
.rec .rw{font-size:11.5px;color:var(--dim);margin-top:4px}
.rec a{display:inline-block;background:var(--acc);color:#14140f;border-radius:8px;padding:7px 16px;margin-top:9px;font-weight:700;font-size:12px;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:9px;padding:8px 16px;font-family:var(--font-ar);font-size:12px;cursor:pointer}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنشَط <span class="muted">— ماذا تفعل الآن؟</span></h2>
<div class="muted">أخبرني بطاقتك ووقتك — أرشّح لك تدريبًا واحداً يُنجز الآن.</div>
<div class="q">كم دقيقة عندك؟</div>
<div class="opts" id="time">
<div class="opt" data-v="2">٢ د</div><div class="opt" data-v="5">٥ د</div><div class="opt" data-v="10">١٠ د</div><div class="opt" data-v="20">٢٠+</div></div>
<div class="q">كيف طاقتك؟</div>
<div class="opts" id="energy">
<div class="opt" data-v="low">منخفضة</div><div class="opt" data-v="mid">متوسطة</div><div class="opt" data-v="hi">عالية</div></div>
<div id="reco"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const RECO={
 '2-low':[['فجر','../fajr/','آية اليوم وافتتاحية سريعة'],['مِصباح','../misbah/','وردك بضغطة'],['مِقتطف','../miqtaf/','أرقام جاهزة']],
 '2-mid':[['مِطلع','../mitla3/','حديث اليوم'],['مِشبه','../mushbih/','مسألتان سريعتان'],['مِعبَر','../mi3bar/','أين أنت؟']],
 '2-hi':[['مِستملي','../mustamli/','حديث استملاء'],['مِسطرة','../mistr/','أعرب الآن'],['مِحفل','../mihfil/','مسألة عشوائية']],
 '5-low':[['مِجلس','../majlis/','اقرأ صفحة'],['مِشوار','../mishwar/','أذكار موجّهة'],['مِعتمد','../mi3tamad/','مصادر مصفّاة']],
 '5-mid':[['مِشرَب','../mishrab/','صوّت على مسائل'],['مِجلد','../mujallad/','رتّب مجلدك'],['مِعمل','../mi3mal/','حلّل نصّاً']],
 '5-hi':[['مُتشابه','../mutashabih/','آيتان متشابهتان'],['مِعسكر','../mi3skar/','مهمة يومك'],['مُلاَحِن','../mula7hin/','سجّل ولاَحِن']],
 '10-low':[['مِعسكر','../mi3skar/','مهمة اليوم'],['مِجلد','../mujallad/','نظّم مكتبتك'],['مِرتّل','../murattil/','آية تحفيظ']],
 '10-mid':[['مِحفل','../mihfil/','٥ مسائل'],['مِذكَر','../mizkar/','حفّظ قائمة'],['مِرمى','../mirmah/','هدفك']],
 '10-hi':[['مُلاَحِن','../mula7hin/','أنتج درسك'],['مِعتكف','../mi3tikaf/','١٥ د عكوف'],['مِشغل','../mishghal/','درس سلسلة']],
 '20-low':[['مِشغل','../mishghal/','مقطع درس'],['مِجلد','../mujallad/','مراجعة مجلدات'],['مِحراث','../mihrath/','استكمال مؤجّل']],
 '20-mid':[['مِعتكف','../mi3tikaf/','٢٥ د عكوف'],['مِشغل','../mishghal/','درسان'],['مِجلس','../majlis/','ورد القراءة']],
 '20-hi':[['مِعتكف','../mi3tikaf/','٤٥ د عكوف'],['مُلاَحِن','../mula7hin/','درس كامل'],['مِشغل','../mishghal/','٣ دروس']],
};
let t=null,e=null;
$('#time').onclick=x=>{const o=x.target.closest('.opt');if(!o)return;
 document.querySelectorAll('#time .opt').forEach(y=>y.classList.remove('on'));o.classList.add('on');t=o.dataset.v;go()};
$('#energy').onclick=x=>{const o=x.target.closest('.opt');if(!o)return;
 document.querySelectorAll('#energy .opt').forEach(y=>y.classList.remove('on'));o.classList.add('on');e=o.dataset.v;go()};
let cur=null;
function go(){
 if(!t||!e)return;
 const list=RECO[t+'-'+e];
 const r=list[Math.floor(Math.random()*list.length)];
 cur=r;
 $('#reco').innerHTML='<div class="rec"><div class="rn">'+r[0]+'</div><div class="rw">'+r[2]+' — يناسب '+t+' د وطاقة '+({low:'منخفضة',mid:'متوسطة',hi:'عالية'}[e])+'</div>'+
 '<a href="'+r[1]+'">ابدأ ←</a> <button class="btn ghost" onclick="go()" style="margin-top:9px;margin-right:6px">غير هذا</button></div>';
}
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="minshat" data-title="مِنشَط"></script>
</body>
</html>
