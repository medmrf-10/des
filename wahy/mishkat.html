<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مشكاة — الآية في كل التفاسير</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:980px;margin:0 auto;padding:14px}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick select,.pick input{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 12px;font-family:var(--font-ar);font-size:14px}
.ayah{background:var(--card);border:1px solid var(--acc);border-radius:13px;padding:13px 16px;margin:12px 0;font-family:var(--font-ar);font-size:20px;line-height:2.2;text-align:center}
.tf{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin:7px 0}
.tf .h{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.tf .h b{font-family:var(--font-ar);font-size:14px;color:var(--acc2)}
.tf .h span{font-size:10.5px;color:var(--dim)}
.tf .x{font-family:var(--font-ar);font-size:14.5px;line-height:2;color:var(--txt);margin-top:6px;display:none}
.tf.open .x{display:block}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.f{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:99px;padding:4px 12px;font-size:11.5px;cursor:pointer}
.f.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.muted{color:var(--dim);font-size:12px}
.prog{height:3px;background:var(--card2);border-radius:9px;margin:10px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مشكاة <span class="muted" style="font-weight:400;font-size:12px">— الآية الواحدة في 105 تفسير</span></h2>
<div class="muted">اختر سورة وآية — تُجلب تفاسيرها من كل المصادر دفعة واحدة، اضغط أي تفسير يتمدد نصه.</div>
<div class="pick" style="margin-top:10px">
 <select id="surah"></select>
 <input id="ayah" type="number" min="1" value="1" style="width:70px">
 <button class="btn" id="go" style="background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;font-family:var(--font-ar)">اعرض الكل</button>
 <label class="muted"><input type="checkbox" id="openall"> افتح الكل</label>
</div>
<div class="prog"><i id="pg" style="width:0"></i></div>
<div class="ayah" id="av" style="display:none"></div>
<div class="flt" id="flt"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TAFS=[],SUR=[],cur=1;
async function jget(u,gz){const r=await fetch(u);if(!r.ok)throw 0;const b=await r.arrayBuffer();
 if(gz)return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
 return JSON.parse(new TextDecoder().decode(b))}
(async()=>{
 TAFS=await jget('data/tafsirs.json');
 SUR=await jget('data/index.json');
 $('surah').innerHTML=SUR.map(s=>`<option value="${s.n}">${s.n} · ${s.ar}</option>`).join('');
 const q=new URLSearchParams(location.search);
 if(q.get('s'))$('surah').value=q.get('s');
 if(q.get('a'))$('ayah').value=q.get('a');
})();
async function load(){
 const s=+$('surah').value,a=+$('ayah').value;if(!s||!a)return;
 $('list').innerHTML='';$('pg').style.width='3%';$('av').style.display='none';
 let done=0,shown=0;
 const res=await Promise.allSettled(TAFS.map(async t=>{
  try{const j=await jget(`data/tafsir/${t.s}.json.gz`,1);
   const key=j.vg[`${s}:${a}`];if(!key)return null;
   const g=j.groups[key];if(!g||!(g.f<=a&&a<=g.t))return null;
   return {n:t.n||t.s,x:g.x||''}}catch(e){return null}}));
 const items=res.map(r=>r.value).filter(Boolean);
 $('pg').style.width='40%';
 try{const sj=await jget(`data/surah/${s}.json`,0);
  const v=(sj.verses||[]).find(v=>v.k===a)||{};
  $('av').style.display='';$('av').textContent=(v.t||'')+' ۝ '+a}catch(e){}
 const cats={};items.forEach(i=>{const c=(i.n||'').split(' ')[0];cats[c]=cats[c]||[]});
 $('flt').innerHTML=`<button class="f on">الكل (${items.length})</button>`;
 $('list').innerHTML=items.map((t,i)=>`<div class="tf" id="t${i}">
  <div class="h" data-i="${i}"><b>${esc(t.n)}</b><span>تفسير #${i+1}</span></div>
  <div class="x">${esc(t.x).split(/\n+/).map(p=>`<p style="margin:4px 0">${p}</p>`).join('')}</div></div>`).join('');
 $('pg').style.width='100%';
 if($('openall').checked)document.querySelectorAll('.tf').forEach(x=>x.classList.add('open'))}
$('list').onclick=e=>{const h=e.target.closest('.h');if(h)$('t'+h.dataset.i).classList.toggle('open')};
$('go').onclick=load;
$('openall').onchange=e=>{if(e.target.checked)document.querySelectorAll('.tf').forEach(x=>x.classList.add('open'));else document.querySelectorAll('.tf').forEach(x=>x.classList.remove('open'))};
const q=new URLSearchParams(location.search);
if(q.get('s')&&q.get('a')){setTimeout(load,400)}
</script>
<script src="../shared/feedback.js" data-pid="mishkat" data-title="مشكاة"></script>
</body>
</html>
