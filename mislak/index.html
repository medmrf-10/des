<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسلَك — يوميات القرار</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.dec{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-top:9px}
.dec .nm{font-family:var(--font-ar);font-size:14px}
.dec .rs{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.8}
.dec .meta{font-size:10.5px;color:var(--dim);margin-top:8px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.dec .out{margin-top:9px;background:var(--card2);border-radius:8px;padding:9px 12px;font-size:12px}
.rev{background:var(--card);border:2px solid var(--acc);border-radius:13px;padding:14px 17px;margin-top:9px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسلَك <span class="muted">— يوميات القرار</span></h2>
<div class="muted">سجّل قرارك + سببك الآن — وبعد ٣٠ يوماً قيّم: هل كنت على صواب؟</div>
<div class="card"><div class="t">قرار اليوم</div>
<input id="nm" placeholder="القرار: اخترت…">
<textarea id="rs" placeholder="لماذا؟ ماذا توقعت؟ ما البديل الذي رفضته؟"></textarea>
<select id="cf" style="margin-top:7px"><option value="5">ثقة ٥٠٪</option><option value="7" selected>ثقة ٧٠٪</option><option value="9">ثقة ٩٠٪</option></select>
<button class="btn" id="add" style="margin-top:9px">سجّل القرار</button></div>
<div id="due"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let D=LS('mislak',[]);
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 const rev=new Date(Date.now()+30*86400000).toISOString().slice(0,10);
 D.unshift({n,rs:$('#rs').value.trim(),cf:+$('#cf').value,at:new Date().toISOString().slice(0,10),rev,out:null});
 SV('mislak',D);$('#nm').value='';$('#rs').value='';render();
};
const today=()=>new Date().toISOString().slice(0,10);
function render(){
 const due=D.filter(d=>!d.out&&d.rev<=today());
 $('#due').innerHTML=due.map((d,i)=>'<div class="rev"><div class="nm" style="font-family:var(--font-ar);font-size:14px">'+esc(d.n)+'</div>'+
 '<div class="muted" style="margin-top:6px">قررته يوم '+d.at+' بثقة '+arN(d.cf*10)+'٪ — حان التقييم:</div>'+
 '<div class="rs" style="margin-top:6px">'+esc(d.rs||'—')+'</div>'+
 '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">'+
 '<button class="btn ghost" data-r="'+D.indexOf(d)+'" data-v="صواب">كان صواباً ✓</button>'+
 '<button class="btn ghost" data-r="'+D.indexOf(d)+'" data-v="خطأ">كان خطأً ✗</button>'+
 '<button class="btn ghost" data-r="'+D.indexOf(d)+'" data-v="مختلط">مختلط</button></div></div>').join('');
 const judged=D.filter(d=>d.out);
 const right=judged.filter(d=>d.out==='صواب').length;
 $('#stats').innerHTML='<span class="stat">قرارات مسجلة: <b>'+arN(D.length)+'</b></span>'+
 '<span class="stat">قُيّمت: <b>'+arN(judged.length)+'</b></span>'+
 (judged.length?'<span class="stat">دقة القرار: <b>'+arN(Math.round(right/judged.length*100))+'%</b></span>':'');
 $('#list').innerHTML=D.filter(d=>d.out).map(d=>'<div class="dec"><div class="nm">'+esc(d.n)+'</div>'+
 '<div class="rs">'+esc(d.rs||'')+'</div>'+
 '<div class="meta"><span>'+d.at+'</span><span>ثقة '+arN(d.cf*10)+'٪</span><span class="'+(d.out==='صواب'?'':'')+'" style="color:'+(d.out==='صواب'?'var(--ok)':d.out==='خطأ'?'var(--acc2)':'var(--acc)')+'">'+d.out+'</span></div></div>').join('');
}
$('#due').onclick=e=>{
 const b=e.target.closest('[data-r]');if(!b)return;
 D[+b.dataset.r].out=b.dataset.v;SV('mislak',D);render();
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mislak" data-title="مِسلَك"></script>
</body>
</html>
