<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَق — عهودك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.cv{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-top:9px}
.cv .nm{font-family:var(--font-ar);font-size:14px}
.cv .meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.cv .kp{color:var(--acc);font-weight:700}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.kpct{font-size:10px;color:var(--dim)}
.bar{height:5px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.f{height:100%;background:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَق <span class="muted">— عهودك</span></h2>
<div class="muted">عهود قطعتها على نفسك — سجّلها، وعلّم كل مرة وفيت.</div>
<div class="card"><div class="t">عهد جديد</div>
<input id="nm" placeholder="صيام الاثنين، ورد يومي، إطعام أسبوعي…">
<select id="fr" style="margin-top:7px"><option value="daily">يومي</option><option value="weekly">أسبوعي</option><option value="monthly">شهري</option><option value="once">مرة واحدة</option></select>
<button class="btn" id="add" style="margin-top:9px">اعقد العهد</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let C=LS('mi3taq',[]);
const FR={daily:'يومي',weekly:'أسبوعي',monthly:'شهري',once:'مرة'};
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 C.unshift({n,fr:$('#fr').value,made:today(),kept:[]});
 SV('mi3taq',C);$('#nm').value='';render();
};
function dueToday(c){
 if(c.fr==='once')return c.kept.length===0;
 const last=c.kept[c.kept.length-1];
 if(!last)return true;
 const days=Math.floor((new Date(today())-new Date(last))/86400000);
 return days>=(c.fr==='daily'?1:c.fr==='weekly'?7:30);
}
function render(){
 $('#stats').innerHTML='<span class="stat">عهود نشطة: <b>'+arN(C.length)+'</b></span>'+
 '<span class="stat">مستحقة اليوم: <b>'+arN(C.filter(dueToday).length)+'</b></span>';
 $('#list').innerHTML=C.map((c,i)=>{
  const due=dueToday(c),k=c.kept.length;
  const pct=c.fr==='once'?(k?100:0):Math.min(100,k*10);
  return '<div class="cv"><div class="nm">'+esc(c.n)+(due?' <span class="kp">— مستحق</span>':'')+'</div>'+
  '<div class="meta"><span>'+FR[c.fr]+'</span><span>منذ '+c.made+'</span><span class="kpct">وفيت '+arN(k)+' مرة</span>'+
  (due?'<button class="btn ghost" data-i="'+i+'">وفيت اليوم</button>':'')+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2)">تحلّل</button></div>'+
  '<div class="bar"><div class="f" style="width:'+pct+'%"></div></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا عهود — اعقد أولها.</div>';
}
$('#list').onclick=e=>{
 const k=e.target.closest('[data-i]');if(k){C[+k.dataset.i].kept.push(today());SV('mi3taq',C);render();return}
 const d=e.target.closest('[data-d]');if(d&&confirm('تحلّل من هذا العهد؟')){C.splice(+d.dataset.d,1);SV('mi3taq',C);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3taq" data-title="مِعتَق"></script>
</body>
</html>
