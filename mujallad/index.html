<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجلد — مجلداتك الشخصية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:8px 12px;font-family:var(--font-ar);font-size:12px;width:100%}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.muted{color:var(--dim);font-size:12px}
.vol{border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-top:9px}
.vol .vt{font-family:var(--font-ar);font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.vol .vt .x{cursor:pointer;color:var(--dim);font-size:14px}
.vol .items{margin-top:7px}
.item{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:8px;padding:6px 11px;margin-top:5px;font-size:12px}
.item a{color:var(--acc);text-decoration:none}
.item .del{cursor:pointer;color:var(--dim)}
.item .del:hover{color:#e08080}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1}
.add select{width:110px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجلد <span class="muted">— مجلداتك الشخصية</span></h2>
<div class="muted">اصنع مجلدات موضوعية («فقه الطهارة»، «سلسلة أقرأها»، «أفكار دروسي») واحفظ فيها أي سلسلة من المكتبة أو رابطاً خارجياً.</div>
<div class="card"><div style="display:flex;gap:7px"><input id="vn" placeholder="اسم مجلد جديد…"><button class="btn" id="newV">أنشئ</button></div></div>
<div id="vols"></div>
<div class="muted" style="margin-top:12px">المجلدات على جهازك — تُعاد في «مِحراث» إن تركتها غير مكتملة.</div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let V=LS('mujallad',[]);
let SERIES=[];
(async()=>{try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src='../durus/data.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});SERIES=window.SERIES||[];render()}catch(e){render()}})();
$('#newV').onclick=()=>{
 const n=$('#vn').value.trim();if(!n)return;
 V.push({id:Date.now(),n,items:[]});$('#vn').value='';SV('mujallad',V);render();
};
function render(){
 $('#vols').innerHTML=V.length?V.map((v,vi)=>{
  const items=v.items.map((it,ii)=>
   '<div class="item"><a href="'+esc(it.u)+'" target="_blank">'+esc(it.n)+'</a><span class="del" data-v="'+vi+'" data-i="'+ii+'">✕</span></div>').join('');
  return '<div class="vol"><div class="vt">📁 '+esc(v.n)+' <span class="muted" style="font-size:11px">'+v.items.length+' عنصرًا</span><span class="x" data-v="'+vi+'">🗑</span></div>'+
  '<div class="items">'+items+'</div>'+
  '<div class="add"><select data-v="'+vi+'" class="pick"><option value="">— أضف سلسلة —</option>'+
   SERIES.map((s,si)=>'<option value="'+si+'">'+esc(s.name.slice(0,40))+'</option>').join('')+'</select>'+
   '<input placeholder="أو رابط خارجي (url)" data-v="'+vi+'" class="ext"><button class="btn ghost addext" data-v="'+vi+'">+</button></div></div>';
 }).join(''):'<div class="card muted" style="margin-top:12px">لا مجلدات بعد — أنشئ أول مجلد.</div>';
}
document.onclick=e=>{
 const x=e.target.closest('.x');
 if(x){V.splice(+x.dataset.v,1);SV('mujallad',V);render();return}
 const del=e.target.closest('.del');
 if(del){V[+del.dataset.v].items.splice(+del.dataset.i,1);SV('mujallad',V);render();return}
 const ae=e.target.closest('.addext');
 if(ae){
  const vi=+ae.dataset.v;
  const inp=document.querySelector('input.ext[data-v="'+vi+'"]');
  const u=inp.value.trim();if(!u)return;
  V[vi].items.push({n:u.length>40?u.slice(0,40)+'…':u,u:u.startsWith('http')?u:'https://'+u});
  inp.value='';SV('mujallad',V);render();return}
};
document.onchange=e=>{
 const s=e.target.closest('.pick');if(!s)return;
 const vi=+s.dataset.v,si=+s.value;
 if(s.value==='')return;
 const sr=SERIES[si];
 V[vi].items.push({n:sr.name,u:'../mishghal/#s='+si});
 SV('mujallad',V);render();
};
</script>
<script src="../shared/feedback.js" data-pid="mujallad" data-title="مِجلد"></script>
</body>
</html>
