<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِركَب — أثر المركّب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.res{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:16px;margin-top:11px;text-align:center;font-family:var(--font-ar)}
.res .big{font-size:20px;color:var(--acc);font-weight:700}
.res .sub{font-size:12px;color:var(--txt);margin-top:6px}
.bar-w{height:9px;background:var(--card2);border-radius:5px;margin-top:9px;overflow:hidden}
.bar-w>i{display:block;height:100%;background:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِركَب <span class="muted">— أثر المركّب</span></h2>
<div class="muted">العمل الصغير اليومي يتراكم ليصير جبلاً — احسب أثر عادتك الصغيرة على سنة، خمس، وعشر سنين.</div>
<div class="card"><div class="t">عادتك اليومية</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="(أقرأ ١٠ صفحات، أمشي ٢٠ دقيقة، أحفظ ٥ كلمات…)" style="flex:1;min-width:170px">
<input id="qt" type="number" placeholder="كميتها" style="width:80px">
<select id="un"><option value="صفحة">صفحة</option><option value="دقيقة">دقيقة</option><option value="كلمة">كلمة</option><option value="بيت شعر">بيت شعر</option><option value="تكرار">تكرار</option><option value="دولار">دولار</option></select>
<button class="btn" id="ad">احسب أثرها</button></div></div>
<div id="res"></div>
<div id="stats"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const UN={صفحة:{b:'كتاب',d:300},دقيقة:{b:'ساعة',d:60},كلمة:{b:'معجم',d:10000},'بيت شعر':{b:'ديوان',d:500},تكرار:{b:'ألف مرة',d:1000},دولار:{b:'ألف $',d:1000}};
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim(),q=+$('#qt').value,un=$('#un').value;if(!n||!q)return;
 const y1=q*365,y5=y1*5,y10=y1*10,u=UN[un];
 const bk=(v)=>Math.round(v/u.d);
 $('#res').innerHTML='<div class="res"><div class="sub">'+esc(n)+' يومياً =</div>'+
 '<div class="big">'+arN(y1)+' '+un+' / سنة</div>'+
 '<div class="sub">≈ '+arN(bk(y1))+' '+u.b+'</div>'+
 '<div class="bar-w"><i style="width:33%"></i></div>'+
 '<div class="sub" style="margin-top:8px">٥ سنين: <b style="color:var(--acc)">'+arN(y5)+' '+un+'</b> (≈'+arN(bk(y5))+' '+u.b+')</div>'+
 '<div class="sub">١٠ سنين: <b style="color:var(--ok)">'+arN(y10)+' '+un+'</b> (≈'+arN(bk(y10))+' '+u.b+')</div></div>';
};
</script>
<script src="../shared/feedback.js" data-pid="mirkab" data-title="مِركَب"></script>
</body>
</html>
