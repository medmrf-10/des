<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقتَد — يوم النبي ﷺ</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.slot{display:flex;gap:11px;margin-top:9px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;align-items:flex-start;cursor:pointer;transition:all .15s}
.slot.done{border-color:var(--acc);opacity:.7}
.slot .tm{font-size:10px;color:var(--acc2);min-width:62px;text-align:left;padding-top:2px}
.slot .bd{flex:1}
.slot .nm{font-family:var(--font-ar);font-size:13.5px}
.slot .ds{font-size:11px;color:var(--dim);margin-top:2px}
.slot .ck{width:22px;height:22px;border:1.5px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.slot.done .ck{background:var(--acc);color:#14140f;border-color:var(--acc)}
.bar{height:8px;background:var(--card2);border-radius:4px;margin-top:11px;overflow:hidden}
.fill{height:100%;background:var(--acc);transition:width .4s}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقتَد <span class="muted">— يوم النبي ﷺ</span></h2>
<div class="muted">يومك على نهجه: من الفجر إلى النوم — علّم كل ما اقتديته.</div>
<div id="sync"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
const DAY=[
 {t:'٠٤:٣٠',n:'الفجر',d:'صلاة الفجر في وقتها — بداية اليوم'},
 {t:'٠٤:٥٠',n:'الأذكار',d:'أذكار الصباح + قراءة الورد'},
 {t:'٠٥:٣٠',n:'العلم',d:'ساعة الطلب — درس/حفظ/مراجعة'},
 {t:'٠٧:٠٠',n:'الضحى',d:'صلاة الضحى — عند اشتداد الحر'},
 {t:'٠٨:٠٠',n:'العمل',d:'إنتاجك اليومي — ابدأ أصعب مهمة'},
 {t:'١٢:٠٠',n:'القيلولة',d:'قيلولة قصيرة — سنة صحية'},
 {t:'١٣:٠٠',n:'الظهر',d:'صلاة الظهر + استراحة'},
 {t:'١٤:٣٠',n:'الخدمة',d:'اعمل للآخرين — أسئلة/مساعدة'},
 {t:'١٦:٣٠',n:'العصر',d:'صلاة العصر — وسط اليوم'},
 {t:'١٧:٣٠',n:'العائلة',d:'وقت الأسرة — لا شاشة'},
 {t:'١٩:٠٠',n:'المغرب',d:'صلاة المغرب + أذكار المساء'},
 {t:'٢٠:٣٠',n:'العشاء',d:'صلاة العشاء — آخر الأركان'},
 {t:'٢١:٠٠',n:'التقويم',d:'راجع يومك بمِقصاد ومِجدار'},
 {t:'٢٢:٠٠',n:'الوتر والنوم',d:'الوتر + النوم — قفل اليوم'},
];
let D=LS('miqtad',{});
if(!D[today()])D[today()]={};
const done=D[today()];
function render(){
 const n=Object.values(done).filter(Boolean).length;
 $('#sync').innerHTML='<span class="stat">اقتديت اليوم: <b>'+arN(n)+'/'+arN(DAY.length)+'</b></span>'+
 '<span class="stat">سلسلة أيام: <b>'+arN(streak())+'</b></span>';
 $('#fill').style.width=Math.round(n/DAY.length*100)+'%';
 $('#list').innerHTML=DAY.map((s,i)=>'<div class="slot'+(done[i]?' done':'')+'" data-i="'+i+'">'+
 '<div class="tm">'+s.t+'</div><div class="bd"><div class="nm">'+s.n+'</div><div class="ds">'+s.d+'</div></div>'+
 '<div class="ck">'+(done[i]?'✓':'')+'</div></div>').join('');
 SV('miqtad',D);
}
function streak(){let s=0;const d=new Date();
 for(;;){const k=d.toISOString().slice(0,10);if(D[k]&&Object.values(D[k]).filter(Boolean).length>=8)s++;else if(k!==today())break;d.setDate(d.getDate()-1)}
 return s;
}
$('#list').onclick=e=>{
 const s=e.target.closest('.slot');if(!s)return;
 const i=+s.dataset.i;done[i]=!done[i];render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="miqtad" data-title="مِقتَد"></script>
</body>
</html>
