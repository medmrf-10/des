<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصعَد — جبل القرآن</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:4px 10px}
.mtn{position:relative;height:340px;margin-top:14px;background:linear-gradient(180deg,var(--bg),var(--card2));border:1px solid var(--border);border-radius:14px;overflow:hidden}
.flag{position:absolute;left:50%;transform:translateX(-50%);font-size:22px}
.lvl{position:absolute;left:0;right:0;border-top:1px dashed var(--border);padding:2px 8px;font-size:10px;color:var(--dim);cursor:pointer}
.lvl .n{float:right}
.lvl.on{background:var(--acc)33;border-top-color:var(--acc)}
.lvl.on .n{color:var(--acc);font-weight:700}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.next{margin-top:9px;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصعَد <span class="muted">— جبل القرآن</span></h2>
<div class="muted">٣٠ مستوى إلى القمة: علّم كل جزء قرأته هذه الختمة — وتُقرأ تلقائياً من مِصبحَك.</div>
<div id="stats"></div>
<div class="mtn" id="mtn"></div>
<div id="next"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const JUZS=['الفاتحة+البقرة','البقرة+آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال+التوبة','يونس+هود','يوسف+الرعد','إبراهيم+الحجر','النحل','الإسراء+الكهف','مريم+طه','الأنبياء+الحج','المؤمنون+النور','الفرقان+الشعراء','النمل+القصص','العنكبوت+الروم','لقمان+السجدة','الأحزاب+سبأ','فاطر+يس','الصافات+ص','الزمر+غافر','فصلت+الشورى','الزخرف+الدخان','الجاثية+الأحقاف','محمد+الفتح','الحجرات+الذاريات','الطور+النجم','القمر+الحديد','المجادلة+الحشر','الممتحنة+الصف','الجمعة+المنافقون','التغابن+الطلاق','التحريم+الملك','القلم+الحاقة','المعارج+نوح','الجن+المزمل','المدثر+القيامة','الإنسان+المرسلات','النبأ+النازعات','عبس+التكوير','الانفطار+المطففين','الانشقاق+البروج','الطارق+الأعلى','الغاشية+الفجر','البلد+الشمس','الليل+الضحى','الشرح+التين','العلق+القدر','البينة+الزلزلة','العاديات+القارعة','التكاثر+العصر','الهمزة+الفيل','قريش+الماعون','الكوثر+الكافرون','النصر+المسد','الإخلاص+الفلق','الناس'];
const JUZ_ARY=["الجزء ١","الجزء ٢","الجزء ٣","الجزء ٤","الجزء ٥","الجزء ٦","الجزء ٧","الجزء ٨","الجزء ٩","الجزء ١٠","الجزء ١١","الجزء ١٢","الجزء ١٣","الجزء ١٤","الجزء ١٥","الجزء ١٦","الجزء ١٧","الجزء ١٨","الجزء ١٩","الجزء ٢٠","الجزء ٢١","الجزء ٢٢","الجزء ٢٣","الجزء ٢٤","الجزء ٢٥","الجزء ٢٦","الجزء ٢٧","الجزء ٢٨","الجزء ٢٩","الجزء ٣٠"];
let S=LS('mis3ad',{done:{}});
const today=()=>new Date().toISOString().slice(0,10);
// اقرأ من majlis {surah:ayahsRead} — surah→juz boundaries
const JUZ_SURAH=[1,2,2,3,4,4,5,6,7,8,9,11,12,15,17,18,21,23,25,27,29,33,36,39,41,46,51,58,67,78];
(function(){
 const m=LS('majlis',{});
 Object.keys(m).forEach(s=>{
  const n=+s,ayahs=Object.keys(m[s]||{}).length;
  if(ayahs>50){
   let j=1;for(let i=29;i>=0;i--)if(n>=JUZ_SURAH[i]){j=i+1;break}
   if(!S.done[j])S.done[j]=today();
  }
 });
})();
function render(){
 const done=Object.keys(S.done).map(Number).sort((a,b)=>a-b);
 $('#stats').innerHTML='<span class="stat">المستوى: <b>'+arN(done.length)+'/٣٠</b></span>'+
 '<span class="stat">القمة: <b>'+(done.length>=30?'✓ خُتمت':'+')+'</b></span>'+
 '<button class="btn ghost" id="reset">ختمة جديدة</button>';
 $('#mtn').innerHTML='<div class="flag" style="top:6px">'+(done.length>=30?'🏁':'⛰️')+'</div>'+
 JUZ_ARY.map((j,i)=>{
  const lvl=30-i,on=done.includes(lvl);
  return '<div class="lvl'+(on?' on':'')+'" data-l="'+lvl+'" style="top:'+(32+i*10)+'px"><span class="n">'+j+'</span>'+(on?'✓':'')+'</div>';
 }).join('');
 const next=done.length<30?done.length+1:0;
 $('#next').innerHTML=next?'<div class="next">التالي: '+JUZ_ARY[next-1]+' — افتح <a href="../miqraa/" style="color:var(--acc)">مِقرأة</a></div>':'';
}
$('#mtn').onclick=e=>{
 const l=e.target.closest('.lvl');if(!l)return;
 const n=+l.dataset.l;
 if(S.done[n])delete S.done[n];else S.done[n]=today();
 SV('mis3ad',S);render();
};
document.getElementById('reset')?.addEventListener('click',()=>{if(confirm('ختمة جديدة — تصفير الجبل؟')){S.done={};SV('mis3ad',S);render()}});
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mis3ad" data-title="مِصعَد"></script>
</body>
</html>
