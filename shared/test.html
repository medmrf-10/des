<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار fsrs.js — SM-2 محسّن</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background:#101418; color:#e8e8e8; }
  h1 { font-size: 1.2rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .85rem; }
  th, td { border: 1px solid #333; padding: .4rem .6rem; text-align: center; }
  th { background: #1c2530; }
  .card { background:#161d26; border:1px solid #2a3542; border-radius:8px; padding:.8rem 1rem; margin:.8rem 0; }
  .fail { color:#ff8a80; } .pass { color:#b9f6ca; }
  #summary { margin-top:1rem; font-weight:600; }
</style>
</head>
<body>
<h1>اختبار الجدولة — 5 بطاقات × 6 مراجعات (SM-2 محسّن)</h1>
<p>كل بطاقة تُراجع 6 مرات بجودة مختلفة. يعرض الجدول: الفاصل الجديد (يوم) وعامل السهولة وتاريخ الاستحقاق التالي.</p>
<div id="out"></div>
<div id="summary"></div>

<script src="fsrs.js"></script>
<script>
// سيناريوهات جودة لكل بطاقة: بطاقة قوية، متوسطة، متذبذبة، ضعيفة، تتعافى
const scenarios = [
  { name: "بطاقة ١ — قوية ثابتة",   qualities: [5,5,5,5,5,5] },
  { name: "بطاقة ٢ — متوسطة",       qualities: [4,3,4,3,4,3] },
  { name: "بطاقة ٣ — تتعثر ثم تنجح",qualities: [4,4,2,4,4,4] },
  { name: "بطاقة ٤ — ضعيفة",        qualities: [3,2,3,2,3,2] },
  { name: "بطاقة ٥ — تنهار ثم تتعافى", qualities: [5,5,1,3,4,5] },
];

const DAY = 24*60*60*1000;
let out = "";

for (const sc of scenarios) {
  let card = FSRS.newCard();
  let now = new Date("2026-09-25T09:00:00Z");
  out += `<div class="card"><b>${sc.name}</b><table>
    <tr><th>مراجعة</th><th>الجودة</th><th>منقضي (يوم)</th><th>الفاصل الجديد</th><th>السهولة</th><th>الاستحقاق</th><th>الحالة</th></tr>`;
  let day = new Date(now);
  sc.qualities.forEach((q, i) => {
    const r = FSRS.schedule({ ...card, quality: q }, { now: day });
    const cls = q >= 3 ? "pass" : "fail";
    out += `<tr class="${cls}"><td>${i+1}</td><td>${q}</td><td>${r.elapsedDays}</td>
      <td>${r.newInterval} يوم</td><td>${r.newEase}</td><td>${r.nextReview}</td><td>${r.state}</td></tr>`;
    // تقدّم الزمن إلى تاريخ الاستحقاق التالي ثم راجع فيه
    card = { repetitions: r.repetitions, ease: r.newEase, interval: r.newInterval,
             lastReview: day.toISOString(), lapses: r.lapses };
    day = new Date(r.nextReview + "T09:00:00Z");
  });
  out += `</table></div>`;
}

// تحقق آلي سريع
const checks = [];
let c = FSRS.newCard();
checks.push(["بطاقة جديدة + جودة 4 → يوم واحد", FSRS.schedule({...c, quality:4}).newInterval === 1]);
checks.push(["تكرار 2 + جودة 4 → 6 أيام", FSRS.schedule({repetitions:1, ease:2.5, interval:1, quality:4}).newInterval === 6]);
checks.push(["جودة 2 → إعادة تعلم (يوم)", FSRS.schedule({repetitions:5, ease:2.5, interval:30, quality:2}).newInterval === 1]);
checks.push(["جودة 2 → السهولة تنخفض", FSRS.schedule({repetitions:5, ease:2.5, interval:30, quality:2}).newEase < 2.5]);
checks.push(["جودة 5 → السهولة ترتفع", FSRS.schedule({repetitions:5, ease:2.5, interval:30, quality:5}).newEase > 2.5]);
checks.push(["repetitions يُصفَّر عند النسيان", FSRS.schedule({repetitions:5, ease:2.5, interval:30, quality:1}).repetitions === 0]);

const passed = checks.filter(c => c[1]).length;
document.getElementById("out").innerHTML = out;
document.getElementById("summary").innerHTML =
  `التحقق الآلي: ${passed}/${checks.length} ✔` +
  (passed === checks.length ? " — كل الفحوصات ناجحة" :
   " — فشل: " + checks.filter(c=>!c[1]).map(c=>c[0]).join("؛ "));
</script>
</body>
</html>
