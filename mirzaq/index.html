<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرزَق — لحظات الرزق</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.rz{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.rz .x{font-family:var(--font-ar);font-size:13px}
.rz .k{font-size:10px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--acc);margin-right:6px}
.rz .meta{font-size:10px;color:var(--dim);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرزَق <span class="muted">— لحظات الرزق</span></h2>
<div class="muted">«ومن يتق الله يجعل له مخرجاً ويرزقه من حيث لا يحتسب». الرزق ليس مالاً فقط: فرصة جاءت، مساعدة لم تتوقعها، عائق انزاح. سجّل لحظاته لتشهد سخاء الطريق.</div>
<div class="card"><div class="t">لحظة رزق</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="ماذا جاءك من حيث لا تحتسب؟" style="flex:1;min-width:170px">
<select id="kd"><option value="فرصة">فرصة</option><option value="مساعدة">مساعدة</option><option value="عائق انزاح">عائق انزاح</option><option value="مال">مال/مورد</option><option value="علم">علم/فهم</option><option value="أخرى">أخرى</option></select>
<button class="btn" id="ad">سجّلها</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let R=LS('mirzaq',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 R.unshift({n,k:$('#kd').value,at:Date.now()});
 SV('mirzaq',R);$('#nm').value='';render();
};
function render(){
 const byK={};R.forEach(x=>byK[x.k]=(byK[x.k]||0)+1);
 const topK=Object.entries(byK).sort((a,b)=>b[1]-a[1])[0];
 const wk=R.filter(x=>(Date.now()-x.at)/864e5<7).length;
 $('#stats').innerHTML='<span class="stat">لحظات: <b>'+arN(R.length)+'</b></span>'+
 '<span class="stat">هذا الأسبوع: <b style="color:var(--ok)">'+arN(wk)+'</b></span>'+
 (topK?'<span class="stat">أكثر باب: <b>'+esc(topK[0])+'</b></span>':'');
 $('#list').innerHTML=R.slice(0,14).map((x)=>{
  const gi=R.indexOf(x);
  return '<div class="rz"><span class="k">'+esc(x.k)+'</span><span class="x">'+esc(x.n)+'</span>'+
  '<div class="meta">'+new Date(x.at).toLocaleDateString('ar-EG',{day:'numeric',month:'long'})+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:9px;padding:3px 7px;margin-right:8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا لحظات — راقب ما يأتيك.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){R.splice(+d.dataset.d,1);SV('mirzaq',R);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mirzaq" data-title="مِرزَق"></script>
</body>
</html>
