<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مِصحَف — قراءة هادئة</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>﴾ مِصحَف</h1><p class="tagline">قراءة نظيفة، يحفظ مكانك، ويتابع معك وِردك</p></header>
<div class="wrap">
 <div class="card pick">
  <select id="surah"></select>
  <span id="saved" class="saved"></span>
 </div>
 <div class="card read" id="read"><div class="empty">اختر سورة — أو عد لآخر مكان وقفت عنده</div></div>
 <div class="card hint">آخر ورد محفوظ تلقائياً · <a href="../wird/">وِرد اليوم</a> · <a href="../wahy/matn.html">بحث القرآن</a></div>
</div>
<script>
const $=function(q){return document.querySelector(q)};
let IDX=null;
fetch('../wahy/data/index.json').then(function(r){return r.json()}).then(function(idx){
 IDX=idx;
 $('#surah').innerHTML='<option value="">— السور —</option>'+idx.map(function(s){return '<option value="'+s.n+'">'+s.n+'. '+s.ar+' ('+s.ayahs+')</option>'}).join('');
 const last=localStorage.getItem('mushaf_last');
 if(last){const s=idx.find(function(x){return x.n==last});if(s){$('#saved').textContent='آخر ورد: '+s.ar;openSurah(+last)}}
 $('#surah').onchange=function(){if($('#surah').value)openSurah(+$('#surah').value)};
});
function openSurah(n){
 fetch('../wahy/data/surah/'+n+'.json').then(function(r){return r.json()}).then(function(s){
  localStorage.setItem('mushaf_last',n);
  const bism=(s.bismillah===false)?'':'<div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>';
  $('#read').innerHTML=bism+s.verses.map(function(v){return '<span class="v" id="v'+v.a+'">'+v.t+' <span class="num">'+v.a+'</span></span>'}).join(' ');
  document.title='مِصحَف — '+s.ar;
  $('#read').querySelectorAll('.v').forEach(function(v){v.onclick=function(){
   localStorage.setItem('mushaf_pos',s.n+':'+v.id.replace('v',''));
   $('#read').querySelectorAll('.v').forEach(function(x){x.classList.remove('cur')});
   v.classList.add('cur');
  }});
 });
}
</script>
<script src="../shared/palette.js"></script><script src="../shared/feedback.js"></script>
</body></html>
