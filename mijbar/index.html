<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجبَر — جابر القلوب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.feel{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:8px 16px;margin:4px;cursor:pointer;font-family:var(--font-ar);font-size:13px;transition:.2s}
.feel.on{border-color:var(--acc);color:var(--acc)}
.res{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:9px}
.res .src{font-size:10.5px;color:var(--acc);margin-bottom:6px}
.res .tx{font-family:var(--font-ar);font-size:14px;line-height:2}
.res .ad{font-size:11px;color:var(--dim);margin-top:7px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجبَر <span class="muted">— جابر القلوب</span></h2>
<div class="muted">ما تشعر به الآن؟ اختر شعورك — تصلك مواساة من الكتاب والسنة.</div>
<div class="card" id="feels"></div>
<div id="out"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const FEELS={
 'قلق':{kw:['قلق','ضيق','هم','كرب'],vs:['فَسَيَكْفِيكَهُمُ اللَّهُ','أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ','وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا']},
 'حزن':{kw:['حزن','كآب','أسى','غم'],vs:['وَلَا تَحْزَنْ عَلَيْهِمْ','إِنَّ اللَّهَ مَعَنَا','فَإِنَّ مَعَ الْعُسْرِ يُسْرًا']},
 'خوف':{kw:['خوف','فزع','رهب','وجل'],vs:['أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ','وَاللَّهُ أَحَقُّ أَن تَخْشَوْهُ','فَاللَّهُ خَيْرٌ حَافِظًا']},
 'ذنب':{kw:['ذنب','معاصي','توب','غفر'],vs:['لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ','يَغْفِرُ الذُّنُوبَ جَمِيعًا','وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ']},
 'فقد':{kw:['موت','فقد','فراق','رحيل'],vs:['إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ','وَبَشِّرِ الصَّابِرِينَ','وَالْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَى']},
 'ضعف':{kw:['ضعف','عجز','كسل','فتور'],vs:['وَاللَّهُ الْقَوِيُّ','رَبِّ اشْرَحْ لِي صَدْرِي','وَقُل رَّبِّ زِدْنِي عِلْمًا']},
 'وحدة':{kw:['وحد','غرب','انعزال'],vs:['إِنَّ اللَّهَ مَعَنَا','وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ','وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ']},
};
const LZ=['../hadith/adhkar.js','../wahy/mutashabih.js'];
const GL=['ADHKAR','MUTA'];
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
let AD=[],MU={};
Promise.all(LZ.map((s,i)=>laz(s,GL[i]))).then(r=>{AD=r[0]||[];MU=r[1]||{names:{},sim:{}}});
$('#feels').innerHTML=Object.keys(FEELS).map(f=>'<span class="feel" data-f="'+f+'">'+f+'</span>').join('');
$('#feels').onclick=e=>{
 const b=e.target.closest('.feel');if(!b)return;
 document.querySelectorAll('.feel').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 const f=b.dataset.f,def=FEELS[f],out=[];
 // آيات ثابتة مواسية
 def.vs.forEach(v=>{
  let src='القرآن';
  const nv=norm(v).slice(0,25);
  const sim=Object.entries(MU.sim||{}).find(([k,m])=>m[2]&&norm(m[2]).includes(nv));
  if(sim)src=MU.names[sim[0].split(':')[0]]||src;
  out.push({src,tx:v+' — ﴿'+v+'﴾',ad:'آية'});
 });
 // أذكار مطابقة
 const matches=AD.filter(a=>def.kw.some(k=>norm(a.t).includes(k))).slice(0,3);
 matches.forEach(a=>out.push({src:'الأذكار',tx:a.t.slice(0,300),ad:a.g||''}));
 // حديث مواسي (بحث في الأذكار ثانية)
 $('#out').innerHTML=out.slice(0,8).map(o=>'<div class="res"><div class="src">'+esc(o.src)+'</div><div class="tx">'+esc(o.tx)+'</div>'+(o.ad?'<div class="ad">'+esc(o.ad)+'</div>':'')+'</div>').join('')||'<div class="muted" style="margin-top:10px">جارٍ التحميل…</div>';
};
</script>
<script src="../shared/feedback.js" data-pid="mijbar" data-title="مِجبَر"></script>
</body>
</html>
