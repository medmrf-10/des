<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِهمَز — وخزة المستقبل</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.cp{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.cp.due{border-color:var(--acc)}
.cp .msg{font-family:var(--font-ar);font-size:13px}
.cp .meta{font-size:10.5px;color:var(--dim);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِهمَز <span class="muted">— وخزة المستقبل</span></h2>
<div class="muted">اكتب لنفسك رسالة تظهر في تاريخ تختاره — نصيحة، تحذيراً، أو سؤالاً لذاتك القادمة.</div>
<div class="card"><div class="t">رسالة للمستقبل</div>
<textarea id="m" placeholder="يا أنا المستقبل…"></textarea>
<input id="d" type="date">
<button class="btn" id="ad" style="margin-top:9px">ختمها وأرسلها</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let C=LS('mihmaz',[]);
const today=()=>new Date().toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const m=$('#m').value.trim(),d=$('#d').value;if(!m||!d)return;
 C.unshift({m,d,at:Date.now(),opened:false});SV('mihmaz',C);$('#m').value='';render();
};
function render(){
 const t=today();
 const due=C.filter(x=>x.d<=t&&!x.opened),pending=C.filter(x=>x.d>t);
 $('#stats').innerHTML='<span class="stat">وصلت: <b style="color:var(--acc)">'+arN(due.length)+'</b></span>'+
 '<span class="stat">في الطريق: <b>'+arN(pending.length)+'</b></span>';
 const all=C.map((x,i)=>({x,i})).sort((a,b)=>{const ad=a.x.d<=t&&!a.x.opened,bd=b.x.d<=t&&!b.x.opened;return (bd-ad)||(a.x.d<b.x.d?-1:1)}).slice(0,12);
 $('#list').innerHTML=all.map(({x,i:gi})=>{
  const isDue=x.d<=t&&!x.opened;
  const days=Math.ceil((new Date(x.d)-Date.now())/864e5);
  return '<div class="cp'+(isDue?' due':'')+'"><div class="msg">'+(isDue||x.opened?esc(x.m):'🔒 رسالة مختومة — تُفتح '+x.d)+'</div>'+
  '<div class="meta">'+(isDue?'وصلت الآن — كُتبت '+new Date(x.at).toLocaleDateString('ar-EG'):x.opened?'فُتحت':'بعد '+arN(days)+' يوم')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:7px">'+
  (isDue?'<button class="btn ghost" data-o="'+gi+'" style="color:var(--acc);font-size:10px">فتحتها</button>':'')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا رسائل — اكتب لنفسك الأولى.</div>';
}
$('#list').onclick=e=>{
 const o=e.target.closest('[data-o]'),d=e.target.closest('[data-d]');
 if(o){C[+o.dataset.o].opened=true;SV('mihmaz',C);render();return}
 if(d&&confirm('احذف؟')){C.splice(+d.dataset.d,1);SV('mihmaz',C);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mihmaz" data-title="مِهمَز"></script>
</body>
</html>
