<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مُجيب — اسأل فيجدك المقطع الدقيق</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{min-height:100dvh;padding:18px clamp(10px,3vw,30px) 60px}
.wrap{max-width:820px;margin:0 auto}
.muted{color:var(--dim);font-size:.82rem;line-height:1.9}
.ask{display:flex;gap:8px;margin:18px 0 6px}
.ask input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--txt);font-family:inherit;font-size:1rem;padding:14px 18px}
.ask input:focus{outline:none;border-color:var(--acc)}
.ask button{background:linear-gradient(135deg,#c9a24b,#8a6a2f);border:none;border-radius:12px;color:#0b0f1a;font-family:inherit;font-weight:700;font-size:.9rem;padding:0 22px;cursor:pointer}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sugs span{background:var(--card2);border:1px solid var(--border);border-radius:99px;color:var(--dim);font-size:.68rem;padding:4px 12px;cursor:pointer}
.sugs span:hover{color:var(--acc);border-color:var(--acc)}
.hit{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.hit:hover{border-color:var(--acc)}
.hit .ht{font-size:.72rem;color:var(--acc);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hit .ht .tm{color:var(--dim);font-size:.64rem}
.hit .hx{font-size:.92rem;line-height:2;margin-top:6px}
.hit .hx mark{background:rgba(201,162,75,.25);color:var(--acc);border-radius:3px;padding:0 2px}
.hit .hw{font-size:.64rem;color:var(--dim);margin-top:4px}
.playr{position:sticky;bottom:0;background:var(--card);border:1px solid var(--acc);border-radius:var(--r-md);padding:12px 16px;margin-top:14px;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.playr .pt{font-size:.78rem;color:var(--acc);margin-bottom:6px}
.playr audio{width:100%}
.none{text-align:center;color:var(--dim);padding:40px 0;font-size:.85rem}
.stat{text-align:center;color:var(--dim);font-size:.68rem;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<h2 style="font-family:var(--font-ar);margin:6px 0">مُجيب <span class="muted">— اسأل فيجدك المقطع الدقيق</span></h2>
<div class="muted">اكتب ما تبحث عنه — كلمة، مسألة، اسم — فيجد لك <b style="color:var(--acc)">اللحظة الدقيقة</b> في أي درس من ١٩ درساً مفرّغاً (١٨ ألف مقطع) ويشغّلها لك من ثانيّتها، أو ينقلك للمشغل الكامل بالكاراوكي.</div>
<div class="ask"><input id="q" placeholder="مثال: مدلول اللفظ — الاستعارة — النقض…" autofocus><button id="go">اسأل</button></div>
<div class="sugs" id="sugs"></div>
<div class="stat" id="st">جارٍ تحميل فهرس الـ١٨ ألف مقطع…</div>
<div id="res"></div>
<div id="pb"></div>
</div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.replace(/[ً-ٰٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
const R='https://github.com/medmrf-10/des/releases/download/audio-pack/';
let IDX=null;
fetch('index.json').then(r=>r.json()).then(d=>{IDX=d;$('st').textContent='جاهز — '+d.length.toLocaleString('ar-EG')+' مقطعاً'}).catch(()=>{$('st').textContent='تعذر تحميل الفهرس'});
$('sugs').innerHTML=['الاستعارة','المدلول','النقض','الملازمة','الدلالة','المتناظران','التوارد'].map(s=>`<span>${s}</span>`).join('');
$('sugs').onclick=e=>{if(e.target.tagName==='SPAN'){$('q').value=e.target.textContent;go()}};
function score(p,qs){
 const n=p.n;let sc=0;
 if(n.includes(qs.join(' ')))sc+=50;
 let hits=0;qs.forEach(w=>{if(n.includes(w)){hits++;sc+=10+w.length}});
 if(hits===qs.length)sc+=30;
 return hits?sc:0;
}
let player=null,stopAt=0;
function play(h){
 if(!player){player=document.createElement('audio');player.controls=true}
 player.src=R+h.l+'.mp3';
 const t=h.s;
 player.onloadedmetadata=()=>{player.currentTime=Math.max(0,t-.3);player.play()};
 if(player.src){player.load()}
 stopAt=h.e+.3;
 player.ontimeupdate=()=>{if(stopAt&&player.currentTime>=stopAt){player.pause();stopAt=0}};
 $('pb').innerHTML=`<div class="playr"><div class="pt">▶ ${esc(h.t)} — ${Math.floor(h.s/60)}:${String(Math.floor(h.s%60)).padStart(2,'0')} <a href="../live/?l=${h.l}&t=${h.s}" target="_blank" style="color:var(--acc);font-size:.66rem">المشغل الكامل بالكاراوكي ←</a></div></div>`;
 $('pb').querySelector('.playr').appendChild(player);
 $('pb').scrollIntoView({behavior:'smooth',block:'end'});
}
function go(){
 if(!IDX){$('st').textContent='انتظر تحميل الفهرس…';return}
 const qs=norm($('q').value).split(' ').filter(Boolean);
 if(!qs.length)return;
 const hits=IDX.map(p=>[p,score(p,qs)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,15).map(x=>x[0]);
 $('res').innerHTML=hits.length?hits.map((h,i)=>{
  let tx=esc(h.x);qs.forEach(w=>{tx=tx.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),m=>'<mark>'+m+'</mark>')});
  return `<div class="hit" data-i="${i}"><div class="ht">📌 ${esc(h.t)} <span class="tm">${Math.floor(h.s/60)}:${String(Math.floor(h.s%60)).padStart(2,'0')}</span></div><div class="hx">${tx}</div><div class="hw">اضغط للسماع من هذه اللحظة <a href="#" class="saveclip" data-i="${i}" style="color:var(--acc);text-decoration:none;float:left">⭐ منتقى</a></div></div>`;
 }).join(''):'<div class="none">لا نتائج — جرّب كلمات أعمّ أو بلا تشكيل</div>';
 $('res').onclick=e=>{
 const sc=e.target.closest('.saveclip');
 if(sc){e.preventDefault();const h=hits[+sc.dataset.i];
  const arr=JSON.parse(localStorage.getItem('muntaga')||'[]');
  if(!arr.some(x=>x.l===h.l&&x.s===h.s)){arr.unshift({l:h.l,t:h.t,s:h.s,e:h.e,x:h.x});localStorage.setItem('muntaga',JSON.stringify(arr));}
  sc.textContent='✓ محفوظة';sc.style.color='var(--ok)';return}
 const h=e.target.closest('.hit');if(h)play(hits[+h.dataset.i])};;
 $('st').textContent=hits.length?hits.length+' نتيجة':'';
 if(window.llmReady&&window.llmReady()&&hits.length){
  const b=document.createElement('button');b.className='btn';b.style.cssText='margin-top:12px;background:linear-gradient(135deg,var(--acc2),var(--acc))';
  b.textContent='✦ اشرح لي وأجب عن سؤالي';b.onclick=()=>aiAnswer(hits);
  $('st').appendChild(document.createTextNode(' '));$('st').appendChild(b);
 }
}
async function aiAnswer(hits){
 const ctx=hits.slice(0,6).map((h,i)=>`[${i+1}] ${h.t} (${Math.floor(h.s/60)}:${String(Math.floor(h.s%60)).padStart(2,'0')}): «${h.x}»`).join('\n');
 $('res').insertAdjacentHTML('beforeend','<div class="hit" id="aiA" style="cursor:default;border-color:var(--acc)"><div class="hx" style="color:var(--acc)">يفكّر…</div></div>');
 try{
  const out=await window.gemAsk('أنت معلّم يجيب عن سؤال الطالب مستشهداً بمقاطع من دروسه التي وجدها بالبحث. اجب إجابة مركّزة (فقرة أو فقرتين + نقاط إن لزم)، وأشر إلى المقطع [رقمه] عند الاستشهاد.\n\nسؤاله: '+$('q').value+'\n\nالمقاطع:\n'+ctx,{maxTokens:800});
  $('aiA').innerHTML='<div class="ht" style="color:var(--acc)">✦ إجابة المعلّم</div><div class="hx" style="white-space:pre-wrap">'+esc(out).replace(/\n/g,'<br>')+'</div>';
 }catch(e){$('aiA').innerHTML='<div class="hx" style="color:var(--dim)">'+esc(e.message)+'</div>'}
}
$('go').onclick=go;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
<script src="../shared/llm.js"></script>
<script src="../shared/feedback.js" data-pid="mujib" data-title="مُجيب"></script>
</body>
</html>
