<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِزلَق — عدّاد النقاء</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.btn.danger{background:var(--acc2);color:#fff}
.big{font-family:var(--font-ar);font-size:36px;color:var(--acc);text-align:center}
.hb{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-top:9px}
.hb .n{font-family:var(--font-ar);font-size:14px}
.hb .days{font-size:11px;color:var(--dim);margin-top:3px}
.srcrow{display:flex;gap:9px;align-items:center;margin-top:7px;font-size:12px}
.srcrow .nm{min-width:100px;font-family:var(--font-ar)}
.srcrow .bar{flex:1;height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.srcrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),#a05a5a)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِزلَق <span class="muted">— عدّاد النقاء</span></h2>
<div class="muted">عادة تتركها: كل يوم نظيف يُحسب، وكل زلّة تُسجَّل بمُثيرها — لتعرف من أين يأتي السقوط.</div>
<div class="card"><div class="t">عادة أتركها</div>
<input id="h" placeholder="ما الذي تقلع عنه؟">
<button class="btn" id="ad" style="margin-top:9px">ابدأ العد</button></div>
<div id="stats"></div>
<div id="list"></div>
<div class="card"><div class="t">مُثيرات الزلّات</div><div id="srcs"></div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let H=LS('mizlaq',[]);
const today=()=>new Date().toISOString().slice(0,10);
const daysSince=t=>Math.floor((Date.now()-t)/864e5);
$('#ad').onclick=()=>{
 const h=$('#h').value.trim();if(!h)return;
 H.push({h,start:Date.now(),slips:[]});SV('mizlaq',H);$('#h').value='';render();
};
function render(){
 const slips=H.reduce((s,x)=>s+x.slips.length,0);
 const best=H.length?Math.max(...H.map(x=>Math.max(daysSince(x.start),...x.slips.map(s=>daysSince(s.at))))):0;
 $('#stats').innerHTML='<span class="stat">عادات: <b>'+arN(H.length)+'</b></span>'+
 '<span class="stat">أطول نقاء: <b style="color:var(--ok)">'+arN(best)+' يوم</b></span>'+
 '<span class="stat">زلّات: <b style="color:var(--acc2)">'+arN(slips)+'</b></span>';
 const trg={};H.forEach(x=>x.slips.forEach(s=>trg[s.t]=(trg[s.t]||0)+1));
 const trgs=Object.entries(trg).sort((a,b)=>b[1]-a[1]);
 const mx=trgs.length?trgs[0][1]:1;
 $('#srcs').innerHTML=trgs.map(([t,c])=>'<div class="srcrow"><span class="nm">'+esc(t)+'</span>'+
 '<div class="bar"><i style="width:'+(c/mx*100)+'%"></i></div><b style="font-size:11px;color:var(--acc2)">'+arN(c)+'</b></div>').join('')||
 '<div class="muted">لا زلّات مسجلة.</div>';
 $('#list').innerHTML=H.map((x,i)=>{
  const clean=daysSince(x.slips.length?x.slips[x.slips.length-1].at:x.start);
  return '<div class="hb"><div class="n">'+esc(x.h)+'</div>'+
  '<div class="big">'+arN(clean)+'</div><div class="days">يوم نقي متتالي · '+arN(x.slips.length)+' زلّة</div>'+
  '<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">'+
  '<button class="btn ghost" data-s="'+i+'" style="color:var(--acc2);font-size:10px">💔 زللت</button>'+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا عادات — ابدأ ترك شيء.</div>';
}
$('#list').onclick=e=>{
 const s=e.target.closest('[data-s]'),d=e.target.closest('[data-d]');
 if(s){const t=prompt('ما المُثير؟ (ملل، ضغط، رفقة، مكان…)');if(t===null)return;
  H[+s.dataset.s].slips.push({at:Date.now(),t:t||'غير مذكور'});SV('mizlaq',H);render();return}
 if(d&&confirm('احذف العادة؟')){H.splice(+d.dataset.d,1);SV('mizlaq',H);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mizlaq" data-title="مِزلَق"></script>
</body>
</html>
