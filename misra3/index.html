<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسرَع — سرعة الإنجاز</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.w{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-top:9px}
.w .nm{font-family:var(--font-ar);font-size:14px;display:flex;justify-content:space-between}
.w .pace{font-size:12px;color:var(--acc);margin-top:4px}
.w .pace.behind{color:var(--acc2)}
.w .meta{font-size:10.5px;color:var(--dim);margin-top:7px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.bar{height:5px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.f{height:100%;background:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.step{display:flex;gap:7px;margin-top:9px;align-items:center}
.step input{width:90px;margin-top:0}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسرَع <span class="muted">— سرعة الإنجاز</span></h2>
<div class="muted">هدف بكمية + موعد → الوتيرة اليومية المطلوبة. سجّل تقدمك وراقب إن كنت على السير أم متأخر.</div>
<div class="card"><div class="t">عمل جديد</div>
<input id="nm" placeholder="ختم القرآن، كتاب الـ300 صفحة، مراجعة الـ60 درساً…">
<div style="display:flex;gap:8px;margin-top:7px">
<input id="tot" type="number" placeholder="الكمية الكلية" min="1">
<input id="due" type="date"></div>
<button class="btn" id="add" style="margin-top:9px">احسب الوتيرة</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let W=LS('misra3',[]);
$('#add').onclick=()=>{
 const n=$('#nm').value.trim(),t=+$('#tot').value,d=$('#due').value;
 if(!n||!t||!d)return;
 W.unshift({n,tot:t,done:0,due:d,at:today()});
 SV('misra3',W);$('#nm').value='';$('#tot').value='';$('#due').value='';render();
};
const daysLeft=d=>Math.max(0,Math.ceil((new Date(d)-new Date(today()))/86400000));
function render(){
 $('#stats').innerHTML='<span class="stat">أعمال جارية: <b>'+arN(W.filter(w=>w.done<w.tot).length)+'</b></span>';
 $('#list').innerHTML=W.map((w,i)=>{
  const dl=daysLeft(w.due),rem=w.tot-w.done;
  const need=dl>0?Math.ceil(rem/dl):rem;
  const elapsed=Math.max(1,Math.floor((new Date(today())-new Date(w.at))/86400000)+1);
  const expect=Math.min(w.tot,Math.round(w.tot*elapsed/(elapsed+dl)||0));
  const behind=w.done<expect&&rem>0;
  const pct=Math.min(100,Math.round(w.done/w.tot*100));
  return '<div class="w"><div class="nm"><span>'+esc(w.n)+'</span><span class="muted">'+arN(w.done)+'/'+arN(w.tot)+'</span></div>'+
  '<div class="pace'+(behind?' behind':'')+'">'+(rem<=0?'✓ اكتمل':'المطلوب: <b>'+arN(need)+'</b>/يوم — متبقٍ '+arN(dl)+' يوم'+(behind?' · متأخر عن المسار':''))+'</div>'+
  '<div class="bar"><div class="f" style="width:'+pct+'%"></div></div>'+
  '<div class="step"><input type="number" data-i="'+i+'" placeholder="أنجزت اليوم" min="0" style="width:110px">'+
  '<button class="btn ghost" data-a="'+i+'">سجّل</button>'+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2)">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أعمال — أضف أولها.</div>';
}
$('#list').onclick=e=>{
 const a=e.target.closest('[data-a]');
 if(a){
  const i=+a.dataset.a,inp=a.parentElement.querySelector('input'),v=+inp.value;
  if(v>0){W[i].done=Math.min(W[i].tot,W[i].done+v);SV('misra3',W);render()}
  return}
 const d=e.target.closest('[data-d]');
 if(d&&confirm('حذف؟')){W.splice(+d.dataset.d,1);SV('misra3',W);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="misra3" data-title="مِسرَع"></script>
</body>
</html>
