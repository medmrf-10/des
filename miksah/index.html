<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِكسَح — المسح اليومي</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.sw{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:7px;cursor:pointer}
.sw .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.sw.on .ck{background:var(--acc);border-color:var(--acc);color:#14140f}
.sw .x{flex:1;font-family:var(--font-ar);font-size:13px}
.sw.on .x{text-decoration:line-through;opacity:.5}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:16px;text-align:center;margin-top:11px;font-family:var(--font-ar)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِكسَح <span class="muted">— المسح اليومي</span></h2>
<div class="muted">٥ دقائق مسح رقمي قبل النوم — الفوضى الصغيرة تتراكم لتصير جبلاً.</div>
<div class="card"><div class="t">مهام المسح</div>
<input id="nw" placeholder="مهمة (أفرغ التنزيلات، أغلق التبويبات، صندوق وارد صفر…)">
<button class="btn" id="ad" style="margin-top:9px">أضِف</button></div>
<div id="banner"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let S=LS('miksah_tasks',['أفرغ مجلد التنزيلات','أغلق تبويبات المتصفح','رد على الرسائل المعلقة','نظّف سطح المكتب','راجع إشعارات اليوم']);
let D=LS('miksah',{});
const today=()=>new Date().toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const x=$('#nw').value.trim();if(!x)return;
 S.push(x);SV('miksah_tasks',S);$('#nw').value='';render();
};
function render(){
 const t=today(),dd=D[t]||{};
 const done=S.filter((x,i)=>dd[i]).length;
 $('#banner').innerHTML=done===S.length&&S.length?'<div class="banner" style="color:var(--ok)">🧹 مسح مكتمل — نم نظيفاً.</div>':
 '<div class="banner">امسح <b>'+arN(done)+'/'+arN(S.length)+'</b></div>';
 let streak=0,d=new Date(Date.now()-864e5);
 for(;;){const k=d.toISOString().slice(0,10),rec=D[k]||{};
  if(S.length&&S.every((x,i)=>rec[i])){streak++;d=new Date(d-864e5)}else break}
 $('#stats').innerHTML='<span class="stat">مسح مكتمل متتالٍ: <b style="color:var(--ok)">'+arN(streak)+'</b></span>';
 $('#list').innerHTML=S.map((x,i)=>'<div class="sw'+(dd[i]?' on':'')+'" data-i="'+i+'">'+
 '<span class="ck">'+(dd[i]?'✓':'')+'</span><span class="x">'+esc(x)+'</span>'+
 '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2);padding:4px 8px;font-size:10px">✕</button></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا مهام.</div>';
}
$('#list').onclick=e=>{
 const del=e.target.closest('[data-d]');
 if(del){S.splice(+del.dataset.d,1);SV('miksah_tasks',S);render();return}
 const s=e.target.closest('.sw');if(!s)return;
 const i=+s.dataset.i,t=today();
 D[t]=D[t]||{};D[t][i]=!D[t][i];SV('miksah',D);render();
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="miksah" data-title="مِكسَح"></script>
</body>
</html>
