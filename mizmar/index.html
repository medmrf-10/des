<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِزمَر — إيقاع الأسبوع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:720px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:11px}
.dy{text-align:center}
.dy .h{font-family:var(--font-ar);font-size:11px;color:var(--acc);padding:5px 2px;border-bottom:1px solid var(--border);margin-bottom:6px}
.bl{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:5px 4px;margin-top:5px;font-size:10px;font-family:var(--font-ar);cursor:pointer;position:relative}
.bl .tm{color:var(--dim);font-size:8.5px;display:block}
.bl.today{border-color:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِزمَر <span class="muted">— إيقاع الأسبوع</span></h2>
<div class="muted">شبكة أسبوعك الثابتة: صلوات، عمل، دراسة، عائلة. ما يتكرر يُرى.</div>
<div class="card"><div class="t">كتلة ثابتة</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<select id="dy"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select>
<input id="tm" type="time" style="width:100px">
<input id="tx" placeholder="الكتلة (فجر، عمل، دراسة…)" style="flex:1;min-width:130px">
<button class="btn" id="ad">أضِف</button></div></div>
<div id="stats"></div>
<div class="grid" id="grid"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let B=LS('mizmar',[]);
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const today=()=>new Date().getDay();
$('#ad').onclick=()=>{
 const tx=$('#tx').value.trim();if(!tx)return;
 B.push({dy:+$('#dy').value,tm:$('#tm').value||'',tx});SV('mizmar',B);$('#tx').value='';render();
};
function render(){
 const td=today();
 $('#stats').innerHTML='<span class="stat">كتل ثابتة: <b>'+arN(B.length)+'</b></span>'+
 '<span class="stat">اليوم ('+DAYS[td]+'): <b style="color:var(--acc)">'+arN(B.filter(x=>x.dy===td).length)+'</b></span>';
 $('#grid').innerHTML=DAYS.map((d,dy)=>'<div class="dy"><div class="h'+(dy===td?' today':'')+'" style="'+(dy===td?'color:var(--acc);font-weight:700':'')+'">'+d+'</div>'+
 B.filter(x=>x.dy===dy).sort((a,b)=>(a.tm||'').localeCompare(b.tm||'')).map((x)=>{
  const gi=B.indexOf(x);
  return '<div class="bl'+(dy===td?' today':'')+'" data-d="'+gi+'">'+(x.tm?'<span class="tm">'+x.tm+'</span>':'')+esc(x.tx)+'</div>';
 }).join('')+'</div>').join('');
}
$('#grid').onclick=e=>{
 const b=e.target.closest('.bl');
 if(b&&confirm('احذف "'+B[+b.dataset.d].tx+'"؟')){B.splice(+b.dataset.d,1);SV('mizmar',B);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mizmar" data-title="مِزمَر"></script>
</body>
</html>
