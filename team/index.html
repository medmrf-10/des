<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فريق العمل — النبذات والمشاريع</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f1a">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--card:#141b2e;--card2:#1a2238;--border:#2a3350;--txt:#f5f1e8;--dim:#8b93b0;--acc:#c9a24b;--acc2:#e8c97a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Amiri','Noto Naskh Arabic',serif;min-height:100dvh;overflow-x:hidden}
header{padding:20px 18px 14px;text-align:center}
header h1{font-size:1.5rem;font-weight:700;color:var(--acc2)}
header p{color:var(--dim);font-size:.85rem;margin-top:6px}
main{max-width:560px;margin:0 auto;padding:8px 16px 60px}
.member{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;cursor:pointer;transition:all .2s}
.member:hover{border-color:var(--acc);transform:translateY(-2px)}
.mhead{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#c9a24b,#8a6a2f);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:#0b0f1a;flex:0 0 auto}
.mname{font-size:1.05rem;font-weight:700}
.mrole{font-size:.78rem;color:var(--acc2);margin-top:2px}
.mbio{font-size:.85rem;color:var(--dim);margin-top:10px;line-height:1.7}
.mproj{font-size:.75rem;color:var(--acc2);margin-top:10px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--dim);padding:7px 14px;font-family:inherit;font-size:.8rem;cursor:pointer;margin-bottom:16px}
.back:hover{color:var(--acc2);border-color:var(--acc)}
.phead{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px;text-align:center}
.phead .avatar{width:72px;height:72px;font-size:1.8rem;margin:0 auto 12px}
.pname{font-size:1.2rem;font-weight:700}
.prole{color:var(--acc2);font-size:.8rem;margin-top:4px}
.pportal{display:inline-block;font-size:.68rem;color:var(--acc);border:1px solid var(--border);border-radius:99px;padding:3px 12px;margin-top:9px;letter-spacing:.03em}
.pbio{color:var(--dim);font-size:.85rem;margin-top:10px;line-height:1.7}
.portallink{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-top:12px;text-align:right}
.portallink .u{flex:1;font-size:.68rem;color:var(--acc2);direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace}
.portallink .cp{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--acc2);font-family:inherit;font-size:.7rem;padding:4px 12px;cursor:pointer;flex:0 0 auto}
.portallink .cp:hover{border-color:var(--acc)}
.proj{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.ptitle{font-size:1rem;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pdesc{color:var(--dim);font-size:.83rem;margin-top:8px;line-height:1.7}
.plink{display:inline-block;margin-top:10px;color:var(--acc2);font-size:.8rem;text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:5px 12px}
.plink:hover{background:var(--card2)}
.demo{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px}
.demo-t{font-size:.72rem;color:var(--acc2);letter-spacing:.5px;margin-bottom:8px}
.dq{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.dq .qt{font-size:.85rem;font-weight:600;margin-bottom:8px}
.dq .qo{display:flex;flex-wrap:wrap;gap:6px}
.dq .qo span{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:.72rem;color:var(--dim)}
.rate{display:flex;align-items:center;gap:4px;margin-top:12px}
.rate .lbl{font-size:.72rem;color:var(--dim);margin-inline-end:6px}
.star{background:none;border:none;font-size:1.15rem;color:var(--border);cursor:pointer;transition:all .15s;padding:0 1px}
.star.on{color:var(--acc2);text-shadow:0 0 10px #e8c97a66}
.rateval{font-size:.7rem;color:var(--acc2);margin-inline-start:6px}
.empty{color:var(--dim);text-align:center;padding:30px;font-size:.85rem}
</style>
<link rel="stylesheet" href="/des/shared/theme.css">
</head>
<body>
<header><h1>فريق العمل</h1><p>نبذات الأعضاء ومشاريعهم — تجارب أفكار جديدة</p></header>
<main id="app"></main>
<script>
const $=id=>document.getElementById(id);
const app=$('app');
let MEMBERS=[];
const ratings=JSON.parse(localStorage.getItem('team_ratings')||'{}');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=n=>`<div class="avatar">${esc((n||'?').trim()[0])}</div>`;

function home(){
  app.innerHTML=MEMBERS.map(m=>`
    <div class="member" onclick="location.hash='${m.id}'">
      <div class="mhead">${avatar(m.name)}<div><div class="mname">${esc(m.name)}</div><div class="mrole">${esc(m.role)}</div></div></div>
      <div class="mbio">${esc(m.bio)}</div>
      <div class="mproj">${m.projects.length?m.projects.length+' مشروع/نبذة':'لا مشاريع معروضة بعد'}</div>
    </div>`).join('')||'<div class="empty">لا أعضاء بعد</div>';
}

function profile(m){
  app.innerHTML=`<button class="back" onclick="location.hash=''">→ الفريق</button>
  <div class="phead">${avatar(m.name)}<div class="pname">${esc(m.name)}</div><div class="prole">${esc(m.role)}</div><div class="pportal">بوابة العضو — نبذاته وتقييم أعماله</div><div class="pbio">${esc(m.bio)}</div>
  ${m.portal?`<div class="portallink"><span class="u">${esc(new URL(m.portal,location.href).href)}</span><a class="cp" style="text-decoration:none" href="${esc(m.portal)}">افتح</a><button class="cp" data-u="${esc(new URL(m.portal,location.href).href)}">نسخ الرابط</button></div>`:''}</div>
  ${m.projects.length?m.projects.map((p,i)=>projHTML(m.id,i,p)).join(''):'<div class="empty">لا مشاريع معروضة بعد — تُضاف فور اعتمادها</div>'}`;
}

function projHTML(mid,i,p){
  const key=mid+':'+i,v=ratings[key]||0;
  return `<div class="proj">
    <div class="ptitle">${esc(p.title)}</div>
    <div class="pdesc">${esc(p.desc)}</div>
    ${p.url?`<a class="plink" href="${esc(p.url)}" target="_blank" rel="noopener">فتح الموقع ←</a>`:''}
    ${p.demo?`<div class="demo"><div class="demo-t">نبذة توضيحية</div>${p.demo.map(d=>`<div class="dq"><div class="qt">${esc(d.q)}</div><div class="qo">${(d.opts||[]).map(o=>`<span>${esc(o)}</span>`).join('')}</div></div>`).join('')}</div>`:''}
    <div class="rate" data-k="${key}"><span class="lbl">قيّم:</span>${[1,2,3,4,5].map(n=>`<button class="star${v>=n?' on':''}" data-v="${n}">★</button>`).join('')}<span class="rateval">${v?v+'/5':''}</span></div>
  </div>`;
}

document.addEventListener('click',e=>{
  const cp=e.target.closest('.cp');
  if(cp){navigator.clipboard.writeText(cp.dataset.u).then(()=>{cp.textContent='✓ نُسخ';setTimeout(()=>cp.textContent='نسخ الرابط',1500)});return}
  const st=e.target.closest('.star');if(!st)return;
  const k=st.parentElement.dataset.k;
  ratings[k]=+st.dataset.v;
  localStorage.setItem('team_ratings',JSON.stringify(ratings));
  st.parentElement.querySelectorAll('.star').forEach(s=>s.classList.toggle('on',+s.dataset.v<=ratings[k]));
  st.parentElement.querySelector('.rateval').textContent=ratings[k]+'/5';
});

function route(){
  const id=location.hash.slice(1);
  const m=MEMBERS.find(x=>x.id===id);
  if(m)profile(m);else home();
}
addEventListener('hashchange',route);
fetch('members.json').then(r=>r.json()).then(m=>{MEMBERS=m;route()});
</script>
<script src="/des/shared/feedback.js" data-pid="team" data-title="فريق العمل" defer></script>
</body>
</html>
