<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشذَب — تقليم الالتزامات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.rec{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec .x{flex:1;font-family:var(--font-ar);font-size:13px}
.rec .nm{color:var(--dim);font-size:10px}
.verd{font-size:10px;padding:2px 8px;border-radius:6px}
.verd.keep{background:var(--ok);color:#14140f}
.verd.prune{background:var(--acc2);color:#14140f}
.verd.think{background:var(--acc);color:#14140f}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشذَب <span class="muted">— تقليم الالتزامات</span></h2>
<div class="muted">كل التزام متكرر (اشتراك، عادة، دعوة، مجموعة) غصن في شجرتك — راجعها: إبقاء، تفكير، أم تقليم؟</div>
<div class="card"><div class="t">التزام متكرر</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="الالتزام (اشتراك، مجموعة واتساب، لقاء أسبوعي…)" style="flex:1;min-width:160px">
<select id="cst"><option value="">كلفته الأسبوعية؟</option><option value="وقت">وقت</option><option value="مال">مال</option><option value="وقت+مال">وقت + مال</option><option value="طاقة">طاقة</option></select>
<button class="btn" id="ad">أضِف للتقليم</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let R=LS('mishdhab',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 R.unshift({n,c:$('#cst').value,v:null});SV('mishdhab',R);$('#nm').value='';render();
};
function render(){
 const kp=R.filter(x=>x.v==='keep').length,pr=R.filter(x=>x.v==='prune').length,th=R.filter(x=>x.v==='think').length,ud=R.filter(x=>!x.v).length;
 $('#stats').innerHTML='<span class="stat">التزامات: <b>'+arN(R.length)+'</b></span>'+
 '<span class="stat">إبقاء: <b style="color:var(--ok)">'+arN(kp)+'</b></span>'+
 '<span class="stat">تفكير: <b style="color:var(--acc)">'+arN(th)+'</b></span>'+
 '<span class="stat">تقليم: <b style="color:var(--acc2)">'+arN(pr)+'</b></span>'+
 (ud?'<span class="stat">بلا حكم: <b>'+arN(ud)+'</b></span>':'');
 $('#list').innerHTML=R.map((x,i)=>{
  const vd=x.v?'<span class="verd '+x.v+'">'+(x.v==='keep'?'إبقاء':x.v==='prune'?'تقليم':'تفكير')+'</span>':'';
  const btns='<span style="display:flex;gap:4px">'+
   '<button class="btn ghost" data-v="keep" data-i="'+i+'" style="color:var(--ok);font-size:10px;padding:4px 8px">أبقِ</button>'+
   '<button class="btn ghost" data-v="think" data-i="'+i+'" style="font-size:10px;padding:4px 8px">فكّر</button>'+
   '<button class="btn ghost" data-v="prune" data-i="'+i+'" style="color:var(--acc2);font-size:10px;padding:4px 8px">قلّم</button>'+
   '<button class="btn ghost" data-d="'+i+'" style="color:var(--dim);font-size:10px;padding:4px 6px">✕</button></span>';
  return '<div class="rec"><span class="x">'+esc(x.n)+(x.c?' <span class="nm">· '+x.c+'</span>':'')+'</span>'+vd+btns+'</div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا التزامات — أضِف ما يتكرر في أسبوعك.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){R.splice(+d.dataset.d,1);SV('mishdhab',R);render();return}
 const v=e.target.closest('[data-v]');if(!v)return;
 R[+v.dataset.i].v=v.dataset.v;SV('mishdhab',R);render();
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mishdhab" data-title="مِشذَب"></script>
</body>
</html>
