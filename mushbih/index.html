<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشبه — المتشابهات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px}
.v{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;font-family:var(--font-ar);font-size:18px;line-height:2.2;margin-top:10px}
.v.gold{border-color:var(--acc)}
.v .ref{display:flex;justify-content:space-between;font-size:11px;color:var(--acc3);margin-bottom:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:13px;margin:5px 4px 0}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.opt{display:block;width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:12px 15px;margin-top:8px;font-family:var(--font-ar);font-size:15px;line-height:2;text-align:right;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:rgba(52,168,83,.1)}
.opt.bad{border-color:#e07777;background:rgba(224,119,119,.1)}
.muted{color:var(--dim);font-size:12px}
.pill{display:inline-block;background:var(--card2);border-radius:99px;padding:3px 11px;font-size:11px;margin:3px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشبه <span class="muted">— تدريب المتشابهات</span></h2>
<div class="muted">أخطر بقاع الحفظ: آية تشبه أختها تقريباً. تعرض الآية ← وستّ شواهد تبدو كلها صحيحة ← اختر النص الحق.</div>
<div id="st" style="margin:8px 0"></div>
<div id="box"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=null,round=0,score=0;
const seen=new Set();
function laz(){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../wahy/mutashabih.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
async function go(){
 if(!M){await laz();M=window.MUTA}
 // اختر آية لها شواهد متشابهة قوية (score>=70)
 const ks=Object.keys(M.sim).filter(k=>M.sim[k][3]&&M.sim[k][3].length&&M.sim[k][3][0][1]>=0.7&&!seen.has(k));
 if(!ks.length){$('#box').innerHTML='<div class="muted" style="padding:20px;text-align:center">أنهيت جولة المتشابهات القوية كلها 🎉 — <a href="#" onclick="location.reload()" style="color:var(--acc)">أعد</a></div>';return}
 const k=ks[Math.floor(Math.random()*ks.length)];seen.add(k);
 const[s,a,t,prs]=M.sim[k];
 const partner=prs[Math.floor(Math.random()*Math.min(3,prs.length))];
 const pk=partner[0];const ps=M.sim[pk];
 // الخيارات: نصها الحق + نص الشاهد المشابه + آية عشوائية من نفس السورة
 let others=[ps[2]];
 const ks2=Object.keys(M.sim);for(let i=0;i<20&&others.length<3;i++){const o=M.sim[ks2[Math.floor(Math.random()*ks2.length)]];if(o&&o[2]!==t&&!others.includes(o[2]))others.push(o[2])}
 const opts=[t,...others].sort(()=>Math.random()-.5);
 round++;
 $('#box').innerHTML=`<div class="v gold"><div class="ref"><span>سورة ${esc(M.names[s]||s)} : ${a.toLocaleString('ar-EG')}</span><span class="muted">شُبّه بـ ${ps?esc(M.names[ps[0].split(':')[0]]||''):''} ${ps?esc(ps[0].split(':')[1]):''}</span></div>
 <div class="muted" style="font-size:13px">الآية في ${esc(M.names[s]||s)} ${a.toLocaleString('ar-EG')} — اختر نصها الحق:</div></div>
 ${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}`;
 $('#box').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const ok=b.textContent===t;
  if(ok){b.classList.add('ok');score++;
   $('#box').insertAdjacentHTML('beforeend',`<div class="v"><div class="ref"><span>الشاهد المشابه: ${esc(M.names[ps[0].split(':')[0]]||'')} ${esc(ps[0].split(':')[1])} · تشابه ${Math.round(partner[1]*100)}%</span></div>${esc(ps[2])}</div>
   <button class="btn" onclick="window._nx()">التالية ←</button>`);
   $('#st').innerHTML=`<span class="pill">جولة ${round.toLocaleString('ar-EG')}</span><span class="pill">صحيح ${score.toLocaleString('ar-EG')}</span>`;
   localStorage.setItem('mushbih',JSON.stringify({n:round,ok:score}))}
  else{b.classList.add('bad');score--;
   $('#box').insertAdjacentHTML('beforeend','<div class="muted" style="margin-top:8px">خطأ — الحق مُظلّل أخضر. <a href="#" onclick="window._nx();return false" style="color:var(--acc)">التالية ←</a></div>');
   $('#box').querySelectorAll('.opt').forEach(x=>{if(x.textContent===t)x.classList.add('ok')})}})}
window._nx=go;
go();
const pr=JSON.parse(localStorage.getItem('mushbih')||'{"n":0,"ok":0}');
if(pr.n)$('#st').innerHTML+=`<span class="pill">سابقاً: ${pr.ok.toLocaleString('ar-EG')}/${pr.n.toLocaleString('ar-EG')}</span>`;
</script>
<script src="../shared/feedback.js" data-pid="mushbih" data-title="مِشبه"></script>
</body>
</html>
