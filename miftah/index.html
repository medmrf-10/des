<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِفتَح — مفاتيحي</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.key{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.key .r{font-family:var(--font-ar);font-size:13.5px;color:var(--acc)}
.key .w{font-size:12px;color:var(--txt);margin-top:5px}
.key .cnt{font-size:10px;color:var(--dim);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِفتَح <span class="muted">— مفاتيحي</span></h2>
<div class="muted">قواعدك التي فتحت لك: «إذا ترددت بين أمرين فاختر أيسرهما»، «لا تقرر وأنت جائع». كل مفتاح = قاعدة + متى تفتح. سجّل كل مرة استعملته.</div>
<div class="card"><div class="t">مفتاح جديد</div>
<input id="r" placeholder="القاعدة (لا أرد فوراً على الرسائل الغاضبة)">
<input id="w" placeholder="متى يفتح؟ (رسالة تثير الغضب)">
<button class="btn" id="ad" style="margin-top:9px">أضِف</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let K=LS('miftah',[]);
$('#ad').onclick=()=>{
 const r=$('#r').value.trim();if(!r)return;
 K.unshift({r,w:$('#w').value.trim(),cnt:0,at:Date.now()});
 SV('miftah',K);$('#r').value=$('#w').value='';render();
};
function render(){
 const tot=K.reduce((s,x)=>s+x.cnt,0);
 const best=K.slice().sort((a,b)=>b.cnt-a.cnt)[0];
 $('#stats').innerHTML='<span class="stat">مفاتيح: <b>'+arN(K.length)+'</b></span>'+
 '<span class="stat">استعمالات: <b style="color:var(--acc)">'+arN(tot)+'</b></span>'+
 (best&&best.cnt?'<span class="stat">أثبتها: <b>'+esc(best.r.slice(0,20))+'</b></span>':'');
 $('#list').innerHTML=K.map((x,i)=>{
  const gi=K.indexOf(x);
  return '<div class="key"><div class="r">🔑 '+esc(x.r)+'</div>'+
  (x.w?'<div class="w">يفتح: '+esc(x.w)+'</div>':'')+
  '<div class="cnt">فتح لك '+arN(x.cnt)+' مرة</div>'+
  '<div style="display:flex;gap:6px;margin-top:6px">'+
  '<button class="btn ghost" data-u="'+gi+'" style="color:var(--ok);font-size:10px">استعملته اليوم</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا مفاتيح — ما القاعدة التي تحكم بها؟</div>';
}
$('#list').onclick=e=>{
 const u=e.target.closest('[data-u]'),d=e.target.closest('[data-d]');
 if(u){K[+u.dataset.u].cnt++;SV('miftah',K);render();return}
 if(d&&confirm('احذف؟')){K.splice(+d.dataset.d,1);SV('miftah',K);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="miftah" data-title="مِفتَح"></script>
</body>
</html>
