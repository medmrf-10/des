<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَف — أكمل من حيث توقفت</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:620px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.res{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-top:9px;transition:border-color .15s;cursor:pointer}
.res:hover{border-color:var(--acc)}
.res .ic{width:38px;height:38px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.res .bd{flex:1;min-width:0}
.res .nm{font-family:var(--font-ar);font-size:13.5px}
.res .pos{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .go{color:var(--acc);font-size:11px;white-space:nowrap;text-decoration:none}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَف <span class="muted">— أكمل من حيث توقفت</span></h2>
<div class="muted">آخر موضع لك في كل قارئ ومتتبع — نقرة واحدة وتعود.</div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const R=[];
// مواضع القراءة المحفوظة عبر الأدوات
const probes=[
 {k:'iqra_pos',name:'مِقرأة',ic:'📖',get:v=>v?{pos:'سورة '+arN(v.s||'?')+' · آية '+arN(v.a||'?'),u:'../miqraa/'}:null},
 {k:'mz_pos',name:'مِسبح — ورد اليوم',ic:'📿',get:v=>v?{pos:'الموضع '+arN(v.i||0),u:'../misbah/'}:null},
 {k:'miq_siyar',name:'سِيَر الحديث',ic:'📜',get:v=>v?{pos:'آخر سير محفوظ',u:'../hadith/siyar.html'}:null},
 {k:'en_story',name:'قصة إنجليزية',ic:'📚',get:v=>v?{pos:'القصة '+arN(v.i||0),u:'../english/story.html'}:null},
 {k:'muqfil',name:'مِقفل — الخاتمة',ic:'📕',get:v=>v?{pos:'تقدم الختمة',u:'../muqfil/'}:null},
 {k:'prog_v1',name:'مسار البرمجة',ic:'💻',get:v=>v?{pos:'آخر وحدة متقنة',u:'../prog/'}:null},
 {k:'mufassir',name:'مِفسّر',ic:'🔍',get:v=>v?{pos:'آخر آية مفسّرة',u:'../mufassir/'}:null},
 {k:'mikhtim',name:'مِختِم',ic:'📗',get:v=>v?{pos:'تقدم الكتاب',u:'../kutub/'}:null},
 {k:'mitla3',name:'مِطلَع — الإنجليزية',ic:'🗺️',get:v=>v&&v.idx!==undefined?{pos:'بطاقة '+arN((v.idx||0)+1),u:'../english/'}:null},
 {k:'midraj',name:'مِدرَج — مستواك',ic:'⬆️',get:v=>v?{pos:'مستواك الحالي',u:'../midraj/'}:null},
];
probes.forEach(p=>{
 const v=LS(p.k,null);if(v===null)return;
 const got=p.get(v);if(got)R.push({name:p.name,ic:p.ic,pos:got.pos,u:got.u,at:v.at||''});
});
// مواعيد ميعوّد المستحقة اليوم = مواضع مؤجلة تعود إليها
const q=LS('mi3wad_q',{});
const dueToday=Object.values(q).filter(r=>{
 if(!r.at)return false;const d=new Date(r.at);d.setDate(d.getDate()+[1,3,7,14,30][Math.min(r.idx||0,4)]);
 return d.toISOString().slice(0,10)<=new Date().toISOString().slice(0,10);
}).length;
if(dueToday)R.unshift({name:'مِعوّد — مراجعات مستحقة',ic:'🔁',pos:arN(dueToday)+' عناصر تنتظرك',u:'../mi3wad/',at:''});
$('#stats').innerHTML='<span class="stat">مواضع مفتوحة: <b>'+arN(R.length)+'</b></span>';
$('#list').innerHTML=R.length?R.map(r=>'<div class="res"><div class="ic">'+r.ic+'</div><div class="bd"><div class="nm">'+esc(r.name)+'</div><div class="pos">'+esc(r.pos)+'</div></div><a class="go" href="'+r.u+'">أكمل ←</a></div>').join(''):'<div class="muted" style="margin-top:12px">لا مواضع محفوظة بعد — ابدأ بأي أداة وستلتقطها هنا.</div>';
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3taf" data-title="مِعتَف"></script>
</body>
</html>
