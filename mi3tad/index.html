<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَد — عدّادك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.cnt{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 16px;margin-top:9px;display:flex;gap:12px;align-items:center}
.cnt .v{font-size:24px;font-weight:700;color:var(--acc);min-width:56px;text-align:center;font-family:var(--font-ui)}
.cnt .bd{flex:1}
.cnt .nm{font-family:var(--font-ar);font-size:13.5px}
.cnt .tgt{font-size:10.5px;color:var(--dim);margin-top:2px}
.cnt .pm{display:flex;gap:7px}
.pmb{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:17px;cursor:pointer}
.pmb.hit{background:var(--acc);color:#14140f;font-weight:700;border:0}
.bar{height:4px;background:var(--card2);border-radius:2px;margin-top:7px;overflow:hidden}
.f{height:100%;background:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَد <span class="muted">— عدّادك</span></h2>
<div class="muted">عدّادات مخصصة لأي شيء يُحسب: ماء، صفحات، خطوات — بأهداف يومية.</div>
<div class="card"><div class="t">عداد جديد</div>
<div style="display:flex;gap:8px"><input id="nm" placeholder="أكواب ماء، صفحات قراءة…" style="flex:1"><input id="tg" type="number" placeholder="الهدف" style="width:80px" min="1"></div>
<button class="btn" id="add" style="margin-top:9px">أضف</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let D=LS('mi3tad',{date:today(),cs:[]});
if(D.date!==today()){D.cs.forEach(c=>c.v=0);D.date=today();SV('mi3tad',D)}
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 D.cs.push({n,t:+$('#tg').value||8,v:0});
 SV('mi3tad',D);$('#nm').value='';render();
};
function render(){
 const done=D.cs.filter(c=>c.t&&c.v>=c.t).length;
 $('#stats').innerHTML='<span class="stat">عدادات: <b>'+arN(D.cs.length)+'</b></span>'+
 '<span class="stat">أهداف مكتملة: <b>'+arN(done)+'</b></span>';
 $('#list').innerHTML=D.cs.map((c,i)=>{
  const pct=c.t?Math.min(100,c.v/c.t*100):0,hit=c.t&&c.v>=c.t;
  return '<div class="cnt"><div class="pm">'+
  '<button class="pmb" data-i="'+i+'" data-d="-1">−</button>'+
  '<button class="pmb'+(hit?' hit':'')+'" data-i="'+i+'" data-d="1">+</button></div>'+
  '<div class="v">'+arN(c.v)+'</div><div class="bd"><div class="nm">'+esc(c.n)+'</div>'+
  '<div class="tgt">'+(c.t?'الهدف: '+arN(c.t)+(hit?' ✓':''):'بلا هدف')+'</div>'+
  (c.t?'<div class="bar"><div class="f" style="width:'+pct+'%"></div></div>':'')+'</div>'+
  '<button class="pmb" data-x="'+i+'" style="font-size:13px;color:var(--acc2)">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا عدادات — أضف أولها.</div>';
}
$('#list').onclick=e=>{
 const p=e.target.closest('[data-i]');
 if(p){const c=D.cs[+p.dataset.i];c.v=Math.max(0,c.v+ +p.dataset.d);SV('mi3tad',D);render();return}
 const x=e.target.closest('[data-x]');
 if(x&&confirm('حذف العداد؟')){D.cs.splice(+x.dataset.x,1);SV('mi3tad',D);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3tad" data-title="مِعتَد"></script>
</body>
</html>
