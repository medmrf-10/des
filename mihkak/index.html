<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحكَك — حَكَّ تعلّمك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.dom{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 11px;font-size:11px;color:var(--acc);margin-bottom:8px}
.q{font-family:var(--font-ar);font-size:16px;line-height:2.2;margin-top:8px}
.opts{display:grid;gap:7px;margin-top:12px}
.opt{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 15px;cursor:pointer;font-size:13px;text-align:right}
.opt:hover{border-color:var(--acc)}
.opt.correct{background:rgba(212,175,55,.15);border-color:var(--acc)}
.opt.wrong{background:rgba(224,128,128,.12);border-color:#e08080}
.opt:disabled{cursor:default;opacity:.85}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px;margin-top:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.muted{color:var(--dim);font-size:12px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحكَك <span class="muted">— اختبر نفسك من كل ميدان</span></h2>
<div class="muted">سؤال واحد من ميدان عشوائي — حَكَّ معرفتك لترى أين تقف.</div>
<div style="margin-top:10px"><span class="stat">أجبْتَ: <b id="tot">٠</b></span><span class="stat">صواب: <b id="cor">٠</b></span><span class="stat">الدقة: <b id="acc">—</b></span></div>
<div class="card"><div class="dom" id="dom">—</div>
<div class="q" id="q">—</div>
<div class="opts" id="opts"></div>
<div id="fb" style="margin-top:10px;font-size:12.5px"></div>
<button class="btn ghost" id="next" style="display:none">سؤال آخر</button></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G,U,M;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA'),laz('../fiqh_reader/masail.js','MASAIL')]).then(([g,u,m])=>{G=g;U=u;M=m;next()});
function mk(){
 const doms=['حديث','قرآن','فقه','لغة'];const d=doms[Math.floor(Math.random()*doms.length)];
 if(d==='حديث'&&G){
  const ks=Object.keys(G.g);const k=ks[Math.floor(Math.random()*ks.length)];const h=G.g[k];
  const rules=['صحيح','حسن','ضعيف','موضوع'].filter(x=>x!==h.h);
  const wrong=rules.slice(0,3);
  return{dom:'حديث — ما حكم هذا الحديث؟',q:h.t.slice(0,120)+'…',
   opts:[h.h,...wrong].sort(()=>Math.random()-0.5),a:h.h,
   fb:'الحكم: '+h.h+' — '+G.meta.books[k.split(':')[0]]+' '+k.split(':')[1]};
 }
 if(d==='قرآن'&&U){
  const ks=Object.keys(U.sim);const k=ks[Math.floor(Math.random()*ks.length)];
  const [s,a]=k.split(':');
  const names=Object.values(U.names);
  const wrong=names.filter(n=>n!==U.names[s]).sort(()=>Math.random()-0.5).slice(0,3);
  return{dom:'قرآن — في أي سورة هذه الآية؟',q:'«'+U.sim[k][2].slice(0,110)+'»',
   opts:[U.names[s],...wrong].sort(()=>Math.random()-0.5),a:U.names[s],
   fb:'الآية في '+U.names[s]+' '+a};
 }
 if(d==='فقه'&&M){
  const bs=Object.values(M).filter(b=>b.u.length>=4);
  const b=bs[Math.floor(Math.random()*bs.length)];
  const u=b.u[Math.floor(Math.random()*b.u.length)];
  const MN={h:'الحنفية',m:'المالكية',s:'الشافعية',b:'الحنابلة',o:'أخرى'};
  const wrong=Object.values(MN).filter(x=>x!==MN[b.m]).sort(()=>Math.random()-0.5).slice(0,3);
  return{dom:'فقه — لأي مذهب ينتمي «'+b.n+'»؟',q:'المسألة: '+esc(u.t.slice(0,80)),
   opts:[MN[b.m],...wrong].sort(()=>Math.random()-0.5),a:MN[b.m],
   fb:'«'+b.n+'» من كتب '+MN[b.m]+' — '+b.a};
 }
 // لغة: أعرب الكلمة؟ أو تعديل: ما جمع/مفرد كلمة عشوائية من الحديث
 if(G){
  const ks=Object.keys(G.g);const k=ks[Math.floor(Math.random()*ks.length)];
  const ws=G.g[k].t.split(/\s+/).filter(w=>w.length>=5);
  const w=ws[Math.floor(Math.random()*ws.length)]||'كتاب';
  return{dom:'لغة — كم حرفاً في الكلمة المُبرزة؟',q:'«'+G.g[k].t.split(/\s+/).map(x=>x===w?'<b style="color:var(--acc)">'+esc(x)+'</b>':esc(x)).join(' ').slice(0,180)+'…»',
   opts:[String(w.replace(/[^\u0621-\u064A]/g,'').length),String(w.length+1),String(Math.max(3,w.length-1)),String(w.length+2)].sort(()=>Math.random()-0.5),
   a:String(w.replace(/[^\u0621-\u064A]/g,'').length),
   fb:'الكلمة «'+w+'» — '+w.replace(/[^\u0621-\u064A]/g,'').length+' حرفًا (بالتشكيل '+w.length+')'};
 }
 return null;
}
let curQ=null;
function next(){
 const q=mk();if(!q)return;
 curQ=q;
 $('#dom').textContent=q.dom;
 $('#q').innerHTML=q.q;
 $('#opts').innerHTML=q.opts.map(o=>'<button class="opt">'+esc(o)+'</button>').join('');
 $('#fb').innerHTML='';$('#next').style.display='none';
 document.querySelectorAll('#opts .opt').forEach(b=>{
  b.onclick=()=>{
   const h=LS('mihkak',{n:0,c:0});
   h.n++;
   document.querySelectorAll('#opts .opt').forEach(x=>{
    x.disabled=true;
    if(x.textContent===q.a){x.classList.add('correct');if(x===b)h.c++}
    else if(x===b)x.classList.add('wrong');
   });
   SV('mihkak',h);
   $('#fb').innerHTML=(b.textContent===q.a?'<b style="color:var(--acc)">✓ أصبت — </b>':'<b style="color:#e08080">✗ أخطأت — </b>')+esc(q.fb);
   $('#next').style.display='';
   render();
  };
 });
}
$('#next').onclick=next;
function render(){
 const h=LS('mihkak',{n:0,c:0});
 $('#tot').textContent=arN(h.n);$('#cor').textContent=arN(h.c);
 $('#acc').textContent=h.n?Math.round(h.c/h.n*100)+'٪':'—';
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mihkak" data-title="مِحكَك"></script>
</body>
</html>
