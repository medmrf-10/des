<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مِعكَر — مزاجك اليومي</title>
<link rel="stylesheet" href="../shared/theme.css"><style>
body{max-width:560px;margin:0 auto;padding:22px 14px 60px}
h1{color:var(--acc);font-size:1.3rem;text-align:center}
.sub{color:var(--dim);font-size:.8rem;text-align:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.moods{display:flex;justify-content:space-between;margin:12px 0}
.moods button{background:none;border:1px solid var(--border);border-radius:10px;font-size:1.5rem;width:52px;height:52px;cursor:pointer;transition:.15s}
.moods button.on{border-color:var(--acc);background:var(--card2);transform:scale(1.1)}
input[type=text]{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:inherit;padding:10px;font-size:.82rem;margin:8px 0}
button.go{width:100%;background:linear-gradient(135deg,#c9a24b,#8a6a2f);border:none;border-radius:10px;color:#0b0f1a;font-family:inherit;font-weight:700;padding:11px;cursor:pointer}
.entry{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border)}
.entry .m{font-size:1.3rem}
.entry .d{font-size:.62rem;color:var(--dim);width:78px;flex-shrink:0}
.entry .w{flex:1;font-size:.8rem}
.entry .b{font-size:.66rem;color:var(--dim)}
.trend{display:flex;gap:3px;align-items:flex-end;height:60px;justify-content:center;margin:10px 0}
.trend i{width:14px;border-radius:3px 3px 0 0;background:var(--card2)}
</style></head><body>
<h1>مِعكَر</h1><div class="sub">مزاجك اليوم — درجة وسبب. النمط يظهر بعد أسبوع</div>
<div class="card">
<div class="moods" id="mm">
<button data-m="1">😞</button><button data-m="2">😕</button><button data-m="3">😐</button><button data-m="4">🙂</button><button data-m="5">😄</button>
</div>
<input type="text" id="why" placeholder="ما سبب مزاجك؟ (سطر واحد)">
<button class="go" id="save">سجّل مزاج اليوم</button>
<div id="today" style="font-size:.72rem;color:var(--dim);text-align:center;margin-top:8px"></div>
</div>
<div class="card"><b style="color:var(--acc);font-size:.82rem">اتجاه ١٤ يوماً</b><div class="trend" id="trend"></div></div>
<div id="hist"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='mi3kar_v1';const D=()=>JSON.parse(localStorage.getItem(K)||'{}');const S=o=>localStorage.setItem(K,JSON.stringify(o));
const EM=['😞','😕','😐','🙂','😄'];let sel=0;
document.addEventListener('click',e=>{
 const b=e.target.closest('#mm button');if(b){sel=+b.dataset.m;[...document.querySelectorAll('#mm button')].forEach(x=>x.classList.toggle('on',+x.dataset.m===sel));return}
 if(e.target.id==='save'){if(!sel)return;const d=D();const day=new Date().toISOString().slice(0,10);d[day]={m:sel,w:$('why').value.trim()};S(d);$('why').value='';sel=0;[...document.querySelectorAll('#mm button')].forEach(x=>x.classList.remove('on'));render()}
});
function render(){
 const d=D(),day=new Date().toISOString().slice(0,10);
 if(d[day])$('today').textContent='اليوم مسجّل: '+EM[d[day].m-1]+(d[day].w?' — '+d[day].w:'');
 const days=Object.keys(d).sort().slice(-14);
 $('trend').innerHTML=days.map(k=>{const m=d[k].m;return `<i style="height:${m*11}px;background:${m>=4?'var(--ok)':m===3?'var(--acc)':'#e07070'}" title="${k}: ${EM[m-1]}"></i>`}).join('')||'<span class="sub">لا بيانات بعد</span>';
 $('hist').innerHTML=days.slice().reverse().map(k=>`<div class="entry"><span class="m">${EM[d[k].m-1]}</span><span class="d">${k.slice(5)}</span><span class="w">${esc(d[k].w)}</span></div>`).join('');
 const reasons={};Object.values(d).forEach(x=>{if(x.w){const w=x.w.trim().split(' ').slice(0,3).join(' ');reasons[w]=(reasons[w]||0)+(x.m-3)}});
 const top=Object.entries(reasons).sort((a,b)=>a[1]-b[1]);
 if(top.length){const worst=top[0],best=top[top.length-1];
  $('hist').innerHTML+=`<div class="card" style="margin-top:10px;font-size:.74rem;color:var(--dim)">أكثر ما يُعكّرك: <b style="color:#e07070">${esc(worst[0])}</b> · أكثر ما يُبهجك: <b style="color:var(--ok)">${esc(best[0])}</b></div>`}
}
render();
</script></body></html>
