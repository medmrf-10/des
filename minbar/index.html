<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>منبر — عرض التدريس المباشر</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
html,body{overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.pick{max-width:700px;margin:0 auto;padding:24px 14px}
.src{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sr{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:14px}
.sr.on{border-color:var(--acc);color:var(--acc2)}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:11px 14px;font-family:var(--font-ar);font-size:15px;margin-top:10px}
body.stage{background:#000}
.stage .pick{display:none}
#stage{display:none;flex:1;flex-direction:column}
body.stage #stage{display:flex}
#big{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:var(--font-ar);line-height:2.1;cursor:pointer}
#big .x{max-width:1000px}
#sub{position:fixed;bottom:44px;right:0;left:0;text-align:center;color:#666;font-size:13px}
#bar{position:fixed;bottom:0;right:0;left:0;height:3px;background:var(--acc);transition:width .3s}
#hud{position:fixed;top:8px;right:12px;color:#555;font-size:12px;display:flex;gap:14px}
#hud span{cursor:pointer}
#prog{position:fixed;top:8px;left:14px;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="pick">
 <h2 style="font-family:var(--font-ar);margin:8px 0">منبر</h2>
 <p class="muted">عرض التدريس المباشر: اختر المادة تظهر نصاً كبيراً على الشاشة — للحلقة والدرس. الأسهم أو الضغط للتنقل، F لتكبير الخط، Esc للخروج.</p>
 <div class="src">
  <button class="sr on" data-s="adhkar">أذكار (285)</button>
  <button class="sr" data-s="nawawi">الأربعون (42)</button>
  <button class="sr" data-s="muta">متشابهات (1505)</button>
  <button class="sr" data-s="atoms">قواعد العقيدة (185)</button>
  <button class="sr" data-s="free">نص حر</button>
 </div>
 <input class="inp" id="rng" placeholder="النطاق: كل العناصر، أو مثلاً 1-20">
 <textarea class="inp" id="free" rows="5" style="display:none" placeholder="الصق نصك — كل سطر شريحة"></textarea>
 <button class="btn" id="go" style="margin-top:12px">ابدأ العرض</button>
</div>
<div id="stage">
 <div id="hud"><span id="prev">◀ السابق</span><span id="next">التالي ▶</span><span id="fontup">A+</span><span id="fontdn">A−</span><span id="exit">✕ خروج</span></div>
 <div id="prog"></div>
 <div id="big"><div class="x" id="bx"></div></div>
 <div id="sub"></div>
 <div id="bar" style="width:0"></div>
</div>
<script src="../hadith/adhkar.js"></script>
<script src="../hadith/nawawi.js"></script>
<script src="../wahy/mutashabih.js"></script>
<script src="../madrasati/atoms.js"></script>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let slides=[],cur=0,fs=34;
$('.src').onclick=e=>{const b=e.target.closest('.sr');if(!b)return;
 document.querySelectorAll('.sr').forEach(x=>x.classList.toggle('on',x===b));
 $('#free').style.display=b.dataset.s==='free'?'':'none';$('#rng').style.display=b.dataset.s==='free'?'none':''};
$('#go').onclick=()=>{
 const s=document.querySelector('.sr.on').dataset.s;slides=[];
 if(s==='adhkar')slides=ADHKAR.map(g=>({x:(g.t||'')+' '+(g.h||''),sub:'حديث '+g.g}));
 else if(s==='nawawi')slides=NAWAWI.map(n=>({x:n.an||n.n||'',sub:'حديث '+n.n}));
 else if(s==='muta'){for(const k in MUTA.sim){const v=MUTA.sim[k];slides.push({x:v[2],sub:MUTA.names[v[0]]+' '+v[1]})}}
 else if(s==='atoms'){for(const c in ATOMS){const b=ATOMS[c];for(const k in b.atoms){const a=b.atoms[k];slides.push({x:(a.t?a.t+' — ':'')+(a.q||''),sub:b.name})}}}
 else slides=$('#free').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({x,sub:''}));
 const r=($('#rng').value||'').trim();
 if(s!=='free'&&/^\d+-\d+$/.test(r)){const[a,b]=r.split('-').map(Number);slides=slides.slice(a-1,b)}
 if(!slides.length)return alert('لا شرائح');
 cur=0;document.body.classList.add('stage');show()};
function show(){
 const s=slides[cur];if(!s)return;
 $('#bx').innerHTML=esc(s.x);$('#bx').style.fontSize=fs+'px';
 $('#sub').textContent=s.sub||'';
 $('#prog').textContent=(cur+1).toLocaleString('ar-EG')+' / '+slides.length.toLocaleString('ar-EG');
 $('#bar').style.width=((cur+1)/slides.length*100)+'%'}
const go=d=>{cur=Math.min(slides.length-1,Math.max(0,cur+d));show()};
$('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
$('#big').onclick=()=>go(1);
$('#fontup').onclick=()=>{fs=Math.min(90,fs+4);show()};
$('#fontdn').onclick=()=>{fs=Math.max(16,fs-4);show()};
$('#exit').onclick=()=>document.body.classList.remove('stage');
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('stage'))return;
 if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown')go(1);
 if(e.key==='ArrowRight'||e.key==='PageUp')go(-1);
 if(e.key==='Escape')document.body.classList.remove('stage');
 if(e.key==='f'||e.key==='F'){fs=Math.min(90,fs+4);show()}});
</script>
<script src="../shared/feedback.js" data-pid="minbar" data-title="منبر"></script>
</body>
</html>
