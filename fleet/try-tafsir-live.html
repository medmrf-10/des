<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>جرّب: التفسير الكامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14; --card:#131a22; --card2:#1a2330; --border:#28323f; --txt:#eef3f8; --dim:#93a1b3; --acc:#c9a24b; --acc2:#e8c97a}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html,body{max-width:100vw; overflow-x:hidden}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh}
.wrap{max-width:640px; margin:0 auto; padding:20px 14px 60px}
a.back{color:var(--acc2); font-size:.8rem; text-decoration:none}
h1{font-size:1.3rem; font-weight:700; color:var(--acc2); margin:12px 0 4px}
.sub{color:var(--dim); font-size:.8rem; margin-bottom:16px; line-height:1.7}
.panel{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px}
.row{display:flex; gap:8px}
select,input{flex:1; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--txt); font-family:inherit; font-size:.88rem; padding:12px}
select:focus,input:focus{outline:none; border-color:var(--acc)}
select{width:100%; margin-bottom:8px}
button.go{width:100%; background:linear-gradient(135deg,var(--acc),var(--acc2)); border:none; border-radius:10px; color:#0b0f14; font-family:inherit; font-size:.9rem; font-weight:700; padding:13px; cursor:pointer; margin-top:8px}
.status{font-size:.74rem; color:var(--dim); min-height:1.2em; margin:6px 2px}
.status.err{color:#ff7d7d}
.res{background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:14px; display:none}
.res.show{display:block}
.res .ayah{color:var(--acc2); font-size:1rem; line-height:2.1; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:10px}
.res .meta{font-size:.66rem; color:var(--dim); margin-bottom:8px}
.res .txt{font-size:.92rem; line-height:2; white-space:pre-wrap; overflow-wrap:break-word}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">→ رجوع للبوابة</a>
  <h1>التفسير الكامل</h1>
  <div class="sub">الخدمة الكاملة: ٥٧ تفسيراً عربياً × القرآن كله (١١٤ سورة × كل آياتها) — تُجلب حيّاً من قاعدة بيانات التفسير المفتوحة عند طلبك. اختر التفسير والسورة والآية فتقرأ النص فوراً.</div>
  <div class="panel">
    <select id="ed"><option value="">… يحمّل قائمة التفاسير</option></select>
    <div class="row">
      <select id="sur"><option value="">… السورة</option></select>
      <input id="ay" type="number" inputmode="numeric" min="1" placeholder="رقم الآية" style="max-width:34%">
    </div>
    <button class="go" id="go">اعرض التفسير</button>
    <div class="status" id="st"></div>
  </div>
  <div class="res" id="res">
    <div class="meta" id="meta"></div>
    <div class="ayah" id="ayah"></div>
    <div class="txt" id="txt"></div>
  </div>
</div>
<script>
const CDN='https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir';
const Q='https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/quran.json';
const st=document.getElementById('st');
let EDS=[],QS=null;
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
Promise.all([
  fetch(CDN+'/editions.json').then(r=>r.json()),
  fetch(Q).then(r=>r.json())
]).then(([eds,q])=>{
  EDS=eds.filter(e=>e.language_name==='arabic');
  QS=q;
  document.getElementById('ed').innerHTML=EDS.map(e=>`<option value="${e.slug}">${e.name} — ${e.author_name||''}</option>`).join('');
  document.getElementById('ed').value='ar-tafsir-ibn-kathir';
  document.getElementById('sur').innerHTML=QS.map(s=>`<option value="${s.id}">${s.id}. ${s.name}</option>`).join('');
  document.getElementById('sur').value=112;
  st.textContent=`${EDS.length} تفسيراً عربياً × ١١٤ سورة — جاهز`;
}).catch(()=>{st.textContent='تعذر الاتصال بقاعدة التفسير';st.classList.add('err')});
document.getElementById('go').onclick=async()=>{
  const ed=document.getElementById('ed').value,su=+document.getElementById('sur').value,ay=+document.getElementById('ay').value;
  if(!ed||!su||!ay){st.textContent='اختر التفسير والسورة والآية';st.classList.add('err');return}
  const S=QS[su-1];
  if(ay>S.total_verses){st.textContent=`السورة فيها ${S.total_verses} آية فقط`;st.classList.add('err');return}
  st.classList.remove('err');st.textContent='…';
  try{
    const r=await fetch(`${CDN}/${ed}/${su}/${ay}.json`);
    if(!r.ok)throw 0;
    const d=await r.json();
    const edn=EDS.find(e=>e.slug===ed);
    st.textContent='';
    document.getElementById('meta').textContent=`${edn?edn.name:ed} — سورة ${S.name} (${su}) : آية ${ay}`;
    document.getElementById('ayah').textContent=S.verses[ay-1].text+' ﴿'+ay+'﴾';
    document.getElementById('txt').textContent=d.text||'—';
    document.getElementById('res').classList.add('show');
  }catch(e){st.textContent='لا يوجد نص لهذه الآية في هذا التفسير';st.classList.add('err')}
};
</script>
</body>
</html>
