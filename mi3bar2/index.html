<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعبَر — جسر الحوار</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:46px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.cv{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.cv .who{font-family:var(--font-ar);font-size:13.5px;color:var(--acc)}
.cv .f{font-size:11px;margin-top:5px;color:var(--dim)}
.cv .f b{color:var(--txt)}
.cv.done{opacity:.5}
.cv.done .who{text-decoration:line-through}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعبَر <span class="muted">— جسر الحوار</span></h2>
<div class="muted">محادثة صعبة مؤجلة؟ جهّزها: مع من، ماذا تقول، وما النتيجة التي تريد — ثم اعبر.</div>
<div class="card"><div class="t">محادثة جديدة</div>
<input id="w" placeholder="مع من؟">
<textarea id="t" placeholder="ماذا تريد أن تقول (بصدق وبلا جرح)؟"></textarea>
<textarea id="o" placeholder="النتيجة المرجوة"></textarea>
<input id="p" placeholder="الجملة الافتتاحية (كيف تبدأ؟)">
<button class="btn" id="ad" style="margin-top:9px">جهّز العبور</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let C=LS('mi3bar2',[]);
$('#ad').onclick=()=>{
 const w=$('#w').value.trim();if(!w)return;
 C.unshift({w,t:$('#t').value.trim(),o:$('#o').value.trim(),p:$('#p').value.trim(),at:Date.now(),st:'pending'});
 SV('mi3bar2',C);$('#w').value=$('#t').value=$('#o').value=$('#p').value='';render();
};
const daysSince=t=>Math.floor((Date.now()-t)/864e5);
function render(){
 const pend=C.filter(x=>x.st==='pending'),done=C.filter(x=>x.st==='done');
 const old=pend.filter(x=>daysSince(x.at)>=7).length;
 $('#stats').innerHTML='<span class="stat">بانتظار العبور: <b style="color:var(--acc)">'+arN(pend.length)+'</b></span>'+
 '<span class="stat">معبورة: <b style="color:var(--ok)">'+arN(done.length)+'</b></span>'+
 (old?'<span class="stat">مؤجلة +٧ أيام: <b style="color:var(--acc2)">'+arN(old)+'</b></span>':'');
 $('#list').innerHTML=C.slice(0,12).map((x,i)=>{
  const gi=C.indexOf(x);
  return '<div class="cv'+(x.st==='done'?' done':'')+'"><div class="who">'+esc(x.w)+(x.st==='pending'&&daysSince(x.at)>=7?' <span style="font-size:10px;color:var(--acc2)">(مؤجلة '+arN(daysSince(x.at))+' يوم)</span>':'')+'</div>'+
  (x.t?'<div class="f">تقول: <b>'+esc(x.t)+'</b></div>':'')+
  (x.o?'<div class="f">تريد: <b>'+esc(x.o)+'</b></div>':'')+
  (x.p?'<div class="f">تبدأ بـ: <b style="color:var(--acc)">"'+esc(x.p)+'"</b></div>':'')+
  '<div style="display:flex;gap:6px;margin-top:8px">'+
  (x.st==='pending'?'<button class="btn ghost" data-x="'+gi+'" style="color:var(--ok);font-size:10px">🌉 عبرتها</button>':'')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا محادثات مجهزة.</div>';
}
$('#list').onclick=e=>{
 const x=e.target.closest('[data-x]'),d=e.target.closest('[data-d]');
 if(x){C[+x.dataset.x].st='done';SV('mi3bar2',C);render();return}
 if(d&&confirm('احذف؟')){C.splice(+d.dataset.d,1);SV('mi3bar2',C);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3bar2" data-title="مِعبَر"></script>
</body>
</html>
