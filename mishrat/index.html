<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشرَط — إذا… فـ</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.rule{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-top:9px}
.rule .r{font-family:var(--font-ar);font-size:14px;line-height:1.8}
.rule .r b{color:var(--acc)}
.rule .meta{font-size:11px;color:var(--dim);margin-top:7px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.rule .hit{color:var(--ok)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشرَط <span class="muted">— إذا… فـ</span></h2>
<div class="muted">نوايا التنفيذ: «إذا حدث كذا فعلت كذا» — أثبت تقنية لبناء السلوك. علّم ما طبّقت اليوم.</div>
<div class="card"><div class="t">قاعدة جديدة</div>
<div style="display:flex;gap:8px;align-items:center"><span style="color:var(--acc);font-weight:700">إذا</span><input id="i" placeholder="أتأخر عن الفجر"></div>
<div style="display:flex;gap:8px;align-items:center;margin-top:7px"><span style="color:var(--acc);font-weight:700">فـ</span><input id="t" placeholder="أصلي قبل أي شيء آخر"></div>
<button class="btn" id="add" style="margin-top:9px">أضف القاعدة</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let R=LS('mishrat',{rules:[],log:{}});
$('#add').onclick=()=>{
 const i=$('#i').value.trim(),t=$('#t').value.trim();if(!i||!t)return;
 R.rules.unshift({i,t});
 SV('mishrat',R);$('#i').value='';$('#t').value='';render();
};
const log=R.log[today()]||{};
function render(){
 const applied=Object.keys(log).length;
 $('#stats').innerHTML='<span class="stat">قواعد: <b>'+arN(R.rules.length)+'</b></span>'+
 '<span class="stat">طبّقت اليوم: <b>'+arN(applied)+'</b></span>'+
 '<span class="stat">أيام التطبيق: <b>'+arN(Object.keys(R.log).length)+'</b></span>';
 $('#list').innerHTML=R.rules.map((r,i)=>{
  const hit=log[i];
  return '<div class="rule"><div class="r">إذا <b>'+esc(r.i)+'</b> فـ <b>'+esc(r.t)+'</b></div>'+
  '<div class="meta">'+(hit?'<span class="hit">✓ طبّقتها اليوم</span>':'<button class="btn ghost" data-i="'+i+'">طبّقتها اليوم</button>')+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2)">حذف</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا قواعد — مثال: «إذا تسوّلت نفسي للمنصات فأقرأ صفحة».</div>';
}
$('#list').onclick=e=>{
 const b=e.target.closest('[data-i]');
 if(b){R.log[today()]=R.log[today()]||{};R.log[today()][+b.dataset.i]=true;SV('mishrat',R);render();return}
 const d=e.target.closest('[data-d]');
 if(d&&confirm('حذف القاعدة؟')){R.rules.splice(+d.dataset.d,1);SV('mishrat',R);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mishrat" data-title="مِشرَط"></script>
</body>
</html>
