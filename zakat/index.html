<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>زَكاة — احسب نصيبك</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🧮 زَكاة</h1><p class="tagline">أدخل أموالك، يحسب لك النصاب والواجب — بلا مشاركة بيانات</p></header>
<div class="wrap">
 <div class="card"><h3>أموالك القائمة</h3>
  <div class="row"><label>نقد / حسابات بنكية</label><input id="cash" type="number" min="0" placeholder="0"></div>
  <div class="row"><label>ذهب (غرام × سعر الغرام)</label><input id="gold" type="number" min="0" placeholder="0"></div>
  <div class="row"><label>فضة (غرام × سعر الغرام)</label><input id="silver" type="number" min="0" placeholder="0"></div>
  <div class="row"><label>استثمارات / أسهم / عروض تجارة</label><input id="inv" type="number" min="0" placeholder="0"></div>
  <div class="row"><label>ديون لك تُرجى</label><input id="debt" type="number" min="0" placeholder="0"></div>
  <div class="row"><label>ديون عليك تستحق قريباً (−)</label><input id="owe" type="number" min="0" placeholder="0"></div>
 </div>
 <div class="card"><h3>النصاب</h3>
  <div class="seg"><button class="sg on" data-n="gold">بالذهب (٨٥غ)</button><button class="sg" data-n="silver">بالفضة (٥٩٥غ)</button></div>
  <div class="row"><label>سعر الغرام اليوم (دج)</label><input id="price" type="number" min="0" placeholder="0"></div>
 </div>
 <div class="card res">
  <div id="r" class="r">أدخل الأرقام…</div>
 </div>
 <div class="card tip">الزكاة = ٢٫٥٪ من المال البالغ للنصاب والحال عليه الحول. استشر مفتيك في التفاصيل — هذه حاسبة تساعدك لا تفتي.</div>
</div>
<script>
const $=q=>document.querySelector(q);
let MODE='gold';
const ids=['cash','gold','silver','inv','debt','owe','price'];
ids.forEach(id=>$(`#${id}`).addEventListener('input',calc));
document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));b.classList.add('on');MODE=b.dataset.n;calc()});
function calc(){
 const v=id=>+($(`#${id}`).value||0);
 const total=v('cash')+v('gold')+v('silver')+v('inv')+v('debt')-v('owe');
 const nisab=(MODE==='gold'?85:595)*v('price');
 const zakat=total*0.025;
 const fmt=n=>Math.round(n).toLocaleString('ar-EG');
 if(!v('price')||!total){$('#r').innerHTML='أدخل الأرقام…';return}
 const pass=total>=nisab;
 $('#r').innerHTML=`
  <div class="rl"><span>مالك الصافي</span><b>${fmt(total)} دج</b></div>
  <div class="rl"><span>النصاب (${MODE==='gold'?'٨٥غ ذهب':'٥٩٥غ فضة'})</span><b>${fmt(nisab)} دج</b></div>
  <div class="rl big ${pass?'pass':'fail'}"><span>${pass?'الزكاة الواجبة (٢٫٥٪)':'ما دون النصاب — لا زكاة'}</span><b>${pass?fmt(zakat)+' دج':'—'}</b></div>
  ${pass?'<div class="rl note">على شرط حولان الحول على مالك</div>':''}`;
}
</script>
<script src="../shared/palette.js"></script><script src="../shared/feedback.js"></script>
</body></html>
