<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>شبكة — كوكبة مفاهيم العقيدة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
html,body{overflow-x:hidden}
body{max-width:960px;margin:0 auto;padding:14px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:12px 16px;font-family:var(--font-ar);font-size:16px}
#center{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:14px;padding:16px;margin:14px 0;text-align:center}
#center .ct{font-family:var(--font-ar);font-size:21px;color:var(--acc2)}
#center .cs{font-size:12px;color:var(--dim);margin-top:4px}
.occs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.occ{font-size:11px;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:3px 11px;color:var(--dim)}
.occ b{color:var(--acc2);font-weight:600}
.node{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 13px;margin:4px;font-family:var(--font-ar);font-size:14px;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--acc);transform:translateY(-1px)}
.node .w{font-size:10px;color:var(--acc2)}
.sug{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 14px;margin:4px 0;cursor:pointer;font-family:var(--font-ar);font-size:14px}
.muted{color:var(--dim);font-size:12px}
#hist{position:fixed;top:8px;left:10px;font-size:11px;color:var(--dim)}
#hist span{cursor:pointer;margin-left:6px}
</style>
</head>
<body>
<div id="hist"></div>
<h2 style="font-family:var(--font-ar);margin:6px 0">شبكة <span class="muted" style="font-weight:400;font-size:12px">— كوكبة مفاهيم العقيدة والتصوف</span></h2>
<div class="muted">7,332 مفهوماً من 9,363 وحدة عقدية — اختر مفهوماً ترى ما يرتبط به عبر الأبواب المشتركة، وتجوّل بين المفاهيم.</div>
<input class="inp" id="q" placeholder="مفهوم… (الإيمان، القضاء، التوحيد، الولاية، الصوفية)" autocomplete="off" style="margin-top:10px">
<div id="sugs"></div>
<div id="center"></div>
<div id="links"></div>
<script src="../akida/terms.js"></script>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const T=TERMS.terms,KEYS=Object.keys(T);
let hist=[];
// فهرس: باب -> المفاهيم التي فيه (ب+باب)
const byCtx={};
for(const t of KEYS)for(const o of T[t]){const c=o.b+'|'+o.bab;(byCtx[c]=byCtx[c]||[]).push(t)}
function linksOf(t){
 const score={};
 for(const o of T[t]){const c=o.b+'|'+o.bab;
  for(const u of byCtx[c]||[]){if(u!==t)score[u]=(score[u]||0)+1}}
 return Object.entries(score).sort((a,b)=>b[1]-a[1]).slice(0,60)}
function show(t){
 hist.push(t);$('hist').innerHTML=hist.slice(-6).map((h,i)=>`<span data-h="${esc(h)}">${esc(h.slice(0,14))}</span>`).join(' ← ');
 const occ=T[t]||[];
 $('center').innerHTML=`<div class="ct">${esc(t)}</div><div class="cs">يظهر في ${occ.length.toLocaleString('ar-EG')} سياقاً</div>
 <div class="occs">${occ.slice(0,8).map(o=>`<span class="occ"><b>${esc(o.b)}</b> ${esc(o.bab)}</span>`).join('')}</div>`;
 const L=linksOf(t);
 $('links').innerHTML=L.length?L.map(([u,w])=>`<span class="node" data-t="${esc(u)}">${esc(u)} <span class="w">${w}</span></span>`).join('')
 :'<div class="muted" style="text-align:center;padding:20px">لا روابط مباشرة — جرّب مفهوماً أعمّ</div>';
 $('sugs').innerHTML='';window.scrollTo(0,0)}
let deb=null;
$('q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(()=>{
 const q=norm($('q').value.trim());
 if(q.length<2){$('sugs').innerHTML='';return}
 const hits=KEYS.filter(t=>norm(t).includes(q)).slice(0,8);
 $('sugs').innerHTML=hits.map(t=>`<button class="sug" data-t="${esc(t)}">${esc(t)}</button>`).join('')},200)});
document.addEventListener('click',e=>{
 const n=e.target.closest('.node,.sug,#hist span');
 if(n&&n.dataset&&(n.dataset.t||n.dataset.h)){show(n.dataset.t||n.dataset.h);$('q').value=''}});
const hq=decodeURIComponent((location.hash||'').slice(3));
if(location.hash.startsWith('#q=')&&hq){$('q').value=hq;show(hq)}else show('الإيمان إقرار وتصديق');
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="shabaka" data-title="شبكة"></script>
</body>
</html>
