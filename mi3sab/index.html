<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعصَب — حزمة اليوم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:620px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.row{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-top:7px;font-size:12.5px}
.row .ic{width:26px;text-align:center}
.row .n{min-width:90px;font-family:var(--font-ar)}
.row .v{flex:1;color:var(--dim);font-size:11.5px;text-align:left}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:18px;text-align:center;margin-top:11px;font-family:var(--font-ar)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعصَب <span class="muted">— حزمة اليوم</span></h2>
<div class="muted">قبل نومك: كل ما سجّلته اليوم في أدواتك — حزمة واحدة تراجعها.</div>
<div id="banner"></div>
<div id="stats"></div>
<div id="bundle"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const today=()=>new Date().toISOString().slice(0,10);
const T=today();
const R=[];
function add(ic,n,items,fmt){
 const t=(items||[]).filter(x=>{const d=x.d||x.at;const s=typeof d==='number'?new Date(d).toISOString().slice(0,10):String(d||'').slice(0,10);return s===T});
 if(t.length)R.push({ic,n,c:t.length,last:fmt?fmt(t[0]):''});
 return t.length;
}
add('🌱','أهداف',LS('mijdar',[]),x=>esc(x.t||x.n||''));
add('🅰️','بطاقات إنجليزية',LS('enbank',[]),x=>esc(x.w||x.en||''));
add('📝','اختبار ذاتي',LS('mi3raf_notes',[]),x=>esc(x.n||''));
add('📚','مطالعة',LS('mishrat',[]),x=>esc(x.b||''));
add('🎯','مسار',LS('mislak',[]),x=>esc(x.t||''));
add('💤','نوم',LS('min3as',[]),x=>arN(Math.round((x.dur||0)/60))+' سا');
add('😴','تنازل',LS('mith3an',[]),x=>esc(x.t||''));
add('🤲','جميل',LS('mi3yan',[]),x=>esc(x.w||''));
add('💰','كسب',LS('miksab',[]),x=>arN(x.v||0));
add('💸','نفقات',LS('mishraf2',[]),x=>arN(x.v||0));
add('🪞','تأمل',LS('mi3bar',[]),x=>esc(x.n||''));
add('⚔️','ضربة الغد',LS('mithrab',[]),x=>esc(x.t||''));
add('💭','أفكار مركونة',LS('mishrad',[]),x=>esc(x.t||''));
add('🎙️','مذكرات صوتية',LS('minshad',[]),x=>'');
add('👂','استماع',LS('minsat',[]),x=>esc(x.t||''));
add('❤️','لطافة',LS('mi3atr',[]),x=>esc(x.t||''));
const tot=R.reduce((s,x)=>s+x.c,0);
$('#banner').innerHTML='<div class="banner"><b style="font-size:16px;color:var(--acc)">'+arN(tot)+'</b> إدخالاً اليوم في '+arN(R.length)+' أداة</div>';
$('#stats').innerHTML=R.map(x=>'<span class="stat">'+x.ic+' '+x.n+': <b>'+arN(x.c)+'</b></span>').join('');
$('#bundle').innerHTML=R.map(x=>'<div class="row"><span class="ic">'+x.ic+'</span><span class="n">'+x.n+'</span>'+
'<span class="v">'+x.last+'</span><b style="color:var(--acc);font-size:11px">×'+arN(x.c)+'</b></div>').join('')||
'<div class="muted" style="margin-top:12px">لم تسجّل شيئاً اليوم في أي أداة — ابدأ الآن ولا تنتظر الغد.</div>';
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3sab" data-title="مِعصَب"></script>
</body>
</html>
