<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرقَب — ميزانية الانتباه</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.row{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 13px;margin-top:7px}
.row .nm{flex:1;font-family:var(--font-ar);font-size:13px}
.row .ct{font-size:11px;color:var(--dim);min-width:44px;text-align:left}
.row .bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:4px}
.row .bar i{display:block;height:100%}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرقَب <span class="muted">— ميزانية الانتباه</span></h2>
<div class="muted">انتباهك رأس مالك — أين ذهب اليوم؟ سجّل الدقائق الصادقة.</div>
<div class="card"><div class="t">أضف وجهة انتباه</div>
<input id="n" placeholder="المصدر (يوتيوب، القرآن، واتساب، كتاب…)">
<input id="m" type="number" placeholder="الدقائق">
<div style="display:flex;gap:8px;margin-top:8px">
<button class="btn ghost" id="k1" style="flex:1">بنّاء (+)</button>
<button class="btn ghost" id="k2" style="flex:1;border-color:var(--acc2)">مستنزِف (−)</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let A=LS('mirqab',[]),mode='build';
const today=()=>new Date().toISOString().slice(0,10);
$('#k1').onclick=()=>{mode='build';$('#k1').style.borderColor='var(--ok)';$('#k2').style.borderColor='var(--border)'};
$('#k2').onclick=()=>{mode='drain';$('#k2').style.borderColor='var(--acc2)';$('#k1').style.borderColor='var(--border)'};
$('#m').addEventListener('keydown',e=>{if(e.key==='Enter')save()});
$('#k2').insertAdjacentHTML('afterend','<button class="btn" id="ad" style="flex:1">سجّل</button>');
$('#ad').onclick=save;
function save(){
 const n=$('#n').value.trim(),m=+$('#m').value;if(!n||!m)return;
 const ex=A.find(x=>x.n===n&&x.k===mode);
 if(ex)ex.m+=m;else A.unshift({n,m,k:mode});
 SV('mirqab',A);$('#n').value=$('#m').value='';render();
}
function render(){
 const t=A.filter(x=>x.d===today()||!x.d);
 const b=t.filter(x=>x.k==='build').reduce((s,x)=>s+x.m,0);
 const d=t.filter(x=>x.k==='drain').reduce((s,x)=>s+x.m,0);
 const pc=b+d?Math.round(b/(b+d)*100):0;
 $('#stats').innerHTML='<span class="stat">بنّاء: <b style="color:var(--ok)">'+arN(b)+' د</b></span>'+
 '<span class="stat">مستنزِف: <b style="color:var(--acc2)">'+arN(d)+' د</b></span>'+
 '<span class="stat">صحّة الانتباه: <b>'+arN(pc)+'٪</b></span>';
 const mx=Math.max(1,...t.map(x=>x.m));
 $('#list').innerHTML=t.map((x,i)=>{
  const gi=A.indexOf(x);
  return '<div class="row" style="flex-wrap:wrap"><span class="nm">'+(x.k==='build'?'➕ ':'➖ ')+esc(x.n)+'</span>'+
  '<span class="ct">'+arN(x.m)+' د</span>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px;padding:4px 7px">✕</button>'+
  '<div class="bar" style="width:100%"><i style="width:'+(x.m/mx*100)+'%;background:'+(x.k==='build'?'var(--ok)':'var(--acc2)')+'"></i></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا سجل — أين ذهب انتباهك؟</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){A.splice(+d.dataset.d,1);SV('mirqab',A);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mirqab" data-title="مِرقَب"></script>
</body>
</html>
