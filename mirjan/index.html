<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مرجان — تدريب مواضع الاشتباه في الحفظ</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:820px;margin:0 auto;padding:14px}
.pick{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
select{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:14px}
.pair{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin:8px 0}
.pair .a{font-family:var(--font-ar);font-size:15px;line-height:2;color:var(--txt)}
.pair .a mark{background:rgba(224,90,90,.35);color:#fff;border-radius:3px;padding:0 2px}
.pair .loc{font-size:10.5px;color:var(--acc2);margin-top:5px}
.quiz{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:16px;margin:12px 0;display:none}
.quiz .q{font-family:var(--font-ar);font-size:16px;line-height:2}
.quiz .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.quiz .op{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:11px 14px;font-family:var(--font-ar);font-size:14px;text-align:right;cursor:pointer;line-height:1.9}
.quiz .op.ok{border-color:var(--ok);color:#6fbf87}
.quiz .op.no{border-color:#e07070;color:#e07070}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar)}
.muted{color:var(--dim);font-size:12px}
#score{font-family:var(--font-ar);font-size:18px;color:var(--acc2);text-align:center;padding:10px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مرجان <span class="muted" style="font-weight:400;font-size:12px">— تدريب مواضع الاشتباه</span></h2>
<div class="muted">أكثر ما يُفسد الحفظ: الآيات المتشابهات. اختر سورةً — تجد أزواجها المتشابهة مع أزميلاتها في كل المصحف، وتدرّب عليها بأسئلة اختيار.</div>
<div class="pick">
 <select id="sur"></select>
 <button class="btn" id="pairs">مواضع الاشتباه</button>
 <button class="btn" id="drill" style="background:var(--card2);color:var(--txt)">تدرّب</button>
</div>
<div class="quiz" id="quiz"></div>
<div id="score"></div>
<div id="list"></div>
<script src="../wahy/mutashabih.js"></script>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=MUTA.names||{};
for(let s=1;s<=114;s++)$('#sur').innerHTML+=`<option value="${s}">${s} — ${esc(N[s]||'سورة '+s)}</option>`;
function pairsOf(s){
 const out={};
 for(const k in MUTA.sim){const v=MUTA.sim[k];
  if(v[0]===+s)out[k]=[v[0],v[1],v[2]]}
 return out}
function norm(s){return (s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
$('#pairs').onclick=()=>{
 const s=+$('#sur').value;const prs=pairsOf(s);
 $('#quiz').style.display='none';$('#score').textContent='';
 $('#list').innerHTML='<div class="muted" style="margin:8px 0">'+Object.keys(prs).length.toLocaleString('ar-EG')+' موضع اشتباه في '+esc(N[s]||s)+' — الأحمر ما يتمايز به عن شبيهته:</div>'+
 Object.keys(prs).slice(0,40).map(k=>{
  const v=prs[k];const parts=(v[3]||[]).map(p=>{const pv=MUTA.sim[p[0]];return pv?esc(N[pv[0]]||pv[0])+' '+p[0]:p[0]}).join('، ');
  return `<div class="pair"><div class="a">${esc(v[2])}</div><div class="loc">${esc(N[v[0]]||v[0])} ${v[0]}:${v[1]}${parts?' — يُشتبه بـ: '+parts:''}</div></div>`}).join('')};
let QQ=[],qi=0,sc=0;
$('#drill').onclick=()=>{
 const s=+$('#sur').value;const prs=pairsOf(s);const ks=Object.keys(prs);
 if(ks.length<4){$('#list').innerHTML='<div class="muted">سورة قليلة التشابه — جرّب البقرة أو آل عمران</div>';return}
 QQ=[];ks.sort(()=>Math.random()-.5);
 for(let i=0;i<8;i++){
  const k=ks.splice(Math.floor(Math.random()*ks.length),1)[0];if(!k)break;
  const v=prs[k];const[v0,v1,v2]=v;
  const wr=[];
  for(const[pk]of(v[3]||[])){const pv=MUTA.sim[pk];if(pv&&wr.length<2)wr.push(pv[2])}
  const others=Object.keys(prs).filter(x=>x!==k);
  while(wr.length<2&&others.length){const o=others.splice(Math.floor(Math.random()*others.length),1)[0];wr.push(prs[o][2])}
  if(wr.length<2)continue;
  const opts=shuffle([v2,...wr]);
  QQ.push({loc:N[v0]+' '+v0+':'+v1,txt:v2,ans:v2,opts})}
 qi=0;sc=0;$('#list').innerHTML='';show()};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(){
 if(qi>=QQ.length){$('#quiz').style.display='none';
  $('#score').textContent='انتهى التدريب — '+sc+' / '+QQ.length;return}
 const q=QQ[qi];
 $('#quiz').style.display='block';
 $('#quiz').innerHTML=`<div class="muted" style="font-size:11px">سؤال ${qi+1}/${QQ.length} — أيُّ الآيات هي ${esc(q.loc)}؟</div>
 <div class="opts">${q.opts.map(o=>`<button class="op">${esc(o)}</button>`).join('')}</div>`;
 $('#quiz').querySelectorAll('.op').forEach(b=>b.onclick=()=>{
  const ok=b.textContent===q.ans;
  $('#quiz').querySelectorAll('.op').forEach(x=>{if(x.textContent===q.ans)x.classList.add('ok');else if(x===b&&!ok)x.classList.add('no');x.disabled=true});
  if(ok)sc++;
  setTimeout(()=>{qi++;show()},1400)})}
</script>
<script src="../shared/feedback.js" data-pid="mirjan" data-title="مرجان"></script>
</body>
</html>
