<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>جوهر — خلاصة كل متن بمفاهيمه</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:860px;margin:0 auto;padding:14px}
.bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.bk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.bk:hover{border-color:var(--acc)}
.bk .t{font-family:var(--font-ar);font-size:14px}
.bk .n{font-size:11px;color:var(--dim);margin-top:5px}
.term{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin:6px 0;cursor:pointer}
.term:hover{border-color:var(--acc)}
.term .t{font-family:var(--font-ar);font-size:14px}
.term .n{font-size:12px;color:var(--acc2)}
.term .bab{font-size:10px;color:var(--dim)}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">جوهر <span class="muted" style="font-weight:400;font-size:12px">— جوهر كل متن بمفاهيمه الأكثر تطويراً</span></h2>
<div class="muted">لكل متن من المتون التسعة: مفاهيمه الأكثر وروداً مرتبةً — بصمة المصنّف الفكرية. اضغط المفهوم لتراه عند كل المتون في موازن.</div>
<div id="view"></div>
<script src="../akida/terms.js"></script>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byBk={};
for(const t in TERMS.terms)for(const c of TERMS.terms[t])(byBk[c.b]=byBk[c.b]||{})[t]=(byBk[c.b][t]||0)+1;
const v=$('#view');
function home(){
 v.innerHTML='<div class="muted">اختر متناً لترى بصمته المفاهيمية:</div><div class="bks">'+
 Object.keys(byBk).sort((a,b)=>Object.keys(byBk[b]).length-Object.keys(byBk[a]).length).map(b=>{
  const terms=Object.keys(byBk[b]);
  const tot=terms.reduce((s,t)=>s+byBk[b][t],0);
  return `<div class="bk" data-b="${b}"><div class="t">${esc(TERMS.books[b]||b)}</div><div class="n">${terms.length.toLocaleString('ar-EG')} مفهوماً · ${tot.toLocaleString('ar-EG')} موضعاً</div></div>`}).join('')+'</div>'}
function showBk(b){
 const terms=Object.keys(byBk[b]).map(t=>({t,n:byBk[b][t],bab:TERMS.terms[t].find(c=>c.b===b).bab})).sort((x,y)=>y.n-x.n);
 v.innerHTML=`<button class="bk" style="border:0;background:none;color:var(--acc2);cursor:pointer;font-size:12px" onclick="home()">→ المتون</button>
 <h3 style="font-family:var(--font-ar);margin:10px 0">${esc(TERMS.books[b]||b)} <span class="muted" style="font-size:12px;font-weight:400">${terms.length.toLocaleString('ar-EG')} مفهوماً</span></h3>`+
 terms.slice(0,60).map(x=>`<div class="term" data-t="${esc(x.t)}"><div><div class="t">${esc(x.t)}</div>${x.bab?`<div class="bab">${esc(x.bab)}</div>`:''}</div><span class="n">${x.n.toLocaleString('ar-EG')}×</span></div>`).join('')}
$('#view').onclick=e=>{
 const b=e.target.closest('.bk[data-b]');if(b){showBk(b.dataset.b);return}
 const t=e.target.closest('.term');if(t)location.href='../muwazan/#q='+encodeURIComponent(t.dataset.t)};
home();window.home=home;
const hq=decodeURIComponent((location.hash||'').slice(3));
if(location.hash.startsWith('#b='))showBk(location.hash.slice(3));
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="jawhar" data-title="جوهر"></script>
</body>
</html>
