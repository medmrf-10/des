<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجرَح — شفاؤك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:620px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.cat{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px;cursor:pointer;text-align:center;transition:all .15s;font-family:var(--font-ar);font-size:13px}
.cat:hover{border-color:var(--acc)}
.cat.on{background:var(--acc);color:#14140f;font-weight:700}
.ev{background:var(--card);border:1px solid var(--acc);border-radius:11px;padding:11px 15px;margin-top:9px}
.ev .src{font-size:10.5px;color:var(--acc2);margin-bottom:4px}
.ev .txt{font-family:var(--font-ar);font-size:14px;line-height:2.1}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجرَح <span class="muted">— شفاؤك</span></h2>
<div class="muted">ما جرحك اليوم؟ اختره — تأتيك الآيات والأحاديث التي تطبّبه.</div>
<div class="cats" id="cats"></div>
<div id="res"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const CATS={
 'مريض/متعب':['مرض','شفاء','المريض','تعاف'],
 'حزين/منكسر':['حزن','الحزين','منكسر','ألم'],
 'خائف/قلق':['خوف','قلق','الخائف','خشية'],
 'وحيد/منبوذ':['وحدة','وحيد','غريب','الغرباء'],
 'فقير/محتاج':['فقر','الفقير','فاقة','رزق'],
 'مدين':['دين','الدائن','المطل','الغريم'],
 'ظلمت':['ظلم','المظلوم','مظلوم','الظلم'],
 'فشلت/خسرت':['خسارة','خاسر','فشل','الخاسر'],
 'مضطهد':['اضطهاد','مستضعف','الضعفاء','قهر'],
 'تائه/حائر':['حيرة','حائر','تائه','ضلال'],
 'عصيت/ذنبت':['ذنب','التوبة','تائب','مذنب'],
 'منسحب/يائس':['يأس','اليائس','قنوط','رجاء'],
};
$('#cats').innerHTML=Object.keys(CATS).map(c=>'<div class="cat">'+c+'</div>').join('');
let G,U;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA')]).then(([g,u])=>{G=g;U=u});
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
$('#cats').onclick=e=>{
 const cat=e.target.closest('.cat');if(!cat)return;
 document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));cat.classList.add('on');
 const kws=CATS[cat.textContent].map(norm);
 let hs=[];
 if(G)Object.values(G.g).forEach(h=>{
  const sc=kws.filter(k=>norm(h.t).includes(k)).length;
  if(sc>0)hs.push({t:h.t,h:h.h,s:h.s,sc});
 });
 hs.sort((a,b)=>b.sc-a.sc||b.s-a.s);hs=hs.slice(0,4);
 let vs=[];
 if(U)Object.keys(U.sim).forEach(k=>{
  const sc=kws.filter(kw=>norm(U.sim[k][2]).includes(kw)).length;
  if(sc>0)vs.push({t:U.sim[k][2],n:U.names[k.split(':')[0]],sc});
 });
 vs.sort((a,b)=>b.sc-a.sc);vs=vs.slice(0,4);
 $('#res').innerHTML='<div class="card"><div class="t">شفاء «'+cat.textContent+'»</div>'+
 (vs.length?'<div style="margin-top:9px"><div class="muted">من القرآن:</div>'+vs.map(v=>'<div class="ev"><div class="src">'+esc(v.n)+'</div><div class="txt">'+esc(v.t)+'</div></div>').join('')+'</div>':'')+
 (hs.length?'<div style="margin-top:10px"><div class="muted">من السنة:</div>'+hs.map(h=>'<div class="ev"><div class="src">'+esc(h.h)+'</div><div class="txt">'+esc(h.t.slice(0,220))+'…</div></div>').join('')+'</div>':'')+
 '<div class="muted" style="margin-top:10px">أوقد «مِعتكف» — اعتكف ربع ساعة مع هذه النصوص.</div></div>';
};
</script>
<script src="../shared/feedback.js" data-pid="mijrah" data-title="مِجرَح"></script>
</body>
</html>
