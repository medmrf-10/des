<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعرَز — تقسيم اليوم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.blk{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px}
.blk .tm{font-family:var(--font-ui);font-size:12px;color:var(--acc);min-width:100px}
.blk .nm{flex:1;font-family:var(--font-ar);font-size:13px}
.blk.now{border-color:var(--acc);background:linear-gradient(135deg,var(--card),var(--card2))}
.blk.now .tm{color:var(--ok);font-weight:700}
.day{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-top:12px;border:1px solid var(--border)}
.day>div{height:100%;position:relative;cursor:pointer}
.day .lb{position:absolute;top:-21px;font-size:9px;color:var(--dim);white-space:nowrap}
.now-line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--acc2);z-index:2}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعرَز <span class="muted">— تقسيم اليوم</span></h2>
<div class="muted">صمّم يومك المثالي كتلاً زمنية — وشاهد أين أنت منه الآن.</div>
<div class="card"><div class="t">أضف كتلة</div>
<div style="display:flex;gap:8px">
<input id="s" type="time" style="width:100px"><input id="e" type="time" style="width:100px"></div>
<input id="nm" placeholder="فجر وورد، عمل، قراءة، راحة…">
<button class="btn" id="add" style="margin-top:9px">أضف</button></div>
<div id="viz"></div>
<div id="now"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let B=LS('mi3raz',[]);
const COLS=['#3a5a8a','#4a7a5a','#8a6a3a','#6a4a7a','#3a7a7a','#7a4a4a'];
const mins=t=>{const[h,m]=t.split(':');return +h*60+ +m};
const now=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
$('#add').onclick=()=>{
 const s=$('#s').value,e=$('#e').value,n=$('#nm').value.trim();
 if(!s||!e||!n)return;
 B.push({s,e,n});B.sort((a,b)=>mins(a.s)-mins(b.s));
 SV('mi3raz',B);$('#nm').value='';render();
};
function render(){
 const total=Math.max(1,B.reduce((s,b)=>s+(mins(b.e)-mins(b.s)),0));
 $('#viz').innerHTML=B.length?'<div class="muted" style="font-size:10px;margin-bottom:20px">خريطة اليوم — '+arN(Math.floor(total/60))+'س '+arN(total%60)+'د مخططة</div>'+
 '<div class="day" style="position:relative">'+B.map((b,i)=>{
  const w=(mins(b.e)-mins(b.s))/1440*100;
  return '<div style="width:'+w+'%;background:'+COLS[i%COLS.length]+'" title="'+esc(b.n)+'"></div>';
 }).join('')+
 '<div class="now-line" id="nl"></div></div>':'';
 const nl=$('#nl');if(nl)nl.style.left=(now()/1440*100)+'%';
 const cur=B.find(b=>now()>=mins(b.s)&&now()<mins(b.e));
 $('#now').innerHTML=cur?'<div class="card" style="border-color:var(--ok);text-align:center;margin-top:12px"><div class="muted" style="font-size:10px">أنت الآن في</div><div style="font-family:var(--font-ar);font-size:16px;color:var(--ok)">'+esc(cur.n)+'</div><div class="muted" style="margin-top:5px">'+cur.s+' — '+cur.e+'</div></div>':'';
 $('#list').innerHTML=B.map((b,i)=>{
  const isNow=now()>=mins(b.s)&&now()<mins(b.e);
  return '<div class="blk'+(isNow?' now':'')+'"><span class="tm">'+b.s+'–'+b.e+'</span>'+
  '<span class="nm">'+esc(b.n)+'</span>'+
  '<button class="btn ghost" data-d="'+i+'" style="padding:4px 8px;color:var(--acc2)">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا كتل — صمّم يومك المثالي.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف الكتلة؟')){B.splice(+d.dataset.d,1);SV('mi3raz',B);render()}
};
setInterval(render,60000);
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3raz" data-title="مِعرَز"></script>
</body>
</html>
