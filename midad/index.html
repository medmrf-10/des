<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِداد — مؤقّت المذاكرة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px;text-align:center}
#clock{font-size:64px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;margin:20px 0 6px}
#sub{font-size:14px;color:var(--dim)}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:11px;padding:12px 30px;font-weight:800;cursor:pointer;font-family:var(--font-ar);font-size:15px}
.btn.gh{background:var(--card2);color:var(--txt)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.chip{border:1px solid var(--border);border-radius:99px;padding:7px 15px;cursor:pointer;font-size:12.5px;color:var(--dim);background:var(--card)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.row{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 13px;margin:5px 0;font-size:12px;text-align:right}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِداد <span class="muted">— مؤقّت المذاكرة</span></h2>
<div class="muted">اختر مجلسك، شغّل المؤقّت، اشتغل — الجلسة تُسجَّل في متابِع تلقائياً.</div>
<div id="clock">25:00</div>
<div id="sub">جاهز</div>
<div class="chips" id="subs"></div>
<div class="chips" id="lens">
<span class="chip" data-m="15">15 د</span><span class="chip on" data-m="25">25 د</span><span class="chip" data-m="45">45 د</span><span class="chip" data-m="90">90 د</span>
</div>
<div style="display:flex;gap:10px;justify-content:center;margin:14px 0">
<button class="btn" id="go">ابدأ</button>
<button class="btn gh" id="rst" style="display:none">أنهِ</button>
</div>
<h4 style="font-family:var(--font-ar);text-align:right;margin:18px 0 6px">جلسات اليوم</h4>
<div id="log"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const SUBS=['قرآن','حديث','عقيدة','فقه','لغة عربية','إنجليزية','برمجة','كتابة','تصوف','أخرى'];
let cur=null,mins=25,timer=null,left=0,t0=0;
$('#subs').innerHTML=SUBS.map(s=>`<span class="chip" data-s="${s}">${s}</span>`).join('');
$('#subs').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;$$('.chip');document.querySelectorAll('#subs .chip').forEach(x=>x.classList.toggle('on',x===c));cur=c.dataset.s;$('#sub').textContent=cur};
const $$=s=>document.querySelectorAll(s);
$('#lens').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;$$('#lens .chip').forEach(x=>x.classList.toggle('on',x===c));mins=+c.dataset.m;if(!timer)show(mins*60)};
function show(s){const m=Math.floor(s/60),ss=s%60;$('#clock').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss}
function dayLog(){const k=new Date().toISOString().slice(0,10);
 const all=JSON.parse(localStorage.midad||'{}');return[k,all]}
function log(sbj,mins){
 const[k,all]=dayLog();all[k]=all[k]||[];all[k].push({s:sbj,m:mins,t:Date.now()});
 localStorage.midad=JSON.stringify(all);
 // feed mutabi3 census
 const c=JSON.parse(localStorage.mutabi3||'{}');c['جلسات مذاكرة']=(c['جلسات مذاكرة']||0)+1;c['دقائق مذاكرة']=(c['دقائق مذاكرة']||0)+mins;
 localStorage.mutabi3=JSON.stringify(c);
 render()}
function render(){
 const[k,all]=dayLog();const today=all[k]||[];
 $('#log').innerHTML=today.length?today.slice().reverse().map(x=>`<div class="row"><span>${x.s}</span><span class="muted">${x.m} د · ${new Date(x.t).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')+'<div class="muted" style="margin-top:6px">المجموع: '+today.reduce((a,x)=>a+x.m,0)+' دقيقة اليوم</div>':'<div class="muted">لا جلسات بعد — أول مؤقّت يبدأ منك.</div>'}
$('#go').onclick=()=>{
 if(timer){clearInterval(timer);timer=null;$('#go').textContent='ابدأ';$('#rst').style.display='none';$('#sub').textContent='جاهز';show(mins*60);return}
 if(!cur){cur='أخرى';document.querySelector('#subs .chip:last-child').classList.add('on')}
 left=mins*60;t0=Date.now();
 $('#go').textContent='أوقف مؤقتاً';$('#rst').style.display='';$('#sub').textContent='مشتغل على: '+cur;
 timer=setInterval(()=>{left--;show(left);
  if(left<=0){clearInterval(timer);timer=null;log(cur,mins);$('#go').textContent='ابدأ';$('#rst').style.display='none';$('#sub').textContent='انتهت الجلسة ✓';show(mins*60)}},1000)};
$('#rst').onclick=()=>{
 if(!timer)return;clearInterval(timer);timer=null;
 const done=Math.round((Date.now()-t0)/60000)||1;
 log(cur,done);$('#go').textContent='ابدأ';$('#rst').style.display='none';$('#sub').textContent='سُجّلت '+done+' د';show(mins*60)};
show(mins*60);render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="midad" data-title="مِداد"></script>
</body>
</html>
