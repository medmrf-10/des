<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>Turath — مكتبة التراث</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0f1a;--card:#141b2e;--card2:#1a2238;--border:#2a3350;--txt:#f5f1e8;--dim:#8b93b0;--acc:#c9a24b;--acc2:#e8c97a;--ok:#46c96d}
[data-theme=light]{--bg:#f6f3ec;--card:#ffffff;--card2:#f0ebdd;--border:#ddd4c0;--txt:#1c2436;--dim:#5a6172;--acc:#8a6d1f;--acc2:#6b5410}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:60;background:rgba(11,15,26,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 14px}
[data-theme=light] header{background:rgba(246,243,236,.92)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:17px;margin:0;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.search{flex:1;display:flex;gap:6px}
.search input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px}
.search input:focus{outline:none;border-color:var(--acc)}
.icobtn{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;min-height:34px}
.chip[aria-pressed=true]{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.subchips{display:none;padding:2px 0 6px;gap:6px;overflow-x:auto}
.subchips.open{display:flex}
.counts{color:var(--dim);font-size:12px;padding:6px 14px}
.list{padding:0 14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card>button.head{display:flex;width:100%;background:none;border:0;color:inherit;text-align:right;padding:13px 14px;cursor:pointer;gap:10px;align-items:flex-start;font:inherit}
.card>button.head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.cnum{flex:none;width:34px;height:34px;border-radius:9px;background:var(--card2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.cbody{flex:1;min-width:0}
.ct{font-size:15px;font-weight:700;line-height:1.5}
.cm{color:var(--dim);font-size:12px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.cm .kind{color:var(--acc2)}
.cmt{color:var(--dim);font-size:12px;margin-top:5px;line-height:1.6}
.carrow{flex:none;color:var(--dim);font-size:12px;margin-top:8px}
.card[data-open] .carrow{transform:rotate(180deg)}
.clips{display:none;border-top:1px solid var(--border);max-height:60vh;overflow-y:auto}
.card[data-open] .clips{display:block}
.clip{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:right;color:inherit;font:inherit}
.clip:hover{background:var(--card2)}
.clip:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.clip .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.clip .t{flex:1;font-size:13.5px;line-height:1.5}
.clip .d{flex:none;color:var(--dim);font-size:11px;direction:ltr}
.clip.playing{background:#1d2438;border-inline-start:3px solid var(--acc)}
.clip.playing .n{background:var(--acc);color:#14140f}
.srcs{padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.srcs a{color:var(--acc2);font-size:12px;text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px}
/* player bar */
.player{position:fixed;bottom:0;inset-inline:0;z-index:70;background:rgba(13,17,30,.97);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:none;flex-direction:column}
[data-theme=light] .player{background:rgba(255,255,255,.97)}
.player.show{display:flex}
.pinfo{display:flex;align-items:center;gap:10px;padding:8px 14px}
.pt{flex:1;font-size:13px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{color:var(--dim);font-size:11px;white-space:nowrap}
.pctrl{display:flex;align-items:center;gap:4px;padding:0 10px 8px}
.pctrl button{background:none;border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;min-height:36px}
.pctrl button.on{background:var(--acc);color:#14140f;font-weight:700}
.seek{flex:1;height:4px;background:var(--card2);border-radius:2px;position:relative;cursor:pointer;direction:ltr;margin:0 6px}
.seek i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:2px}
.ytwrap{position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01;pointer-events:none}
.loadmore{display:block;margin:14px auto;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:10px 26px;cursor:pointer;font:inherit}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.dsrch{padding:0 14px 10px}
.dhit{display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:inherit;text-decoration:none}
.dhit b{color:var(--acc2);font-size:13px}
.dhit span{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.ratebtn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--dim);padding:2px 8px;font-size:12px;cursor:pointer}
.ratebtn.on{color:var(--acc);border-color:var(--acc)}
</style>
</head>
<body>
<header>
 <div class="hrow">
  <h1>﴾ Turath ﴿</h1>
  <div class="search"><input id="q" aria-label="بحث" placeholder="ابحث في 952 سلسلة و60 ألف مقطع…" autocomplete="off"></div>
  <button class="icobtn" id="themeBtn" title="الوضع">◐</button>
 </div>
 <div class="chips" id="subjChips"></div>
 <div class="chips" id="kindChips"></div>
 <div class="chips subchips" id="sheikhChips"></div>
</header>
<div class="counts" id="counts"></div>
<div class="dsrch" id="dsrch"></div>
<main class="list" id="list"></main>
<div style="text-align:center"><button class="loadmore" id="moreBtn" style="display:none">عرض المزيد ↓</button></div>
<div class="player" id="player">
 <div class="pinfo"><button class="icobtn" id="pclose">✕</button><div class="pt" id="ptitle"></div><div class="pmeta" id="pmeta"></div></div>
 <div class="pctrl">
  <div class="seek" id="seek"><i id="seekFill"></i></div>
  <button id="prevB">⏮</button><button id="playB">⏸</button><button id="nextB">⏭</button>
  <button id="rateB">1x</button>
 </div>
 <div class="ytwrap"><div id="ytp"></div></div>
</div>
<script src="data.js"></script>
<script src="meta.js"></script>
<script>
'use strict';
/* ================= state ================= */
const LS=(k,v)=>v===undefined?localStorage.getItem(k):localStorage.setItem(k,JSON.stringify(v));
let theme=LS('durus_theme')||'dark';document.documentElement.dataset.theme=theme==='light'?'light':'';
let valMap={};try{valMap=JSON.parse(LS('durus_vals')||'{}')}catch(e){}
const F={q:'',subj:'',kind:'',sheikh:'',onlyRated:false};
const state={shown:40,openId:null,clipCache:{},clipIdx:null,playing:null/*{sid,idx}*/};
const $=id=>document.getElementById(id);
const norm=s=>(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
const ar=n=>Number(n||0).toLocaleString('ar-EG');
const secs2min=s=>{s=Math.round(s||0);return s>=3600?Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ytId=u=>{const m=/[?&]v=([\w-]{11})/.exec(u||'');return m?m[1]:''};
const SHEIKH_LIST=[...new Set(SERIES.map(s=>s.sheikh))];
const SUBJS=[...new Set(Object.values(SUBJ))];
const KINDS=[...new Set(SERIES.map(s=>s.kind))];
const seriesSubj=id=>SUBJ[String(id)]||'';
const SNAME=id=>{const s=SERIES.find(x=>x.id==id);return s?s.name:String(id)};

/* ================= filter+list ================= */
function pass(s){
 if(F.subj&&seriesSubj(s.id)!==F.subj)return false;
 if(F.kind&&s.kind!==F.kind)return false;
 if(F.sheikh&&s.sheikh!==F.sheikh)return false;
 if(F.onlyRated&&!valMap[s.id])return false;
 if(F.q){const n=norm(F.q);if(!s._hay)s._hay=norm(s.name)+' '+norm(s.sheikh)+' '+norm(s.comment||'');
  if(!s._hay.includes(n)&&!F.q.split(/\s+/).every(w=>s._hay.includes(norm(w))))return false}
 return true;
}
let filtered=[];
function renderChips(el,items,key,allLabel){
 el.innerHTML='<button class="chip" role="button" aria-pressed="'+(!F[key])+'" data-v="">'+allLabel+'</button>'+items.map(v=>'<button class="chip" role="button" aria-pressed="'+(F[key]===v)+'" data-v="'+v+'">'+v+'</button>').join('');
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F[key]=b.dataset.v;refilter()});
}
function refilter(){filtered=SERIES.filter(pass);state.shown=40;renderList();renderCounts()}
function cardHtml(s){
 const rated=valMap[s.id];
 return '<div class="card" data-id="'+s.id+'">'+
 '<button class="head" aria-expanded="false" data-open="'+s.id+'">'+
 '<span class="cnum">'+(rated?'★':'')+ar(s.id)+'</span>'+
 '<span class="cbody"><span class="ct">'+esc(s.name)+'</span>'+
 '<span class="cm"><span>'+esc(s.sheikh)+'</span><span class="kind">'+esc(s.kind)+'</span>'+(seriesSubj(s.id)?'<span>'+esc(seriesSubj(s.id))+'</span>':'')+'<span>'+ar(s.videos)+' درساً · '+s.hours+' س</span></span>'+
 (s.comment?'<span class="cmt">'+esc(s.comment)+'</span>':'')+'</span>'+
 '<span class="carrow">▼</span></button>'+
 '<div class="clips"></div></div>';
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const list=$('list');
list.addEventListener('click',e=>{
 const h=e.target.closest('button.head');if(h){toggleCard(+h.dataset.open,h.closest('.card'));return}
 const c=e.target.closest('.clip');if(c){playClip(+c.dataset.sid,+c.dataset.idx,c);return}
 const rb=e.target.closest('.ratebtn');if(rb){const id=rb.dataset.id;valMap[id]=valMap[id]?0:5;if(!valMap[id])delete valMap[id];LS('durus_vals',valMap);rb.classList.toggle('on',!!valMap[id]);renderCounts();return}
});
list.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' '){const h=e.target.closest('button.head,.clip');if(h){e.preventDefault();h.click()}}
});
async function toggleCard(id,card){
 const clips=card.querySelector('.clips');const head=card.querySelector('.head');
 if(card.hasAttribute('data-open')){card.removeAttribute('data-open');head.setAttribute('aria-expanded','false');return}
 card.setAttribute('data-open','');head.setAttribute('aria-expanded','true');
 if(!state.clipCache[id]){
   clips.innerHTML='<div class="empty">يُحمّل…</div>';
   try{state.clipCache[id]=await(await fetch('clips/'+id+'.json')).json()}catch(e){state.clipCache[id]=[]}
 }
 const arr=state.clipCache[id];
 clips.innerHTML=arr.map((c,i)=>{
   const pl=state.playing&&state.playing.sid===id&&state.playing.idx===i;
   return '<button class="clip'+(pl?' playing':'')+'" data-sid="'+id+'" data-idx="'+i+'"><span class="n">'+(pl?'▶':ar(i+1))+'</span><span class="t">'+esc(c.title)+'</span><span class="d">'+secs2min(c.secs)+'</span></button>';
 }).join('')+
 '<div class="srcs"><a href="'+esc(s => '')+'"></a><a target="_blank" rel="noopener" href="'+esc(SERIES.find(x=>x.id===id).plist_url)+'">قائمة يوتيوب ↗</a><button class="ratebtn'+(valMap[id]?' on':'')+'" data-id="'+id+'">★ قيّمها</button><a href="../live/" style="color:var(--dim)">كاراوكي ↗</a></div>';
}
function renderList(){
 const slice=filtered.slice(0,state.shown);
 list.innerHTML=slice.map(cardHtml).join('')||'<div class="empty">لا نتائج — عدّل الفلاتر أو البحث</div>';
 $('moreBtn').style.display=filtered.length>state.shown?'':'none';
}
$('moreBtn').onclick=()=>{state.shown+=60;renderList()};
function renderCounts(){
 const rv=Object.keys(valMap).length;
 $('counts').innerHTML=ar(filtered.length)+' سلسلة'+(rv?' · ★ '+ar(rv)+' مقيّمة':'')+' · '+ar(filtered.reduce((a,s)=>a+(s.videos||0),0))+' درساً';
}
/* deep clip search (lazy CLIPIDX) */
let deepTO=null;
$('q').addEventListener('input',e=>{
 F.q=e.target.value;refilter();clearTimeout(deepTO);
 const q=F.q.trim();if(norm(q).length<3){$('dsrch').innerHTML='';return}
 deepTO=setTimeout(async()=>{
   if(!state.clipIdx){try{state.clipIdx=(await(await fetch('clipindex.js')).text()).match(/CLIPIDX=(\[.*\])/s);state.clipIdx=JSON.parse(state.clipIdx[1]);state.clipIdx.forEach(c=>c._n=norm(c.t))}catch(err){state.clipIdx=[]}}
   const nq=norm(q);const hits=[];
   for(const c of state.clipIdx){if((c._n||norm(c.t)).includes(nq)){hits.push(c);if(hits.length>=25)break}}
   $('dsrch').innerHTML=hits.map(c=>'<a class="dhit" href="#" onclick="openClip('+c.i+',\''+esc(ytId(c.u))+'\');return false"><b>'+esc(SNAME(c.i))+'</b><span>'+esc(c.t)+'</span></a>').join('')+(hits.length>=25?'<div class="mut" style="color:var(--dim);font-size:11px">+ نتائج أخرى…</div>':'');
 },300);
});
window.openClip=async(sid,vid)=>{const card=list.querySelector('.card[data-id="'+sid+'"]');
 if(card){card.scrollIntoView({block:'center'});if(!card.hasAttribute('data-open'))await toggleCard(sid,card);
  const clips=state.clipCache[sid]||[];const idx=clips.findIndex(c=>ytId(c.url)===vid);
  if(idx>=0){const el=card.querySelector('.clip[data-idx="'+idx+'"]');el&&el.click();el&&el.scrollIntoView({block:'center'})}}
 else{F.subj='';F.kind='';F.sheikh='';F.q='';$('q').value='';refilter();await new Promise(r=>setTimeout(r,60));const c2=list.querySelector('.card[data-id="'+sid+'"]');if(c2){c2.scrollIntoView({block:'center'});await toggleCard(sid,c2);const clips=state.clipCache[sid]||[];const idx=clips.findIndex(c=>ytId(c.url)===vid);if(idx>=0)c2.querySelector('.clip[data-idx="'+idx+'"]').click()}}
};

/* ================= player ================= */
let ytP=null,ytReady=false,ytTimer=null;
function loadYT(){if(window.YT&&YT.Player)return Promise.resolve();return new Promise(res=>{const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);window.onYouTubeIframeAPIReady=()=>res()})}
async function ensurePlayer(){await loadYT();if(ytP)return;
 ytP=new YT.Player('ytp',{height:'1',width:'1',playerVars:{playsinline:1},events:{onReady:()=>{ytReady=true},onStateChange:e=>{if(e.data===0)nextClip()}}});
}
async function playClip(sid,idx,el){
 const arr=state.clipCache[sid];if(!arr)return;const c=arr[idx];const vid=ytId(c.url);if(!vid)return;
 state.playing={sid,idx,vid};
 document.querySelectorAll('.clip.playing').forEach(x=>{x.classList.remove('playing');x.querySelector('.n').textContent=ar(+x.dataset.idx+1)});
 el&&el.classList.add('playing');el&&(el.querySelector('.n').textContent='▶');
 $('player').classList.add('show');
 $('ptitle').textContent=c.title;$('pmeta').textContent=SNAME(sid)+' · '+secs2min(c.secs);
 await ensurePlayer();const tryPlay=()=>{if(ytReady){ytP.loadVideoById(vid)}else setTimeout(tryPlay,300)};tryPlay();
 LS('durus_pos',JSON.stringify({sid,idx,vid}));
 clearInterval(ytTimer);ytTimer=setInterval(()=>{try{const t=ytP.getCurrentTime(),d=ytP.getDuration();if(d)$('seekFill').style.width=(t/d*100)+'%'}catch(e){}},500);
 location.hash='p='+sid+'.'+idx;
}
function curCardList(){return state.playing?state.clipCache[state.playing.sid]||[]:[]}
function nextClip(){const p=state.playing;if(!p)return;const arr=curCardList();if(p.idx+1<arr.length){const card=list.querySelector('.card[data-id="'+p.sid+'"]');const el=card&&card.querySelector('.clip[data-idx="'+(p.idx+1)+'"]');playClip(p.sid,p.idx+1,el)}}
function prevClip(){const p=state.playing;if(!p)return;if(p.idx>0){const card=list.querySelector('.card[data-id="'+p.sid+'"]');const el=card&&card.querySelector('.clip[data-idx="'+(p.idx-1)+'"]');playClip(p.sid,p.idx-1,el)}}
$('nextB').onclick=nextClip;$('prevB').onclick=prevClip;
$('playB').onclick=()=>{try{const st=ytP.getPlayerState();(st===1?ytP.pauseVideo():ytP.playVideo())}catch(e){}};
$('pclose').onclick=()=>{try{ytP.stopVideo()}catch(e){};$('player').classList.remove('show');state.playing=null;clearInterval(ytTimer)};
$('seek').onclick=e=>{try{const r=e.currentTarget.getBoundingClientRect(),d=ytP.getDuration();ytP.seekTo(d*((e.clientX-r.left)/r.width),true)}catch(err){}};
const RATES=[1,1.25,1.5,1.75,2];let rateI=0;
$('rateB').onclick=()=>{rateI=(rateI+1)%RATES.length;$('rateB').textContent=RATES[rateI]+'x';try{ytP.setPlaybackRate(RATES[rateI])}catch(e){}};
/* ================= theme ================= */
$('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme==='light'?'light':'';LS('durus_theme',theme)};
/* ================= boot ================= */
renderChips($('subjChips'),SUBJS,'subj','كل المواضيع');
renderChips($('kindChips'),KINDS,'kind','كل الأنواع');
renderChips($('sheikhChips'),SHEIKH_LIST,'sheikh','كل المشايخ');
$('sheikhChips').classList.add('open');
const h=location.hash;
refilter();
if(h.startsWith('#s=')){const id=+h.slice(3);const c=list.querySelector('.card[data-id="'+id+'"]');c&&c.scrollIntoView({block:'center'})}
if(h.startsWith('#p=')){const m=/p=(\d+)\.(\d+)/.exec(h);if(m){const sid=+m[1],idx=+m[2];
  const fi=filtered.findIndex(x=>x.id===sid);if(fi>=state.shown)state.shown=fi+1,renderList();
  let c=list.querySelector('.card[data-id="'+sid+'"]');
  if(c){c.scrollIntoView({block:'center'});toggleCard(sid,c).then(()=>{const el=c.querySelector('.clip[data-idx="'+idx+'"]');el&&el.click();el&&el.scrollIntoView({block:'center'})})}}}
const pos=LS('durus_pos');if(pos){try{const p=JSON.parse(pos);if(p.sid)console.log('last',p)}catch(e){}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="../shared/feedback.js"></script>
</body>
</html>
