<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِتحّق — تحقيق الفهم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:660px;margin:0 auto;padding:14px}
.src{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:14px 18px;font-family:var(--font-ar);font-size:16px;line-height:2.1;margin-top:10px}
.src .r{display:flex;justify-content:space-between;font-size:11px;color:var(--acc3);margin-bottom:6px}
textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:11px;font-family:var(--font-ar);font-size:15px;min-height:90px;resize:vertical;box-sizing:border-box;line-height:1.9;margin-top:10px}
textarea:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:13px;margin-top:8px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.kw{display:inline-block;border-radius:8px;padding:3px 10px;font-size:12px;margin:3px;font-family:var(--font-ar)}
.kw.hit{background:rgba(52,168,83,.15);color:var(--ok);border:1px solid var(--ok)}
.kw.miss{background:var(--card2);color:var(--dim);border:1px solid var(--border)}
.muted{color:var(--dim);font-size:12px}
.verdict{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 15px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِتحّق <span class="muted">— تحقيق الفهم</span></h2>
<div class="muted">اقرأ النص ← استغنِ عنه ← اكتب معناه بأسلوبك ← المِتحّق يقيس كم من مفاتيحه وصل إليك.</div>
<div class="src" id="src">…</div>
<textarea id="me" placeholder="اكتب المعنى بأسلوبك…"></textarea>
<button class="btn" id="chk">تحقّق</button>
<button class="btn ghost" id="nx">نص آخر ←</button>
<div id="res"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const STOP=new Set('على في من الى عن أن إن كان ما لا لم لن هو هي هم نحن واو و قد قال كما ثم أو بل لما إذا الذي التي هذه هذا ذلك تلك كل بعض غير'.split(' '));
let M=null,cur=null;
async function laz(){if(window.MASAIL)return;
 const s=document.createElement('script');s.src='../fiqh_reader/masail.js';
 await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
function pick(){
 const ks=Object.keys(M);const b=M[ks[Math.floor(Math.random()*ks.length)]];
 const u=b.u.filter(x=>(x.t||'').length>60&&(x.t||'').length<400);
 if(!u.length){pick();return}
 cur={u:u[Math.floor(Math.random()*u.length)],b};
 $('#src').innerHTML=`<div class="r"><span>${esc(b.n)} — ${esc(b.a)}</span><span>نص الفحص</span></div>${esc(cur.u.t)}`;
 $('#me').value='';$('#res').innerHTML=''}
function kws(t){
 const ws=norm(t).split(/\s+/).filter(w=>w.length>3&&!STOP.has(w));
 const c={};ws.forEach(w=>c[w]=(c[w]||0)+1);
 return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,10)}
$('#chk').onclick=()=>{
 if(!cur)return;
 const me=norm($('#me').value);
 const keys=kws(cur.u.t);
 const hit=keys.filter(k=>me.includes(k));
 const pc=Math.round(hit.length/keys.length*100);
 const st=JSON.parse(localStorage.getItem('mutahhaq')||'{"n":0,"sum":0}');
 st.n++;st.sum+=pc;localStorage.setItem('mutahhaq',JSON.stringify(st));
 const v=pc>=70?'فهم ممتاز — مفاتيح النص عندك':pc>=40?'فهم متوسط — نقاط غابت عنك':'فهم ضعيف — أعد القراءة بتمعّن';
 $('#res').innerHTML=`<div class="verdict"><b>${v}</b> — ${pc}%<div style="margin-top:7px">${keys.map(k=>`<span class="kw ${hit.includes(k)?'hit':'miss'}">${esc(k)}</span>`).join('')}</div>
 <div class="muted" style="margin-top:7px">متوسطك التراكمي: ${Math.round(st.sum/st.n)}% في ${st.n.toLocaleString('ar-EG')} محاولة</div></div>`};
$('#nx').onclick=pick;
(async()=>{await laz();M=window.MASAIL;pick()})();
</script>
<script src="../shared/feedback.js" data-pid="mutahhaq" data-title="مِتحّق"></script>
</body>
</html>
