<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحسَن — بطاقة الحديث</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;width:100%;margin-top:6px}
textarea{height:110px;resize:vertical;line-height:2}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
canvas{width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--border)}
.sw{display:inline-block;width:26px;height:26px;border-radius:7px;cursor:pointer;margin:3px;border:2px solid transparent}
.sw.on{border-color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحسَن <span class="muted">— بطاقة الحديث</span></h2>
<div class="muted">حديث أو آية أو نص يعجبك ← بطاقة أنيقة تُحمَّل صورة تنشرها حيث شئت.</div>
<div class="card"><div class="t">نصّك</div>
<textarea id="txt" placeholder="اكتب أو الصق النص…"></textarea>
<input id="src" placeholder="المصدر: صحيح البخاري، الآية، اسمك…">
<div style="margin-top:9px;display:flex;align-items:center;gap:7px">
 <span class="muted">الخلفية:</span>
 <span class="sw on" data-c="#0b0f1a" style="background:#0b0f1a"></span>
 <span class="sw" data-c="#1a2a4a" style="background:#1a2a4a"></span>
 <span class="sw" data-c="#2a1a3a" style="background:#2a1a3a"></span>
 <span class="sw" data-c="#1a3a2a" style="background:#1a3a2a"></span>
 <span class="sw" data-c="#3a2a1a" style="background:#3a2a1a"></span>
</div>
<div style="margin-top:9px;display:flex;gap:7px">
 <button class="btn" id="draw">ارسمها</button>
 <button class="btn ghost" id="load">حديث عشوائي</button>
 <a id="dl" style="display:none;text-decoration:none"><button class="btn">حمّلها PNG</button></a>
</div></div>
<canvas id="cv" width="800" height="600"></canvas>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let bg='#0b0f1a',G;
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));s.classList.add('on');bg=s.dataset.c;draw()});
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
$('#load').onclick=()=>{if(!G)return laz('../hadith/analysis.js','GIDNET').then(g=>{G=g;rand()});rand()};
function rand(){const ks=Object.keys(G.g);const h=G.g[ks[Math.floor(Math.random()*ks.length)]];$('#txt').value=h.t.slice(0,300);$('#src').value=h.h;draw()}
function wrap(ctx,text,maxW){
 const words=text.split(/\s+/),lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;
  if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
 if(cur)lines.push(cur);return lines;
}
function draw(){
 const ctx=$('#cv').getContext('2d');
 ctx.fillStyle=bg;ctx.fillRect(0,0,800,600);
 // إطار ذهبي
 ctx.strokeStyle='#c9a227';ctx.lineWidth=3;ctx.strokeRect(28,28,744,544);
 ctx.strokeStyle='#c9a22766';ctx.lineWidth=1;ctx.strokeRect(38,38,724,524);
 // زخرفة زاوية
 ctx.fillStyle='#c9a227';
 ctx.font='28px serif';ctx.textAlign='center';
 ctx.fillText('❁',400,75);
 // النص
 const txt=$('#txt').value.trim();
 if(!txt){ctx.fillStyle='#c9a227';ctx.font='bold 30px var(--font-ar),serif';ctx.fillText('مِحسَن — بطاقة الحديث',400,300);return}
 ctx.fillStyle='#f0e6c8';
 ctx.font='24px var(--font-ar),Amiri,serif';
 const lines=wrap(ctx,txt,660);
 const startY=300-(lines.length*36)/2;
 lines.forEach((l,i)=>ctx.fillText(l,400,startY+i*36));
 // المصدر
 const src=$('#src').value.trim();
 if(src){ctx.fillStyle='#c9a227';ctx.font='18px var(--font-ar),serif';ctx.fillText('— '+src+' —',400,530)}
 // توقيع
 ctx.fillStyle='#c9a22766';ctx.font='12px serif';ctx.textAlign='left';
 ctx.fillText('medmrf-10.github.io/des/',50,560);
 const blob=$('#cv').toDataURL('image/png');
 $('#dl').href=blob;$('#dl').download='card.png';$('#dl').style.display='inline';
}
$('#draw').onclick=draw;
draw();
</script>
<script src="../shared/feedback.js" data-pid="mihsan" data-title="مِحسَن"></script>
</body>
</html>
