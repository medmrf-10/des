<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a"><title>مُطالَع — مكتبة التفريغات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
*{box-sizing:border-box}
body{min-height:100dvh;padding:0 0 90px}
.wrap{max-width:1040px;margin:0 auto;padding:0 clamp(12px,3vw,24px)}
/* ==== الترويسة ==== */
.hero{text-align:center;padding:34px 12px 20px}
.hero h1{font-size:clamp(1.7rem,5vw,2.4rem);color:var(--acc);margin:0 0 6px}
.hero .sub{color:var(--dim);font-size:.9rem;max-width:640px;margin:0 auto;line-height:1.9}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px auto 8px;max-width:760px}
.stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 8px;text-align:center}
.stat b{display:block;color:var(--acc);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--dim)}
/* ==== البحث ==== */
.search{position:sticky;top:0;z-index:10;padding:10px 0;background:var(--bg)}
.search input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);font-family:inherit;font-size:1.05rem;padding:14px 20px}
.search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(201,162,75,.15)}
/* ==== شريط التنقل ==== */
.crumb{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:10px 2px;flex-wrap:wrap}
.crumb a{color:var(--acc);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb .sep{color:var(--dim)}
.crumb .here{color:var(--txt);font-weight:700}
/* ==== أقسام ==== */
.secT{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.secT h2{font-size:1.05rem;color:var(--acc);margin:0;font-weight:800}
.secT .cnt{background:var(--card2);color:var(--dim);border-radius:99px;padding:2px 12px;font-size:.72rem}
.secT .hint{font-size:.72rem;color:var(--dim);margin-inline-start:auto}
/* ==== شبكة المشايخ ==== */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.shc{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.shc::before{content:'';position:absolute;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,var(--acc),transparent)}
.shc:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.shc .nm{font-size:1.06rem;font-weight:800;color:var(--txt);margin-bottom:12px;line-height:1.4;min-height:2.8em}
.shc .nums{display:flex;gap:10px;margin-bottom:10px}
.shc .num{flex:1;text-align:center;background:var(--card2);border-radius:var(--r-sm);padding:8px 4px}
.shc .num b{display:block;font-size:1.15rem;color:var(--acc);font-variant-numeric:tabular-nums}
.shc .num span{font-size:.62rem;color:var(--dim)}
.shc .lb{font-size:.62rem;color:var(--dim)}
.pbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:99px}
.shc .chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:.64rem;border-radius:99px;padding:2px 10px;border:1px solid var(--border);color:var(--dim)}
.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.prog{color:var(--acc3);border-color:var(--acc3)}
.chip.soon{color:var(--acc);border-color:var(--acc)}
.chip.none{color:var(--dim)}
/* ==== بطاقات السلاسل ==== */
.ser{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
.ser:hover{border-color:var(--acc);background:var(--card2)}
.ser .ic{width:42px;height:42px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ser .mid{flex:1;min-width:0}
.ser .nm{font-size:.95rem;font-weight:700;line-height:1.5;margin-bottom:4px}
.ser .mt{display:flex;gap:10px;font-size:.7rem;color:var(--dim);align-items:center;flex-wrap:wrap}
.ser .pb2{height:4px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:7px;max-width:280px}
.ser .pb2 i{display:block;height:100%;background:var(--ok);border-radius:99px}
.ser .acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.abtn{border:1px solid var(--border);background:var(--card2);color:var(--dim);border-radius:9px;min-width:40px;height:40px;font-size:.85rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0 10px}
.abtn:hover{border-color:var(--acc);color:var(--acc)}
.abtn.gold{border-color:var(--acc);color:var(--acc)}
.abtn.on{border-color:var(--ok);color:var(--ok)}
.abtn.req{border-color:var(--acc);color:var(--acc);font-size:.74rem;padding:0 14px;font-weight:700}
.abtn.req.on{border-color:var(--ok);color:var(--ok)}
.ordnum{color:var(--acc);font-size:.9rem;font-weight:800;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
/* ==== الدروس ==== */
.lrow{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.lrow:hover{border-color:var(--acc)}
.lrow .idx{width:38px;height:38px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:800;font-size:.85rem;flex-shrink:0;font-variant-numeric:tabular-nums}
.lrow .ln{flex:1;font-size:.94rem;line-height:1.6}
.lrow .go{color:var(--dim);font-size:1.1rem}
/* ==== القارئ ==== */
.readBox{max-width:820px;margin:0 auto}
.readHd{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}
.readHd .t{color:var(--acc);font-size:1.25rem;font-weight:800;line-height:1.6}
.readHd .m{color:var(--dim);font-size:.76rem;margin-top:6px}
.rtxt{font-family:var(--font-ar);font-size:1.22rem;line-height:2.4;white-space:pre-wrap;color:var(--txt)}
/* ==== قوائمي ==== */
.listrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px dashed var(--acc);border-radius:var(--r-md);padding:13px 16px;margin-bottom:10px;cursor:pointer}
.listrow:hover{border-style:solid;background:var(--card2)}
.listrow .nm{flex:1;font-weight:700;color:var(--acc);font-size:.95rem}
.listrow .cnt2{font-size:.72rem;color:var(--dim)}
.newlist{display:flex;gap:8px;margin:8px 0 4px}
.newlist input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--txt);font-family:inherit;font-size:.9rem;padding:11px 16px}
.newlist input:focus{outline:none;border-color:var(--acc)}
.newlist button{background:var(--acc);color:#0b0f1a;border:none;border-radius:var(--r-md);padding:11px 20px;font-family:inherit;font-size:.85rem;font-weight:800;cursor:pointer}
/* ==== زر حفظ العائم ==== */
.savebar{position:fixed;bottom:14px;inset-inline:0;display:flex;justify-content:center;z-index:15;pointer-events:none}
.savebar button{pointer-events:auto;background:var(--acc);color:#0b0f1a;border:none;border-radius:99px;padding:13px 34px;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5)}
/* ==== منبثق القوائم ==== */
.lpop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.lpop.show{display:flex}
.lpin{background:var(--card);border:1px solid var(--acc);border-radius:var(--r-lg);padding:20px;width:min(360px,94vw);max-height:70vh;overflow:auto}
.lpt{color:var(--acc);font-weight:800;font-size:1rem;margin-bottom:12px;text-align:center}
.lopt{padding:11px 14px;border-radius:10px;cursor:pointer;font-size:.9rem;border:1px solid var(--border);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.lopt:hover{border-color:var(--acc);background:var(--card2)}
.lnew{display:flex;gap:6px;margin-top:12px}
.lnew input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-family:inherit;font-size:.88rem;padding:9px 13px}
.lnew button{background:var(--acc);color:#0b0f1a;border:none;border-radius:10px;padding:9px 15px;font-family:inherit;font-size:.8rem;font-weight:800;cursor:pointer}
.lclose{background:var(--card2);color:var(--dim);border:none;border-radius:10px;width:100%;margin-top:10px;padding:9px;font-family:inherit;font-size:.8rem;cursor:pointer}
.notice{position:fixed;bottom:76px;inset-inline:20px;max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:12px 20px;font-size:.85rem;text-align:center;display:none;z-index:25}
.empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:.9rem}
@media(max-width:560px){
  .ser{padding:12px}.ser .ic{display:none}
  .stats{gap:8px}.stat{min-width:100px;padding:10px 4px}
}
</style></head><body>
<div class="wrap">
  <div class="hero">
    <h1>مُطالَع</h1>
    <div class="sub">مكتبة التفريغات — اختر شيخاً، تصفّح سلاسله بحسب حالتها، واقرأ أي درس مفرّغ. اطلب ما لم يُفرَّغ، رتّب الأولويات، ونظّم سلاسلك في قوائم.</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="search"><input id="q" placeholder="ابحث باسم سلسلة أو شيخ…"></div>
  <div class="crumb" id="crumb"></div>
  <div id="main"></div>
</div>
<div class="savebar" id="savebar" style="display:none"><button id="save">حفظ الترتيب والطلبات</button></div>
<div class="lpop" id="lpop"><div class="lpin">
  <div class="lpt">أضف السلسلة إلى قائمة</div>
  <div id="lopts"></div>
  <div class="lnew"><input id="lnew" placeholder="اسم قائمة جديدة…"><button id="ladd">إنشاء وإضافة</button></div>
  <button class="lclose" id="lclose">إغلاق</button>
</div></div>
<div class="notice" id="notice"></div>
<script>
const D='data/',NT='https://ntfy.sh/des_mutalaa_q9';
const LABEL={done:'جاهز',prog:'جاري التفريغ',soon:'قريب البدء',none:'غير مطلوب'};
const ORDER=['done','prog','soon','none'];
const ICON={done:'📖',prog:'⏳',soon:'🕐',none:'○'};
const AR='٠١٢٣٤٥٦٧٨٩';
const lat=s=>String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d));
const esc=s=>String(s).replace(/</g,'&lt;');
let SER=[],q='';
let soonOrder=JSON.parse(localStorage.getItem('mut_soon_order')||'[]');
let pending=JSON.parse(localStorage.getItem('mut_pending')||'[]');
let lists=JSON.parse(localStorage.getItem('mut_lists')||'{}');
let addTarget=null,dirty=false;
const saveLists=()=>localStorage.setItem('mut_lists',JSON.stringify(lists));
const ser=id=>SER.find(s=>s.id===id);
/* ---------- تنقّل بالهاش ---------- */
const routes={};
function nav(h){location.hash=h;}
function route(){
  const h=location.hash.slice(2)||'';
  const parts=h.split('/');
  if(parts[0]==='sh'&&parts[1])return viewSheikh(decodeURIComponent(parts[1]));
  if(parts[0]==='s'&&parts[1])return viewSeries(parts[1]);
  if(parts[0]==='l'&&parts[1]&&parts[2])return viewLesson(parts[1],decodeURIComponent(parts.slice(2).join('/')));
  if(parts[0]==='list'&&parts[1])return viewList(decodeURIComponent(parts[1]));
  return viewHome();
}
function crumb(items){
  document.getElementById('crumb').innerHTML=items.map((c,i)=>
    (i?' <span class="sep">‹</span> ':'')+(c.h?`<a data-h="${c.h}">${c.t}</a>`:`<span class="here">${c.t}</span>`)).join('');
  document.querySelectorAll('.crumb a').forEach(a=>a.onclick=()=>nav(a.dataset.h));
}
/* ---------- البيانات ---------- */
function sheikhs(){
  const m={};
  SER.forEach(s=>{const sh=s.sheikh||'غير محدد';m[sh]=m[sh]||{done:0,tot:0,ser:[]};m[sh].done+=s.done;m[sh].tot+=s.total||0;m[sh].ser.push(s);});
  return m;
}
function soonList(){
  let l=SER.filter(s=>s.status==='soon');
  if(l.some(s=>s.ord!==undefined&&s.ord<900))return [...l].sort((a,b)=>(a.ord??999)-(b.ord??999));
  if(soonOrder.length){const ord=Object.fromEntries(soonOrder.map((id,i)=>[id,i]));return [...l].sort((a,b)=>(ord[a.id]??999)-(ord[b.id]??999));}
  return l;
}
/* ---------- إجراءات ---------- */
function moveSoon(id,dir){
  const l=soonList().map(s=>s.id);
  const i=l.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=l.length)return;
  [l[i],l[j]]=[l[j],l[i]];
  soonOrder=l;localStorage.setItem('mut_soon_order',JSON.stringify(l));dirty=true;route();
}
function toggleReq(id){
  const i=pending.indexOf(id);
  if(i<0)pending.push(id);else pending.splice(i,1);
  localStorage.setItem('mut_pending',JSON.stringify(pending));dirty=true;route();
}
function openAdd(id){
  addTarget=id;
  document.getElementById('lopts').innerHTML=Object.keys(lists).map(n=>
    `<div class="lopt" data-ln="${esc(n)}"><span>${esc(lat(n))}</span><span class="cnt2">${lists[n].length} سلسلة${lists[n].includes(id)?' ✓':''}</span></div>`).join('')
    ||'<div class="empty" style="padding:14px">لا قوائم — أنشئ واحدة أدناه.</div>';
  document.querySelectorAll('.lopt').forEach(o=>o.onclick=()=>{
    const n=o.dataset.ln,i=lists[n].indexOf(id);
    if(i<0)lists[n].push(id);else lists[n].splice(i,1);
    saveLists();openAdd(id);});
  document.getElementById('lnew').value='';
  document.getElementById('lpop').classList.add('show');
}
function rmFromList(name,id){
  lists[name]=(lists[name]||[]).filter(x=>x!==id);
  if(!lists[name].length){delete lists[name];nav('#/');}
  saveLists();dirty=true;route();
}
async function save(){
  const payload={kind:'order',ids:soonList().map(s=>s.id),requests:pending,lists,t:Date.now()};
  pending.forEach(id=>{const s=ser(id);if(s&&s.status==='none')s.status='soon';});
  pending=[];localStorage.setItem('mut_pending','[]');dirty=false;
  try{await fetch(NT,{method:'POST',body:JSON.stringify(payload)});}catch(e){}
  route();
  const n=document.getElementById('notice');
  n.textContent='حُفظ الترتيب والطلبات والقوائم — وصل الفريق وسيبدأ تفريغ المطلوبة.';
  n.style.display='block';setTimeout(()=>n.style.display='none',4000);
}
/* ---------- مكوّنات ---------- */
function serCard(s,opts={}){
  const pct=s.total?Math.round(100*s.done/s.total):0;
  let acts='';
  if(s.status==='soon'){const ix=soonList().findIndex(x=>x.id===s.id);acts=`<span class="ordnum">${ix+1}</span><button class="abtn" data-mv="-1" data-id="${s.id}">↑</button><button class="abtn" data-mv="1" data-id="${s.id}">↓</button>`;}
  if(s.status==='none')acts=`<button class="abtn req${pending.includes(s.id)?' on':''}" data-req="${s.id}">${pending.includes(s.id)?'✓ مطلوبة':'اطلبها'}</button>`;
  if(opts.rm)acts+=`<button class="abtn" data-rm="${s.id}">✕</button>`;
  acts+=`<button class="abtn gold" data-add="${s.id}" title="أضف لقائمة">+</button>`;
  return `<div class="ser" data-id="${s.id}">
    <div class="ic">${ICON[s.status]}</div>
    <div class="mid"><div class="nm">${esc(lat(s.name.replace(/^\d+_/,'')))}</div>
      <div class="mt"><span class="chip ${s.status}">${LABEL[s.status]}</span><span>${s.done}/${s.total||'؟'} حلقة</span><span>${esc(lat(s.sheikh||''))}</span></div>
      ${s.total&&s.status!=='none'?`<div class="pb2"><i style="width:${pct}%"></i></div>`:''}
    </div><div class="acts">${acts}</div></div>`;
}
function bindActs(el){
  el.querySelectorAll('.ser').forEach(c=>c.onclick=e=>{
    if(e.target.closest('[data-mv]')){e.stopPropagation();return moveSoon(e.target.closest('[data-mv]').dataset.id,+e.target.closest('[data-mv]').dataset.mv);}
    if(e.target.closest('[data-req]')){e.stopPropagation();return toggleReq(e.target.closest('[data-req]').dataset.req);}
    if(e.target.closest('[data-add]')){e.stopPropagation();return openAdd(e.target.closest('[data-add]').dataset.add);}
    if(e.target.closest('[data-rm]')){e.stopPropagation();return rmFromList(decodeURIComponent(location.hash.slice(7)),e.target.closest('[data-rm]').dataset.rm);}
    nav('#/s/'+c.dataset.id);
  });
}
function secT(t,cnt,hint){return `<div class="secT"><h2>${t}</h2><span class="cnt">${cnt}</span>${hint?`<span class="hint">${hint}</span>`:''}</div>`;}
function groups(sers){
  let h='';
  ORDER.forEach(k=>{
    let grp=sers.filter(s=>s.status===k);
    if(!grp.length)return;
    grp.sort((a,b)=>k==='soon'?soonList().findIndex(x=>x.id===a.id)-soonList().findIndex(x=>x.id===b.id):a.name.localeCompare(b.name,'ar'));
    const hint=k==='soon'?'رتّبها بـ ↑↓':'';
    h+=secT(LABEL[k],grp.length,hint)+grp.map(s=>serCard(s)).join('');
  });
  return h;
}
/* ---------- الصفحات ---------- */
function viewHome(){
  const m=sheikhs(),main=document.getElementById('main');
  crumb([{t:'مُطالَع'}]);
  if(q){
    const l=SER.filter(s=>lat(s.name).includes(lat(q))||lat(s.sheikh||'').includes(lat(q))).sort((a,b)=>b.done-a.done);
    main.innerHTML=secT('نتائج البحث',l.length)+l.map(s=>serCard(s)).join('')||'<div class="empty">لا نتائج.</div>';
    return bindActs(main);
  }
  let h='';
  const sn=soonList();
  if(sn.length)h+=secT('قريب البدء — بالترتيب',sn.length,'↑↓ لتغيير الأولوية')+sn.map(s=>serCard(s)).join('');
  h+=secT('قوائمي',Object.keys(lists).length);
  h+=`<div class="newlist"><input id="nlname" placeholder="اسم قائمة جديدة…"><button id="nladd">إنشاء</button></div>`;
  h+=Object.keys(lists).map(n=>`<div class="listrow" data-ln="${esc(n)}"><span class="nm">≡ ${esc(lat(n))}</span><span class="cnt2">${lists[n].length} سلسلة</span></div>`).join('');
  h+=secT('المشايخ',Object.keys(m).length);
  h+=`<div class="sgrid">`+Object.entries(m).sort((a,b)=>b[1].done-a[1].done).map(([sh,v])=>{
    const c={done:0,prog:0,soon:0,none:0};v.ser.forEach(s=>c[s.status]++);
    const pct=v.tot?Math.round(100*v.done/v.tot):0;
    return `<div class="shc" data-sh="${esc(sh)}">
      <div class="nm">${esc(lat(sh))}</div>
      <div class="nums"><div class="num"><b>${c.done}<span>/${v.ser.length}</span></b><span class="lb">سلسلة جاهزة</span></div>
      <div class="num"><b>${v.done}<span>/${v.tot||'؟'}</span></b><span class="lb">حلقة مفرّغة</span></div></div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="chips"><span class="chip done">${c.done} جاهز</span>${c.prog?`<span class="chip prog">${c.prog} جاري</span>`:''}${c.soon?`<span class="chip soon">${c.soon} قريب</span>`:''}<span class="chip none">${c.none} غير مطلوب</span></div>
    </div>`;
  }).join('')+'</div>';
  main.innerHTML=h;
  main.querySelectorAll('.shc').forEach(c=>c.onclick=()=>nav('#/sh/'+encodeURIComponent(c.dataset.sh)));
  main.querySelectorAll('.listrow').forEach(c=>c.onclick=()=>nav('#/list/'+encodeURIComponent(c.dataset.ln)));
  const nl=document.getElementById('nladd');
  if(nl)nl.onclick=()=>{const n=document.getElementById('nlname').value.trim();if(!n)return;lists[n]=lists[n]||[];saveLists();dirty=true;route();};
  bindActs(main);
}
function viewSheikh(sh){
  const v=sheikhs()[sh];if(!v)return nav('#/');
  crumb([{t:'مُطالَع',h:'#/'},{t:lat(sh)}]);
  const c={done:0,prog:0,soon:0,none:0};v.ser.forEach(s=>c[s.status]++);
  const pct=v.tot?Math.round(100*v.done/v.tot):0;
  const main=document.getElementById('main');
  main.innerHTML=`<div class="ser" style="cursor:default"><div class="ic">🎙️</div>
    <div class="mid"><div class="nm">${esc(lat(sh))}</div>
    <div class="mt"><span>${v.done}/${v.tot||'؟'} حلقة مفرّغة</span><span>${pct}% مكتمل</span></div>
    <div class="pb2"><i style="width:${pct}%"></i></div></div></div>`+groups(v.ser);
  bindActs(main);
}
function viewSeries(id){
  const s=ser(id);if(!s)return nav('#/');
  crumb([{t:'مُطالَع',h:'#/'},{t:lat(s.sheikh||''),h:'#/sh/'+encodeURIComponent(s.sheikh||'')},{t:lat(s.name.replace(/^\d+_/,''))}]);
  const main=document.getElementById('main');
  if(!s.files||!s.files.length){main.innerHTML=`<div class="empty">${s.status==='soon'?'في الطابور — لم يبدأ تفريغها بعد.':s.status==='none'?'لم تُطلب — اضغط «اطلبها» ثم حفظ.':'لا نصوص بعد.'}</div>`;return;}
  main.innerHTML=`<div class="ser" style="cursor:default"><div class="ic">${ICON[s.status]}</div>
    <div class="mid"><div class="nm">${esc(lat(s.name.replace(/^\d+_/,'')))}</div>
    <div class="mt"><span class="chip ${s.status}">${LABEL[s.status]}</span><span>${s.done}/${s.total||'؟'} حلقة</span></div></div></div>`+
    secT('الدروس المفرّغة',s.files.length)+
    s.files.map((f,i)=>`<div class="lrow" data-f="${esc(f)}"><div class="idx">${i+1}</div><div class="ln">${esc(lat(f.replace(/\.txt$/,'')))}</div><div class="go">‹</div></div>`).join('');
  main.querySelectorAll('.lrow').forEach(x=>x.onclick=()=>nav('#/l/'+id+'/'+encodeURIComponent(x.dataset.f)));
}
async function viewLesson(id,file){
  const s=ser(id);if(!s)return nav('#/');
  const main=document.getElementById('main');
  crumb([{t:'مُطالَع',h:'#/'},{t:lat(s.sheikh||''),h:'#/sh/'+encodeURIComponent(s.sheikh||'')},{t:lat(s.name.replace(/^\d+_/,'')),h:'#/s/'+id},{t:lat(file.replace(/\.txt$/,''))}]);
  main.innerHTML='<div class="readBox"><div class="empty">يُحمَّل النص…</div></div>';
  try{
    const t=await(await fetch(D+'txt/'+s.id+'/'+encodeURIComponent(file)+'?v='+Date.now())).text();
    main.innerHTML=`<div class="readBox"><div class="readHd"><div class="t">${esc(lat(file.replace(/\.txt$/,'')))}</div>
      <div class="m">${esc(lat(s.name.replace(/^\d+_/,'')))} — ${esc(lat(s.sheikh||''))}</div></div>
      <div class="rtxt">${esc(lat(t))}</div></div>`;
    window.scrollTo(0,0);
  }catch(e){main.innerHTML='<div class="readBox"><div class="empty">تعذر تحميل النص.</div></div>';}
}
function viewList(name){
  const ids=lists[name]||[];
  const sers=ids.map(ser).filter(Boolean);
  crumb([{t:'مُطالَع',h:'#/'},{t:'قائمة: '+lat(name)}]);
  const main=document.getElementById('main');
  main.innerHTML=secT('قائمة «'+esc(lat(name))+'»',sers.length)+
    (sers.map(s=>serCard(s,{rm:true})).join('')||'<div class="empty">القائمة فارغة.</div>');
  bindActs(main);
}
/* ---------- تشغيل ---------- */
async function boot(){
  SER=await(await fetch(D+'manifest.json?v='+Date.now())).json();
  const totS=SER.length,donS=SER.filter(s=>s.status==='done').length;
  const totH=SER.reduce((a,s)=>a+(s.total||0),0),donH=SER.reduce((a,s)=>a+s.done,0);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><b>${Object.keys(sheikhs()).length}</b><span>شيخاً</span></div>`+
    `<div class="stat"><b>${donS}<span style="font-size:.8rem;color:var(--dim)">/${totS}</span></b><span>سلسلة منجزة</span></div>`+
    `<div class="stat"><b>${donH}<span style="font-size:.8rem;color:var(--dim)">/${totH}</span></b><span>حلقة مفرّغة</span></div>`+
    `<div class="stat"><b>${SER.filter(s=>s.status==='soon').length}</b><span>قريب البدء</span></div>`;
  route();
  window.onhashchange=route;
  document.getElementById('q').oninput=e=>{q=e.target.value.trim();if(location.hash!=='#/')location.hash='#/';else route();};
  document.getElementById('save').onclick=save;
  document.getElementById('lclose').onclick=()=>document.getElementById('lpop').classList.remove('show');
  document.getElementById('lpop').onclick=e=>{if(e.target.id==='lpop')e.target.classList.remove('show');};
  document.getElementById('ladd').onclick=()=>{
    const n=document.getElementById('lnew').value.trim();if(!n)return;
    lists[n]=lists[n]||[];if(!lists[n].includes(addTarget))lists[n].push(addTarget);
    saveLists();dirty=true;document.getElementById('lpop').classList.remove('show');route();
  };
}
setInterval(()=>{document.getElementById('savebar').style.display=(dirty||pending.length)?'flex':'none';},400);
boot();
</script></body></html>
