<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنعَس — سجل النوم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.night{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.night .d{font-size:11px;color:var(--acc);font-weight:700}
.night .t{font-family:var(--font-ar);font-size:13px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.q{display:inline-block;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);cursor:pointer;text-align:center;line-height:26px;font-size:11px;margin-left:4px}
.q.on{background:var(--acc);border-color:var(--acc);color:#14140f;font-weight:700}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنعَس <span class="muted">— سجل النوم</span></h2>
<div class="muted">نومك يصنع يومك — سجّل متى نمت وصحوت وجودة الليلة.</div>
<div class="card"><div class="t">ليلة البارحة</div>
<div style="display:flex;gap:8px">
<div style="flex:1"><div class="muted">نمت:</div><input id="b" type="time"></div>
<div style="flex:1"><div class="muted">صحوت:</div><input id="w" type="time"></div></div>
<div class="muted" style="margin-top:9px">الجودة:</div>
<div id="qs"></div>
<button class="btn" id="ad" style="margin-top:10px">سجّل</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let N=LS('min3as',[]),q=3;
const QEM=['😴','🌙','⭐','✨','💯'];
$('#qs').innerHTML=[1,2,3,4,5].map(i=>'<span class="q" data-q="'+i+'">'+QEM[i-1]+'</span>').join('');
const paint=()=>document.querySelectorAll('[data-q]').forEach(e=>e.classList.toggle('on',+e.dataset.q===q));
paint();
$('#qs').onclick=e=>{const t=e.target.closest('[data-q]');if(t){q=+t.dataset.q;paint()}};
$('#ad').onclick=()=>{
 const b=$('#b').value,w=$('#w').value;if(!b||!w)return;
 const bm=+b.slice(0,2)*60+ +b.slice(3),wm=+w.slice(0,2)*60+ +w.slice(3);
 const dur=wm>bm?wm-bm:wm+1440-bm;
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 const ex=N.findIndex(x=>x.d===y);
 const rec={d:y,b,w,dur,q};
 if(ex>=0)N[ex]=rec;else N.unshift(rec);
 SV('min3as',N);render();
};
const fmt=m=>arN(Math.floor(m/60))+'س '+arN(m%60)+'د';
function render(){
 const week=N.filter(x=>N.indexOf(x)<7);
 const avg=week.length?Math.round(week.reduce((s,x)=>s+x.dur,0)/week.length):0;
 const avgq=week.length?(week.reduce((s,x)=>s+x.q,0)/week.length).toFixed(1):0;
 $('#stats').innerHTML='<span class="stat">ليلة الأسبوع: <b>'+fmt(avg)+'</b></span>'+
 '<span class="stat">جودة: <b>'+arN(avgq)+'/٥</b></span>'+
 '<span class="stat">ليالٍ مسجلة: <b>'+arN(N.length)+'</b></span>';
 $('#list').innerHTML=N.slice(0,10).map((x,i)=>'<div class="night"><div class="d">'+x.d+'</div>'+
 '<div class="t"><span>🌙 '+x.b+'</span><span>☀️ '+x.w+'</span><span style="color:var(--acc)">'+fmt(x.dur)+'</span><span>'+QEM[x.q-1]+'</span></div></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا ليالٍ مسجلة.</div>';
}
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="min3as" data-title="مِنعَس"></script>
</body>
</html>
