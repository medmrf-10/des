<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجس — هل تُجسّ الحديث؟</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:720px;margin:0 auto;padding:14px}
.hd{background:var(--card);border:1px solid var(--acc);border-radius:15px;padding:18px 20px;font-family:var(--font-ar);font-size:17px;line-height:2.15;text-align:center;margin:10px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px;cursor:pointer;font-family:var(--font-ar);font-size:14px;text-align:center;font-weight:700}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.no{border-color:#e07777;color:#e07777}
.rev{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin:8px 0;font-size:13px;line-height:2}
.muted{color:var(--dim);font-size:12px}
.stat{display:inline-block;background:var(--card2);border-radius:8px;padding:4px 12px;font-size:12px;margin-inline-end:7px}
h4{font-family:var(--font-ar);margin:12px 0 5px;font-size:13px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجس <span class="muted">— جسّ الحديث قبل أن تنقله</span></h2>
<div class="muted">يُعرض عليك طرفُ حديث — خمّن درجته، ثم انكشف الحكم وآراء الجرح والتعديل على أسانيده.</div>
<div id="st"></div>
<div class="hd" id="h">…</div>
<div class="opts" id="o"></div>
<div id="out"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GR=['صحيح','حسن','ضعيف','موضوع'];
let D=null,cur=null,st=JSON.parse(localStorage.getItem('mijass')||'{"n":0,"ok":0}');
async function boot(){
 const s=document.createElement('script');s.src='../hadith/analysis.js';
 await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.head.appendChild(s)});
 D=window.GIDNET}
function draw(){ $('#st').innerHTML=`<span class="stat">إصاباتك: ${st.ok.toLocaleString('ar-EG')}/${st.n.toLocaleString('ar-EG')}</span><span class="stat">${st.n?Math.round(st.ok/st.n*100):0}%</span>`}
function rnd(){
 const ks=Object.keys(D.g);
 // حديث له آراء جرح
 for(let t=0;t<200;t++){
  const g=D.g[ks[Math.floor(Math.random()*ks.length)]];
  if(g&&g.t&&g.t.length>25&&g.t.length<220&&g.j&&Object.keys(g.j).length){cur={gid:ks[0],g};return}}
 const k=ks[Math.floor(Math.random()*ks.length)];cur={gid:k,g:D.g[k]}}
function next(){
 draw();$('#out').innerHTML='';
 rnd();
 $('#h').textContent='«'+cur.g.t+'»';
 $('#o').innerHTML=GR.map(x=>`<div class="opt" data-x="${x}">${x}</div>`).join('')}
$('#o').onclick=e=>{
 const c=e.target.closest('.opt');if(!c)return;
 const real=cur.g.h||'ضعيف';
 const ok=c.dataset.x===real;
 st.n++;if(ok)st.ok++;localStorage.setItem('mijass',JSON.stringify(st));
 c.classList.add(ok?'ok':'no');
 document.querySelectorAll('.opt').forEach(o=>{
  if(o.dataset.x===real&&!ok)o.classList.add('ok');
  o.style.pointerEvents='none'});
 // آراء الجرح
 let rev='';
 let n=0;
 for(const bk of Object.keys(cur.g.j||{})){
  for(const num of Object.keys(cur.g.j[bk])){
   for(const op of cur.g.j[bk][num]){
    rev+=`<div class="rev"><span class="muted">${esc(bk)} ${num}</span><br>${esc(op)}</div>`;
    if(++n>=4)break}if(n>=4)break}if(n>=4)break}
 $('#out').innerHTML=`<h4>الحكم: <b style="color:var(--acc)">${esc(real)}</b></h4>${rev}<button class="opt" style="width:100%;margin-top:8px" onclick="nx()">الحديث التالي ←</button>`};
window.nx=next;
boot().then(next);
</script>
<script src="../shared/feedback.js" data-pid="mijass" data-title="مِجس"></script>
</body>
</html>
