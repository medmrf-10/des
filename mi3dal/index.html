<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعدَل — معدّل تعلّمك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:14px;padding:0 6px}
.b{flex:1;background:var(--card2);border-radius:3px 3px 0 0;min-height:3px;position:relative}
.b .v{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:8.5px;color:var(--acc);white-space:nowrap}
.b.today{background:var(--acc)}
.b .lb{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--dim);white-space:nowrap}
.row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعدَل <span class="muted">— معدّل تعلّمك</span></h2>
<div class="muted">أفعال تعلّمك (حفظ، مراجعة، قراءة، لعب…) لكل يوم من آخر ٣٠ يومًا — سرعتك الحقيقية.</div>
<div style="margin-top:9px"><span class="stat">متوسطك/يوم: <b id="av">٠</b></span><span class="stat">أعلى يوم: <b id="pk">٠</b></span><span class="stat">أيام نشطة: <b id="nd">٠</b></span></div>
<div class="card"><div class="t">٣٠ يومًا — كل عمود يوم</div><div class="bars" id="bars"></div></div>
<div class="card"><div class="t">أكثر مصادر نشاطك</div><div id="src"></div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const days=[];
for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
const counts=Object.fromEntries(days.map(d=>[d,0]));
const src={};
function add(day,srcN,n){
 if(!(day in counts))return;
 counts[day]+=n;src[srcN]=(src[srcN]||0)+n;
}
// مصادر يومية
Object.entries(LS('mitla3',{}).days||{}).forEach(([d,v])=>add(d,'مِطلع',(v.nw||0)+(v.done?1:0)));
Object.entries(LS('mi3wad_done',{})).forEach(([d,n])=>add(d,'مِعوَد',n));
Object.entries(LS('mutabi3',{})).forEach(([d,v])=>add(d,'مُتابِع',(v.h||0)+(v.m||0)+(v.s||0)+(v.b||0)+(v.o||0)));
Object.keys(localStorage).filter(k=>k.startsWith('misbah_')).forEach(k=>{
 const d=k.replace('misbah_','');add(d,'مِصباح',LS(k,{}).n||0);
});
Object.keys(localStorage).filter(k=>k.startsWith('mihrab_')).forEach(k=>{
 const d=k.replace('mihrab_','');add(d,'مِحراب',Object.keys(LS(k,{})).length||0);
});
Object.entries(LS('mi3tikaf',{})).forEach(([d,s])=>add(d,'مِعتكف',Math.round(s/300)));
(LS('miswad',{}).hist||[]).forEach(h=>add(h.at.slice(0,10),'مِسوَد',1));
(LS('mikhzan',[])).forEach(i=>add(i.at.slice(0,10),'مِخزَن',1));
(LS('mi3wad_q',{}))&&Object.values(LS('mi3wad_q',{})).forEach(q=>add(q.at,'مِعوَد جدولة',1));
Object.entries(LS('mizan_daily',{})).forEach(([d,v])=>add(d,'مِزن',v));
(LS('mikhtim',{})).d&&add(LS('mikhtim',{}).d,'مِختِم',3);
const vals=days.map(d=>counts[d]);
const avg=vals.reduce((a,b)=>a+b,0)/30,pk=Math.max(...vals),nd=vals.filter(v=>v>0).length;
$('#av').textContent=arN(Math.round(avg*10)/10);$('#pk').textContent=arN(pk);$('#nd').textContent=arN(nd);
$('#bars').innerHTML=vals.map((v,i)=>{
 const h=v?Math.max(5,Math.round(v/pk*125)):3;
 return '<div class="b'+(i===29?' today':'')+'" style="height:'+h+'px"><span class="v">'+(v?arN(v):'')+'</span>'+(i%5===0||i===29?'<span class="lb">'+days[i].slice(5)+'</span>':'')+'</div>';
}).join('');
$('#src').innerHTML=Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([s,c])=>'<div class="row"><span>'+s+'</span><b style="color:var(--acc)">'+arN(c)+'</b></div>').join('')||'—';
</script>
<script src="../shared/feedback.js" data-pid="mi3dal" data-title="مِعدَل"></script>
</body>
</html>
