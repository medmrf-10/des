<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>معجم مصطلحات العقيدة — مشروع العقيدة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:860px;margin:0 auto;padding:14px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:15px;width:100%}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.tcard .tt{font-size:15px;color:var(--acc);font-weight:700}
.tcard .occ{font-size:12.5px;line-height:1.9;margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}
.tcard .bk{color:var(--acc2);font-size:11.5px}
.muted{color:var(--dim);font-size:12px}
.az{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.az span{border:1px solid var(--border);border-radius:7px;padding:2px 9px;font-size:12px;cursor:pointer;background:var(--card)}
.az span.on{background:var(--acc);color:#14140f;border-color:transparent}
</style>
</head>
<body>
<h1 style="font-size:19px;margin:4px 0;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">معجم مصطلحات العقيدة والتصوف</h1>
<div class="muted">٧٣٣٢ مصطلحاً مستخرجاً آلياً من ٧٥ كتاب عقيدة وتصوف — كل مصطلح بمواضعه ونصوصه الحرفية</div>
<div style="margin:10px 0"><input id="q" placeholder="ابحث: قدرة، إيمان، كشف، وحدة الوجود…" oninput="run()"></div>
<div class="az" id="az"></div>
<div id="list"></div>
<script src="terms.js"></script>
<script>
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').trim();
const NIDX={};
for(const t in TERMS.terms){const n=norm(t);(NIDX[n]=NIDX[n]||[]).push(t)}
const LETTERS='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
let az='';
const azEl=document.getElementById('az');
azEl.innerHTML='<span class="on" data-a="">الكل</span>'+LETTERS.map(l=>`<span data-a="${l}">${l}</span>`).join('');
azEl.onclick=e=>{const s=e.target.closest('span');if(!s)return;az=s.dataset.a;
 azEl.querySelectorAll('span').forEach(x=>x.classList.toggle('on',x===s));run()};
function run(){
 const q=norm(document.getElementById('q').value);
 let hits=[];
 if(q.length>=2){
  const keys=Object.keys(NIDX).filter(k=>k.includes(q));
  hits=keys.flatMap(k=>NIDX[k]);
 }else if(az){
  hits=Object.keys(TERMS.terms).filter(t=>norm(t).startsWith(az));
 }else{
  // الشائع: الأكثر تكراراً بين الكتب
  hits=Object.entries(TERMS.terms).sort((a,b)=>b[1].length-a[1].length).slice(0,60).map(x=>x[0])}
 const list=hits.slice(0,80);
 document.getElementById('list').innerHTML=(q||az?'':'<div class="muted" style="margin-bottom:8px">أكثر المصطلحات انتشاراً بين الكتب:</div>')+
  list.map(t=>{const occ=TERMS.terms[t];
  return `<div class="tcard"><div class="tt">${esc(t)} <span class="muted" style="font-weight:400">(${occ.length.toLocaleString('ar-EG')} موضع)</span></div>${occ.slice(0,4).map(o=>`<div class="occ"><span class="bk">${esc(TERMS.books[o.b]||o.b)} · ${esc(o.a)}${o.bab?' · '+esc(o.bab):''}</span><div style="color:var(--dim);font-size:12.5px">${esc(o.q)}</div></div>`).join('')}${occ.length>4?`<div class="muted" style="margin-top:5px">+${(occ.length-4).toLocaleString('ar-EG')} موضعاً آخر — <a href="real.html" style="color:var(--acc2)">الفهرس الكامل ←</a></div>`:''}</div>`}).join('')||'<div class="muted" style="text-align:center;padding:20px">لا نتائج</div>'}
run();
</script>
<script src="../shared/feedback.js"></script>
</body>
</html>
