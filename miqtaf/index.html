<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقطف — نخب المشروع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:720px;margin:0 auto;padding:14px}
.s{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:16px;padding:14px 18px;margin-top:12px}
.s .t{font-family:var(--font-ar);font-size:16px;line-height:2.2}
.s .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:3px 10px;font-size:10.5px;color:var(--acc)}
.chip.dim{border-color:var(--border);color:var(--dim)}
.rk{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;background:var(--acc);color:#14140f;border-radius:50%;font-size:12px;font-weight:700;margin-left:7px}
.muted{color:var(--dim);font-size:12px}
.grp{color:var(--acc);font-size:13px;font-weight:700;margin-top:20px;border-bottom:1px solid var(--border);padding-bottom:7px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tab{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:var(--font-ar)}
.tab.on{background:var(--acc);color:#14140f;font-weight:700}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقطف <span class="muted">— نخب المشروع: الأكثر والأغرب والأظرف</span></h2>
<div class="muted">إحصاءات حية على الكتب الستة — لا يُخزَّن شيء، يُحسب كل مرة من الشبكة نفسها.</div>
<div class="tabs" id="tabs"></div>
<div id="out"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
function laz(){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../hadith/analysis.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
const HC={'صحيح':'var(--ok)','حسن':'var(--acc2)','ضعيف':'#e07777','موضوع':'#b33'};
const CAT=[
 ['s','أكثر روايةً عن الصحابة','الأحاديث التي رواها أكبر عدد من الصحابة'],
 ['r','أكثر تكراراً','المعاني الواردة في أكثر مواضع الكتب'],
 ['j','أكثر تخريجاً','الأحاديث التي اختُلف في حكمها أكثر'],
 ['w','أوسع انتشاراً','الموجودة في أكثر الكتب الستة'],
];
let G=null,cat='s';
function top10(f){return Object.entries(G.g).map(([k,g])=>({k,g,v:f(g)})).sort((a,b)=>b.v-a.v).slice(0,10)}
const FN={
 s:g=>g.s,
 r:g=>g.r,
 j:g=>Object.values(g.j||{}).reduce((a,b)=>a+Object.values(b).reduce((c,x)=>c+x.length,0),0),
 w:g=>Object.keys(g.w||{}).length,
};
function render(){
 const list=top10(FN[cat]);
 $('#out').innerHTML=list.map((x,i)=>{
  const hc=HC[x.g.h]||'var(--acc3)';
  return '<div class="s"><div><span class="rk">'+arN(i+1)+'</span><span class="t">'+esc(x.g.t)+'</span></div>'+
  '<div class="m"><span class="chip" style="border-color:'+hc+';color:'+hc+'">'+esc(x.g.h)+'</span>'+
  '<span class="chip">'+FN[cat](x.g).toLocaleString('ar-EG')+' '+(cat==='s'?'صحابياً':cat==='r'?'مواضع':cat==='j'?'تخريجاً':'كتب')+'</span>'+
  '<a href="../mi3na/#'+x.k+'" style="color:var(--dim);font-size:10px;align-self:center;text-decoration:none">رحلته ←</a></div></div>'}).join('');
}
$('#tabs').innerHTML=CAT.map(c=>'<button class="tab'+(c[0]===cat?' on':'')+'" data-c="'+c[0]+'">'+c[1]+'</button>').join('');
$('#tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;cat=t.dataset.c;
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));render()};
(async()=>{await laz();G=window.GIDNET;render()})();
</script>
<script src="../shared/feedback.js" data-pid="miqtaf" data-title="مِقطف"></script>
</body>
</html>
