<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>منار — ميزان أسبوعك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:760px;margin:0 auto;padding:14px}
.g{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin:8px 0}
.g .t{font-family:var(--font-ar);font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.g .t b{font-weight:600}
.g .ctl{display:flex;gap:6px;align-items:center}
.g .ctl button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--txt);cursor:pointer;font-size:14px}
.g .ctl span{min-width:60px;text-align:center;font-size:13px;color:var(--acc2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;min-height:74px}
.day .d{font-size:10px;color:var(--acc2);font-family:var(--font-ar)}
.day .u{font-size:11px;margin-top:6px;line-height:1.7}
.day.today{border-color:var(--acc);box-shadow:0 0 12px rgba(201,162,75,.25)}
.day .ck{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);margin:7px auto 0;cursor:pointer}
.day .ck.on{background:var(--ok);border-color:var(--ok)}
.muted{color:var(--dim);font-size:12px}
.tot{text-align:center;margin-top:12px;font-family:var(--font-ar);font-size:14px;color:var(--acc2)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">منار <span class="muted" style="font-weight:400;font-size:12px">— ميزان أسبوعك موزّعاً على الأيام</span></h2>
<div class="muted">حدّد أهدافك الأسبوعية — يوزّعها على أيامك ويتابع إنجاز كل يوم. الحفظ على جهازك.</div>
<div id="goals" style="margin-top:12px"></div>
<div class="tot" id="tot"></div>
<div class="days" id="days"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GOALS=[
 {k:'drus',n:'دروس مسموعة',icon:'🎧',def:7},
 {k:'wrd',n:'صفحات قرآن/مراجعة',icon:'📖',def:20},
 {k:'fiqh',n:'أبواب فقهية مقروءة',icon:'⚖️',def:10},
 {k:'en',n:'مقاطع إنجليزية',icon:'🗣',def:14},
 {k:'adhk',n:'إتمامات مسباح',icon:'📿',def:7},
 {k:'write',n:'سطور كتابة/محبر',icon:'✍️',def:5}];
const wk='minar_'+weekKey();
let ST;try{ST=JSON.parse(localStorage.getItem(wk)||'{}')}catch(e){ST={}}
if(!ST.goals){ST={goals:{},days:{}};GOALS.forEach(g=>ST.goals[g.k]=g.def)}
const save=()=>localStorage.setItem(wk,JSON.stringify(ST));
function weekKey(){const d=new Date();const day=(d.getDay()+1)%7;
 const s=new Date(d);s.setDate(d.getDate()-day);return s.toISOString().slice(0,10)}
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const todayIdx=(new Date().getDay()+1)%7;
function render(){
 $('#goals').innerHTML=GOALS.map(g=>`<div class="g"><div class="t"><b>${g.icon} ${g.n}</b>
  <span class="ctl"><button data-k="${g.k}" data-d="-1">−</button><span>${(ST.goals[g.k]||0).toLocaleString('ar-EG')} / أسبوع</span><button data-k="${g.k}" data-d="1">+</button></span></div></div>`).join('');
 $('#days').innerHTML=DAYS.map((d,i)=>{
  const dn=(ST.days[i]||{});
  const parts=GOALS.map(g=>{const need=Math.ceil((ST.goals[g.k]||0)/7);const done=dn[g.k]||0;
   return need>0?`<div class="u" data-g="${g.k}" data-d="${i}">${g.icon} ${done}/${need}</div>`:''}).join('');
  return `<div class="day ${i===todayIdx?'today':''}"><div class="d">${d}${i===todayIdx?' ●':''}</div>${parts}
  <div class="ck ${dn._done?'on':''}" data-d="${i}"></div></div>`}).join('');
 const tot=GOALS.reduce((s,g)=>s+(ST.goals[g.k]||0),0);
 $('#tot').textContent='مجموع الأسبوع: '+tot.toLocaleString('ar-EG')+' مهمة موزّعة على ٧ أيام'}
$('#goals').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 const k=b.dataset.k;ST.goals[k]=Math.max(0,(ST.goals[k]||0)+ +b.dataset.d);save();render()};
$('#days').onclick=e=>{
 const ck=e.target.closest('.ck');
 if(ck){const d=+ck.dataset.d;ST.days[d]=ST.days[d]||{};ST.days[d]._done=!ST.days[d]._done;save();render();return}
 const u=e.target.closest('.u');if(!u)return;
 const d=+u.dataset.d,g=u.dataset.g;
 ST.days[d]=ST.days[d]||{};ST.days[d][g]=(ST.days[d][g]||0)+1;save();render()};
render();
</script>
<script src="../shared/feedback.js" data-pid="minar" data-title="منار"></script>
</body>
</html>
