<style>
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.scn{background:var(--navy-2);border:1px solid var(--navy-3);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:border-color .2s}
.scn:hover{border-color:var(--gold)}
.scn .ico{font-size:38px}
.scn .nm{font-size:14px;margin-top:6px}
.scn .cnt{font-size:11px;color:var(--muted)}
.stage{background:linear-gradient(180deg,var(--navy-1),var(--navy-2));border:1px solid var(--navy-3);border-radius:16px;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;min-height:200px}
.itm{font-size:44px;text-align:center;padding:10px 4px;border-radius:12px;cursor:pointer;transition:background .15s;line-height:1}
.itm:hover{background:var(--navy-3)}
.itm.done{outline:2px solid var(--ok);outline-offset:-2px}
.itm .lbl{font-size:10px;color:var(--muted);margin-top:4px;direction:ltr}
.wcard{background:var(--navy-2);border:1px solid var(--gold);border-radius:14px;padding:16px;margin-top:12px;text-align:center}
.wcard .wen{font-size:28px;color:var(--gold);direction:ltr}
.wcard .war{font-size:18px;color:var(--gold-soft);margin-top:4px}
.wcard .wsent{font-size:15px;color:var(--muted);direction:ltr;text-align:left;margin:10px 0;line-height:1.7}
</style>
</head>
