<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دُعاء — سجلّ دعواتك</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🤲 دُعاء</h1><p class="tagline">دعواتك محفوظة على جهازك — تتبع ما تحقق منها وما هو قيد الرجاء</p></header>
<div class="wrap">
 <div class="card">
  <input id="dtxt" placeholder="اكتب دعاءك…"><button id="add" class="add">+ أضف</button>
 </div>
 <div class="seg"><button class="sg on" data-f="all">الكل</button><button class="sg" data-f="wait">قيد الرجاء</button><button class="sg" data-f="yes">تحقّقت 🤍</button></div>
 <div id="list"></div>
</div>
<script>
const LS='duaa_v1';
function ld(){try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]}}
function sv(l){localStorage.setItem(LS,JSON.stringify(l))}
let F='all';
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
 const l=ld();
 const f=l.filter(function(d){return F==='all'||(F==='yes'?d.ok:!d.ok)});
 document.getElementById('list').innerHTML=f.length?f.map(function(d){
  return '<div class="card dua'+(d.ok?' done':'')+'"><div class="dt">'+esc(d.t)+'</div><div class="dm">'+d.d+(d.ok?' · تحققت':' · قيد الرجاء')+'</div><div class="da">'+
   (d.ok?'':'<button class="ab ok" data-i="'+d.i+'">تحقّقت الحمدلله</button>')+
   '<button class="ab dl" data-i="'+d.i+'">✕</button></div></div>';
 }).join(''):'<div class="card empty">'+(F==='yes'?'لم يتحقق دعاء بعد — أدع كثيراً':'أضف دعاءك الأول')+'</div>';
 document.querySelectorAll('.ok').forEach(function(b){b.onclick=function(){
  const l2=ld();const d=l2.find(function(x){return x.i===+b.dataset.i});if(d){d.ok=true;d.d2=new Date().toISOString().slice(0,10)}sv(l2);render();
 }});
 document.querySelectorAll('.dl').forEach(function(b){b.onclick=function(){
  if(confirm('حذف هذا الدعاء؟')){sv(ld().filter(function(x){return x.i!==+b.dataset.i}));render()}
 }});
}
document.getElementById('add').onclick=function(){
 const v=document.getElementById('dtxt').value.trim();if(!v)return;
 const l=ld();l.unshift({i:Date.now(),t:v,d:new Date().toISOString().slice(0,10),ok:false});
 sv(l);document.getElementById('dtxt').value='';render();
};
document.getElementById('dtxt').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('add').click()});
document.querySelectorAll('.sg').forEach(function(b){b.onclick=function(){document.querySelectorAll('.sg').forEach(function(x){x.classList.remove('on')});b.classList.add('on');F=b.dataset.f;render()}});
render();
</script>
<script src="../shared/palette.js"></script><script src="../shared/feedback.js"></script>
</body></html>
