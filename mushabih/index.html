<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعبَر — متشابهات القرآن</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:660px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.srch{display:flex;gap:7px;margin-top:8px}
.vcur{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:13px 16px;margin-top:12px}
.vcur .nm{font-size:11px;color:var(--acc);margin-bottom:5px}
.vcur .x{font-family:var(--font-ar);font-size:16px;line-height:2.1}
.twin{display:flex;gap:11px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px;align-items:flex-start}
.twin .sc{min-width:44px;text-align:center}
.twin .sc b{display:block;font-size:15px;color:var(--acc)}
.twin .sc span{font-size:9px;color:var(--dim)}
.twin .bd{flex:1}
.twin .nm{font-size:10px;color:var(--acc2)}
.twin .x{font-family:var(--font-ar);font-size:14px;line-height:2;margin-top:3px}
.hit{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 12px;margin-top:6px;font-size:12px;cursor:pointer}
.hit:hover{border-color:var(--acc)}
.hit .s{color:var(--acc2);font-size:10px}
.hit .x{font-family:var(--font-ar);font-size:12.5px;margin-top:3px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعبَر <span class="muted">— متشابهات القرآن</span></h2>
<div class="muted">ابحث عن آية أو اخترها — ترى آياتها المتشابهة مرتبة بنسبة التطابق، لتدبر الفروق.</div>
<div class="card"><div class="t">ابحث في المصحف</div>
<div class="srch"><input id="q" placeholder="كلمات من الآية…"><button class="btn" id="go">ابحث</button></div>
<div id="hits"></div></div>
<div id="cur"></div>
<div id="twins"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
let U=null,cur=null;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
laz('../wahy/mutashabih.js','MUTA').then(u=>{U=u;$('#hits').innerHTML='<div class="muted">جاهز — '+arN(Object.keys(u.sim).length)+' آية مفهرسة.</div>'});
const nameOf=k=>U.names[k.split(':')[0]]||k;
$('#go').onclick=()=>{
 if(!U)return;
 const q=norm($('#q').value.trim());if(!q)return;
 const hits=Object.keys(U.sim).filter(k=>norm(U.sim[k][2]).includes(q)).slice(0,10);
 $('#hits').innerHTML=hits.map(k=>'<div class="hit" data-k="'+k+'"><div class="s">'+esc(nameOf(k))+'</div><div class="x">'+esc(U.sim[k][2].slice(0,120))+'…</div></div>').join('')||'<div class="muted">لا نتائج.</div>';
};
$('#hits').onclick=e=>{
 const h=e.target.closest('.hit');if(!h)return;
 pick(h.dataset.k);
};
function pick(k){
 cur=k;
 $('#cur').innerHTML='<div class="vcur"><div class="nm">'+esc(nameOf(k))+'</div><div class="x">'+esc(U.sim[k][2])+'</div></div>';
 const tw=(U.sim[k][3]||[]).slice().sort((a,b)=>b[1]-a[1]);
 $('#twins').innerHTML='<div class="card"><div class="t">المتشابهات — '+arN(tw.length)+'</div>'+
 (tw.map(([pk,sc])=>'<div class="twin"><div class="sc"><b>'+Math.round(sc*100)+'%</b><span>تطابق</span></div><div class="bd"><div class="nm">'+esc(nameOf(pk))+'</div><div class="x">'+esc(U.sim[pk]?U.sim[pk][2]:'')+'</div></div></div>').join('')||'<div class="muted">لا متشابهات مسجلة لهذه الآية.</div>')+
 '<div class="muted" style="margin-top:9px">نسبة التطابق من فهرس المتشابهات اللفظية — تدبّر ما تغيّر بين النصّين ولماذا.</div></div>';
}
$('#q').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mushabih" data-title="مِعبَر"></script>
</body>
</html>
