<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرجَم — معجمي الخاص</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
textarea{min-height:44px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.trm{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.trm .w{font-family:var(--font-ar);font-size:14px;color:var(--acc);font-weight:700}
.trm .d{font-size:12.5px;margin-top:4px;line-height:1.8}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرجَم <span class="muted">— معجمي الخاص</span></h2>
<div class="muted">مصطلحاتك الخاصة — مفاهيم صغتها أنت، أسماء لأفكارك، لغة عقلك. ابنِ معجمك الشخصي.</div>
<div class="card"><div class="t">مصطلح جديد</div>
<input id="w" placeholder="المصطلح (زحمة الأفكار، وضع الجبل…)">
<textarea id="d" placeholder="تعريفك له"></textarea>
<button class="btn" id="ad" style="margin-top:9px">أضِف للمعجم</button></div>
<div class="card"><div class="t">ابحث في معجمك</div><input id="q" placeholder="…"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let T=LS('mirjam',[]);
$('#ad').onclick=()=>{
 const w=$('#w').value.trim();if(!w)return;
 T.unshift({w,d:$('#d').value.trim(),at:Date.now()});
 SV('mirjam',T);$('#w').value=$('#d').value='';render();
};
$('#q').oninput=()=>render();
function render(){
 const q=$('#q').value.trim();
 const list=q?T.filter(x=>x.w.includes(q)||x.d.includes(q)):T;
 $('#stats').innerHTML='<span class="stat">مصطلحات: <b>'+arN(T.length)+'</b></span>'+
 (q?'<span class="stat">نتائج: <b style="color:var(--acc)">'+arN(list.length)+'</b></span>':'');
 $('#list').innerHTML=list.slice(0,20).map((x)=>{
  const gi=T.indexOf(x);
  return '<div class="trm"><div style="display:flex;gap:7px;align-items:center"><span class="w">'+esc(x.w)+'</span>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:9px;padding:3px 7px;margin-right:auto">✕</button></div>'+
  (x.d?'<div class="d">'+esc(x.d)+'</div>':'')+'</div>';
 }).join('')||'<div class="muted" style="margin-top:12px">'+(q?'لا نتائج.':'معجمك فارغ — أضِف أول مصطلح.')+'</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){T.splice(+d.dataset.d,1);SV('mirjam',T);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mirjam" data-title="مِرجَم"></script>
</body>
</html>
