<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>قرارات محمد — جولات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --card:#131a22; --card2:#1a2330; --border:#28323f;
    --txt:#eef3f8; --dim:#93a1b3; --acc:#8b7cf6; --acc2:#5ec8ff;
    --ok:#46c96d; --warn:#e0a93e; --skip:#3d4756;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; background:radial-gradient(1200px 500px at 80% -10%, rgba(139,124,246,.08), transparent), var(--bg); color:var(--txt); min-height:100vh; padding-bottom:130px}

  header{position:sticky; top:0; z-index:50; background:rgba(11,15,20,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding:16px 0 12px}
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  h1{font-size:1.2rem; font-weight:700; background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-.3px}
  .prog{font-size:.8rem; color:var(--dim); white-space:nowrap}
  .prog b{color:var(--acc2); font-size:1.05rem}
  .bar{height:6px; background:var(--card2); border-radius:99px; margin-top:10px; overflow:hidden}
  .bar>i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:99px; transition:width .5s cubic-bezier(.22,1,.36,1)}

  .filters{display:flex; gap:8px; overflow-x:auto; padding:14px 0 2px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fbtn{flex:0 0 auto; padding:7px 14px; border-radius:99px; border:1px solid var(--border); background:var(--card); color:var(--dim); font-family:inherit; font-size:.8rem; cursor:pointer; transition:all .2s}
  .fbtn.on{background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#fff; border-color:transparent; font-weight:600}
  .fbtn .n{opacity:.7; font-size:.7rem; margin-inline-start:4px}
  .queueline{display:flex; justify-content:space-between; align-items:center; padding:8px 4px 2px; font-size:.76rem; color:var(--dim)}
  .queueline b{color:var(--acc2)}

  .sec-title{margin:20px 4px 10px; font-size:.82rem; font-weight:600; color:var(--acc2); display:flex; align-items:center; gap:8px}
  .sec-title::after{content:''; flex:1; height:1px; background:var(--border)}
  .sec-title .new-dot{width:7px;height:7px;border-radius:99px;background:var(--ok);box-shadow:0 0 8px var(--ok)}

  .card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; transition:border-color .3s, transform .15s; animation:enter .45s cubic-bezier(.22,1,.36,1) both; box-shadow:0 2px 12px rgba(0,0,0,.25)}
  .card:active{transform:scale(.995)}
  @keyframes enter{from{opacity:0; transform:translateY(14px)}}
  .card.out{animation:slideout .28s ease forwards}
  @keyframes slideout{to{opacity:0; transform:translateX(-50px) scale(.94); max-height:0; margin-bottom:0; padding:0 18px; border-width:0}}
  .card.fresh{animation:pop .5s ease}
  @keyframes pop{from{transform:scale(.96); border-color:var(--acc2)}}

  .qrow{display:flex; gap:10px; align-items:flex-start; margin-bottom:14px}
  .qnum{flex:0 0 auto; min-width:28px; height:28px; border-radius:9px; background:linear-gradient(135deg,var(--card2),#202a3a); border:1px solid var(--border); color:var(--acc2); font-size:.75rem; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 7px}
  .qtxt{font-size:.97rem; font-weight:600; line-height:1.6; flex:1}
  .qtype{flex:0 0 auto; font-size:.62rem; color:var(--dim); background:var(--card2); padding:4px 9px; border-radius:7px; border:1px solid var(--border); white-space:nowrap}

  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{display:flex; align-items:center; gap:11px; padding:12px 13px; border-radius:12px; border:1px solid var(--border); background:var(--card2); cursor:pointer; font-size:.87rem; transition:all .18s; text-align:right; width:100%; color:var(--txt); font-family:inherit; line-height:1.5}
  .opt:hover{border-color:var(--acc); transform:translateX(-2px)}
  .opt .dot{flex:0 0 auto; width:17px; height:17px; border-radius:50%; border:2px solid var(--dim); transition:all .18s}
  .opt.sq .dot{border-radius:5px}
  .opt .dot.rn{background:var(--acc);border-color:var(--acc);color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  .opt.sel{border-color:var(--acc); background:rgba(139,124,246,.13); box-shadow:0 0 0 1px var(--acc) inset}
  .opt.sel .dot{background:var(--acc); border-color:var(--acc); box-shadow:0 0 0 3px rgba(139,124,246,.25)}

  .rate{display:flex; gap:6px; flex-wrap:wrap}
  .rnum{flex:1; min-width:30px; padding:11px 0; text-align:center; border-radius:10px; border:1px solid var(--border); background:var(--card2); cursor:pointer; font-size:.85rem; font-weight:600; color:var(--dim); transition:all .15s; font-family:inherit}
  .rnum.sel{background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; border-color:transparent; transform:scale(1.1); box-shadow:0 3px 12px rgba(94,200,255,.3)}

  textarea{width:100%; min-height:46px; margin-top:11px; padding:11px 13px; border-radius:12px; border:1px solid var(--border); background:var(--card2); color:var(--txt); font-family:inherit; font-size:.87rem; resize:vertical; transition:border-color .2s; line-height:1.6}
  textarea:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(139,124,246,.15)}
  textarea::placeholder{color:var(--skip); font-size:.8rem}
  .textonly textarea{margin-top:0}

  .cardfoot{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px}
  .skip{background:none; border:none; color:var(--dim); font-size:.74rem; cursor:pointer; font-family:inherit; padding:6px 9px}
  .skip:hover{color:var(--warn)}
  .ans-tag{font-size:.72rem; color:var(--ok); font-weight:600}
  .confirm{flex:0 0 auto; padding:9px 20px; border-radius:11px; border:none; font-family:inherit; font-size:.8rem; font-weight:700; cursor:pointer; background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#fff; box-shadow:0 3px 14px rgba(139,124,246,.35); transition:transform .15s}
  .confirm:active{transform:scale(.95)}
  .confirm[disabled]{opacity:.35; box-shadow:none; cursor:default}
  .confirm[hidden]{display:none}
  .rankhint{font-size:.72rem; color:var(--dim); margin-top:7px}

  footer{position:fixed; bottom:0; left:0; right:0; z-index:50; background:rgba(11,15,20,.94); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .foot-in{max-width:640px; margin:0 auto; display:flex; gap:10px}
  .bigbtn{flex:1; padding:14px; border-radius:14px; border:none; font-family:inherit; font-size:.93rem; font-weight:700; cursor:pointer; transition:all .2s}
  .send{background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#fff; box-shadow:0 4px 20px rgba(139,124,246,.35)}
  .send:active{transform:scale(.97)}
  .copy{flex:0 0 auto; padding:14px 18px; background:var(--card); color:var(--txt); border:1px solid var(--border)}

  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ok); color:#fff; padding:11px 24px; border-radius:99px; font-size:.85rem; font-weight:600; opacity:0; transition:all .3s; pointer-events:none; z-index:99; box-shadow:0 6px 24px rgba(70,201,109,.4)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .waitbox{text-align:center; padding:50px 22px; background:var(--card); border:1px dashed var(--acc); border-radius:18px; margin-top:18px}
  .waitbox .wt{font-size:1.08rem; font-weight:700; margin-bottom:10px}
  .waitbox .ws{font-size:.85rem; color:var(--dim); line-height:1.8}
  .waitbox .spin{display:inline-block; width:15px; height:15px; border:2px solid var(--acc2); border-top-color:transparent; border-radius:99px; animation:sp 1s linear infinite; vertical-align:middle; margin-inline-start:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .live{display:inline-flex; align-items:center; gap:5px; font-size:.63rem; color:var(--ok); margin-inline-start:8px; font-weight:400}
  .live i{width:6px;height:6px;border-radius:99px;background:var(--ok);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
</style>
</head>

  opts:['أبو هدهود — 33 كورساً كاملة بخرائطها وتفريغاتها', 'ثروت سامي — 6 كورسات فلاتر (مسارك الحي)', 'جاد جبردان — 4 كورسات مكتملة لديك 100%', 'د. مصطفى سعد — 5 دبلومات', 'عصام عبد النبي — ASP.NET', 'ابن سوق — بزنس']},
 {id:'a22',sec:'strategy',type:'rank',q:'رتّب أولويات بناء مكونات النسخة الأولى:',
  opts:['خط إنتاج الذرات (قصّ وتصنيف)', 'قارئ/واجهة عرض الذرات', 'تتبع الإتقان والمراجعة المتباعدة', 'مولّد بطاقات QA', 'البحث/الفهرس الدلالي', 'ابتلاع مصادر جديدة']},
 {id:'a23',sec:'content',type:'rank',q:'قيّم جاهزية كل مصدر ليكون أول كورس يدخل الإنتاج (1-5):',
  opts:['خرائط أبو هدهود + تفريغاته (33 كورساً)', 'كورسات ثروت سامي (6 فلاتر)', 'كورسات جاد الأربعة (مكتملة لديك)', 'دبلومات مصطفى سعد الخمسة', 'كورس عصام عبد النبي (ASP.NET)', 'مخزون Udemy (75 كورساً بتقدم متفاوت)']},
 {id:'a24',sec:'learn',type:'text',q:'ما الموضوع الوحيد الذي لو أُنتج اليوم كذرات مكتملة سيغطي أكبر فجوة في مسارك التعليمي؟'},
 {id:'a25',sec:'strategy',type:'text',q:'بجملة واحدة: ما الذي يجعل منصتك مختلفة جوهرياً عن مشاهدة الكورس نفسه على Udemy أو يوتيوب؟'},
];

const extra=JSON.parse(localStorage.getItem('medDecisionsExtra')||'[]');
extra.forEach(c=>{const i=QS.findIndex(q=>q.id===c.id);if(i>-1)QS[i]=Object.assign(QS[i],c);else QS.push(c);});

const state=JSON.parse(localStorage.getItem('medDecisions')||'{}');
const list=document.getElementById('list'),queueline=document.getElementById('queueline'),filtersEl=document.getElementById('filters');
const SHOW=20;
let curFilter='all',batchDoneNotified=false;

const answered=id=>{const s=state[id];if(!s)return false;const q=QS.find(x=>x.id===id);if(q&&(q.type==='multi'||q.type==='text'))return !!(s.confirmed&&((s.opts&&s.opts.length)||(s.custom&&s.custom.trim())));if(q&&q.type==='rank')return !!(s.confirmed&&s.rank&&s.rank.length===q.opts.length);return !!((s.opts&&s.opts.length)||s.rate!=null||(s.custom&&s.custom.trim()))};
const needsConfirm=q=>{const st=state[q.id]||{};return q.type==='multi'||q.type==='rank'||q.type==='text'||!!(st.custom&&st.custom.trim())};
const canConfirm=q=>{const st=state[q.id]||{};if(q.type==='multi')return !!((st.opts&&st.opts.length)||(st.custom&&st.custom.trim()));if(q.type==='rank')return !!(st.confirmed||st.rank&&st.rank.length===q.opts.length);if(q.type==='text')return !!(st.custom&&st.custom.trim());return true};
const skipped=id=>state[id]&&state[id].skipped;
const pending=()=>QS.filter(q=>!answered(q.id)&&!skipped(q.id));

function ansText(q){
  const st=state[q.id]||{},parts=[];
  if(st.skipped)return '[مُتخطّى]';
  if(st.opts&&st.opts.length)parts.push(st.opts.map(i=>q.opts?q.opts[i]:i).join(' + '));
  if(st.rank&&st.rank.length)parts.push('ترتيب: '+st.rank.map(i=>q.opts?q.opts[i]:i).join(' › '));
  if(st.rate!=null)parts.push(st.rate+'/10');
  if(st.custom&&st.custom.trim())parts.push('ملاحظة: '+st.custom.trim());
  return parts.join(' | ')||'—';
}

let sendTimer={};
function pushAns(q){
  clearTimeout(sendTimer[q.id]);
  sendTimer[q.id]=setTimeout(()=>{
    fetch(T_OUT,{method:'POST',body:`${q.id.toUpperCase()}|${q.q} ← ${ansText(q)}`}).catch(()=>{});
  },400);
}

function buildFilters(){
  const secs=SECTIONS.filter(s=>QS.some(q=>q.sec===s.id));
  const cats=[{id:'all',n:'الكل'},...secs.map(s=>({id:s.id,n:s.name}))];
  filtersEl.innerHTML=cats.map(c=>{
    const qs=c.id==='all'?QS:QS.filter(q=>q.sec===c.id);
    const left=qs.filter(q=>!answered(q.id)&&!skipped(q.id)).length;
    return `<button class="fbtn ${curFilter===c.id?'on':''}" data-f="${c.id}">${c.n}<span class="n">${left}</span></button>`;
  }).join('');
  filtersEl.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{curFilter=b.dataset.f;render()});
}

function render(freshId){
  buildFilters();
  const pAll=pending();
  const pool=curFilter==='all'?pAll:pAll.filter(q=>q.sec===curFilter);
  const vis=pool.slice(0,SHOW),reserve=pool.length-vis.length;
  const doneAll=QS.filter(q=>answered(q.id)||skipped(q.id)).length;
  queueline.innerHTML=pool.length?`أمامك الآن <b>${vis.length}</b>${reserve?` — وتبقى <b>${reserve}</b> خلفها`:''}`:`المُنجز: <b>${doneAll}</b> / ${QS.length}`;
  let html='',lastSec=null,idx=0;
  if(!vis.length)html=`<div class="waitbox"><div class="wt">خلصت الجولة — أحسنت <span class="spin"></span></div><div class="ws">ديفن استلم إجاباتك ويحللها الآن.<br>الجولة التالية تظهر هنا فور جاهزيتها — حدّث الصفحة بعد قليل.<br>العملية مستمرة حتى تقول: توقف.</div></div>`;
  vis.forEach(q=>{
    if(q.sec!==lastSec){const s=SECTIONS.find(x=>x.id===q.sec);html+=`<div class="sec-title">${s.name}${q.sec==='new'?'<span class="new-dot"></span>':''}</div>`;lastSec=q.sec;}
    const st=state[q.id]||{};
    const typeLabel={single:'اختيار واحد',multi:'تعدد',rate:'تقييم /10',text:'جواب صريح',rank:'ترتيب أولويات'}[q.type];
    html+=`<div class="card ${answered(q.id)?'done':''} ${freshId===q.id?'fresh':''} ${q.type==='text'?'textonly':''}" id="c-${q.id}" style="animation-delay:${Math.min(idx*40,400)}ms">
      <div class="qrow"><span class="qnum">${q.id.toUpperCase()}</span><div class="qtxt">${q.q}</div><span class="qtype">${typeLabel}</span></div>`;
    if(q.type==='single'||q.type==='multi'){
      html+='<div class="opts">'+q.opts.map((o,i)=>{
        const sel=(st.opts||[]).includes(i)?'sel':'';
        return `<button class="opt ${q.type==='multi'?'sq':''} ${sel}" data-q="${q.id}" data-i="${i}"><span class="dot"></span>${o}</button>`;
      }).join('')+'</div>';
    }else if(q.type==='rate'){
      html+='<div class="rate">'+Array.from({length:10},(_,i)=>`<button class="rnum ${st.rate===i+1?'sel':''}" data-q="${q.id}" data-r="${i+1}">${i+1}</button>`).join('')+'</div>';
    }else if(q.type==='rank'){
      html+='<div class="opts">'+q.opts.map((o,i)=>{
        const ord=(st.rank||[]).indexOf(i);
        return `<button class="opt rankopt ${ord>-1?'sel':''}" data-q="${q.id}" data-i="${i}"><span class="dot ${ord>-1?'rn':''}">${ord>-1?ord+1:''}</span>${o}</button>`;
      }).join('')+`</div><div class="rankhint">اضغط الخيارات بترتيب أولويتك — 1 الأهم · رتّبت ${(st.rank||[]).length} من ${q.opts.length}${st.rank&&st.rank.length<q.opts.length?' — أكمل الكل ثم أكّد':''} · الضغط على مرتّب يحذفه</div>`;
    }
    html+=`<textarea data-q="${q.id}" placeholder="${q.type==='text'?'جوابك الصريح هنا — أكمل ثم اضغط تأكيد':'جواب حر / ملاحظة إضافية...'}">${st.custom||''}</textarea>
      <div class="cardfoot"><button class="skip" data-q="${q.id}">تخطي الآن</button>
      <button class="confirm" data-q="${q.id}" ${needsConfirm(q)?'':'hidden'} ${canConfirm(q)?'':'disabled'}>تأكيد ✓</button>
      <span class="ans-tag">${answered(q.id)?'مُجاب ✓':''}</span></div></div>`;
    idx++;
  });
  list.innerHTML=html;
  bind();updateBar();
}

function checkRound(){
  const p=pending();
  if(p.length===0&&!batchDoneNotified){
    batchDoneNotified=true;
    fetch(T_OUT,{method:'POST',headers:{Title:'انتهت الجولة'},body:`ROUND_DONE|أنجز ${QS.length} بطاقة — جاهز للجولة التالية`}).catch(()=>{});
  }
  if(p.length>0)batchDoneNotified=false;
}

let lastBatch=+(localStorage.getItem('medDecisionsBatch')||0);
function maybeSendBatch(){
  const doneQ=QS.filter(q=>answered(q.id));
  const n=Math.floor(doneQ.length/10)*10;
  if(n>0&&n>lastBatch){lastBatch=n;localStorage.setItem('medDecisionsBatch',n);
    const body='BATCH_'+n+'|'+doneQ.slice(n-10,n).map(q=>q.id.toUpperCase()+':'+ansText(q)).join(' || ');
    fetch(T_OUT,{method:'POST',headers:{Title:'حزمة '+n},body}).catch(()=>{});
    toast('وصلت عند ديفن — الحزمة '+n+' ✓');
  }
}

function dismiss(id,fn){
  const el=document.getElementById('c-'+id);
  fn();
  maybeSendBatch();
  if(el){el.classList.add('out');setTimeout(()=>{render();checkRound();},260);}
  else{render();checkRound();}
}

function bind(){
  list.querySelectorAll('.opt:not(.rankopt)').forEach(b=>b.onclick=()=>{
    const q=QS.find(x=>x.id===b.dataset.q),i=+b.dataset.i;
    if(q.type==='multi'){
      const st=state[q.id]=state[q.id]||{};
      st.opts=st.opts||[];st.opts=st.opts.includes(i)?st.opts.filter(x=>x!==i):[...st.opts,i];
      st.skipped=false;save();render();return;
    }
    const st0=state[q.id];
    if(st0&&st0.custom&&st0.custom.trim()){
      const st=state[q.id]=state[q.id]||{};st.opts=[i];st.skipped=false;save();render();return;
    }
    dismiss(q.id,()=>{
      const st=state[q.id]=state[q.id]||{};
      st.opts=[i];st.skipped=false;save();pushAns(q);
    });
  });
  list.querySelectorAll('.rankopt').forEach(b=>b.onclick=()=>{
    const q=QS.find(x=>x.id===b.dataset.q),i=+b.dataset.i,st=state[q.id]=state[q.id]||{};
    st.rank=st.rank||[];
    st.rank=st.rank.includes(i)?st.rank.filter(x=>x!==i):[...st.rank,i];
    st.skipped=false;save();render();
  });
  list.querySelectorAll('.confirm').forEach(b=>b.onclick=()=>{
    const q=QS.find(x=>x.id===b.dataset.q);
    dismiss(q.id,()=>{
      const st=state[q.id]=state[q.id]||{};st.confirmed=true;st.skipped=false;save();pushAns(q);
    });
  });
  list.querySelectorAll('.rnum').forEach(b=>b.onclick=()=>{
    const q=QS.find(x=>x.id===b.dataset.q),st0=state[q.id];
    if(st0&&st0.custom&&st0.custom.trim()){
      const st=state[q.id]=state[q.id]||{};st.rate=+b.dataset.r;st.skipped=false;save();render();return;
    }
    dismiss(q.id,()=>{
      const st=state[q.id]=state[q.id]||{};st.rate=+b.dataset.r;st.skipped=false;save();pushAns(q);
    });
  });
  list.querySelectorAll('textarea').forEach(t=>{t.oninput=()=>{
    const q=QS.find(x=>x.id===t.dataset.q),st=state[q.id]=state[q.id]||{};st.custom=t.value;if(t.value.trim())st.skipped=false;save();updateBar();
    const card=document.getElementById('c-'+t.dataset.q),b=card&&card.querySelector('.confirm');
    if(b){b.hidden=!needsConfirm(q);b.disabled=!canConfirm(q);}
  };});
  list.querySelectorAll('.skip').forEach(b=>b.onclick=()=>{
    const q=QS.find(x=>x.id===b.dataset.q);
    dismiss(q.id,()=>{
      const st=state[q.id]=state[q.id]||{};st.skipped=true;save();pushAns(q);
    });
  });
}

function save(){localStorage.setItem('medDecisions',JSON.stringify(state));}
function updateBar(){
  const done=QS.filter(q=>answered(q.id)).length,sk=QS.filter(q=>skipped(q.id)).length;
  document.getElementById('dn').textContent=done+sk;
  document.getElementById('tt').textContent=QS.length;
  document.getElementById('bar').style.width=((done+sk)/QS.length*100)+'%';
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

function addCard(c){
  if(!c||!c.id)return;
  if(c.del){const i=QS.findIndex(q=>q.id===c.del);if(i>-1)QS.splice(i,1);
    const ex=extra.findIndex(q=>q.id===c.del);if(ex>-1)extra.splice(ex,1);
    localStorage.setItem('medDecisionsExtra',JSON.stringify(extra));render();return;}
  if(!c.q)return;
  const i=QS.findIndex(q=>q.id===c.id);
  if(i>-1)QS[i]=Object.assign(QS[i],c);else QS.push(c);
  const ex=extra.findIndex(q=>q.id===c.id);
  if(ex>-1)extra[ex]=c;else extra.push(c);
  localStorage.setItem('medDecisionsExtra',JSON.stringify(extra));
  toast('وصلت بطاقة جديدة: '+c.id.toUpperCase());render(c.id);
}
fetch(T_IN+'/json?poll=1&since=1w',{headers:{Accept:'application/json'}})
  .then(r=>r.text()).then(t=>t.split('\n').filter(Boolean).forEach(l=>{
    try{const m=JSON.parse(l);if(m.event==='message'&&m.message)addCard(JSON.parse(m.message));}catch(e){}
  })).catch(()=>{});
try{
  const es=new EventSource(T_IN+'/sse');
  es.onopen=()=>document.getElementById('liveTag').style.display='inline-flex';
  es.onmessage=e=>{try{addCard(JSON.parse(JSON.parse(e.data).message));}catch(x){}};
  es.onerror=()=>document.getElementById('liveTag').style.display='none';
}catch(e){}

render();
</script>
</body>
</html>
