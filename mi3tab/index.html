<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَب — العتبة الدنيا</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.th{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.th .h{font-family:var(--font-ar);font-size:13px;display:flex;justify-content:space-between}
.th .full{color:var(--dim);font-size:11px;margin-top:4px}
.th .min{color:var(--ok);font-size:12px;font-weight:700;margin-top:4px}
.th .st{display:flex;gap:7px;margin-top:8px;align-items:center}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0b0f1a}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَب <span class="muted">— العتبة الدنيا</span></h2>
<div class="muted">حدّد لكل عادة «أصغر نسخة» ليومٍ رديء: آية واحدة لا صفحة. قاعدة اليوم غير الصِّفري — العتبة تُنجز دائماً.</div>
<div class="card"><div class="t">عادة + عتبتها</div>
<input id="h" placeholder="العادة الكاملة (ورد صفحة)">
<input id="m" placeholder="عتبتها الدنيا (آية واحدة)">
<button class="btn" id="ad" style="margin-top:9px">أضف</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let H=LS('mi3tab',[]);
const today=()=>new Date().toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const h=$('#h').value.trim(),m=$('#m').value.trim();if(!h||!m)return;
 H.push({h,m,done:{}});SV('mi3tab',H);$('#h').value=$('#m').value='';render();
};
function render(){
 const t=today();
 const doneToday=H.filter(x=>x.done&&x.done[t]==='full').length, minToday=H.filter(x=>x.done&&x.done[t]==='min').length;
 $('#stats').innerHTML='<span class="stat">عادات: <b>'+arN(H.length)+'</b></span>'+
 '<span class="stat">اليوم كاملاً: <b>'+arN(doneToday)+'</b></span>'+
 '<span class="stat">عتبة فقط: <b>'+arN(minToday)+'</b></span>'+
 '<span class="stat">صفر: <b>'+arN(H.length-doneToday-minToday)+'</b></span>';
 $('#list').innerHTML=H.map((x,i)=>{
  const st=x.done&&x.done[t];
  return '<div class="th"><div class="h"><span>'+esc(x.h)+'</span>'+
  '<button class="btn ghost" data-d="'+i+'" style="padding:3px 8px;color:var(--acc2)">✕</button></div>'+
  '<div class="full">الكاملة: '+esc(x.h)+' · العتبة: '+esc(x.m)+'</div>'+
  '<div class="min">✓ العتبة: '+esc(x.m)+'</div>'+
  '<div class="st">'+
  '<span class="chk'+(st==='full'?' on':'')+'" data-f="'+i+'">✓</span><span class="muted" style="font-size:11px">كاملة</span>'+
  '<span class="chk'+(st==='min'?' on':'')+'" data-m="'+i+'" style="border-color:var(--acc)">½</span><span class="muted" style="font-size:11px">عتبة</span>'+
  '</div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا عادات — أضف الأولى.</div>';
}
$('#list').onclick=e=>{
 const f=e.target.closest('[data-f]'),m=e.target.closest('[data-m]'),d=e.target.closest('[data-d]');
 if(d){H.splice(+d.dataset.d,1);SV('mi3tab',H);render();return}
 const i=f?+f.dataset.f:m?+m.dataset.m:-1;if(i<0)return;
 const t=today(),mode=f?'full':'min';
 H[i].done=H[i].done||{};
 H[i].done[t]=H[i].done[t]===mode?undefined:mode;
 SV('mi3tab',H);render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3tab" data-title="مِعتَب"></script>
</body>
</html>
