<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقصَد — مقاصد يومك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
select,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:7px 11px;font-family:var(--font-ar);font-size:12px}
.goal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 15px;margin-top:8px}
.goal .hd{display:flex;justify-content:space-between;align-items:center}
.goal .nm{font-family:var(--font-ar);font-size:13.5px}
.goal .tgt{font-size:11px;color:var(--dim)}
.bar{height:8px;background:var(--card2);border-radius:4px;margin-top:8px;overflow:hidden}
.bar .f{height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.goal .pc{font-size:11px;color:var(--acc);margin-top:4px}
.goal.done{border-color:var(--acc);background:rgba(212,175,55,.07)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقصَد <span class="muted">— مقاصد يومك</span></h2>
<div class="muted">حدّد مقصدًا لكل أداة اليوم — الموقع يقيس تقدّمك تلقائيًا من نشاطك فيها.</div>
<div style="margin-top:9px"><span class="stat">مقاصد اليوم: <b id="tg">٠</b></span><span class="stat">مكتمل: <b id="dn">٠</b></span></div>
<div class="card"><div class="t">أضف مقصدًا</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
<select id="tool"></select><input type="number" id="amt" min="1" value="3" style="width:60px">
<button class="btn" id="add">+</button></div></div>
<div id="goals"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
const TOOLS={
 'مِطلع (حديث)':{u:'../mitla3/',cur:()=>(LS('mitla3',{}).days||{})[today()]?.done?1:(LS('mitla3',{}).days||{})[today()]?.nw||0},
 'مِجلس (صفحات)':{u:'../majlis/',cur:()=>{const m=LS('majlis',{});return Object.values(m).reduce((a,b)=>a+b.length,0)}},
 'مِحفل (مسائل)':{u:'../mihfil/',cur:()=>LS('mihfil',{}).n||0},
 'مِصباح (ورد)':{u:'../misbah/',cur:()=>LS('misbah_'+today(),{}).n||0},
 'مِرتّل (آيات)':{u:'../murattil/',cur:()=>Object.keys(LS('murattil',{})).length},
 'مِقرأة (بطاقات)':{u:'../miqra/',cur:()=>Object.keys(LS('miq_cards',{})).length},
 'مِعوَد (مراجعات)':{u:'../mi3wad/',cur:()=>(LS('mi3wad_done',{})[today()]||0)},
 'مِعتكف (دقائق)':{u:'../mi3tikaf/',cur:()=>Math.round((LS('mi3tikaf',{})[today()]||0)/60)},
 'مِقتَحَم (ألعاب)':{u:'../miqtaham/',cur:()=>LS('miqtaham',{}).n||0},
 'مِسوَد (كتابات)':{u:'../miswad/',cur:()=>(LS('miswad',{}).hist||[]).filter(h=>h.at.slice(0,10)===today()).length},
 'الإنجليزية (درس)':{u:'../english/',cur:()=>Object.keys(LS('en_listen',{})).length},
 'البرمجة (درس)':{u:'../prog/',cur:()=>Object.keys(LS('prog_v1',{})).length},
};
$('#tool').innerHTML=Object.keys(TOOLS).map(t=>'<option>'+t+'</option>').join('');
let G=LS('miqsad',{date:today(),goals:[]});
if(G.date!==today())G={date:today(),goals:[]};
function cur(t){try{return TOOLS[t]?.cur()||0}catch(e){return 0}}
function render(){
 $('#tg').textContent=arN(G.goals.length);
 $('#dn').textContent=arN(G.goals.filter(g=>cur(g.t)>=g.a).length);
 $('#goals').innerHTML=G.goals.map((g,i)=>{
  const c=cur(g.t),pc=Math.min(100,Math.round(c/g.a*100)),done=c>=g.a;
  return '<div class="goal'+(done?' done':'')+'"><div class="hd"><span class="nm">'+esc(g.t)+'</span><span><a href="'+TOOLS[g.t].u+'" style="color:var(--acc);font-size:11.5px;text-decoration:none">افتح ←</a> <span data-i="'+i+'" class="rm" style="cursor:pointer;color:var(--dim);font-size:11px">✕</span></span></div><div class="tgt">'+arN(g.a)+' — أنجزت '+arN(c)+'</div><div class="bar"><div class="f" style="width:'+pc+'%"></div></div><div class="pc">'+arN(pc)+'٪'+(done?' — تم ✓':'')+'</div></div>';
 }).join('')||'<div class="muted" style="margin-top:10px">لا مقاصد اليوم — أضف واحدًا أعلاه.</div>';
}
$('#add').onclick=()=>{
 const t=$('#tool').value,a=+$('#amt').value||1;
 G.goals.push({t,a});SV('miqsad',G);render();
};
$('#goals').onclick=e=>{
 const r=e.target.closest('.rm');if(!r)return;
 G.goals.splice(+r.dataset.i,1);SV('miqsad',G);render();
};
setInterval(render,5000);render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="miqsad" data-title="مِقصَد"></script>
</body>
</html>
