<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحرَك — سجل الحركة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.it{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px;display:flex;gap:10px;align-items:center}
.it .k{font-size:20px}
.it .x{flex:1;font-family:var(--font-ar);font-size:13px}
.it .m{font-size:11px;color:var(--dim)}
.it .v{font-family:var(--font-ui);font-size:13px;color:var(--ok);font-weight:700}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.hist{display:flex;gap:6px;margin-top:10px;justify-content:center}
.hd{width:34px;text-align:center}
.hd .b{height:60px;background:var(--card2);border-radius:7px;position:relative;overflow:hidden}
.hd .b i{position:absolute;bottom:0;width:100%;background:var(--ok)}
.hd .d{font-size:9px;color:var(--dim);margin-top:4px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحرَك <span class="muted">— سجل الحركة</span></h2>
<div class="muted">البدن أمانة — ٣٠ دقيقة حركة يومياً هدفك. سجّل كل نشاط.</div>
<div class="card"><div class="t">نشاط</div>
<select id="k"><option value="مشي">🚶 مشي</option><option value="جري">🏃 جري</option><option value="تمارين">💪 تمارين</option><option value="سباحة">🏊 سباحة</option><option value="دراجة">🚴 دراجة</option><option value="كرة">⚽ كرة</option><option value="أخرى">⭐ أخرى</option></select>
<input id="m" type="number" placeholder="الدقائق">
<button class="btn" id="ad" style="margin-top:9px">سجّل</button></div>
<div id="stats"></div>
<div class="card"><div class="t">آخر ٧ أيام</div><div class="hist" id="hist"></div></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let E=LS('mihrak',[]);
const ICONS={'مشي':'🚶','جري':'🏃','تمارين':'💪','سباحة':'🏊','دراجة':'🚴','كرة':'⚽','أخرى':'⭐'};
const GOAL=30;
const today=()=>new Date().toISOString().slice(0,10);
const byDay=()=>{const r={};E.forEach(x=>{const d=new Date(x.at).toISOString().slice(0,10);r[d]=(r[d]||0)+x.m});return r};
$('#ad').onclick=()=>{
 const m=+$('#m').value;if(!m)return;
 E.unshift({k:$('#k').value,m,at:Date.now()});SV('mihrak',E);$('#m').value='';render();
};
function render(){
 const bd=byDay(),tn=bd[today()]||0;
 let streak=0,d=new Date(Date.now()-864e5);
 for(;;){if((bd[d.toISOString().slice(0,10)]||0)>=GOAL){streak++;d=new Date(d-864e5)}else break}
 $('#stats').innerHTML='<span class="stat">اليوم: <b style="color:'+(tn>=GOAL?'var(--ok)':'var(--acc2)')+'">'+arN(tn)+'/'+arN(GOAL)+'د</b></span>'+
 '<span class="stat">أيام ≥٣٠د متتالية: <b style="color:var(--ok)">'+arN(streak)+'</b></span>'+
 '<span class="stat">أنشطة: <b>'+arN(E.length)+'</b></span>';
 const hist=[];
 for(let i=6;i>=0;i--){const dd=new Date(Date.now()-i*864e5);const k=dd.toISOString().slice(0,10);hist.push({c:bd[k]||0,dow:dd.toLocaleDateString('ar-EG',{weekday:'short'})})}
 $('#hist').innerHTML=hist.map(h=>'<div class="hd"><div class="b"><i style="height:'+Math.min(100,h.c/GOAL*100)+'%"></i></div><div class="d">'+h.dow+'</div></div>').join('');
 $('#list').innerHTML=E.slice(0,10).map((x,i)=>{
  const gi=E.indexOf(x);
  return '<div class="it"><span class="k">'+(ICONS[x.k]||'⭐')+'</span><span class="x">'+esc(x.k)+'</span>'+
  '<span class="v">'+arN(x.m)+'د</span><span class="m">'+new Date(x.at).toLocaleDateString('ar-EG')+'</span>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);padding:4px 8px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا حركة مسجلة — ابدأ بمشي ١٠ دقائق.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){E.splice(+d.dataset.d,1);SV('mihrak',E);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mihrak" data-title="مِحرَك"></script>
</body>
</html>
