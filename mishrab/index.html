<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشرب — ميلك المذهبي</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px}
.pie{display:flex;height:26px;border-radius:13px;overflow:hidden;margin-top:14px;border:1px solid var(--border)}
.pie div{transition:.3s}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lg{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:8px;padding:5px 11px;font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-size:14px;line-height:2}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.btn{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:8px 15px;font-family:var(--font-ar);font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.muted{color:var(--dim);font-size:12px}
.verdict{background:var(--card);border:1px solid var(--acc2);border-radius:12px;padding:12px 16px;margin-top:12px;font-size:13px;line-height:2}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشرب <span class="muted">— إلى أي مذهب يميل قلبك</span></h2>
<div class="muted">تُعرض عليك مسائل من كتب الفقه — تختار القول الأقرب لقلبك، وبعد جولات يظهر مِشربك. ليس انتماءً — مرآة ميلك العلمي.</div>
<div class="verdict" id="vd" style="display:none"></div>
<div class="pie" id="pie" style="display:none"></div>
<div class="legend" id="lg" style="display:none"></div>
<div class="card" id="q"><div class="muted">يُحمّل…</div></div>
<div style="margin-top:11px"><button class="btn" onclick="reset()">↺ إعادة العدّ</button></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MC={h:['حنفي','#5ba8f5'],m:['مالكي','#c9a24b'],s:['شافعي','#46c96d'],b:['حنبلي','#e08f8f'],o:['آخر','#8b7cf6']};
function laz(){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../fiqh_reader/masail.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
let M=null,cur=null;
const tally=()=>JSON.parse(localStorage.getItem('mishrab')||'{"h":0,"m":0,"s":0,"b":0,"o":0,"n":0}');
const sv=t=>localStorage.setItem('mishrab',JSON.stringify(t));
async function pick(){
 await laz();M=window.MASAIL;
 const ks=Object.keys(M).filter(k=>M[k].u&&M[k].u.length>=1);
 const k=ks[Math.floor(Math.random()*ks.length)];
 cur={k,b:M[k]};
 const u=cur.b.u[Math.floor(Math.random()*cur.b.u.length)];
 cur.u=u;
 const mc=MC[cur.b.m]||MC.o;
 $('#q').innerHTML='<div class="t">'+esc(cur.b.n)+'</div>'+
 '<div class="muted" style="margin-top:5px">'+esc(cur.b.a||'')+' — <b style="color:'+mc[1]+'">'+mc[0]+'</b></div>'+
 '<div class="t" style="margin-top:9px;font-size:13px;color:var(--txt)">'+esc(u.t.slice(0,500))+'</div>'+
 '<div class="muted" style="margin-top:8px">هل يوافق هذا القول ميلَك؟</div>'+
 '<div class="btns"><button class="btn" data-v="yes">يوافقني</button><button class="btn" data-v="no">لا يوافقني</button><button class="btn" data-v="skip">تخطّي</button></div>';
 $('#q').onclick=e=>{const b=e.target.closest('.btn');if(!b)return;vote(b.dataset.v)};
 showTally();
}
function vote(v){
 if(v==='skip'){pick();return}
 const t=tally();
 const code=MC[cur.b.m]?cur.b.m:'o';
 t['n_'+code]=(t['n_'+code]||0)+1;
 if(v==='yes'){t[code]=(t[code]||0)+1}
 t.n++;
 sv(t);
 $('#q').innerHTML='<div class="t">'+esc(cur.b.n)+'</div>'+
 '<div class="muted" style="margin-top:6px">'+(v==='yes'?'سُجّلت موافقتك في مِشربك':'سُجّلت مخالفتك')+' — '+esc((MC[code]||MC.o)[0])+'</div>'+
 '<button class="btn" style="margin-top:10px" onclick="pick()">التالي ←</button>';
 $('#q').onclick=null;
 showTally();
}
function showTally(){
 const t=tally();const tot=Math.max(1,t.h+t.m+t.s+t.b+t.o);
 if(t.n<3){$('#vd').style.display='none';$('#pie').style.display='none';$('#lg').style.display='none';
  $('#vd').innerHTML='';return}
 $('#pie').style.display='flex';$('#lg').style.display='flex';$('#vd').style.display='block';
 $('#pie').innerHTML=Object.entries(MC).filter(([k])=>t[k]>0).map(([k,v])=>
  '<div style="width:'+(t[k]/tot*100)+'%;background:'+v[1]+'" title="'+v[0]+'"></div>').join('');
 $('#lg').innerHTML=Object.entries(MC).filter(([k])=>t[k]>0).map(([k,v])=>
  '<span class="lg"><span class="dot" style="background:'+v[1]+'"></span>'+v[0]+' '+t[k]+'</span>').join('');
 const top=Object.entries(MC).filter(([k])=>k!=='o'&&t['n_'+k]>0).sort((a,b)=>(t[b[0]]/t['n_'+b[0]])-(t[a[0]]/t['n_'+a[0]]))[0];
 const lean=top&&(t[top[0]]/t['n_'+top[0]])>=0.5?('مِشربك يميل إلى <b style="color:'+top[1][1]+'">'+top[1][0]+'</b> — تقبل '+Math.round(t[top[0]]/t['n_'+top[0]]*100)+'٪ من أقواله في '+t['n_'+top[0]].toLocaleString('ar-EG')+' عرضاً.'):
  'مِشربك متوازن حتى الآن — '+t.n.toLocaleString('ar-EG')+' عرضاً، أكثر ليتضح الميل.';
 $('#vd').innerHTML=lean+' <span class="muted">(يُسجَّل قبولك وردّك)</span>';
}
window.pick=pick;window.reset=()=>{sv({"h":0,"m":0,"s":0,"b":0,"o":0,"n":0});pick()};
pick();
</script>
<script src="../shared/feedback.js" data-pid="mishrab" data-title="مِشرب"></script>
</body>
</html>
