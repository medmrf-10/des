<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعطَر — عطر المعروف</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.kind{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px;display:flex;gap:10px;align-items:center}
.kind .x{font-family:var(--font-ar);font-size:13px;flex:1}
.kind .dt{font-size:10px;color:var(--dim)}
.chip2{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:7px 13px;margin:3px;font-size:11.5px;cursor:pointer}
.chip2:hover{border-color:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعطَر <span class="muted">— عطر المعروف</span></h2>
<div class="muted">«كل معروف صدقة» — سجّل لطائف اليوم الصغيرة قبل أن تنساها.</div>
<div class="card"><div class="t">معروف اليوم</div>
<div id="chips"></div>
<input id="x" placeholder="أو اكتب معروفاً آخر…">
<button class="btn" id="ad" style="margin-top:9px">سجّله</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let K=LS('mi3atr',[]);
const IDEAS=['ابتسامة','دعاء لأخ','إماطة أذى','مساعدة صغيرة','كلمة طيبة','سقيا ماء','إهداء شيء','صلة رحم','نصيحة','صبر على أذى'];
$('#chips').innerHTML=IDEAS.map(i=>'<span class="chip2" data-c="'+i+'">'+i+'</span>').join('');
$('#chips').onclick=e=>{
 const c=e.target.closest('[data-c]');if(!c)return;
 add(c.dataset.c);
};
$('#ad').onclick=()=>{const v=$('#x').value.trim();if(v){add(v);$('#x').value=''}};
$('#x').addEventListener('keydown',e=>{if(e.key==='Enter')$('#ad').click()});
function add(x){
 K.unshift({x,at:Date.now()});SV('mi3atr',K);render();
}
const today=()=>new Date().toISOString().slice(0,10);
function streak(){
 let s=0,d=new Date();
 for(;;){const k=d.toISOString().slice(0,10);
  if(K.some(e=>new Date(e.at).toISOString().slice(0,10)===k)){s++;d=new Date(d-864e5)}else if(s===0&&k===today()){d=new Date(d-864e5);continue}else break}
 return s;
}
function render(){
 const t=K.filter(e=>new Date(e.at).toISOString().slice(0,10)===today()).length;
 $('#stats').innerHTML='<span class="stat">اليوم: <b>'+arN(t)+'</b></span>'+
 '<span class="stat">المجموع: <b>'+arN(K.length)+'</b></span>'+
 '<span class="stat">سلسلة اللطف: <b style="color:var(--ok)">'+arN(streak())+'</b></span>';
 $('#list').innerHTML=K.slice(0,14).map(e=>'<div class="kind"><span class="x">🌸 '+esc(e.x)+'</span>'+
 '<span class="dt">'+new Date(e.at).toLocaleDateString('ar-EG')+'</span></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا معروف مسجلاً — ابدأ بابتسامة.</div>';
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3atr" data-title="مِعطَر"></script>
</body>
</html>
