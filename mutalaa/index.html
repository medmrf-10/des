<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a"><title>مُطالَع — قارئ التفريغات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{min-height:100dvh;padding:20px clamp(10px,3vw,30px) 60px}
.wrap{max-width:1180px;margin:0 auto}
.hd{text-align:center;margin:20px 0 14px}
.hd h1{font-size:clamp(1.4rem,4vw,2rem);color:var(--acc);margin:0}
.hd .sub{color:var(--dim);font-size:.84rem;margin-top:8px;line-height:1.9;max-width:760px;margin-inline:auto}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:.74rem;color:var(--dim)}
.stat b{color:var(--acc);font-size:.95rem;display:block;text-align:center}
.bar{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.bar input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-family:inherit;font-size:.9rem;padding:10px 16px}
.bar input:focus{outline:none;border-color:var(--acc)}
.savebtn{background:var(--acc);color:#0b0f1a;border:none;border-radius:10px;padding:10px 20px;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:14px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;max-height:76vh;overflow:auto}
.scard{border-radius:8px;padding:8px 10px;cursor:pointer;margin-bottom:4px}
.scard:hover{background:var(--card2)}
.scard.on{background:var(--card2);outline:1px solid var(--acc)}
.scard .sn{font-size:.84rem;line-height:1.5}
.scard.on .sn{color:var(--acc);font-weight:700}
.scard .sm{display:flex;gap:8px;font-size:.64rem;color:var(--dim);margin-top:3px;flex-wrap:wrap}
.sheikh{border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:10px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-inline-start:3px solid var(--acc);transition:transform .15s,box-shadow .15s,border-color .15s}
.sheikh:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.sheikh .shn{font-size:1.02rem;font-weight:800;color:var(--acc);margin-bottom:8px}
.sheikh .shnums{display:flex;gap:14px;margin-bottom:8px}
.sheikh .shnums .num{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:.66rem;color:var(--dim);text-align:center}
.sheikh .shnums .num b{display:inline;color:var(--txt);font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.sheikh .shnums .num span{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums}
.sheikh .shm{display:flex;gap:8px;font-size:.66rem;color:var(--dim);margin-top:8px;flex-wrap:wrap;align-items:center}
.sheikh .pb{height:5px}
.sheikh .pb i{background:linear-gradient(90deg,var(--acc),var(--ok))}
.pb{height:4px;background:var(--card2);border-radius:99px;margin-top:5px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ok);border-radius:99px}
.kt{font-size:.6rem;border-radius:99px;padding:1px 8px;border:1px solid}
.kt.done{color:var(--ok);border-color:var(--ok)}
.kt.prog{color:var(--acc3);border-color:var(--acc3)}
.kt.soon{color:var(--acc);border-color:var(--acc)}
.kt.none{color:var(--dim);border-color:var(--border)}
.sec{margin:10px 0 4px;font-size:.72rem;font-weight:700;color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:4px}
.sec b{color:var(--acc)}
.mv,.rmb,.addb{background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--dim);cursor:pointer;font-size:.7rem;padding:2px 8px;font-family:inherit}
.mv:hover,.rmb:hover{border-color:var(--acc);color:var(--acc)}
.addb{border-color:var(--acc);color:var(--acc)}
.addb:hover{background:var(--acc);color:#0b0f1a}
.reqbtn{background:var(--card2);border:1px solid var(--acc);border-radius:6px;color:var(--acc);cursor:pointer;font-size:.68rem;padding:3px 10px;font-family:inherit}
.reqbtn.pend{border-color:var(--ok);color:var(--ok)}
.ordnum{color:var(--acc);font-size:.72rem;font-weight:700;min-width:20px;text-align:center}
.srow{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid var(--border);font-size:.82rem}
.listcard{border-radius:10px;padding:10px 14px;cursor:pointer;margin-bottom:8px;background:var(--card2);border:1px dashed var(--acc);display:flex;align-items:center;gap:10px}
.listcard:hover{border-style:solid}
.listcard .ln{flex:1;font-size:.9rem;font-weight:700;color:var(--acc)}
.newlist{display:flex;gap:6px;margin:6px 0 10px}
.newlist input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:inherit;font-size:.8rem;padding:7px 12px}
.newlist button{background:var(--acc);color:#0b0f1a;border:none;border-radius:8px;padding:7px 14px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.lpop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
.lpop.show{display:flex}
.lpin{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:18px;width:min(340px,90vw);max-height:70vh;overflow:auto}
.lpt{color:var(--acc);font-weight:700;font-size:.9rem;margin-bottom:10px;text-align:center}
.lopt{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;border:1px solid var(--border);margin-bottom:5px;display:flex;justify-content:space-between}
.lopt:hover{border-color:var(--acc);background:var(--card2)}
.lnew{display:flex;gap:6px;margin-top:10px}
.lnew input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:inherit;font-size:.82rem;padding:8px 12px}
.lnew button,.lclose{background:var(--acc);color:#0b0f1a;border:none;border-radius:8px;padding:8px 14px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.lclose{background:var(--card2);color:var(--dim);width:100%;margin-top:8px}
.reader{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;min-height:300px}
.reader .nt{color:var(--acc);font-size:1.15rem;font-weight:700;margin-bottom:4px}
.reader .nid{color:var(--dim);font-size:.68rem;margin-bottom:12px}
.lsrow{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;border-radius:8px;font-size:.82rem;border-bottom:1px solid var(--border)}
.lsrow:hover{background:var(--card2)}
.txt{font-family:var(--font-ar);font-size:1.1rem;line-height:2.2;white-space:pre-wrap;padding:8px 4px}
.placeholder{color:var(--dim);text-align:center;padding:70px 20px;font-size:.86rem}
.bk{color:var(--acc);font-size:.78rem;cursor:pointer;margin-bottom:10px;display:inline-block}
.notice{position:fixed;bottom:20px;inset-inline:20px;background:var(--card);border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:10px 16px;font-size:.8rem;text-align:center;display:none;z-index:9}
</style></head><body>
<div class="wrap">
  <div class="hd">
    <h1>مُطالَع — قارئ التفريغات</h1>
    <div class="sub">اختر الشيخ أولاً — ثم تجد سلاسله مقسومة: جاهز للقراءة، جاري تفريغه، قريب البدء (تُرتّبه ↑↓)، وغير مطلوب (تطلب منه). وزر + يضيف أي سلسلة لقوائمك.</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="bar"><input id="q" placeholder="ابحث باسم سلسلة أو شيخ…"><button class="savebtn" id="save">حفظ</button></div>
  <div class="grid">
    <div class="side" id="side"><div class="placeholder">يُحمَّل الفهرس…</div></div>
    <div class="reader" id="reader"><div class="placeholder">اختر شيخاً لعرض سلاسله.</div></div>
  </div>
</div>
<div class="lpop" id="lpop"><div class="lpin">
  <div class="lpt">أضف السلسلة إلى قائمة</div>
  <div id="lopts"></div>
  <div class="lnew"><input id="lnew" placeholder="اسم قائمة جديدة…"><button id="ladd">إنشاء وإضافة</button></div>
  <button class="lclose" id="lclose">إغلاق</button>
</div></div>
<div class="notice" id="notice"></div>
<script>
const D='data/',NT='https://ntfy.sh/des_mutalaa_q9';
const LABEL={done:'جاهز',prog:'جاري التفريغ',soon:'قريب البدء',none:'غير مطلوب'};
const ORDER=['done','prog','soon','none'];
const AR='٠١٢٣٤٥٦٧٨٩';
function lat(s){return String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d));}
let SER=[],cur=null,q='',curSheikh=null,curList=null,selFile=null,addTarget=null;
let soonOrder=JSON.parse(localStorage.getItem('mut_soon_order')||'[]');
let pending=JSON.parse(localStorage.getItem('mut_pending')||'[]');
let lists=JSON.parse(localStorage.getItem('mut_lists')||'{}');
const saveLists=()=>localStorage.setItem('mut_lists',JSON.stringify(lists));
async function boot(){
  SER=await(await fetch(D+'manifest.json?v='+Date.now())).json();
  document.getElementById('stats').innerHTML=
    `<div class="stat"><b>${new Set(SER.map(s=>s.sheikh)).size}</b>شيوخ</div>`+
    `<div class="stat"><b>${SER.filter(s=>s.status==='done').length}/${SER.length}</b>سلاسل منجزة</div>`+
    `<div class="stat"><b>${SER.reduce((a,s)=>a+s.done,0)}/${SER.reduce((a,s)=>a+(s.total||0),0)}</b>حلقات منجزة</div>`+
    ORDER.map(k=>`<div class="stat"><b>${SER.filter(s=>s.status===k).length}</b>${LABEL[k]}</div>`).join('');
  render();
  document.getElementById('q').oninput=e=>{q=e.target.value.trim();render();};
  document.getElementById('save').onclick=save;
  document.getElementById('lclose').onclick=()=>document.getElementById('lpop').classList.remove('show');
  document.getElementById('ladd').onclick=()=>{
    const n=document.getElementById('lnew').value.trim();if(!n)return;
    lists[n]=lists[n]||[];if(!lists[n].includes(addTarget))lists[n].push(addTarget);
    saveLists();document.getElementById('lpop').classList.remove('show');render();
  };
}
function sheikhs(){
  const m={};
  SER.forEach(s=>{const sh=s.sheikh||'غير محدد';m[sh]=m[sh]||{done:0,ser:[]};m[sh].done+=s.done;m[sh].ser.push(s);});
  return m;
}
function soonList(){
  let l=SER.filter(s=>s.status==='soon');
  if(l.some(s=>s.ord!==undefined&&s.ord<900)){l=[...l].sort((a,b)=>(a.ord??999)-(b.ord??999));}
  else if(soonOrder.length){const ord=Object.fromEntries(soonOrder.map((id,i)=>[id,i]));l=[...l].sort((a,b)=>(ord[a.id]??999)-(ord[b.id]??999));}
  return l;
}
function moveSoon(id,dir){
  const l=soonList().map(s=>s.id);
  const i=l.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=l.length)return;
  [l[i],l[j]]=[l[j],l[i]];
  soonOrder=l;localStorage.setItem('mut_soon_order',JSON.stringify(l));render();
}
function toggleReq(id){
  const i=pending.indexOf(id);
  if(i<0)pending.push(id);else pending.splice(i,1);
  localStorage.setItem('mut_pending',JSON.stringify(pending));render();
}
function openAdd(id){
  addTarget=id;
  document.getElementById('lopts').innerHTML=Object.keys(lists).map(n=>
    `<div class="lopt" data-ln="${n}"><span>${lat(n)}</span><span style="color:var(--dim);font-size:.7rem">${lists[n].length} سلسلة</span></div>`).join('')
    ||'<div class="placeholder" style="padding:10px">لا قوائم بعد — أنشئ واحدة أدناه.</div>';
  document.querySelectorAll('.lopt').forEach(o=>o.onclick=()=>{
    const n=o.dataset.ln;if(!lists[n].includes(addTarget))lists[n].push(addTarget);
    saveLists();document.getElementById('lpop').classList.remove('show');render();});
  document.getElementById('lnew').value='';
  document.getElementById('lpop').classList.add('show');
}
function rmFromList(id){
  lists[curList]=lists[curList].filter(x=>x!==id);
  if(!lists[curList].length)delete lists[curList];
  saveLists();if(!lists[curList]){curList=null;}render();
}
function serRow(s){
  let ctl='';
  if(s.status==='soon'){const ix=soonList().findIndex(x=>x.id===s.id);ctl=`<span class="ordnum">${ix+1}</span><button class="mv" data-mv="-1" data-id="${s.id}">↑</button><button class="mv" data-mv="1" data-id="${s.id}">↓</button>`;}
  if(s.status==='none')ctl=`<button class="reqbtn${pending.includes(s.id)?' pend':''}" data-id="${s.id}">${pending.includes(s.id)?'✓ مطلوبة':'اطلبها'}</button>`;
  ctl+=`<button class="addb" data-add="${s.id}" title="أضف لقائمة">+</button>`;
  return `<div class="scard${cur&&cur.id===s.id?' on':''}" data-id="${s.id}">
    <div class="srow">${ctl}<span class="sn" style="flex:1">${lat(s.name.replace(/^\d+_/,''))}</span></div>
    <div class="sm"><span class="kt ${s.status}">${LABEL[s.status]}</span><span>${s.done}/${s.total||'؟'} درساً</span></div>
    ${s.total&&s.status!=='none'?`<div class="pb"><i style="width:${Math.round(100*s.done/s.total)}%"></i></div>`:''}
  </div>`;
}
function render(){
  const side=document.getElementById('side');
  if(q){
    const l=SER.filter(s=>lat(s.name).includes(lat(q))||lat(s.sheikh||'').includes(lat(q))).sort((a,b)=>b.done-a.done);
    side.innerHTML=`<span class="bk">→ رجوع</span>`+(l.map(serRow).join('')||'<div class="placeholder">لا نتائج.</div>');
    side.querySelector('.bk').onclick=()=>{q='';document.getElementById('q').value='';render();};
  } else if(curList){
    const ids=lists[curList]||[];
    const sers=ids.map(id=>SER.find(s=>s.id===id)).filter(Boolean);
    side.innerHTML=`<span class="bk">→ رجوع</span><div class="sec" style="border:none;font-size:.9rem;color:var(--acc)">قائمة: ${lat(curList)} — ${sers.length} سلسلة</div>`+
      sers.map(s=>`<div class="scard${cur&&cur.id===s.id?' on':''}" data-id="${s.id}">
        <div class="srow"><button class="rmb" data-rm="${s.id}">✕</button><span class="sn" style="flex:1">${lat(s.name.replace(/^\d+_/,''))}</span><button class="addb" data-add="${s.id}">+</button></div>
        <div class="sm"><span class="kt ${s.status}">${LABEL[s.status]}</span><span>${lat(s.sheikh||'')}</span><span>${s.done}/${s.total||'؟'}</span></div>
      </div>`).join('')||'<div class="placeholder">القائمة فارغة.</div>';
    side.querySelector('.bk').onclick=()=>{curList=null;render();};
  } else if(curSheikh){
    const sers=sheikhs()[curSheikh].ser;
    let html=`<span class="bk">→ كل المشايخ</span><div class="sec" style="border:none;font-size:.9rem;color:var(--acc)">${lat(curSheikh)}</div>`;
    ORDER.forEach(k=>{
      const grp=sers.filter(s=>s.status===k).sort((a,b)=>k==='soon'?(a.ord??999)-(b.ord??999):a.name.localeCompare(b.name,'ar'));
      if(!grp.length)return;
      html+=`<div class="sec">${LABEL[k]} — <b>${grp.length}</b></div>`+grp.map(serRow).join('');
    });
    side.innerHTML=html;
    side.querySelector('.bk').onclick=()=>{curSheikh=null;cur=null;render();};
  } else {
    const m=sheikhs();
    let lhtml=`<div class="sec">قوائمي — <b>${Object.keys(lists).length}</b></div>
      <div class="newlist"><input id="nlname" placeholder="اسم قائمة جديدة…"><button id="nladd">إنشاء</button></div>`+
      Object.keys(lists).map(n=>`<div class="listcard" data-ln="${n}"><span class="ln">${lat(n)}</span><span style="color:var(--dim);font-size:.7rem">${lists[n].length} سلسلة</span></div>`).join('')+
      `<div class="sec" style="margin-top:14px">المشايخ — <b>${Object.keys(m).length}</b></div>`;
    lhtml+=Object.entries(m).sort((a,b)=>b[1].done-a[1].done).map(([sh,v])=>{
      const c={done:0,prog:0,soon:0,none:0};let tot=0;v.ser.forEach(s=>{c[s.status]++;tot+=s.total||0;});
      const pct=tot?Math.round(100*v.done/tot):0;
      return `<div class="sheikh" data-sh="${sh}"><div class="shn">${lat(sh)}</div>
        <div class="shnums"><div class="num">السلاسل<br><b>${c.done}</b><span>/${v.ser.length}</span></div><div class="num">الحلقات<br><b>${v.done}</b><span>/${tot||'؟'}</span></div></div>
        <div class="pb"><i style="width:${pct}%"></i></div>
        <div class="shm"><span>${pct}% مكتمل</span><span class="kt done">${c.done} جاهز</span>${c.prog?`<span class="kt prog">${c.prog} جاري</span>`:''}${c.soon?`<span class="kt soon">${c.soon} قريب</span>`:''}<span class="kt none">${c.none} غير مطلوب</span></div></div>`;
    }).join('');
    side.innerHTML=lhtml;
    side.querySelectorAll('.sheikh').forEach(c=>c.onclick=()=>{curSheikh=c.dataset.sh;cur=null;render();});
    side.querySelectorAll('.listcard').forEach(c=>c.onclick=()=>{curList=c.dataset.ln;cur=null;render();});
    const nl=document.getElementById('nladd');
    if(nl)nl.onclick=()=>{const n=document.getElementById('nlname').value.trim();if(!n)return;lists[n]=lists[n]||[];saveLists();render();};
  }
  side.querySelectorAll('.scard').forEach(c=>c.onclick=e=>{
    if(e.target.closest('.mv'))return moveSoon(e.target.dataset.id,+e.target.dataset.mv);
    if(e.target.closest('.reqbtn'))return toggleReq(e.target.closest('.reqbtn').dataset.id);
    if(e.target.closest('.addb'))return openAdd(e.target.closest('.addb').dataset.add);
    if(e.target.closest('.rmb'))return rmFromList(e.target.closest('.rmb').dataset.rm);
    cur=SER.find(s=>s.id===c.dataset.id);selFile=null;render();showSeries();});
}
function showSeries(){
  const r=document.getElementById('reader'),s=cur;
  if(!s.files.length){r.innerHTML=`<div class="nt">${lat(s.name.replace(/^\d+_/,''))}</div><div class="placeholder">${s.status==='soon'?'في الطابور — لم يبدأ تفريغها بعد.':s.status==='none'?'لم تُطلب — اضغط «اطلبها» ثم حفظ.':'لا نصوص.'}</div>`;return;}
  r.innerHTML=`<div class="nt">${lat(s.name.replace(/^\d+_/,''))}</div>
    <div class="nid">${s.done}/${s.total} درساً — ${lat(s.sheikh||'')}</div>`+
    s.files.map(f=>`<div class="lsrow" data-f="${f}">${lat(f.replace(/\.txt$/,''))}</div>`).join('');
  r.querySelectorAll('.lsrow').forEach(x=>x.onclick=()=>{selFile=x.dataset.f;showLesson();});
  r.scrollTop=0;
}
async function showLesson(){
  const r=document.getElementById('reader'),s=cur;
  r.innerHTML=`<span class="bk">→ رجوع لدروس السلسلة</span><div class="placeholder">يُحمَّل النص…</div>`;
  r.querySelector('.bk').onclick=showSeries;
  try{
    const t=await(await fetch(D+'txt/'+s.id+'/'+encodeURIComponent(selFile)+'?v='+Date.now())).text();
    r.innerHTML=`<span class="bk">→ رجوع لدروس السلسلة</span>
      <div class="nt">${lat(selFile.replace(/\.txt$/,''))}</div>
      <div class="nid">${lat(s.name.replace(/^\d+_/,''))} — ${lat(s.sheikh||'')}</div>
      <div class="txt">${lat(t).replace(/</g,'&lt;')}</div>`;
    r.querySelector('.bk').onclick=showSeries;
    r.scrollTop=0;
  }catch(e){r.innerHTML=`<span class="bk">→ رجوع</span><div class="placeholder">تعذر تحميل النص.</div>`;r.querySelector('.bk').onclick=showSeries;}
}
async function save(){
  const payload={kind:'order',ids:soonList().map(s=>s.id),requests:pending,lists,t:Date.now()};
  pending.forEach(id=>{const s=SER.find(x=>x.id===id);if(s&&s.status==='none')s.status='soon';});
  pending=[];localStorage.setItem('mut_pending','[]');
  try{await fetch(NT,{method:'POST',body:JSON.stringify(payload)});}catch(e){}
  render();
  const n=document.getElementById('notice');
  n.textContent=`حُفظ الترتيب والطلبات والقوائم — وصل الفريق وسيبدأ تفريغ المطلوبة.`;
  n.style.display='block';setTimeout(()=>n.style.display='none',4000);
}
boot();
</script></body></html>
