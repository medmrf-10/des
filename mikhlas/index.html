<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِخلَص — ميزان النية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.int{display:flex;gap:9px;margin-top:10px}
.int div{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 8px;text-align:center;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.int div.on{border-color:var(--acc);color:var(--acc)}
.log{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:9px}
.log .nm{font-family:var(--font-ar);font-size:13px}
.log .meta{font-size:10.5px;color:var(--dim);margin-top:5px;display:flex;gap:9px}
.tag{font-size:10px;padding:2px 9px;border-radius:9px;border:1px solid}
.t3{color:var(--ok);border-color:var(--ok)}
.t2{color:var(--acc);border-color:var(--acc)}
.t1{color:var(--acc2);border-color:var(--acc2)}
.bar{height:5px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden;display:flex}
.bar>div{height:100%}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِخلَص <span class="muted">— ميزان النية</span></h2>
<div class="muted">سجّل عملاً فعلته — وقِّن نيتك بصدق: لله خالصاً أم مشوباً.</div>
<div class="card"><div class="t">عمل اليوم</div>
<input id="nm" placeholder="صليت جماعة، نشرت درساً، ساعدت جاراً…">
<div class="int" id="ints">
<div data-v="3" class="on">لله خالصاً</div>
<div data-v="2">غالبه لله</div>
<div data-v="1">فيه حظ نفس</div>
<div data-v="0">صريح للناس</div>
</div>
<button class="btn" id="add" style="margin-top:10px">سجّل بصدق</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let D=LS('mikhlas',{date:today(),log:[]});
if(D.date!==today()){D={date:today(),log:[]};SV('mikhlas',D)}
const NAMES=['صريح للناس','فيه حظ نفس','غالبه لله','لله خالصاً'];
let sel=3;
document.querySelectorAll('#ints div').forEach(d=>d.onclick=()=>{
 document.querySelectorAll('#ints div').forEach(x=>x.classList.remove('on'));d.classList.add('on');sel=+d.dataset.v;
});
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 D.log.unshift({n,v:sel});
 SV('mikhlas',D);$('#nm').value='';render();
};
function render(){
 const counts=[0,0,0,0];D.log.forEach(l=>counts[l.v]++);
 const tot=D.log.length||1;
 $('#stats').innerHTML='<span class="stat">أعمال اليوم: <b>'+arN(D.log.length)+'</b></span>'+
 '<span class="stat">خالص/غالب: <b>'+arN(counts[3]+counts[2])+'</b></span>';
 $('#list').innerHTML='<div class="bar" style="margin-top:12px">'+
 '<div style="width:'+(counts[3]/tot*100)+'%;background:var(--ok)"></div>'+
 '<div style="width:'+(counts[2]/tot*100)+'%;background:var(--acc)"></div>'+
 '<div style="width:'+(counts[1]/tot*100)+'%;background:var(--acc2)"></div></div>'+
 '<div class="muted" style="margin-top:7px;font-size:10.5px">خالص '+arN(counts[3])+' · غالب '+arN(counts[2])+' · حظ نفس '+arN(counts[1])+' · للناس '+arN(counts[0])+'</div>'+
 D.log.map((l,i)=>'<div class="log"><div class="nm">'+esc(l.n)+'</div><div class="meta"><span class="tag t'+l.v+'">'+NAMES[l.v]+'</span><button class="btn" data-d="'+i+'" style="background:none;color:var(--dim);padding:2px 6px;font-size:10px;margin-right:auto">✕</button></div></div>').join('');
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d){D.log.splice(+d.dataset.d,1);SV('mikhlas',D);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mikhlas" data-title="مِخلَص"></script>
</body>
</html>
