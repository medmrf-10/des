<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسند — مسند الصحابة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:820px;margin:0 auto;padding:14px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:11px 15px;font-family:var(--font-ar);font-size:14px;box-sizing:border-box}
.inp:focus{outline:none;border-color:var(--acc)}
.rl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rw{border:1px solid var(--border);border-radius:9px;padding:5px 12px;cursor:pointer;font-size:12.5px;background:var(--card)}
.rw:hover{border-color:var(--acc)}
.rw b{color:var(--acc);font-size:10px;margin-inline-start:4px}
.h{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin:6px 0;font-family:var(--font-ar);font-size:14px;line-height:1.95}
.h .m{font-size:10.5px;color:var(--dim);display:block;margin-top:5px}
.h a{color:var(--acc3);text-decoration:none}
.muted{color:var(--dim);font-size:12px}
.stat{display:inline-block;background:var(--card2);border-radius:8px;padding:3px 10px;font-size:11px;margin:3px 4px 0 0}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسند <span class="muted">— مسند كل صحابي</span></h2>
<div class="muted">اختر صحابياً ترى كل الأحاديث التي وردت في أسانيدها اسمه عبر الكتب الستة.</div>
<input class="inp" id="q" placeholder="اسم الصحابي… (مثلاً: أبو هريرة)" autofocus>
<div class="rl" id="rl"></div>
<div id="st"></div>
<div id="out"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
let R=null,G=null;
async function boot(){
 const s1=document.createElement('script');s1.src='../hadith/rawi.js';
 const s2=document.createElement('script');s2.src='../hadith/analysis.js';
 await Promise.all([new Promise((ok,bad)=>{s1.onload=ok;s1.onerror=bad;document.head.appendChild(s1)}),
  new Promise((ok,bad)=>{s2.onload=ok;s2.onerror=bad;document.head.appendChild(s2)})]);
 R=window.RAWI.rawi;G=window.GIDNET.g}
function search(){
 const q=norm($('#q').value.trim());if(q.length<2){$('#rl').innerHTML='';return}
 const hits=Object.keys(R).filter(r=>(R[r].gs||[]).includes(1)&&norm(R[r].t).includes(q))
  .sort((a,b)=>(R[b].c||0)-(R[a].c||0)).slice(0,15);
 $('#rl').innerHTML=hits.map(r=>`<span class="rw" data-r="${r}">${esc(R[r].t)}<b>${(R[r].c||0).toLocaleString('ar-EG')}</b></span>`).join('')}
$('#q').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(search,300)};
$('#rl').onclick=e=>{
 const c=e.target.closest('.rw');if(!c)return;show(c.dataset.r)};
function show(rid){
 const nm=R[rid].t;
 // اجمع الأحاديث التي فيها اسمه في أي سند
 const hits=[];
 for(const gid of Object.keys(G)){
  const n=G[gid].n||{};
  for(const bk of Object.keys(n)){
   if(n[bk].includes(+rid)||n[bk].includes(rid)){hits.push(gid);break}}
  if(hits.length>=400)break}
 const books={};
 $('#st').innerHTML=`<span class="stat">${hits.length.toLocaleString('ar-EG')} حديثاً في أسانيده</span><span class="stat">${esc(nm)}</span>`;
 $('#out').innerHTML=hits.slice(0,80).map(gid=>{const g=G[gid];
  const bks=Object.keys(g.w||{}).map(b=>b+':'+(g.w[b][0]||'')).join(' · ');
  return `<div class="h">«${esc(g.t)}»<span class="m">${esc(g.h)} · ${bks} · <a href="../hadith/matn.html#${gid}">تتبع ←</a></span></div>`}).join('')||'<div class="muted" style="padding:10px">لا أحاديث مسندة له في الفهرس</div>'}
boot();
</script>
<script src="../shared/feedback.js" data-pid="musnad" data-title="مِسند"></script>
</body>
</html>
