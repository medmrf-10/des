<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسهَر — ساهر لماذا؟</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.night{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:16px;text-align:center;margin-top:11px;font-family:var(--font-ar)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.rw{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin-top:6px;display:flex;gap:9px;align-items:center;font-size:12px}
.rw .k{color:var(--acc)}
.rw .dt{color:var(--dim);font-size:10px;margin-right:auto}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسهَر <span class="muted">— ساهر لماذا؟</span></h2>
<div class="muted">افتحها عندما تسهر — سجّل لماذا سهرت (عمل، تفكير، هاتف، قلق، قرار). أنماط سهرك تفضح ما يشتغل داخلك.</div>
<div class="card"><div class="t">سهرة الليلة</div>
<select id="rs"><option value="">لماذا سهرت؟</option><option value="عمل">عمل</option><option value="تفكير/قلق">تفكير/قلق</option><option value="هاتف">هاتف/تصفح</option><option value="قرار">قرار معلّق</option><option value="طقس عبادة">طقس عبادة</option><option value="ضيوف/اجتماع">ضيوف/اجتماع</option><option value="أرق">أرق بلا سبب</option><option value="أخرى">أخرى</option></select>
<input id="nt" placeholder="ملاحظة (اختياري)">
<button class="btn" id="ad" style="margin-top:9px">سجّل السهرة</button></div>
<div id="now"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let S=LS('mishar',[]);
const h=new Date().getHours();
$('#now').innerHTML=h>=23||h<5?'<div class="night">🌙 الساعة '+h+' — نم يا '+esc('محمد')+'.</div>':'';
$('#ad').onclick=()=>{
 const r=$('#rs').value;if(!r)return;
 S.unshift({r,nt:$('#nt').value.trim(),at:Date.now()});
 SV('mishar',S);$('#nt').value='';render();
};
function render(){
 const byR={};S.forEach(x=>byR[x.r]=(byR[x.r]||0)+1);
 const top=Object.entries(byR).sort((a,b)=>b[1]-a[1])[0];
 $('#stats').innerHTML='<span class="stat">سهرات: <b>'+arN(S.length)+'</b></span>'+
 (top?'<span class="stat">أكثر سبب: <b style="color:var(--acc2)">'+esc(top[0])+' ('+arN(top[1])+'×)</b></span>':'');
 $('#list').innerHTML=S.slice(0,10).map((x)=>{
  return '<div class="rw"><span class="k">'+esc(x.r)+'</span><span>'+(x.nt?esc(x.nt):'')+'</span>'+
  '<span class="dt">'+new Date(x.at).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+'</span></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا سهرات مسجلة.</div>';
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mishar" data-title="مِسهَر"></script>
</body>
</html>
