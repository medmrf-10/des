<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشرَح — شارح الآية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:8px 12px;font-family:var(--font-ar);font-size:12px;width:48%}
input[type=number]{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:8px 12px;font-family:var(--font-ar);font-size:12px;width:48%}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.ayah{font-family:var(--font-ar);font-size:19px;line-height:2.4;text-align:center;padding:16px;color:var(--acc)}
.wd{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 10px;margin:3px;font-family:var(--font-ar);font-size:14px}
.vx{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-top:7px}
.vx .src{font-size:10.5px;color:var(--acc2);margin-bottom:3px}
.vx .txt{font-family:var(--font-ar);font-size:13px;line-height:2}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشرَح <span class="muted">— شارح الآية</span></h2>
<div class="muted">آية ← كلماتها ومتشابهاتها وأحاديث تلاقيها — تتبّع عِلمها.</div>
<div class="card"><div class="t">اختر آية</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<select id="s"></select><input type="number" id="a" min="1" value="1" placeholder="آية">
<button class="btn" id="go">اشرح</button></div></div>
<div id="res"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const STOP=new Set('من على إلى عن في أن إن وما ما هو هي كان كانت رب الله يا لا أو ثم الذين الذي عند لكم له لها لنا إياكم إياهم عبادهم أولئكم'.split(' '));
let U,G;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../wahy/mutashabih.js','MUTA'),laz('../hadith/analysis.js','GIDNET')]).then(([u,g])=>{
 U=u;G=g;
 $('#s').innerHTML=Object.entries(U.names).sort((a,b)=>a[0]-b[0]).map(([s,n])=>'<option value="'+s+'">'+esc(n)+'</option>').join('');
});
$('#go').onclick=()=>{
 const s=+$('#s').value,a=+$('#a').value;if(!s||!a||!U)return;
 const k=s+':'+a;
 const v=U.sim[k];
 if(!v){$('#res').innerHTML='<div class="muted" style="margin-top:12px">لا توجد هذه الآية.</div>';return}
 const txt=v[2],ws=norm(txt).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
 // أحاديث تلاقيها
 let hd=[];
 if(G)Object.values(G.g).forEach(h=>{
  const hs=ws.filter(w=>norm(h.t).includes(w));
  if(hs.length>=2)hd.push({t:h.t,h:h.h,s:h.s,kw:hs});
 });
 hd.sort((a,b)=>b.s-a.s);hd=hd.slice(0,6);
 // متشابهات
 const parts=(v[3]||[]).slice(0,6).map(([pk,sc])=>{
  const ps=U.sim[pk];
  return ps?{t:ps[2],n:U.names[pk.split(':')[0]],sc}:null;
 }).filter(Boolean);
 $('#res').innerHTML=
 '<div class="card"><div class="ayah">'+esc(txt)+'</div><div class="muted" style="text-align:center">'+esc(U.names[s])+' · آية '+arN(a)+'</div>'+
 '<div style="margin-top:14px"><div class="t">كلماتها المميزة</div><div>'+ws.slice(0,12).map(w=>'<span class="wd">'+esc(w)+'</span>').join('')+'</div></div></div>'+
 (parts.length?'<div class="card"><div class="t">متشابهاتها ('+arN(parts.length)+')</div>'+parts.map(p=>'<div class="vx"><div class="src">'+esc(p.n)+' — تشابه '+arN(Math.round(p.sc*100))+'٪</div><div class="txt">'+esc(p.t)+'</div></div>').join('')+'</div>':'')+
 (hd.length?'<div class="card"><div class="t">أحاديث تلاقيها ('+arN(hd.length)+')</div>'+hd.map(h=>'<div class="vx"><div class="src">'+esc(h.h)+' · كلمات مشتركة: '+h.kw.join('، ')+'</div><div class="txt">'+esc(h.t.slice(0,180))+'…</div></div>').join('')+'</div>':'');
};
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mishrah" data-title="مِشرَح"></script>
</body>
</html>
