<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقطَف — سِلّة المكاسب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.w{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px;display:flex;gap:10px;align-items:center}
.w .ic{font-size:18px}
.w .t{flex:1;font-family:var(--font-ar);font-size:13px}
.w .m{font-size:10px;color:var(--dim)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:16px;text-align:center;margin-top:11px;font-family:var(--font-ar)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقطَف <span class="muted">— سِلّة المكاسب</span></h2>
<div class="muted">كل يوم فيه مكسب — درس أتممته، شيء أصلحته، خير أسديته. سجّله قبل نومك.</div>
<div class="card"><div class="t">مكسب</div>
<select id="k"><option value="علم">📖 علم</option><option value="عمل">⚒ عمل</option><option value="صحة">💪 صحة</option><option value="علاقة">🤝 علاقة</option><option value="مال">💰 مال</option><option value="دين">🕌 دين</option><option value="أخرى">⭐ أخرى</option></select>
<input id="t" placeholder="ما المكسب؟">
<button class="btn" id="ad" style="margin-top:9px">قطِفه</button></div>
<div id="banner"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let W=LS('miqtaf',[]);
const ICONS={'علم':'📖','عمل':'⚒','صحة':'💪','علاقة':'🤝','مال':'💰','دين':'🕌','أخرى':'⭐'};
const today=()=>new Date().toISOString().slice(0,10);
const day=t=>new Date(t).toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const t=$('#t').value.trim();if(!t)return;
 W.unshift({t,k:$('#k').value,at:Date.now()});SV('miqtaf',W);$('#t').value='';render();
};
function render(){
 const tn=W.filter(x=>day(x.at)===today());
 $('#banner').innerHTML='<div class="banner">قطفت اليوم <b style="color:var(--acc)">'+arN(tn.length)+'</b> مكسب'+(tn.length?'':' — ابحث عن أوله')+'</div>';
 const days=new Set(W.map(x=>day(x.at))).size;
 const byK={};W.forEach(x=>byK[x.k]=(byK[x.k]||0)+1);
 const top=Object.entries(byK).sort((a,b)=>b[1]-a[1])[0];
 $('#stats').innerHTML='<span class="stat">مكاسب: <b>'+arN(W.length)+'</b></span>'+
 '<span class="stat">أيام حصدت فيها: <b>'+arN(days)+'</b></span>'+
 (top?'<span class="stat">أخصب مجال: <b>'+esc(top[0])+'</b></span>':'');
 $('#list').innerHTML=W.slice(0,15).map((x,i)=>{
  const gi=W.indexOf(x);
  return '<div class="w"><span class="ic">'+(ICONS[x.k]||'⭐')+'</span><span class="t">'+esc(x.t)+'</span>'+
  '<span class="m">'+day(x.at)+'</span>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);padding:4px 8px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">سلة فارغة — قطف أول مكسب.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){W.splice(+d.dataset.d,1);SV('miqtaf',W);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="miqtaf" data-title="مِقطَف"></script>
</body>
</html>
