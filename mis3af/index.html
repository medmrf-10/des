<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسعَف — قائمة الإسعاف</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.hp{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.hp .w{font-family:var(--font-ar);font-size:13px}
.hp .how{font-size:12px;color:var(--acc);margin-top:3px}
.hp .meta{font-size:10px;color:var(--dim);margin-top:4px}
.hp.done .w{text-decoration:line-through;opacity:.5}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسعَف <span class="muted">— قائمة الإسعاف</span></h2>
<div class="muted">من يحتاج إسعافك الآن؟ شخص يمكنك مساعدته — بوقتك، علمك، صلتك. سجّلهم، وافعل، وسجّل الفعل.</div>
<div class="card"><div class="t">من يحتاج مساعدتك؟</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="الشخص" style="width:120px">
<input id="hw" placeholder="كيف تساعده؟" style="flex:1;min-width:150px">
<button class="btn" id="ad">أضِف</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let H=LS('mis3af',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim(),h=$('#hw').value.trim();if(!n||!h)return;
 H.unshift({w:n,how:h,done:false,at:Date.now()});
 SV('mis3af',H);$('#nm').value=$('#hw').value='';render();
};
function render(){
 const dn=H.filter(x=>x.done).length;
 const wk=H.filter(x=>x.done&&(Date.now()-x.d)<864e5*7).length;
 $('#stats').innerHTML='<span class="stat">ينتظرون: <b style="color:var(--acc2)">'+arN(H.length-dn)+'</b></span>'+
 '<span class="stat">أسعفتهم: <b style="color:var(--ok)">'+arN(dn)+'</b></span>'+
 (wk?'<span class="stat">هذا الأسبوع: <b>'+arN(wk)+'</b></span>':'');
 $('#list').innerHTML=H.map((x,i)=>{
  const gi=H.indexOf(x);
  return '<div class="hp'+(x.done?' done':'')+'"><div class="w">'+esc(x.w)+'</div>'+
  '<div class="how">كيف: '+esc(x.how)+'</div>'+
  '<div class="meta">'+(x.done?'أسعفته '+new Date(x.d).toLocaleDateString('ar-EG'):'ينتظر منذ '+Math.floor((Date.now()-x.at)/864e5)+' يوماً')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:6px">'+
  (x.done?'':'<button class="btn ghost" data-h="'+gi+'" style="color:var(--ok);font-size:10px">أسعفته</button>')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 7px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أحد — من يحتاجك؟</div>';
}
$('#list').onclick=e=>{
 const h=e.target.closest('[data-h]'),d=e.target.closest('[data-d]');
 if(h){H[+h.dataset.h].done=true;H[+h.dataset.h].d=Date.now();SV('mis3af',H);render();return}
 if(d&&confirm('احذف؟')){H.splice(+d.dataset.d,1);SV('mis3af',H);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mis3af" data-title="مِسعَف"></script>
</body>
</html>
