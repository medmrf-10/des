<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرتقى — اكتب خطبتك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:860px;margin:0 auto;padding:14px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 15px;margin:8px 0}
.sec .h{font-size:11px;color:var(--acc);font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between}
.sec textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 11px;font-family:var(--font-ar);font-size:13.5px;min-height:64px;resize:vertical;box-sizing:border-box;line-height:1.9}
.sec textarea:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:13px;margin-inline-end:7px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.muted{color:var(--dim);font-size:12px}
.inp{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:13.5px;width:100%;box-sizing:border-box;margin-bottom:10px}
.inp:focus{outline:none;border-color:var(--acc)}
.badge{display:inline-block;background:var(--card2);border-radius:8px;padding:3px 10px;font-size:11px;margin:3px 4px 0 0}
@media print{
 body{background:#fff;color:#000}
 .noprint{display:none!important}
 .sec{border:0;padding:4px 0}
 .sec .h{color:#000;font-size:13px}
 .sec textarea{border:0;font-size:15px;min-height:auto}
}
</style>
</head>
<body class="noprint-bg">
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرتقى <span class="muted">— مؤلّف الخُطب</span></h2>
<div class="muted noprint">خطبة الجمعة ببنيتها الصحيحة: استفتاح ← آية ← حديث ← الموضوع ← خطبة ثانية ← دعاء. تُقدَّر مدتها وتُطبع أو تُحفظ.</div>
<input class="inp" id="ttl" placeholder="عنوان الخطبة (مثلاً: بر الوالدين)">
<div id="ss"></div>
<div class="noprint" style="margin-top:10px">
<button class="btn" id="prn">🖨 طباعة</button>
<button class="btn ghost" id="cp">⧉ نسخ النص</button>
<span class="badge" id="est"></span>
</div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECS=[
 {k:'افتتاحية',h:'الحمد لله نحمده ونستعينه ونستغفره…',ph:'الحمد لله نحمده ونستعينه ونستغفره، ونعوذ بالله من شرور أنفسنا وسيئات أعمالنا…'},
 {k:'آية التقوى',h:'اقرأها من مِشهد ثم انسخها هنا',ph:'﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ﴾'},
 {k:'حديث',h:'مثلاً: إنما الأعمال بالنيات',ph:'قال ﷺ: «…» — رواه …'},
 {k:'الموضوع',h:'صلب الخطبة — فكرة واحدة تكفي',ph:'عباد الله، إن…'},
 {k:'عبرة وخاتمة',h:'النقطة الأخيرة قبل الجلوس',ph:'فاتقوا الله عباد الله…'},
 {k:'الخطبة الثانية',h:'استفتاحها + دعاء للمسلمين',ph:'الحمد لله رب العالمين… أقول قولي هذا وأستغفر الله لي ولكم…'},
 {k:'دعاء الجمعة',h:'اللهم أغثنا، اللهم اشف مرضانا…',ph:'اللهم اغفر للمسلمين والمسلمات…'}];
const K='mirtaqa';
const st=JSON.parse(localStorage.getItem(K)||'{}');
$('#ttl').value=st.ttl||'';
$('#ss').innerHTML=SECS.map((s,i)=>`<div class="sec"><div class="h"><span>${s.k}</span><span class="muted">${s.h}</span></div><textarea data-i="${i}" placeholder="${esc(s.ph)}">${esc(st['s'+i]||'')}</textarea></div>`).join('');
function save(){const o={ttl:$('#ttl').value};
 document.querySelectorAll('textarea').forEach(t=>o['s'+t.dataset.i]=t.value);
 localStorage.setItem(K,JSON.stringify(o));
 const wc=document.querySelectorAll('textarea').values?t=document.querySelectorAll('textarea'):[];
 let w=$('#ttl').value.split(/\s+/).length;
 document.querySelectorAll('textarea').forEach(t=>w+=t.value.trim().split(/\s+/).filter(Boolean).length);
 $('#est').textContent='≈ '+Math.round(w/100)+' دقائق (بمعدل ١٠٠ كلمة/دق) — '+w.toLocaleString('ar-EG')+' كلمة'}
document.addEventListener('input',save);save();
$('#prn').onclick=()=>window.print();
$('#cp').onclick=async()=>{
 let txt=($('#ttl').value||'خطبة الجمعة')+'\n'+'═'.repeat(25)+'\n\n';
 SECS.forEach((s,i)=>{const v=document.querySelectorAll('textarea')[i].value.trim();
  if(v)txt+='【'+s.k+'】\n'+v+'\n\n'});
 await navigator.clipboard.writeText(txt);
 $('#cp').textContent='✓ نُسخ';setTimeout(()=>$('#cp').textContent='⧉ نسخ النص',1500)};
</script>
<script src="../shared/feedback.js" data-pid="mirtaqa" data-title="مِرتقى"></script>
</body>
</html>
