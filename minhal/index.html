<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنهال — نبع لا ينضب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:0}
#feed{scroll-snap-type:y mandatory;overflow-y:scroll;height:100vh}
.card{scroll-snap-align:start;min-height:96vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px;text-align:center}
.card .k{font-size:11px;color:var(--acc3);letter-spacing:2px;margin-bottom:18px}
.card .t{font-family:var(--font-ar);font-size:23px;line-height:2.3;max-width:520px}
.card .s{color:var(--dim);font-size:12px;margin-top:16px}
.card a{color:var(--acc);text-decoration:none;font-size:12px;margin-top:10px;display:block}
.muted{color:var(--dim);font-size:11px;position:fixed;bottom:12px;left:0;right:0;text-align:center}
</style>
</head>
<body>
<div id="feed"></div>
<div class="muted">مِنهال — مرّر بلا نهاية: آية · حديث · مسألة · ذِكر</div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G=null,M=null,A=null,seen=0;
async function laz(src,win){if(window[win])return window[win];
 const s=document.createElement('script');s.src=src;
 await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.head.appendChild(s)});return window[win]}
const seenCards=new Set();
function card(k,t,s,u){
 const id=t.slice(0,40);if(seenCards.has(id))return'';seenCards.add(id);
 return `<div class="card"><div class="k">${k}</div><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div>${u?`<a href="${u}">افتح في مصدرها ←</a>`:''}</div>`}
async function more(){
 if(!G)G=await laz('../hadith/analysis.js','GIDNET').catch(()=>null);
 if(!M)M=await laz('../fiqh_reader/masail.js','MASAIL').catch(()=>null);
 if(!A)A=await laz('../hadith/adhkar.js','ADHKAR').catch(()=>null);
 const type=Math.floor(Math.random()*4);
 let h='';
 if(type===0){
  const sn=1+Math.floor(Math.random()*114);
  try{
   const S=await(await fetch('../wahy/data/surah/'+sn+'.json')).json();
   const v=S.verses[Math.floor(Math.random()*S.verses.length)];
   h=card('آيــة',v.t+' ﴿'+v.a+'﴾',S.ar,'../mishhad/#'+sn+':'+v.a)}catch(e){}}
 if(!h&&type===1&&G){
  const ks=Object.keys(G.g);const g=G.g[ks[Math.floor(Math.random()*ks.length)]];
  if(g)h=card('حــديث','«'+g.t+'»',g.h+' · رواه '+g.s+' صحابياً','../hadith/matn.html#'+Object.keys(G.g).find(k=>G.g[k]===g))}
 if(!h&&type===2&&M){
  const ks=Object.keys(M);const m=M[ks[Math.floor(Math.random()*ks.length)]];
  const u=m.u[Math.floor(Math.random()*m.u.length)];
  if(u)h=card('مسألــة',u.t||u.i,m.n+' — '+m.a,'../fiqh_reader/')}
 if(!h&&A){
  const a=A[Math.floor(Math.random()*A.length)];
  if(a)h=card('ذِكــر',a.t,a.h||'','../hadith/adhkar.html')}
 if(!h){more();return}
 $('#feed').insertAdjacentHTML('beforeend',h)}
const io=new IntersectionObserver(es=>{
 if(es[0].isIntersecting&&seen<60){seen++;more()}},{root:$('feed'),threshold:.5});
setInterval(()=>{const els=$('#feed').children;
 if(els.length&&els[els.length-1].getBoundingClientRect().top<innerHeight*1.5&&seen<60){seen++;more()}},400);
more();more();more();
</script>
</body>
</html>
