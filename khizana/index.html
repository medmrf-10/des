<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خِزانة — كل كتب منظومتك</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🗄 خِزانة</h1><p class="tagline">الفهرس العام لكل كتاب في منظومتك — فقه، تفسير، حديث — بروابط مباشرة لقرائها</p></header>
<div class="wrap">
 <div class="card"><input id="q" placeholder="ابحث باسم الكتاب أو المؤلف أو المذهب…"><div class="seg" id="seg">
  <button class="sg on" data-f="all">الكل</button><button class="sg" data-f="fiqh">فقه</button><button class="sg" data-f="tafsir">تفسير</button><button class="sg" data-f="hadith">حديث</button>
 </div><div id="stat" class="stat"></div></div>
 <div id="list"></div>
</div>
<script src="../fiqh_reader/data/index.js"></script>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
let ALL=[];
// fiqh — READER_INDEX
if(window.READER_INDEX)READER_INDEX.forEach(b=>ALL.push({cat:'fiqh',t:b.title,a:b.author||'',sub:b.madh+' · '+(b.kind||''),cnt:b.nunits,u:'../fiqh_reader/?b='+b.slug}));
// tafsir
fetch('../wahy/data/tafsirs.json').then(r=>r.json()).then(t=>{
 t.forEach(x=>ALL.push({cat:'tafsir',t:x.n,a:'',sub:'تفسير · '+(x.a||0)+' آية',cnt:x.a,u:'../wahy/muqaran_tafsir.html'}));
 render();
});
// hadith books
fetch('../wahy/data/hadith/books.json').then(r=>r.json()).then(b=>{
 b.forEach(x=>{if(x.d)ALL.push({cat:'hadith',t:x.n,a:x.a||'',sub:'حديث · '+(x.q||0).toLocaleString('ar-EG')+' حديثاً',cnt:x.q,u:'../hadith/matn.html'})});
 render();
});
let F='all';
function render(){
 const q=norm($('#q').value.trim());
 const rs=ALL.filter(b=>(F==='all'||b.cat===F)&&(!q||norm(b.t+' '+(b.a||'')).includes(q)));
 const ar={fiqh:'فقه',tafsir:'تفسير',hadith:'حديث'};
 $('#stat').textContent=rs.length?rs.length.toLocaleString('ar-EG')+' كتاباً':'';
 $('#list').innerHTML=rs.slice(0,120).map(b=>`<a class="bk" href="${b.u}"><div class="bk-t">${esc(b.t)}</div><div class="bk-m">${esc(b.a||'')}${b.a&&b.sub?' · ':''}${esc(b.sub||'')}</div><span class="cat ${b.cat}">${ar[b.cat]}</span></a>`).join('');
}
$('#q').addEventListener('input',render);
document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));b.classList.add('on');F=b.dataset.f;render()});
render();
</script>
<script src="../shared/palette.js"></script><script src="../shared/feedback.js"></script>
</body></html>
