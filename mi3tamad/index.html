<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتمد — مصادرك النقية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:680px;margin:0 auto;padding:14px}
.s{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:13px 17px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.s .n{font-family:var(--font-ar);font-weight:700;font-size:14px}
.s .d{color:var(--dim);font-size:11.5px;margin-top:3px}
.tag{display:inline-block;border:1px solid var(--border);border-radius:8px;padding:2px 9px;font-size:10px;color:var(--acc2);margin-right:5px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);padding:5px 11px;font-size:11px}
.add{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:12px 14px;margin-top:14px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:8px 10px;font-family:var(--font-ar);font-size:12px;margin:2px 0}
.muted{color:var(--dim);font-size:12px}
.grp{color:var(--acc);font-size:12.5px;font-weight:700;margin-top:18px;border-bottom:1px solid var(--border);padding-bottom:6px}
.mine{border-color:var(--acc)!important}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتمد <span class="muted">— مصادرك النقية الموثوقة</span></h2>
<div class="muted">فهرس المصادر الرقمية الصافية (لا OCR ولا PDF) + مساحة تضيف فيها مصادرك أنت — قابلة للتعديل كلياً.</div>
<div id="grps"></div>
<div class="add">
<div style="font-weight:700;font-size:12.5px;margin-bottom:7px">+ مصدرك الخاص</div>
<input id="an" placeholder="اسم المصدر" style="width:100%">
<input id="au" placeholder="الرابط https://..." style="width:100%;direction:ltr">
<input id="ad" placeholder="وصف قصير (اختياري)" style="width:100%">
<select id="ag"><option>القرآن</option><option>الحديث</option><option>الفقه</option><option>العقيدة والتصوف</option><option>اللغة</option><option>برمجة</option><option>إنجليزية</option><option>أخرى</option></select>
<button class="btn" id="add">أضِف لمعتمدي</button>
</div>
<div class="muted" style="margin-top:12px">مصادرك المضافة تُحفظ على جهازك وتظهر بشارة «مِن عندك» — حذف أيٍّ منها بنقرة.</div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRE=[
 {g:'القرآن',n:'وحي — المصدر الصافي',u:'https://medmrf-10.github.io/des/wahy/','d':'قرآن كريم + تفاسير QUL — مشروعنا نفسه'},
 {g:'القرآن',n:'QUL — Quranic Universal Library',u:'https://qul.tarteel.ai/','d':'مصدر وحي الرقمي — نصوص وتفاسير نظيفة'},
 {g:'الحديث',n:'مكتبة الحديث — المشروع',u:'https://medmrf-10.github.io/des/hadith/','d':'تحليل الكتب الستة + الأحكام والرواة'},
 {g:'الفقه',n:'قارئ الفقه — rlg',u:'https://medmrf-10.github.io/des/fiqh_reader/','d':'٢٨ ألف مسألة من ٥٥ كتاباً'},
 {g:'العقيدة والتصوف',n:'مصادر العقيدة النقية',u:'https://medmrf-10.github.io/des/akida/masadir.html','d':'معجم المصطلحات + النصوص من akidsofi'},
 {g:'القرآن',n:'مكتبة الشاملة',u:'https://shamela.ws/','d':'الكتب بصيغ رقمية — مرجعية البحث'},
 {g:'أخرى',n:'الفهرس العام للمنظومة',u:'https://medmrf-10.github.io/des/fihris/','d':'كل شيء مُصنَّف — قابل للتعديل منك'}];
const mine=()=>JSON.parse(localStorage.getItem('mi3tamad')||'[]');
const sv=m=>localStorage.setItem('mi3tamad',JSON.stringify(m));
function render(){
 const m=mine();const all=PRE.concat(m.map(x=>({...x,mine:1})));
 const gs=[...new Set(all.map(x=>x.g))];
 $('#grps').innerHTML=gs.map(g=>'<div class="grp">'+g+'</div>'+all.filter(x=>x.g===g).map((x)=>{
  const gi=m.findIndex(y=>y.n===x.n&&y.u===x.u);
  return '<div class="s '+(x.mine?'mine':'')+'"><div><span class="n">'+esc(x.n)+'</span>'+
  (x.mine?'<span class="tag" style="border-color:var(--acc);color:var(--acc)">مِن عندك</span>':'')+
  '<div class="d">'+esc(x.d||'')+'</div></div>'+
  '<div style="display:flex;gap:6px;flex-shrink:0">'+
  '<a class="btn" href="'+esc(x.u)+'" target="_blank" rel="noopener">فتح ↗</a>'+
  (x.mine?'<button class="btn ghost" onclick="del('+gi+')">×</button>':'')+'</div></div>'}).join('')).join('');
}
window.del=i=>{const m=mine();m.splice(i,1);sv(m);render()};
$('#add').onclick=()=>{
 const n=$('#an').value.trim(),u=$('#au').value.trim();
 if(!n||!u)return alert('الاسم والرابط');
 const m=mine();m.push({g:$('#ag').value,n,u,d:$('#ad').value.trim()});sv(m);
 $('#an').value=$('#au').value=$('#ad').value='';render()};
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3tamad" data-title="مِعتمد"></script>
</body>
</html>
