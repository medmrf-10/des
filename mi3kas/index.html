<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعكَس — مرآة الأسبوع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px;min-height:60px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.q{font-family:var(--font-ar);font-size:13px;color:var(--txt);margin-top:11px}
.wk{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.wk .d{font-size:10px;color:var(--dim);margin-bottom:6px}
.wk .ln{font-size:12px;margin-top:4px}
.wk .ln b{color:var(--acc);font-size:11px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعكَس <span class="muted">— مرآة الأسبوع</span></h2>
<div class="muted">أسبوع يمر بلا مراجعة أسبوع ضائع. خمسة أسئلة كل جمعة.</div>
<div class="card"><div class="t">مراجعة هذا الأسبوع</div>
<div class="q">١. أفضل لحظة؟</div><textarea id="q1"></textarea>
<div class="q">٢. أصعب لحظة؟</div><textarea id="q2"></textarea>
<div class="q">٣. درس تعلّمته؟</div><textarea id="q3"></textarea>
<div class="q">٤. شيء تندم عليه؟</div><textarea id="q4"></textarea>
<div class="q">٥. قرارك للأسبوع القادم؟</div><textarea id="q5"></textarea>
<button class="btn" id="sv" style="margin-top:11px">احفظ المراجعة</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let W=LS('mi3kas',[]);
const QS=['أفضل لحظة','أصعب لحظة','درس','ندم','قرار الأسبوع'];
$('#sv').onclick=()=>{
 const a=[1,2,3,4,5].map(i=>$('#q'+i).value.trim());
 if(!a.some(x=>x))return;
 W.unshift({at:Date.now(),a});SV('mi3kas',W);
 [1,2,3,4,5].forEach(i=>$('#q'+i).value='');render();
};
function render(){
 $('#stats').innerHTML='<span class="stat">مراجعات: <b>'+arN(W.length)+'</b></span>'+
 (W.length?'<span class="stat">آخرها: <b>'+new Date(W[0].at).toLocaleDateString('ar-EG')+'</b></span>':'');
 $('#list').innerHTML=W.slice(0,6).map(x=>'<div class="wk"><div class="d">'+new Date(x.at).toLocaleDateString('ar-EG')+'</div>'+
 x.a.map((s,i)=>s?'<div class="ln"><b>'+QS[i]+':</b> '+esc(s)+'</div>':'').join('')+'</div>').join('')||
 '<div class="muted" style="margin-top:12px">لا مراجعات — ابدأ اليوم.</div>';
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3kas" data-title="مِعكَس"></script>
</body>
</html>
