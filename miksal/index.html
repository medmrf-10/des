<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِكسَل — دفتر التسويف</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.lg{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px}
.lg .t{font-family:var(--font-ar);font-size:13px}
.lg .why{font-size:11.5px;color:var(--acc2);margin-top:4px}
.lg .meta{font-size:10px;color:var(--dim);margin-top:4px}
.srcrow{display:flex;gap:9px;align-items:center;margin-top:7px;font-size:12px}
.srcrow .nm{min-width:110px;font-family:var(--font-ar)}
.srcrow .bar{flex:1;height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.srcrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),#a05a5a)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِكسَل <span class="muted">— دفتر التسويف</span></h2>
<div class="muted">كل مرة تسوّف سجّل: ماذا تهربت منه ولماذا. النمط يظهر — والنمط يُكسر.</div>
<div class="card"><div class="t">تسويف الآن</div>
<input id="t" placeholder="ماذا تهربت منه؟">
<select id="w"><option value="خوف الفشل">خوف الفشل</option><option value="مهمة ضخمة">مهمة ضخمة</option><option value="لا طاقة">لا طاقة</option><option value="لا أعرف من أين أبدأ">لا أعرف من أين أبدأ</option><option value="ملل">ملل</option><option value="كمالية">كمالية</option><option value="إلهاء">إلهاء</option><option value="أخرى">أخرى</option></select>
<button class="btn" id="ad" style="margin-top:9px">سجّل</button></div>
<div class="card"><div class="t">أعذارك بالترتيب</div><div id="srcs"></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let L=LS('miksal',[]);
$('#ad').onclick=()=>{
 const t=$('#t').value.trim();if(!t)return;
 L.unshift({t,w:$('#w').value,at:Date.now()});SV('miksal',L);$('#t').value='';render();
};
function render(){
 const byWhy={};L.forEach(x=>byWhy[x.w]=(byWhy[x.w]||0)+1);
 const whys=Object.entries(byWhy).sort((a,b)=>b[1]-a[1]);
 const mx=whys.length?whys[0][1]:1;
 $('#srcs').innerHTML=whys.map(([w,c])=>'<div class="srcrow"><span class="nm">'+esc(w)+'</span>'+
 '<div class="bar"><i style="width:'+(c/mx*100)+'%"></i></div><b style="font-size:11px;color:var(--acc2)">'+arN(c)+'</b></div>').join('')||
 '<div class="muted">لا تسويف مسجل.</div>';
 const today=new Date().toISOString().slice(0,10);
 const tn=L.filter(x=>new Date(x.at).toISOString().slice(0,10)===today).length;
 $('#stats').innerHTML='<span class="stat">اليوم: <b>'+arN(tn)+'</b></span>'+
 '<span class="stat">إجمالاً: <b>'+arN(L.length)+'</b></span>'+
 (whys.length?'<span class="stat">أكبر عذر: <b style="color:var(--acc2)">'+esc(whys[0][0])+'</b></span>':'');
 $('#list').innerHTML=L.slice(0,12).map(x=>'<div class="lg"><div class="t">'+esc(x.t)+'</div>'+
 '<div class="why">'+esc(x.w)+'</div>'+
 '<div class="meta">'+new Date(x.at).toLocaleDateString('ar-EG')+' '+new Date(x.at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+'</div></div>').join('')||
 '<div class="muted" style="margin-top:12px">سجل نظيف — يوم مبارك.</div>';
}
render();
</script>
<script src="../shared/feedback.js" data-pid="miksal" data-title="مِكسَل"></script>
</body>
</html>
