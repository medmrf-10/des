<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مُعلِّم — اسأل فيتعلّم دربك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:780px;margin:0 auto;padding:14px}
.q{display:flex;gap:8px;margin:12px 0}
.inp{flex:1;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:12px 16px;font-family:var(--font-ar);font-size:15px}
.inp:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:13px}
.step{display:flex;gap:11px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin:7px 0;align-items:flex-start}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#14140f;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.step .b{flex:1}
.step .t{font-weight:700;font-size:14px}
.step .d{color:var(--dim);font-size:12px;margin-top:3px;line-height:1.8}
.step a{color:var(--acc3);font-size:11.5px;text-decoration:none}
.muted{color:var(--dim);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--border);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:11px;color:var(--dim)}
h4{font-family:var(--font-ar);margin:14px 0 6px;font-size:13px;color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مُعلِّم <span class="muted">— اكتب موضوعاً، يصنع لك درب تعلّم</span></h2>
<div class="muted">مثال: صيام، طهارة، عقيدة، نحو، برمجة، إنجليزية — فيرسم لك: سلسلة تبدأ بها ← مسائلها ← أحاديثها ← اختبر نفسك.</div>
<div class="q">
<input class="inp" id="q" placeholder="اكتب الموضوع…" autofocus>
<button class="btn" id="go">علّمني</button>
</div>
<div class="chips" id="sug"></div>
<div id="out"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const TOP=['صيام','طهارة','صلاة','زكاة','حج','عقيدة','نحو','صرف','حديث','تفسير','سيرة','فقه','إيمان','برمجة','إنجليزية','حفظ','قرآن'];
$('#sug').innerHTML=TOP.map(t=>`<span class="chip">${t}</span>`).join('');
$('#sug').onclick=e=>{if(e.target.classList.contains('chip')){$('#q').value=e.target.textContent;teach()}};
$('#q').onkeydown=e=>{if(e.key==='Enter')teach()};
$('#go').onclick=teach;
let S=null;
async function data(){if(S)return S;
 const d=document.createElement('script');d.src='../durus/data.js';
 await new Promise((ok,bad)=>{d.onload=ok;d.onerror=bad;document.head.appendChild(d)});
 S={SERIES:window.SERIES||[]};return S}
async function teach(){
 const q=norm($('#q').value.trim());if(!q)return;
 $('#out').innerHTML='<div class="muted">يرسم دربك…</div>';
 const {SERIES}=await data();
 // 1 سلاسل مطابقة
 const hits=SERIES.filter(s=>{const b=norm(s.name+' '+s.sheikh+' '+(s.comment||''));
  return q.split(' ').every(w=>b.includes(w))}).slice(0,6);
 // 2 مسائل
 let ms=[];
 try{const M=window.MASAIL||(await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../fiqh_reader/masail.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)}),window.MASAIL);
  for(const sl of Object.keys(M)){const m=M[sl];
   const fs=m.u.filter(u=>norm(u.t||'').includes(q)).slice(0,3);
   ms.push(...fs.map(u=>({t:u.t||u.i,b:m.n,u:'../fiqh_reader/index.html#'+sl+'/'+u.i})))}
  ms=ms.slice(0,5)}catch(e){}
 // 3 أحاديث
 let hs=[];
 try{const D=window.GIDNET||(await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../hadith/analysis.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)}),window.GIDNET);
  for(const gid of Object.keys(D.g)){const g=D.g[gid];
   if(norm(g.t).includes(q))hs.push({t:g.t,h:g.h,u:'../hadith/matn.html#'+gid});
   if(hs.length>=4)break}}catch(e){}
 // 4 مصطلحات/مواضيع
 let ts=[];
 try{const T=window.TERMS||(await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../fiqh_reader/terms.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)}),window.TERMS);
  for(const t of Object.keys(T.terms||{})){
   if(norm(t).includes(q))ts.push({t,b:T.terms[t].length});
   if(ts.length>=5)break}}catch(e){}
 // رسم الدرب
 let h=`<h4>درب «${esc($('#q').value)}» التعليمي</h4>`;
 let n=1;
 if(hits.length){
  hits.slice(0,3).forEach((s,i)=>{
   h+=`<div class="step"><div class="n">${n++}</div><div class="b"><div class="t">${i===0?'ابدأ هنا':'ثم'}: ${esc(s.name)}</div><div class="d">${esc(s.sheikh)} · ${s.videos||'?'} درساً${s.kind?' · '+esc(s.kind):''}</div><a href="../durus/index.html#s=${s.id}">افتح السلسلة ←</a></div></div>`})}
 else h+=`<div class="muted" style="padding:6px">لا سلسلة مطابقة تماماً — جرّب لفظاً أعم (مثلاً «فقه» بدل «فقه العبادات المالكي»)</div>`;
 if(ms.length){h+='<h4>مسائلها من المتون</h4>';
  ms.forEach(m=>{h+=`<div class="step"><div class="n">${n++}</div><div class="b"><div class="t" style="font-weight:400;font-size:13px;line-height:1.8">${esc(m.t.slice(0,140))}</div><div class="d">${esc(m.b)}</div><a href="${m.u}">اقرأها كاملة ←</a></div></div>`})}
 if(hs.length){h+='<h4>أحاديثها</h4>';
  hs.forEach(x=>{h+=`<div class="step"><div class="n">${n++}</div><div class="b"><div class="t" style="font-weight:400;font-size:13px">«${esc(x.t)}»</div><div class="d">${esc(x.h)}</div><a href="${x.u}">تتبعها ←</a></div></div>`})}
 if(ts.length){h+='<h4>مواضيع مرتبطة</h4>';
  h+='<div class="chips">'+ts.map(t=>`<span class="chip" style="cursor:default">${esc(t.t)} <span class="muted">(${t.b})</span></span>`).join('')+'</div>'}
 h+=`<div class="step" style="border-color:var(--acc)"><div class="n">✓</div><div class="b"><div class="t">اختبر نفسك</div><div class="d">أجب أسئلة في هذا الموضوع بمِعيار أو اختبرني</div><a href="../mi3yar/">مِعيار ←</a> <a href="../ikhtibirni/" style="margin-inline-start:10px">اختبرني ←</a></div></div>`;
 $('#out').innerHTML=h}
const hp=location.hash.slice(1);if(hp){$('#q').value=decodeURIComponent(hp);teach()}
</script>
<script src="../shared/feedback.js" data-pid="muallim" data-title="مُعلِّم"></script>
</body>
</html>
