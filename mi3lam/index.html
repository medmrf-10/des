<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعلَم — ورقة الطالب</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
select,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.sheet{background:#fff;color:#111;border-radius:12px;padding:22px;margin-top:14px;display:none}
.sheet h2{font-family:var(--font-ar);font-size:19px;margin:0 0 4px;color:#111}
.sheet .sub{font-size:11px;color:#666;margin-bottom:14px}
.sheet .ph{font-family:var(--font-ar);font-size:14.5px;line-height:2.2;border-right:3px solid #c9a24b;padding-right:10px;margin:10px 0}
.sheet .ex{border:1px dashed #999;border-radius:9px;padding:10px 14px;margin-top:14px;font-family:var(--font-ar);font-size:13px}
.sheet .ex b{color:#8a6a2f}
@media print{body>*{display:none}body .sheet{display:block!important;border-radius:0;margin:0}.muted,.card{display:none!important}}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعلَم <span class="muted">— ورقة الطالب</span></h2>
<div class="muted">اختر درساً → ورقة تعليمية جاهزة للطباعة: أهم العبارات + تدريبات للطالب.</div>
<div class="card"><div class="t">اختر الدرس</div>
<select id="ls"></select>
<div style="display:flex;gap:8px;margin-top:8px">
<input id="n" type="number" value="6" min="2" max="15" placeholder="عدد العبارات">
<input id="ex" type="number" value="3" min="0" max="10" placeholder="عدد التدريبات"></div>
<button class="btn" id="gen" style="margin-top:10px">ولّد الورقة</button></div>
<div class="sheet" id="sheet"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EX=['املأ الفراغ: «…_____…»','اشرح بأسلوبك: «…»','استخرج الفائدة من: «…»','أكمل العبارة: «…»','صنّف الكلمات المفتاحية في «…»'];
let L=[];
fetch('../manzuma/lessons/index.json').then(r=>r.json()).then(x=>{
 L=x;$('#ls').innerHTML=x.map((l,i)=>'<option value="'+i+'">'+esc(l.title)+'</option>').join('');
}).catch(()=>{$('#ls').innerHTML='<option>تعذر التحميل — افتح عبر HTTP</option>'});
$('#gen').onclick=async()=>{
 const i=+$('#ls').value;if(!L[i])return;
 const r=await fetch('../manzuma/lessons/'+L[i].dir+'/phrases.json').catch(()=>null);
 if(!r||!r.ok){alert('تعذر تحميل الدرس');return}
 const ph=await r.json();
 const texts=ph.map(p=>p.ws.map(w=>w.w).join(' ')).filter(t=>t.length>15);
 const n=Math.min(+$('#n').value||6,texts.length);
 const picked=texts.filter((_,k)=>k%Math.max(1,Math.floor(texts.length/n))===0).slice(0,n);
 const nex=Math.min(+$('#ex').value||3,picked.length);
 const sh=document.getElementById('sheet');
 sh.style.display='block';
 sh.innerHTML='<h2>📋 '+esc(L[i].title)+'</h2><div class="sub">ورقة الطالب — المنظومة التعليمية · '+new Date().toISOString().slice(0,10)+'</div>'+
 '<div style="font-size:12.5px;color:#333;margin-bottom:8px"><b>اقرأ وتدبر:</b></div>'+
 picked.map(p=>'<div class="ph">'+esc(p)+'</div>').join('')+
 '<div class="ex"><b>تدريبات الطالب:</b>'+picked.slice(0,nex).map((p,k)=>'<div style="margin-top:8px">'+(k+1)+'. '+EX[k%EX.length].replace('«…»','«'+esc(p.slice(0,60))+'…»')+'</div>').join('')+'</div>';
 sh.scrollIntoView();
};
</script>
<script src="../shared/feedback.js" data-pid="mi3lam" data-title="مِعلَم"></script>
</body>
</html>
