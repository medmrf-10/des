<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقتَحَم — اقتحام الستين</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px;text-align:center}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-top:12px;text-align:right}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:11px 26px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:14px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);padding:8px 16px;font-size:12px}
.timer{font-family:var(--font-ar);font-size:56px;font-weight:700;color:var(--acc);margin:16px 0 4px}
.q{font-family:var(--font-ar);font-size:15px;line-height:2.1;margin-top:10px;min-height:60px}
.opts{display:grid;gap:7px;margin-top:12px}
.opt{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12.5px;text-align:right}
.opt:hover{border-color:var(--acc)}
.opt.correct{background:rgba(212,175,55,.15);border-color:var(--acc)}
.opt.wrong{background:rgba(224,128,128,.1);border-color:#e08080}
.score{font-family:var(--font-ar);font-size:15px;margin-top:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقتَحَم <span class="muted">— اقتحام الستين</span></h2>
<div class="muted">٦٠ ثانية — كم سؤالاً تصيب؟ مزيج حديث وقرآن وفقه.</div>
<div id="start" style="margin-top:22px">
<div class="timer">٦٠</div>
<div class="muted">أسئلة سريعة من مكتبتك الحقيقية — إجابة فورية، سؤال تالٍ.</div>
<button class="btn" id="go" style="margin-top:18px">اقتحم</button>
<div class="muted" style="margin-top:14px" id="best"></div></div>
<div class="card" id="game" style="display:none;text-align:right">
<div style="display:flex;justify-content:space-between;font-size:12px"><span id="tm" style="color:var(--acc);font-family:var(--font-ar);font-size:16px">٦٠</span><span id="scr" class="muted">٠ / ٠</span></div>
<div class="q" id="q"></div>
<div class="opts" id="opts"></div></div>
<div class="card" id="end" style="display:none">
<div class="score" id="final"></div>
<button class="btn" id="again" style="margin-top:14px">اقتحم مجددًا</button></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G,U,M,iv,left,score,total;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA'),laz('../fiqh_reader/masail.js','MASAIL')]).then(([g,u,m])=>{G=g;U=u;M=m});
const QS=[];
function build(){
 QS.length=0;
 if(G)Object.keys(G.g).slice(0,500).forEach(k=>{
  const h=G.g[k];
  QS.push({q:'ما حكم هذا الحديث؟ «'+h.t.slice(0,70)+'…»',o:[h.h,'صحيح','ضعيف','موضوع'].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4),a:h.h});
 });
 if(U)Object.keys(U.sim).slice(0,300).forEach(k=>{
  const s=k.split(':')[0];
  QS.push({q:'في أي سورة؟ «'+U.sim[k][2].slice(0,60)+'…»',o:[U.names[s],'البقرة','يس','الكهف'].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4),a:U.names[s]});
 });
 if(M){
  const MN={h:'الحنفية',m:'المالكية',s:'الشافعية',b:'الحنابلة'};
  Object.values(M).filter(b=>MN[b.m]).forEach(b=>{
   QS.push({q:'«'+b.n+'» — كتاب أي مذهب؟',o:[MN[b.m],'الحنفية','المالكية','الشافعية'].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4),a:MN[b.m]});
  });
 }
}
function next(){
 if(!QS.length)build();
 const q=QS[Math.floor(Math.random()*QS.length)];
 $('#q').innerHTML=q.q;
 $('#opts').innerHTML=q.o.sort(()=>Math.random()-0.5).map(o=>'<button class="opt">'+esc(o)+'</button>').join('');
 document.querySelectorAll('#opts .opt').forEach(b=>{
  b.onclick=()=>{
   total++;
   if(b.textContent===q.a){score++;b.classList.add('correct')}
   else b.classList.add('wrong');
   $('#scr').textContent=arN(score)+' / '+arN(total);
   setTimeout(next,280);
  };
 });
}
function start(){
 score=0;total=0;left=60;
 $('#start').style.display='none';$('#end').style.display='none';$('#game').style.display='block';
 next();
 iv=setInterval(()=>{
  left--;$('#tm').textContent=arN(left);
  if(left<=0)finish();
 },1000);
}
function finish(){
 clearInterval(iv);
 const h=LS('miqtaham',{n:0,best:0,bestAcc:0});
 const acc=total?Math.round(score/total*100):0;
 h.n++;if(score>h.best){h.best=score;h.bestAcc=acc}
 SV('miqtaham',h);
 $('#game').style.display='none';$('#end').style.display='block';
 $('#final').innerHTML='<b style="color:var(--acc);font-size:22px">'+arN(score)+'</b> / '+arN(total)+'<div class="muted" style="margin-top:7px">دقة '+arN(acc)+'٪ — أفضل رقمك '+arN(h.best)+'</div>';
 renderBest();
}
function renderBest(){
 const h=LS('miqtaham',{n:0,best:0});
 $('#best').textContent=h.n?'لعبت '+arN(h.n)+' مرة — أفضل نتيجة '+arN(h.best):'';
}
$('#go').onclick=start;$('#again').onclick=start;
renderBest();
</script>
<script src="../shared/feedback.js" data-pid="miqtaham" data-title="مِقتَحَم"></script>
</body>
</html>
