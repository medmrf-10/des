<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شبكة المعنى — مجموعات الحديث الموحدة عبر الكتب الستة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
*{box-sizing:border-box}
body{max-width:1200px;margin:0 auto;background:var(--bg);color:var(--txt);font-family:var(--font-ui)}
.top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sub{color:var(--dim);font-size:12px}
.top a{color:var(--acc2);font-size:12px;text-decoration:none;border:1px solid #c9a24a55;border-radius:999px;padding:3px 12px;margin-inline-start:auto}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:53px;background:var(--bg);z-index:40}
.toolbar input[type=text]{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px;flex:1;min-width:160px}
.lgnd{display:flex;gap:6px;font-size:11px}
.lgnd span{border-radius:999px;padding:2px 9px;border:1px solid var(--border)}
.lg-sa{color:var(--ok)}.lg-mx{color:var(--acc2)}.lg-zu{color:var(--acc3)}
.split{display:flex;gap:0;min-height:calc(100vh - 140px)}
.paneT{width:290px;flex:none;border-inline-end:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 140px);position:sticky;top:105px;align-self:flex-start;padding:8px}
.paneD{flex:1;padding:12px 14px;min-width:0}
@media(max-width:760px){.split{flex-direction:column}.paneT{width:100%;max-height:none;position:static;border-inline-end:0;border-bottom:1px solid var(--border)}}
.tnode{padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.7}
.tnode:hover{background:var(--card)}
.tnode.on{background:var(--card);border-inline-start:3px solid var(--acc)}
.tnode .cnt{color:var(--dim);font-size:11px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700}
.bd-sa{background:#14291c;color:var(--ok)}.bd-mx{background:#2e2513;color:var(--acc2)}.bd-zu{background:#221d3d;color:var(--acc3)}
.bd-h{background:#22303f;color:#9db8d4}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card .taraf{font-family:var(--font-ar);font-size:16px;line-height:1.9}
.card .meta{color:var(--dim);font-size:11px;margin:6px 0}
.books{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bk{border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:11px;background:var(--card2)}
.bk b{color:var(--acc2)}
.bk a{color:var(--txt);text-decoration:none;border-bottom:1px dotted var(--dim);margin-inline-start:3px}
.bk a:hover{color:var(--acc2)}
.det{margin-top:8px;font-size:12px;color:var(--dim)}
.det summary{cursor:pointer;color:var(--acc2);font-size:12px}
.det .jrow{margin:4px 0}
.det .rw{color:var(--txt);font-size:12px;line-height:1.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px}
.chip b{display:block;font-size:18px}
.err{border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--dim)}
.btn{display:inline-block;border:1px solid var(--acc);color:var(--acc2);background:transparent;border-radius:8px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none}
.mut{color:var(--dim);font-size:12px}
mark{background:#8a6d1f;color:#fff;border-radius:3px;padding:0 2px}
.loadwrap{padding:40px 20px;text-align:center}
.lbar{height:8px;border-radius:4px;background:var(--card2);max-width:420px;margin:14px auto 0;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .2s}
.mbk{border-top:1px solid var(--border);margin-top:6px}
.mbk-h{cursor:pointer;padding:5px 8px;font-size:12px;color:var(--acc2)}
.mbk-h:hover{color:var(--txt)}
.mbk-c{padding:0 8px 6px}
.car{display:inline-block;width:12px;color:var(--dim)}
.mh{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--card2)}
.mh-h{font-size:12px;margin-bottom:4px}
.matn2{font-family:var(--font-ar);font-size:14px;line-height:1.9;margin:4px 0}
.rc{font-size:11px;margin:3px 0}
.rc summary{cursor:pointer;color:var(--dim)}
.rw{font-size:12px;line-height:1.8;color:var(--txt)}
.bdg{display:inline-block;border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700}
.v-ok{background:#14291c;color:var(--ok)}.v-hs{background:#2e2513;color:var(--acc2)}.v-wk{background:#3a1d1d;color:#e08a8a}.v-df{background:#22303f;color:#9db8d4}
.rchip{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:11px;margin:2px;cursor:pointer;color:var(--txt)}
.rchip:hover{border-color:var(--acc)}
.rchip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:5px}
.dsa{background:var(--ok)}.dmx{background:var(--acc2)}.dzu{background:var(--acc3)}
</style>
</head>
<body>
<header class="top">
  <h1>⛓ شبكة المعنى</h1>
  <span class="sub" id="sub">مجموعات الحديث الموحدة عبر الكتب الستة — بمنهج الشامي</span>
  <a href="index.html">المختبر ←</a>
</header>
<div class="toolbar" id="toolbar" hidden>
  <input type="text" id="q" placeholder="ابحث في أطراف المعاني أو برقم المجموعة (gid)…">
  <span class="lgnd">
    <span class="lg-sa">● صحيحان فقط</span>
    <span class="lg-mx">● صحيحان+سنن</span>
    <span class="lg-zu">● زوائد سنن</span>
  </span>
</div>
<div class="split" id="split" hidden>
  <div class="paneT" id="tree"></div>
  <div class="paneD" id="det"><p class="mut">اختر موضوعاً من الشجرة، أو ابحث في المعاني.</p></div>
</div>
<div class="loadwrap" id="lw">
  <p id="lmsg">يُحمّل شبكة المعنى…</p>
  <div class="lbar"><i id="lbi"></i></div>
  <p class="mut" id="lpct"></p>
</div>
<script src="pako.min.js"></script>
<script>
const arNum=n=>Number(n).toLocaleString('ar-EG');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const hlq=(t,q)=>{if(!q)return esc(t);const w=q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));return w.length?esc(t).replace(new RegExp(w.join('|'),'g'),m=>'<mark>'+m+'</mark>'):esc(t)};
const deb=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

let GN=null,kids={},leafCnt={},normT={};
const SAHIHAYN=new Set(['bukhari','muslim']);
const layerOf=w=>{const ks=Object.keys(w||{});const s=ks.some(b=>SAHIHAYN.has(b)),u=ks.some(b=>!SAHIHAYN.has(b));return s&&u?'mx':s?'sa':'zu'};
const BAR=GN_AR={};
let S={topic:'',gid:'',q:'',open:new Set(['1'])};

async function boot(){
  const lw=document.getElementById('lw'),bi=document.getElementById('lbi'),pt=document.getElementById('lpct');
  try{
    const r=await fetch('analysis.js');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const tot=+r.headers.get('content-length')||0;
    const rd=r.body.getReader();const chunks=[];let got=0;
    for(;;){const{done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;
      if(tot){const p=Math.round(got/tot*100);bi.style.width=p+'%';pt.textContent=arNum(Math.round(got/1024))+' / '+arNum(Math.round(tot/1024))+' ك.ب — '+p+'٪'}
      else pt.textContent=arNum(Math.round(got/1024))+' ك.ب'}
    const src=await new Blob(chunks).text();
    (0,eval)(src);
    GN=window.GIDNET;
    if(!GN||!GN.g)throw new Error('GIDNET غير مكتمل');
  }catch(e){
    lw.innerHTML=`<div class="err"><p>تعذّر تحميل شبكة المعنى (${esc(e.message)}).</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>`;
    return;
  }
  init();
}

function init(){
  const BA=GN.meta.book_ar;for(const b of GN.meta.books)BAR[b]=BA[b]||b;
  for(const id in GN.t){const p=GN.t[id].p||'0';(kids[p]=kids[p]||[]).push(id)}
  for(const k in kids)kids[k].sort((a,b)=>(leafCnt[b]=leafCnt[b]??cntLeaf(b))-(leafCnt[a]=leafCnt[a]??cntLeaf(a))||(GN.t[a].n>GN.t[b].n?1:-1));
  for(const gid in GN.g)normT[gid]=norm(GN.g[gid].t);
  document.getElementById('sub').textContent=
    `${arNum(GN.meta.gids)} معنى موحّداً · ${arNum(GN.meta.rawi)} راوياً · صحيحان ${arNum(GN.meta.layers.sa)} · صحيحان+سنن ${arNum(GN.meta.layers.mx)} · زوائد ${arNum(GN.meta.layers.zu)}`;
  document.getElementById('lw').hidden=true;
  document.getElementById('toolbar').hidden=false;
  document.getElementById('split').hidden=false;
  document.getElementById('q').addEventListener('input',deb(e=>{S.q=e.target.value;S.topic='';renderDet()},220));
  decHash();renderTree();renderDet();
  if(S.gid&&GN.g[S.gid]){document.getElementById('det').innerHTML=gidCard(S.gid);S.gid=''}
}
function cntLeaf(id){/* عدد معاني الفرع = مجموع معاني الأوراق تحته */
  let sum=0;const st=[id];
  while(st.length){const x=st.pop();const ks=kids[x]||[];
    if(GN.tg[x])sum+=GN.tg[x].length;
    for(const k of ks)st.push(k)}
  return leafCnt[id]=sum;
}

/* ===== شجرة المواضيع ===== */
function renderTree(){
  const el=document.getElementById('tree');
  const roots=kids['0']||['1'];
  el.innerHTML=roots.map(tnode).join('');
}
function tnode(id){
  const t=GN.t[id];if(!t)return'';
  const ks=kids[id]||[];const open=S.open.has(id);
  const cnt=(GN.tg[id]||[]).length||cntLeaf(id);
  return `<div class="tnode${S.topic==id?' on':''}" data-tid="${id}" onclick="pickT('${id}')">${ks.length?(open?'▾ ':'▸ '):''}<span>${esc(t.n)}</span> <span class="cnt">${arNum(cnt)}</span></div>`
    +(open?`<div style="margin-inline-start:14px">${ks.map(tnode).join('')}</div>`:'');
}
function pickT(id){
  if(S.topic==id){S.topic=''}else{S.topic=id;S.gid=''}
  if(kids[id]){S.open.has(id)?S.open.delete(id):S.open.add(id)}
  /* أبقِ الآباء مفتوحة */
  let x=id;while(x&&GN.t[x]){x=GN.t[x].p;if(x)S.open.add(x)}
  renderTree();renderDet();location.hash='t'+id;
}

/* ===== بطاقة مجموعة معنى ===== */
function gidCard(gid,q){
  const g=GN.g[gid];if(!g)return'';
  const L=layerOf(g.w);
  const lar={sa:'صحيحان فقط',mx:'صحيحان + سنن',zu:'زوائد — سنن'}[L];
  const books=Object.entries(g.w||{}).map(([b,ns])=>
    `<span class="bk"><b>${BAR[b]}</b> ${ns.slice(0,8).map(n=>`<a href="index.html#sanad.${b}.${n}">${arNum(n)}</a>`).join('،')}${ns.length>8?` <span class="mut">+${arNum(ns.length-8)}</span>`:''}</span>`).join('');
  const mats=Object.entries(g.w||{}).map(([b,ns])=>
    `<div class="mbk"><div class="mbk-h" onclick="loadBk(this,'${b}',${gid})"><span class="car">▸</span> ${BAR[b]} <span class="mut">${arNum(ns.length)} موضعاً — متن وحكم وسند</span></div><div class="mbk-c" hidden></div></div>`).join('');
  const rel=relGids(gid,8);
  const relHtml=rel.length?`<div class="mut" style="margin-top:8px">معاني في الموضوع نفسه:</div><div class="rel">${rel.map(g2=>{const gg=GN.g[g2];if(!gg)return'';const L2=layerOf(gg.w);return `<span class="rchip" onclick="showG(${g2})"><i class="d${L2}"></i>${esc(gg.t.length>40?gg.t.slice(0,40)+'…':gg.t)}</span>`}).join('')}</div>`:'';
  return `<div class="card" id="g${gid}">
    <div><span class="badge bd-${L}">${lar}</span> ${g.h?`<span class="badge bd-h">${esc(g.h)}</span>`:''} <span class="mut">#${arNum(gid)}</span></div>
    <p class="taraf">${hlq(g.t,q)}</p>
    <div class="meta">رواه ${arNum(g.s)} من الصحابة · ورود ${arNum(g.r)} مرة في الأمهات</div>
    <div class="books">${books}</div>
    ${mats}
    ${relHtml}
  </div>`;
}

/* ===== تحميل كسول لحزم det (متون+أحكام+أسانيد) ===== */
const BDET={};
function bookDet(b){
  if(BDET[b])return BDET[b];
  const p=fetch(b+'-det.json.gz').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()})
    .then(ab=>JSON.parse(pako.ungzip(new Uint8Array(ab),{to:'string'})));
  p.catch(()=>{if(BDET[b]===p)delete BDET[b]});
  BDET[b]=p;return p;
}
const vb=v=>{let cl='v-df';if(/صحيح/.test(v))cl='v-ok';else if(/حسن/.test(v))cl='v-hs';else if(/ضعيف|موضوع|مرتاب|متهم|واهي|منكر|شديد/.test(v))cl='v-wk';return `<span class="bdg ${cl}">${esc(v)}</span>`};
function matnHtml(d,b,n){
  const h=d.d[n];if(!h)return'';
  const raw=d.s[n]||[];const chains=Array.isArray(raw[0])?raw:[raw];
  return `<div class="mh">
    <div class="mh-h"><b>#${arNum(n)}</b> ${chains.map(c=>vb(c[0]||'')).join(' ')} <a class="src" href="index.html#sanad.${b}.${n}">السند ←</a></div>
    <p class="matn2">${esc(h.m)}</p>
    ${chains.map((c,i)=>`<details class="rc"><summary>السند ${chains.length>1?arNum(i+1)+' — ':''}${arNum((c[1]||[]).length)} راوياً</summary><div class="rw">${esc((c[1]||[]).join(' ← '))}</div></details>`).join('')}
  </div>`;
}
async function loadBk(el,b,gid){
  const box=el.nextElementSibling;
  if(!box.hidden){box.hidden=true;el.querySelector('.car').textContent='▸';return}
  box.hidden=false;el.querySelector('.car').textContent='▾';
  if(box.dataset.done)return;
  box.innerHTML='<p class="mut" style="margin:6px">يُحمّل…</p>';
  try{
    const d=await bookDet(b);
    const nums=(GN.g[gid].w[b]||[]).slice(0,12);
    box.innerHTML=nums.map(n=>matnHtml(d,b,n)).join('')
      +((GN.g[gid].w[b]||[]).length>12?`<p class="mut" style="margin:6px">…و${arNum(GN.g[gid].w[b].length-12)} موضعاً آخر — من المختبر</p>`:'');
    box.dataset.done='1';
  }catch(e){box.innerHTML=`<p class="mut" style="margin:6px">تعذّر التحميل — <a href="#" onclick="const c=this.closest('.mbk-c');c.hidden=true;c.removeAttribute('data-done');this.closest('.mbk').querySelector('.mbk-h').click();return false">إعادة المحاولة</a></p>`}
}
/* معاني في الموضوع نفسه (hs في البيانات أرقام حديث الكتاب لا معاني) */
let gidT={};
function relGids(gid,cap){
  if(!gidT._){gidT._=1;for(const t in GN.tg)for(const g of GN.tg[t]){(gidT[g]=gidT[g]||[]).push(t)}}
  const out=[],seen=new Set([String(gid)]);
  for(const t of gidT[gid]||[])for(const g2 of GN.tg[t]||[]){const k=String(g2);if(seen.has(k))continue;seen.add(k);out.push(g2);if(out.length>=cap)return out}
  return out;
}
function showG(gid){document.getElementById('det').innerHTML=gidCard(gid);location.hash='g'+gid}

/* ===== جزء التفاصيل ===== */
let page=0;const PER=50;let curList=[];
function renderDet(){
  const el=document.getElementById('det');
  if(S.q){return renderSearch(el)}
  if(!S.topic){el.innerHTML='<p class="mut">اختر موضوعاً من الشجرة، أو ابحث في المعاني.</p>';return}
  const tid=S.topic;
  const cov=GN.cov[tid];
  if(!GN.tg[tid]){ /* عقدة داخلية: ملخص طبقي عبر الأوراق التابعة */
    let sa=0,mx=0,zu=0;const st=[tid];const leaves=[];
    while(st.length){const x=st.pop();(kids[x]||[]).forEach(k=>st.push(k));if(GN.cov[x])leaves.push(x)}
    for(const lf of leaves){const c=GN.cov[lf];sa+=c.sa.length;mx+=c.mx.length;zu+=c.zu.length}
    el.innerHTML=`<h3 style="margin:4px 0">${esc(GN.t[tid].n)}</h3>
      <p class="mut">${arNum(leaves.length)} موضوعاً مسنداً · ${arNum(sa+mx+zu)} معنى</p>
      <div class="chips"><span class="chip"><b style="color:var(--ok)">${arNum(sa)}</b>صحيحان فقط</span>
      <span class="chip"><b style="color:var(--acc2)">${arNum(mx)}</b>صحيحان + سنن</span>
      <span class="chip"><b style="color:var(--acc3)">${arNum(zu)}</b>زوائد سنن</span></div>
      <p class="mut">الأحاديث تظهر مجمّعة بالمعنى عند اختيار موضوع مسند.</p>`;
    return;
  }
  /* ورقة: معاني مرتبة صحيحان → صحيحان+سنن → زوائد */
  const ord=[...(cov?cov.sa:[]),...(cov?cov.mx:[]),...(cov?cov.zu:[])];
  const seen=new Set(ord);const extra=(GN.tg[tid]||[]).filter(g=>!seen.has(g));
  curList=ord.concat(extra);page=0;
  const sa=cov?cov.sa.length:0,mx=cov?cov.mx.length:0,zu=cov?cov.zu.length:0;
  el.innerHTML=`<h3 style="margin:4px 0">${esc(GN.t[tid].n)}</h3>
    <div class="chips"><span class="chip"><b style="color:var(--ok)">${arNum(sa)}</b>صحيحان فقط</span>
    <span class="chip"><b style="color:var(--acc2)">${arNum(mx)}</b>صحيحان + سنن</span>
    <span class="chip"><b style="color:var(--acc3)">${arNum(zu)}</b>زوائد سنن</span>
    <span class="chip"><b>${arNum(curList.length)}</b>مجموعة معنى</span></div>
    <div id="clist"></div>
    ${curList.length>PER?`<div style="text-align:center"><button class="btn" id="more">المزيد (${arNum(curList.length-PER)})</button></div>`:''}`;
  paintCards(el);
}
function paintCards(el){
  const c=el.querySelector('#clist');
  const slice=curList.slice(page*PER,(page+1)*PER);
  c.insertAdjacentHTML('beforeend',slice.map(g=>gidCard(g)).join(''));
  page++;
  const mb=document.getElementById('more');
  if(mb){const rest=curList.length-page*PER;
    if(rest<=0)mb.parentElement.remove();
    else mb.textContent=`المزيد (${arNum(rest)})`;
    mb.onclick=()=>paintCards(el)}
}
function renderSearch(el){
  const q=norm(S.q);if(!q){el.innerHTML='<p class="mut">اكتب للبحث في أطراف المعاني.</p>';return}
  if(/^#?\d+$/.test(S.q.trim())){const gid=S.q.trim().replace('#','');
    el.innerHTML=GN.g[gid]?gidCard(gid):'<p class="mut">لا مجموعة بهذا الرقم.</p>';return}
  const hits=[];for(const gid in normT){if(normT[gid].includes(q)){hits.push(gid);if(hits.length>=80)break}}
  el.innerHTML=`<p class="mut">${arNum(hits.length)}${hits.length>=80?'+':''} نتيجة</p>`+hits.map(g=>gidCard(g,S.q.trim())).join('');
}
function decHash(){
  const h=(location.hash||'').replace('#','');
  if(/^g\d+$/.test(h))S.gid=h.slice(1);
  if(/^gid=\d+$/.test(h))S.gid=h.split('=')[1];
  if(/^t\d+$/.test(h)){S.topic=h.slice(1);let x=S.topic;while(x&&GN&&GN.t[x]){x=GN.t[x].p;if(x)S.open.add(x)}}
}
addEventListener('hashchange',()=>{if(!GN)return;decHash();renderTree();renderDet();
