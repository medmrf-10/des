<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مِشفَى — دفتر صحتك</title>
<link rel="stylesheet" href="../shared/theme.css"><style>
body{max-width:560px;margin:0 auto;padding:22px 14px 60px}
h1{color:var(--acc);font-size:1.3rem;text-align:center}
.sub{color:var(--dim);font-size:.8rem;text-align:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-bottom:12px}
.lbl{font-size:.74rem;color:var(--dim);margin:10px 0 4px}
.sl{display:flex;align-items:center;gap:10px}
.sl input[type=range]{flex:1;accent-color:var(--acc)}
.sl b{color:var(--acc);width:34px;font-size:.9rem;text-align:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{background:none;border:1px solid var(--border);border-radius:99px;color:var(--dim);font-family:inherit;font-size:.7rem;padding:5px 13px;cursor:pointer}
.pills button.on{color:var(--acc);border-color:var(--acc)}
button.go{width:100%;background:linear-gradient(135deg,#c9a24b,#8a6a2f);border:none;border-radius:10px;color:#0b0f1a;font-family:inherit;font-weight:700;padding:11px;cursor:pointer;margin-top:12px}
.chart{display:flex;gap:3px;align-items:flex-end;height:70px;justify-content:center;margin-top:8px}
.chart i{width:12px;border-radius:3px 3px 0 0;background:var(--card2);position:relative}
.chart i span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:.55rem;color:var(--dim)}
.row{display:flex;gap:10px;font-size:.76rem;padding:8px 0;border-bottom:1px dashed var(--border);align-items:center}
.row .d{color:var(--dim);font-size:.62rem;width:70px}
.row .e{flex:1}
.row .pg{color:var(--acc);font-size:.64rem}
input[type=number]{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:inherit;padding:9px;font-size:.84rem}
</style></head><body>
<h1>مِشفَى</h1><div class="sub">صحتك يومياً: نوم، طاقة، ألم — الجسد أمانة</div>
<div class="card">
<div class="lbl">ساعات النوم</div>
<input type="number" id="sl" min="0" max="14" step="0.5" placeholder="كم ساعة نمت؟">
<div class="lbl">مستوى الطاقة (١-١٠)</div>
<div class="sl"><input type="range" id="en" min="1" max="10" value="5"><b id="env">5</b></div>
<div class="lbl">ألم/انزعاج جسدي</div>
<div class="pills" id="pl">
<button data-p="">لا شيء</button><button data-p="رأس">رأس</button><button data-p="ظهر">ظهر</button><button data-p="معدة">معدة</button><button data-p="تعب عام">تعب عام</button>
</div>
<button class="go" id="save">سجّل صحة اليوم</button>
</div>
<div class="card"><b style="color:var(--acc);font-size:.82rem">الطاقة — آخر ١٤ يوماً</b><div class="chart" id="ch"></div></div>
<div id="hist"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const K='mishfa_v1';const D=()=>JSON.parse(localStorage.getItem(K)||'{}');const S=o=>localStorage.setItem(K,JSON.stringify(o));
let pain='';
document.addEventListener('click',e=>{
 const b=e.target.closest('#pl button');if(b){pain=b.dataset.p;[...document.querySelectorAll('#pl button')].forEach(x=>x.classList.toggle('on',x.dataset.p===pain));return}
 if(e.target.id==='save'){const day=new Date().toISOString().slice(0,10);const d=D();d[day]={sl:+$('sl').value||0,en:+$('en').value,pain};S(d);render()}
});
$('en').addEventListener('input',e=>$('env').textContent=e.target.value);
function render(){
 const d=D(),days=Object.keys(d).sort().slice(-14);
 $('ch').innerHTML=days.map(k=>{const e=d[k].en;return `<i style="height:${e*7}px;background:${e>=7?'var(--ok)':e>=4?'var(--acc)':'#e07070'}"><span>${e}</span></i>`}).join('')||'<div class="sub">لا بيانات بعد</div>';
 $('hist').innerHTML=days.slice().reverse().map(k=>`<div class="row"><span class="d">${k.slice(5)}</span><span class="e">نوم ${d[k].sl||'—'}س · طاقة ${d[k].en}/10${d[k].pain?' · '+d[k].pain:''}</span><span class="pg">${d[k].en>=7?'قوي':d[k].en>=4?'متوسط':'منخفض'}</span></div>`).join('');
 const sls=days.map(k=>d[k].sl).filter(x=>x>0);
 if(sls.length>=3){const avg=(sls.reduce((a,b)=>a+b,0)/sls.length).toFixed(1);
  $('hist').innerHTML+=`<div class="row" style="border:none;color:var(--acc)">متوسط نومك: ${avg} ساعة ${avg<6?'— قليل جداً':''}</div>`}
}
render();
</script></body></html>
