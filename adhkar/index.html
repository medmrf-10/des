<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أَذكار — وردك بالعدّاد</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>📿 أَذكار</h1><p class="tagline">ورد الصباح والمساء بالعدّاد — اضغط على البطاقة لتحسب، يُخزَّن تقدّمك محلياً</p></header>
<div class="wrap">
 <div class="seg"><button class="sg on" data-m="sabah">أذكار الصباح</button><button class="sg" data-m="masaa">أذكار المساء</button></div>
 <div class="card bar-card"><div class="pbar"><i id="pbar"></i></div><div id="pstat" class="pstat"></div></div>
 <div id="list"></div>
 <button class="btn ghost" id="reset" style="width:100%">↺ تصفير الورد</button>
</div>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ADHKAR={
sabah:[
 {t:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ — اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ… (آية الكرسي)',n:1},
 {t:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ',n:3},
 {t:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ',n:3},
 {t:'قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',n:3},
 {t:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',n:1},
 {t:'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ',n:1},
 {t:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ (سيد الاستغفار)',n:1},
 {t:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا',n:3},
 {t:'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ',n:1},
 {t:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',n:7},
 {t:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',n:100},
 {t:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',n:100},
 {t:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ',n:3},
 {t:'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ',n:100}
],
masaa:[
 {t:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ — اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ… (آية الكرسي)',n:1},
 {t:'قُلْ هُوَ اللَّهُ أَحَدٌ… (الإخلاص)',n:3},
 {t:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ… (الفلق)',n:3},
 {t:'قُلْ أَعُوذُ بِرَبِّ النَّاسِ… (الناس)',n:3},
 {t:'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ',n:1},
 {t:'اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ',n:1},
 {t:'سيد الاستغفار: اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ…',n:1},
 {t:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا',n:3},
 {t:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ',n:1},
 {t:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ…',n:7},
 {t:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ',n:3},
 {t:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',n:100},
 {t:'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ',n:100}
]};
const today=new Date().toISOString().slice(0,10);
let state={};
try{state=JSON.parse(localStorage.getItem('adhkar_'+today)||'{}')}catch(e){}
let MODE='sabah';
function render(){
 const list=ADHKAR[MODE];let done=0,tot=0;
 $('#list').innerHTML=list.map((a,i)=>{
  const c=state[MODE+':'+i]||0;done+=Math.min(c,a.n);tot+=a.n;
  const full=c>=a.n;
  return `<div class="card dh ${full?'done':''}" data-i="${i}"><div class="dh-t">${esc(a.t)}</div><div class="dh-f"><span class="cnt">${c.toLocaleString('ar-EG')} / ${a.n.toLocaleString('ar-EG')}</span><span class="tick">${full?'✓ تمّ':'اضغط للعدّ'}</span></div></div>`;
 }).join('');
 $('#pbar').style.width=(tot?done/tot*100:0)+'%';
 $('#pstat').innerHTML=`${done.toLocaleString('ar-EG')} / ${tot.toLocaleString('ar-EG')} — ${tot-done?('بقي '+(tot-done).toLocaleString('ar-EG')):'اكتمل الورد ✓'}`;
}
document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));b.classList.add('on');MODE=b.dataset.m;render()});
$('#list').addEventListener('click',e=>{
 const c=e.target.closest('.dh');if(!c)return;
 const i=+c.dataset.i,k=MODE+':'+i;
 state[k]=(state[k]||0)+1;
 if(state[k]>ADHKAR[MODE][i].n)state[k]=ADHKAR[MODE][i].n;
 localStorage.setItem('adhkar_'+today,JSON.stringify(state));
 render();
});
$('#reset').onclick=()=>{if(!confirm('تصفير ورد اليوم؟'))return;state={};localStorage.setItem('adhkar_'+today,'{}');render()};
render();
</script>
<script src="../shared/palette.js"></script><script src="../shared/feedback.js"></script>
</body></html>
