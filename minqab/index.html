<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنقَب — منجم العمق</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.dig{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.dig .n{font-family:var(--font-ar);font-size:13px}
.dig .out{font-size:12px;color:var(--ok);margin-top:5px}
.dig .meta{font-size:10.5px;color:var(--dim);margin-top:5px}
.timer{font-family:var(--font-ui);font-size:38px;text-align:center;color:var(--acc);margin:14px 0;letter-spacing:2px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنقَب <span class="muted">— منجم العمق</span></h2>
<div class="muted">احفر عميقاً: جلسة مركزة → سجّل ما استخرجته. العمق يُقاس بالإخراج لا بالمدة.</div>
<div id="act"></div>
<div class="card"><div class="t">حفرة جديدة</div>
<input id="t" placeholder="ماذا تحفر؟ (بحث، كتابة، مراجعة…)">
<div style="display:flex;gap:8px;margin-top:9px">
<button class="btn" id="s25">25 د</button><button class="btn" id="s50" style="background:var(--acc2)">50 د</button>
<button class="btn ghost" id="s90">90 د</button></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let D=LS('minqab',[]);
let act=LS('minqab_act',null);
const start=mins=>{
 const t=$('#t').value.trim();if(!t)return;
 act={t,s:Date.now(),until:Date.now()+mins*60000,total:mins};SV('minqab_act',act);render();
};
$('#s25').onclick=()=>start(25);$('#s50').onclick=()=>start(50);$('#s90').onclick=()=>start(90);
function tick(){
 const a=$('#act');if(!act)return;
 const left=Math.max(0,act.until-Date.now()),mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000);
 a.innerHTML='<div class="card" style="border-color:var(--acc);text-align:center"><div class="muted" style="font-size:10px">تحفر في</div>'+
 '<div style="font-family:var(--font-ar);font-size:15px;margin:6px 0">'+esc(act.t)+'</div>'+
 '<div class="timer">'+arN(mm)+':'+String(ss).padStart(2,'0')+'</div>'+
 '<div style="display:flex;gap:8px;justify-content:center">'+
 '<button class="btn" id="fin">'+(left<=0?'⏰ انتهى — سجّل المستخرَج':'أنهِ مبكراً')+'</button>'+
 '<button class="btn ghost" id="ab" style="color:var(--acc2)">ألغِ</button></div></div>';
 $('#fin').onclick=()=>{
  const out=prompt('ماذا استخرجت من الحفرة؟','');
  D.unshift({t:act.t,dur:Math.round((act.total*60000-Math.max(0,act.until-Date.now()))/60000),out:out||'',at:Date.now()});
  SV('minqab',D);act=null;localStorage.removeItem('minqab_act');$('#t').value='';render();
 };
 $('#ab').onclick=()=>{if(confirm('ألغِ الحفرة؟')){act=null;localStorage.removeItem('minqab_act');render()}};
}
function render(){
 tick();
 const tot=D.reduce((s,x)=>s+x.dur,0);
 $('#stats').innerHTML='<span class="stat">حفر: <b>'+arN(D.length)+'</b></span>'+
 '<span class="stat">دقائق عمق: <b>'+arN(tot)+'</b></span>'+
 '<span class="stat">ساعات: <b>'+(tot/60).toFixed(1)+'</b></span>';
 $('#list').innerHTML=D.slice(0,15).map(x=>'<div class="dig"><div class="n">'+esc(x.t)+'</div>'+
 (x.out?'<div class="out">⛏️ '+esc(x.out)+'</div>':'')+
 '<div class="meta">'+arN(x.dur)+' د · '+new Date(x.at).toLocaleDateString('ar-EG')+'</div></div>').join('')||
 '<div class="muted" style="margin-top:12px">لا حفر بعد — ابدأ الأولى.</div>';
}
setInterval(tick,1000);
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="minqab" data-title="مِنقَب"></script>
</body>
</html>
