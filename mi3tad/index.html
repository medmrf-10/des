<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَد — عدّادك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:420px;margin:0 auto;padding:14px;text-align:center}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:50%;width:180px;height:180px;font-size:60px;font-weight:700;cursor:pointer;font-family:var(--font-ar);margin:24px auto;display:block;transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);width:auto;height:auto;border-radius:9px;padding:8px 15px;font-size:11.5px;display:inline-block;margin:4px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:13px 17px;margin-top:11px;text-align:right}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13px;color:var(--acc);margin-bottom:7px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.opt{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 13px;margin:3px;cursor:pointer;font-size:12px}
.opt.on{background:var(--acc);color:#14140f;font-weight:700}
.hist{font-size:11px;color:var(--dim);max-height:120px;overflow-y:auto}
.hist div{padding:3px 0;border-bottom:1px dashed var(--border)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَد <span class="muted">— عدّادك</span></h2>
<div class="muted">عدّاد لمسي — اختر ذكرك، وعُدّ باللمس.</div>
<div id="opts" style="margin-top:12px"></div>
<button class="btn" id="cnt">٠</button>
<div style="display:flex;justify-content:center;gap:8px">
<button class="btn ghost" id="rst">تصفير</button>
<button class="btn ghost" id="tgt">الهدف: ١٠٠</button>
</div>
<div style="margin-top:10px"><span class="stat">اليوم: <b id="td">٠</b></span><span class="stat">المجموع: <b id="tt">٠</b></span></div>
<div class="card"><div class="t">جلستك</div><div class="hist" id="hist">—</div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
const DH=['سبحان الله','الحمد لله','لا إله إلا الله','الله أكبر','لا حول ولا قوة إلا بالله','أستغفر الله','سبحان الله وبحمده','لا إله إلا أنت سبحانك إني كنت من الظالمين','اللهم صل على محمد','حسبي الله ونعم الوكيل'];
let cur=0,tgt=100,count=0;
let S=LS('mi3tad',{tot:0,days:{},hist:[]});
if(!S.days)S.days={};if(!S.hist)S.hist=[];
$('#opts').innerHTML=DH.map((d,i)=>'<span class="opt'+(i===0?' on':'')+'" data-i="'+i+'">'+d+'</span>').join('');
$('#opts').onclick=e=>{
 const o=e.target.closest('.opt');if(!o)return;
 document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));o.classList.add('on');
 cur=+o.dataset.i;count=0;$('#cnt').textContent='٠';
};
$('#cnt').onclick=()=>{
 count++;S.tot++;S.days[today()]=(S.days[today()]||0)+1;
 S.hist.unshift({t:new Date().toISOString(),d:DH[cur],c:count});
 if(S.hist.length>30)S.hist.pop();
 SV('mi3tad',S);
 $('#cnt').textContent=arN(count);
 if(count>=tgt){$('#cnt').textContent='✓ '+arN(count);navigator.vibrate&&navigator.vibrate(120)}
 render();
};
$('#rst').onclick=()=>{count=0;$('#cnt').textContent='٠'};
$('#tgt').onclick=()=>{
 const n=prompt('الهدف:',tgt);if(n){tgt=+n||100;$('#tgt').textContent='الهدف: '+arN(tgt)}
};
function render(){
 $('#td').textContent=arN(S.days[today()]||0);$('#tt').textContent=arN(S.tot);
 $('#hist').innerHTML=S.hist.slice(0,10).map(h=>'<div>'+h.t.slice(11,16)+' — '+h.d+' ×'+arN(h.c)+'</div>').join('')||'—';
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3tad" data-title="مِعتَد"></script>
</body>
</html>
