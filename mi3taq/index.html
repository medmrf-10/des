<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَق — الإعتاق</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:var(--font-ar);font-size:12.5px;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.rl{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px;display:flex;align-items:center;gap:10px}
.rl .x{flex:1;font-family:var(--font-ar);font-size:13px}
.rl.free .x{text-decoration:line-through;opacity:.4}
.rl .st{font-size:10px;padding:2px 8px;border-radius:6px;background:var(--acc2);color:#14140f}
.rl.free .st{background:var(--ok)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:14px;text-align:center;margin-top:11px;font-family:var(--font-ar);font-size:13px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَق <span class="muted">— الإعتاق</span></h2>
<div class="muted">ما الذي تريد أن تعتق نفسك منه؟ شيء مملوك يثقلك، التزام قديم، ضغينة، خوف — اعتق نفسك منه شيئاً فشيئاً.</div>
<div class="card"><div class="t">أعتق نفسي من</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<input id="nm" placeholder="(الضغينة تجاه…، فوضى الملفات، كثرة التطبيقات…)" style="flex:1;min-width:170px">
<button class="btn" id="ad">أضِف</button></div></div>
<div id="banner"></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let R=LS('mi3taq',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 R.unshift({n,free:false,at:Date.now()});
 SV('mi3taq',R);$('#nm').value='';render();
};
function render(){
 const fr=R.filter(x=>x.free).length;
 $('#banner').innerHTML=R.length&&fr===R.length?'<div class="banner" style="color:var(--ok)">🕊 اعتقت نفسك من كل شيء — خفيف.</div>':
 '<div class="banner">أعتقت <b>'+arN(fr)+'/'+arN(R.length)+'</b></div>';
 $('#stats').innerHTML='<span class="stat">بانتظار العتق: <b>'+arN(R.length-fr)+'</b></span>'+
 '<span class="stat">معتوقة: <b style="color:var(--ok)">'+arN(fr)+'</b></span>';
 $('#list').innerHTML=R.map((x,i)=>{
  const gi=R.indexOf(x);
  return '<div class="rl'+(x.free?' free':'')+'"><span class="x">'+esc(x.n)+'</span>'+
  '<span class="st">'+(x.free?'عتقت':'رقّ')+'</span>'+
  (x.free?'':'<button class="btn ghost" data-f="'+gi+'" style="color:var(--ok);font-size:10px">اعتقت</button>')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 7px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا شيء — ما الذي يثقلك؟</div>';
}
$('#list').onclick=e=>{
 const f=e.target.closest('[data-f]'),d=e.target.closest('[data-d]');
 if(f){R[+f.dataset.f].free=true;SV('mi3taq',R);render();return}
 if(d&&confirm('احذف؟')){R.splice(+d.dataset.d,1);SV('mi3taq',R);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3taq" data-title="مِعتَق"></script>
</body>
</html>
