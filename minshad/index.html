<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنشَد — المذكرة الصوتية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.btn.rec{background:var(--acc2)}
.memo{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.memo .nm{font-family:var(--font-ar);font-size:13px}
.memo .meta{font-size:10.5px;color:var(--dim);margin-top:5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.memo audio{width:100%;margin-top:8px;height:32px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.recing{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنشَد <span class="muted">— المذكرة الصوتية</span></h2>
<div class="muted">فكرة سريعة؟ سجّلها صوتاً قبل أن تضيع — تُحفظ على جهازك.</div>
<div class="card"><div class="t">سجّل</div>
<input id="nm" placeholder="اسم المذكرة (فكرة درس، تذكير، خاطرة)…">
<div style="display:flex;gap:9px;margin-top:10px;align-items:center">
<button class="btn rec" id="rec">⏺ ابدأ التسجيل</button>
<button class="btn" id="stop" style="display:none">⏹ أنهِ واحفظ</button>
<span class="muted" id="tm"></span></div>
<div class="muted" style="margin-top:9px">تنبيه: المذكرات تُحفظ في متصفحك — الطويلة قد تستهلك مساحة.</div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let M=LS('minshad',[]);
let mr=null,chunks=[],t0=0,iv=null;
$('#rec').onclick=async()=>{
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
 mr=new MediaRecorder(st);chunks=[];t0=Date.now();
 mr.ondataavailable=e=>chunks.push(e.data);
 mr.onstop=()=>{
  const b=new Blob(chunks,{type:'audio/webm'});
  const r=new FileReader();
  r.onload=()=>{
   M.unshift({n:$('#nm').value.trim()||'مذكرة '+arN(M.length+1),at:Date.now(),dur:Math.round((Date.now()-t0)/1000),d:r.result});
   try{SV('minshad',M)}catch(e){M.shift();alert('ممتلئ — احذف مذكرات قديمة');return}
   $('#nm').value='';render();
  };
  r.readAsDataURL(b);
  st.getTracks().forEach(t=>t.stop());
 };
 mr.start();
 $('#rec').style.display='none';$('#stop').style.display='inline-block';$('#stop').classList.add('recing');
 iv=setInterval(()=>{$('#tm').textContent=arN(Math.round((Date.now()-t0)/1000))+' ث'},500);
 }catch(e){alert('المايك مرفوض أو غير متاح')}
};
$('#stop').onclick=()=>{if(mr)mr.stop();clearInterval(iv);$('#rec').style.display='inline-block';$('#stop').style.display='none';$('#stop').classList.remove('recing');$('#tm').textContent=''};
function render(){
 $('#stats').innerHTML='<span class="stat">مذكرات: <b>'+arN(M.length)+'</b></span>'+
 '<span class="stat">إجمالي الدقائق: <b>'+arN(Math.round(M.reduce((s,m)=>s+m.dur,0)/60))+'</b></span>';
 $('#list').innerHTML=M.map((m,i)=>'<div class="memo"><div class="nm">'+esc(m.n)+'</div>'+
 '<audio controls src="'+m.d+'"></audio>'+
 '<div class="meta"><span>'+new Date(m.at).toLocaleDateString('ar-EG')+'</span><span>'+arN(m.dur)+' ث</span>'+
 '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2)">✕</button></div></div>').join('')||'<div class="muted" style="margin-top:12px">لا مذكرات — سجّل أول خاطرة.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('حذف المذكرة؟')){M.splice(+d.dataset.d,1);SV('minshad',M);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="minshad" data-title="مِنشَد"></script>
</body>
</html>
