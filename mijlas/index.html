<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِجلَس — مجلس المساء</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;min-height:56px;resize:vertical;margin-top:6px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.log{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 15px;margin-top:8px}
.log .dt{font-size:11px;color:var(--acc);font-weight:700}
.log .row{font-family:var(--font-ar);font-size:12.5px;margin-top:7px;line-height:1.7}
.log .row b{color:var(--acc2);font-size:10.5px;display:block}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِجلَس <span class="muted">— مجلس المساء</span></h2>
<div class="muted">ثلاثة أسطر قبل النوم: ماذا تعلمت، ماذا فعلت، وماذا غداً.</div>
<div class="card"><div class="t">مجلس الليلة</div>
<div class="muted">ماذا تعلمت؟</div><textarea id="lr" placeholder="آية فهمتها، معلومة، فكرة…"></textarea>
<div class="muted" style="margin-top:8px">ماذا أنجزت؟</div><textarea id="dd" placeholder="أعمال، عبادة، درس…"></textarea>
<div class="muted" style="margin-top:8px">خطة الغد؟</div><textarea id="tm" placeholder="أهم ثلاثة أشياء…"></textarea>
<button class="btn" id="sv" style="margin-top:11px">سجّل المجلس</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let L=LS('mijlas',[]);
$('#sv').onclick=()=>{
 const lr=$('#lr').value.trim(),dd=$('#dd').value.trim(),tm=$('#tm').value.trim();
 if(!lr&&!dd&&!tm)return;
 const today=new Date().toISOString().slice(0,10);
 const ex=L.find(x=>x.d===today);
 if(ex){ex.lr=lr;ex.dd=dd;ex.tm=tm}else L.unshift({d:today,at:Date.now(),lr,dd,tm});
 SV('mijlas',L);$('#lr').value=$('#dd').value=$('#tm').value='';render();
};
function streak(){
 let s=0,d=new Date();
 for(;;){const k=d.toISOString().slice(0,10);
  if(L.some(x=>x.d===k)){s++;d=new Date(d-DAY)}else if(s===0&&d.toISOString().slice(0,10)===new Date().toISOString().slice(0,10)){d=new Date(d-DAY);continue}else break}
 return s;
}
const DAY=864e5;
function render(){
 $('#stats').innerHTML='<span class="stat">مجالس: <b>'+arN(L.length)+'</b></span>'+
 '<span class="stat">سلسلة الليالي: <b>'+arN(streak())+'</b></span>';
 $('#list').innerHTML=L.slice(0,14).map(x=>'<div class="log"><div class="dt">'+x.d+'</div>'+
 (x.lr?'<div class="row"><b>تعلمت</b>'+esc(x.lr)+'</div>':'')+
 (x.dd?'<div class="row"><b>أنجزت</b>'+esc(x.dd)+'</div>':'')+
 (x.tm?'<div class="row"><b>غداً</b>'+esc(x.tm)+'</div>':'')+'</div>').join('')||
 '<div class="muted" style="margin-top:12px">لا مجالس — سجّل الليلة.</div>';
 const today=new Date().toISOString().slice(0,10),ex=L.find(x=>x.d===today);
 if(ex){$('#lr').value=ex.lr||'';$('#dd').value=ex.dd||'';$('#tm').value=ex.tm||''}
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mijlas" data-title="مِجلَس"></script>
</body>
</html>
