<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِنحَت — اليوم المثالي</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
textarea,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:120px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.ideal{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:14px;font-family:var(--font-ar);font-size:13px;line-height:1.9;white-space:pre-wrap}
.chk{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-top:6px;cursor:pointer}
.chk .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.chk.on .ck{background:var(--acc);border-color:var(--acc);color:#14140f}
.chk .x{flex:1;font-family:var(--font-ar);font-size:12.5px}
.chk.on .x{opacity:.5;text-decoration:line-through}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِنحَت <span class="muted">— اليوم المثالي</span></h2>
<div class="muted">انحت يومك المثالي العادي بوصف: ماذا يحوي من فجره لنومه؟ ثم قِس يومك الفعلي عليه.</div>
<div class="card"><div class="t">يومك المثالي (اكتبه مرة)</div>
<textarea id="ideal" placeholder="أستيقظ قبل الفجر بربع ساعة، أصلي، أقرأ وردي، أفطر خفيفاً، أعمل ساعتين مركزتين على…"></textarea>
<button class="btn" id="sv" style="margin-top:9px">احفظ النحت</button></div>
<div id="show"></div>
<div class="card"><div class="t">قِس يومك عليه — علّم ما تحقق</div><div id="chks"></div></div>
<div id="stats"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let ID=LS('minhat_ideal',''),CH=LS('minhat_checks',[]),TD=LS('minhat_today',{});
const today=()=>new Date().toISOString().slice(0,10);
$('#sv').onclick=()=>{
 const t=$('#ideal').value.trim();if(!t)return;
 ID=t;SV('minhat_ideal',ID);
 CH=t.split(/[.،؛\n]/).map(s=>s.trim()).filter(s=>s.length>8).slice(0,12);
 SV('minhat_checks',CH);render();
};
function render(){
 $('#ideal').value=ID;
 $('#show').innerHTML=ID?'<div class="ideal">'+esc(ID)+'</div>':'<div class="muted" style="margin-top:12px">لم تنحت يومك المثالي — اكتبه فوق.</div>';
 const t=today(),td=TD[t]||{};
 const done=CH.filter((x,i)=>td[i]).length;
 $('#stats').innerHTML=ID?'<span class="stat">مقاسات يومك: <b>'+arN(CH.length)+'</b></span>'+
 '<span class="stat">تحقق اليوم: <b style="color:var(--ok)">'+arN(done)+'/'+arN(CH.length)+'</b></span>'+
 (CH.length&&done===CH.length?'<span class="stat" style="color:var(--ok)">🏆 يوم مثالي!</span>':''):'';
 $('#chks').innerHTML=CH.map((x,i)=>'<div class="chk'+(td[i]?' on':'')+'" data-i="'+i+'">'+
 '<span class="ck">'+(td[i]?'✓':'')+'</span><span class="x">'+esc(x)+'</span></div>').join('')||
 '<div class="muted" style="margin-top:9px">احفظ وصفك أولاً — سيُقسم تلقائياً لمقاسات.</div>';
}
$('#chks').onclick=e=>{
 const c=e.target.closest('.chk');if(!c)return;
 const i=+c.dataset.i,t=today();
 TD[t]=TD[t]||{};TD[t][i]=!TD[t][i];SV('minhat_today',TD);render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="minhat" data-title="مِنحَت"></script>
</body>
</html>
