<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مسباح — مسبحة رقمية بذكر من السنة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:16px;text-align:center}
#dh{font-family:var(--font-ar);font-size:19px;line-height:2;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;min-height:70px}
#dh .s{display:block;font-size:10.5px;color:var(--dim);margin-top:6px}
#cnt{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--card2),var(--card));border:3px solid var(--acc);margin:22px auto 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#cnt b{font-size:44px;font-family:var(--font-ar);color:var(--acc2);line-height:1}
#cnt span{font-size:10px;color:var(--dim);margin-top:4px}
.tgt{display:flex;gap:7px;justify-content:center;margin:8px 0}
.tgt button{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:99px;padding:5px 14px;font-size:12px;cursor:pointer}
.tgt button.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.stats{display:flex;gap:9px;margin-top:12px}
.st{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px;text-align:center}
.st b{display:block;font-size:18px;color:var(--acc2)}
.st span{font-size:10px;color:var(--dim)}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0;text-align:center">مسباح</h2>
<div class="muted" style="text-align:center">ذكر من السنة يتبدل كل إتمام — اضغط الدائرة أو مسطرة المسافة.</div>
<div id="dh" style="margin-top:14px"></div>
<div id="cnt"><b id="n">٠</b><span id="of">/ ٣٣</span></div>
<div class="tgt">
 <button class="on" data-t="33">٣٣</button>
 <button data-t="100">١٠٠</button>
 <button data-t="500">٥٠٠</button>
 <button data-t="1000">١٠٠٠</button>
</div>
<div class="stats">
 <div class="st"><b id="tot">0</b><span>مجموع اليوم</span></div>
 <div class="st"><b id="rounds">0</b><span>إتمامات</span></div>
 <div class="st"><b id="days">0</b><span>أيام نشطة</span></div>
</div>
<div class="muted" style="margin-top:10px"><button class="btn gh" id="nx">ذكر آخر ↺</button> <button class="btn gh" id="rst">↺ تصفير</button></div>
<script src="../hadith/adhkar.js"></script>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key='misbah_'+new Date().toISOString().slice(0,10);
let ST;try{ST=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){ST={}}
let n=ST.n||0,tgt=ST.tgt||33,rounds=ST.rounds||0,di=ST.di||0;
const save=()=>localStorage.setItem(key,JSON.stringify({n,tgt,rounds,di}));
const days=new Set();for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('misbah_'))days.add(k)}
function dhikr(){const d=ADHKAR[di%ADHKAR.length];
 $('#dh').innerHTML=esc(d.t||'')+'<span class="s">'+esc(d.h||'')+' — حديث '+d.g+'</span>'}
function upd(){$('#n').textContent=n.toLocaleString('ar-EG');
 $('#of').textContent='/ '+tgt.toLocaleString('ar-EG');
 $('#tot').textContent=(rounds*tgt+n).toLocaleString('ar-EG');
 $('#rounds').textContent=rounds.toLocaleString('ar-EG');
 $('#days').textContent=days.size.toLocaleString('ar-EG');
 document.querySelectorAll('.tgt button').forEach(b=>b.classList.toggle('on',+b.dataset.t===tgt));
 if(navigator.vibrate)navigator.vibrate(8)}
$('#cnt').onclick=()=>{n++;
 if(n>=tgt){rounds++;n=0;di++;dhikr();if(navigator.vibrate)navigator.vibrate([30,60,30])}
 save();upd()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('#cnt').click()}});
document.querySelector('.tgt').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 tgt=+b.dataset.t;if(n>=tgt)n=0;save();upd()};
$('#nx').onclick=()=>{di++;dhikr();save()};
$('#rst').onclick=()=>{n=0;save();upd()};
dhikr();upd();
</script>
<script src="../shared/feedback.js" data-pid="misbah" data-title="مسباح"></script>
</body>
</html>
