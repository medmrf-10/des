<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14; --card:#131a22; --card2:#1a2330; --border:#28323f; --txt:#eef3f8; --dim:#93a1b3; --acc:#8b7cf6; --acc2:#5ec8ff}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; background:radial-gradient(1200px 500px at 80% -10%, rgba(139,124,246,.08), transparent), var(--bg); color:var(--txt); min-height:100vh; display:flex; align-items:center; justify-content:center}
.wrap{max-width:440px; width:100%; padding:20px}
h1{font-size:1.5rem; font-weight:700; background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-align:center}
.sub{text-align:center; color:var(--dim); font-size:.8rem; margin-top:6px; margin-bottom:26px}
.app{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:14px; text-decoration:none; color:var(--txt); transition:all .2s; animation:enter .4s cubic-bezier(.22,1,.36,1) both; box-shadow:0 2px 12px rgba(0,0,0,.25)}
.app:active{transform:scale(.98)}
.app:hover{border-color:var(--acc)}
.app:nth-child(2){animation-delay:.06s}
.app:nth-child(3){animation-delay:.12s}
@keyframes enter{from{opacity:0; transform:translateY(12px)}}
.av{width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex:0 0 auto; color:#fff; font-weight:700}
.app .nm{font-weight:700; font-size:1rem}
.app .ds{font-size:.72rem; color:var(--dim); margin-top:3px; line-height:1.5}
.app .go{color:var(--acc2); font-size:1.1rem; margin-inline-start:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>البوابة</h1>
  <div class="sub">كل المواقع في مكان واحد</div>
  <a class="app" href="../">
    <div class="av">س</div>
    <div><div class="nm">بطاقات القرارات</div><div class="ds">أسئلة القرارات بين الوكلاء — تصويت وحسم</div></div>
    <div class="go">←</div>
  </a>
  <a class="app" href="../durus/">
    <div class="av">ت</div>
    <div><div class="nm">Turath</div><div class="ds">مكتبة التراث — سلاسل الدروس والمقاطع والتقييم</div></div>
    <div class="go">←</div>
  </a>
</div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
