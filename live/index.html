<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدروس الحية — شرح منظومة الأجهوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0f1a;color:#f5f1e8;font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.stage{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;justify-content:center;padding:24px 20px 8px}
.card{background:linear-gradient(160deg,#141b2e,#0e1424);border:1px solid #2a3350;border-radius:24px;padding:28px 22px;min-height:42dvh;display:flex;flex-direction:column;justify-content:center;box-shadow:0 18px 50px -12px #000}
.title{font-size:.82rem;color:#8b93b0;text-align:center;letter-spacing:.5px;margin-bottom:18px}
.ph{font-size:1.75rem;line-height:2;text-align:center;direction:rtl;word-break:break-word}
.w{transition:all .12s ease;color:#7f88a8}
.w+.w{margin-inline-start:.32em}
.w.past{color:#dde2f2}
.w.now{color:#ffd98a;transform:scale(1.15);display:inline-block;text-shadow:0 0 24px #ffd98aa6}
.controls{width:100%;max-width:520px;padding:16px 20px 30px}
.bar{height:5px;background:#232b45;border-radius:99px;cursor:pointer;position:relative}
.bar::before{content:'';position:absolute;inset:-10px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a2f,#e8c97a);transition:width .15s linear}
.row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.btn{width:56px;height:56px;border-radius:50%;border:1px solid #3a4670;background:#1a2238;color:#e8c97a;font-size:1.3rem;cursor:pointer}
.btn.big{width:72px;height:72px;font-size:1.7rem;background:linear-gradient(140deg,#c9a24b,#8a6a2f);color:#0b0f1a;border:none}
.time{font-size:.78rem;color:#8b93b0;text-align:center;margin-top:8px;font-variant-numeric:tabular-nums}
.idx{position:fixed;inset:0;background:rgba(5,8,16,.6);backdrop-filter:blur(3px);z-index:50;display:none}
.idx.open{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:62dvh;background:#131a2a;border-radius:22px 22px 0 0;border-top:1px solid #3a4670;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #232b45;font-size:.85rem;color:#e8c97a}
.sheet .cl{background:none;border:none;color:#8b93b0;font-size:1.1rem;cursor:pointer}
.sheet .list{overflow-y:auto;padding:6px 0 20px}
.it{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:none;color:#dde2f2;font-family:inherit;font-size:.95rem;text-align:right;padding:10px 18px;cursor:pointer}
.it .t{color:#8b93b0;font-size:.68rem;font-variant-numeric:tabular-nums;flex:0 0 auto}
.it .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.now{color:#ffd98a}
.it:hover{background:#1a2238}
.ibtn{background:#1a2238;border:1px solid #3a4670;border-radius:10px;color:#e8c97a;font-family:inherit;font-size:.78rem;padding:7px 16px;cursor:pointer;margin-top:10px}
</style>
<link rel="stylesheet" href="/des/shared/theme.css">
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="title" id="ltitle">شرح منظومة الأجهوري في أصول الدين — الشيخ محمد البردوني الحسيمي · الدرس 1</div>
    <div class="ph" id="ph"></div>
  </div>
</div>
<div class="controls">
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="row">
    <button class="btn" id="back">١٥−</button>
    <button class="btn big" id="play">▶</button>
    <button class="btn" id="fwd">+١٥</button>
  </div>
  <div class="time" id="time">0:00 / 8:20</div>
  <div class="row" style="margin-top:6px;gap:10px"><button class="ibtn" id="idx">≡ الفهرس</button><button class="ibtn" id="les">≡ الدروس</button></div>
</div>
<div class="idx" id="idxov">
  <div class="sheet">
    <div class="hd"><span>فهرس الدرس</span><button class="cl" id="idxcl">✕</button></div>
    <div class="list" id="idxlist"></div>
  </div>
</div>
<audio id="au" src="aju.mp3" preload="auto"></audio>
<script>
const au=document.getElementById('au'),ph=document.getElementById('ph'),fill=document.getElementById('fill'),
      play=document.getElementById('play'),tm=document.getElementById('time'),bar=document.getElementById('bar');
let phrases=[];
const qL=(location.search.match(/[?&]l=(\d+)/)||location.hash.match(/l=(\d+)/));
const LID=qL?qL[1]:null;
const qT=(location.search.match(/[?&]t=([\d.]+)/)||location.hash.match(/t=([\d.]+)/));
const B=LID?`../manzuma/lessons/${LID}/`:'./';
if(LID){
  au.src='https://github.com/medmrf-10/des/releases/download/audio-pack/'+LID+'.mp3';
  fetch(B+'title.txt').then(r=>r.ok?r.text():'').then(t=>{if(t)document.getElementById('ltitle').textContent=t.trim()});
}
fetch(B+'phrases.json').then(r=>r.json()).then(P=>{phrases=P;render(0);buildIdx()});
if(qT){au.addEventListener('loadedmetadata',()=>{au.currentTime=+qT[1]},{once:true})}
let curPi=-1,curWi=-1,spans=[];
function render(cur){
  let pi=-1;for(let i=0;i<phrases.length;i++){if(phrases[i].s<=cur)pi=i;else break}
  if(pi!==curPi){
    curPi=pi;curWi=-1;spans=[];
    const P=phrases[Math.max(pi,0)];if(!P)return;
    ph.innerHTML='';
    P.ws.forEach((o,i)=>{
      const s=document.createElement('span');s.className='w';
      s.textContent=o.w;s.onclick=()=>{au.currentTime=o.s};
      ph.appendChild(s);spans.push(s);
    });

  }
  const P=phrases[Math.max(pi,0)];if(!P)return;
  let wi=-1;P.ws.forEach((o,i)=>{if(o.s<=cur)wi=i});
  if(wi!==curWi){
    spans.forEach((s,i)=>s.className='w'+(i===wi?' now':i<wi?' past':''));
    curWi=wi;
  }
}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
au.addEventListener('timeupdate',()=>{render(au.currentTime);if(au.duration)fill.style.width=(au.currentTime/au.duration*100)+'%'});
au.addEventListener('error',()=>{if(au.error){const tm=document.getElementById('time');if(tm){tm.textContent='تعذّر تحميل الصوت — أعد تحميل الصفحة';tm.style.color='#e07070'}ph.textContent='تعذّر تحميل ملف الصوت — تحقق من الاتصال وأعد المحاولة'}});
play.onclick=()=>{if(au.paused){au.play();play.textContent='❚❚'}else{au.pause();play.textContent='▶'}};
document.getElementById('back').onclick=()=>au.currentTime=Math.max(0,au.currentTime-15);
document.getElementById('fwd').onclick=()=>au.currentTime=Math.min(au.duration||0,au.currentTime+15);
bar.onclick=e=>{const r=bar.getBoundingClientRect();au.currentTime=au.duration*((r.right-e.clientX)/r.width)};
setInterval(()=>{tm.textContent=fmt(au.currentTime)+' / '+fmt(au.duration||0)},250);
const idxov=document.getElementById('idxov'),idxlist=document.getElementById('idxlist');
function buildIdx(){
  idxlist.innerHTML=phrases.map((p,i)=>`<button class="it" data-s="${p.s}"><span class="t">${fmt(p.s)}</span><span class="x">${p.ws.slice(0,4).map(o=>o.w).join(' ')}${p.ws.length>4?'…':''}</span></button>`).join('');
}
idxlist.addEventListener('click',e=>{
  const it=e.target.closest('.it');if(!it)return;
  au.currentTime=+it.dataset.s;
  idxov.classList.remove('open');
  if(au.paused){au.play();play.textContent='❚❚'}
});
document.getElementById('idx').onclick=()=>{
  idxov.classList.add('open');
  idxlist.querySelectorAll('.it').forEach((el,i)=>el.classList.toggle('now',i===curPi));
  const n=idxlist.querySelector('.now');if(n)n.scrollIntoView({block:'center'});
};
document.getElementById('idxcl').onclick=()=>idxov.classList.remove('open');
idxov.onclick=e=>{if(e.target===idxov)idxov.classList.remove('open')};
// منتقي الدروس — من فهرس الدروس المنشورة
document.getElementById('les').onclick=async()=>{
  idxov.classList.add('open');
  idxlist.innerHTML='<div style="padding:20px;text-align:center;color:#8b93b0">يُحمَّل فهرس الدروس…</div>';
  try{
    const ix=await (await fetch('../manzuma/lessons/index.json')).json();
    idxlist.innerHTML='<div style="padding:10px 18px;color:#e8c97a;font-size:.8rem">الدروس المتزامنة المتاحة</div>'+
      ix.map(l=>`<a class="it" href="index.html?l=${l.id||l.n||l}" style="text-decoration:none"><span class="x">${l.title||('درس '+(l.id||l))}</span></a>`).join('')+
      '<a class="it" href="index.html" style="text-decoration:none"><span class="x">الدرس التجريبي (الأجهوري 1)</span></a>';
  }catch(e){idxlist.innerHTML='<div style="padding:20px;text-align:center;color:#8b93b0">فهرس الدروس سيظهر عند اكتمال التجهيز</div>'}
};
</script>
<script src="/des/shared/feedback.js" data-pid="live" data-title="الدروس الحية" defer></script>
</body>
</html>
