<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشرَف — مطل الأسبوع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:660px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}
.dy{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 8px;min-height:150px;cursor:pointer;transition:border-color .15s;display:flex;flex-direction:column;gap:5px}
.dy:hover{border-color:var(--acc)}
.dy.today{border-color:var(--acc);background:var(--card2)}
.dy .dh{font-size:10px;color:var(--dim);text-align:center}
.dy .dh b{display:block;font-size:14px;color:var(--txt)}
.dy.today .dh b{color:var(--acc)}
.dy .chip{font-size:9.5px;border-radius:7px;padding:2px 6px;background:var(--card2);color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dy .chip.g{border-left:3px solid var(--acc)}
.dy .chip.r{border-left:3px solid var(--acc2)}
.dy .chip.s{border-left:3px solid var(--ok)}
.dy .more{font-size:9px;color:var(--dim);text-align:center}
.det{margin-top:12px}
.det .row{display:flex;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 12px;margin-top:5px;font-size:12px;align-items:center}
.det .k{font-size:9.5px;border-radius:99px;padding:1px 9px;flex-shrink:0}
.det .k.g{background:var(--acc)22;color:var(--acc)}
.det .k.r{background:var(--acc2)22;color:var(--acc2)}
.det .k.s{background:rgba(70,201,109,.15);color:var(--ok)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشرَف <span class="muted">— مطل الأسبوع</span></h2>
<div class="muted">سبعة أيام أمامك: الجدول، الأهداف، المراجعات المستحقة — في لمحة واحدة.</div>
<div id="stats"></div>
<div class="week" id="week"></div>
<div class="det" id="det"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const today=()=>new Date().toISOString().slice(0,10);
const ISO=d=>d.toISOString().slice(0,10);
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const sched=LS('mdr_sched',{});
const goals=LS('miqsad',{});
const reviews=LS('mi3wad_q',{});
const INTERVALS=[1,3,7,14,30];
// ميعوّد: عناصر مراجعة بتاريخ استحقاق
function dueOn(dateISO){
 let n=0;
 Object.values(reviews).forEach(r=>{
  if(!r.at)return;
  const d=new Date(r.at);d.setDate(d.getDate()+INTERVALS[Math.min(r.idx||0,INTERVALS.length-1)]);
  if(ISO(d)===dateISO)n++;
 });
 return n;
}
// بناء الأسبوع
const days=[];
for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d)}
let sel=today();
function itemsFor(dISO){
 const items=[];
 const dayIdx=new Date(dISO+'T12:00').getDay();
 (sched[dayIdx]||sched[String(dayIdx)]||[]).forEach(s=>items.push({k:'s',t:s.n||s.t||s}));
 (goals.goals||[]).forEach(g=>{if((g.due||today())===dISO||g.d===dISO)items.push({k:'g',t:g.t||g.n})});
 const dr=dueOn(dISO);if(dr)items.push({k:'r',t:arN(dr)+' مراجعة مستحقة'});
 return items;
}
function render(){
 $('#stats').innerHTML='<span class="stat">هذا الأسبوع: <b>'+arN(days.reduce((s,d)=>s+itemsFor(ISO(d)).length,0))+'</b> عنصراً</span>';
 $('#week').innerHTML=days.map(d=>{
  const iso=ISO(d),its=itemsFor(iso),isToday=iso===today();
  return '<div class="dy'+(isToday?' today':'')+'" data-d="'+iso+'"><div class="dh">'+DAYS[d.getDay()]+'<b>'+d.getDate()+'</b></div>'+
  its.slice(0,4).map(i=>'<div class="chip '+i.k+'">'+esc(String(i.t).slice(0,18))+'</div>').join('')+
  (its.length>4?'<div class="more">+'+arN(its.length-4)+'</div>':'')+'</div>';
 }).join('');
 const its=itemsFor(sel);
 $('#det').innerHTML='<div class="card"><div class="t">'+sel+' — '+arN(its.length)+' عنصراً</div>'+
 (its.map(i=>'<div class="row"><span class="k '+i.k+'">'+({g:'هدف',r:'مراجعة',s:'جدول'}[i.k])+'</span><span>'+esc(String(i.t))+'</span></div>').join('')||'<div class="muted">يوم فارغ.</div>')+'</div>';
}
$('#week').onclick=e=>{const d=e.target.closest('.dy');if(d){sel=d.dataset.d;render()}};
render();
</script>
<script src="../shared/feedback.js" data-pid="mishraf" data-title="مِشرَف"></script>
</body>
</html>
