<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصقَل — أين يحتاجك اليوم</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:16px;padding:18px 20px;margin-top:12px;text-align:center}
.hero .w{font-family:var(--font-ar);font-size:22px;color:var(--acc);font-weight:700}
.hero .why{color:var(--dim);font-size:12.5px;margin-top:8px;line-height:1.9}
.list{margin-top:12px}
.it{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 16px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:9px}
.it .t{flex:1;font-size:13px}
.it .r{font-size:10.5px;color:var(--dim);margin-top:3px}
.sc{font-weight:700;font-size:14px;min-width:36px;text-align:center}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:11.5px;text-decoration:none}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصقَل <span class="muted">— أين يحتاجك حديدُك اليوم</span></h2>
<div class="muted">يقرأ معدّاتك في المنظومة ويقول لك: هذا أصدأ موضع — اصقله.</div>
<div class="hero" id="hero"><div class="muted">يُحلّل…</div></div>
<div class="list" id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const dayAgo=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)};
const weekAgo=()=>{const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10)};
// كل أداة: استخدامها وآخر حركة ونقاطها
const TOOLS=[
 {n:'مِستملي',k:'mustamli',u:'../mustamli/',w:'إملاء'},
 {n:'مِشبه',k:'mushbih',u:'../mushbih/',w:'تشابهات'},
 {n:'مِسطرة',k:'mistr',u:'../mistr/',w:'ترتيب'},
 {n:'مِنهال',k:'minhal',u:'../minhal/',w:'منهل'},
 {n:'مِعبّر',k:'mi3bar',u:'../mi3bar/',w:'مصطلحات'},
 {n:'مِتحّق',k:'mutahhaq',u:'../mutahhaq/',w:'فهم'},
 {n:'مِجس',k:'mijass',u:'../mijass/',w:'أحكام'},
 {n:'مِسراج',k:'misraj',u:'../misraj/',w:'حفظ'},
 {n:'مِحفل',k:'mihfil',u:'../mihfil/',w:'فقه'},
 {n:'مِشغل',k:'mishghal',u:'../mishghal/',w:'استماع'},
 {n:'مِطلع',k:'mitla3',u:'../mitla3/',w:'حديث يومي'},
];
function use(k){
 const d=LS(k);
 if(!d)return{uses:0,last:0};
 // تخمين عدد الاستخدامات وقدمها
 const uses=d.n||d.ok||Object.keys(d).length||1;
 return{uses,last:uses};
}
const scored=TOOLS.map(t=>{
 const u=use(t.k);
 // الصدأ = قلة الاستخدام الكلي
 const rust=Math.max(0,100-u.uses*8);
 return{...t,uses:u.uses,rust};
}).sort((a,b)=>b.rust-a.rust);
const top=scored[0];
$('#hero').innerHTML='<div class="w">'+top.n+'</div>'+
 '<div class="why">أكثر موضع صدئ: استعملته <b style="color:var(--acc)">'+top.uses+'</b> مرة فقط — مجاله: '+top.w+'</div>'+
 '<a class="btn" href="'+top.u+'" style="margin-top:11px">اصقله الآن ←</a>';
$('#list').innerHTML=scored.slice(1,8).map((t,i)=>
 '<div class="it"><div class="t"><b>'+t.n+'</b><div class="r">'+t.w+' — '+t.uses+' استعمالاً</div></div>'+
 '<div class="sc" style="color:'+(t.rust>60?'#e08080':t.rust>30?'var(--acc2)':'var(--ok)')+'">'+Math.round(t.rust)+'٪</div>'+
 '<a class="btn" href="'+t.u+'">اذهب ←</a></div>').join('');
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="misqal" data-title="مِصقَل"></script>
</body>
</html>
