<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِثنَى — لعبة الأزواج</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:680px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.it{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;cursor:pointer;font-family:var(--font-ar);font-size:12px;line-height:1.9;min-height:52px;transition:all .12s}
.it:hover{border-color:var(--acc2)}
.it.on{border-color:var(--acc);background:rgba(212,175,55,.1)}
.it.done{opacity:.35;pointer-events:none;border-color:var(--acc);background:rgba(212,175,55,.06)}
.it.wrong{border-color:#e08080;animation:shake .3s}
@keyframes shake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
.score{font-family:var(--font-ar);font-size:14px;color:var(--acc);text-align:center;margin-top:10px}
.mode{display:flex;gap:7px;justify-content:center;margin-top:10px}
.mode .btn.ghost.on{background:var(--acc);color:#14140f;border-color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِثنَى <span class="muted">— طابق الأزواج</span></h2>
<div class="muted">نصٌّ في يمين، وصفُه في يسار — طابقهم جميعاً.</div>
<div class="mode">
<button class="btn ghost on" data-m="hadith">حديث ↔ حكم</button>
<button class="btn ghost" data-m="quran">آية ↔ سورة</button>
<button class="btn ghost" data-m="fiqh">كتاب ↔ مذهب</button>
</div>
<div class="score" id="sc"></div>
<div class="cols" id="cols"></div>
<div style="text-align:center;margin-top:12px"><button class="btn" id="new">جولة جديدة</button></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G,U,M,mode='hadith',pairs=[],sel=null,done=0,tries=0;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA'),laz('../fiqh_reader/masail.js','MASAIL')]).then(([g,u,m])=>{G=g;U=u;M=m;newRound()});
document.querySelectorAll('.mode .btn').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.mode .btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 mode=b.dataset.m;newRound();
});
function mkPairs(){
 const out=[];
 if(mode==='hadith'&&G){
  const seen=new Set();const ks=Object.keys(G.g);
  while(out.length<5){const k=ks[Math.floor(Math.random()*ks.length)];
   if(seen.has(k))continue;seen.add(k);
   out.push({a:G.g[k].t.slice(0,60)+'…',b:G.g[k].h,id:k});}
 }else if(mode==='quran'&&U){
  const seen=new Set();const ks=Object.keys(U.sim);
  while(out.length<5){const k=ks[Math.floor(Math.random()*ks.length)];
   const s=k.split(':')[0];if(seen.has(s))continue;seen.add(s);
   out.push({a:'«'+U.sim[k][2].slice(0,55)+'…»',b:U.names[s],id:k});}
 }else if(mode==='fiqh'&&M){
  const MN={h:'الحنفية',m:'المالكية',s:'الشافعية',b:'الحنابلة',o:'أخرى'};
  const bs=Object.values(M).filter(b=>b.m!=='o');
  const seen=new Set();
  while(out.length<5){const b=bs[Math.floor(Math.random()*bs.length)];
   if(seen.has(b.m))continue;seen.add(b.m);
   out.push({a:b.n+' — '+b.a,b:MN[b.m],id:b.n});}
 }
 return out;
}
function newRound(){
 pairs=mkPairs();if(!pairs.length)return;
 sel=null;done=0;tries=0;
 const A=pairs.map((p,i)=>({t:p.a,id:i,s:'a'}));
 const B=pairs.map((p,i)=>({t:p.b,id:i,s:'b'}));
 A.sort(()=>Math.random()-0.5);B.sort(()=>Math.random()-0.5);
 $('#cols').innerHTML='<div>'+A.map(x=>'<div class="it" data-s="a" data-id="'+x.id+'">'+esc(x.t)+'</div>').join('')+'</div>'+
 '<div>'+B.map(x=>'<div class="it" data-s="b" data-id="'+x.id+'">'+esc(x.t)+'</div>').join('')+'</div>';
 $('#sc').textContent='٠/'+pairs.length;
}
$('#cols').onclick=e=>{
 const it=e.target.closest('.it');if(!it||it.classList.contains('done'))return;
 const s=it.dataset.s,id=+it.dataset.id;
 if(!sel){
  document.querySelectorAll('.it').forEach(x=>x.classList.remove('on'));
  it.classList.add('on');sel={s,id,it};return;
 }
 if(sel.s===s){it.classList.add('on');sel.it.classList.remove('on');sel={s,id,it};return}
 tries++;
 if(sel.id===id){
  sel.it.classList.add('done');it.classList.add('done');sel.it.classList.remove('on');
  sel=null;done++;
  $('#sc').textContent=arN(done)+'/'+arN(pairs.length)+(done===pairs.length?' — ✓ تمّ بـ'+arN(tries)+' محاولة':'');
  if(done===pairs.length){
   const h=LS('mithna',{n:0,best:999});
   h.n++;if(tries<h.best)h.best=tries;SV('mithna',h);
   $('#sc').innerHTML='✓ تمّ بـ'+arN(tries)+' محاولة — أفضل رقمك '+arN(h.best);
  }
 }else{
  it.classList.add('wrong');setTimeout(()=>it.classList.remove('wrong'),350);
  sel.it.classList.remove('on');sel=null;
 }
};
$('#new').onclick=newRound;
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mithna" data-title="مِثنَى"></script>
</body>
</html>
