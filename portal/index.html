<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Port</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Port">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14; --card:#131a22; --card2:#1a2330; --border:#28323f; --txt:#eef3f8; --dim:#93a1b3; --acc:#c9a24b; --acc2:#e8c97a; --gold:#e8c97a}
html,body{max-width:100vw; overflow-x:hidden}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:
    radial-gradient(900px 400px at 85% -5%, rgba(201,162,75,.10), transparent 60%),
    radial-gradient(700px 400px at 10% 100%, rgba(232,201,122,.06), transparent 60%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.015) 1px, transparent 1px),
    var(--bg);
  background-size:auto,auto,28px 28px,auto;
  color:var(--txt); min-height:100vh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px; margin:0 auto; padding:24px 16px}
.kick{display:inline-block; font-size:.62rem; font-weight:700; letter-spacing:.14em; color:var(--acc2); border:1px solid rgba(94,200,255,.35); padding:4px 12px; border-radius:99px; margin-bottom:10px}
.brand{display:flex; align-items:center; gap:12px}
.brand .logo{width:46px; height:46px; border-radius:12px; filter:drop-shadow(0 4px 12px rgba(201,162,75,.35))}
h1{font-size:1.6rem; font-weight:700; letter-spacing:.02em; background:linear-gradient(135deg,var(--acc2),var(--acc)); -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{color:var(--dim); font-size:.82rem; margin-top:6px; margin-bottom:20px; line-height:1.6}
.search{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:10px 14px; margin-bottom:12px}
.search input{flex:1; background:none; border:none; color:var(--txt); font-family:inherit; font-size:.9rem}
.search input:focus{outline:none}
.search svg{color:var(--dim); flex:0 0 auto}
.fgroup{margin-bottom:10px}
.fgroup .fl{font-size:.64rem; color:var(--dim); letter-spacing:.06em; margin:0 4px 6px; display:block}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{background:var(--card); border:1px solid var(--border); border-radius:99px; color:var(--dim); font-family:inherit; font-size:.7rem; padding:9px 16px; min-height:34px; cursor:pointer}
.chip.on{background:linear-gradient(135deg,rgba(201,162,75,.22),rgba(232,201,122,.12)); border-color:var(--acc); color:var(--txt)}
.count{font-size:.68rem; color:var(--dim); margin:14px 4px 10px}
.proj{background:rgba(19,26,34,.72); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:12px; animation:enter .4s cubic-bezier(.22,1,.36,1) both; box-shadow:0 2px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06)}
@keyframes enter{from{opacity:0; transform:translateY(14px)}}
.pt{display:flex; align-items:center; gap:10px; min-width:0}
.pic{width:44px; height:44px; border-radius:12px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-weight:700; font-size:1.05rem}
.pt .tt{flex:1; min-width:0}
.pt .t{font-weight:700; font-size:.93rem}
.pt .m{font-size:.66rem; color:var(--dim); margin-top:2px}
.badge{font-size:.6rem; font-weight:700; padding:3px 10px; border-radius:99px; border:1px solid var(--border); color:var(--acc2); flex:0 0 auto}
.pd{font-size:.78rem; color:var(--dim); margin-top:9px; line-height:1.65; overflow-wrap:break-word}
.prow{display:flex; align-items:center; gap:8px; margin-top:11px; flex-wrap:wrap}
.pu{color:var(--acc2); font-size:.75rem; text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:9px 13px; min-height:34px; display:inline-flex; align-items:center}
.pu:hover{background:var(--card2)}
.pu.dis{color:var(--dim); border-style:dashed; pointer-events:none}
.spc{flex:1}
.ptool{background:none; border:1px solid var(--border); border-radius:8px; color:var(--dim); font-family:inherit; font-size:.68rem; padding:9px 12px; min-height:34px; cursor:pointer}
.ptool:hover,.ptool.open{color:var(--gold); border-color:rgba(232,201,122,.5)}
.csec{border-top:1px dashed var(--border); margin-top:10px; padding-top:10px; display:none}
.csec.open{display:block}
.cm{font-size:.76rem; color:var(--txt); background:var(--bg); border-radius:8px; padding:8px 10px; margin-bottom:6px; line-height:1.6}
.cm .n{color:var(--acc2); font-size:.66rem; display:block; margin-bottom:2px}
.sg{font-size:.76rem; color:var(--dim); background:var(--bg); border:1px dashed rgba(232,201,122,.4); border-radius:8px; padding:8px 10px; margin-bottom:6px; line-height:1.6}
.sg .st{color:var(--gold); font-size:.62rem; display:block; margin-bottom:2px}
.sg.ok{border-style:solid; border-color:rgba(70,201,109,.4)}
.sg.ok .st{color:#46c96d}
.cin{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.cin .r{display:flex; gap:6px}
.cin .note{font-size:.62rem; color:var(--dim)}
.cin input{flex:1; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--txt); font-family:inherit; font-size:.78rem; padding:8px 10px}
.cin input:focus{outline:none; border-color:var(--acc)}
.cin button{background:linear-gradient(135deg,var(--acc),var(--acc2)); border:none; border-radius:8px; color:#0b0f14; font-family:inherit; font-size:.72rem; font-weight:700; padding:8px 14px; cursor:pointer}
.empty{text-align:center; color:var(--dim); font-size:.84rem; padding:30px; border:1px dashed var(--border); border-radius:18px}
.privbtn{width:100%; background:rgba(232,201,122,.06); border:1px dashed rgba(232,201,122,.45); border-radius:14px; color:var(--gold); font-family:inherit; font-size:.78rem; font-weight:600; padding:11px; margin-bottom:12px; cursor:pointer}
.privbtn:hover{background:rgba(232,201,122,.12)}
.badge.pv{color:var(--gold); border-color:rgba(232,201,122,.5)}
.pm{position:fixed; inset:0; background:rgba(5,8,16,.6); backdrop-filter:blur(3px); z-index:60; display:none; align-items:flex-end}
.pm.open{display:flex}
.pm .card{background:#131a2a; border:1px solid var(--border); border-radius:20px 20px 0 0; width:100%; padding:18px; animation:pmup .25s ease}
@keyframes pmup{from{transform:translateY(40px); opacity:0}}
.pm h3{font-size:.95rem; color:var(--gold); margin-bottom:4px}
.pm .ms{color:var(--dim); font-size:.72rem; margin-bottom:14px}
.pm select,.pm input{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--txt); font-family:inherit; font-size:.85rem; padding:10px 12px; margin-bottom:10px}
.pm .err{color:#ff7d7d; font-size:.72rem; min-height:1.1em; margin-bottom:8px}
.pm .row{display:flex; gap:8px}
.pm .row button{flex:1; font-family:inherit; font-size:.8rem; font-weight:700; border-radius:10px; padding:11px; cursor:pointer; border:1px solid var(--border); background:var(--card2); color:var(--txt)}
.pm .row .go{background:linear-gradient(135deg,var(--gold),#8a6a2f); color:#0b0f14; border:none}
@media(min-width:768px){.wrap{max-width:1040px}#projs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.proj{margin-bottom:0}}
.foot{margin-top:26px; text-align:center; color:var(--dim); font-size:.66rem; line-height:1.9}
.foot .pulse{display:inline-block; width:7px; height:7px; border-radius:50%; background:#46c96d; margin-inline-end:5px; box-shadow:0 0 8px rgba(70,201,109,.8); animation:pul 2s infinite}
@keyframes pul{50%{opacity:.4}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">المنظومة · الفريق</div>
  <div class="brand"><img class="logo" src="logo-96.png" alt="Port"><h1>Port</h1></div>
  <div class="sub">كل المواقع والمشاريع في مكان واحد — فلتر بالصانع أو المجال، علّق، واقترح تعديلات</div>
  <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input id="q" placeholder="ابحث عن مشروع…"></div>
  <div class="fgroup"><span class="fl">الصانع</span><div class="chips" id="mchips"></div></div>
  <div class="fgroup"><span class="fl">المجال</span><div class="chips" id="fchips"></div></div>
  <div class="count" id="cnt"></div>
  <div id="projs"></div>
  <button class="privbtn" id="more" style="display:none;border-style:solid">عرض المزيد</button>
  <button class="privbtn" id="showPriv">🔒 إظهار الخاص</button>
  <div class="foot"><span class="pulse"></span>Port · بوابة الفريق الموحّدة</div>
</div>
<div class="pm" id="pm">
  <div class="card">
    <h3>المشاريع الخاصة</h3>
    <div class="ms">اختر صاحب المشاريع ثم أدخل رقمه السري — لا يُفكّ التشفير إلا بالرقم الصحيح</div>
    <select id="pmM"></select>
    <input id="pmP" inputmode="numeric" placeholder="الرقم السري" type="password">
    <div class="err" id="pmE"></div>
    <div class="row"><button class="go" id="pmGo">فكّ القفل</button><button id="pmX">إلغاء</button></div>
  </div>
</div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const PJ={all:[],fm:'الكل',ff:'الكل',q:'',shown:30};
const cmts=JSON.parse(localStorage.getItem('portal_comments')||'{}');
const sgts=JSON.parse(localStorage.getItem('portal_suggestions')||'{}');
const saveC=()=>localStorage.setItem('portal_comments',JSON.stringify(cmts));
const saveS=()=>localStorage.setItem('portal_suggestions',JSON.stringify(sgts));
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chipRow(id,vals,cur,key){
  document.getElementById(id).innerHTML=
    `<button class="chip${cur==='الكل'?' on':''}" data-${key}="الكل">الكل</button>`+
    vals.map(v=>`<button class="chip${cur===v?' on':''}" data-${key}="${escH(v)}">${escH(v)}</button>`).join('');
}
function projCard(p,i){
  const cs=cmts[p.id]||[],ss=sgts[p.id]||[];
  const pend=ss.filter(x=>x.st==='pending').length;
  return `<div class="proj" style="animation-delay:${i*.05}s">
    <div class="pt">
      <div class="pic">${escH(p.icon||p.title[0])}</div>
      <div class="tt"><div class="t">${escH(p.title)}</div><div class="m">${escH(p.maker)} · ${escH(p.field)}</div></div>
      ${p.priv?'<span class="badge pv">🔒 خاص</span>':''}${p.url?'':'<span class="badge">قيد التخطيط</span>'}
    </div>
    <div class="pd">${escH(p.desc)}</div>
    <div class="prow">
      ${p.url?`<a class="pu" href="${escH(p.url)}">فتح المشروع ←</a>`:'<span class="pu dis">لا رابط بعد</span>'}
      <span class="spc"></span>
      <button class="ptool" data-act="c" data-p="${p.id}">تعليقات ${cs.length?`(${cs.length})`:''}</button>
      <button class="ptool" data-act="s" data-p="${p.id}">اقتراح ${pend?`(${pend} معلّق)`:''}</button>
    </div>
    <div class="csec" id="c-${p.id}">
      ${cs.map(c=>`<div class="cm"><span class="n">${escH(c.n)}</span>${escH(c.t)}</div>`).join('')||'<div class="cm" style="color:var(--dim)">لا تعليقات بعد — كن أول من يعلّق</div>'}
      <div class="cin"><div class="r"><input placeholder="اسمك" data-nnc="${p.id}" style="max-width:34%"><input placeholder="تعليقك" data-in="${p.id}"><button data-add="c" data-p="${p.id}">أضف</button></div><span class="note">التعليقات تُحفظ في متصفحك حالياً — المزامنة بين الأجهزة قادمة</span></div>
    </div>
    <div class="csec" id="s-${p.id}">
      ${ss.map(s=>`<div class="sg${s.st==='ok'?' ok':''}"><span class="st">${s.st==='pending'?'⏳ مسودة محفوظة بجهازك — تصل الصانع عند المزامنة':'✓ مقبول'} — ${escH(s.n)}</span>${escH(s.t)}</div>`).join('')||'<div class="sg">لا اقتراحات بعد</div>'}
      <div class="cin"><div class="r"><input placeholder="اسمك" data-nns="${p.id}" style="max-width:34%"><input placeholder="اقتراحك للصانع" data-ins="${p.id}"><button data-add="s" data-p="${p.id}">أرسل</button></div><span class="note">الاقتراحات تُحفظ في متصفحك حالياً</span></div>
    </div>
  </div>`;
}
function renderPJ(){
  const ms=[...new Set(PJ.all.map(p=>p.maker))],fs=[...new Set(PJ.all.map(p=>p.field))];
  chipRow('mchips',ms,PJ.fm,'m');chipRow('fchips',fs,PJ.ff,'f');
  const list=PJ.all.filter(p=>
    (PJ.fm==='الكل'||p.maker===PJ.fm)&&
    (PJ.ff==='الكل'||p.field===PJ.ff)&&
    (!PJ.q||p.title.includes(PJ.q)||p.desc.includes(PJ.q)||p.maker.includes(PJ.q)));
  document.getElementById('cnt').textContent=list.length===PJ.all.length?`${list.length} مشروعاً`:`${list.length} من ${PJ.all.length} مشروعاً`;
  const vis=list.slice(0,PJ.shown);
  document.getElementById('projs').innerHTML=vis.map(projCard).join('')||'<div class="empty">لا مشاريع تطابق الفلتر</div>';
  document.getElementById('more').style.display=list.length>PJ.shown?'block':'none';
  document.getElementById('more').textContent=`عرض ${Math.min(30,list.length-PJ.shown)} إضافية (${list.length-PJ.shown} متبقية)`;
}
document.getElementById('q').addEventListener('input',e=>{PJ.q=e.target.value.trim();PJ.shown=30;renderPJ()});
document.getElementById('more').onclick=()=>{PJ.shown+=30;renderPJ()};
document.addEventListener('click',e=>{
  const ch=e.target.closest('.chip');
  if(ch){if(ch.dataset.m)PJ.fm=ch.dataset.m;if(ch.dataset.f)PJ.ff=ch.dataset.f;PJ.shown=30;renderPJ();return}
  const tb=e.target.closest('.ptool');
  if(tb){const sec=document.getElementById(tb.dataset.act+'-'+tb.dataset.p);sec.classList.toggle('open');tb.classList.toggle('open',sec.classList.contains('open'));return}
  const ad=e.target.closest('[data-add]');
  if(ad){addEntry(ad.dataset.p,ad.dataset.add);return}
});
function addEntry(pid,kind){
  const inp=document.querySelector(kind==='c'?`[data-in="${pid}"]`:`[data-ins="${pid}"]`);
  const nin=inp.closest('.cin').querySelector(kind==='c'?`[data-nnc="${pid}"]`:`[data-nns="${pid}"]`);
  const v=inp.value.trim();if(!v)return;
  const d={n:(nin&&nin.value.trim())||'عضو',t:v};
  if(kind==='c'){(cmts[pid]=cmts[pid]||[]).push(d);saveC()}
  else{(sgts[pid]=sgts[pid]||[]).push({...d,st:'pending'});saveS()}
  inp.value='';renderPJ();
  document.getElementById(kind+'-'+pid).classList.add('open');
  const tb=document.querySelector(`.ptool[data-act="${kind}"][data-p="${pid}"]`);if(tb)tb.classList.add('open');
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const inp=e.target;if(!inp.dataset.in&&!inp.dataset.ins)return;
    const pid=inp.dataset.in||inp.dataset.ins,kind=inp.dataset.in?'c':'s';
    if(!inp.value.trim())return;
    addEntry(pid,kind);
  }
});
const MKF={'محمد':'mohamed','أمجد':'amjad'};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlockPriv(){
  const mk=document.getElementById('pmM').value,pin=document.getElementById('pmP').value.trim();
  const er=document.getElementById('pmE');
  if(!pin){er.textContent='أدخل الرقم السري';return}
  er.textContent='…';
  let d;
  try{
    const r=await fetch('../private/'+MKF[mk]+'.enc.json');
    if(!r.ok)throw new Error('http');
    d=await r.json();
  }catch(e){er.textContent='تعذر تحميل الملف — تحقق من الاتصال';return}
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.salt),iterations:d.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},key,b64(d.ct));
    const list=JSON.parse(new TextDecoder().decode(pt));
    let n=0;list.forEach(p=>{if(!PJ.all.some(x=>x.id===p.id)){p.priv=true;PJ.all.push(p);n++}});
    document.getElementById('pm').classList.remove('open');
    renderPJ();
    document.getElementById('showPriv').textContent=`🔓 خاص ${mk} ظاهر (${n}) — اضغط لفتح عضو آخر`;
  }catch(e){er.textContent='الرقم غير صحيح'}
}
const pm=document.getElementById('pm');
document.getElementById('showPriv').onclick=()=>{
  document.getElementById('pmM').innerHTML=Object.keys(MKF).map(m=>`<option>${m}</option>`).join('');
  document.getElementById('pmP').value='';document.getElementById('pmE').textContent='';
  pm.classList.add('open');
};
document.getElementById('pmX').onclick=()=>pm.classList.remove('open');
pm.onclick=e=>{if(e.target===pm)pm.classList.remove('open')};
document.getElementById('pmGo').onclick=unlockPriv;
document.getElementById('pmP').addEventListener('keydown',e=>{if(e.key==='Enter')unlockPriv()});
fetch('projects.json').then(r=>r.json()).then(P=>{PJ.all=P;renderPJ()});
</script>
</body>
</html>
