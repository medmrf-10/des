<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِذرَب — الضربة الأولى</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.strike{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:14px;padding:20px;text-align:center;margin-top:12px}
.strike .lbl{font-size:10px;color:var(--dim)}
.strike .t{font-family:var(--font-ar);font-size:17px;margin:10px 0;line-height:1.9}
.hist{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-top:7px;display:flex;gap:10px;align-items:center;font-size:12px}
.hist .d{color:var(--acc);font-size:10.5px;min-width:70px}
.hist .t{flex:1;font-family:var(--font-ar)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِذرَب <span class="muted">— الضربة الأولى</span></h2>
<div class="muted">قبل النوم حدّد أول ضربة للغد — تنهض والهدف ينتظرك لا العكس.</div>
<div id="today"></div>
<div class="card"><div class="t">ضربة الغد</div>
<input id="t" placeholder="أول ما تفعله غداً (أهم شيء وليس أسهله)">
<button class="btn" id="sv" style="margin-top:9px">سدّدها للغد</button></div>
<div id="stats"></div>
<div id="hist"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let S=LS('mithrab',[]);
const today=()=>new Date().toISOString().slice(0,10);
$('#sv').onclick=()=>{
 const t=$('#t').value.trim();if(!t)return;
 const tm=new Date(Date.now()+864e5).toISOString().slice(0,10);
 const ex=S.findIndex(x=>x.d===tm);
 const rec={d:tm,t,done:false,at:Date.now()};
 if(ex>=0)S[ex]=rec;else S.unshift(rec);
 SV('mithrab',S);$('#t').value='';render();
};
function render(){
 const t=S.find(x=>x.d===today());
 $('#today').innerHTML=t?'<div class="strike"><div class="lbl">ضربة اليوم</div>'+
 '<div class="t">⚔️ '+esc(t.t)+'</div>'+
 '<button class="btn" id="dn" style="'+(t.done?'background:var(--ok)':'')+'">'+(t.done?'✓ سُدّدت':'سدّدتها')+'</button></div>':
 '<div class="muted" style="margin-top:11px">لا ضربة لليوم — سدّد ضربة الغد قبل نومك.</div>';
 if(t&&!t.done)$('#dn').onclick=()=>{t.done=true;SV('mithrab',S);render()};
 const wk=S.filter(x=>x.d>=new Date(Date.now()-7*864e5).toISOString().slice(0,10));
 const done=S.filter(x=>x.done).length;
 $('#stats').innerHTML='<span class="stat">ضربات مسددة: <b style="color:var(--ok)">'+arN(done)+'</b></span>'+
 '<span class="stat">هذا الأسبوع: <b>'+arN(wk.filter(x=>x.done).length)+'/'+arN(wk.length)+'</b></span>';
 $('#hist').innerHTML=S.filter(x=>x.d<today()).slice(0,7).map(x=>'<div class="hist">'+
 '<span class="d">'+x.d.slice(5)+'</span><span class="t"'+(x.done?'':' style="opacity:.45"')+'>'+(x.done?'✓ ':'✗ ')+esc(x.t)+'</span></div>').join('');
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mithrab" data-title="مِذرَب"></script>
</body>
</html>
