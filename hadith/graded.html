<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الحديث المصنّف — تصفية بالحكم | مختبر الحديث</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:980px;margin:0 auto;padding:0 14px 40px}
.top{display:flex;align-items:baseline;gap:14px;padding:16px 0 8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;color:var(--acc2);font-weight:700}
.top .sub{color:var(--dim);font-size:13px}
.top a{color:var(--acc);font-size:13px;text-decoration:none;border:1px solid var(--border);padding:3px 10px;border-radius:8px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.filters input[type=text]{flex:1;min-width:160px;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit}
.filters label{font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.filters select,.filters input[type=number]{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:5px 9px;font-size:12.5px;font-family:inherit}
.filters input[type=number]{width:70px}
.chip{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed=true]{background:var(--acc);color:#14140f;font-weight:700;border-color:transparent}
.status{color:var(--dim);font-size:12px;padding:4px 2px}
.prog{height:4px;background:var(--card2);border-radius:2px;margin:6px 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc2);transition:width .2s}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin:8px 0}
.summary b{color:var(--txt)}
.hrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:12.5px}
.hrow .tx{flex:1;font-family:var(--font-ar);font-size:14px;line-height:1.9}
.hrow .meta{display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:150px}
.bdg{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.v-sa{background:#14291c;color:var(--ok)}.v-hs{background:#332a17;color:var(--acc2)}
.v-df{background:#3a1d1d;color:#e08a8a}.v-sd{background:#4a1d1d;color:#ff7070}.v-mw{background:#7d2a2a;color:#ffb0b0}.v-ot,.v-ns{background:#22303f;color:#9db8d4}
.mini{font-size:10.5px;color:var(--dim)}
.mini a{color:var(--acc);text-decoration:none}
.more{width:100%;padding:9px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--acc2);cursor:pointer;font-family:inherit}
.mut{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header class="top">
  <h1>🧾 الحديث المصنّف</h1>
  <span class="sub">تصفية المعاني بالحكم والكتاب والتكرار — ديناميكي من شبكة المعنى</span>
  <a href="index.html">المختبر ←</a>
  <a href="ahkam.html">⚖ الأحكام ←</a>
</header>
<div class="filters">
  <input type="text" id="q" placeholder="ابحث في أطراف المعاني…">
  <label>الحكم الموحد<select id="fh"><option value="">الكل</option></select></label>
  <label>رأي عالم<select id="fj"><option value="">الكل</option><option value="__any">أي حكم مسجل</option></select></label>
  <label>الكتاب<select id="fb"><option value="">الكل</option></select></label>
  <label>أدنى تكرار<input type="number" id="fr" min="0" value="0"></label>
</div>
<div class="prog"><i id="pfill"></i></div>
<div class="status" id="stat"></div>
<div class="summary" id="sum"></div>
<div id="main"></div>
<script src="pako.min.js"></script>
<script src="graded.js"></script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="miq_graded"></script>
</body>
</html>
