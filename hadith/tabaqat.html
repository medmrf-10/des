<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>طبقات — أجيال الرواة</title>
<link rel="stylesheet" href="../shared/theme.css">
<script src="rawi.js"></script>
<style>
body{max-width:900px;margin:0 auto;padding:14px}
.gs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.g{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:99px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:var(--font-ar)}
.g.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.rw{display:flex;gap:10px;align-items:baseline;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:5px 0}
.rw .r{font-size:11px;color:var(--acc2);min-width:30px}
.rw .n{flex:1;font-family:var(--font-ar);font-size:14.5px;line-height:1.8}
.rw .c{font-size:12px;color:var(--acc2);white-space:nowrap}
.bks{display:flex;gap:4px;flex-wrap:wrap}
.bk{font-size:9.5px;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:1px 7px}
.inp{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:10px 14px;font-family:var(--font-ar);font-size:15px;width:100%}
.muted{color:var(--dim);font-size:12px}
.bar{height:4px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">طبقات <span class="muted" style="font-weight:400;font-size:12px">— 6,384 راوياً بأجيالهم</span></h2>
<div class="muted">الرواة مصنفون بالطبقة (صحابة فتابعون فأتباعهم…) مع روايات كل واحد في الكتب الستة — ابحث بالاسم أو تصفّح الطبقة مرتبةً بكثرة الرواية.</div>
<div class="gs" id="gs"></div>
<input class="inp" id="q" placeholder="اسم راوٍ… (مالك، حماد، الزهري، شعبة)" style="margin-top:8px">
<div class="bar"><i id="pg" style="width:0"></i></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const GEN={'1':'الصحابة','2':'التابعون','3':'أتباع التابعين','4':'الشيوخ','5':'العلماء الأئمة','6':'المصنفون'};
const R=RAWI.rawi;
const IDS=Object.keys(R);
let gen='2';
const counts={};for(const g of Object.keys(GEN))counts[g]=IDS.filter(i=>(R[i].gs||[]).includes(g)).length;
$('#gs').innerHTML=Object.keys(GEN).map(g=>`<button class="g ${g===gen?'on':''}" data-g="${g}">${GEN[g]} <span style="font-size:10px">${counts[g].toLocaleString('ar-EG')}</span></button>`).join('');
function bkBadges(b){return Object.entries(b||{}).sort((a,c)=>c[1]-a[1]).slice(0,4).map(([k,v])=>`<span class="bk">${k} ${v}</span>`).join('')}
function render(){
 const q=norm($('q').value.trim());
 let ids=IDS.filter(i=>(R[i].gs||[]).includes(gen));
 if(q.length>1)ids=IDS.filter(i=>norm(R[i].t+' '+(R[i].f||'')+' '+(R[i].l||'')).includes(q));
 ids.sort((a,b)=>(R[b].c||0)-(R[a].c||0));
 $('#pg').style.width=Math.min(100,ids.length/20)+'%';
 $('#list').innerHTML=ids.slice(0,120).map((i,x)=>{
  const r=R[i];
  return `<div class="rw"><span class="r">${(x+1).toLocaleString('ar-EG')}</span>
  <div class="n">${esc(r.t)}</div>
  <span class="c">${(r.c||0).toLocaleString('ar-EG')} رواية</span>
  <div class="bks">${bkBadges(r.b)}</div></div>`}).join('')||'<div class="muted">لا نتائج</div>'}
$('#gs').onclick=e=>{const b=e.target.closest('.g');if(!b)return;gen=b.dataset.g;
 document.querySelectorAll('.g').forEach(x=>x.classList.toggle('on',x===b));render()};
let deb=null;$('q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,220)});
render();
</script>
<script src="../shared/feedback.js" data-pid="tabaqat" data-title="طبقات"></script>
</body>
</html>
