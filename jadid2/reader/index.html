<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مُتعلِّم — قارئ الذرات i+1</title>
<link rel="stylesheet" href="../../shared/theme.css">
<style>
body{max-width:900px;margin:0 auto;padding:14px}
.muted{color:var(--dim);font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:10px 0}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:10px;padding:10px 24px;font-weight:700;cursor:pointer;font-family:var(--font-ui);font-size:14px;min-height:40px}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
select,input[type=text],input[type=search]{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:9px 12px;font-family:var(--font-ui);font-size:14px;min-height:40px}
select:focus,input:focus{outline:none;border-color:var(--acc)}
.seg{font-family:var(--font-ar);font-size:17px;line-height:2.1;white-space:pre-wrap}
.ttl{font-family:var(--font-ar);font-size:21px;line-height:1.9;color:var(--acc2);margin:0 0 6px}
.crumb{color:var(--dim);font-size:12px;margin-bottom:8px}
.crumb b{color:var(--acc2)}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:3px 12px;font-size:12px;color:var(--dim);margin:3px 4px 0 0}
.chip b{color:var(--acc)}
.chip.ok b{color:var(--ok)}
.chip.bad b{color:#e06c75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:12px 0}
.scard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.scard:hover{border-color:var(--acc)}
.scard h3{font-family:var(--font-ar);font-size:16px;margin:0 0 4px;color:var(--txt);font-weight:400}
.scard .sh{color:var(--dim);font-size:12px}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.grades button{border:1px solid var(--border);border-radius:10px;padding:10px 4px;font-family:var(--font-ui);font-size:13px;font-weight:700;cursor:pointer;min-height:44px;background:var(--card2);color:var(--txt)}
.grades button small{display:block;font-weight:400;color:var(--dim);font-size:11px}
.grades .g-again{border-color:#6e3b3b}.grades .g-again:hover{background:#3a1f28}
.grades .g-hard{border-color:#6e5a2e}.grades .g-hard:hover{background:#3a2f1a}
.grades .g-good{border-color:#2e6e45}.grades .g-good:hover{background:#14342a}
.grades .g-easy{border-color:#2e5e6e}.grades .g-easy:hover{background:#14303a}
.exopt{display:block;width:100%;text-align:right;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:10px 14px;margin:6px 0;font-family:var(--font-ar);font-size:15px;line-height:1.9;cursor:pointer}
.exopt:hover{border-color:var(--acc)}
.exopt.right{border-color:var(--ok);background:rgba(70,201,109,.12)}
.exopt.wrong{border-color:#e06c75;background:rgba(224,108,117,.12)}
.list{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.li{padding:8px 14px;border-bottom:1px solid var(--border);font-size:13px}
.li:last-child{border-bottom:0}
.li .w{color:var(--dim);font-size:11px}
.li.now{border-right:3px solid var(--acc)}
.badge{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--dim);line-height:1.9}
.badge b{color:var(--acc)}
#loadbar{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin:14px 0}
#loadbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.blankbox{border:1px dashed var(--border);border-radius:10px;padding:8px 14px;margin:8px 0;color:var(--dim);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="topbar">
  <h2 style="font-family:var(--font-ar);margin:6px 0">مُتعلِّم <span class="muted">— قارئ الذرات بمنطق i+1</span></h2>
  <div class="row" style="margin:0">
    <button class="btn ghost" id="btnExport" hidden>تصدير</button>
    <button class="btn ghost" id="btnImport" hidden>استيراد</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</div>
<div class="muted">نفس منطق <code>jadid2/selector/selector.py</code> — مرشّح = ذرة متطلباتها متقنة، ترتيب due_score للمستحق، وإتقان بنفس شروط SPEC §2. حالتك في localStorage وتُصدَّر/تُستورد ملفاً.</div>

<div id="boot">
  <div id="loadbar"><i></i></div>
  <div class="muted" id="loadmsg">جارٍ تحميل الفهارس…</div>
</div>

<div id="splash" hidden>
  <div class="row"><input type="search" id="q" placeholder="رشّح السلاسل…" style="flex:1"></div>
  <div id="globalRow"></div>
  <div class="grid" id="sgrid"></div>
</div>

<div id="study" hidden>
  <div class="row">
    <button class="btn ghost" id="btnBack">→ السلاسل</button>
    <span class="chip" id="stProg"></span>
    <span class="chip" id="stDue"></span>
  </div>
  <div class="badge" id="whyBox"></div>
  <div class="card">
    <div class="crumb" id="crumb"></div>
    <div class="ttl" id="aTitle"></div>
    <div id="aTags"></div>
    <div class="seg" id="aText">…</div>
    <div class="muted" id="aSrc" style="margin-top:6px"></div>
  </div>
  <div class="card" id="exCard" hidden></div>
  <div class="grades">
    <button class="g-again" data-g="again">رسبت<small>نسيت — أعد قريباً</small></button>
    <button class="g-hard" data-g="hard">صعب<small>تذكّرت بصعوبة</small></button>
    <button class="g-good" data-g="good">جيد<small>تذكّرت</small></button>
    <button class="g-easy" data-g="easy">سهل<small>بديهي</small></button>
  </div>
  <div class="row">
    <button class="btn" id="btnEx">مرّنني</button>
    <button class="btn ghost" id="btnNext">التالي ⟵</button>
  </div>
  <h4 style="font-family:var(--font-ar);color:var(--dim)">قائمة المحرك (الأقرب أولاً)</h4>
  <div class="list" id="queue"></div>
</div>
<script src="app.js"></script>
</body>
</html>
