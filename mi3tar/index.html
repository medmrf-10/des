<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعتَر — محاسبة النفس</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:620px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:8px 12px;font-family:var(--font-ar);font-size:12px;width:100%}
textarea{width:100%;min-height:70px;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;line-height:1.95;resize:vertical;margin-top:9px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.ev{background:var(--card);border:1px solid var(--acc);border-radius:11px;padding:11px 15px;margin-top:9px}
.ev .src{font-size:10.5px;color:var(--acc2);margin-bottom:4px}
.ev .txt{font-family:var(--font-ar);font-size:13.5px;line-height:2}
.hist{max-height:130px;overflow-y:auto;font-size:11px;color:var(--dim)}
.hist div{padding:4px 0;border-bottom:1px dashed var(--border)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعتَر <span class="muted">— محاسبة النفس</span></h2>
<div class="muted">اعترف بنقصك اليوم — يأتيك بالأدلة التي تعينك على التوبة.</div>
<div class="card"><div class="t">ما الذي أخطأت فيه؟</div>
<select id="cat"></select>
<textarea id="txt" placeholder="صف ما حدث (اختياري)"></textarea>
<div style="margin-top:8px"><button class="btn" id="go">أدلّني على التوبة</button></div></div>
<div id="res"></div>
<div class="card"><div class="t">اعترافاتك السابقة</div><div class="hist" id="hist">—</div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const CATS={
 'قصّرت في صلواتي':['الصلاة','صلاتهم','يصلي'],
 'غيبة ونميمة':['غيبة','أكل لحم','النميمة','اللسان'],
 'غضبت':['غضب','كظم','العفو'],
 'أجلت ما يجب':['التسويف','أجل','الوقت'],
 'نظرت للحرام':['غض البصر','النظر','الفرج'],
 'أهملت العلم':['العلم','طلب العلم','تعلم'],
 'أكلت ما لا يحل':['الحرام','حلال','طعام'],
 'نسيت الذكر':['ذكر','اذكر الله','الأذكار'],
 'عصيت والدي':['الوالدين','بر','الأم'],
 'كبرت على أحد':['كبر','تواضع','الفخر'],
 'بخلت':['بخل','شح','الصدقة'],
 'كذبت':['كذب','الصدق','صادق'],
 'أخرجت الناس':['أذى','إيذاء','أذية'],
 'أسأت في عمل':['إتقان','عمل','أمانة'],
};
$('#cat').innerHTML=Object.keys(CATS).map(c=>'<option>'+c+'</option>').join('');
let G,U;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA')]).then(([g,u])=>{G=g;U=u});
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
$('#go').onclick=()=>{
 const c=$('#cat').value,t=$('#txt').value.trim();
 const kws=CATS[c].map(norm);
 let hs=[];
 if(G)Object.values(G.g).forEach(h=>{
  const sc=kws.filter(k=>norm(h.t).includes(k)).length;
  if(sc>0)hs.push({t:h.t,h:h.h,s:h.s,sc});
 });
 hs.sort((a,b)=>b.sc-a.sc||b.s-a.s);hs=hs.slice(0,4);
 let vs=[];
 if(U)Object.keys(U.sim).forEach(k=>{
  const sc=kws.filter(kw=>norm(U.sim[k][2]).includes(kw)).length;
  if(sc>0)vs.push({t:U.sim[k][2],n:U.names[k.split(':')[0]],sc});
 });
 vs.sort((a,b)=>b.sc-a.sc);vs=vs.slice(0,4);
 // سجل الاعتراف
 const R=LS('mi3tar',[]);
 R.unshift({c,t,at:new Date().toISOString()});
 if(R.length>40)R.pop();
 SV('mi3tar',R);
 $('#res').innerHTML='<div class="card"><div class="t">أدلة لـ«'+esc(c)+'»</div>'+
 (hs.length?'<div style="margin-top:8px">'+hs.map(h=>'<div class="ev"><div class="src">حديث — '+esc(h.h)+'</div><div class="txt">'+esc(h.t.slice(0,200))+'…</div></div>').join('')+'</div>':'<div class="muted" style="margin-top:8px">لا أحاديث مباشرة — وسّع الاعتراف.</div>')+
 (vs.length?'<div style="margin-top:9px">'+vs.map(v=>'<div class="ev"><div class="src">'+esc(v.n)+'</div><div class="txt">'+esc(v.t)+'</div></div>').join('')+'</div>':'')+
 '<div class="muted" style="margin-top:10px">كتبها في قلبك — الآن توجه لـ«مِصلَح» أو «مِختِم» لتختم يومك.</div></div>';
 renderHist();
};
function renderHist(){
 const R=LS('mi3tar',[]);
 $('#hist').innerHTML=R.slice(0,10).map(r=>'<div>'+r.at.slice(5,10)+' — '+esc(r.c)+(r.t?' — '+esc(r.t.slice(0,40)):'')+'</div>').join('')||'—';
}
renderHist();
</script>
<script src="../shared/feedback.js" data-pid="mi3tar" data-title="مِعتَر"></script>
</body>
</html>
