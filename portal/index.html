<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14; --card:#131a22; --card2:#1a2330; --border:#28323f; --txt:#eef3f8; --dim:#93a1b3; --acc:#8b7cf6; --acc2:#5ec8ff}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:
    radial-gradient(900px 400px at 85% -5%, rgba(139,124,246,.12), transparent 60%),
    radial-gradient(700px 400px at 10% 100%, rgba(94,200,255,.07), transparent 60%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.015) 1px, transparent 1px),
    var(--bg);
  background-size:auto,auto,28px 28px,auto;
  color:var(--txt); min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:460px; width:100%; padding:24px 18px; margin:auto}
.kick{display:inline-block; font-size:.75rem; font-weight:700; color:var(--acc2); border:1px solid rgba(94,200,255,.35); padding:5px 14px; border-radius:99px; margin-bottom:10px}
h1{font-size:1.6rem; font-weight:700; color:#ededed}
.sub{color:var(--dim); font-size:.82rem; margin-top:6px; margin-bottom:18px; line-height:1.6}
.psearch{position:relative; margin-bottom:16px}
.psearch input{width:100%; padding:12px 16px; padding-inline-start:42px; border-radius:14px; border:1px solid var(--border); background:rgba(19,26,34,.8); color:var(--txt); font-family:inherit; font-size:1rem; backdrop-filter:blur(8px)}
.psearch input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(139,124,246,.15)}
.psearch::after{content:'⌕'; position:absolute; inset-inline-start:15px; top:50%; transform:translateY(-50%); color:var(--dim); font-size:1.1rem}
.empty{display:none; text-align:center; color:var(--dim); padding:30px 0; font-size:.85rem}
.app{display:flex; align-items:center; gap:16px; background:rgba(19,26,34,.72); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:14px; text-decoration:none; color:var(--txt); transition:transform .2s,border-color .2s,box-shadow .2s; animation:enter .4s cubic-bezier(.22,1,.36,1) both; box-shadow:0 2px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06); position:relative; overflow:hidden}
.app::before{content:''; position:absolute; inset:0; background:radial-gradient(400px 120px at 80% 0%, rgba(139,124,246,.10), transparent); opacity:0; transition:opacity .25s}
@media(hover:hover){
.app:hover::before{opacity:1}
.app:hover{border-color:rgba(139,124,246,.5); transform:translateY(-1px); box-shadow:0 6px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08)}
.app:hover .go{transform:translateX(-4px)}
}
.app:active{transform:scale(.985)}
.app:nth-child(2){animation-delay:.06s}
.app:nth-child(3){animation-delay:.12s}
@keyframes enter{from{opacity:0; transform:translateY(14px)}}
.av{width:52px; height:52px; border-radius:15px; flex:0 0 auto; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1)}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.av.ltr{display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-weight:700; font-size:1.15rem}
.app .nm{font-weight:700; font-size:.95rem}
.app .ds{font-size:.78rem; color:var(--dim); margin-top:5px; line-height:1.65}
.app .go{color:var(--acc2); font-size:1rem; margin-inline-start:auto; transition:transform .2s}
.foot{margin-top:30px; text-align:center; color:var(--dim); font-size:.75rem; line-height:1.9}
.foot .pulse{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok,#46c96d); margin-inline-end:5px; box-shadow:0 0 8px rgba(70,201,109,.8); animation:pul 2s infinite}
@keyframes pul{50%{opacity:.4}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">المنظومة</div>
  <h1>البوابة</h1>
  <div class="sub">كل المواقع في مكان واحد — مدخل موحد لكل تطبيقاتك</div>
  <div class="psearch"><input id="pq" type="search" placeholder="ابحث عن تطبيق…"></div>
  <div id="apps"></div>
  <div class="empty" id="empty">لا تطبيق بهذا الاسم</div>
  <div class="foot"><span class="pulse"></span>كل الأنظمة تعمل · تحديث مستمر</div>
</div>
<script>
/* سجل التطبيقات — أضف تطبيقاً جديداً بسطر واحد هنا */
const APPS=[
  {id:'decisions', name:'بطاقات القرارات', ds:'أسئلة القرارات بين الوكلاء — تصويت وحسم', href:'../', icon:'icon-decisions-192.png'},
  {id:'turath', name:'Turath', ds:'مكتبة التراث — السلاسل والمقاطع والتقييم', href:'../durus/', icon:'../durus/icon-192.png', stat:s=>`مكتبة التراث — ${s.series.toLocaleString('ar')} سلسلة، ${s.clips.toLocaleString('ar')} مقطعاً`, statSrc:'../durus/stats.json'}
];
const appsEl=document.getElementById('apps');
const CHEV='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>';
function appHTML(a,i){return `<a class="app" href="${a.href}" style="animation-delay:${i*.05}s">
    <div class="av"><img src="${a.icon}" alt=""></div>
    <div><div class="nm">${a.name}</div><div class="ds" id="ds-${a.id}">${a.ds}</div></div>
    <div class="go">${CHEV}</div>
  </a>`}
appsEl.innerHTML=APPS.map(appHTML).join('');
document.getElementById('pq').oninput=e=>{
  const q=e.target.value.trim();
  const cards=appsEl.querySelectorAll('.app');let vis=0;
  APPS.forEach((a,i)=>{const show=!q||a.name.includes(q)||a.ds.includes(q);cards[i].style.display=show?'':'none';if(show)vis++});
  document.getElementById('empty').style.display=vis?'none':'block';
};
APPS.forEach(a=>{if(a.stat&&a.statSrc)fetch(a.statSrc).then(r=>r.json()).then(s=>{const el=document.getElementById('ds-'+a.id);if(el)el.textContent=a.stat(s)}).catch(()=>{})});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
