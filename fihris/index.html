<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الفهرس العام — كل شيء في مكان واحد</title>
<link rel="icon" type="image/png" href="../portal/logo-96.png">
<link rel="stylesheet" href="../shared/theme.css">
<style>
:root{--tx:var(--txt);--tx3:var(--dim);--cd:var(--card);--cd2:var(--card2);--bd:var(--border)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100vw;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--font);min-height:100vh}
header{position:sticky;top:0;z-index:40;background:rgba(11,15,26,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:10px}
h1{font-size:18px;font-weight:800;background:linear-gradient(90deg,#e8c876,#c9a24b);-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:860px;margin:0 auto;padding:16px}
input[type=text],input[type=search],textarea,select{width:100%;background:#10172b;border:1px solid var(--bd);border-radius:11px;padding:11px 13px;color:var(--tx);font-family:inherit;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:15px;padding:15px;margin-bottom:11px}
.grp{font-size:13px;font-weight:800;color:var(--acc);margin:20px 0 9px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--bd)}
.ent{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:13px;padding:13px 15px;margin-bottom:9px}
.ent .ic{font-size:19px;width:40px;height:40px;border-radius:11px;background:rgba(201,162,75,.1);display:grid;place-items:center;flex-shrink:0}
.ent b{font-size:14px}.ent .d{font-size:11.5px;color:var(--tx3);margin-top:3px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#d4af5e,#b8934a);color:#14131f;font-weight:700;border:none;border-radius:11px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--cd2);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}
.btn.danger{background:rgba(229,72,77,.15);color:#e5484d;border:1px solid rgba(229,72,77,.3)}
.chip{display:inline-flex;background:#1a2340;color:#b8c2de;font-size:10.5px;font-weight:600;border-radius:16px;padding:3px 10px;border:1px solid #2a3350}
.edited{border-color:rgba(61,214,140,.4)!important}
.edited::after{content:"معدّل";position:relative;font-size:9.5px;color:#3dd68c;margin-inline-start:8px}
#editBar{position:sticky;bottom:0;background:rgba(13,17,30,.97);backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding:10px 16px;display:flex;gap:8px;z-index:30}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:60;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal .box{background:#0e1424;border:1px solid var(--bd);border-radius:18px;padding:20px;width:100%;max-width:420px}
.modal label{font-size:12px;color:var(--tx3);display:block;margin:10px 0 4px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1a2340;border:1px solid var(--acc);color:var(--tx);padding:9px 18px;border-radius:22px;font-size:12.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <span style="font-size:22px">🗂</span>
  <div><h1>الفهرس العام</h1><div style="font-size:11px;color:var(--tx3)">كل مشاريع المنظومة — قابل للتعديل منك</div></div>
  <button class="btn ghost sm" style="margin-inline-start:auto" onclick="location.href='../manzuma/'">← المنظومة</button>
</header>
<main>
  <input type="search" id="q" placeholder="ابحث في الفهرس..." style="margin-bottom:14px" oninput="render()">
  <div id="list"></div>
</main>
<div class="grp" style="margin-top:24px;padding:0 16px;max-width:860px;margin-inline:auto">الفهرس العميق <span class="chip" id="catCnt"></span> <span class="muted" style="font-size:11px">— كل سلسلة وكتاب ومتن في المنظومة</span></div>
<div id="catList" style="margin-bottom:30px;max-width:860px;margin-inline:auto;padding:0 16px"></div>
<div id="editBar">
  <button class="btn sm" onclick="addEntry()">＋ أضف مدخلاً</button>
  <button class="btn ghost sm" onclick="exportJson()">⤓ صدّر الفهرس (JSON)</button>
  <button class="btn ghost sm" onclick="resetEdits()">↺ استعد الأصل</button>
  <span class="muted" id="editInfo" style="margin-inline-start:auto;font-size:11px;align-self:center"></span>
</div>
<div class="modal" id="m"><div class="box">
  <b style="font-size:15px" id="mTitle">مدخل جديد</b>
  <label>الاسم</label><input type="text" id="fN">
  <label>الوصف</label><input type="text" id="fD">
  <label>الرابط (اختياري)</label><input type="text" id="fU" dir="ltr" placeholder="https://...">
  <label>المجموعة</label><select id="fG"></select>
  <label>أيقونة (إيموجي)</label><input type="text" id="fI" maxlength="4">
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1" onclick="saveEntry()">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script src="catalog.js"></script>
<script>
const BASE=[
 {g:'المواقع',e:[
  {i:'🏠',n:'المنظومة',d:'لوحة تعلمك — المعلّم، المنهج، الاستوديو، دفترك',u:'../manzuma/'},
  {i:'📖',n:'وحي',d:'القرآن + 105 تفسير + 425 كتاب حديث',u:'../wahy/'},
  {i:'◈',n:'الإنجليزية',d:'منصة تعلم بالمحتوى القصير',u:'../english/'},{i:'‹›',n:'برمج',d:'منصة تعلم البرمجة بالعربية',u:'../prog/'},{i:'⛓',n:'مختبر الحديث',d:'أسانيد وأحكام ورواة ومقارنات — 27 ألف حديث',u:'../hadith/'},{i:'📚',n:'قارئ الفقه',d:'61 متناً فقهياً كاملاً من rlg',u:'../fiqh_reader/'},{i:'⚖️',n:'فقه',d:'الفهرس الفقهي القياسي — متون المذاهب الأربعة',u:'../fiqh/'},
  {i:'🏛',n:'مكتبة التراث',d:'952 سلسلة · 60 ألف مقطع · 10 مشايخ',u:'../durus/'},
  {i:'📜',n:'فهرس العقيدة',d:'نصوص العقيدة والتصوف بفهرسة موضوعية',u:'../akida/real.html'},
  {i:'🎬',n:'الدروس الحية',d:'كاراوكي صوتي كلمة-بكلمة',u:'../live/'},
  {i:'🧭',n:'Port',d:'البوابة الموحّدة للمشاريع',u:'../portal/'}
 ]},
 {g:'مصادر البيانات',e:[
  {i:'📚',n:'مكتبة التفاسير (QUL)',d:'106 موارد تفسير منظّمة — 456 ألف مجموعة',u:''},
  {i:'🕌',n:'مكتبة الحديث',d:'صحيح البخاري + مسلم + الترمذي + أبي داود... بأسانيد وأحكام',u:''},
  {i:'⚖',n:'فهرس الفقه (rlg)',d:'فهرسة موضوعية لنصوص الفقه',u:''},
  {i:'📿',n:'نصوص العقيدة (akidsofi)',d:'فهرس موحّد + نصوص كاملة',u:''},
  {i:'🎧',n:'تفريغات agy',d:'دروس البردوني المفرّغة — تتزايد يومياً',u:''},
  {i:'📗',n:'القرآن والسنة (qrn)',d:'ماركداون منظّم — 6236 آية',u:''}
 ]},
 {g:'مشاريع قادمة',e:[
  {i:'🎙',n:'استوديو الدروس',d:'إنتاج دروسك الخاصة — كاراوكي من صوتك ونصك',u:'../manzuma/#studio'},
  {i:'🤖',n:'المعلّم الذي يعرفك',d:'اقتراحات مخصّصة على مسارك — يتطور',u:'../manzuma/#tutor'}
 ]}
];
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
let CAT=LS('fihris_cat')||BASE;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase();
let editIx=null;
function render(){
 const q=norm(document.getElementById('q').value.trim());
 let html='';let cnt=0;
 for(const g of CAT){
   const es=g.e.map((e,i)=>({e,i})).filter(({e})=>!q||norm(e.n+e.d).includes(q));
   if(!es.length)continue;
   html+=`<div class="grp">${esc(g.g)} <span class="chip">${es.length}</span></div>`;
   for(const{e,i}of es){cnt++;const ed=e.ed?'edited':'';
     html+=`<div class="ent ${ed}"><div class="ic">${e.i||'•'}</div><div style="flex:1"><b>${esc(e.n)}</b><div class="d">${esc(e.d)}</div></div>${e.u?`<a class="btn sm ghost" href="${e.u}">فتح</a>`:''}<button class="btn sm ghost" onclick="editEntry('${esc(g.g)}',${i})">✎</button><button class="btn sm danger" onclick="delEntry('${esc(g.g)}',${i})">✕</button></div>`}
 }
 document.getElementById('list').innerHTML=html||'<div style="text-align:center;color:var(--tx3);padding:30px">لا نتائج</div>';
 const nc=CAT.reduce((a,g)=>a+g.e.filter(x=>x.ed).length,0);
 document.getElementById('editInfo').textContent=nc?nc+' تعديل محلي':'';
}
function editEntry(g,i){const grp=CAT.find(x=>x.g===g);const e=grp.e[i];editIx={g,i};
 document.getElementById('mTitle').textContent='تعديل مدخل';
 document.getElementById('fG').innerHTML=CAT.map(x=>`<option ${x.g===g?'selected':''}>${esc(x.g)}</option>`).join('')+'<option value="__new">＋ مجموعة جديدة</option>';
 document.getElementById('fN').value=e.n;document.getElementById('fD').value=e.d;document.getElementById('fU').value=e.u||'';document.getElementById('fI').value=e.i||'';
 document.getElementById('m').classList.add('on')}
function addEntry(){editIx=null;document.getElementById('mTitle').textContent='مدخل جديد';
 document.getElementById('fG').innerHTML=CAT.map(x=>`<option>${esc(x.g)}</option>`).join('')+'<option value="__new">＋ مجموعة جديدة</option>';
 ['fN','fD','fU','fI'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('m').classList.add('on')}
function saveEntry(){
 const n=document.getElementById('fN').value.trim();if(!n)return toast('الاسم مطلوب');
 let g=document.getElementById('fG').value;
 if(g==='__new'){g=prompt('اسم المجموعة الجديدة:')||'متفرقات';if(!CAT.find(x=>x.g===g))CAT.push({g,e:[]})}
 const e={n,d:document.getElementById('fD').value.trim(),u:document.getElementById('fU').value.trim(),i:document.getElementById('fI').value.trim()||'•'};
 e.ed=1;
 if(editIx){const grp=CAT.find(x=>x.g===editIx.g);grp.e[editIx.i]=e}
 else CAT.find(x=>x.g===g).e.push(e);
 LS('fihris_cat',CAT);closeM();render();toast('حُفظ')}
function delEntry(g,i){if(!confirm('حذف هذا المدخل؟'))return;const grp=CAT.find(x=>x.g===g);grp.e.splice(i,1);LS('fihris_cat',CAT);render()}
function closeM(){document.getElementById('m').classList.remove('on')}
function exportJson(){const blob=new Blob([JSON.stringify(CAT,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fihris.json';a.click();toast('صدّرت الفهرس — أرسل الملف لأثبّته للجميع')}
function resetEdits(){if(!confirm('إرجاع الفهرس الأصلي؟ تعديلاتك المحلية تُمحى.'))return;CAT=JSON.parse(JSON.stringify(BASE));LS('fihris_cat',CAT);render()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)}
render();
/* deep catalog */
let CATD=[],catShown=80;
function renderCat(){
 const q=norm(document.getElementById('q').value.trim());
 const hits=q?CATD.filter(c=>norm(c.n+' '+c.d).includes(q)):CATD;
 const groups={};
 for(const c of hits){(groups[c.g]=groups[c.g]||[]).push(c)}
 document.getElementById('catCnt').textContent=hits.length;
 let html='';
 for(const g in groups){
   html+=`<div class="grp">${esc(g)} <span class="chip">${groups[g].length}</span></div>`;
   for(const c of groups[g].slice(0,q?60:catShown)){
     html+=`<div class="ent"><div class="ic">${c.u?'🔗':'•'}</div><div style="flex:1"><b style="font-size:13px">${esc(c.n)}</b><div class="d" style="font-size:11px">${esc(c.d)}</div></div>${c.u?`<a class="btn sm ghost" href="${c.u}">فتح</a>`:''}</div>`}
   if(!q&&groups[g].length>catShown)html+=`<button class="btn ghost sm" onclick="catShown+=200;renderCat()" style="margin:6px 0 14px">+ ${groups[g].length-catShown} أخرى…</button>`;
 }
 document.getElementById('catList').innerHTML=html||'<div style="text-align:center;color:var(--tx3);padding:20px">لا نتائج في الفهرس العميق</div>';
}
const _origRender=render;
render=function(){_origRender();if(CATD.length)renderCat()};
if(typeof CATALOG!=='undefined'){CATD=CATALOG;renderCat()}
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="fihris" data-title="الفهرس العام"></script>
</body>
</html>
