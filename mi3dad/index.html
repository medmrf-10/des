<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعضَد — عضدك بالدليل</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:700px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:10px 14px;font-family:var(--font-ar);font-size:14px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.ev{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 15px;margin-top:8px}
.ev .src{font-size:10.5px;color:var(--acc2);margin-bottom:4px}
.ev .txt{font-family:var(--font-ar);font-size:13.5px;line-height:2}
.ev .kw{font-size:10.5px;color:var(--acc);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعضَد <span class="muted">— عضدك بالدليل</span></h2>
<div class="muted">موضوع خطبتك أو بحثك ← عضّده بالأدلة: أحاديث وآيات تخدمه، مرتبة بالأولى.</div>
<div class="card"><div class="t">موضوعك</div>
<input id="q" placeholder="مثال: الصبر · التوكل · الذكر · الصدقة…">
<div style="margin-top:8px"><button class="btn" id="go">عضّد</button></div></div>
<div id="res"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
let G,U;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
Promise.all([laz('../hadith/analysis.js','GIDNET'),laz('../wahy/mutashabih.js','MUTA')]).then(([g,u])=>{G=g;U=u});
$('#go').onclick=()=>{
 const q=$('#q').value.trim();if(!q||!G)return;
 const nq=norm(q),res={h:[],v:[]};
 // أحاديث
 Object.entries(G.g).forEach(([k,h])=>{
  const nt=norm(h.t);
  if(nt.includes(nq))res.h.push({t:h.t,h:h.h,s:h.s,k});
 });
 res.h.sort((a,b)=>b.s-a.s);res.h=res.h.slice(0,12);
 // آيات
 if(U)Object.entries(U.sim).forEach(([k,s])=>{
  if(norm(s[2]).includes(nq))res.v.push({t:s[2],s:s[0],k,n:U.names[k.split(':')[0]]});
 });
 res.v=res.v.slice(0,12);
 const tot=res.h.length+res.v.length;
 $('#res').innerHTML=tot?
  '<div style="margin-top:12px"><span class="stat">أدلة لـ«'+esc(q)+'»: <b>'+arN(tot)+'</b></span></div>'+
  '<div class="card"><div class="t">من السنة ('+arN(res.h.length)+')</div>'+
   res.h.map(h=>'<div class="ev"><div class="src">حديث — '+esc(h.h)+'</div><div class="txt">'+esc(h.t)+'</div><div class="kw">'+arN(h.s)+' صحابيًا رواه</div></div>').join('')+'</div>'+
  '<div class="card"><div class="t">من القرآن ('+arN(res.v.length)+')</div>'+
   res.v.map(v=>'<div class="ev"><div class="src">'+esc(v.n)+'</div><div class="txt">'+esc(v.t)+'</div></div>').join('')+'</div>':
  '<div class="muted" style="margin-top:12px">لا أدلة مباشرة — جرّب كلمة أعم (الصبر بدل «الصبر على المصائب»).</div>';
};
$('#q').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3dad" data-title="مِعضَد"></script>
</body>
</html>
