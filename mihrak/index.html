<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحرك — محرك المنظومة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:860px;margin:0 auto;padding:14px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:14px;padding:14px 18px;font-family:var(--font-ar);font-size:17px;box-sizing:border-box}
.inp:focus{outline:none;border-color:var(--acc)}
.grp{margin-top:14px}
.grp h4{font-family:var(--font-ar);color:var(--acc);font-size:12.5px;margin:0 0 6px;display:flex;justify-content:space-between}
.hit{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 14px;margin:5px 0;font-size:13.5px;line-height:1.9}
.hit .s{font-size:10.5px;color:var(--dim);display:block;margin-top:3px}
.hit a{color:var(--acc3);text-decoration:none}
mark{background:rgba(232,185,63,.22);color:var(--acc);border-radius:3px;padding:0 2px}
.muted{color:var(--dim);font-size:12px}
.stat{display:inline-block;background:var(--card2);border-radius:8px;padding:3px 10px;font-size:11px;margin:3px 4px 0 0}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحرك <span class="muted">— محرك المنظومة الواحد</span></h2>
<div class="muted">يبحث في كل شيء دفعة واحدة: السلاسل، المسائل، المواضيع، الأحاديث، الأذكار — مرتّباً حسب الأنسب.</div>
<input class="inp" id="q" placeholder="ابحث في كل المنظومة… (مثلاً: صلاة الجمعة)" autofocus>
<div id="stats"></div>
<div id="out"></div>
<script>
const $=q=>document.querySelector('#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
async function laz(src,win){if(window[win])return window[win];
 const s=document.createElement('script');s.src=src;
 await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.head.appendChild(s)});return window[win]}
function score(text,qs){
 let sc=0;for(const w of qs){if(!w)continue;
  if(text===w)sc+=10;else if(text.startsWith(w))sc+=6;else if(text.includes(w))sc+=3}
 return sc}
function hi(text,qs){
 const pat=qs.filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
 return pat?esc(text).replace(new RegExp(pat,'g'),m=>`<mark>${m}</mark>`):esc(text)}
let DB=null;
async function build(){
 if(DB)return DB;DB={};
 const[S,M,T,D,A]=await Promise.all([
  laz('../durus/data.js','SERIES'),
  laz('../fiqh_reader/masail.js','MASAIL').catch(()=>null),
  laz('../fiqh_reader/terms.js','TERMS').catch(()=>null),
  laz('../hadith/analysis.js','GIDNET').catch(()=>null),
  laz('../hadith/adhkar.js','ADHKAR').catch(()=>null)]);
 DB.series=(S||[]).map(s=>({t:s.name,s:s.sheikh,c:s.comment||'',u:'../durus/index.html#s='+s.id}));
 DB.masail=[];if(M)for(const k of Object.keys(M))for(const u of M[k].u)
  DB.masail.push({t:u.t||u.i,b:M[k].n,u:'../fiqh_reader/index.html#'+k+'/'+u.i});
 DB.terms=[];if(T&&T.terms)for(const t of Object.keys(T.terms))
  DB.terms.push({t,n:T.terms[t].length,u:'../fiqh_reader/'});
 DB.hadith=[];if(D&&D.g)for(const g of Object.keys(D.g))
  DB.hadith.push({t:D.g[g].t,h:D.g[g].h,u:'../hadith/matn.html#'+g});
 DB.adhkar=(A||[]).map(a=>({t:a.t,h:a.h||'',u:'../hadith/adhkar.html'}));
 for(const k of Object.keys(DB))DB[k].forEach(x=>x.n=norm(x.t));
 return DB}
async function go(){
 const q=norm($('#q').value.trim());const qs=q.split(' ').filter(w=>w.length>=2);
 if(!qs.length){$('#out').innerHTML='';$('#stats').innerHTML='';return}
 const db=await build();
 const G=[
  {k:'series',n:'سلاسل الدروس',cap:6},
  {k:'masail',n:'المسائل الفقهية',cap:5},
  {k:'hadith',n:'الأحاديث',cap:6},
  {k:'terms',n:'المواضيع',cap:5},
  {k:'adhkar',n:'الأذكار',cap:3}];
 let h='',tot=0;
 for(const g of G){
  const hits=db[g.k].map(x=>({x,sc:score(x.n,qs)})).filter(r=>r.sc>=qs.length*3)
   .sort((a,b)=>b.sc-a.sc).slice(0,g.cap);
  tot+=hits.length;
  if(!hits.length)continue;
  h+=`<div class="grp"><h4><span>${g.n}</span><span class="muted">${hits.length}</span></h4>`;
  for(const{x}of hits)
   h+=`<div class="hit">${hi(x.t.slice(0,180),qs)}<span class="s">${x.h?esc(x.h)+' · ':''}${x.b?esc(x.b)+' · ':''}${x.s?esc(x.s)+' · ':''}${x.n?x.n+' موضعاً':''}<a href="${x.u}">افتح ←</a></span></div>`;
  h+='</div>'}
 $('#stats').innerHTML=`<span class="stat">${tot.toLocaleString('ar-EG')} نتيجة في ${Object.values(db).flat().length.toLocaleString('ar-EG')} مدخلاً</span>`;
 $('#out').innerHTML=h||'<div class="muted" style="padding:16px">لا نتائج — جرّب مفردة أعم</div>'}
$('#q').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(go,350)};
const hp=location.hash.slice(1);if(hp)$('#q').value=decodeURIComponent(hp);
</script>
<script src="../shared/feedback.js" data-pid="mihrak" data-title="مِحرك"></script>
</body>
</html>
