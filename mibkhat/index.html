<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِبخَت — عَجَل الحظ</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:440px;margin:0 auto;padding:14px;text-align:center}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:12px;padding:13px 32px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:15px}
.wheel{position:relative;width:280px;height:280px;margin:24px auto}
.pie{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--card),var(--card2));transition:transform 2.8s cubic-bezier(.2,.9,.3,1)}
.result{font-family:var(--font-ar);font-size:24px;color:var(--acc);margin-top:14px;min-height:36px}
.ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--acc);z-index:2}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.hist{font-size:11px;color:var(--dim);margin-top:12px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِبخَت <span class="muted">— عَجَل الحظ</span></h2>
<div class="muted">لا تدري ماذا تفعل؟ أدر العجلة — تختار لك.</div>
<div class="wheel"><div class="ptr"></div><div class="pie" id="pie"><div id="wtxt" style="font-family:var(--font-ar);font-size:15px;color:var(--acc);max-width:180px">أدِر</div></div></div>
<div class="result" id="res"></div>
<button class="btn" id="spin">أدِر العجلة</button>
<div style="margin-top:14px"><span class="stat">دورتَ: <b id="n">٠</b></span></div>
<div class="hist" id="hist"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const POCKETS=[
 ['مِطلع','../mitla3/'],['مِجلس','../majlis/'],['مِصباح','../misbah/'],['مِعتكف','../mi3tikaf/'],
 ['مِعوَد','../mi3wad/'],['مِسوَد','../miswad/'],['مِقتَحَم','../miqtaham/'],['مِحفل','../mihfil/'],
 ['مِرتّل','../murattil/'],['مِقرأة','../miqra/'],['مِختِم','../mikhtim/'],['مِجلد','../mujallad/'],
 ['مِرمى','../mirmah/'],['مِخزَن','../mikhzan/'],['مِصلَح','../mislah/'],['مِهمَل','../mihmal/'],
 ['الإنجليزية','../english/'],['البرمجة','../prog/'],['مِفتَح','../miftah/'],['مِنشَط','../minshat/'],
 ['مِقصَد','../miqsad/'],['مِجلَد','../mujallad/'],['مِستملي','../mustamli/'],['مِكشاف','../mikshaf/'],
];
let spinning=false,rot=0,H=LS('mibkhat',{n:0,hist:[]});
$('#spin').onclick=()=>{
 if(spinning)return;spinning=true;
 const i=Math.floor(Math.random()*POCKETS.length);
 const spins=3*360+(360/POCKETS.length)*(POCKETS.length-i);
 rot+=spins;
 $('#pie').style.transform='rotate('+rot+'deg)';
 $('#wtxt').textContent='…';
 setTimeout(()=>{
  spinning=false;
  const [n,u]=POCKETS[i];
  $('#wtxt').textContent=n;
  $('#res').innerHTML='اخترنا لك: <a href="'+u+'" style="color:var(--acc);font-weight:700;text-decoration:none">'+n+' ←</a>';
  H.n++;H.hist.unshift({n,at:new Date().toISOString()});
  if(H.hist.length>15)H.hist.pop();
  SV('mibkhat',H);render();
 },2900);
};
function render(){
 $('#n').textContent=arN(H.n);
 $('#hist').innerHTML=H.hist.slice(0,6).map(h=>'<div>'+h.at.slice(11,16)+' — '+h.n+'</div>').join('');
}
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mibkhat" data-title="مِبخَت"></script>
</body>
</html>
