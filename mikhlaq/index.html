<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِخلَق — خُلُق الشهر</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.trait{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px;cursor:pointer;font-family:var(--font-ar);font-size:13px;text-align:center}
.trait.on{border-color:var(--acc);background:var(--card2);color:var(--acc)}
.banner{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--acc);border-radius:13px;padding:18px;text-align:center;margin-top:11px}
.banner .t{font-family:var(--font-ar);font-size:16px;color:var(--acc)}
.banner .d{font-size:11.5px;color:var(--dim);margin-top:6px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.ln{font-family:var(--font-ar);font-size:12px;padding:6px 10px;background:var(--card);border-radius:8px;margin-top:5px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِخلَق <span class="muted">— خُلُق الشهر</span></h2>
<div class="muted">خلق واحد تركّز عليه هذا الشهر — «من جاهد نفسه لله تبارك وتعالى كان له أجر المجاهدين».</div>
<div class="card"><div class="t">اختر خلق الشهر</div><div id="trs"></div></div>
<div id="banner"></div>
<div id="stats"></div>
<div class="card"><div class="t">سطر: كيف مارسته اليوم؟</div>
<input id="j" placeholder="كيف تجلّى الخلق اليوم؟">
<button class="btn ghost" id="js" style="margin-top:8px">سطّر</button>
<div id="jrn"></div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const TRS=['الصبر','الصدق','التواضع','الحلم','الكرم','الشجاعة','الوفاء','العفو','الشكر','الإحسان','الرحمة','الأمانة'];
let cur=LS('mikhlaq_trait',''),J=LS('mikhlaq',[]);
const today=()=>new Date().toISOString().slice(0,10);
const paint=()=>document.querySelectorAll('.trait').forEach(t=>t.classList.toggle('on',t.dataset.t===cur));
$('#trs').innerHTML=TRS.map(t=>'<div class="trait" data-t="'+t+'">'+t+'</div>').join('');
paint();
$('#trs').onclick=e=>{
 const t=e.target.closest('.trait');if(!t)return;
 cur=t.dataset.t;SV('mikhlaq_trait',cur);paint();render();
};
$('#js').onclick=()=>{
 const s=$('#j').value.trim();if(!s)return;
 J.unshift({d:today(),t:cur,s,at:Date.now()});SV('mikhlaq',J);$('#j').value='';render();
};
function render(){
 $('#banner').innerHTML=cur?'<div class="banner"><div class="t">'+esc(cur)+'</div>'+
 '<div class="d">خلقك هذا الشهر — كيف تجلّى اليوم؟</div></div>':'';
 const month=new Date().toISOString().slice(0,7);
 const mj=J.filter(x=>x.d.slice(0,7)===month);
 const days=new Set(mj.map(x=>x.d)).size;
 $('#stats').innerHTML='<span class="stat">أيام مارسته: <b style="color:var(--ok)">'+arN(days)+'</b></span>'+
 '<span class="stat">سطور: <b>'+arN(mj.length)+'</b></span>';
 $('#jrn').innerHTML=J.slice(0,8).map(x=>'<div class="ln"><b style="font-size:10px;color:var(--dim)">'+x.d+'</b> '+esc(x.s)+'</div>').join('');
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mikhlaq" data-title="مِخلَق"></script>
</body>
</html>
