<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِسنَد — سلسلة الإسناد</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:680px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:12px}
.narr{background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:8px 13px;font-family:var(--font-ar);font-size:12.5px;text-align:center}
.narr .nm{color:var(--acc)}
.narr .det{font-size:10px;color:var(--dim);margin-top:3px}
.arrow{color:var(--acc2);font-size:14px}
.end{background:var(--acc);color:#14140f;border-radius:10px;padding:8px 13px;font-family:var(--font-ar);font-size:12.5px;font-weight:700}
select,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:8px 12px;font-family:var(--font-ar);font-size:12px;width:100%}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِسنَد <span class="muted">— سلسلة الإسناد</span></h2>
<div class="muted">حديث ← سلسلة رواته في كل كتاب — من النبي ﷺ إلى آخر راوٍ.</div>
<div class="card"><div class="t">اختر حديثًا</div>
<select id="sel"></select></div>
<div id="res"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
let G;
const laz=(src,gl)=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[gl]);s.onerror=()=>ok(null);document.head.appendChild(s)});
laz('../hadith/analysis.js','GIDNET').then(g=>{G=g;fill()});
function fill(){
 const gs=Object.keys(G.g).slice(0,80);
 $('#sel').innerHTML=gs.map(k=>'<option value="'+k+'">'+esc(G.g[k].t.slice(0,55))+'…</option>').join('');
 show();
}
$('#sel').onchange=show;
function show(){
 const k=$('#sel').value,h=G.g[k];if(!h)return;
 let html='<div class="card"><div class="t">'+esc(h.t.slice(0,80))+'…</div>';
 html+='<div style="margin-top:7px"><span class="stat">الحكم: <b>'+esc(h.h)+'</b></span><span class="stat">صحابة: <b>'+arN(h.s)+'</b></span><span class="stat">تكرار: <b>'+arN(h.r)+'</b></span></div>';
 // أسانيد كل كتاب
 Object.entries(h.n||{}).slice(0,4).forEach(([bk,rids])=>{
  const bn=(G.meta.books&&G.meta.books[bk])||bk;
  html+='<div style="margin-top:14px"><div class="muted">في «'+esc(bn)+'» — '+arN(rids.length)+' راوٍ:</div><div class="chain">';
  rids.slice(0,8).forEach((rid,i)=>{
   const r=G.rawi[rid]||{n:'راوٍ'};
   html+='<div class="narr"><div class="nm">'+esc(r.n)+'</div><div class="det">'+(r.s?arN(r.s)+' حديث':'')+'</div></div>';
   if(i<rids.length-1&&i<7)html+='<span class="arrow">←</span>';
  });
  if(rids.length>8)html+='<span class="muted">+ '+arN(rids.length-8)+' آخرون</span>';
  html+='</div></div>';
 });
 html+='</div>';
 $('#res').innerHTML=html;
}
</script>
<script src="../shared/feedback.js" data-pid="misnad" data-title="مِسنَد"></script>
</body>
</html>
