<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنك التمارين — تجربة</title>
<style>
body{margin:0;background:#10151c;color:#e8e2d0;font-family:'Segoe UI',Tahoma,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px}
a{color:#d4a94f}
h1{color:#d4a94f;font-size:22px;margin:0 0 6px}
.sub{color:#9aa4b0;font-size:13px;margin:0 0 16px}
.card{background:#1a212b;border:1px solid #2a3442;border-radius:12px;padding:16px;margin-bottom:14px}
.matn{font-size:17px;line-height:2;border-right:3px solid #d4a94f;padding-right:12px;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#10151c;border:1px solid #2a3442;border-radius:8px;padding:12px;color:#e8e2d0;font-size:16px;cursor:pointer;text-align:center}
.opt.right{background:#14532d;border-color:#22c55e}
.opt.wrong{background:#5b1a1a;border-color:#ef4444}
.meta{color:#9aa4b0;font-size:12px;margin-top:10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#d4a94f;font-size:14px}
button.next{background:#d4a94f;color:#10151c;border:0;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<a href="./">← رجوع للبوابة</a>
<h1>بنك التمارين</h1>
<p class="sub">تجربة: الإكمال المحجوب — كلمة حُذفت من متن حديث مقصوص حرفياً. اختر الكلمة الصحيحة. لا نص مولّد.</p>
<div class="bar"><span id="score"></span><span id="num"></span></div>
<div class="card">
<div class="matn" id="matn">…</div>
<div class="opts" id="opts"></div>
<div class="meta" id="meta"></div>
<button class="next" id="next" style="display:none">التمرين التالي ←</button>
</div>
</div>
<script>
let items=[],i=0,score=0;
const $=id=>document.getElementById(id);
fetch('ex-data/cloze.json').then(r=>r.json()).then(d=>{items=d.items;show()});
function show(){
 if(i>=items.length){$('matn').textContent='انتهت التمارين — نتيجتك: '+score+'/'+items.length;$('opts').innerHTML='';$('meta').textContent='';$('next').style.display='none';return}
 const t=items[i];
 $('num').textContent='تمرين '+(i+1)+' / '+items.length;
 $('score').textContent='الصحيحة: '+score;
 $('matn').textContent=t.masked;
 $('meta').textContent=t.book;
 $('next').style.display='none';
 $('opts').innerHTML='';
 t.opts.forEach((w,k)=>{
  const b=document.createElement('button');b.className='opt';b.textContent=w;
  b.onclick=()=>{
   document.querySelectorAll('.opt').forEach((x,j)=>{x.onclick=null;if(j===t.ans)x.classList.add('right')});
   if(k!==t.ans)b.classList.add('wrong');else score++;
   $('score').textContent='الصحيحة: '+score;
   $('next').style.display='block';
  };
  $('opts').appendChild(b);
 });
}
$('next').onclick=()=>{i++;show()};
</script>
</body>
</html>
