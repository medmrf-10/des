<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مِخرَج — تخريج الحديث | مختبر الحديث</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:980px;margin:0 auto;padding:0 14px 40px}
.top{display:flex;align-items:baseline;gap:14px;padding:16px 0 8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;color:var(--acc2);font-weight:700}
.top .sub{color:var(--dim);font-size:13px}
.top a{color:var(--acc);font-size:13px;text-decoration:none;border:1px solid var(--border);padding:3px 10px;border-radius:8px}
.pick{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
textarea{width:100%;min-height:90px;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font-ar);line-height:1.8;resize:vertical;box-sizing:border-box}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--acc);color:#14140f;border:none;border-radius:8px;padding:8px 18px;font-size:14px;font-family:inherit;cursor:pointer;font-weight:700}
.chip{border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--acc2);color:var(--acc2)}
.status{color:var(--dim);font-size:12px;padding:4px 2px}
.prog{height:4px;background:var(--card2);border-radius:2px;margin:6px 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc2);transition:width .2s}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin:8px 0}
.summary b{color:var(--txt)}
.hrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:12.5px}
.hrow .tx{flex:1;font-family:var(--font-ar);font-size:14px;line-height:1.9}
.hrow .tx mark{background:transparent;color:var(--acc2);font-weight:700;text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:4px}
.hrow .meta{display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:160px}
.bdg{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.v-sa{background:#14291c;color:var(--ok)}.v-hs{background:#332a17;color:var(--acc2)}
.v-df{background:#3a1d1d;color:#e08a8a}.v-sd{background:#4a1d1d;color:#ff7070}.v-mw{background:#7d2a2a;color:#ffb0b0}.v-ot,.v-ns{background:#22303f;color:#9db8d4}
.score{background:var(--card2);border:1px solid var(--acc2);color:var(--acc2);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700}
.mini{font-size:10.5px;color:var(--dim)}
.mini a{color:var(--acc);text-decoration:none}
.more{width:100%;padding:9px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--acc2);cursor:pointer;font-family:inherit}
.mut{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header class="top">
  <h1>🔍 مِخرَج</h1>
  <span class="sub">تخريج نصّي — أين يرد هذا المتن في الأمهات الست (مطابقة شِستُغرامية)</span>
  <a href="index.html">المختبر ←</a>
  <a href="matn.html">بحث المتون ←</a>
</header>
<div class="pick">
  <textarea id="q" placeholder="ألصق متن الحديث هنا — أو اختر عينة بالأسفل…"></textarea>
  <div class="row">
    <button class="btn" onclick="run()">خرّج</button>
    <span class="mut">عينات من شبكة المعنى:</span>
    <span id="samples"></span>
  </div>
  <div class="row"><span class="mut">تُحمَّل الكتب الستة تتابعياً عند أول تخريج (~٢٧ ألف متن) — لا يُخزَّن شيء</span></div>
</div>
<div class="prog"><i id="pfill"></i></div>
<div class="status" id="stat"></div>
<div class="summary" id="sum"></div>
<div id="main"></div>
<script src="pako.min.js"></script>
<script>
const arNum=n=>Number(n).toLocaleString('ar-EG');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();
const BAR={'bukhari':'صحيح البخاري','muslim':'صحيح مسلم','tirmidhi':'سنن الترمذي','abi-dawud':'سنن أبي داود','nasai':'سنن النسائي','ibn-majah':'سنن ابن ماجه'};
const BOOKS=['bukhari','muslim','abi-dawud','tirmidhi','nasai','ibn-majah'];
const bucket=v=>{if(!v)return 'ns';const s=String(v);
  if(/شديد الضعف/.test(s))return 'sd';if(/متهم بالوضع|موضوع/.test(s))return 'mw';
  if(/متصل|صحيح/.test(s))return 'sa';if(/حسن/.test(s))return 'hs';
  if(/ضعيف|تعليق|إرسال|انقطاع|فيه|منكر|مجهول/.test(s))return 'df';return 'ot'};
const D={};let GN=null;const NG=6;
const stat=document.getElementById('stat'),pf=document.getElementById('pfill');
async function loadBook(b){
  if(D[b])return D[b];
  const buf=await(await fetch(b+'-det.json.gz')).arrayBuffer();
  D[b]=JSON.parse(pako.ungzip(new Uint8Array(buf),{to:'string'}));
  return D[b];
}
const grams=t=>{const w=norm(t).split(' ').filter(Boolean);const out=new Set();
  for(let i=0;i+NG<=w.length;i++)out.add(w.slice(i,i+NG).join(' '));return{w,out}};
async function run(){
  const q=document.getElementById('q').value.trim();
  if(!q)return;
  const{w,qw,out:qg}=grams(q);
  if(!qg.size){stat.textContent='النص قصير جداً — يلزم ٦ كلمات على الأقل';return}
  stat.textContent='يُحمّل المتون…';
  let done=0,total=0;
  for(const b of BOOKS){stat.textContent='يُحمّل '+BAR[b]+'…';await loadBook(b)}
  pf.style.width='70%';stat.textContent='يطابق '+arNum(qg.size)+' شِستُغراماً…';
  await new Promise(r=>setTimeout(r,20));
  const hits=[];
  for(const b of BOOKS)for(const n in D[b].d){
    const m=D[b].d[n].m;total++;
    const cw=norm(m).split(' ');
    let hit=0;const seen=new Set();
    for(let i=0;i+NG<=cw.length;i++){const g=cw.slice(i,i+NG).join(' ');
      if(qg.has(g)&&!seen.has(g)){seen.add(g);hit++}}
    if(hit)hits.push({b,n,m,hit});
  }
  hits.sort((x,y)=>y.hit-x.hit||String(y.n)-String(x.n));
  pf.style.width='100%';stat.textContent='';
  document.getElementById('sum').innerHTML=
    `المتون الممسوحة: <b>${arNum(total)}</b> · المطابقات: <b>${arNum(hits.length)}</b>`+
    (hits.length?` · أعلى مطابقة: <b>${arNum(Math.round(hits[0].hit/qg.size*100))}٪</b>`:'');
  let shown=0;const PER=40;
  const render=()=>{
    const sl=hits.slice(shown,shown+PER);shown+=sl.length;
    const html=sl.map(h=>{
      const score=Math.round(h.hit/qg.size*100);
      const cw=norm(h.m).split(' ');
      const marks=new Set();
      for(let i=0;i+NG<=cw.length;i++)if(qg.has(cw.slice(i,i+NG).join(' ')))
        for(let k=0;k<NG;k++)marks.add(cw[i+k]);
      const raw=h.m.split(/\s+/);
      const marked=raw.map((w,i)=>marks.has(norm(w))?`<mark>${esc(w)}</mark>`:esc(w)).join(' ');
      const raw2=D[h.b].s[h.n]||[];const ch=Array.isArray(raw2[0])?raw2[0]:raw2;
      return `<div class="hrow"><div class="tx">${marked.slice(0,500)}${h.m.length>500?'…':''}</div>
      <div class="meta"><span class="score">${arNum(score)}٪ · ${arNum(h.hit)} غراماً</span>
      <span class="mini">${BAR[h.b]} <b style="color:var(--acc2)">#${arNum(h.n)}</b></span>
      <span class="bdg v-${bucket(ch&&ch[0])}">${esc((ch&&ch[0])||'—')}</span>
      <span class="mini"><a href="matn.html#${h.b}:${h.n}">المتن ←</a> <a href="silsila.html#b=${h.b}&n=${h.n}">السند ←</a></span></div></div>`;
    }).join('');
    const main=document.getElementById('main');
    if(shown===sl.length)main.innerHTML=html;else main.insertAdjacentHTML('beforeend',html);
    const btn=document.getElementById('mre');if(btn)btn.remove();
    if(shown<hits.length)main.insertAdjacentHTML('beforeend',
      `<button class="more" id="mre">عرض المزيد (${arNum(hits.length-shown)})</button>`);
  };
  render();
  document.getElementById('main').addEventListener('click',e=>{
    if(e.target.id==='mre'){render();e.target.remove()}});
}
window.run=run;
/* عينات: أشهر المعاني من GIDNET (أعلى تكراراً) */
(async()=>{
  try{
    await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='analysis.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});
    GN=window.GIDNET;
    const top=Object.entries(GN.g).sort((a,b)=>(b[1].r||0)-(a[1].r||0)).slice(0,6);
    const el=document.getElementById('samples');
    for(const[gid,g]of top){
      const bk=Object.keys(g.w||{})[0],n0=g.w[bk][0];
      el.insertAdjacentHTML('beforeend',
        `<button class="chip" onclick="pick('${bk}',${n0})" title="${esc(g.t.slice(0,80))}">معنى #${arNum(gid)}</button>`);
    }
  }catch(e){}
})();
window.pick=async function(b,n){
  stat.textContent='يُحمّل '+BAR[b]+'…';await loadBook(b);stat.textContent='';
  document.getElementById('q').value=D[b].d[n].m;run();
};
/* رابط عميق #b=كتاب&n=رقم — من صفحات التخريج القديمة والسند */
const h=location.hash;
const mh=h.match(/b=([\w-]+)&n=(\d+)/)||h.match(/([\w-]+):(\d+)/);
if(mh){const b=mh[1].includes('=')?mh[1].split('=').pop():mh[1];const n=mh[2];
  (async()=>{stat.textContent='يُحمّل '+BAR[b]+'…';await loadBook(b);
    if(D[b].d[n]){document.getElementById('q').value=D[b].d[n].m;run()}
    else stat.textContent='الرقم غير موجود في '+BAR[b];})();}
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="miq_takhrij"></script>
</body>
</html>
