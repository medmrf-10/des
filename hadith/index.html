<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر الحديث — أسانيد وأحكام ومقارنات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
*{box-sizing:border-box}
body{max-width:1100px;margin:0 auto;background:var(--bg);color:var(--txt);font-family:var(--font-ui)}
.top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:18px;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;position:sticky;top:52px;background:var(--bg);z-index:40;border-bottom:1px solid var(--border)}
.tabs button{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--txt);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--acc);color:#14140f;border-color:transparent;font-weight:700}
.tabs a{white-space:nowrap;border:1px dashed var(--acc);color:var(--acc2);border-radius:999px;padding:6px 14px;font-size:13px;text-decoration:none;margin-inline-start:4px}
.wrap{padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input[type=text]{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.matn{font-size:17px;line-height:2;color:var(--txt);font-family:var(--font-ar)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-sahih{background:#1d3b26;color:#7fd99b}.b-3{font-size:11px;background:#22303f;color:#9db8d4}
.chain{display:flex;flex-direction:column;gap:0;margin:10px 0}
.narr{display:flex;gap:10px;align-items:stretch}
.narr .rail{display:flex;flex-direction:column;align-items:center;width:20px}
.narr .rail .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);margin-top:6px;flex:none}
.narr .rail .ln{width:2px;flex:1;background:linear-gradient(var(--acc),#c9a24a55)}
.narr .nm{flex:1;padding:6px 0 14px;font-size:14px;color:var(--txt);cursor:pointer}
.narr .nm:hover{color:var(--acc2)}
.narr .nm small{display:block;color:var(--dim);font-size:11px}
.proph{background:linear-gradient(120deg,#3a2f16,#1d1a10);border:1px solid #c9a24a66;border-radius:10px;padding:10px;text-align:center;font-weight:800;color:var(--acc2)}
.verdict{color:#9db8d4;font-size:12px;background:#1a2330;border-radius:8px;padding:8px 10px;margin-top:8px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb td,.tb th{padding:7px 9px;border-bottom:1px solid var(--border);text-align:right}
.tb th{color:var(--acc);font-size:12px}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;display:inline-block;width:100px;vertical-align:middle}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--acc2)}
.stat span{font-size:11px;color:var(--dim)}
.topic{padding:6px 10px;border:1px solid var(--border);border-radius:8px;margin:3px 0;cursor:pointer;font-size:14px}
.topic:hover{border-color:var(--acc)}
.topic .cnt{color:var(--dim);font-size:11px}
.hitem{border:1px solid var(--border);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;font-size:13px}
.hitem:hover{border-color:var(--acc)}
.hitem .sn{color:#9db8d4;font-size:11px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media(max-width:640px){.cmp{grid-template-columns:minmax(0,1fr)}}
.cmp .card{font-size:13px;margin-bottom:0}
.cmp .card h4{margin:0 0 6px;color:#9db8d4;font-size:12px}
.mut{color:var(--dim);font-size:12px}
mark{background:#8a6d1f;color:#fff;border-radius:3px;padding:0 2px}
.src{display:inline-block;margin-left:6px;border:1px solid #c9a24a55;color:var(--acc2);border-radius:999px;padding:1px 9px;font-size:11px;text-decoration:none}
.btn{display:inline-block;border:1px solid var(--acc);color:var(--acc2);background:transparent;border-radius:8px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--card)}
.err{border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--dim)}
.err .btn{margin-top:8px}
</style>
</head>
<body>
<header class="top">
  <h1>⛓ مختبر الحديث</h1>
  <span class="mut" id="hdr">٢٧ ألف حديث · أسانيد كاملة · ٦ كتب</span>
</header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"></main>

<script>
/* ===== data layer (reuses ../wahy/data) ===== */
const cache=new Map();
async function fgz(u,sig){const r=await fetch(u,{signal:sig});if(!r.ok)throw new Error('HTTP '+r.status);const ds=new DecompressionStream('gzip');const t=await new Response(r.body.pipeThrough(ds)).text();return JSON.parse(t)}
function load(u,gz,sig){
  const ent=cache.get(u);
  if(ent&&!(ent.sig&&ent.sig.aborted))return ent.p;   /* مدخل مقطوع لا يخدم مستهلكاً جديداً */
  const p=(gz?fgz(u,sig):fetch(u,{signal:sig}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}));
  p.catch(()=>{const c=cache.get(u);if(c&&c.p===p)cache.delete(u)});
  cache.set(u,{p,sig});
  return p;
}
const booksIdx=(sig)=>load('../wahy/data/hadith/books.json',0,sig);
const bookD=(s,sig)=>load(`../wahy/data/hadith/${s}-det.json.gz`,1,sig);
const topics=(sig)=>load('../wahy/data/hadith/topics.json.gz',1,sig);
const TOC=(s,sig)=>load(`../wahy/data/hadith/${s}-toc.json.gz`,1,sig);
const BOOKS=['bukhari','muslim','tirmidhi','abi-dawud','nasai','ibn-majah'];
const BN={};let BIDX=null;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ْٰ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const hl=(t,q)=>q?esc(t).replace(new RegExp(q.split(/\s+/).filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'),m=>'<mark>'+m+'</mark>'):esc(t);
const arNum=n=>Number(n).toLocaleString('ar-EG');
const deb=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const isAbort=e=>e&&(e.name==='AbortError'||e.name==='DOMException'&&e.code===20);
const PSEUDO=/^موضع (تعليق|إرسال|انقطاع)$/;   /* عقد انقطاع صورية — ليست رواة */
const errBox=(retry)=>`<div class="card err"><p>تعذر التحميل — تحقق من الاتصال.</p><button class="btn" onclick="${retry};return false">إعادة المحاولة</button></div>`;

/* ===== shell ===== */
const TABS=[['sanad','السند'],['rijal','الرجال'],['cmp','المقارنة'],['topics','المواضيع'],['stats','إحصاء']];
let S={tab:'sanad',book:'bukhari',h:1,q:'',nr:'',topic:'2'};
const main=document.getElementById('main'),tabs=document.getElementById('tabs');
tabs.innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" onclick="go('${k}')">${n}</button>`).join('')+'<a href="net.html" title="شبكة المعنى — مجموعات موحدة عبر الكتب الستة">⛓ الشبكة</a>';
function go(t){S.tab=t;render();location.hash=encHash()}
function encHash(){return S.tab+'.'+S.book+'.'+S.h+(S.nr?'.'+S.nr:'')}
function decHash(){const p=(location.hash||'').replace('#','').split('.');if(TABS.some(x=>x[0]==p[0]))S.tab=p[0];if(BOOKS.includes(p[1]))S.book=p[1];if(p[2]&&!isNaN(p[2]))S.h=+p[2];if(p[3])S.nr=decodeURIComponent(p[3])}
addEventListener('hashchange',()=>{decHash();render()});
const loadBooks=async(sig)=>{const b=await booksIdx(sig);b.forEach(x=>BN[x.s]=x.n);return b.filter(x=>BOOKS.includes(x.s))};

/* ===== book picker ===== */
const bookSel=()=>`<select onchange="S.book=this.value;S.h=1;S.nr='';render()">${BOOKS.map(s=>`<option ${s==S.book?'selected':''} value="${s}">${BN[s]||s}</option>`).join('')}</select>`;

/* ===== TAB 1: sanad ===== */
async function vSanad(sig){
  const d=await bookD(S.book,sig);
  const hs=Object.keys(d.d).map(Number).sort((a,b)=>a-b);
  const mx=hs[hs.length-1];
  let h=d.d[S.h]||null;
  return `<div class="row">${bookSel()}
    <input type="text" id="hn" inputmode="numeric" placeholder="رقم الحديث (1-${arNum(mx)})" value="${S.h}" style="width:150px">
    <input type="text" id="hq" placeholder="بحث في المتن…" value="${esc(S.q)}" style="flex:1;min-width:160px">
  </div>
  <div id="hres"></div>
  <div id="sview">${h?sanadView(d,S.h):'<p class="mut">اختر رقماً أو ابحث في المتون.</p>'}</div>`;
}
function sanadView(d,n){
  const h=d.d[n];if(!h)return '<p class="mut">الحديث غير موجود.</p>';
  const chains=d.s[n]||[];   /* s[n]=[[حكم السند,[الرواة من المؤلف إلى الصحابي]],...] */
  const g=d.g[h.g];
  let chainHtml='';
  if(chains.length){
    chainHtml=chains.map((c,ci)=>{
      const narrs=c[1]||[];
      const tree='<div class="chain"><div class="proph">ﷺ</div>'+narrs.slice().reverse().map((x,i)=>{const ps=PSEUDO.test(x);return `<div class="narr"><div class="rail"><div class="ln"></div><div class="dot"></div></div><div class="nm"${ps?'':` onclick="pickNr('${esc(x)}')"`}>${esc(x)}<small>${ps?'موضع انقطاع':i==0?'الصحابي':i==narrs.length-1?'المصنّف':'راوٍ'} · الطبقة ${arNum(i+1)}</small></div></div>`}).join('')+'</div>';
      return (chains.length>1?`<div class="mut" style="margin-top:8px">سند ${arNum(ci+1)} من ${arNum(chains.length)}</div>`:'')+tree
        +(c[0]?`<div class="verdict">حكم على السند: ${esc(c[0])}</div>`:'');
    }).join('');
  }else chainHtml='<p class="mut">لا سند مفصّل لهذا الحديث في المصدر.</p>';
  const xr=g&&g.x?Object.entries(g.x).map(([b,nums])=>{const nn=[].concat(nums)[0];return `<a class="src" href="#" onclick="S.tab='cmp';S.book='${b}';S.h=${nn};render();return false">${BN[b]||b}</a>`}).join(''):'';
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <b>حديث ${arNum(n)} — ${BN[S.book]}</b>
      ${g?`<span class="badge b-sahih">${esc(g.h||'')}</span>`:''}
    </div>
    <p class="matn">${esc(h.m)}</p>
    ${g?`<p class="mut">مجموعة المعنى ${arNum(h.g)}${g.s?` · رواه ${arNum(g.s)} من الصحابة`:''}${g.hs?` · أحاديث مترابطة: ${g.hs.map(x=>`<a href="#sanad.${S.book}.${x}" onclick="S.tab='sanad';S.h=${x};render();return false">${arNum(x)}</a>`).join('،')}`:''}</p>`:''}
    ${xr?`<p class="mut">في كتب أخرى: ${xr}</p>`:''}
    <h3 style="color:var(--acc2);font-size:14px;margin:12px 0 4px">الإسناد (من النبي ﷺ إلى المؤلف)</h3>
    ${chainHtml}
  </div>`;
}
window.pickNr=n=>{S.tab='rijal';S.nr=n;render()};

/* ===== TAB 2: rijal ===== */
let RC={};
async function rijalStats(b,sig){
  if(RC[b])return RC[b];
  const d=await bookD(b,sig),M={};
  for(const n in d.s)for(const c of d.s[n]){(c[1]||[]).forEach((x,i)=>{const k=x.trim();if(PSEUDO.test(k))return;(M[k]=M[k]||{c:0,pos:0,h:[]});M[k].c++;M[k].pos+=i;if(M[k].h.length<40)M[k].h.push(+n)})}
  const arr=Object.entries(M).map(([name,o])=>({name,c:o.c,pos:o.pos/o.c,h:o.h})).sort((a,b)=>b.c-a.c);
  return RC[b]=arr;
}
async function vRijal(sig){
  const arr=await rijalStats(S.book,sig);
  return `<div class="row">${bookSel()}
    <input type="text" id="nrq" placeholder="اسم الراوي…" value="${esc(S.nr)}" style="flex:1">
  </div>
  <p class="mut">${arNum(arr.length)} راوياً في ${BN[S.book]} — اضغط الاسم لعرض أحاديثه</p>
  <div id="rijList">${rijTable(arr,S.nr)}</div>
  <div id="nrH"></div>`;
}
function rijTable(arr,q){
  const list=q?arr.filter(r=>norm(r.name).includes(norm(q))):arr.slice(0,120);
  return `<table class="tb"><tr><th>الراوي</th><th>رواياته</th><th>الطبقة المتوسطة</th></tr>
  ${list.map(r=>`<tr><td><a href="#" onclick="S.nr='${esc(r.name)}';renderNrH();return false">${esc(r.name)}</a></td>
  <td><span class="bar"><i style="width:${Math.min(100,r.c/(arr[0]&&arr[0].c||1)*100)}%"></i></span> ${arNum(r.c)}</td>
  <td>${arNum(Math.round(r.pos))}</td></tr>`).join('')}</table>`;
}
async function renderRijList(){
  const el=document.getElementById('rijList');if(!el)return;
  const arr=await rijalStats(S.book);
  const el2=document.getElementById('rijList');if(!el2)return;
  el2.innerHTML=rijTable(arr,S.nr);
}
window.renderNrH=async function(){
  if(!S.nr)return;const d=await bookD(S.book);const arr=await rijalStats(S.book);
  const r=arr.find(x=>x.name==S.nr);if(!r)return;
  const el=document.getElementById('nrH');if(!el)return;
  el.innerHTML=`<div class="card"><h3 style="color:var(--acc2);font-size:14px">روايات ${esc(S.nr)} (${arNum(r.c)})</h3>${r.h.map(n=>{const h=d.d[n];return h?`<div class="hitem" onclick="S.tab='sanad';S.h=${n};S.nr='';render()"><b>حديث ${arNum(n)}</b><div class="sn">${esc(h.m.slice(0,90))}…</div></div>`:''}).join('')}</div>`;
}

/* ===== TAB 3: compare groups ===== */
async function vCmp(sig){
  const d=await bookD(S.book,sig);const h=d.d[S.h];
  if(!h)return `<div class="row">${bookSel()}<input type="text" id="hn" placeholder="رقم الحديث" style="width:130px"></div><p class="mut">اختر حديثاً له نظائر في كتب أخرى (من تبويب السند).</p>`;
  const g=d.g[h.g];if(!g)return '<p class="mut">لا مجموعة معنى.</p>';
  const cards=[{b:S.book,n:S.h,m:h.m,h:g.h}];
  for(const b of BOOKS){   /* x جزئية في المصدر — نفحص الكتب الستة كاملة */
    if(b==S.book)continue;
    const dd=await bookD(b,sig);const gg=dd.g[h.g];if(!gg)continue;
    for(const nn of (gg.hs||[]).slice(0,3)){const hh=dd.d[nn];if(hh)cards.push({b,n:nn,m:hh.m,h:gg.h||''})}
  }
  return `<div class="row">${bookSel()}<input type="text" id="hn" value="${S.h}" style="width:110px"><span class="mut">نفس المعنى عبر الكتب</span></div>
  <div class="cmp">${cards.map(c=>`<div class="card"><h4>${BN[c.b]||c.b} · ${arNum(c.n)} ${c.h?`<span class="badge b-sahih">${esc(c.h)}</span>`:''}</h4><p class="matn" style="font-size:14px">${esc(c.m.slice(0,600))}${c.m.length>600?'…':''}</p><a class="src" href="#" onclick="S.tab='sanad';S.book='${c.b}';S.h=${c.n};render();return false">السند ←</a></div>`).join('')}</div>`;
}

/* ===== TAB 4: topics ===== */
async function vTopics(sig){
  const T=await topics(sig);const tt=T.t;
  const kids={};for(const id in tt){const p=tt[id].p;(kids[p]=kids[p]||[]).push(id)}
  const top=(kids[0]||kids['0']||['1']);
  return `<p class="mut">شجرة موضوعات الحديث — اضغط موضوعاً لعرض مجموعاته وأحاديثه (انقر مرة أخرى للطيّ)</p>
  ${top.map(id=>treeHtml(tt,kids,id)).join('')}`;
}
function isAnc(tt,a,id){let x=id;while(x){if(x==a)return true;x=tt[x]&&tt[x].p}return false}
function treeHtml(tt,kids,id){
  const t=tt[id];if(!t)return'';const ks=(kids[id]||[]);
  const cnt=Object.values(t.b||{}).reduce((a,b)=>a+b,0);
  const open=S.topic==id||isAnc(tt,id,S.topic);
  let h=`<div class="topic" style="margin-right:${t.l*14}px" onclick="S.topic=S.topic=='${id}'?'':'${id}';render()">${ks.length?(open?'▾':'▸'):''} <b>${esc(t.n)}</b> <span class="cnt">${arNum(cnt)}</span></div>`;
  if(S.topic==id)h+=topicGroups(id);
  if(open)h+=ks.map(k=>treeHtml(tt,kids,k)).join('');
  return h;
}
function topicGroups(tid){
  return `<div id="tg_${tid}" class="mut" style="margin-right:20px">يُحمّل…</div>`;
}
async function fillTopic(tid,sig){
  const el=document.getElementById('tg_'+tid);if(!el)return;
  const seq=rseq;
  try{
    const T=await topics(sig);
    const gids=T.g[tid]||[];
    if(!gids.length){el.innerHTML='لا أحاديث مسندة لهذا الموضوع';return}
    const out=[];
    for(const gid of gids.slice(0,12)){
      if(seq!==rseq||tid!==S.topic)return;
      for(const b of BOOKS){
        const d=await bookD(b,sig);
        const g=d.g[gid];
        if(g){const num=(g.hs||[])[0];
          out.push(`<div class="hitem" onclick="S.tab='cmp';S.book='${b}';S.h=${num};render()"><b>${esc(BN[b]||b)}</b> <span class="badge b-sahih">${esc(g.h||'')}</span><div class="sn">${esc((g.t||'').slice(0,110))}…</div></div>`);
          break}
      }
    }
    if(seq!==rseq||!document.getElementById('tg_'+tid))return;
    el.innerHTML=out.join('')||'لا نتائج';
  }catch(e){
    if(isAbort(e))return;
    if(document.getElementById('tg_'+tid))el.innerHTML=`تعذر تحميل المجموعات — <a href="#" class="btn" style="padding:1px 10px" onclick="fillTopic('${tid}');return false">إعادة المحاولة</a>`;
  }
}
window.fillTopic=fillTopic;

/* ===== TAB 5: stats ===== */
async function vStats(sig){
  const d=await bookD(S.book,sig);
  const hk={},len=[],vf={};
  let ns=0;for(const n in d.d){const h=d.d[n],g=d.g[h.g];if(g)hk[g.h]=(hk[g.h]||0)+1}
  for(const n in d.s){ns++;for(const c of d.s[n]){len.push((c[1]||[]).length);if(c[0])vf[c[0]]=(vf[c[0]]||0)+1}}
  const avg=len.length?(len.reduce((a,b)=>a+b,0)/len.length):0;
  const rij=await rijalStats(S.book,sig);
  return `<div class="row">${bookSel()}</div>
  <div class="stats">
    <div class="stat"><b>${arNum(Object.keys(d.d).length)}</b><span>حديثاً</span></div>
    <div class="stat"><b>${arNum(ns)}</b><span>بسند مفصّل</span></div>
    <div class="stat"><b>${arNum(Object.keys(d.g).length)}</b><span>مجموعة معنى</span></div>
    <div class="stat"><b>${avg.toFixed(1)}</b><span>متوسط طول السند</span></div>
  </div>
  <div class="card"><h3 style="color:var(--acc2);font-size:14px">الأحكام</h3><table class="tb">${Object.entries(hk).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td><span class="bar"><i style="width:${v/Math.max(...Object.values(hk))*100}%"></i></span> ${arNum(v)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3 style="color:var(--acc2);font-size:14px">أكثر الرواة</h3><table class="tb">${rij.slice(0,15).map(r=>`<tr><td>${esc(r.name)}</td><td><span class="bar"><i style="width:${r.c/rij[0].c*100}%"></i></span> ${arNum(r.c)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3 style="color:var(--acc2);font-size:14px">أحكام الأسانيد الشائعة</h3><table class="tb">${Object.entries(vf).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,v])=>`<tr><td style="font-size:11px">${esc(k)}</td><td>${arNum(v)}</td></tr>`).join('')}</table></div>`;
}

/* ===== render — seq guard + abort for stale views ===== */
let rseq=0,ctl=null;
async function render(){
  const seq=++rseq;
  if(ctl)ctl.abort();
  ctl=new AbortController();
  const sig=ctl.signal;
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
  main.innerHTML='<p class="mut">يُحمّل…</p>';
  try{
    if(!BIDX)BIDX=await loadBooks(sig);
    let h='';
    if(S.tab=='sanad')h=await vSanad(sig);
    else if(S.tab=='rijal')h=await vRijal(sig);
    else if(S.tab=='cmp')h=await vCmp(sig);
    else if(S.tab=='topics')h=await vTopics(sig);
    else h=await vStats(sig);
    if(seq!==rseq)return;
    main.innerHTML=h;
    const hn=document.getElementById('hn');if(hn)hn.addEventListener('change',e=>{S.h=+e.target.value||1;render()});
    const hq=document.getElementById('hq');
    if(hq)hq.addEventListener('input',deb(async e=>{S.q=e.target.value;
      try{const d=await bookD(S.book);const tq=norm(S.q);
        const res=Object.keys(d.d).filter(n=>norm(d.d[n].m).includes(tq)).slice(0,20);
        const el=document.getElementById('hres');if(el)el.innerHTML=res.map(n=>`<div class="hitem" onclick="S.h=${n};render()"><b>${arNum(n)}</b><div class="sn">${hl(d.d[n].m.slice(0,90),S.q)}…</div></div>`).join('');
      }catch(e){const el=document.getElementById('hres');if(el)el.innerHTML='<p class="mut">تعذر البحث.</p>'}
    },220));
    const nrq=document.getElementById('nrq');
    if(nrq)nrq.addEventListener('input',deb(e=>{S.nr=e.target.value;renderRijList()},220));
    if(S.tab=='rijal')renderNrH();
    if(S.tab=='topics'&&S.topic)fillTopic(S.topic,sig);
  }catch(e){
    if(isAbort(e)||seq!==rseq)return;
    main.innerHTML=errBox('render()');
  }
}
decHash();render();
</script>
<script src="../shared/feedback.js"></script>
