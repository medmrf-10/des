<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Turath — مكتبة التراث</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turath">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --card:#131a22; --card2:#1a2330; --border:#28323f;
  --txt:#eef3f8; --dim:#93a1b3; --acc:#8b7cf6; --acc2:#5ec8ff;
  --ok:#46c96d; --warn:#e0a93e; --gold:#f0c75e;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; background:radial-gradient(1200px 500px at 80% -10%, rgba(139,124,246,.08), transparent), var(--bg); color:var(--txt); min-height:100vh}
.wrap{max-width:720px; margin:0 auto; padding:0 14px}
header{position:sticky; top:0; z-index:50; background:rgba(11,15,20,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.head-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
h1{font-size:1.25rem; font-weight:700; background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.prog{font-size:.8rem; color:var(--dim); white-space:nowrap}
.prog b{color:var(--acc2); font-size:1.05rem}
.stats{font-size:.72rem; color:var(--dim); margin-top:6px; display:flex; gap:12px}
.stats b{color:var(--acc2)}
.search{margin-top:10px; position:relative}
.search input{width:100%; padding:11px 14px; padding-inline-start:40px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--txt); font-family:inherit; font-size:.9rem; transition:border-color .2s}
.search input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(139,124,246,.15)}
.search::after{content:'⌕'; position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%); color:var(--dim); font-size:1.1rem}
.pickrow{display:flex; gap:8px; margin-top:10px}
.pick{flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-family:inherit; font-size:.82rem; color:var(--txt); transition:border-color .2s}
.pick:active{border-color:var(--acc)}
.pick .lbl{color:var(--dim); font-size:.68rem}
.pick .val{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:center}
.pick .arrow{color:var(--acc2); font-size:.7rem}
.filters{display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto; padding:7px 14px; border-radius:99px; border:1px solid var(--border); background:var(--card); color:var(--dim); font-family:inherit; font-size:.78rem; cursor:pointer; transition:all .2s; white-space:nowrap}
.fbtn.on{background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#fff; border-color:transparent; font-weight:600}
.fbtn .n{opacity:.7; font-size:.68rem; margin-inline-start:4px}
/* bottom sheet */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s; z-index:90}
.sheet-bg.show{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; max-width:720px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-bottom:none; border-radius:22px 22px 0 0; transform:translateY(105%); transition:transform .32s cubic-bezier(.22,1,.36,1); z-index:95; max-height:72vh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:44px; height:4px; border-radius:99px; background:var(--border); margin:10px auto 4px}
.sheet .sh-head{padding:8px 16px 10px; border-bottom:1px solid var(--border)}
.sheet .sh-title{font-size:.85rem; font-weight:700; margin-bottom:8px}
.sheet input{width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card2); color:var(--txt); font-family:inherit; font-size:.82rem}
.sheet input:focus{outline:none; border-color:var(--acc)}
.sheet .sh-list{overflow-y:auto; padding:6px 0 18px}
.srow{display:flex; align-items:center; gap:12px; padding:12px 18px; cursor:pointer; transition:background .15s; border-bottom:1px solid #1a2230}
.srow:active{background:var(--card2)}
.srow .tick{width:20px; color:var(--acc2); font-weight:700; font-size:.9rem}
.srow .snm{flex:1; font-size:.88rem; line-height:1.4}
.srow .sct{font-size:.7rem; color:var(--dim); background:var(--card2); border:1px solid var(--border); padding:3px 9px; border-radius:8px}
.srow.on .snm{color:var(--acc2); font-weight:600}
/* cards */
.sec-title{margin:16px 4px 10px; font-size:.78rem; font-weight:600; color:var(--acc2); display:flex; align-items:center; gap:8px}
.sec-title::after{content:''; flex:1; height:1px; background:var(--border)}
.card{background:linear-gradient(160deg,var(--card),#111820); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:12px; transition:border-color .3s; box-shadow:0 2px 12px rgba(0,0,0,.25); content-visibility:auto; contain-intrinsic-size:auto 220px}
.few .card{animation:enter .4s cubic-bezier(.22,1,.36,1) both}
@keyframes enter{from{opacity:0; transform:translateY(12px)}}
.card.open{border-color:var(--acc)}
.ctop{display:flex; gap:10px; align-items:flex-start}
.cname{flex:1; font-size:.98rem; font-weight:700; line-height:1.6}
.kindb{flex:0 0 auto; font-size:.66rem; font-weight:700; color:#ffd58a; background:rgba(224,169,62,.12); border:1px solid rgba(224,169,62,.35); padding:4px 10px; border-radius:8px}
.cstats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.stat{background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:8px 10px; text-align:center}
.stat .v{font-size:.92rem; font-weight:700; color:var(--acc2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; display:block}
.stat .k{display:block}
.stat .k{font-size:.62rem; color:var(--dim); margin-top:2px}
.works{margin-top:12px; display:flex; flex-direction:column; gap:6px}
.wrow{display:flex; align-items:center; gap:8px; font-size:.78rem}
.wtag{flex:0 0 auto; font-size:.6rem; font-weight:700; padding:3px 8px; border-radius:7px; min-width:44px; text-align:center}
.wtag.m{background:rgba(94,200,255,.12); color:#8fd4ff; border:1px solid rgba(94,200,255,.3)}
.wtag.s{background:rgba(70,201,109,.12); color:#7bd88f; border:1px solid rgba(70,201,109,.3)}
.wtag.h{background:rgba(232,184,109,.12); color:#e8b86d; border:1px solid rgba(232,184,109,.35)}
.wname{flex:1; color:var(--txt); line-height:1.5; padding:6px 10px; border-radius:9px; background:rgba(255,255,255,.025); border:1px dashed var(--border)}
.ccmt{margin-top:10px; font-size:.75rem; color:#a9b8c7; line-height:1.8; border-inline-start:3px solid var(--acc); padding-inline-start:10px; border-radius:2px}
.cfoot{display:flex; align-items:center; justify-content:space-between; margin-top:13px; gap:8px; flex-wrap:wrap}
.plist{font-size:.72rem; color:var(--acc2); text-decoration:none}
.plist:hover{text-decoration:underline}
.ratebtn{padding:8px 16px; border-radius:99px; border:1px solid var(--border); background:var(--card2); color:var(--dim); font-family:inherit; font-size:.72rem; font-weight:600; cursor:pointer; transition:all .2s}
.ratebtn.has{background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#fff; border-color:transparent}
.rate{display:flex; gap:4px}
.rnum{width:27px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border); background:var(--card2); cursor:pointer; font-size:.75rem; font-weight:600; color:var(--dim); transition:all .15s; font-family:inherit}
.rnum.sel{background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; border-color:transparent; transform:scale(1.12); box-shadow:0 3px 12px rgba(94,200,255,.3)}
.cbody{display:none; margin-top:14px; border-top:1px solid var(--border); padding-top:12px}
.card.open .cbody{display:block}
.cbody .cl{display:flex; gap:9px; padding:6px 0; border-bottom:1px dashed #202a36; font-size:.78rem; align-items:baseline}
.cbody .cl:last-child{border:none}
.cbody .n{color:var(--acc2); min-width:30px; font-weight:700; font-size:.7rem}
.cbody .t{flex:1; line-height:1.5}
.cbody .t a{color:var(--txt)}
.cbody .t a:hover{color:var(--acc2)}
.cbody .d{color:var(--dim); font-size:.68rem; white-space:nowrap}
.more{padding:10px; text-align:center; font-size:.74rem; color:var(--acc2); cursor:pointer; border-radius:10px; margin-top:6px; background:var(--card2)}
.sheikh-head{display:flex; align-items:center; gap:10px; padding:4px}
.sheikh-head .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:.8rem;flex:0 0 auto}
.sheikh-head .sn{font-weight:700;font-size:.92rem}
.sheikh-head .ss{font-size:.68rem;color:var(--dim)}
.empty{text-align:center; padding:50px 20px; color:var(--dim); font-size:.85rem}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="head-row">
    <h1>مكتبة التراث</h1>
    <div class="prog"><b id="cnt">0</b> سلسلة</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="search"><input id="q" type="search" placeholder="ابحث في السلاسل والمتون والشروح…"></div>
  <div class="pickrow">
    <button class="pick" id="picks"><span class="lbl">الشيخ</span><span class="val" id="picksV">الكل</span><span class="arrow">▾</span></button>
  </div>
</div></header>

<div class="wrap">
  <div class="filters" id="fkind" style="padding-top:10px"></div>
  <div id="list"></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-head">
    <div class="sh-title">اختر الشيخ</div>
    <input id="shq" type="search" placeholder="ابحث باسم الشيخ…">
  </div>
  <div class="sh-list" id="shList"></div>
</div>

<script src="data.js"></script>
<script>
const vals=JSON.parse(localStorage.getItem('durus_vals')||'{}');
const W={}; WORKS.forEach(w=>W[w.id]=w);
let F={sh:'',kinds:new Set(),q:''};
const expanded={};
const $=s=>document.getElementById(s);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmtH=h=>h?h.toFixed(1):'';
function clipHTML(c){
  const m=Math.floor((c.secs||0)/60),ss=Math.floor((c.secs||0)%60);
  return `<div class="cl"><span class="n">${c.lesson??''}</span><span class="t"><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title)}</a></span><span class="d"><bdi>${m}:${String(ss).padStart(2,'0')}</bdi></span></div>`;
}
function wrow(tag,cls,id){
  const w=W[id]; if(!w)return '';
  return `<div class="wrow"><span class="wtag ${cls}">${tag}</span><span class="wname" data-w="${id}">${esc(w.title)}</span></div>`;
}
function card(s){
  const v=vals[s.id];
  let wr='';
  wr+=wrow('متن','m',s.matn_id)+wrow('شرح','s',s.sharh_id)+wrow('حاشية','h',s.hashiya_id);
  return `<div class="card" id="c${s.id}">
    <div class="ctop"><div class="cname">${esc(s.name)}</div>${s.kind?`<span class="kindb">${esc(s.kind)}</span>`:''}</div>
    <div class="cstats">
      <div class="stat"><div class="v">${s.cc||s.videos||0}</div><div class="k">مقطعاً</div></div>
      <div class="stat"><div class="v">${fmtH(s.hours)||'—'}</div><div class="k">ساعة</div></div>
      <div class="stat"><div class="v">${esc(s.channel)}</div><div class="k">القناة</div></div>
    </div>
    ${wr?`<div class="works">${wr}</div>`:''}
    ${s.comment?`<div class="ccmt">${esc(s.comment)}</div>`:''}
    <div class="cfoot">
      <a class="plist" href="${esc(s.plist_url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">قائمة التشغيل ↖</a>
      <button class="ratebtn${v?' has':''}" data-id="${s.id}">${v?`قيمتك: ${v}`:'قيّم ★'}</button>
    </div>
    <div class="cbody"><div class="cls">… يُحمَّل المقاطع</div></div>
  </div>`;
}
function workNames(id){return id&&W[id]?W[id].title:''}
function render(){
  let L=SERIES.filter(s=>(!F.sh||s.sheikh===F.sh)&&(!F.kinds.size||F.kinds.has(s.kind))&&
    (!F.q||(s.name||'').includes(F.q)||workNames(s.matn_id).includes(F.q)||workNames(s.sharh_id).includes(F.q)||workNames(s.hashiya_id).includes(F.q)||(s.comment||'').includes(F.q)));
  $('cnt').textContent=L.length;
  const totV=L.reduce((a,s)=>a+(s.cc||s.videos||0),0),totH=L.reduce((a,s)=>a+(s.hours||0),0);
  $('stats').innerHTML=`<span><b>${totV.toLocaleString('en')}</b> مقطعاً</span><span><b>${totH.toFixed(0)}</b> ساعة</span><span><b>${new Set(L.map(s=>s.sheikh)).size}</b> مشايخ</span>`;
  const bySh={};
  L.forEach(s=>{(bySh[s.sheikh]=bySh[s.sheikh]||[]).push(s)});
  const order=Object.keys(bySh).sort((a,b)=>bySh[b].length-bySh[a].length);
  const PER=8;
  $('list').classList.toggle('few',L.length<=30);
  $('list').innerHTML=order.map(sh=>{
    const arr=bySh[sh].sort((a,b)=>(b.hours||0)-(a.hours||0));
    const shown=Math.min(arr.length,(expanded[sh]||PER));
    const cards=arr.slice(0,shown).map(card).join('');
    const more=arr.length>shown?`<div class="more sec-more" data-sh="${esc(sh)}" data-n="${arr.length}">عرض بقية السلاسل — ${arr.length-shown} أخرى ↓</div>`:'';
    return `<div class="sec-title"><span class="sheikh-head"><span class="av">${esc(sh[0]||'')}</span><span><span class="sn">${esc(sh)}</span><div class="ss">${arr.length} سلسلة</div></span></span></div>${cards}${more}`;
  }).join('')||'<div class="empty">لا نتائج — جرّب بحثاً آخر</div>';
}
function pillsKind(){
  const counts={};
  SERIES.forEach(s=>{if(s.kind&&(!F.sh||s.sheikh===F.sh))counts[s.kind]=(counts[s.kind]||0)+1});
  const sorted=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  $('fkind').innerHTML=`<button class="fbtn${F.kinds.size?'':' on'}" data-v="">الكل</button>`+sorted.map(v=>`<button class="fbtn${F.kinds.has(v)?' on':''}" data-v="${esc(v)}">${esc(v)} <span class="n">${counts[v]}</span></button>`).join('');
  $('fkind').querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(v==='')F.kinds=new Set();else{F.kinds.has(v)?F.kinds.delete(v):F.kinds.add(v)}
    pillsKind();render();
  });
}
/* sheikh bottom-sheet picker */
function shRows(q){
  const counts={};SERIES.forEach(s=>{if(s.sheikh)counts[s.sheikh]=(counts[s.sheikh]||0)+1});
  let names=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(q)names=names.filter(n=>n.includes(q));
  const row=n=>`<div class="srow${F.sh===n?' on':''}" data-v="${esc(n)}"><span class="tick">${F.sh===n?'✓':''}</span><span class="snm">${esc(n)}</span><span class="sct">${counts[n]} سلسلة</span></div>`;
  const all=`<div class="srow${!F.sh?' on':''}" data-v=""><span class="tick">${!F.sh?'✓':''}</span><span class="snm">كل المشايخ</span><span class="sct">${SERIES.length}</span></div>`;
  $('shList').innerHTML=all+names.map(row).join('')||all;
  $('shList').querySelectorAll('.srow').forEach(r=>r.onclick=()=>{
    F.sh=r.dataset.v;F.kinds=new Set();
    $('picksV').textContent=F.sh||'الكل';
    closeSheet();pillsKind();render();
  });
}
function openSheet(){$('sheetBg').classList.add('show');$('sheet').classList.add('show');$('shq').value='';document.body.style.overflow='hidden'}
function openShSheet(){document.querySelector('#sheet .sh-title').textContent='اختر الشيخ';$('shq').style.display='';openSheet();shRows('')}
function closeSheet(){$('sheetBg').classList.remove('show');$('sheet').classList.remove('show');document.body.style.overflow=''}
$('picks').onclick=openShSheet;
$('sheetBg').onclick=closeSheet;
$('shq').oninput=e=>shRows(e.target.value.trim());
/* rating via bottom sheet */
let ratingFor=null;
function openRate(id){
  ratingFor=id;
  const v=vals[id];
  $('shList').innerHTML=`<div class="srow${!v?' on':''}" data-v=""><span class="tick">${!v?'✓':''}</span><span class="snm">بدون تقييم</span></div>`+[...Array(10)].map((_,i)=>`<div class="srow${v===i+1?' on':''}" data-v="${i+1}"><span class="tick">${v===i+1?'✓':''}</span><span class="snm">${i+1} / 10</span></div>`).join('');
  document.querySelector('#sheet .sh-title').textContent='قيّم السلسلة';$('shq').style.display='none';
  $('shList').querySelectorAll('.srow').forEach(r=>r.onclick=()=>{
    const vv=r.dataset.v?+r.dataset.v:null;
    if(vv)vals[ratingFor]=vv;else delete vals[ratingFor];
    localStorage.setItem('durus_vals',JSON.stringify(vals));
    closeSheet();render();
  });
  openSheet();
}
$('list').addEventListener('click',async e=>{
  if(e.target.classList.contains('ratebtn')){openRate(e.target.dataset.id);e.stopPropagation();return}
  if(e.target.classList.contains('sec-more')){
    expanded[e.target.dataset.sh]=99999;render();return;
  }
  const wn=e.target.closest('.wname');
  if(wn){$('q').value=W[+wn.dataset.w].title;F.q=W[+wn.dataset.w].title;render();e.stopPropagation();return}
  if(e.target.closest('.more'))return;
  const card=e.target.closest('.card');if(!card)return;
  const id=+card.id.slice(1);
  card.classList.toggle('open');
  if(!card.classList.contains('open')||card.dataset.loaded)return;
  card.dataset.loaded='1';
  const box=card.querySelector('.cls');
  try{
    const r=await fetch(`clips/${id}.json`);const cl=await r.json();
    const SHOWN=15;
    box.innerHTML=cl.slice(0,SHOWN).map(clipHTML).join('')+(cl.length>SHOWN?`<div class="more" data-id="${id}">عرض كل المقاطع (${cl.length}) ↓</div>`:'')||'— لا مقاطع —';
  }catch{box.textContent='تعذر التحميل'}
});
$('list').addEventListener('click',async e=>{
  if(!e.target.classList.contains('more'))return;
  const id=e.target.dataset.id,r=await fetch(`clips/${id}.json`),cl=await r.json();
  e.target.parentElement.innerHTML=cl.map(clipHTML).join('');
});
let qt;$('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{F.q=e.target.value.trim();render()},180)};
pillsKind();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
