<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصفَد — القفل</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.lock{background:linear-gradient(135deg,var(--card),var(--card2));border:2px solid var(--acc);border-radius:16px;padding:22px;margin-top:12px;text-align:center}
.lock .ic{font-size:36px}
.lock .msg{font-family:var(--font-ar);font-size:17px;line-height:1.9;margin:12px 0}
.lock .age{font-size:11px;color:var(--dim)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.done{background:var(--card);border:1px solid var(--ok);border-radius:12px;padding:12px 15px;margin-top:9px}
.done .nm{font-family:var(--font-ar);font-size:13px;text-decoration:line-through;opacity:.75}
.done .meta{font-size:10.5px;color:var(--dim);margin-top:4px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصفَد <span class="muted">— القفل</span></h2>
<div class="muted">اقفل يومك بوعد — لا يُفتح إلا بإنجازك.</div>
<div id="cur"></div>
<div class="card"><div class="t">اقفل بوعد</div>
<input id="nm" placeholder="مثال: لا أفتح المنصات حتى أنهي الورد">
<textarea id="wh" placeholder="لماذا هذا مهم لك اليوم؟ (يظهر لك عند إغلاق القفل)"></textarea>
<button class="btn" id="add" style="margin-top:9px">أقفل</button></div>
<div id="stats"></div>
<div id="hist"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let L=LS('misfad',{cur:null,hist:[]});
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 if(L.cur&&!confirm('لديك قفل نشط — تحلّل منه وأقفل جديداً؟'))return;
 if(L.cur)L.hist.unshift({...L.cur,kept:false,brokenAt:Date.now()});
 L.cur={n,wh:$('#wh').value.trim(),at:Date.now()};
 SV('misfad',L);$('#nm').value='';$('#wh').value='';render();
};
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<60?arN(m)+' دقيقة':m<1440?arN(Math.floor(m/60))+' ساعة':arN(Math.floor(m/1440))+' يوم'}
function render(){
 $('#cur').innerHTML=L.cur?'<div class="lock"><div class="ic">🔒</div><div class="msg">'+esc(L.cur.n)+'</div>'+
 (L.cur.wh?'<div class="muted" style="margin-bottom:10px">'+esc(L.cur.wh)+'</div>':'')+
 '<div class="age">مُقفل منذ '+ago(L.cur.at)+'</div>'+
 '<div style="margin-top:14px;display:flex;gap:9px;justify-content:center">'+
 '<button class="btn" id="unl">أنجزته — افتح</button>'+
 '<button class="btn ghost" id="brk">كسر القفل</button></div></div>':'';
 const unl=$('#unl'),brk=$('#brk');
 if(unl)unl.onclick=()=>{L.hist.unshift({...L.cur,kept:true,keptAt:Date.now()});L.cur=null;SV('misfad',L);render()};
 if(brk)brk.onclick=()=>{if(confirm('أكسر قفل وعدي؟')){L.hist.unshift({...L.cur,kept:false,brokenAt:Date.now()});L.cur=null;SV('misfad',L);render()}};
 const kept=L.hist.filter(h=>h.kept).length;
 $('#stats').innerHTML='<span class="stat">أوفيت: <b>'+arN(kept)+'</b></span>'+
 '<span class="stat">كسرت: <b>'+arN(L.hist.length-kept)+'</b></span>'+
 (L.hist.length?'<span class="stat">نسبة الوفاء: <b>'+arN(Math.round(kept/L.hist.length*100))+'%</b></span>':'');
 $('#hist').innerHTML=L.hist.slice(0,8).map(h=>'<div class="done" style="border-color:'+(h.kept?'var(--ok)':'var(--acc2)')+'"><div class="nm">'+esc(h.n)+'</div><div class="meta">'+(h.kept?'وفيت':'كسرت')+' — '+ago(h.at)+'</div></div>').join('');
}
render();
</script>
<script src="../shared/feedback.js" data-pid="misfad" data-title="مِصفَد"></script>
</body>
</html>
