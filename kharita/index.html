<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>خريطة المنهج — 952 سلسلة</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
html,body{overflow-x:hidden}
body{max-width:900px;margin:0 auto;padding:14px}
.sheikh{margin:14px 0}
.sh-h{display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:13px}
.sh-h:hover{border-color:var(--acc)}
.sh-h .nm{font-weight:700;font-size:15px;flex:1}
.sh-h .mt{font-size:11.5px;color:var(--dim)}
.sh-h .pct{background:var(--card2);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--acc2);font-weight:700}
.sh-b{display:none;padding:10px 6px}
.sh-b.open{display:block}
.kind{margin:10px 0 10px 10px}
.kind-h{font-size:12.5px;color:var(--acc2);margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.kind-h::before{content:"";width:14px;height:2px;background:var(--acc);border-radius:1px}
.ser{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--border);background:var(--card);border-radius:11px;margin:6px 0}
.ser.done{background:#14291c;border-color:rgba(61,214,140,.35)}
.ser .nm{font-size:13.5px;flex:1;line-height:1.6}
.ser .mt{font-size:11px;color:var(--dim);white-space:nowrap}
.ser .chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.ser.done .chk{background:var(--ok);border-color:var(--ok);color:#08130c;font-weight:900}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.st{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 16px;font-size:12px;color:var(--dim)}
.st b{display:block;font-size:19px;color:var(--txt)}
.muted{color:var(--dim);font-size:12px}
.search{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:11px;padding:10px 14px;font-family:inherit;font-size:14px;margin:8px 0}
.bar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:5px;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
</style>
</head>
<body>
<h1 style="font-size:19px;margin:4px 0;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">خريطة المنهج</h1>
<div class="muted">952 سلسلة علمية — شيخ ← نوع ← سلسلة. علّم ما أنهيته وترى طريقك يتلوّن (يُحفظ على جهازك)</div>
<input class="search" id="q" placeholder="ابحث في السلاسل… (متن، شرح، مقتطفات…)">
<div class="stats" id="stats"></div>
<div id="tree"></div>
<script src="../durus/data.js"></script>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LSK='mnhaj_done';
let done={};try{done=JSON.parse(localStorage.getItem(LSK)||'{}')}catch(e){}
const save=()=>localStorage.setItem(LSK,JSON.stringify(done));
const arN=n=>(+n).toLocaleString('ar-EG');
const KIND_ORDER=['شرح متن','محاضرات','مقتطفات','مقابلات','أخرى'];
const KIND_LBL={'شرح متن':'شروح المتون','محاضرات':'محاضرات ودروس','مقتطفات':'مقتطفات وفوائد','مقابلات':'حوارات','أخرى':'أخرى'};
let openSh=new Set();
function groups(){
 const byS={};
 for(const s of SERIES){
  const sh=s.sheikh||'غير مصنف';
  (byS[sh]=byS[sh]||{})[s.kind||'أخرى']=(byS[sh][s.kind||'أخرى']||[]);byS[sh][s.kind||'أخرى'].push(s)}
 return byS}
function pct(sh){const all=SERIES.filter(s=>(s.sheikh||'غير مصنف')===sh);const dn=all.filter(s=>done[s.id]).length;return all.length?Math.round(dn/all.length*100):0}
function stats(){
 const dn=Object.keys(done).length;
 const vids=SERIES.filter(s=>done[s.id]).reduce((a,s)=>a+(s.videos||0),0);
 const hrs=SERIES.filter(s=>done[s.id]).reduce((a,s)=>a+(s.hours||0),0);
 $('#stats').innerHTML=`<div class="st"><b>${arN(dn)}</b>سلسلة منتهية</div><div class="st"><b>${arN(vids)}</b>مقطعاً</div><div class="st"><b>${arN(Math.round(hrs))}</b>ساعة</div><div class="st"><b>${arN(Math.round(dn/SERIES.length*100))}٪</b>من المنهج</div>`}
function tree(q){
 const byS=groups();q=q?normTxt(q):null;
 let html='';
 for(const sh of Object.keys(byS).sort((a,b)=>Object.values(byS[b]).flat().length-Object.values(byS[a]).flat().length)){
  const all=Object.values(byS[sh]).flat();
  const match=q?all.filter(s=>normTxt(s.name+' '+(s.comment||'')).includes(q)):all;
  if(!match.length)continue;
  const p=pct(sh);const open=openSh.has(sh)||q;
  html+=`<div class="sheikh"><div class="sh-h" onclick="tgl('${esc(sh)}')">
   <span class="nm">${esc(sh)}</span><span class="mt">${arN(all.length)} سلسلة · ${arN(all.reduce((a,s)=>a+(s.videos||0),0))} مقطعاً</span>
   <div style="text-align:center"><span class="pct">${arN(p)}٪</span><div class="bar" style="width:60px"><i style="width:${p}%"></i></div></div></div>
   <div class="sh-b ${open?'open':''}">`;
  for(const k of KIND_ORDER){
   const list=(byS[sh][k]||[]).filter(s=>!q||normTxt(s.name+' '+(s.comment||'')).includes(q));
   if(!list.length)continue;
   html+=`<div class="kind"><div class="kind-h">${KIND_LBL[k]||k} (${arN(list.length)})</div>`;
   list.sort((a,b)=>(b.videos||0)-(a.videos||0));
   for(const s of list){
    const d=!!done[s.id];
    html+=`<div class="ser ${d?'done':''}" data-sid="${s.id}">
     <div class="chk" onclick="mark(${s.id},event)">${d?'✓':''}</div>
     <div style="flex:1"><div class="nm">${esc(s.name)}</div><div class="mt">${arN(s.videos||0)} مقطع · ${(s.hours||0).toFixed(0)} ساعة${s.comment?' — '+esc(s.comment.slice(0,70))+'…':''}</div></div>
     <a class="btn sm ghost" target="_blank" href="../durus/index.html#s=${s.id}">افتح</a></div>`}
   html+='</div>'}
  html+='</div></div>'}
 $('#tree').innerHTML=html||'<div class="muted" style="text-align:center;padding:30px">لا سلسلة تطابق</div>'}
function normTxt(s){return(s||'').replace(/[ً-ْٰـٱ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
function tgl(sh){openSh.has(sh)?openSh.delete(sh):openSh.add(sh);tree($('#q').value)}
function mark(id,e){
 e.stopPropagation();
 if(done[id])delete done[id];else done[id]={at:Date.now()};
 save();stats();
 const el=document.querySelector(`.ser[data-sid="${id}"]`);
 if(el){el.classList.toggle('done',!!done[id]);el.querySelector('.chk').textContent=done[id]?'✓':''}}
$('#q').oninput=e=>tree(e.target.value);
stats();tree();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="kharita" data-title="خريطة المنهج"></script>
</body>
</html>
