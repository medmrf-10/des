<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِحيِّي — إحياء المتوقف</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.g{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-top:9px}
.g .nm{font-family:var(--font-ar);font-size:14px}
.g .st{font-size:11px;color:var(--acc2);margin-top:4px}
.g .rev{font-size:12px;color:var(--ok);margin-top:8px;line-height:1.8}
.g .meta{font-size:11px;color:var(--dim);margin-top:8px;display:flex;gap:9px;flex-wrap:wrap}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِحيِّي <span class="muted">— إحياء المتوقف</span></h2>
<div class="muted">مشاريع وأهداف توقفت — لكل واحد أصغر خطوة تُحييه الآن.</div>
<div class="card"><div class="t">أضف متوقفاً</div>
<input id="nm" placeholder="كتاب لم أكمله، مشروع معلّق، هدف نسيته…">
<button class="btn" id="add" style="margin-top:9px">أضف للإحياء</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let G=LS('mihiyi',[]);
const STEPS=['افتحه ٥ دقائق فقط — لا هدف سوى الفتح','اكتب جملة واحدة عن الخطوة التالية','ضعه في أهداف مِقصاد لليوم','اسأل نفسك: هل يستحق الإحياء أصلاً؟ إن لا — احذفه بسلام','خصص له ١٠ دقائق بعد صلاة الفجر','اكتب ما الذي أوقفه — حل المانع أولاً'];
$('#add').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 G.unshift({n,at:Date.now(),rev:STEPS[G.length%STEPS.length],alive:false});
 SV('mihiyi',G);$('#nm').value='';render();
};
// نصائح إضافية تتعلق بالمِقصاد
const mqs=LS('miqsad',{});
(function(){
 const days=Object.keys(mqs).filter(d=>d!=='date');
 const stalled=[];
 days.forEach(d=>(mqs[d].goals||[]).forEach(g=>{if(!g.done)stalled.push({n:g.t+' (من '+d+')',at:new Date(d).getTime(),rev:STEPS[stalled.length%STEPS.length],alive:false,auto:true})}));
 stalled.slice(0,5).forEach(s=>{if(!G.some(x=>x.n===s.n))G.unshift(s)});
 if(stalled.length)SV('mihiyi',G);
})();
function ago(t){const d=Math.floor((Date.now()-t)/86400000);return d===0?'اليوم':arN(d)+' يوم مضت'}
function render(){
 const dead=G.filter(g=>!g.alive);
 $('#stats').innerHTML='<span class="stat">متوقف: <b>'+arN(dead.length)+'</b></span>'+
 '<span class="stat">أُحيي: <b>'+arN(G.filter(g=>g.alive).length)+'</b></span>';
 $('#list').innerHTML=G.map((g,i)=>{
  if(g.alive)return '';
  return '<div class="g"><div class="nm">'+esc(g.n)+'</div>'+
  '<div class="st">متوقف منذ '+ago(g.at)+'</div>'+
  '<div class="rev">💡 '+esc(g.rev)+'</div>'+
  '<div class="meta"><button class="btn ghost" data-r="'+i+'" style="color:var(--ok)">أُحييته ✓</button>'+
  '<button class="btn ghost" data-n="'+i+'">خطوة أخرى</button>'+
  '<button class="btn ghost" data-d="'+i+'" style="color:var(--acc2)">أرحمه</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا متوقف — كل شيء حي.</div>';
}
$('#list').onclick=e=>{
 const r=e.target.closest('[data-r]');
 if(r){G[+r.dataset.r].alive=true;SV('mihiyi',G);render();return}
 const n=e.target.closest('[data-n]');
 if(n){const g=G[+n.dataset.n];g.rev=STEPS[(STEPS.indexOf(g.rev)+1)%STEPS.length];SV('mihiyi',G);render();return}
 const d=e.target.closest('[data-d]');
 if(d&&confirm('أرحمه — أحذفه نهائياً؟')){G.splice(+d.dataset.d,1);SV('mihiyi',G);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="mihiyi" data-title="مِحيِّي"></script>
</body>
</html>
