<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعرَف — اختبر نفسك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:640px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
textarea,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:110px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.quiz{background:var(--card);border:1px solid var(--acc);border-radius:13px;padding:16px;margin-top:12px;font-family:var(--font-ar);font-size:15px;line-height:2.3}
.blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--acc);color:var(--acc);padding:0 8px;cursor:pointer}
.blank.rev{color:var(--ok);border-bottom-style:solid}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعرَف <span class="muted">— اختبر نفسك</span></h2>
<div class="muted">الصق ملاحظاتك — نُخفي كلمات عشوائية، واضغط الفراغ لتكشف: اختبار فوري لحفظك.</div>
<div class="card"><div class="t">الصق نصاً</div>
<textarea id="src" placeholder="ملاحظات الدرس، تعريفات، ملخص كتاب…"></textarea>
<div style="display:flex;gap:8px;margin-top:8px;align-items:center">
<span class="muted">نسبة الإخفاء:</span>
<select id="pc" style="width:100px;margin-top:0;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:7px"><option value="0.15">١٥٪</option><option value="0.25" selected>٢٥٪</option><option value="0.4">٤٠٪</option></select>
<button class="btn" id="go">اختبر</button></div></div>
<div id="out"></div>
<div id="stats"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let stats=LS('mi3raf',{tests:0,rev:0});
$('#go').onclick=()=>{
 const t=$('#src').value.trim();if(!t)return;
 const pc=+$('#pc').value;
 const words=t.split(/\s+/);
 const hidden=[];
 const html=words.map((w,i)=>{
  const clean=w.replace(/[^\p{L}\p{N}]/gu,'');
  if(clean.length>2&&Math.random()<pc){hidden.push(i);return '<span class="blank" data-w="'+esc(w)+'">؟</span>'}
  return esc(w);
 }).join(' ');
 $('#out').innerHTML='<div class="quiz">'+html+'</div>'+
 '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">'+
 '<button class="btn ghost" id="all">اكشف الكل</button>'+
 '<button class="btn ghost" id="reset" style="color:var(--acc2)">إعادة</button></div>'+
 '<div class="muted" style="margin-top:8px">'+arN(hidden.length)+' كلمة مخفية — اضغطها للكشف</div>';
 stats.tests++;SV('mi3raf',stats);renderStats();
 $('#all').onclick=()=>{document.querySelectorAll('.blank').forEach(b=>{b.textContent=b.dataset.w;b.classList.add('rev')});stats.rev+=hidden.length;SV('mi3raf',stats);renderStats()};
 $('#reset').onclick=()=>{$('#out').innerHTML='';$('#src').value=''};
};
document.addEventListener('click',e=>{
 const b=e.target.closest('.blank');if(!b)return;
 b.textContent=b.dataset.w;b.classList.add('rev');
 stats.rev++;SV('mi3raf',stats);renderStats();
});
function renderStats(){
 $('#stats').innerHTML='<span class="stat">اختبارات: <b>'+arN(stats.tests)+'</b></span>'+
 '<span class="stat">كلمات مكشوفة: <b>'+arN(stats.rev)+'</b></span>';
}
renderStats();
</script>
<script src="../shared/feedback.js" data-pid="mi3raf" data-title="مِعرَف"></script>
</body>
</html>
