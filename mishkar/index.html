<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشكَر — دفتر الشكر</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px;margin-top:10px}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:8px;display:flex;gap:10px;align-items:flex-start}
.item .n{color:var(--acc);font-weight:700;font-size:12px;min-width:20px}
.item .x{font-family:var(--font-ar);font-size:13.5px;flex:1}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.day{margin-top:14px}
.day .dt{font-size:11px;color:var(--dim);margin-bottom:5px}
.done-all{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:13px 16px;margin-top:14px;text-align:center;font-family:var(--font-ar);color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشكَر <span class="muted">— دفتر الشكر</span></h2>
<div class="muted">ثلاث نِعم كل يوم — تدريب العين على الرؤية بعين الشكر.</div>
<div class="card"><div class="t">نعمة اليوم</div>
<input id="inp" placeholder="نعمة تشكر الله عليها…" maxlength="80">
<button class="btn" id="add">سجّلها</button></div>
<div id="today"></div>
<div id="stats" style="margin-top:12px"></div>
<div id="past"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toISOString().slice(0,10);
let D=LS('mishkar',{});
if(!D[today()])D[today()]=[];
$('#add').onclick=()=>{
 const v=$('#inp').value.trim();if(!v)return;
 D[today()].unshift({t:v,at:new Date().toISOString()});
 SV('mishkar',D);$('#inp').value='';render();
};
$('#inp').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};
function streak(){let s=0;const d=new Date();
 for(;;){const k=d.toISOString().slice(0,10);if(D[k]&&D[k].length>=3)s++;else if(k!==today())break;d.setDate(d.getDate()-1)}
 return s;
}
function render(){
 const t=D[today()];
 $('#today').innerHTML=t.length?'<div class="card"><div class="t">اليوم — '+arN(t.length)+' نعمة</div>'+
  t.map((x,i)=>'<div class="item"><span class="n">'+arN(i+1)+'</span><span class="x">'+esc(x.t)+'</span></div>').join('')+'</div>'
  :(t.length>=3?'<div class="done-all">✓ ثلاث نِعم اليوم</div>':'');
 const days=Object.keys(D).filter(k=>D[k].length).sort().reverse().slice(0,7);
 $('#past').innerHTML=days.filter(d=>d!==today()).map(d=>'<div class="day"><div class="dt">'+d+'</div>'+D[d].map(x=>'<div class="item"><span class="x">'+esc(x.t)+'</span></div>').join('')+'</div>').join('');
 $('#stats').innerHTML='<span class="stat">سلسلة الشكر: <b>'+arN(streak())+'</b> يوم</span>'+
 '<span class="stat">مجموع النِعم: <b>'+arN(Object.values(D).flat().length)+'</b></span>';
}
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mishkar" data-title="مِشكَر"></script>
</body>
</html>
