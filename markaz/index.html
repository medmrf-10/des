<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصلَح — مركز التعليقات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:680px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:11px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border)}
.btn.ok{background:var(--card);color:var(--ok);border:1px solid var(--ok)}
.btn.no{background:var(--card);color:var(--acc2);border:1px solid var(--acc2)}
.proj{margin-top:14px}
.proj .ph{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);display:flex;justify-content:space-between;align-items:center}
.proj .ph a{color:var(--acc);font-size:11px;text-decoration:none}
.fb{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:7px}
.fb .hd{display:flex;gap:8px;align-items:center;font-size:10.5px;color:var(--dim);flex-wrap:wrap}
.fb .who{color:var(--acc2)}
.fb .st{border-radius:99px;padding:1px 9px;font-size:9.5px}
.fb .st.pending{background:var(--card2);color:var(--dim)}
.fb .st.ok{background:rgba(70,201,109,.15);color:var(--ok)}
.fb .st.no{background:rgba(232,90,90,.12);color:var(--acc2)}
.fb .x{font-family:var(--font-ar);font-size:13px;line-height:1.9;margin-top:5px}
.fb .ops{display:flex;gap:6px;margin-top:8px}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{background:var(--card);border:1px solid var(--border);border-radius:99px;color:var(--dim);font-family:var(--font-ar);font-size:11.5px;padding:6px 16px;cursor:pointer}
.tab.on{color:var(--acc);border-color:var(--acc)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصلَح <span class="muted">— مركز التعليقات</span></h2>
<div class="muted">كل التعليقات والاقتراحات عن كل مشاريعك في مكان واحد — وافق، ارفض، أو انتقل للمشروع.</div>
<div id="stats"></div>
<div class="tabs" id="tabs">
 <button class="tab on" data-t="pending">بانتظارك</button>
 <button class="tab" data-t="comments">التعليقات</button>
 <button class="tab" data-t="all">الكل</button>
</div>
<div id="feed"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const CK='portal_comments',SK='portal_suggestions';
let tab='pending';
const NAMES={};
fetch('../portal/projects.json').then(r=>r.json()).then(ps=>{ps.forEach(p=>NAMES[p.id]=p.title);render()}).catch(()=>render());
function feed(){
 const cm=LS(CK,{}),sg=LS(SK,{});
 const rows=[];
 Object.keys(sg).forEach(pid=>(sg[pid]||[]).forEach((s,i)=>rows.push({pid,kind:'sg',i,...s})));
 Object.keys(cm).forEach(pid=>(cm[pid]||[]).forEach((c,i)=>rows.push({pid,kind:'cm',i,...c})));
 rows.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
 return {rows,cm,sg};
}
function render(){
 const {rows}=feed();
 const pending=rows.filter(r=>r.kind==='sg'&&r.st==='pending');
 const comments=rows.filter(r=>r.kind==='cm');
 $('#stats').innerHTML='<span class="stat">بانتظار موافقتك: <b>'+arN(pending.length)+'</b></span>'+
 '<span class="stat">تعليقات: <b>'+arN(comments.length)+'</b></span>';
 const shown=tab==='pending'?pending:tab==='comments'?comments:rows;
 const byProj={};
 shown.forEach(r=>{(byProj[r.pid]=byProj[r.pid]||[]).push(r)});
 $('#feed').innerHTML=Object.keys(byProj).sort().map(pid=>{
  const nm=NAMES[pid]||pid;
  return '<div class="proj"><div class="ph">'+esc(nm)+'<a href="../'+pid+'/" target="_blank">فتح ↗</a></div>'+
  byProj[pid].map(r=>{
   const st=r.kind==='cm'?'<span class="st pending">تعليق</span>':r.st==='ok'?'<span class="st ok">مقبول</span>':r.st==='no'?'<span class="st no">مرفوض</span>':'<span class="st pending">⏳ بانتظارك</span>';
   const ops=r.kind==='sg'&&r.st==='pending'
    ?'<div class="ops"><button class="btn ok" data-pid="'+pid+'" data-i="'+r.i+'" data-a="ok">✓ وافق</button><button class="btn no" data-pid="'+pid+'" data-i="'+r.i+'" data-a="no">✕ ارفض</button></div>':'';
   return '<div class="fb"><div class="hd"><span class="who">'+esc(r.n||'عضو')+'</span>'+st+'<span>'+(r.at||'').slice(0,10)+'</span></div><div class="x">'+esc(r.t)+'</div>'+ops+'</div>';
  }).join('')+'</div>';
 }).join('')||'<div class="muted" style="margin-top:14px">لا شيء هنا — '+(tab==='pending'?'لا اقتراحات بانتظارك.':'لا عناصر.')+'</div>';
}
$('#tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;tab=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));render()};
$('#feed').onclick=e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const sg=LS(SK,{});const item=(sg[b.dataset.pid]||[])[+b.dataset.i];
 if(!item)return;
 item.st=b.dataset.a==='ok'?'ok':'no';
 SV(SK,sg);render();
};
render();
</script>
<script src="../shared/feedback.js" data-pid="markaz" data-title="مِصلَح"></script>
</body>
</html>
