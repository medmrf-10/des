<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعيَد — المراجعة الأسبوعية</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.rev{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-top:9px}
.rev .wk{font-size:10.5px;color:var(--acc)}
.rev .sec{font-size:12px;margin-top:7px;line-height:1.8}
.rev .sec b{color:var(--txt)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.week{background:var(--card2);border:1px solid var(--acc);border-radius:12px;padding:13px 16px;margin-top:12px}
.week .t{font-size:11px;color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعيَد <span class="muted">— المراجعة الأسبوعية</span></h2>
<div class="muted">نهاية الأسبوع: ما نجح، ما فشل، وما التغيير الواحد للأسبوع القادم.</div>
<div class="week"><div class="t">هذا الأسبوع بالأرقام</div><div id="nums" style="margin-top:9px"></div></div>
<div class="card"><div class="t">مراجعة أسبوعك</div>
<textarea id="w1" placeholder="ما الذي نجح؟ (انتصاراتك مهما صغرت)"></textarea>
<textarea id="w2" placeholder="ما الذي فشل؟ (بلا تجميل)"></textarea>
<textarea id="w3" placeholder="التغيير الواحد للأسبوع القادم — لا تغييران"></textarea>
<button class="btn" id="add" style="margin-top:9px">أغلق الأسبوع</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let R=LS('mi3yad',[]);
// حسابات الأسبوع من مخازن المنظومة
const week=()=>{const out={goals:0,reviews:0,pray:0,mood:[]};
 const t=new Date();for(let i=0;i<7;i++){const d=new Date(t);d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);
 const g=LS('miqsad',{});(g[k]?g[k].goals:[]).forEach(x=>{if(x.done)out.goals++});
 const sp=LS('misbah_'+k,{});out.pray+=Object.keys(sp).length;
 const m=LS('mijdar',{});if(m[k])out.mood.push(m[k].v||0);
 }
 return out;
};
const wk=week();
$('#nums').innerHTML='<span class="stat">أهداف مكتملة: <b>'+arN(wk.goals)+'</b></span>'+
'<span class="stat">صلوات مسجلة: <b>'+arN(wk.pray)+'</b></span>'+
(wk.mood.length?'<span class="stat">متوسط التقييم: <b>'+arN((wk.mood.reduce((a,b)=>a+b,0)/wk.mood.length).toFixed(1))+'</b></span>':'');
$('#add').onclick=()=>{
 const w1=$('#w1').value.trim(),w2=$('#w2').value.trim(),w3=$('#w3').value.trim();
 if(!w1&&!w2&&!w3)return;
 const now=new Date(),sun=new Date(now);sun.setDate(now.getDate()-now.getDay());
 R.unshift({w:sun.toISOString().slice(0,10),w1,w2,w3,nums:{g:wk.goals,p:wk.pray}});
 SV('mi3yad',R);$('#w1').value='';$('#w2').value='';$('#w3').value='';render();
};
function render(){
 $('#stats').innerHTML='<span class="stat">أسابيع مغلقة: <b>'+arN(R.length)+'</b></span>';
 $('#list').innerHTML=R.slice(0,6).map(r=>'<div class="rev"><div class="wk">أسبوع '+r.w+' — '+arN(r.nums.g)+' هدفاً · '+arN(r.nums.p)+' صلاة</div>'+
 (r.w1?'<div class="sec"><b>✓ نجح:</b> '+esc(r.w1)+'</div>':'')+
 (r.w2?'<div class="sec"><b>✗ فشل:</b> '+esc(r.w2)+'</div>':'')+
 (r.w3?'<div class="sec"><b>→ القادم:</b> '+esc(r.w3)+'</div>':'')+'</div>').join('')||'<div class="muted" style="margin-top:12px">لا مراجعات — أغلق أول أسبوع.</div>';
}
render();
</script>
<script src="../shared/feedback.js" data-pid="mi3yad" data-title="مِعيَد"></script>
</body>
</html>
