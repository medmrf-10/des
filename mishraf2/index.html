<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِشرَف — دفتر النفقات</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.it{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:8px;display:flex;gap:10px;align-items:center}
.it .s{font-family:var(--font-ar);font-size:13px;flex:1}
.it .v{font-family:var(--font-ui);font-size:13px;color:var(--acc2);font-weight:700}
.it .dt{font-size:10px;color:var(--dim)}
.srcrow{display:flex;gap:9px;align-items:center;margin-top:7px;font-size:12px}
.srcrow .nm{min-width:110px;font-family:var(--font-ar)}
.srcrow .bar{flex:1;height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.srcrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),#a05a5a)}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِشرَف <span class="muted">— دفتر النفقات</span></h2>
<div class="muted">أين يذهب مالك؟ سجّل كل خرج — المرء ينفق على ما يعتقده لا ما يحتاجه.</div>
<div class="card"><div class="t">خرج</div>
<input id="s" placeholder="على ماذا؟ (أكل، مواصلات، كتاب…)">
<div style="display:flex;gap:8px">
<select id="c"><option value="طعام">طعام</option><option value="مواصلات">مواصلات</option><option value="علم">علم</option><option value="بيت">بيت</option><option value="ترفيه">ترفيه</option><option value="صحة">صحة</option><option value="صدقة">صدقة</option><option value="أخرى">أخرى</option></select>
<input id="v" type="number" placeholder="المبلغ"></div>
<button class="btn" id="ad" style="margin-top:9px">سجّل</button></div>
<div class="card"><div class="t">هذا الشهر بالقسم</div><div id="srcs"></div></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let E=LS('mishraf2',[]);
$('#ad').onclick=()=>{
 const s=$('#s').value.trim(),v=+$('#v').value;if(!s||!v)return;
 E.unshift({s,v,c:$('#c').value,at:Date.now()});SV('mishraf2',E);$('#s').value=$('#v').value='';render();
};
const month=()=>new Date().toISOString().slice(0,7);
function render(){
 const mo=E.filter(x=>new Date(x.at).toISOString().slice(0,7)===month());
 const tot=mo.reduce((s,x)=>s+x.v,0);
 const byCat={};mo.forEach(x=>byCat[x.c]=(byCat[x.c]||0)+x.v);
 const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
 const mx=cats.length?cats[0][1]:1;
 $('#srcs').innerHTML=cats.map(([c,v])=>'<div class="srcrow"><span class="nm">'+esc(c)+'</span>'+
 '<div class="bar"><i style="width:'+(v/mx*100)+'%"></i></div><b style="font-size:11px;color:var(--acc2)">'+arN(v)+'</b></div>').join('')||
 '<div class="muted">لا نفقات هذا الشهر.</div>';
 const inc=(window.__inc)||0;
 $('#stats').innerHTML='<span class="stat">الشهر: <b style="color:var(--acc2)">'+arN(tot)+'</b></span>'+
 '<span class="stat">أقسام: <b>'+arN(cats.length)+'</b></span>'+
 '<span class="stat">عمليات: <b>'+arN(mo.length)+'</b></span>';
 $('#list').innerHTML=E.slice(0,15).map((x,i)=>{
  const gi=E.indexOf(x);
  return '<div class="it"><span class="s">'+esc(x.s)+' <span style="font-size:10px;color:var(--dim)">('+esc(x.c)+')</span></span>'+
  '<span class="v">−'+arN(x.v)+'</span>'+
  '<span class="dt">'+new Date(x.at).toLocaleDateString('ar-EG')+'</span>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);padding:4px 8px">✕</button></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا نفقات مسجلة.</div>';
}
$('#list').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d&&confirm('احذف؟')){E.splice(+d.dataset.d,1);SV('mishraf2',E);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mishraf2" data-title="مِشرَف"></script>
</body>
</html>
