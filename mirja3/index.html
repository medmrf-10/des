<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِرجَع — أسئلة تعود إليها</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.q{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-top:7px}
.q .x{font-family:var(--font-ar);font-size:13px}
.q .ans{font-size:12px;color:var(--ok);margin-top:5px;border-top:1px dashed var(--border);padding-top:5px}
.q .meta{font-size:10px;color:var(--dim);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِرجَع <span class="muted">— أسئلة تعود إليها</span></h2>
<div class="muted">سؤال خطر ولا وقت للبحث؟ علّقه هنا — فضولك محفوظ، والجواب يأتي لاحقاً. ارجع إليها واكتب ما وجدت.</div>
<div class="card"><div class="t">سؤال يشغلك</div>
<input id="nm" placeholder="(لماذا تختلف قراءات القرآن؟ كيف تعمل سلسلة الكتل؟)">
<button class="btn" id="ad" style="margin-top:9px">علّقه</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let Q=LS('mirja3',[]);
$('#ad').onclick=()=>{
 const n=$('#nm').value.trim();if(!n)return;
 Q.unshift({n,a:null,at:Date.now()});
 SV('mirja3',Q);$('#nm').value='';render();
};
function render(){
 const op=Q.filter(x=>!x.a).length;
 $('#stats').innerHTML='<span class="stat">أسئلة معلقة: <b style="color:var(--acc2)">'+arN(op)+'</b></span>'+
 '<span class="stat">مُجابة: <b style="color:var(--ok)">'+arN(Q.length-op)+'</b></span>';
 $('#list').innerHTML=Q.map((x,i)=>{
  const gi=Q.indexOf(x);
  return '<div class="q"><div class="x">'+esc(x.n)+'</div>'+
  (x.a?'<div class="ans">'+esc(x.a)+'</div>':'')+
  '<div class="meta">'+(x.a?'':'معلّق منذ '+Math.floor((Date.now()-x.at)/864e5)+' يوماً')+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:6px">'+
  (x.a?'':'<button class="btn ghost" data-a="'+gi+'" style="color:var(--ok);font-size:10px">وجدت الجواب</button>')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أسئلة — ما الذي تتساءل عنه؟</div>';
}
$('#list').onclick=e=>{
 const a=e.target.closest('[data-a]'),d=e.target.closest('[data-d]');
 if(a){const r=prompt('الجواب:');if(r){Q[+a.dataset.a].a=r;SV('mirja3',Q);render()}return}
 if(d&&confirm('احذف؟')){Q.splice(+d.dataset.d,1);SV('mirja3',Q);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mirja3" data-title="مِرجَع"></script>
</body>
</html>
