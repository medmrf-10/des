<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>فَجر — افتتاح يومك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:720px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:26px 10px 18px}
.hero .dd{font-family:var(--font-ar);font-size:44px;color:var(--acc);font-weight:700;line-height:1.2}
.hero .dt{color:var(--dim);font-size:13px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--txt);display:block;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card .ic{font-size:20px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;margin-top:5px}
.card .v{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.7}
.card .v b{color:var(--acc)}
.ayah{background:linear-gradient(135deg,#1a2238,#141b2e);border:1px solid var(--acc);border-radius:16px;padding:18px 22px;margin-top:14px;text-align:center}
.ayah .t{font-family:var(--font-ar);font-size:19px;line-height:2.5}
.ayah .loc{color:var(--acc);font-size:11px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 15px;font-size:12px}
.pill b{color:var(--acc)}
.muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="hero">
<div class="dd" id="dd"></div>
<div class="dt" id="dt"></div>
<div class="muted" style="margin-top:6px">فَجر يومك — كل ما تبدأ به في صفحة واحدة</div>
</div>
<div class="ayah" id="ay"><div class="muted">يُحمّل آية اليوم…</div></div>
<div class="grid" id="grid"></div>
<div class="row" id="row"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const today=()=>new Date().toISOString().slice(0,10);
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const now=new Date();
const arN=n=>(+n).toLocaleString('ar-EG');
$('#dd').textContent=DAYS[now.getDay()];
$('#dt').textContent=now.toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
// آية اليوم — بذرة اليوم
function seed(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
async function laz(u){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
(async()=>{
 try{
  await laz('../wahy/mutashabih.js');
  const M=window.MUTA;
  const keys=Object.keys(M.sim);
  const k=keys[seed(today())%keys.length];
  const e=M.sim[k];const[s,a]=k.split(':').map(Number);
  $('#ay').innerHTML='<div class="t">'+esc(e[2])+'</div><div class="loc">'+esc(M.names[s])+' '+a+' — <a href="../mishhad/#'+s+':'+a+'" style="color:var(--acc);text-decoration:none">تفسيرها ←</a></div>';
 }catch(e){$('#ay').innerHTML='<div class="muted">﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾</div>'}
})();
// بطاقات اليوم
const mithaq=LS('mithaq')||[];
const mitla=LS('mitla3')||{days:{}};
const cvk=(LS('mithaq')||[]).length;
const started=(LS('mi3skar')||{start:today()}).start;
const di=Math.min(29,Math.max(0,Math.floor((now-new Date(started))/86400000)));
const cards=[
 {ic:'🌄',t:'مِطلع',v:'حديثك اليومي',u:'../mitla3/',badge:mitla.days[today()]&&mitla.days[today()].done?'<b>✓ تم</b>':'يُنتظر'},
 {ic:'⛺',t:'مِعسكر',v:'يوم '+(di+1)+' من ٣٠',u:'../mi3skar/'},
 {ic:'🤝',t:'مِيثاق',v:cvk?cvk+' التزامات':'لا التزامات',u:'../mithaq/'},
 {ic:'✍',t:'مِستملي',v:'إملاء آيات',u:'../mustamli/'},
 {ic:'⛲',t:'مِنهال',v:'جلسة نبع',u:'../minhal/'},
 {ic:'🌾',t:'مِحراث',v:'أعمال معلّقة',u:'../mihrath/'},
];
$('#grid').innerHTML=cards.map(c=>'<a class="card" href="'+c.u+'"><span class="ic">'+c.ic+'</span><div class="t">'+c.t+'</div><div class="v">'+(c.badge||'')+' '+c.v+'</div></a>').join('');
// شارات إنجاز
const mj=(LS('mijtaz_badges')||[]).length||0;
const mb=LS('misbah_'+today())||null;
const midad=(LS('midad')||{})[today()]||[];
$('#row').innerHTML=
 '<span class="pill">نشاط اليوم: <b>'+arN(midad.length)+'</b> حركة</span>'+
 '<span class="pill">الأوسمة: <b>'+arN(mj)+'</b></span>'+
 '<span class="pill"><a href="../manzuma/" style="color:var(--acc);text-decoration:none">كل المنظومة ←</a></span>';
</script>
<script src="../shared/feedback.js" data-pid="fajr" data-title="فَجر"></script>
</body>
</html>
