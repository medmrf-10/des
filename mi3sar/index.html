<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِعصَر — جيوب الوقت</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.pk{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.pk .n{font-family:var(--font-ar);font-size:13.5px;color:var(--acc)}
.pk .task{font-size:12px;color:var(--txt);margin-top:5px}
.pk .meta{font-size:10px;color:var(--dim);margin-top:4px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِعصَر <span class="muted">— جيوب الوقت</span></h2>
<div class="muted">الوقت الميت ذهب مهدور: المواصلات، الانتظار، الطابور. عيّن لكل جيبٍ مهمة دقيقة مسبقاً — حين تدخله لا تفكر، نفّذ.</div>
<div class="card"><div class="t">جيب جديد</div>
<select id="pk"><option value="مواصلات">مواصلات</option><option value="انتظار">انتظار</option><option value="طابور">طابور</option><option value="قبل النوم">قبل النوم</option><option value="قبل الفجر">قبل الفجر</option><option value="مشي">مشي</option><option value="طبخ">طبخ</option><option value="أخرى">أخرى</option></select>
<input id="tk" placeholder="المهمة الدقيقة (استمع لدرس، راجع بطاقات، أذكار…)">
<button class="btn" id="ad" style="margin-top:9px">عيّن</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('mi3sar',[]),U=LS('mi3sar_used',{});
const today=()=>new Date().toISOString().slice(0,10);
$('#ad').onclick=()=>{
 const t=$('#tk').value.trim();if(!t)return;
 P.unshift({pk:$('#pk').value,t,at:Date.now()});SV('mi3sar',P);$('#tk').value='';render();
};
function render(){
 const t=today(),u=U[t]||[];
 const used=P.filter((x,i)=>u.includes(P.indexOf(x))).length;
 $('#stats').innerHTML='<span class="stat">جيوب مجهزة: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">استخدمت اليوم: <b style="color:var(--ok)">'+arN(used)+'</b></span>'+
 '<span class="stat">إجمالي الاستخدام: <b>'+arN(Object.values(U).flat().length)+'</b></span>';
 $('#list').innerHTML=P.map((x,i)=>{
  const gi=P.indexOf(x),done=u.includes(gi);
  return '<div class="pk"><div class="n">⏱ '+esc(x.pk)+(done?' <span style="color:var(--ok);font-size:10px">✓ اليوم</span>':'')+'</div>'+
  '<div class="task">'+esc(x.t)+'</div>'+
  '<div style="display:flex;gap:6px;margin-top:8px">'+
  (done?'':'<button class="btn ghost" data-u="'+gi+'" style="color:var(--ok);font-size:10px">✓ استخدمته</button>')+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا جيوب — جهّز وقتك الميت.</div>';
}
$('#list').onclick=e=>{
 const u=e.target.closest('[data-u]'),d=e.target.closest('[data-d]');
 if(u){const t=today();U[t]=U[t]||[];U[t].push(+u.dataset.u);SV('mi3sar_used',U);render();return}
 if(d&&confirm('احذف؟')){P.splice(+d.dataset.d,1);SV('mi3sar',P);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mi3sar" data-title="مِعصَر"></script>
</body>
</html>
