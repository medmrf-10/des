<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مقرأة — تثبيت الحفظ</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:760px;margin:0 auto;padding:14px}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
.pick label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
select,input{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:14px}
.verse{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:18px;margin:12px 0;text-align:center}
.verse .v{font-family:var(--font-ar);font-size:19px;line-height:2.2}
.verse .mask{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .2s}
.verse .mask:hover{filter:blur(5px)}
.firsts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.fw{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:var(--font-ar);font-size:15px;color:var(--acc2)}
.grades{display:flex;gap:8px;margin-top:14px}
.gbtn{flex:1;border:none;border-radius:10px;padding:11px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700}
.gbtn.hard{background:#3a1d1d;color:#e08a8a}
.gbtn.good{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.gbtn.easy{background:#14291c;color:var(--ok)}
.warn{background:rgba(201,162,75,.08);border:1px solid var(--acc);border-radius:10px;padding:10px;margin-top:10px;font-size:12px;color:var(--acc2)}
.prog{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--dim);font-size:12px}
.track{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.muted{color:var(--dim);font-size:12px}
a{color:var(--acc2)}
</style>
</head>
<body>
<h1 style="font-size:19px;margin:4px 0;background:linear-gradient(120deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent">مقرأة</h1>
<div class="muted">تثبيت الحفظ بالسياق: يُعرض المقطع مشوَّشاً بحروفه الأولى ← تتلوه ← تكشفه ← تقيّم نفسك (FSRS)</div>
<div class="pick">
 <div><label>السورة</label><select id="sur"></select></div>
 <div><label>من آية</label><input type="number" id="af" value="1" min="1" style="width:70px"></div>
 <div><label>إلى</label><input type="number" id="at" value="7" min="1" style="width:70px"></div>
 <button class="btn" onclick="start()">ابدأ الحلقة</button>
 <span class="muted" id="due"></span>
</div>
<div class="prog"><span id="step"></span><div class="track"><i id="bar"></i></div></div>
<div id="stage"></div>
<script src="../shared/fsrs.js"></script>

<script src="../wahy/mutashabih.js"></script>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LSK='miq_cards';
let IDX=null,S=null,queue=[],qi=0,cards={};
try{cards=JSON.parse(localStorage.getItem(LSK)||'{}')}catch(e){cards={}}
const save=()=>localStorage.setItem(LSK,JSON.stringify(cards));
async function jget(u){const r=await fetch(u);return r.json()}
async function boot(){
 IDX=await jget('../wahy/data/index.json');
 $('#sur').innerHTML=IDX.map((s,i)=>`<option value="${i+1}" ${i===0?'selected':''}>${i+1}. ${s.ar} (${s.ayahs.toLocaleString('ar-EG')})</option>`).join('');
 const duen=Object.entries(cards).filter(([k,c])=>c.repetitions===0||(c.lastReview&&(Date.now()-new Date(c.lastReview).getTime())>=c.interval*864e5)).length;
 $('#due').textContent=duen?`${duen.toLocaleString('ar-EG')} آية مستحقة في دفترك`:'';
 const h=location.hash.match(/s=(\d+)/);if(h)$('#sur').value=h[1];
}
async function start(){
 const sn=+$('#sur').value;
 S=await jget(`../wahy/data/surah/${sn}.json`);
 const af=Math.max(1,+$('#af').value),at=Math.min(S.verses.length,+$('#at').value||S.verses.length);
 queue=S.verses.filter(v=>v.a>=af&&v.a<=at).map(v=>({sn,a:v.a,t:v.t}));
 qi=0;showVerse()}
function firstLetters(t){
 return t.split(/\s+/).filter(Boolean).map(w=>`<span class="fw">${esc(w[0])}${w.length>1&&/[\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06ED]/.test(w[1])?esc(w[1]):''}</span>`).join('')}
function simsOf(sn,a){
 if(!window.MUTA)return[];
 return (MUTA.sim[sn+':'+a]||[])[3]||[]}
function showVerse(){
 const dueNote=queue.length===0;
 if(qi>=queue.length){
  const done=queue.length;
  $('#stage').innerHTML=`<div class="verse"><div class="v" style="color:var(--ok)">أتممت الحلقة — ${done.toLocaleString('ar-EG')} آية</div><div class="muted" style="margin-top:10px">المستحق الآن في دفترك يظهر أعلى الصفحة عند رجوعك</div></div>`;
  $('#step').textContent='اكتمل';$('#bar').style.width='100%';
  boot();return}
 const v=queue[qi];
 const key=v.sn+':'+v.a;
 $('#step').textContent=`آية ${(qi+1).toLocaleString('ar-EG')} / ${queue.length.toLocaleString('ar-EG')} — ${S.ar} ${v.a.toLocaleString('ar-EG')}`;
 $('#bar').style.width=(qi/queue.length*100)+'%';
 const sims=simsOf(v.sn,v.a);
 $('#stage').innerHTML=`<div class="verse">
  <div class="firsts">${firstLetters(v.t)}</div>
  <div class="v"><span class="mask" id="vm" title="اضغط للكشف">${esc(v.t)} ﴿${v.a.toLocaleString('ar-EG')}﴾</span></div>
  ${sims.length?`<div class="warn">انتبه للمتشابهات: ${sims.slice(0,3).map(([k2])=>{const s2=MUTA.sim[k2];return `<a href="#" onclick="return false" title="${esc(s2[2].slice(0,60))}…">${MUTA.names[s2[0]]||''} ${k2}</a>`}).join(' · ')}</div>`:''}
  <div class="grades" id="gr" style="display:none">
   <button class="gbtn hard" onclick="grade(2)">تعثرت — أعدها</button>
   <button class="gbtn good" onclick="grade(4)">قرأتها — حسناً</button>
   <button class="gbtn easy" onclick="grade(5)">تلوها — ممتاز</button>
  </div>
  <div class="muted" style="margin-top:10px">اضغط النص المشوَّش للكشف والتقييم · <a href="../wahy/#s=${v.sn}&v=${v.a}" target="_blank">التفسير ↗</a></div>
 </div>`;
 $('#vm').onclick=()=>{$('#vm').classList.remove('mask');$('#gr').style.display='flex'}}
function grade(q){
 const v=queue[qi];const key='q'+v.sn+'_'+v.a;
 if(!cards[key])cards[key]={repetitions:0,ease:2.5,interval:0,lastReview:null};
 cards[key].quality=q;
 const r=FSRS.schedule(cards[key]);
 Object.assign(cards[key],{repetitions:r.repetitions,ease:r.newEase,interval:r.newInterval,lastReview:new Date().toISOString()});
 delete cards[key].quality;save();
 if(q<3){queue.push(v)} // تعثر ← يعود في نهاية الحلقة
 qi++;showVerse()}
boot().catch(e=>{$('#stage').innerHTML='<div class="muted">تعذّر تحميل البيانات — افتح عبر الموقع المنشور</div>'})
</script>
<script src="../shared/feedback.js" data-pid="miqraa" data-title="مقرأة — تثبيت الحفظ"></script>
</body>
</html>
