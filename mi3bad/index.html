<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مِعبَد — وردك اليومي</title>
<link rel="stylesheet" href="../shared/theme.css"><style>
body{max-width:560px;margin:0 auto;padding:22px 14px 60px}
h1{color:var(--acc);font-size:1.3rem;text-align:center}
.sub{color:var(--dim);font-size:.8rem;text-align:center;margin-bottom:14px}
.score{text-align:center;margin-bottom:16px}
.score .n{font-size:2.4rem;color:var(--acc);font-weight:700}
.score .l{font-size:.68rem;color:var(--dim)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:.15s}
.item:hover{border-color:var(--acc)}
.item.done{border-color:var(--ok);background:rgba(70,201,109,.06)}
.item .ck{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent}
.item.done .ck{background:var(--ok);border-color:var(--ok);color:#0b0f1a;font-size:.8rem}
.item .tx{flex:1}
.item .t{font-size:.86rem;font-weight:700}
.item .d{font-size:.64rem;color:var(--dim)}
.item .ic{font-size:1.2rem}
.hist{margin-top:16px}
.hist .hb{display:flex;gap:4px;justify-content:center}
.hist .hb i{width:22px;height:22px;border-radius:5px;background:var(--card2);font-size:.5rem;color:var(--dim);display:flex;align-items:center;justify-content:center}
.manage{background:none;border:1px dashed var(--border);border-radius:10px;color:var(--dim);font-family:inherit;font-size:.7rem;padding:8px 14px;cursor:pointer;display:block;margin:8px auto 0}
.addrow{display:none;gap:6px;margin-top:8px}
.addrow.open{display:flex}
.addrow input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:inherit;padding:8px;font-size:.78rem}
.addrow button{background:var(--acc);border:none;border-radius:8px;color:#0b0f1a;font-family:inherit;font-weight:700;padding:8px 14px;cursor:pointer}
</style></head><body>
<h1>مِعبَد</h1><div class="sub">وردك اليومي — عباداتك الصغيرة الثابتة</div>
<div class="score"><div class="n" id="sn">0%</div><div class="l">ورد اليوم</div></div>
<div id="list"></div>
<button class="manage" id="mg">+ أضف عبادة جديدة</button>
<div class="addrow" id="ar"><input id="ni" placeholder="اسم العبادة…"><button id="ab">+</button></div>
<div class="hist"><div class="hb" id="hb"></div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const K='mi3bad_v1';const D=()=>JSON.parse(localStorage.getItem(K)||'{}');const S=o=>localStorage.setItem(K,JSON.stringify(o));
const DEF=[['صلاة الفجر في وقتها','🌅','فجرك يصنع يومك'],['ورد القرآن','📖','صفحة أو حزبك'],['أذكار الصباح','☀️','حصن اليوم'],['أذكار المساء','🌙','حصن الليل'],['صلاة الضحى','🕌','سنّة المحبين'],['صدقة اليوم','🤲','و لو بشق تمرة'],['صلة رحم','📞','اتصال أو زيارة'],['تسبيح ١٠٠','📿','خفيفة ثقيلة']];
const today=new Date().toISOString().slice(0,10);
function items(){const d=D();return d.items||DEF.map(x=>({n:x[0],i:x[1],d:x[2]}))}
function render(){
 const d=D();const td=d[today]||{};const its=items();
 const done=its.filter((_,i)=>td[i]).length;
 $('sn').textContent=Math.round(done/its.length*100)+'%';
 $('list').innerHTML=its.map((x,i)=>`<div class="item ${td[i]?'done':''}" data-i="${i}"><span class="ck">✓</span><span class="ic">${x.i}</span><div class="tx"><div class="t">${x.n}</div><div class="d">${x.d||''}</div></div></div>`).join('');
 const days=[];for(let i=13;i>=0;i--){const t=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push(t)}
 $('hb').innerHTML=days.map(t=>{const dd=d[t]||{};const c=its.filter((_,i)=>dd[i]).length;const p=c/its.length;return `<i style="background:${p>=0.99?'var(--ok)':p>=0.5?'var(--acc)':p>0?'#8a6a2f':'var(--card2)'}" title="${t}: ${c}/${its.length}">${t.slice(8)}</i>`}).join('');
}
document.addEventListener('click',e=>{
 const it=e.target.closest('.item');if(it){const d=D();d[today]=d[today]||{};const i=+it.dataset.i;d[today][i]=!d[today][i];S(d);render();return}
 if(e.target.id==='mg'){$('ar').classList.toggle('open');return}
 if(e.target.id==='ab'){const v=$('ni').value.trim();if(v){const d=D();d.items=d.items||items();d.items.push({n:v,i:'⭐',d:''});S(d);$('ni').value='';render()}}
});
render();
</script></body></html>
