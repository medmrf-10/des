<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِقصَب — دستورك الشخصي</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:56px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.pr{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-top:8px;border-right:3px solid var(--acc)}
.pr .txt{font-family:var(--font-ar);font-size:14px;line-height:1.9}
.pr .why{font-size:11.5px;color:var(--dim);margin-top:6px;font-style:italic}
.pr .meta{font-size:10px;color:var(--dim);margin-top:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pr .viol{color:var(--acc2);font-size:10.5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِقصَب <span class="muted">— دستورك الشخصي</span></h2>
<div class="muted">مبادئك الثابتة + لماذا — تُراجع دورياً وتُسجَّل خروقاتها.</div>
<div class="card"><div class="t">مبدأ جديد</div>
<input id="p" placeholder="المبدأ (لا أتكلم بغيبة، لا أؤجل المهم…)">
<textarea id="w" placeholder="لماذا هذا المبدأ؟ (تجربة، آية، درس…)"></textarea>
<button class="btn" id="ad" style="margin-top:9px">أضِف لدستورك</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let P=LS('miqsab',[]);
$('#ad').onclick=()=>{
 const p=$('#p').value.trim();if(!p)return;
 P.unshift({p,w:$('#w').value.trim(),at:Date.now(),viol:0,rev:Date.now()});
 SV('miqsab',P);$('#p').value=$('#w').value='';render();
};
function render(){
 const tot=P.reduce((s,x)=>s+x.viol,0);
 $('#stats').innerHTML='<span class="stat">مبادئ: <b>'+arN(P.length)+'</b></span>'+
 '<span class="stat">خروقات: <b style="color:var(--acc2)">'+arN(tot)+'</b></span>'+
 '<span class="stat">نظيف: <b>'+arN(P.filter(x=>!x.viol).length)+'</b></span>';
 $('#list').innerHTML=P.map((x,i)=>{
  const gi=P.indexOf(x),days=Math.round((Date.now()-x.rev)/864e5);
  return '<div class="pr"><div class="txt">'+esc(x.p)+'</div>'+
  (x.w?'<div class="why">— '+esc(x.w)+'</div>':'')+
  '<div class="meta"><span>منذ '+arN(days)+' يوم</span>'+
  (x.viol?'<span class="viol">⚠ '+arN(x.viol)+' خروقات</span>':'<span style="color:var(--ok);font-size:10.5px">نظيف</span>')+
  '</div><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
  '<button class="btn ghost" data-v="'+gi+'" style="color:var(--acc2);font-size:10px">خرقته اليوم</button>'+
  '<button class="btn ghost" data-r="'+gi+'" style="font-size:10px">راجعته</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--acc2);font-size:10px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا مبادئ — اكتب أول بند في دستورك.</div>';
}
$('#list').onclick=e=>{
 const v=e.target.closest('[data-v]'),r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
 if(v){P[+v.dataset.v].viol++;SV('miqsab',P);render();return}
 if(r){P[+r.dataset.r].rev=Date.now();SV('miqsab',P);render();return}
 if(d&&confirm('احذف المبدأ من الدستور؟')){P.splice(+d.dataset.d,1);SV('miqsab',P);render()}
};
render();
</script>
<script src="../shared/feedback.js" data-pid="miqsab" data-title="مِقصَب"></script>
</body>
</html>
