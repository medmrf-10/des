<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِخدَع — كشّاف الخداع</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:560px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
input,textarea{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:10px 14px;font-family:var(--font-ar);font-size:13px;width:100%;margin-top:8px}
textarea{min-height:46px;resize:vertical}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12.5px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--border);font-size:11px;padding:5px 11px}
.lz{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px}
.lz .lie{font-family:var(--font-ar);font-size:13.5px;color:var(--acc2)}
.lz .tru{font-size:12.5px;color:var(--ok);margin-top:6px}
.lz .meta{font-size:10px;color:var(--dim);margin-top:5px}
.lz .cnt{font-size:10px;color:var(--acc);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.common{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:6px 12px;margin:3px;cursor:pointer;font-size:11px}
.common:hover{border-color:var(--acc)}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِخدَع <span class="muted">— كشّاف الخداع</span></h2>
<div class="muted">أخطر الكذب ما تقوله لنفسك: «سأبدأ الاثنين»، «ليست كبيرة»، «أستحقها». اكشفها وسجّل الحقيقة.</div>
<div class="card"><div class="t">أكاذيب شائعة — اضغط لتسجّلها</div>
<span class="common" data-l="سأبدأ الاثنين">سأبدأ الاثنين</span>
<span class="common" data-l="ليست كبيرة">ليست كبيرة</span>
<span class="common" data-l="أستحقها">أستحقها</span>
<span class="common" data-l="لا أحد يراني">لا أحد يراني</span>
<span class="common" data-l="آخر مرة">آخر مرة</span>
<span class="common" data-l="غداً أفضل">غداً أفضل</span>
<span class="common" data-l="لا وقت عندي">لا وقت عندي</span></div>
<div class="card"><div class="t">كذبة سمعتها من نفسك</div>
<input id="l" placeholder="الكذبة">
<textarea id="t" placeholder="الحقيقة المواجِهة"></textarea>
<button class="btn" id="ad" style="margin-top:9px">سجّلها</button></div>
<div id="stats"></div>
<div id="list"></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let L=LS('mikhda3',[]);
document.querySelectorAll('.common').forEach(c=>c.onclick=()=>{
 $('#l').value=c.dataset.l;$('#t').focus();
});
$('#ad').onclick=()=>{
 const l=$('#l').value.trim();if(!l)return;
 const ex=L.find(x=>x.l===l);
 if(ex)ex.cnt=(ex.cnt||1)+1;
 else L.unshift({l,t:$('#t').value.trim(),cnt:1,at:Date.now()});
 SV('mikhda3',L);$('#l').value=$('#t').value='';render();
};
function render(){
 const tot=L.reduce((s,x)=>s+(x.cnt||1),0);
 const worst=L.slice().sort((a,b)=>(b.cnt||1)-(a.cnt||1))[0];
 $('#stats').innerHTML='<span class="stat">أكاذيب مكشوفة: <b>'+arN(L.length)+'</b></span>'+
 '<span class="stat">تكرار إجمالي: <b>'+arN(tot)+'</b></span>'+
 (worst?'<span class="stat">أكذبها عليك: <b style="color:var(--acc2)">'+esc(worst.l.slice(0,20))+'</b></span>':'');
 $('#list').innerHTML=L.slice(0,12).map((x,i)=>{
  const gi=L.indexOf(x);
  return '<div class="lz"><div class="lie">«'+esc(x.l)+'»</div>'+
  (x.t?'<div class="tru">الحقيقة: '+esc(x.t)+'</div>':'')+
  '<div class="cnt">كذبتها عليك '+arN(x.cnt||1)+'×</div>'+
  '<div style="display:flex;gap:6px;margin-top:6px">'+
  '<button class="btn ghost" data-r="'+gi+'" style="color:var(--acc2);font-size:10px">كذبتها ثانية</button>'+
  '<button class="btn ghost" data-d="'+gi+'" style="color:var(--dim);font-size:10px;padding:4px 8px">✕</button></div></div>';
 }).join('')||'<div class="muted" style="margin-top:12px">لا أكاذيب مكشوفة — أصادق نفسك.</div>';
}
$('#list').onclick=e=>{
 const r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
 if(r){L[+r.dataset.r].cnt=(L[+r.dataset.r].cnt||1)+1;SV('mikhda3',L);render();return}
 if(d&&confirm('احذف؟')){L.splice(+d.dataset.d,1);SV('mikhda3',L);render()}
};
render();
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mikhda3" data-title="مِخدَع"></script>
</body>
</html>
