<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>مِصلَح — أصلِح يومك</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{max-width:680px;margin:0 auto;padding:14px}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:12px}
.card .t{font-family:var(--font-ar);font-weight:700;font-size:13.5px;color:var(--acc);margin-bottom:8px}
.muted{color:var(--dim);font-size:12px}
.btn{background:var(--acc);color:#14140f;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:var(--font-ar);font-size:12px}
.rx{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px 16px;margin-top:9px}
.rx .act{font-family:var(--font-ar);font-size:15px}
.rx .why{font-size:11.5px;color:var(--dim);margin-top:5px}
.stat{display:inline-block;background:var(--card);border-radius:9px;padding:6px 13px;margin:3px;font-size:12px}
.stat b{color:var(--acc)}
.vrd{font-family:var(--font-ar);font-size:17px;margin-top:10px}
</style>
</head>
<body>
<h2 style="font-family:var(--font-ar);margin:6px 0">مِصلَح <span class="muted">— أصلِح يومك</span></h2>
<div class="muted">يقرأ يومك الآن ويصف لك دواءً واحدًا: أنجِزه فينجبر يومك.</div>
<div class="card"><div class="t">تشخيص يومك</div><div id="diag" class="muted">—</div><div class="vrd" id="vrd"></div></div>
<div class="card"><div class="t">وصفتك</div><div id="rx" class="muted">—</div></div>
<script>
const $=q=>document.querySelector(q[0]==='#'?q:'#'+q);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>(+n).toLocaleString('ar-EG');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const today=()=>new Date().toISOString().slice(0,10);
const TD=today();
const CHK={
 'مِطلع':()=>{const d=LS('mitla3',{}).days||{};return (d[TD]?.done||d[TD]?.nw>=3)?1:0},
 'مِجلس':()=>{const m=LS('majlis',{});return Object.values(m).reduce((a,b)=>a+b.length,0)>=3?1:0},
 'مِصباح':()=>(LS('misbah_'+TD,{}).n||0)>=3?1:0,
 'مِعتكف':()=>Math.round((LS('mi3tikaf',{})[TD]||0)/60)>=15?1:0,
 'مِعوَد':()=>(LS('mi3wad_done',{})[TD]||0)>=3?1:0,
 'مِسوَد':()=>(LS('miswad',{}).hist||[]).some(h=>h.at.slice(0,10)===TD)?1:0,
 'مِقتَحَم':()=>LS('miqtaham',{}).n>=1?1:0,
 'مِحفل':()=>LS('mihfil',{}).n>=3?1:0,
 'الإنجليزية':()=>Object.keys(LS('en_listen',{})).length>=1?1:0,
 'البرمجة':()=>Object.keys(LS('prog_v1',{})).length>=1?1:0,
};
const RX=[
 {n:'مِطلع — حديث اليوم',u:'../mitla3/',w:'لم تفتح مِطلع اليوم — حديث واحد يكفي'},
 {n:'مِصباح — ورد سريع',u:'../misbah/',w:'وردك اليومي صغير — ثلاثة أذكار تكفي'},
 {n:'مِجلس — صفحة قرآن',u:'../majlis/',w:'لم تقرأ اليوم — آية واحدة تكفي'},
 {n:'مِعتكف — ١٥ دقيقة',u:'../mi3tikaf/',w:'لم تعتكف — جلسة قصيرة'},
 {n:'مِعوَد — مراجعة',u:'../mi3wad/',w:'لم تراجع — ثلاث عناصر تكفي'},
 {n:'مِسوَد — مسوّدة',u:'../miswad/',w:'لم تكتب — خاطرة واحدة تكفي'},
 {n:'مِقتَحَم — ٦٠ ثانية',u:'../miqtaham/',w:'لم تلعب — جولة واحدة'},
 {n:'الإنجليزية — درس',u:'../english/',w:'لم تتمرن — جملة واحدة'},
 {n:'البرمجة — درس',u:'../prog/',w:'لم تتعلم — خطوة واحدة'},
];
const diag=[];let done=0,tot=0;
Object.entries(CHK).forEach(([n,f])=>{tot++;const v=f();done+=v;diag.push({n,v})});
const missing=RX.filter(r=>!diag.find(d=>d.n===r.n.split(' ')[0]&&d.v===1));
$('#diag').innerHTML=diag.map(d=>'<span class="stat" style="'+(d.v?'border-color:var(--acc)':'')+'">'+d.n+(d.v?' ✓':'')+'</span>').join('');
let vrd;
if(done>=tot-1)vrd='✓ يومك مكتمل تقريبًا — بارك الله فيك';
else if(done>=tot*0.7)vrd='يومك طيب — أتمم بقاياه';
else if(done>=tot*0.4)vrd='يومك نصفه — أنقذه الآن';
else if(done>=1)vrd='يومك بداية — ركّز على الأيسر';
else vrd='يومك لم يبدأ بعد — ابدأ الآن';
$('#vrd').textContent=vrd;
if(missing.length){
 const r=missing[Math.floor(Math.random()*missing.length)];
 $('#rx').innerHTML='<div class="rx"><div class="act">'+esc(r.n)+'</div><div class="why">'+esc(r.w)+'</div><div style="margin-top:9px"><a href="'+r.u+'" class="btn" style="text-decoration:none;display:inline-block">افتح وأنجز ←</a></div></div>';
}else $('#rx').innerHTML='✓ لا وصفة — يومك مكتمل، بارك الله فيك';
</script>
<script src="../shared/palette.js"></script>
<script src="../shared/feedback.js" data-pid="mislah" data-title="مِصلَح"></script>
</body>
</html>
